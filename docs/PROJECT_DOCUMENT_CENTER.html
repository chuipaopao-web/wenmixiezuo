近期一至三章详细章纲
        ↓
单章正文与真实结算</code></pre><p>远期只保留方向和接口，近期才细化。每完成一章以实际结算更新后续章纲；每完成一个事件以事件结算更新后续事件；每完成一卷以卷结算规划下一卷。</p><p>这不是限制AI只能执行计划。正文中的合理局部发挥属于自由区；可能显著改善故事但改变上层因果的偏离，保留为候选并显示影响，由作者决定修订上层规划还是回到原计划。</p><h2>11. 正文生产闭环 V2</h2><h3>11.1 生成</h3><ol><li>冻结卷纲、事件、事件章节链和当前章纲；</li><li>编译任务上下文和创作自由区；</li><li>当前活动写手生成完整草稿；</li><li>做结构、空输出、版本、来源和明显硬边界检查；</li><li>进入独立审查。</li></ol><p>正式正文逐章生成。上一章未定稿和结算，不启动下一章正式生成。禁止默认批量正式写章，也不默认两个写手串行重写整稿。</p><h3>11.2 审查</h3><p>当前产品配置的审查成员对同一不可变草稿独立工作：</p><ul><li>事实连续性：只判断可验证事实、设定、时间、状态、版本和来源；</li><li>文学人物：关注表达、人物声音、情绪、场景和机械感；</li><li>读者体验：关注代入、节奏、期待、厌烦点和下一章吸引力。</li></ul><p>岗位和模型映射由当前《AI成员系统》定义，本规范不冻结名字和人数。</p><p>硬事实错误必须处理；文学和体验意见由作者裁决。审查不得读取彼此结果后冒充独立意见，不得自动无限改稿；两轮后仍有分歧时展示给作者。</p><h3>11.3 定稿</h3><p>作者可直接编辑、要求定点重写、保留满意部分或确认。每次修改形成新不可变正文版本，旧版本可追溯，不静默覆盖。</p><h2>12. 结算闭环</h2><h3>12.1 章节结算</h3><p>从定稿正文提取本章实际因果、角色与关系变化、地点/道具/规则状态、开放或回收线索及正文来源。与章纲差异只用于调整后续，不把章纲补成事实。</p><h3>12.2 事件结算</h3><p>事件全部章节定稿后，聚合实际入口、行动、结果、代价、下一触发和状态变化，并对照事件大纲标记已实现、调整实现、未实现和新增结果。</p><h3>12.3 卷结算</h3><p>卷内事件全部结算后，聚合实际主线、人物变化、势力状态、重要收益与代价、开放线索和下一卷入口。下一卷必须引用真实卷结算，不能引用上一卷未写出的计划。</p><p>所有结算、正史更新、活动指针推进和下一步解锁必须事务化或具有可证明的原子补偿，禁止半结算。</p><h2>13. 创造性与人物保护</h2><h3>13.1 三类约束</h3><ul><li>硬底线：作者确认事实、活动版本、数据隔离、安全、版权来源、费用与不可逆操作；</li><li>当前任务约束：活动卷、事件和章纲中被确认的目标与边界；</li><li>软参考：内部叙事方法、节拍、题材惯例、作者灵感、风格倾向、审查建议和篇幅估计。</li></ul><p>只有硬底线和明确任务约束能够阻止正式提交。软参考不得自动升级为硬规则。</p><h3>13.2 正文自由区</h3><p>写手可以自由决定对白、动作、意象、环境、场景调度、局部反应和不改变关键因果的自然过渡。规则要求“方向可信”，不是“每句照纲执行”。</p><h3>13.3 人物连续性</h3><p>人物要保持可辨识声音、基于经历的动机和关系记忆，同时允许有因果依据的成长与反常。静态标签不能阻止成长，“成长”也不能掩盖无因漂移。</p><h2>14. 运行状态与恢复</h2><p>AI状态必须来自持久化任务、真实模型调用、工具事件和心跳，不用前端计时器或口头回复伪造。</p><p>核心任务至少具备：</p><ul><li>幂等键；</li><li>租约与心跳；</li><li>有界重试；</li><li>候选检查点；</li><li>取消栅栏和晚到结果隔离；</li><li>上游版本失效检测；</li><li>预算与调用记录；</li><li>Repository事务和恢复入口。</li></ul><p>不保存模型内部思维链，只保存任务步骤、依据、结论和结果。</p><h2>15. 质量诊断与非劣效</h2><p>质量维度只用于离线验收和故障诊断，可按变更影响选择：</p><ul><li>原创性；</li><li>合理惊喜；</li><li>人物可辨识度；</li><li>情绪力度；</li><li>因果自然度；</li><li>叙事清晰度；</li><li>检索锚定；</li><li>卷—事件—章方向一致性；</li><li>整体阅读质量；</li><li>作者选择与修改成本。</li></ul><p>任何检索、上下文、模板、提示词、生成或审查机制改变，都要相对现行基线或弱治理基线做与影响相称的非劣效测试。一致性变好不能抵消人物、惊喜和阅读质量显著下降。</p><h2>16. 工程证据门禁</h2><ul><li>E0：设计、Schema或代码存在；</li><li>E1：单元测试或确定性夹具通过；</li><li>E2：本地集成、迁移、恢复和界面流程通过；</li><li>E3：独立金标、对抗样本、真实模型多样本或盲评通过；</li><li>E4：真实长篇连续运行和纵向质量证据通过。</li></ul><p>固定同义词和连续五章不能证明长篇质量。任何声明必须说明样本、范围、基线、局限和证据等级。</p><h2>17. 必测清单</h2><ul><li>从开书到下一卷完整对象化流程，无聊天依赖；</li><li>作者原话在各节点原样保存且强度正确；</li><li>AI候选真实、独立、来源和模型如实显示；</li><li>作者选择、局部融合、编辑、退回、撤回和确认；</li><li>卷纲、事件、章纲和正文版本依赖及错版失效；</li><li>结构化、全文、语义、关系、时间/因果和原文回查；</li><li>跨书隔离、否定、别名、时间、因果、冲突和对抗查询；</li><li>正文单写手、三类独立审查和不可变定稿；</li><li>章节、事件和卷结算不受未实现计划污染；</li><li>超时、取消、重试、Worker崩溃、晚到结果和半结算恢复；</li><li>空库迁移、升级迁移、已有书籍读取、桌面启动和本地运行；</li><li>创造性、人物和整体阅读质量非劣效。</li></ul><h2>18. 停止与回滚</h2><p>发现跨书、正史污染、不可恢复覆盖、错版正文提交或结算污染时，立即停止正式提交并保留证据。</p><p>发现候选明显同质、人物可辨识度下降、模板化上升、检索挤占创作空间或作者操作负担显著增加时，停止扩大新机制，回滚相关提示词、ContextCompiler、检索或前端装配，不删除作者原话、规划版本、正文、正史、结算和调用证据。本地确定性生成只能作为显式E1/E2夹具，且边界覆盖设定、分卷、事件、章纲、正文、审查、灵感和续写分析；没有真实创作模型时必须在任务创建前阻断，不能用夹具完成作者创作链，更不能把流程跑通冒充文学质量通过。</p><p>分层创作停止条件必须由确定性规则给出可追溯标识，至少覆盖候选同质、作者负担增加、软参考变硬、计划污染事实、技术信息泄漏、上下文完整性失败、手机主操作不可达、旧前端不兼容、质量非劣效失败和跨书/不可变内容违规。回滚通过<code>layeredCreationWrites=read_only</code>或<code>WENMI_LAYERED_CREATION_WRITES=read_only</code>只阻断设定缺口、故事线程、卷/事件/章纲、设定基线和表达基线等新分层写入；所有读取和作者原话保存继续可用。进入只读前后必须逐项快照作者输入、定稿正文、结算、规划版本和模型调用证据，验证字节级不变。</p><p>真实长篇以20、50、100、200章为四道停止关。每道关都要通读故事本身并回查冻结的开书、分卷、事件和章纲版本；检查场景是否成立、人物是否主动、回报是否有因果与代价、配角和敌手是否拥有自己的判断、事实/数值/关系是否连续、前后章是否复用同一骨架。自动相似度、字数和审查结论只用于定位，不能替代连续阅读判断。失败后停止扩大并保留不可变失败版本，修复后以新版本继续。</p><h2>19. 规范与Skill治理</h2><p>本规范的实现约束由 <code>.agents/skills/wenmi-longform-quality/SKILL.md</code> 及其参考文件辅助审查。Skill更新不得静默改变当前产品工作流；重大变更必须先形成新决定和 <code>design_review_id</code>，再同步当前规格、代码和验收。</p><p>若Skill与老板最新决定、项目章程或当前工作流冲突，以更高权威为准并立即修订Skill。</p></template><template id="document-26" data-title="上下文、记忆与任务资料规范" data-path="docs/MEMORY.md" data-meta="当前正式文档 · 6.7 KB · acc4db380621"><h1>上下文、记忆与任务资料规范</h1><h2>1. 原则</h2><p>上下文由确定性 ContextCompiler 按任务编译，不由拟人成员自由访问全库。越往下游越压缩上层信息，但上层硬约束必须完整保留；当前任务对象使用完整版本。其他书、旧聊天、过期版本、无关候选、全文堆叠和无依据猜测始终排除。</p><h2>2. 权威层</h2><ol><li>作者原始输入与不可变导入原件。</li><li>作者确认的开书、设定和活动规划版本。</li><li>定稿正文与章节/事件/卷结算形成的正史事实。</li><li>摘要、Wiki、图谱、全文和向量投影。</li></ol><p>低层不能推翻高层。摘要只导航，事实争议回查正式源。</p><h2>3. 任务上下文矩阵</h2><div class="table-scroll"><table><thead><tr><th>任务</th><th>必须接收</th><th>必须排除</th></tr></thead><tbody><tr><td>开书</td><td>作者填写的全部开书信息、附件和明确约束</td><td>其他书、聊天、AI猜测</td></tr><tr><td>设定方案</td><td>完整开书信息、当前设定项、核心人物/读者承诺/作者禁区、与本项存在直接依赖的已确认设定、作者本项原话；融合额外接收作者选中方案的规则骨架并保留原方案ID回查</td><td>无关已确认设定、方案的重复解释与未选备选、无关正文、其他书、未确认候选</td></tr><tr><td>分卷</td><td>无损压缩后的完整开书与设定、上一卷正式结算、当前角色状态、节奏选择、作者卷想法</td><td>旧卷候选、无关细节、聊天历史</td></tr><tr><td>事件链</td><td>压缩开书/设定、完整活动卷纲、模板与作者想法</td><td>其他卷未来猜测、过期卷纲</td></tr><tr><td>事件大纲</td><td>压缩开书/设定/卷纲、完整事件链和当前事件卡、上一事件结果、作者本事件想法、触发伏笔</td><td>其他事件草案、无关人物全集</td></tr><tr><td>章纲</td><td>压缩上层信息、完整事件链、完整当前事件大纲、上一章链状态、作者章纲想法</td><td>越过当前事件的自由扩写</td></tr><tr><td>章纲挑战</td><td>与主方案相同的冻结上游、精确目标候选版本和作者本次关注点</td><td>其他候选、其他事件全文、聊天、审查报告、未摘录灵感；挑战意见不自动进入后续资料包</td></tr><tr><td>正文</td><td>压缩卷纲、事件链和事件大纲、完整当前章纲、最近正式正文/结算、触发实体与声音证据、作者本章意见</td><td>全书全文、其他候选、其他书</td></tr><tr><td>事实审查</td><td>当前正文、冻结上游版本、命中设定/事实/时间/伏笔原文</td><td>文学和体验报告</td></tr><tr><td>文学审查</td><td>当前完整正文、章纲、表达基线、必要相邻正文</td><td>事实席或体验席报告</td></tr><tr><td>体验审查</td><td>当前完整正文、目标读者、章纲目标、必要前章</td><td>其他审查报告</td></tr><tr><td>结算</td><td>定稿正文、冻结章纲、已有正史、当前事件/卷目标</td><td>草稿和未确认建议</td></tr></tbody></table></div><h2>4. 压缩规则</h2><p>压缩不是删掉上层规则。必须保留：身份、目标、因果、时间、能力上限、关系、禁区、未回收伏笔、卷目标、当前事件结果和作者必须项。可压缩：重复解释、已回收低优先细节、无关场景描写和未采用候选。</p><p>每份压缩物保存来源列表、版本、内容哈希、生成策略和可回查位置。长度由任务预算和证据密度决定，不使用固定“最近5章后遗忘”规则。</p><p>资料包去重分两层执行。完全相同的内容只保留一份；某个活动章纲、前章正文或其他权威对象已经以完整版本进入硬来源时，同一对象、同一版本的尾段、摘要和检索切片不再重复注入。只有切片包含完整来源没有覆盖的独立内容，或完整来源根本未进入资料包时，才保留该切片。所有排除项继续记录来源、版本和排除理由，去重不能变成静默丢证据。</p><h2>5. 检索触发</h2><p>实体、别名、规则、物品、地点、时间、因果、伏笔、人物声音或冲突信号出现时，先结构化直达，再结合FTS、向量、关系和时间过滤。高风险事实至少回查一段正式原文。低相关结果不因相似度分数高就自动注入。</p><h2>6. 写入与结算</h2><p>模型输出默认是候选。只有作者确认资料和定稿正文结算可以更新正式状态。章节结算按正文实际内容检查人物、势力、地点、道具/资源、规则、事件、人物变化、关系、时间、伏笔和摘要；存在且对后续有价值时追加，不存在时保持空结果，不为分类覆盖编造。事件/卷结算聚合实际结果并记录计划偏差。投影异步重建，失败不能污染正式源。</p><h2>7. 续写</h2><p>导入全文保存在不可变原件和章节版本中。反向拆解结果带来源，仅作为待确认派生资料。续写任务按实体和当前目标回查旧文，不把整本全文塞入每次模型调用。</p><h2>8. 验收</h2><p>上下文测试至少覆盖跨书隔离、版本失效、硬约束位置、长输入预算、对抗检索、来源回查、摘要消融、同源全文覆盖切片、只有切片时不误删独立证据、人物声音和连续多章漂移。召回提高不能以原创性、人物可辨识度或整体阅读质量下降为代价。</p><h2>9. 题材无关的资料沉淀</h2><p>事实审查和章节结算不得依赖某一本样稿的人名、道具或题材关键词。每个题材都按当前正文实际出现的实体、行动、关系、时间、状态和规则生成候选；没有持久事实时返回空候选并说明原因，不能补造。</p><p>进入正式资料的候选必须同时满足：</p><ol><li>绑定当前书、来源章节和不可变定稿正文版本；</li><li>证据原句能在该正文中逐字回查，不能使用模型摘要代替；</li><li>实体、关系目标、时间和知情状态在当前书内可解析；</li><li>章节结算或带来源的作者修订明确激活，未确认候选不进入正史；</li><li>图谱、时间线、人物状态和检索投影能删除重建，不能反向修改正文。</li></ol><p>历史章节需要补建结构化资料时，不修改原正文、旧结算或旧正史修订；先在数据库副本验证来源和幂等，再创建可追溯的纠错修订，重建投影并完成跨书检查。</p><p>验收不能只数全文切片、实体总数或情绪投影；还要分别检查主角状态与历史、配角、势力、地点、世界路线图、道具/资源、生效规则、聚合事件时间线、正式事实、人物关系、来源回查和作者界面的自然语言显示。设定来源不得重复冒充分类正式资料；人物每章出现不得冒充事件。类型档案要验证字段与来源的语义匹配：配角年龄/性格/门派/装备、势力规模/实力/驻地、道具属性/归属、地图节点/路线和时间线的时间/章节都只能来自本书权威源。某分类确有证据却显示空白，或没有证据却被猜测填充，均视为资料沉淀或展示适配失败。</p></template><template id="document-27" data-title="产品规格" data-path="docs/PRODUCT.md" data-meta="当前正式文档 · 16.7 KB · d3180563e25e"><h1>产品规格</h1><h2>1. 产品定位</h2><p>文秘写作是面向长篇网文作者、使用统一账号体系的 AI 协作创作台。AI 模拟专业主创团队，但作者始终拥有最终选择、编辑、确认和定稿权。</p><h2>2. 信息架构</h2><h3>统一账号与管理后台</h3><p>本机测试与未来公网版本使用同一套账号。当前采用最短可用路径：邮箱、密码和昵称注册；邮箱与密码登录；退出立即撤销当前会话。首个成功注册的账号自动成为管理员，并复用、接管账号体系启用前的本机老板数据；后续账号为普通用户，每个账号获得全新的独立数据空间。密码只保存带独立盐值的高成本摘要，浏览器只保存 HttpOnly 会话 Cookie，服务端数据库只保存会话令牌摘要。</p><p>登录页不显示创作台数据。登录后左侧只列出当前账号的书籍，所有接口从会话派生 <code>owner_id</code>，不接受客户端自行指定所有者。管理员可查看总用户数、启用/暂停数量、已注册账号名下的用户书籍总数和用户列表，并可暂停或恢复普通账号；不能暂停自己或最后一个可用管理员。</p><p>手机号和微信登录不与首发邮箱登录混在同一开发门槛内。它们需要短信供应商或微信开放平台资质、回调域名、费用和真实凭证，后续通过独立身份绑定表接入，不能新建第二套用户数据或造成同一人多份书籍。公开运营前还必须完成邮箱验证/找回密码、注册和登录限流、HTTPS反向代理、隐私政策、用户协议、数据删除与备份恢复验收。</p><h3>创作台</h3><p>未登录时只显示统一登录/注册页；登录后进入创作台。当前实现提供书籍切换、创作阶段导航和中心工作区，但这些是可持续迭代的实现，不冻结左栏宽度、封面尺寸、导航数量、页面卡片或视觉风格。</p><p>信息架构必须保持四个结果：当前账号/书籍归属清楚，当前创作对象清楚，AI或作者任务状态清楚，下一步和恢复动作清楚。桌面可以使用侧栏、临时双栏比较和上下文面板；手机应转换为抽屉、分段页或全页编辑，不能机械缩小桌面多栏。</p><p>主流程围绕信息、非剧情设定、分卷方向、事件与章纲、正文和结算逐层展开；资料库、取名、团队、任务、灵感和设置是按需辅助能力。导航名称、分组和位置可以在不丢对象、不破坏旧数据的前提下继续重设计。书名原样保存；显示截断只影响视觉和可访问名称，不批量回写作者数据。</p><p>资料库按语义分层：设定来源页集中查看作者已确认设定；配角、势力、地点、地图、道具资源和生效规则分别展示正文结算或明确规则事实形成的正式资料，不重复铺设设定卡。主角独立使用实时面板，显示当前境界/等级、属性、技能、道具装备、资源及获得、消耗或失去的章节历史。配角卡默认只显示姓名和一条首次出场，展开后按来源查看身份、年龄、性格、门派/组织、境界、实力、属性、装备、关系和出场记录。势力查看人数规模、实力等级、驻地和地位；道具资源查看属性、效果、数量、归属与流转。地点查看单点资料，地图按正文到达顺序显示从出生地或首个正式场景开始的世界路线，不虚构坐标和方位。事件时间线只显示故事时间或章节范围加事件名；没有日期时用章节代替，不把人物每章出场、规划说明或结算长文当成时间线。规划对象不能冒充已经发生的资料，确实没有正式来源时才显示空状态。</p><p>当前视觉以安静、耐读、中心内容优先为目标。现有颜色和组件可作为过渡，不构成固定品牌规范；后续整体重设计应统一设计token、字号、间距、状态和响应式，而不是在旧页面继续叠加卡片、边框与说明。</p><p>手机端把浏览器真实可视高度作为应用壳高度。输入法弹出或收起时，当前输入控件自动滚入可见区域，保存、生成、融合、确认等主操作仍可通过页面内容区滚动到达；不得用隐藏业务功能换取适配。</p><h3>作者界面信息洁净</h3><p>主导航负责功能定位，具体形态可随整体信息架构调整。中心页不重复无用标题、宣传式副标题或常驻使用介绍；对象名称、真实进度、错误、影响和待作者选择的内容按实际需要显示。同一含义只保留一次，并优先放在最接近操作的位置。</p><p>创作页面只显示自然语言进度，例如“正在整理本书资料”“编剧正在构思”“方案已准备好”“已保留当前进度”。任务ID、内部状态/阶段键、检查点、ContextPack、哈希、JSON、SQL、Worker、SSE、原始供应商路径和模型内部ID只留在管理员后台审计与模型管理，不进入普通创作页面。静态说明仅在首次空状态、危险操作或容易误解的决定点按需出现。</p><h3>作者展示大白话门禁</h3><p>作者展示层设置统一大白话门禁。动态字段、成员状态、任务进度和错误进入页面前先翻译；内部编号、机器枚举、技术路径和协议字段不能原样显示。小说梗概、章纲叙述、正文和作者原话属于语义保护区，不做可能改变情节含义的机械替词；若故事文本混入资料核对、正史、结算、质量规则、测试说明或系统工作方式，页面停止裸露并提供重新生成或修改入口，不能把内部说明翻译后继续当小说。后台原件和失败证据保持不变。</p><p>门禁同时位于网络响应和组件显示两层。当前作者请求只接收洁净业务投影，失败只显示“发生了什么、资料是否保留、下一步怎么恢复”和不透明恢复编号；任务阶段、供应商、模型、方法、SQL、路径、堆栈和原始错误码仅管理员审计可见。旧缓存前端继续能调用新后端，但也不能获得真实内部供应商、模型和错误详情。</p><h3>AI 状态</h3><p>团队工作区显示全部14名创作成员的真实状态、当前任务、公开上下文摘要、输出摘要、耗时和失败/重试情况，不向普通作者显示模型供应商或内部绑定。模型管理只在管理员后台。小文秘书只显示确定性工具、导航和故障回执，不冒充创作成员。</p><h3>灵感</h3><p>灵感是与正式生产隔离的多成员讨论室。作者可选择1—3名讨论分身围绕当前书交流；讨论分身只读取本书已确认资料和作者本轮问题，不读取其他书，不执行设定、卷纲、事件、章纲、正文、正史或结算写入。讨论内容默认不进入ContextCompiler。作者点击“摘录为灵感”并选择具体业务对象后，摘录才作为带来源的作者原话进入正式流程。</p><h2>3. 开书</h2><p>作者填写并可修改：书名、频道与分类、融合题材、初始角色、必须遵守、金手指或特殊机制、开篇信息及其他自定义想法。书籍简介不在开书时采集：第一卷方案确认后，作者可在书名和书籍简介旁点“主编设计”，由主编依据第一卷故事、已确认设定和开书信息一次设计多套候选，作者选一套直接采用；第一卷未确认时提示先完成第一卷设计。主角性格按外在气质、思考决策、核心驱动力、人际模式、压力反应、道德边界与矛盾成长面分类，并允许自定义。开书任务只接收本书完整开书资料，排除其他书、未摘录灵感和模型猜测。</p><p>创建成功后生成书籍、定位版本、当前团队实例、模型绑定、预算和设定工作区；任何一步失败都不得留下半本书。成功后由作者选择设定项并主动开始AI设计，不自动启动长任务。</p><h2>4. 设定</h2><p>设定只负责书籍骨架，不提前代写卷剧情。四项核心设定固定为“故事舞台”“主角底板”“规则与代价”“边界与留白”；它们始终完整进入后续创作资料包。长期吸引力、力量/成长、势力、角色、资源、冲突方式等按题材和作者需要作为可选项推荐，不因多选就全部挤进每次模型调用。</p><p>设定阶段只读取开书信息、当前项、已确认前置设定和作者本项原话，不读取其他书、未摘录灵感、无关正文或未确认猜测。页面先显示“召集成员讨论”空状态；启动后显示每名参与成员的真实状态、任务、上下文摘要和输出摘要，方案返回后才显示方案卡。作者补充与修改输入默认折叠，按需展开。整份活动设定确认后才解锁分卷。</p><p>当前项由主编和两位编剧独立给出方案。作者可整份选择，也可只摘取多个方案中的片段，和自己的文字一起组成待确认稿；选择按方案稳定ID保存，重新排序或刷新不能错选。普通作者响应不暴露供应商、模型内部ID、任务ID、讨论记录ID或决策ID。</p><h2>5. 分卷</h2><p>作者填写或调整卷名、目标体量、卷目标、卷末状态、节奏偏好和自定义想法。主编组织两位异模型编剧独立设计，作者比较后选择、融合和编辑。</p><p>作者不先选择“三幕式”“五幕式”“猫咪写作法”等专业模板。系统在后台根据本书资料组合适合当前卷的叙事方法，每次至少给出两条真正不同的具体路线；前端只说明“主角为什么行动、局势怎样升级、关键选择与代价、高潮怎样解决、卷末留下什么”，并同时展示每条路线的收益、风险和后续影响。作者可选一条、逐项修改、融合或从空白稿开始。</p><p>第一卷额外生成开篇兑现计划：前500字必须发生可感知变化并建立困境、欲望或异常；前三章分别完成抓住读者、首次兑现并扩大冲突、解决一个小问题并打开更大目标；首个约10万字范围内或第一卷结束前必须完成一次改变局面的重大高潮。它们是针对本书的职责与兑现点，不是固定爽点间隔，也不要求每章机械打脸。</p><p>卷方案同时维护“全书故事脊柱”：长期欲望、核心压力、重大转向、长期兑现和允许探索的空白。它只负责让各卷一环扣一环，不提前填满事件和章节。后续卷读取上一卷真实结算、人物关系、开放问题、未兑现承诺和新局势，再重新生成两条具体路线，不能用上一卷计划冒充已经发生。</p><p>活动卷纲是当前卷未来创作的上层规划权威，不是已发生正史。</p><h2>6. 事件链与事件大纲</h2><p>系统把当前卷拆成有因果衔接的事件链。每个事件至少记录进入时的主角与局面状态、触发条件、目标、阻力、关键选择与代价、事件结果、人物与关系变化、结尾钩子、下一事件接口、预计章数和对应卷任务。事件之间必须形成“上一事件实际结果 → 主角与局面新状态 → 无法回避的新问题 → 主角选择与代价 → 本事件结果 → 下一事件接口”。作者界面默认把同一组正式字段即时呈现为故事动脉与预告卡，明确区分“已经发生”和“预计承接”；不另存第二份摘要。作者可切换细节视图，并移动、插入、拆分、合并和编辑事件。</p><p>选中事件后，编剧在完整事件链和活动卷纲约束下独立设计事件大纲。作者可以不选，或单选一种最想要的阅读感受，如扬眉吐气、细思极恐、关系震荡、意外反转，也可输入自己的话；一次不拼接多套完整节拍，避免要求互相争夺注意力。事件大纲必须说明起因、升级、关键转折、高潮、选择代价、实际可达结果和下一事件接口，但软参考不是硬公式。故事类摘要使用具体行动、选择困境和结果变化表达，不强迫每段套用固定悬念句式。</p><h2>7. 当前事件章纲</h2><p>系统先评估完整事件大纲需要的章节数和总字数，再由指定编剧拆成连续章链并细化单章。每章包含标题、目标字数、开头抓力、场景节拍、信息变化、人物选择、情绪变化、结尾钩子和作者指导意见。</p><p>作者可选“请另一位编剧看看”，让另一位异模型编剧只挑战当前章链候选或单章章纲的关键转折、核心冲突、选择代价与结尾钩子。页面至多显示3条替代思路及其收益、代价和后续影响；不自动融合、不自动采纳，也不产生第二份正式方案。</p><p>章纲读取分层资料包：四项核心设定全文、与本事件相关的可选设定全文、其余设定目录，完整活动卷纲、事件链、当前事件大纲和上一真实结果；挑战任务还冻结当前主方案的精确版本。任何任务都不得越过事件边界擅自规划其他事件。</p><p>第一卷前三章的章纲自动承接已确认的黄金三章职责；第一章还必须把前500字目标翻译为可执行的场景动作、信息变化和章末期待。正文只执行本章职责，不重新发明卷路线。</p><h2>8. 单章正文</h2><p>一次只正式生产当前最前的一章。单一活动写手根据完整章纲创作正文，可在不破坏上层约束的前提下自由处理对话、动作、描写、节奏和细节。正式正文必须是小说场景，不得夹带系统如何核对资料、维护正史、执行结算或评价质量的说明；题材面板和状态信息按当前场景需要自然出现，不要求每章重复完整清单。没有可用创作模型时任务诚实阻断，不自动退回本地验收夹具。</p><p>正文完成后，事实、文学、体验三席使用三种独立模型并行审查：</p><ul><li>事实席只核对设定、人物状态、时间、因果、战力、伏笔和来源。</li><li>文学席关注语言、场景、节奏、重复、人物声音和情绪力度。</li><li>体验席模拟目标读者，判断代入、期待、爽点、困惑和弃读风险。</li></ul><p>三席互不读取报告。作者可直接编辑或要求定点修订；确认后生成不可变定稿版本。</p><h2>9. 结算与下一卷</h2><p>章节结算只根据定稿正文更新事实、人物状态、关系、时间、伏笔、摘要和检索投影。事件完成后比较计划与实际，记录结果、代价、未解决问题和下一事件触发。卷完成后生成卷总结、遗留伏笔和主角当前状态；下一卷用该真实结算生成新的具体路线，不用上一卷计划预测替代实际结果。</p><h2>10. 续写与反向拆解</h2><p>作者可以导入已有正文。系统先解析章节、建立不可变原文和来源，再反向识别已发生设定、人物状态、事件、卷结构和开放问题。分析是带来源的派生候选，不能覆盖原文或冒充作者确认；补齐缺口后进入当前卷—事件流程。</p><h2>11. 模板与作者想法</h2><p>所有叙事方法、节拍和阅读感受都是软参考。作者原话按业务对象保存，并区分：必须、强偏好、灵感、问题。AI 可以提出有代价的替代方案，但不得静默违反“必须”，也不得把灵感自动升级为设定或正史。</p><p>题材、内部方法库和书况可以影响节奏快慢、兑现偏好、关系权重、悬念与反转倾向，但不得形成“每隔若干章一个爽点”“每个事件必须反转”或“固定打脸间隔”等生产公式。后端内部方法库统一提供版本和内容哈希，每个规划版本保存生成时的方法快照；规则更新只能发布新版本，不能原地改写已确认规划。</p><p>ContextCompiler为每份资料标注硬事实、当前任务、软参考或创作空白，并区分计划、确认和实际。硬事实和当前任务不做字符截断；预算不足时先删重复和低相关软资料，仍不足则明确阻断，不能静默丢掉人物、代价、伏笔或因果链。摘要只负责导航，争议必须回查正式源。</p><h2>12. 数据与安全</h2><p>每本书严格隔离。SQLite 正式对象和不可变文件是权威源；全文、向量、图谱、Wiki、摘要均可重建。普通删除为归档，永久删除作者数据需要强确认。来源、原创性、研究与安全检查保留为后台生产门禁，不设置独立页面。</p><h2>创作模型未连接时的作者体验</h2><p>没有可用创作模型时，作者仍可登录、切换书籍、查看和编辑已有设定/规划/章纲/正文、管理资料与导入原文；所有需要AI的入口在任务创建前暂停，并只显示“创作模型尚未连接”和下一步操作。前端不得展示<code>local-deterministic</code>、<code>wenmi-fixture</code>、模型路径、任务ID、ContextPack哈希或测试模板内容，也不得让成员卡片伪装为工作中。</p><p>旧不可变正文如果含内部检查说明、机器载荷或明显技术泄漏，默认显示质量提示而不是直接当小说展开；作者可主动查看历史原稿，原数据不删除。新生成正文必须是故事本身，面板、资源、装备和规则只在人物行动需要时自然出现。</p></template><template id="document-28" data-title="项目总章程" data-path="docs/PROJECT_CHARTER.md" data-meta="当前正式文档 · 3.7 KB · 4c68e6a4ed89"><h1>项目总章程</h1><h2>产品使命</h2><p>帮助作者逐层完成长篇小说：系统准备资料、提出可选方案、辅助规划和写作、核对事实并结算实际状态；作者始终保有选择、修改、留白和最终确认权。质量提升不能把作品压成固定公式。</p><h2>主流程</h2><pre class="code-block"><code data-language="text">开书信息 → 非剧情设定 → 分卷方向 → 当前卷事件链 → 当前事件大纲
→ 完整章链与近期详细章纲 → 单章正文 → 章节/事件/卷结算 → 下一卷</code></pre><p>已有正文导入和反向拆解是兼容入口，原文不可覆盖；分析结果带来源，并回到同一对象链继续创作。</p><h2>分层职责</h2><ul><li>开书信息：题材、读者、风格等基础方向。</li><li>设定：世界舞台、主角底板、规则与代价、边界与留白等非剧情骨架；扩展项按需补。</li><li>卷方向：本卷大故事方向、主要变化、重点表达和卷末新局面。</li><li>事件链/事件大纲：卷内因果结构和可独立成立的小故事。</li><li>章链/详细章纲：完整章序列与最近章节的场景、情绪、信息、动作和接口。</li><li>正文：在当前章任务内自由表达。</li><li>结算：只记录正文真实发生的结果，并向后续规划反馈。</li></ul><p>规划描述未来，结算记录实际；上游确认版本改变时，下游候选必须失效、重编译或重新确认。</p><h2>创作合同</h2><ul><li>作者可见内容全部用大白话，软参考可不用、混合、重排或自定义。</li><li>专业叙事方法只在后台帮助生成有实质差异的具体路线，不在普通作者页面泄漏方法名。</li><li>首卷负责前500字兴趣、黄金三章追读和约10万有效正文字符内（或短卷卷末）重大高潮的故事职责；效果是硬目标，打法保持开放。</li><li>ContextCompiler区分硬事实、当前任务、软参考和创作空白；计划不能冒充事实，摘要和检索投影不能覆盖正式源。</li><li>创作团队的当前人数、岗位与模型绑定由产品规格和运行配置决定，规则文件不冻结界面呈现。</li></ul><h2>产品与界面</h2><p>产品仍在快速完善。左侧书籍切换、顶部功能导航和现有视觉语言只是当前实现，不是不可修改的章程。UI/UX 可以持续重构，只需保持书籍归属清楚、当前任务明确、作者数据不丢、旧内容可读，并优先保证手机端可操作。</p><p>每个页面优先回答三件事：我现在在哪里、系统正在做什么、下一步能做什么。表单按需展开，不要求作者一次填完未来层级；AI在作者需要选择或生成下一层时介入，不提前替作者锁死剧情。</p><h2>权威与版本</h2><p>作者确认的开书资料、设定、规划版本、原话和不可变正文是正式来源。SQLite正式对象与不可变原文是权威源；全文、向量、图谱、Wiki和摘要是可重建投影，事实争议必须回查正式源。</p><h2>基础安全</h2><ul><li>每个业务请求从已验证会话取得 <code>owner_id</code>，核心对象同时携带 <code>book_id</code>，禁止跨用户、跨书污染。</li><li>正文使用不可变完整版本；修改产生新版本。</li><li>API Key 只从环境变量读取，不进入数据库、日志、上下文、备份、导出或 Git。</li><li>普通删除为归档；永久删除作者数据需影响预览、<code>YES</code> 和二次确认。</li><li>不保存或展示思维链；只保存任务、来源、结论、预算和调用证据。</li><li>同模型不得冒充异模型独立意见，任务状态必须来自真实任务/心跳/调用事件。</li></ul><h2>成功定义</h2><p>作者能在手机或桌面上从开书连续推进到卷、事件、章纲和正文；每一步负担可控、状态可理解、失败可恢复。系统能长期衔接事实和规划，跨书隔离，可追溯，并保持原创性、人物生命力、情绪力度和整体阅读质量。</p></template><template id="document-29" data-title="AI成员完整工作手册（当前实际运行版）" data-path="docs/ROLE_PROMPTS.md" data-meta="当前正式文档 · 29.4 KB · 3bfac0737634"><h1>AI成员完整工作手册（当前实际运行版）</h1><blockquote>本文把文秘写作14名创作成员的职责、介入节点、资料包、工作方法、输出规则、独立设计、融合、压缩、审查、重试和作者控制权整理在同一处。它描述当前代码实际采用的运行方式，不是理想化岗位介绍。</blockquote><h2>1. 基本概念</h2><h3>1.1 “思考规则”不等于隐藏思维链</h3><p>系统不会保存、展示或要求模型输出内部思维链。本文所说的“思考规则”，是作者可以检查和调整的外部工作方法：</p><ol><li>核对正式事实与作者偏好；</li><li>确认本次任务允许改变哪一层；</li><li>按规定顺序完成设计或审查；</li><li>按输出合同提交结果；</li><li>无依据内容标成不确定；</li><li>结论能回到当前书、对象和版本。</li></ol><p>系统只保存任务输入快照、资料包清单、提示词版本、模型结果、结构化报告和作者选择，不保存模型隐藏推理。</p><h3>1.2 资料包大小和输出字数不同</h3><ul><li><strong>输入Token上限</strong>：本次发给模型的资料容量上限。</li><li><strong>输入字符上限</strong>：资料包文本字符上限。</li><li><strong>输出Token上限</strong>：模型本次最多返回的容量。</li><li><strong>正文有效字数</strong>：真正验收的中文、英文和数字有效字符。</li><li>预算是上限，不代表每次塞满；实际使用量由任务快照记录。</li></ul><h3>1.3 三类资料严格分开</h3><ol><li><strong>必须读取</strong>：开书信息、活动设定、活动卷纲、当前事件、当前章纲、作者明确要求等直接依据。</li><li><strong>按需检索</strong>：与人物、地点、道具、伏笔、时间和因果相关的正式资料及原文证据。</li><li><strong>禁止混入</strong>：其他书、未摘录灵感聊天、过期候选、被替换版本、无关全文、AI猜测和其他审查员报告。</li></ol><p>必须资料超预算时应停止并重新整理，不得悄悄删掉硬约束。可选资料按优先级取舍，并记录未纳入项目及原因。</p><h2>2. 一次AI任务怎样运行</h2><pre class="code-block"><code data-language="text">作者触发任务
→ 冻结当前书、业务对象和活动版本
→ 确认成员、模型和输出合同
→ ContextCompiler编译必须资料与按需资料
→ 生成可追溯ContextPack
→ 编译岗位提示词、任务提示词和输出规则
→ 调用模型
→ 校验身份、格式、来源、字数和业务边界
→ 保存候选或审查报告
→ 作者选择、融合、修改或确认
→ 只有确认版本才能成为下游正式依据</code></pre><h3>2.1 任务冻结内容</h3><ul><li><code>owner_id</code>、<code>book_id</code>；</li><li>开书、设定、卷、事件、章纲、正文活动版本；</li><li>岗位与模型绑定快照；</li><li>提示词模板版本；</li><li>资料包、未纳入资料及原因；</li><li>输入与输出预算；</li><li>上游工作流指纹。</li></ul><p>生成期间上游正式版本变化时，旧结果不能覆盖新版本，只能作为过期候选重新生成或重新确认。</p><h3>2.2 提示词组成</h3><ol><li><strong>岗位合同</strong>：身份、擅长、职责、边界和工作方法；</li><li><strong>全局硬规则</strong>：只处理当前书；不展示思维链；不伪造来源、状态或异模型意见；候选不自动成为正史；保护人物生命力和合理惊喜；</li><li><strong>任务说明</strong>：本次节点与目标；</li><li><strong>输出合同</strong>：字段、长度和合法值；</li><li><strong>本书岗位补充要求</strong>：团队页可为每本书的每位成员保存最多4000字补充要求，版本化保存，不能覆盖系统硬规则；</li><li><strong>冻结资料包</strong>：正式资料和按需证据；</li><li><strong>技术修复提示</strong>：只修格式，不借机改变创意。</li></ol><p>提示词模板按内容生成指纹和不可变快照。模板改变生成新版本，旧版本保留追溯。</p><blockquote>“岗位补充要求保存成功”只表示配置已版本化。验收某次任务还要查看调用快照，确认补充要求确实进入了该次提示词。</blockquote><h3>2.3 压缩与整理</h3><ol><li><strong>上游定长整理</strong>：开书、设定、上一卷或上一事件结算整理为任务摘要；</li><li><strong>正文专用胶囊</strong>：只拿完整本章章纲、最近状态、前章尾部、承诺与风格胶囊；</li><li><strong>检索证据块</strong>：按任务检索实体、伏笔、时间、因果和原文；</li><li><strong>预算裁剪</strong>：硬资料不静默裁剪；可选资料按优先级、重复度和预算纳入，排除有记录。</li></ol><p>Token估算对中文字符按约1 Token、其他字符按约0.25 Token计算，仅用于预算，不等于厂商最终计费。</p><h2>3. 全流程介入图</h2><pre class="code-block"><code data-language="text">开书信息（作者填写）
→ 设定小组独立提案 → 主编融合 → 作者逐项确认
→ 编剧A/B独立卷纲 → 主编融合 → 作者确认
→ 编剧A/B独立事件 → 主编融合 → 作者确认
→ 指定编剧拆事件章节序列；作者可选红玉或幼薇挑战关键节点 → 作者确认
→ 指定编剧逐章细化章纲；作者可选红玉或幼薇挑战钩子或冲突 → 作者确认
→ 单一主笔写正文；两次明确技术失败后副笔最多接管一次
→ 确定性代码硬检查
→ 事实 + 文学 + 体验三席审查并行、互不偷看（挑剔读者退出固定席，正文页可单独点&quot;请挑剔读者找茬&quot;）
→ 主编汇总分歧 → 必要时主笔定点修改 → 作者定稿
→ 章节结算 → 事件结算 → 卷结算 → 下一卷</code></pre><p>开书信息不靠AI猜测。结算只记录正式正文实际发生的内容，不能把未来规划倒灌为正史。</p><h2>4. 节点资料包与输出上限</h2><p>各节点的可见输出上限与思考预算只有一份权威取值表：<code>docs/AGENT_SYSTEM.md</code> 第 8 节（含不变量：max_tokens＝可见输出上限＋16,000 思考预算，八处预算冻结同步追加）。本表不再复制输出数值，只记录各节点的资料包规模与机制分工；实际使用量以调用快照为准。</p><div class="table-scroll"><table><thead><tr><th>节点</th><th>参与成员</th><th>输入Token</th><th>输入字符</th><th>按需检索</th><th>当前机制</th></tr></thead><tbody><tr><td>开书</td><td>无AI必需介入</td><td>—</td><td>作者总输入约18000字以内</td><td>0</td><td>作者填写</td></tr><tr><td>单项设定候选</td><td>设定小组候选成员</td><td>8000</td><td>动态</td><td>最多9组</td><td>候选互不读取；建议通常200—400字</td></tr><tr><td>设定融合</td><td>指定主编/编辑</td><td>7200</td><td>动态</td><td>最多12组</td><td>读取候选、作者选择和当前依据</td></tr><tr><td>卷纲独立方案</td><td>编剧A、B</td><td>24000</td><td>58000</td><td>每人最多9组</td><td>两案并行独立</td></tr><tr><td>卷纲融合</td><td>主编</td><td>32000</td><td>76000</td><td>最多12组</td><td>对比融合，不机械平均</td></tr><tr><td>事件独立方案</td><td>编剧A、B</td><td>18000</td><td>42000</td><td>每人最多7组</td><td>两案并行独立</td></tr><tr><td>事件融合</td><td>主编</td><td>24000</td><td>56000</td><td>最多10组</td><td>保留强因果和真实分歧</td></tr><tr><td>事件章节序列</td><td>指定编剧</td><td>16000</td><td>36000</td><td>当前不额外RAG</td><td>判断章数并拆分连续章节</td></tr><tr><td>章链挑战</td><td>作者指定的另一位异模型编剧（红玉或幼薇）</td><td>12000</td><td>28000</td><td>当前不额外RAG</td><td>读取精确章链候选，最多3条关键替代建议</td></tr><tr><td>单章章纲</td><td>指定编剧</td><td>22000</td><td>50000</td><td>当前不额外RAG</td><td>读取完整事件和确认序列</td></tr><tr><td>单章挑战</td><td>作者指定的另一位异模型编剧（红玉或幼薇）</td><td>14000</td><td>32000</td><td>当前不额外RAG</td><td>读取精确单章候选，最多3条钩子/冲突替代建议</td></tr><tr><td>正文初稿</td><td>活动主笔</td><td>4800</td><td>4800</td><td>硬证据最多4组、可选最多6组</td><td>目标2700—3200有效字；硬范围2350—3650</td></tr><tr><td>整章重写</td><td>活动主笔</td><td>9000</td><td>9000</td><td>动态</td><td>保留作者指令和当前正文</td></tr><tr><td>事实审查</td><td>事实职责成员</td><td>15000</td><td>15000</td><td>最多8组</td><td>先字段事实，再因果和认知边界</td></tr><tr><td>文学审查</td><td>文学审查</td><td>8500</td><td>8500</td><td>最多6组</td><td>只审文学表达</td></tr><tr><td>体验审查</td><td>体验审查</td><td>8500</td><td>8500</td><td>最多6组</td><td>按阅读顺序检查体验</td></tr><tr><td>挑剔读者找茬</td><td>妙玉（按需，不进固定审校席）</td><td>8500</td><td>8500</td><td>最多6组</td><td>找毒点、弃读风险和逻辑吐槽；结果只供参考不卡定稿</td></tr><tr><td>审查汇总</td><td>主编</td><td>8000</td><td>动态</td><td>只读各席报告</td><td>保存分歧，不用多数票压硬错误</td></tr><tr><td>定点修改</td><td>活动主笔</td><td>9000</td><td>9000</td><td>当前正文和必改项</td><td>正常生产最多自动2轮</td></tr></tbody></table></div><p>卷纲和事件需要大范围约束；正文只执行当前章，因此使用较小而硬的资料包；事实审查需回查正式依据，所以比文学和体验资料包更大。</p><h2>5. 十四名成员怎样工作</h2><p>本手册只定义岗位方法，不复制易过期的模型绑定。真实任务以管理员当前模型方案、书籍冻结快照和调用审计为准；普通作者页面不显示供应商或内部模型ID。</p><h3>5.1 貂蝉｜主编</h3><ul><li><strong>介入</strong>：设定、卷纲、事件候选完成后融合（融合稿必须带爽点兑现、逻辑链闭环、新鲜感来源三块说明）；审查后汇总；事件或卷结算完成后出节奏体检报告（爽点与付费点位置、高潮间隔、压抑时长、恢复节拍、风险与建议）；卷末承接下一卷。</li><li><strong>接收</strong>：当前任务包、已保存独立候选、作者选择与意见、正式上游约束。审查汇总时只读各席报告，不重审正文。</li><li><strong>方法</strong>：先找共同硬约束，再比较因果、人物动机、代价、卷目标和下一接口；冲突处择优，不机械平均；保留分歧和未知。</li><li><strong>输出</strong>：设定/卷纲/事件融合稿；审查优先级与保留分歧。</li><li><strong>边界</strong>：不伪造共识，不替作者确认，不以多数票压过事实错误，不在汇总时偷改正文。</li></ul><h3>5.2 西施｜副编</h3><ul><li><strong>介入</strong>：副编定位调整为资料员、摘要员和主编备份；资料编译仍由确定性<code>ContextCompiler</code>在每次任务前完成，摘要维护已落地：事件或卷结算完成后，西施把结算实际结果写成不超过六句的大白话摘要（结算后续任务的第二步，真实模型调用）；主编租约失效时按同一冻结资料包接管。只有确有需要并发生真实模型调用时，西施才显示正在工作。</li><li><strong>接收</strong>：当前书正式对象、版本、来源、预算、检索重点、排除规则和正式结算。</li><li><strong>方法</strong>：确定性结构化直达 → 全文/向量/关系/时间因果检索 → 原文回查；去重排序；编译资料包；记录纳入与排除。</li><li><strong>输出</strong>：ContextPack、来源/排除清单、状态导航、实体和伏笔检索结果；事件/卷大白话摘要。</li><li><strong>边界</strong>：只准备资料，不判断设定真假，不决定剧情，不把猜测写成事实，不混书，不把规划当正文。事实与逻辑判断由文姬读取已经编译好的资料后完成。</li><li><strong>真实状态</strong>：确定性服务不能伪装成副编模型调用；团队状态、任务和模型快照必须如实。</li></ul><h3>5.3 婉儿｜编剧A</h3><ul><li><strong>介入</strong>：独立卷纲A、独立事件A；被指定时生成事件章节序列或单章章纲；设定类目讨论的提案席（侧重爽点、强冲突与持续追读张力），输出可勾选碎片。</li><li><strong>接收</strong>：压缩开书与活动设定、卷任务和软节奏模板、作者意见、事件种子、上一事件真实结算、活动卷纲与完整事件。</li><li><strong>方法</strong>：明确进入状态和本层责任；建立触发→行动→阻力→选择→代价→结果因果链；服务卷目标但不写死场景；保留合理惊喜；新设定无依据时标未知。</li><li><strong>输出</strong>：完整卷纲A、事件A或章纲。</li><li><strong>边界</strong>：不看B未提交方案，不跨卷决定全局，不把模板当公式，不为反转破坏人物动机。</li></ul><h3>5.4 红玉｜编剧B</h3><ul><li><strong>介入</strong>：与A并行生成卷纲B、事件B；被指定时设计章纲；设定类目讨论的提案席（侧重因果链与逻辑闭环），输出可勾选碎片。</li><li><strong>独立性</strong>：与A使用同一任务依据，但有独立模型、任务、资料包快照和输出；不是检查A，也不能偷看A后换词。</li><li><strong>方法</strong>：从关系、铺垫兑现、信息差和长期后果寻找完整另一条路线；不为不同而猎奇；明确必达与自由区；用下一接口检查结尾。</li><li><strong>输出</strong>：完整卷纲B、事件B或章纲。</li></ul><h3>5.5 幼薇｜编剧C</h3><ul><li><strong>介入</strong>：脑洞、反套路与题材化新鲜感方向的独立方案；被指定时参与章纲挑战。</li><li><strong>接收</strong>：与编剧A/B同一任务依据，但使用独立模型、任务和资料包快照；不看其他编剧未提交方案。</li><li><strong>方法</strong>：寻找“没那么常规但成立”的第三条路；新鲜感必须落地为具体行动和代价；脑洞服务人物和主线，不为猎奇破坏因果。</li><li><strong>输出</strong>：剧情方案、玩法重组建议或跨度估算。</li><li><strong>边界</strong>：不把讨论写入正史，不为反转而反转，不冒充其他模型意见。</li></ul><h3>5.6 文姬｜设定</h3><ul><li><strong>介入</strong>：设定阶段；资料库事实候选提取；设定类目讨论的提案席（侧重规则严谨与可核验），输出可勾选碎片。正文后的事实一致性审查改由班昭承担。当前模型由管理员方案和任务快照决定。</li><li><strong>设定资料</strong>：全部开书信息、当前设定项、作者意见、已确认相关设定。</li><li><strong>审查资料</strong>：不可变正文、章纲和上游约束、前文状态、相关正式原文与资料库证据；不读文学和体验报告。</li><li><strong>方法</strong>：设定时守住开书承诺，补世界逻辑、人物边界和可持续冲突。审查先查人物/能力/物品/地点/时间/数量/状态，再查因果、认知边界和伏笔；问题带位置、双方证据和修复动作；证据不足标未知。</li><li><strong>输出</strong>：设定候选、事实报告、最多16条待复核事实候选。</li><li><strong>边界</strong>：使用副编/<code>ContextCompiler</code>已经编译的资料做判断，不负责检索编排或资料包压缩；不评价文笔，不把软偏好判违规，不抹掉人物合理变化。</li></ul><h3>5.7 秋香｜主笔</h3><ul><li><strong>介入</strong>：章纲确认后写正文；硬检查或审查要求时定点修改；作者要求时整章重写。</li><li><strong>接收</strong>：完整本章章纲；约1500字工作单、650字开篇胶囊、600字阶段结算、400字前章状态、500字前章尾部、400字承诺与伏笔、风格胶囊和少量正式证据。不接收整书全文或其他书。</li><li><strong>方法</strong>：先完成必达结尾与禁区；把纲要写成场景、行动、对话和反应；保持人物可辨识；在自由区创造细节和惊喜；结尾准确交接下一章。</li><li><strong>输出</strong>：目标2700—3200有效字，硬范围2350—3650；每次修改创建新版本。</li><li><strong>边界</strong>：不擅改卷/事件结果；不输出提示词、JSON、内部说明或占位符；不写成逐字段说明或模板腔。</li></ul><h3>5.8 湘君｜副笔</h3><ul><li><strong>介入</strong>：主笔首次明确技术失败后，同一模型只重试1次；两次明确失败、超时或不可用后才接管，且整章最多接管1次。供应商结果未知先调和，不盲重试。</li><li><strong>接收</strong>：与主笔同一冻结任务包、两次失败证据和接管原因。</li><li><strong>规则</strong>：按同一章纲、目标2700—3200与硬范围2350—3650完成；显示真实模型和原因；接管仍失败就交作者处理。</li><li><strong>边界</strong>：作者对文风、情节或表达不满意不属于技术失败；不伪装第二位独立主笔，不并行竞写，不因风格偏好抢占主笔，不产生两个正式版本。</li></ul><h3>5.9 班昭｜事实审查</h3><ul><li><strong>介入</strong>：正文通过硬检查后，与文学、体验审查并行，固定承担事实席；资料库事实候选复核。</li><li><strong>接收</strong>：不可变完整正文、设定基线、正史与时间线、来源证据；不读文学和体验报告。</li><li><strong>方法</strong>：先锚定同一对象、同一指标、同一范围再比对；只报告有正文或权威来源证据的矛盾；主观耗时与推断不升级为硬冲突。</li><li><strong>输出</strong>：事实点评JSON：事实矛盾、需确认项和来源证据。</li><li><strong>边界</strong>：不臆造数量对应关系，不作文学评价，不直接改正文。</li></ul><h3>5.10 妲己｜文学审查</h3><ul><li><strong>介入</strong>：正文通过硬检查后，与另两审并行；修改后按新版本重审。</li><li><strong>接收</strong>：不可变正文、章纲、写作合同、风格胶囊、必要近章对照和少量证据；不读另两份报告。</li><li><strong>方法</strong>：查场景、叙述、节奏、情绪、人物声音、重复、空泛和模板腔；保护作者风格；每条问题定位原文并给动作。</li><li><strong>输出</strong>：通过/需修改/阻断；最多8项问题、分数和文学风险。只描述可观察AI腔，不判断作者身份或AI概率。</li></ul><h3>5.11 昭君｜体验审查</h3><ul><li><strong>介入</strong>：与事实、文学审查并行。</li><li><strong>接收</strong>：当前正文、前章必要衔接、章纲、目标读者、情绪目标和少量证据；不读其他报告。</li><li><strong>方法</strong>：按阅读顺序标出跳读、困惑、反感、无感和期待位置；区分个人偏好与广泛风险；检查情绪兑现是否有铺垫和代价；敏感内容给位置和处理动作。</li><li><strong>输出</strong>：最多8项问题、分数、读者风险和敏感内容风险，前端转成自然语言。</li></ul><h3>5.12 妙玉｜体验·挑剔读者</h3><ul><li><strong>介入</strong>：待命成员，不进每章固定审校席（DEC-CURRENT-067：固定席只有事实、文学、体验三席）。作者在正文页点&quot;请挑剔读者找茬&quot;时单独跑一次完整找茬，结果只供参考、不影响定稿；也参与灵感讨论与体验向找茬预演。</li><li><strong>接收</strong>：完整正文、目标读者画像、情绪与钩子投影；不读其他报告。</li><li><strong>方法</strong>：站在最挑剔读者的立场逐段挑刺；每个槽点给出具体位置和读者原话式表达；区分真毒点和口味差异。</li><li><strong>输出</strong>：毒点清单、弃读风险和差评预演。</li><li><strong>边界</strong>：不参与剧情方案，不直接改正文，不把口味差异当错误。</li></ul><h3>5.13 道韫｜研究</h3><ul><li><strong>介入</strong>：只有当前任务需要现实知识、专业常识、历史背景或术语核实时按需触发。</li><li><strong>接收</strong>：明确研究问题、当前书范围、允许来源、所服务对象和必要虚构规则。</li><li><strong>方法</strong>：区分正式来源、可靠二手来源、推断和未知；给适用范围和不确定性；转成创作可用材料。</li><li><strong>输出</strong>：研究摘要、来源、限制和事实候选。</li><li><strong>边界</strong>：不无来源断言，不用现实资料推翻明确虚构规则，不直接改剧情或正史。</li></ul><h3>5.14 弄玉｜来源与版权</h3><ul><li><strong>介入</strong>：导入正文、外部引用、相似风险和发布前来源审查；硬检查发现来源不清时。</li><li><strong>接收</strong>：当前书导入来源、引用片段、正式正文和来源记录；不拿其他用户书籍当素材。</li><li><strong>方法</strong>：判断作者原文/正式引用/公共事实/新生成；检查长度、来源和边界；只报告可观察相似；给改写、缩短、标注或移除动作。</li><li><strong>输出</strong>：来源记录、风险、相似位置和处理建议。</li><li><strong>边界</strong>：不混入其他书，不保存密钥隐私或付费全文，不用模糊指控代替证据。</li></ul><h2>6. 各节点怎样设计、融合与确认</h2><h3>6.1 开书</h3><p>作者输入书名、卖点、题材、标签、目标读者、总字数、主角、初始目标、金手指、开篇场景和自定义想法。这是全书源头，不从其他书、聊天或AI猜测补齐；未填的可选项保持未知。</p><h3>6.2 设定</h3><p><strong>候选</strong>：设定小组成员读取同一份最小必要资料但独立生成；单个候选通常200—400字，具体到能直接落地，并用一句话告诉作者这项设定以后写故事时要抓住什么；方案拆成4至8条作者可逐条勾选或全选的具体主张（碎片），每条是一句能独立成立、互不重复的话，合起来覆盖完整方案；不显示JSON、模型指令或工作流术语。作者可采纳、修改、重写或补充。作者在讨论中补充的想法区分&quot;必须遵守&quot;（方案不得与之冲突）与&quot;仅供参考&quot;（成员以专业判断为主导设计，方案中符合作者想法的观点保持两到五成、最多一半）；&quot;我再改改&quot;的定点修改意见一律按必须遵守处理。</p><p><strong>融合</strong>：编辑只读取已保存候选、作者选择和当前设定依据；落库定稿只写结论本身——核心项通常80—150字、任何一项最多300字，论证、举例、备选和解释不进入落库内容（可留在面向作者的说明里），因为定稿会作为硬指标进入后续创作资料包，冗长会稀释注意力；面向作者的说明用大白话说清这份设定让这本书好看在哪、写作时要抓住什么。未确认内容不进入正式资料库。</p><h3>6.3 分卷</h3><p>编剧A/B都要输出：卷名和开始状态；核心目标、冲突和失败代价；人物变化；事件序列及每个事件的进入、触发、行动、结果、下一接口和章节范围；信息揭示；压力升级与恢复；卷末状态、遗留线索、下一卷触发；必达、禁区、自由区和待确认问题。</p><p>两案独立保存后，主编比较因果、人物、代价、节奏和长线价值，不机械平均。融合稿仍需作者确认。</p><h3>6.4 规划·事件</h3><p>编剧A/B都要输出：事件标题及卷责任；开始状态、触发、参与人物与目标；阻力、选择与代价、信息变化；局部推进、必须结果和自由区；结束条件、下一事件影响、人物弧与卷高潮贡献；建议章节范围和未知项。</p><p>后端保留结构字段，前端默认转成“上一幕、当前困境、必须选择、可能代价、下一幕钩子”的故事预告；可切换大纲模式，但默认不把内部字段堆成配置表。</p><h3>6.5 事件章节序列</h3><p><strong>主方案由指定编剧完成，不是A/B两案再融合。</strong></p><p>编剧先评估事件结束条件需要多少章，再生成连续章节：章节号和标题、事件责任、开始状态、人物目标、冲突、选择与代价、信息变化、故事节拍、结束状态、下一章接口、软建议和自由区。后一章开始必须承接前一章结束，整套章节覆盖事件结束条件。</p><p>作者可选“请另一位编剧看看”。挑战者必须是另一位异模型编剧，读取活动卷纲、完整事件、当前章链候选精确版本和作者关注点，输入预算12000 Token/28000字符，输出不超过1800 Token。只给最多3条关键替代思路，每条写明另一种走法、可能收益、代价和对后续章节的影响；不完整重写、不自动融合、不写正式版本。</p><h3>6.6 单章章纲</h3><p><strong>主方案由指定编剧细化，不走双方案融合。</strong></p><p>资料包含活动卷纲、完整事件、确认章节序列、最近1—3章章纲和作者意见。输出本章功能、开始和必达结束状态、出场人物、冲突、情绪目标、场景节拍、信息控制、伏笔动作、结尾钩子、必写、禁区、候选和自由区。</p><p>作者可选红玉或幼薇挑战当前单章候选。挑战资料冻结完整事件、确认序列、目标章纲精确版本和必要近章接口，输入预算14000 Token/32000字符，输出不超过1800 Token。只挑战核心冲突、人物选择、转折或结尾钩子中的关键点，最多3条；作者可忽略，候选换版后旧建议不再作为当前建议。</p><h3>6.7 正文与审查</h3><ul><li>单一活动主笔写正式初稿。主笔首次明确技术失败后只重试1次；供应商结果未知不盲重试；两次明确失败、超时或不可用后副笔才接管，且最多1次。风格不满意走作者修订，不触发接管。</li><li>硬检查由确定性代码执行，不属于任何AI成员。顺序为占位符/内部指令 → 标题/格式 → 正文长度 → 版本/来源 → 版权风险；优先目标2700—3200有效字，低于2350或高于3650直接打回；最多2次定点修复，仍失败则阻断。</li><li>事实、文学、体验三个职责读同一不可变正文，用不同模型并行，互不读报告；写手与这三席合计四个不同模型来源。挑剔读者（妙玉）不进固定席，作者在正文页按需点&quot;请挑剔读者找茬&quot;单独跑，结果只供参考不卡定稿。</li><li>主编只汇总报告并保留分歧；事实硬错误不能被两份主观“通过”投票覆盖。</li><li>正常生产最多自动定点修改2轮；新稿若破坏已通过硬门禁，就拒绝新稿并保留上一版本，冲突交作者。</li></ul><h2>7. 输出和前端规则</h2><h3>7.1 后端与作者界面分层</h3><ul><li>模型与后端可用严格JSON校验和保存；</li><li>作者页面必须转为自然语言卡片、故事摘要、报告和明确操作；</li><li>不显示JSON键、内部枚举、提示词指令、检索分数、数据库字段、Token日志、异常堆栈或思维链；</li><li>技术进度翻译成“正在核对人物状态”等大白话。</li></ul><h3>7.2 输出门禁</h3><ul><li>身份必须与任务指定成员一致；</li><li>正文版本、模型快照和业务对象必须与冻结任务一致；</li><li>格式错误只做技术修复，不改变创意；</li><li>卷纲与事件最多2次技术尝试；</li><li>审查报告可做1次格式修复，仍失败则阻断；</li><li>结果状态未知时不盲重试，避免两个正式版本；</li><li>正文修改创建新版本，不覆盖旧版。</li></ul><h3>7.3 作者意见优先级</h3><ol><li><strong>必须遵守</strong>：除非与正式事实冲突，否则是硬要求；</li><li><strong>尽量照顾</strong>：强偏好，冲突时说明取舍；</li><li><strong>灵感参考</strong>：可吸收、重组或不用；</li><li><strong>我想先问问</strong>：只回答，不自动改变正式对象。</li></ol><p>独立灵感聊天不自动进资料包。只有作者主动摘录并绑定到设定、卷、事件、章纲或正文后才成为正式输入。</p><h2>8. 上下文与检索</h2><h3>8.1 节点资料矩阵</h3><p>各任务的&quot;必须接收 / 按需检索 / 明确排除&quot;权威矩阵只有一份：<code>docs/LONGFORM_QUALITY.md</code> 第 8.3 节。本文不再复制，避免多份拷贝漂移；验收时以该矩阵逐项核对 ContextPack。</p><h3>8.2 混合检索顺序</h3><p>结构化直达 → 全文精确检索 → 向量语义检索 → 关系检索 → 时间/因果检索 → 正式原文回查。检索不依赖单一相似度阈值；结果带来源、版本、对象和证据；摘要只导航，不能单独裁决事实。</p><h3>8.3 长期防跑偏</h3><p>卷纲约束事件，事件链约束事件大纲，事件大纲约束章纲，章纲约束正文。规划写未来，结算写真实发生。每章保存进入/结束状态，每事件和每卷用真实结算衔接后续。上游版本变化时，下游旧候选失效或重新确认。</p><h2>9. 怎样调整每个成员的质量</h2><h3>9.1 不改代码</h3><ul><li>团队页修改本书某成员的岗位补充要求，最多4000字；</li><li>在每个业务节点写作者意见并选择优先级；</li><li>更换岗位模型绑定并产生新版本；</li><li>选择、混合或放弃方案；</li><li>指定要保留的段落和重写目标。</li></ul><p>推荐写法：</p><pre class="code-block"><code data-language="text">关注什么：人物选择必须付出真实代价。
优先顺序：先人物动机，再反转，再节奏。
不要做什么：不要靠突然出现的新能力解围。
输出习惯：重大转折写清触发、选择、代价和后果。
不确定时：列为待确认，不自行补成设定。</code></pre><h3>9.2 需要改规格和代码</h3><ul><li>单成员节点改为双成员独立方案再融合；</li><li>Token/字符预算和检索数量；</li><li>输出字段、问题数、正文字数；</li><li>重试、副笔接管和自动修改轮数；</li><li>审查职责边界；</li><li>必须读取和必须排除的资料类型。</li></ul><p>这类调整必须同步工作流、Agent、上下文、质量、API、验收和测试，不能只改提示词。</p><h3>9.3 调整后验收</h3><ol><li>显示真实成员和模型；</li><li>资料包只含当前用户、书、对象和活动版本；</li><li>硬资料未被静默删除；</li><li>岗位补充要求进入实际调用快照；</li><li>输出符合结构、字数和边界；</li><li>页面无技术字段、内部指令、乱码和思维链；</li><li>候选不自动成为正式版本；</li><li>上游改变后旧候选不污染下游；</li><li>多书切换不串任务、资料、提示词和状态；</li><li>失败、重试和接管记录真实。</li></ol><h2>10. 当前真实现状和质量关注点</h2><ol><li>团队固定14名；事实审查由班昭固定承担；小文秘书不计入创作成员。</li><li>卷纲和事件已是双编剧独立方案加主编融合，作者最终确认。</li><li>事件章节序列和单章章纲只有一个正式主方案；作者可选让另一位异模型编剧提出最多3条非正式挑战建议，不自动融合。</li><li>正文是单一主笔；主笔最多两次明确技术尝试，之后副笔按同一冻结资料包最多接管一次。</li><li>审查是异模型多席独立审查（每章固定三席：事实、文学、体验；挑剔读者按需找茬），主编最后汇总。</li><li>压缩、去重、版本冻结和资料包编译很多由确定性代码完成，不能伪装为模型工作。</li><li>岗位补充提示词必须用调用快照验收；保存配置不等于所有生产链已注入。</li><li>当前正文硬合同是目标2700—3200有效字、硬范围2350—3650，旧通用提示不得覆盖。</li><li>后端JSON和作者界面分层；作者看到自然语言和故事化表达。</li><li>所有预算是当前代码配置，不是创作公式，可以经测试调整但不能破坏隔离和追溯。</li></ol><h2>11. 运行依据</h2><ul><li><code>apps/api/src/contracts/agent-team-v2.ts</code></li><li><code>apps/api/src/application/agents/prompt-compiler.ts</code></li><li><code>apps/api/src/application/agents/agent-prompt-preference-service.ts</code></li><li><code>apps/api/src/application/memory/context-pack-service.ts</code></li><li><code>apps/api/src/application/memory/writer-context-policy.ts</code></li><li><code>apps/api/src/application/discussions/discussion-pipeline-service.ts</code></li><li><code>apps/api/src/application/planning/volume-plan-generation-pipeline-service.ts</code></li><li><code>apps/api/src/application/planning/story-event-generation-pipeline-service.ts</code></li><li><code>apps/api/src/application/planning/event-chapter-generation-pipeline-service.ts</code></li><li><code>apps/api/src/application/creation/chapter-pipeline-service.ts</code></li><li><code>docs/CREATION_WORKFLOW_V2_DESIGN.md</code></li><li><code>docs/AGENT_SYSTEM.md</code></li><li><code>docs/MEMORY.md</code></li><li><code>docs/HYBRID_RAG_DESIGN.md</code></li><li><code>docs/LONGFORM_QUALITY.md</code></li><li><code>docs/ACCEPTANCE.md</code></li></ul><p>如本文与实际任务调用快照不一致，以老板最新决定和当前运行证据为准，并立即同步本文。</p><h2>小文秘书（不属于14名）</h2><p>只负责导航、附件、任务状态、确定性校验和故障回执。不调用模型给剧情建议，不冒充创作成员，不保存灵感聊天记忆。</p></template><template id="document-30" data-title="运行时工作流与状态机" data-path="docs/RUNTIME_WORKFLOWS.md" data-meta="当前正式文档 · 3.6 KB · 12c2393e58dc"><h1>运行时工作流与状态机</h1><h2>1. 统一任务状态</h2><pre class="code-block"><code data-language="text">pending → queued → working → succeeded
                    ├→ paused → queued
                    ├→ failed → queued（仅可安全重试）
                    ├→ blocked
                    └→ cancelled</code></pre><p>任务包含书籍隔离键、幂等键、上游版本、负责人、预算、阶段、检查点、attempt、租约和错误码。状态只由真实数据库和Worker事件驱动。</p><h2>2. 开书</h2><p>校验全部作者输入 → 建立书籍草稿 → 作者确认 → 单事务创建书籍/定位/14名成员/模型绑定/预算/设定工作区 → 排队首个设定提案。失败回滚整笔事务。</p><h2>3. 设定</h2><p>当前设定项准备完整开书资料与作者本项原话 → 主编和两位编剧互不可见地独立生成 → 保存三份意见 → 作者选择/组合/自写 → 主编只按选择整理 → 作者确认 → 推进下一项。全部必要项确认后生成活动设定版本。</p><h2>4. 分卷</h2><p>编译开书、设定、上一卷结算、当前状态、节奏和作者想法 → 两位编剧独立方案 → 主编融合 → 作者编辑/确认 → 活动卷纲生效。上游版本变化会使候选过期。</p><h2>5. 事件链与事件大纲</h2><p>活动卷纲 → 生成事件序列与因果衔接 → 作者调整顺序/增删拆并 → 确认事件链。选中当前事件后，结合完整事件链、卷目标和作者意见生成事件大纲候选 → 作者融合/确认。</p><h2>6. 当前事件章纲</h2><p>先评估完整事件需要的章数和字数，再生成连续章链。每章纲冻结卷纲、事件链和事件大纲版本。作者确认整个事件章链后，最前未完成章进入正文生产。</p><h2>7. 单章正文</h2><p>准备冻结资料包 → 单一活动写手生成完整初稿 → 硬格式与边界检查 → 事实/文学/体验三席并行审查 → 形成可执行修改清单 → 作者编辑或定点修订 → 作者定稿 → 不可变正文版本 → 章节结算。硬检查同时拦截内部治理说明和最近5章大段模板复用；最多2轮定点修复，仍失败则阻断。</p><p>三席互不读取报告；正式正文不批量跨章生成。结果未知时停止自动重试。本地确定性写手只用于显式测试，正常作者流程缺少创作模型时直接提示配置模型，不生成伪正文。</p><h2>8. 事件与卷结算</h2><p>事件所有章节定稿后，按正文实际内容汇总结果、代价、人物变化、伏笔和下一事件触发；比较计划与实际并由作者确认。卷内事件全部完成后生成卷结算、遗留问题和下一卷起点。</p><h2>9. 续写</h2><p>导入预览 → 作者核对 → 不可变原文入库 → 分析和切片任务 → 带来源的设定/状态/事件/卷候选 → 作者确认缺口 → 进入当前卷—事件流程。导入和分析不补造历史审查报告。</p><h2>10. 失败恢复</h2><ul><li>租约过期：Worker恢复检查点，已成功调用不重复执行。</li><li>本地确定性调用中断：可证明未执行时释放预算并重试。</li><li>远程结果未知：进入调和，不自动重发。</li><li>上游版本变更：旧候选过期，正式数据不回滚。</li><li>SQLite短暂写锁：只对上下文包落库和同任务附件绑定的明确锁冲突做最多3次有限退避；非锁错误立即失败，耗尽后保留检查点供任务恢复。</li><li>投影失败：正式事务保留，outbox重试重建。</li><li>主编切换：新epoch拒绝旧主编的迟到提交。</li></ul><h2>11. 已退役运行流</h2><p>运行时只接受绑定明确业务对象与活动版本的作者输入和AI任务，不注册非对象化消息入口或会话任务。</p></template><template id="document-31" data-title="当前账号安全、隐私与运行运维合同" data-path="docs/SECURITY_AND_OPERATIONS.md" data-meta="当前正式文档 · 12.2 KB · 6c039b3d0b5d"><h1>当前账号安全、隐私与运行运维合同</h1><h2>1. 保护目标</h2><p>保护书籍隔离、作者原件、正式正文、正史、活动规划、模型凭证、本机文件、预算、任务提交、检索投影和备份。浏览器输入、导入文件、附件、模型输出、检索文本和工具响应全部视为不可信输入。</p><p>安全机制只保护数据和运行边界，不替作者决定剧情，也不把软创作建议升级为硬门禁。</p><h2>2. 网络与部署边界</h2><ul><li>API、Worker协调端口、SQLite、文件、LanceDB和内部健康信息不直接暴露公网；</li><li>本机测试时API与Web开发服务使用回环地址；公网时由同机HTTPS反向代理接收 <code>wenmixiezuo.com</code> 并转发到回环端口；</li><li>Host只接受API监听地址和配置的Web域名，Origin只接受当前Web Origin，写请求校验 <code>Sec-Fetch-Site</code> 与JSON内容类型；</li><li>CORS只允许配置的Web Origin并携带凭证；SSE使用同一账号会话和书籍权限，不在URL携带令牌；</li><li>反向代理负责TLS证书、HTTP到HTTPS跳转、请求大小和访问日志；公网部署时注册、登录与全局请求限流由应用层 <code>@fastify/rate-limit</code> 在API内执行；</li><li>不开放SQLite、Worker、向量库、图数据库或开发服务器端口，不以端口映射代替正式部署；</li><li>联网研究继续经过域名、协议、地址、跳转、大小和内容类型限制。</li><li>完整公网部署步骤、Caddy 配置、systemd 服务单元、备份脚本和运维命令见 <button type="button" class="inline-doc-link" data-open-document="document-18">DEPLOY.md</button>。</li></ul><h2>3. 账号、密码与HTTP会话</h2><p>本机和公网使用同一账号体系，不存在固定本机用户或自动取得数据权限的页面会话。首发采用邮箱加密码：邮箱规范化后唯一；密码长度10至128字符，使用每账号独立随机盐和scrypt摘要，不保存或记录明文。首个注册账号在 <code>BEGIN IMMEDIATE</code> 事务中成为管理员；若历史本机老板所有者尚未被账号认领且包含书籍，该管理员在同一事务中复用它。后续账号为普通用户并创建全新所有者。升级迁移只允许在“唯一管理员、当前所有者无书、历史所有者存在且未认领”的条件下切换关联，不复制、不删除创作数据。</p><p>登录成功生成高熵随机令牌，浏览器只通过 HttpOnly、SameSite=Lax、Path=/ Cookie持有明文；服务端 <code>auth_sessions</code> 只保存SHA-256摘要、到期、最近活动和撤销时间。公网HTTPS启用Secure；退出、账号暂停和到期立即使会话失效。API重启不应让有效会话无故失效。</p><p>除 <code>/health</code>、注册和登录外，所有作者API必须验证会话；Worker内部端点使用独立且恒定时间比较的Worker令牌。所有业务范围从会话取得 <code>user_id + owner_id + role</code>，不能信任客户端提交的owner。管理员只能进入专用管理路由；普通业务路由即使管理员访问，也仍只读取管理员自己owner下的书籍。</p><h2>3a. 会员与算力值门禁</h2><p>普通账号注册时自动获得长期有效的青铜体验（20万算力值）；付费档为白银2000万、黄金5000万、钻石2亿算力值，当前周期12个月。算力值=真实token×2；<code>usage_ledger</code>与预算保存真实token，作者界面只显示算力值。生成门禁在 <code>TaskService.create</code> 统一执行：会员缺失、到期或算力耗尽分别返回可恢复的403；开书确认本身不触发AI任务，建书后由作者主动开始设定协作。管理员和未关联账号的本机遗留/测试owner不受会员门禁；会员开通、续费和撤销只限管理员，每账号至多一条活动记录，升级后书籍预算按配额的一半真实token同步刷新。</p><p>公开邀请用户前必须补齐并验收：邮箱验证、找回密码、注册/登录限流与异常告警、用户协议与隐私政策、账号注销和数据导出、HTTPS反向代理、备份恢复、管理员账号预创建。手机号和微信需要真实供应商/开放平台凭证与回调域名，后续绑定到同一 <code>user_id</code>，不能创建第二套账号数据。</p><h2>4. 输入与输出限制</h2><div class="table-scroll"><table><thead><tr><th>对象</th><th>当前限制原则</th></tr></thead><tbody><tr><td>作者单字段输入</td><td>按字段Schema和Unicode字符数限制；保留原话，拒绝控制字符和异常超长输入</td></tr><tr><td>作者附件</td><td>白名单类型、大小上限、哈希、独立保存名、解析状态和绑定对象</td></tr><tr><td>导入正文</td><td>先进入预览与隔离区，确认章节顺序后才写不可变原件</td></tr><tr><td>查询与筛选</td><td>参数化SQL、枚举白名单、分页上限、书籍隔离键</td></tr><tr><td>模型输出</td><td>Schema校验、长度限制、来源检查和候选状态；不能直接执行代码或SQL</td></tr><tr><td>SSE事件</td><td>固定事件类型、结构化数据、单事件大小限制和断线恢复游标</td></tr><tr><td>日志字段</td><td>脱敏、截断、路径归一和密钥扫描</td></tr></tbody></table></div><p>前端显示模型文本时使用React文本转义；需要Markdown时只允许安全子集，不允许任意HTML、脚本、事件属性或危险URL。</p><h2>5. 书籍与版本隔离</h2><p>所有核心记录携带 <code>owner_id</code> 和 <code>book_id</code>。Repository方法必须显式接收隔离范围；跨书查询、任务领取、检索、附件绑定、正文读取和SSE订阅均测试错误书籍ID零命中。</p><p>活动开书、设定、卷纲、事件和章纲版本通过明确指针引用。任务冻结上游版本、正史水位和主编epoch；上游改变、主编切换或任务取消后，迟到结果只能进入隔离记录，不能覆盖当前候选或正式数据。</p><h2>6. 模型凭证与隐私</h2><ul><li>API Key只从环境变量读取；</li><li>Key不得写入SQLite、配置文件、Git、日志、任务、ContextPack、模型请求快照、导出或备份；</li><li>错误信息只显示供应商、模型、状态码、请求ID和可执行处理，不显示认证头；</li><li>模型调用只发送当前任务编译后的当前书籍信息；其他书、无关正文和未授权附件不得进入请求；</li><li>调用记录保存模型绑定、预算、Token、耗时、来源指纹、结果状态和安全摘要，不保存思维链；</li><li>本地嵌入模型只读取允许索引的文本，不联网下载运行时代码。</li></ul><h2>7. 作者原件、附件与正文</h2><p>作者附件和导入原件使用独立不可变文件保存，SQLite记录哈希、大小、类型、创建时间、绑定对象和解析状态。展示文件名与物理保存名分离，禁止路径穿越、绝对路径注入、符号链接逃逸和脚本执行。</p><p>正文使用不可变完整版本。任何编辑、AI修订或作者接管都创建新版本；定稿与结算在事务中引用明确正文版本。正式正文文件写入采用临时文件、刷新、原子改名和哈希校验，禁止静默覆盖。</p><p>普通删除为归档。书籍永久删除只允许已归档书，必须先显示影响预览；用户输入 <code>YES</code> 并再次确认后，服务端重新校验归档状态，在事务和文件清理协调下删除全书数据并写墓碑。</p><h2>8. Agent、工具与权限</h2><p>岗位、Agent实例和模型绑定分离。创作成员只获得当前任务ContextPack和允许提交的候选类型，不能自由访问数据库、文件系统、网络、密钥或其他书。</p><p>小文秘书是确定性本地工具角色，只处理导航、附件、任务状态、格式检查和故障回执，不给剧情结论、不冒充模型，也没有通用Shell、SQL或联网权限。</p><p>模型提出以下行为时只能形成候选或被阻断：提升正史、覆盖正文、扩大联网、增加费用、永久删除、跨书读取、修改权限、绕过作者确认、执行任意SQL或命令。最终授权由应用状态机判定，不由自然语言自称判定。</p><h2>9. 联网研究与版权来源</h2><p>联网只允许 <code>http/https</code>，拒绝环回、私网、链路本地、文件协议、非标准重定向和解析后地址变化。每次跳转重新校验，限制响应大小、超时、内容类型和并发。下载内容进入来源区，不自动成为设定、正史或正文事实。</p><p>研究记录保存URL、标题、抓取时间、来源类型、短摘录、主张、许可备注和用途。大段版权原文不得进入主笔ContextPack；系统使用主张、结构卡和必要短摘录，并与创作索引物理隔离。</p><h2>10. 任务、租约与恢复</h2><p>任务状态由SQLite事务维护：<code>pending → queued → working → succeeded</code>，并支持 <code>failed</code>、<code>timeout</code>、<code>cancelled</code> 和可重试状态。Worker只能领取允许的任务类型，写入检查点、心跳、租约epoch和幂等键。</p><ul><li>Worker失联后等待租约超时再接管；</li><li>取消或重写后，原任务结果即使返回也不能提交；</li><li>内容格式错误和可重试供应商故障按任务策略有限重试；</li><li>预算、权限、版本错配、作者确认缺失和永久操作不自动重试；</li><li>Worker不得直接修改正式正文或核心正史；</li><li>失败任务保留已完成候选与检查点，恢复时不重复收费调用。</li></ul><p>成员状态只由真实任务、心跳、模型调用和工具事件派生。等待上游时显示等待，不使用定时动画伪造工作。</p><h2>11. 检索投影安全</h2><p>SQLite正式源和不可变原件是恢复依据。FTS、LanceDB、关系、Wiki、摘要和切片均为可重建投影，并携带书籍、来源版本、故事时间、水位和快照ID。</p><p>构建新快照时继续使用已验证活动快照。新快照通过来源覆盖、跨书隔离、时间过滤、无答案和冻结查询探针后原子切换。投影损坏或水位落后时明确降级或阻断，不静默使用陈旧结果。</p><h2>12. 日志与可观测性</h2><p>结构化日志允许：时间、组件、任务、书籍匿名标识、请求ID、模型、状态、耗时、Token、预算、错误类别、检索通道、水位和恢复动作。</p><p>日志禁止：API Key、Cookie、认证头、正文全文、附件正文、作者敏感原话、完整ContextPack、任意本机私密路径和模型思维链。错误堆栈在对外显示前移除密钥、查询参数、用户内容和非项目路径。</p><h2>13. 备份与恢复</h2><p>一致性备份至少包含SQLite在线备份、不可变原件/正文、必要配置清单、活动版本指针和文件哈希。向量、FTS缓存和其他可重建投影可以不作为唯一备份，但恢复后必须重建并验证水位。</p><p>同一磁盘上的复制和Git历史不等于第二物理备份。重要书籍需要写入另一块物理磁盘并完成恢复演练。恢复顺序为：校验清单与哈希 → 恢复权威数据 → 校验书籍隔离和活动版本 → 重建投影 → 运行探针 → 开放写入。</p><h2>14. 桌面启动与停止</h2><p>桌面启动器只启动本项目登记的API、Worker和Web进程，先执行迁移，再通过不创建账号会话的轻量 <code>/health</code> 探针确认数据库与Worker就绪，最后打开登录页。全库完整性检查属于迁移、备份和正式验收，不放入高频启动轮询。模型套餐地址必须通过严格路径校验；错误时停止启动并显示可处理原因。</p><p>兼容环境中的 <code>ANTHROPIC_AUTH_TOKEN</code> 只有在同一进程或Windows用户环境同时提供 <code>ANTHROPIC_BASE_URL</code>，且该地址严格等于火山方舟HTTPS主机的 <code>/api/plan</code> 或 <code>/api/coding</code> 时才可按对应套餐使用。地址缺失、普通Anthropic地址、未知主机、端口、查询参数、片段或其他路径均视为无效；专用 <code>WENMI_ARK_*</code> 凭证与端点始终优先。兼容令牌不复制到项目文件或另一环境变量，只在启动进程内存中解析，并与其他模型凭证一起从Web和Worker环境移除。</p><p>停止入口只消费由本项目生成并校验的停止请求和进程登记，不枚举或终止其他应用。启动、停止、重复启动、异常退出和端口占用都要有明确回执。</p><h2>15. 必测项</h2><ul><li>Host、Origin、Cookie、CSRF、DNS重绑定、SSE和回环监听；</li><li>跨书读取、写入、任务、附件、检索和事件订阅零串线；</li><li>路径穿越、恶意文件名、异常编码、超长输入和危险Markdown；</li><li>密钥、正文、附件、ContextPack和本机路径不进入日志；</li><li>取消栅栏、租约接管、幂等、迟到结果、预算和主编epoch；</li><li>空库迁移、已有库顺序升级、重复迁移和失败恢复；</li><li>投影错水位、损坏、缺失、重建、降级和原子切换；</li><li>不可变正文、定稿结算和书籍永久删除双确认；</li><li>启动、停止、重复启动、端口冲突与桌面入口；</li><li>备份哈希、第二物理介质和完整恢复演练。</li></ul></template><template id="document-32" data-title="UI/UX 重设计方向" data-path="docs/UI_UX_REDESIGN_DIRECTION.md" data-meta="当前正式文档 · 5.0 KB · 912876a11e83"><h1>UI/UX 重设计方向</h1><h2>1. 这次要解决的问题</h2><p>当前页面主要问题不是颜色，而是同一屏同时出现太多导航、状态、说明、卡片和操作；作者需要理解系统内部流程，才能知道下一步。手机端又把桌面信息压成多排入口和长卡片，导致首屏看不出当前任务。</p><p>重设计目标：作者进入任意页面后，几秒内知道当前书、当前阶段、AI在做什么、自己要决定什么、下一步是什么。</p><h2>2. GitHub写作产品给出的启发</h2><ul><li><a href="https://github.com/vkbo/novelWriter" target="_blank" rel="noreferrer">novelWriter</a>：项目树稳定组织长篇小文档，编辑面保持克制。启发是“层级随时可见，正文始终最重要”。</li><li><a href="https://github.com/olivierkes/manuskript" target="_blank" rel="noreferrer">Manuskript</a>：大纲、索引卡、故事线和无干扰写作分成不同工作模式。启发是“结构阶段和写作阶段不应共用一套拥挤页面”。</li><li><a href="https://github.com/smith-and-web/kindling" target="_blank" rel="noreferrer">Kindling</a>：写正文时大纲仍可见，但场景节拍可展开，也能切换全页正文。启发是“上层约束靠近正文但默认折叠”。</li><li><a href="https://github.com/Zettlr/Zettlr" target="_blank" rel="noreferrer">Zettlr</a>：稳定编辑区、可折叠工作区和临时多窗格。启发是“比较时才多栏，平时回到单工作区”。</li><li><a href="https://github.com/manuscriptapp/manuscript" target="_blank" rel="noreferrer">Manuscript</a>：iOS/macOS使用同一数据但不同呈现，含项目树、卡片和分屏。启发是“手机不是桌面缩小版”。</li></ul><p>不照抄任何外观，只采用这些成熟的任务结构。</p><h2>3. 新的信息架构</h2><pre class="code-block"><code data-language="text">账号
└─ 当前书
   ├─ 创作进度（开书 → 设定 → 卷 → 事件 → 章 → 正文）
   ├─ 当前工作（此刻唯一主任务）
   ├─ 资料（人物、世界、规则、线程和来源）
   └─ 辅助（团队、任务、灵感、取名、设置）</code></pre><p>创作进度是作者主路径；资料和辅助不应与六个创作阶段在同一层争抢十二个入口。全局任务中心负责跨书汇总，当前对象的AI任务仍在当前页就近显示。</p><h2>4. 页面骨架</h2><p>每个创作页使用相同状态骨架：</p><pre class="code-block"><code data-language="text">当前对象 + 简短状态
        ↓
活动结果 / 当前要完成的内容
        ↓
作者补充（可选、短、按需展开）
        ↓
唯一主操作
        ↓
AI进行中 / 方案比较 / 失败恢复（按状态替换）
        ↓
确认结果 + 下一层</code></pre><p>不要同时铺开作者输入、三份原始方案、质疑、融合稿、质检报告、历史版本和下一步。待决定时重点比较；确认后只留活动定稿和“查看过程/重新设计”。</p><h2>5. 桌面与手机</h2><h3>桌面</h3><ul><li>左侧或顶部保留一个稳定的书籍/阶段定位区，具体形态在原型后确定。</li><li>中间是单一主工作区；方案比较时临时双栏，正文写作时单栏。</li><li>右侧上下文只在写作、核对或审查时按需打开，不常驻。</li></ul><h3>手机</h3><ul><li>顶部只放返回/当前书/更多；阶段切换放进可滑动进度或全页导航，不堆两排十二按钮。</li><li>当前页以单列卡片或无卡片段落为主，一次只看一个方案；底部固定当前状态的主操作，但尊重安全区和键盘。</li><li>书籍、资料和辅助工具进入抽屉或独立页；抽屉不能被遮罩盖住。</li><li>正文编辑全屏优先，“本章任务/相关事实/审查”作为底部抽屉。</li></ul><h2>6. 三种工作模式</h2><ol><li>设计模式：设定、卷路线、事件和章链，强调比较、选择、重排与确认。</li><li>写作模式：正文占中心，最近章纲和事实按需展开。</li><li>复核模式：围绕精确版本展示差异、审查证据、作者修改和实际结算。</li></ol><p>同一对象可以切换模式，但不把三种模式的全部控件同时摆在一屏。</p><h2>7. 视觉原则</h2><ul><li>安静耐读，中心内容优先；少颜色、少厚边框、少阴影、少装饰渐变。</li><li>卡片只在“卡片本身可选择/重排”时使用；普通分组优先标题、留白、分隔线和列表。</li><li>一个强调色同时表达主操作或活动状态，不让多个按钮竞争。</li><li>页面文案是业务语言：状态、范围、影响、动作；删掉宣传语和重复教学。</li><li>字号、间距、圆角、颜色、焦点、状态和动效统一成token，不继续逐页补丁。</li></ul><h2>8. 实施顺序</h2><ol><li>应用壳、导航、手机抽屉和共享页面状态；</li><li>开书信息；</li><li>四项核心设定与按需补设定；</li><li>分卷双路线和首卷强启动；</li><li>事件链、事件大纲、完整章链和近期细纲；</li><li>正文写作、三审和结算；</li><li>资料库、团队、任务、灵感、取名和设置。</li></ol><p>每批先出交互原型和状态表，再实现；共享壳稳定后再统一视觉。旧数据和旧URL保持可读，新旧页面不要长期混用两套状态语义。</p><h2>9. 验收</h2><p>每页覆盖空、编辑、工作中、待决定、完成、失败/恢复；检查360/390/430px和桌面。验证当前书/对象不丢、刷新不漂移、重复点击不重复发任务、键盘不遮操作、长内容不溢出、错误有恢复动作。工程门禁按 <code>docs/ACCEPTANCE.md</code> 的风险矩阵执行。</p></template><template id="document-33" data-title="超长篇连续性设计" data-path="docs/ULTRA_LONGFORM_CONTINUITY.md" data-meta="当前正式文档 · 2.9 KB · b3df1a36af16"><h1>超长篇连续性设计</h1><h2>1. 规模目标</h2><p>单书按约500万规范化中文字符、约1500章设计。模型上下文必须与全书总量解耦，不能靠把全文或全部摘要常驻上下文维持连续性。</p><h2>2. 长期知识层</h2><ol><li>权威原件：作者输入、导入原文、确认设定、活动规划和定稿正文。</li><li>当前状态：人物、势力、资源、地点、规则和关系的活动状态。</li><li>开放承诺：伏笔、目标、债务、谜团、未解决冲突和承诺。</li><li>层级结算：章节、事件、卷和全书骨架的可回查摘要。</li><li>检索投影：FTS、向量、图谱和Wiki。</li></ol><p>摘要和投影不能推翻权威原件。</p><h2>3. 卷—事件连续性</h2><p>分卷是当前卷未来创作权威；事件链将卷目标拆成因果相连的小故事；事件大纲决定当前事件完整闭环；章纲只拆当前事件；正文冻结所有活动上游版本。事件和卷结算把实际结果传给下一层。</p><h2>4. 滚动规划</h2><p>不一次规划1000章。先确认当前卷和完整事件链，再完整设计当前事件，最后细化当前事件章链。上游可以版本化调整，但旧版本保留并使依赖候选过期。</p><h2>5. 历史回查</h2><p>旧阶段默认使用卷/事件/章节结算导航；当实体、规则、时间、因果、伏笔、关系或人物声音触发时，逐级回查正式原文。不存在固定“超过N章就遗忘”的规则。</p><h2>6. 人物连续性</h2><p>人物状态至少区分身份、目标、能力、资源、关系、知情范围、情绪倾向和未兑现承诺。状态变化只能来自作者确认资料或定稿正文结算，并保存来源。人物声音从高置信正式片段按需检索。</p><h2>7. 伏笔与因果</h2><p>伏笔记录埋设来源、当前状态、预期窗口、关联实体和回收证据。因果链记录事件结果如何改变下一事件触发。计划中的伏笔不是已经发生；未在正文出现不能结算为已埋。</p><h2>8. 上下文预算</h2><p>当前任务完整对象优先；上层硬约束放在高注意力位置；历史证据按触发检索。内容过长时先去重复、分级导航和压缩解释，不能删掉身份、目标、因果、规则、作者必须项或未解决承诺。</p><h2>9. Agent长期陪伴</h2><p>长期陪伴意味着岗位身份、版本化模型绑定、任务历史、来源和质量结果可追溯，不意味着常驻模型进程或保存聊天。成员每次从正式状态和任务资料重新进入工作。</p><h2>10. 续写</h2><p>已有正文不可变保存并按章/场景切片。反向拆解提取人物、设定、事件、卷结构和开放承诺，全部带来源并等待确认；未来创作仍使用当前卷—事件流程。</p><h2>11. 验收</h2><p>E2验证满规模存储、检索、重建、恢复、隔离和有界上下文；E3验证跨题材真实模型盲评；E4验证真实作者跨卷长期创作。任何阶段出现人物漂移、因果断裂、摘要覆盖事实或创造性明显下降都触发停止和回退。</p></template><template id="document-34" data-title="文秘写作使用说明" data-path="docs/USER_GUIDE.md" data-meta="当前正式文档 · 7.0 KB · ef59f84e0fd9"><h1>文秘写作使用说明</h1><h2>启动与停止</h2><p>双击桌面的“文秘写作”入口，等待浏览器打开。首次使用请在登录页用邮箱、昵称和至少10位密码注册；系统中的第一个账号会成为管理员。以后使用同一邮箱和密码登录。若桌面入口缺失，可双击项目根目录的“文秘写作-启动.cmd”。若启动窗口提示错误，不要重复点击，记录错误后再处理。停止时使用“文秘写作-停止”入口，只停止本项目登记的进程。</p><h2>新建一本书</h2><ol><li>在创作台左侧书籍栏点击“新建书籍”。</li><li>填写书名、频道/分类、题材、初始角色、必须遵守和自己的补充想法。</li><li>确认创建后进入设定。确认第一卷方案后，可在“信息”页点书名或书籍简介旁的“主编设计”，让主编依据第一卷故事、设定和开书信息设计多套书名或简介候选，选一套直接采用。</li><li>在每个设定项查看主编与两位编剧的独立方案；选择、组合、直接改写或要求重做。</li><li>所有当前必需设定确认后进入当前卷。</li></ol><h2>规划当前卷</h2><ol><li>填写卷目标、预计体量、卷末状态和自己的想法。</li><li>选择大白话节奏参考，也可以不用或混合多个模板。</li><li>比较 AI 候选，确认活动卷纲。</li><li>生成事件链，检查每个事件为什么发生、解决什么、带来什么新状态。</li><li>选中当前事件，生成并确认完整事件大纲。</li><li>让系统评估章数和字数，再生成当前事件章纲。</li></ol><h2>写正文</h2><ol><li>打开章纲，补充本章指导意见。</li><li>点击开始撰写；一次只正式生成一章。</li><li>查看事实、文学、体验三份独立报告。</li><li>直接编辑或让写手按指定建议修订。</li><li>满意后定稿，系统才会结算本章事实和状态。</li></ol><h2>事件和卷结束</h2><p>事件全部章节定稿后查看事件结算，确认实际结果、人物变化、遗留问题和下一事件触发。当前卷完成后查看卷结算，再规划下一卷。规划内容不是正史，只有定稿正文及确认资料才记录已发生事实。</p><h2>续写已有作品</h2><ol><li>新建书时选择导入已有正文。</li><li>核对章节识别和顺序后确认导入。</li><li>原文保存为不可变版本，系统不会改写。</li><li>查看带来源的反向拆解结果，确认或修改人物、设定、事件与当前状态。</li><li>补齐当前卷、事件和章纲后继续写作。</li></ol><h2>资料库和取名</h2><ul><li>资料库统一查看人物、势力、地点、物品、规则、事件、关系、情绪、伏笔、信息差、来源、冲突与缺口。</li><li>取名按人物、地点、势力、物品、生灵和能力生成候选，不会自动写入设定。</li></ul><h2>AI 成员状态</h2><p>顶部“团队”显示全部14名创作成员。“准备中”表示正在编译本次资料；“工作中”表示真实模型调用已经发出；“完成”表示结果已保存；“失败/超时”会显示原因和可执行操作。小文秘书不计入人数，也不作为创作成员显示。</p><p>所有AI任务都在服务器后台执行：下达任务（开书、续写、设定讨论等）后即可关闭页面或退出登录，任务不会中断，重新打开后可在任务中心查看进度与结果。不同用户、不同书籍的任务同时并行执行，互不排队；同一本书内同时只执行一个任务，以保证设定与正文的一致性。章节生成到“审校检查点”时会暂停等待作者确认，这是功能设计而非中断，确认后继续。</p><h2>书籍与创作导航</h2><p>登录后可以切换当前书、创建或归档书籍，再进入当前书的创作阶段。当前版本仍可能使用左侧书籍区和顶部功能区，但后续会持续调整；请以页面显示的当前书名、当前对象状态和主操作为准。</p><p>手机端书籍和辅助功能可能收进抽屉或分段页面；桌面端可能提供更宽的对象导航和临时比较面板。无论布局如何变化，切换书籍不会改写数据，长书名保留原文，显示截断不影响正式书名。开发验收运行标识只转换为普通中文标签，内部标识不展示给作者。</p><h2>数据边界</h2><p>作者输入、附件、选择和反馈保存在所属对象中，不写入聊天记忆。其他书不会进入当前书上下文。摘要和向量只用于导航，事实争议会回查正式资料和定稿正文。</p><h2>测试与备份说明</h2><p>开发和自动测试可以使用确定性假模型验证流程、格式与恢复机制，但它不代表真实模型的文学质量，也不能冒充真实模型调用。当前Git历史与同一磁盘上的副本都不等于第二物理备份；重要书籍应另存到另一块物理磁盘后，才能声称具备该级别灾备。</p><h2>查看已完成的规划</h2><p>事件或整卷完成后，规划和章纲不会消失。进入“规划”可以查看已完成事件链、每个事件的大纲和版本；进入“章纲”可以查看该事件全部已确认、已冻结的章纲；一卷包含多个已完成事件时，可在页面顶部切换事件。历史页只供核对和复制，不显示重新生成、冻结、写作或结算按钮。若正文已经存在而这两页为空，应视为界面或工作流缺陷，不能按“正文数量足够”判定流程通过。</p><h2>当前项目文档合订版</h2><p>桌面“文秘写作项目文档”首页顶部提供“一页看完当前项目”。打开后可在一个页面阅读并复制全部现行产品、流程、AI成员、上下文、检索、架构、数据、验收和Skill资料。项目根目录中的 docs/PROJECT_REFERENCE_BUNDLE.md 是同一内容的Markdown版本，适合整体复制给外部顾问。</p><h2>账号与管理员</h2><p>本机使用也需要登录。退出后当前浏览器会话立即失效，但书籍仍保留在该账号下。左栏底部显示当前昵称、身份和算力值余额；管理员点击“管理”可查看用户统计、搜索用户并暂停或恢复普通账号。暂停账号后其已有会话立即失效。当前没有上线邮箱找回密码、手机号或微信登录，公开邀请其他人之前应先补齐这些运营能力。</p><h2>会员与算力值</h2><p>普通账号需要管理员开通会员后才能生成内容。会员分三档：包月（3亿算力值）、包季（10亿算力值）、包年（百亿算力值），算力值即token，按周期内实际生成消耗扣减，用完或到期后生成会被暂停，续费后立即恢复。管理员账号不限算力值。无生效会员的非管理员账号在进入书籍工作区时，会看到可关闭的“内测说明”弹窗，提示需要联系管理员微信595341366开通会员；关闭后仍可浏览书籍与资料，但调用AI生成（开书、续写、分析等）时会被“会员提示”弹窗阻断。弹窗每20秒自动刷新会员状态，管理员开通后自动解除限制，也可点击“刷新会员状态”立即生效。服务端同时有生成门禁兜底，未开通或算力值用完的账号即使绕过前端也无法创建生成任务。管理员在“管理”页选择套餐即可开通或续费，也可撤销会员，并能查看每个账号的周期消耗与累计消耗。</p></template><template id="document-35" data-title="文秘写作当前交接" data-path="HANDOFF.md" data-meta="当前正式文档 · 3.2 KB · 47f1e4df9faf"><h1>文秘写作当前交接</h1><blockquote>新的开发任务先读本文件一次即可；同一任务后续不重复读取。历史开发日志在 Git，不在这里累积。</blockquote><h2>当前状态（2026-08-21）</h2><ul><li>项目：<code>D:\wenmixiezuo</code>，分支 <code>codex/desktop-entry</code>，生产站点 <code>https://wenmixiezuo.com</code>。</li><li>产品仍处于初始完善期，工作流已具备工程闭环，但 UI/交互尚不满意，后续以手机端逐页重设计为主，不受旧卡片布局和旧视觉细节约束。</li><li>当前主流程：开书 → 非剧情设定 → 卷方向 → 事件链 → 事件大纲 → 完整章链/近期细纲 → 正文 → 三级结算。</li><li>当前生产最近上线：卷规划前置门禁恢复；设定未完成时引导作者回设定处理，不显示注定失败的规划按钮。</li><li>最近已知工程基线：全量184个测试文件、779项通过；最新迁移 <code>0062_setting_gap_status.sql</code>。这只是已有基线，不要求普通 UI 修改每次重跑全部门禁。</li></ul><h2>下一阶段重点</h2><ol><li>先做整体信息架构和手机端创作路径，不急着逐个美化旧卡片。</li><li>优先页面顺序：应用壳/导航 → 开书信息 → 设定 → 分卷 → 事件与章纲 → 正文；每页先解决状态、主操作和失败恢复，再统一视觉。</li><li>交互目标：少填少选、逐层展开、AI在正确时机介入、进行中有明确反馈、完成后自动收起、失败能直接恢复。</li><li>写作工作台参考模式记录在 <code>.agents/skills/wenmi-ui-ux/references/writing-workspace-patterns.md</code>。</li></ol><h2>当前产品事实</h2><ul><li>核心设定为四项：世界舞台、主角底板、规则与代价、边界与留白；扩展设定按需补，不阻塞分卷。</li><li>分卷普通作者只看具体故事路线，不显示三幕式、拯救猫咪等内部术语；路线可整选、片选、融合、编辑或重做。</li><li>第一卷包含前500字兴趣职责、黄金三章、持续追读变化、防疲劳和约10万字内或卷末重大高潮。</li><li>普通作者接口使用自然语言洁净投影；管理员审计与普通页面隔离。</li><li>当前创作团队14名；具体岗位与模型绑定以运行配置和 <code>apps/api/src/contracts/agent-team-v2.ts</code> 为准。</li></ul><h2>基础安全与部署</h2><ul><li>Key 只在服务器环境变量，不能进入 Git、文档、日志或上下文。</li><li>核心数据按 <code>owner_id</code>、<code>book_id</code> 隔离；正文不可变；永久删除作者数据需双重确认。</li><li>Web-only：暂存构建、保留旧哈希资源、原子切换入口、验证后回滚可用，不需要停 API/Worker。</li><li>API/Worker/迁移：向后兼容，重启前在途任务连续30秒为零并立即复核，逐服务切换。</li><li>Windows 发布归档仍使用 <code>git -c core.autocrlf=false -c core.eol=lf archive</code>，避免迁移校验和被 CRLF 改写。</li></ul><h2>规则入口</h2><ul><li>开发规则：<code>AGENTS.md</code></li><li>产品章程：<code>docs/PROJECT_CHARTER.md</code></li><li>当前决定：<code>docs/DECISIONS.md</code></li><li>风险分级验收：<code>docs/ACCEPTANCE.md</code></li><li>长篇质量：<code>.agents/skills/wenmi-longform-quality/SKILL.md</code></li><li>UI/UX：<code>.agents/skills/wenmi-ui-ux/SKILL.md</code></li></ul><h2>历史与恢复</h2><p>2026-08-21规则精简前的完整原文保留在 Git 基线 <code>e8517d9</code>。默认不读；需要追溯旧编号或恢复某条细节时再查对应文件历史。</p></template><template id="document-36" data-title="文秘写作当前知识地图" data-path="KNOWLEDGE.md" data-meta="Codex 工作规则 · 3.4 KB · 7ad7f7c630ef"><h1>文秘写作当前知识地图</h1><h2>产品主线</h2><p>文秘写作是使用统一账号体系、支持本机测试和后续公网部署的长篇小说AI协作平台。作者始终拥有最终决定权，AI通过明确对象提供独立方案、融合候选、正文和审查报告，不使用聊天推动流程。</p><p>主流程：开书 → 非剧情设定 → 卷方向 → 事件链 → 事件大纲 → 完整章链与近期详细章纲 → 单章正文 → 章/事件/卷结算 → 下一卷。</p><p>已有作品可导入并反向拆解；作者原文保持不变，派生分析带来源并进入同一卷—事件工作流。</p><h2>权威对象</h2><ul><li>开书活动版：作者填写的全部开书信息和明确偏好。</li><li>设定活动版：世界、力量、势力、人物、规则等已确认设定。</li><li><code>volume_plans</code>：活动卷纲与不可变候选版本。</li><li><code>story_events</code>：卷内事件链、事件卡和事件大纲版本。</li><li><code>event_chapter_outlines</code>：当前事件章链与单章详细章纲。</li><li><code>manuscript_versions</code>：不可变正文版本。</li><li>章节、事件、卷结算：正文实际发生内容的正式聚合。</li><li>正史事实、实体、时间线和关系：由定稿正文与确认资料产生。</li></ul><p>SQLite正式对象与不可变原文是权威源。摘要、图谱、Wiki、FTS和LanceDB只作导航或可重建投影。</p><h2>AI协作</h2><p>当前产品配置为14名创作成员；人数、岗位和界面呈现可由老板后续决定调整。卷纲与重要事件由主编组织两位异模型编剧独立提案后融合；章纲在当前事件约束下拆分；正文由单一活动写手完成；事实、文学、体验三席使用三异模型独立审查。小文秘书只处理确定性工具、导航和安全回执。</p><h2>上下文原则</h2><ul><li>开书和设定阶段完整保留作者输入。</li><li>下游按硬事实、当前任务、软参考和开放区编译资料；必要硬资料不静默截断。</li><li>当前对象使用完整内容：当前卷、当前事件链、当前事件大纲或当前章纲按任务选择完整注入。</li><li>历史只按触发实体、规则、时间、因果、伏笔和人物声音回查。</li><li>其他书、聊天、过期版本、无关候选和无依据猜测始终排除。</li></ul><h2>当前入口</h2><ul><li>产品与功能：<code>docs/PRODUCT.md</code></li><li>完整交互：<code>docs/CREATION_WORKFLOW_V2_DESIGN.md</code></li><li>AI成员：<code>docs/AGENT_SYSTEM.md</code></li><li>上下文：<code>docs/MEMORY.md</code></li><li>检索：<code>docs/HYBRID_RAG_DESIGN.md</code></li><li>质量：<code>docs/LONGFORM_QUALITY.md</code></li><li>API：<code>docs/API.md</code></li><li>验收：<code>docs/ACCEPTANCE.md</code></li><li>当前任务：<code>TASKS.md</code></li><li>UI/UX：<code>.agents/skills/wenmi-ui-ux/SKILL.md</code></li><li>长篇质量：<code>.agents/skills/wenmi-longform-quality/SKILL.md</code></li></ul><p>当前文档中心、产品检索和Codex默认上下文只读取显式白名单与当前活动对象。</p><h2>账号与隔离</h2><p>本机也必须先登录，不保留固定本机用户。当前使用邮箱加密码，首个账号为管理员。登录会话确定 <code>owner_id</code>，所有书籍与创作数据严格按账号隔离；管理员能管理账号状态，但普通创作接口仍只读取当前登录用户自己的书籍。手机号和微信以后绑定到同一用户，不另建创作身份。 本地确定性生成只服务E1/E2工程测试，不能在正常作者流程冒充设定、规划、章纲、正文、审查、灵感或续写成员。真实长篇按20、50、100、200章逐段验收；前一阶段出现模板复用、无场景正文、人物工具化、内部说明或事实漂移时停止扩大。</p></template><template id="document-37" data-title="文秘写作项目入口" data-path="PROJECT_HANDBOOK.md" data-meta="当前正式文档 · 2.5 KB · 80f4f4f4e → 完整章链与近期详细章纲 → 单章正文 → 章节结算 → 事件结算 → 卷结算 → 下一卷</code></pre><p>已有正文可以导入并反向拆解，再进入同一套卷—事件流程；导入原文不会被覆盖。</p><h2>使用入口</h2><ul><li>双击 <code>文秘写作-启动.cmd</code> 启动。</li><li>启动后先进入登录/注册页；首次使用请用邮箱、昵称和至少10位密码注册，首个注册账号自动成为管理员，以后使用同一邮箱和密码登录。</li><li>双击 <code>文秘写作-停止.cmd</code> 停止本项目进程。</li><li>双击桌面的“文秘写作项目文档”查看当前规则和功能说明。</li><li>项目总入口：<button type="button" class="inline-doc-link" data-open-document="document-37">PROJECT_HANDBOOK.md</button>。</li><li>使用说明：<button type="button" class="inline-doc-link" data-open-document="document-34">docs/USER_GUIDE.md</button>。</li></ul><h2>界面</h2><ul><li>当前实现以书籍切换、创作阶段导航和中心工作区为基础；产品仍在快速迭代，导航密度、页面结构和视觉风格都可继续重设计。</li><li>作者按开书、设定、分卷、事件、章纲和正文逐层推进，AI方案、作者选择、融合、修订和确认版本保存在对应业务对象中。</li><li>手机端优先保证当前书、当前任务、状态、主操作和失败恢复可达；桌面端提供更宽的比较与写作空间。</li><li>普通作者界面只显示业务语言，不显示内部模型、任务、方法、路径或协议字段。</li></ul><h2>技术边界</h2><p>React、TypeScript、Vite、Fastify、SQLite、独立 Worker、REST/SSE 和本地 LanceDB 投影。本机测试时服务只监听 <code>127.0.0.1</code>；公网部署时通过 Caddy 反向代理对外提供 HTTPS 服务。</p><h2>公网部署</h2><p>详见 <button type="button" class="inline-doc-link" data-open-document="document-18">docs/DEPLOY.md</button>。部署文件位于 <code>deploy/</code> 目录：</p><ul><li><code>deploy/Caddyfile</code> — Caddy 反向代理配置（TLS + 限流 + 静态文件）</li><li><code>deploy/wenmi-api.service</code> — API systemd 服务单元</li><li><code>deploy/wenmi-worker.service</code> — Worker systemd 服务单元</li><li><code>deploy/backup.sh</code> — SQLite 数据库自动备份脚本</li><li><code>deploy/.env.production.example</code> — 生产环境变量模板</li></ul><h2>当前验证</h2><p>截至2026-08-12，仓库当前验证基线为：运行时可达性审计零孤儿源码，类型检查通过，158个测试文件中的585项测试通过，Contracts/API/Worker/Web生产构建通过。其他文档中的较小测试数字属于对应阶段的历史验收快照，不代表当前基线；最新结算以<code>TASKS.md</code>顶部证据为准。真实模型长期文学质量仍按E3/E4证据积累，不以工程测试冒充。</p></template><template id="document-39" data-title="当前任务" data-path="TASKS.md" data-meta="Codex 工作规则 · 2.0 KB · 51fd0f22da22"><h1>当前任务</h1><blockquote>只记录现在要做的事。旧的200章验收、事故修复、测试数字和发布流水保留在 Git 基线 <code>e8517d9</code>，默认不读取。</blockquote><h2>P0：UI/UX整体重设计</h2><ul><li>[ ] 基于手机端作者旅程确定新的信息架构和应用壳，不受旧12入口、固定封面、卡片和iOS玻璃风格约束。</li><li>[
