产品、流程、架构、数据、AI成员、上下文、检索、质量、开发与验收规则。仅在专项外部评审需要完整上下文时使用；日常开发读取短入口和相关小节。</p><p>共 <strong>39</strong> 份源文档，按以下六个目录合并：</p><ul><li>一、产品定位与完整工作流（8份）</li><li>二、AI成员、上下文、检索与创作质量（8份）</li><li>三、系统架构、数据、接口与运行（6份）</li><li>四、当前决定、开发计划与验收（5份）</li><li>五、Codex开发协作与当前状态（5份）</li><li>六、项目 Skills（7份）</li></ul><blockquote>权威说明：老板最新明确决定优先；本合订版由源文档自动生成，不单独手工维护。</blockquote><h2>一、产品定位与完整工作流</h2><h3>文秘写作</h3><blockquote>当前源文件：<code>README.md</code> · 指纹：<code>6c96f9fc7aa5</code></blockquote><h4>文秘写作</h4><p>文秘写作是一套本地优先的长篇小说 AI 协作平台。作者通过明确的创作对象推进工作，AI 成员直接给出独立方案、融合候选、正文和审查报告，不使用聊天推动创作。</p><h5>当前工作流</h5><pre class="code-block"><code data-language="text">开书信息 → 设定 → 分卷 → 事件链 → 当前事件大纲
→ 完整章链与近期详细章纲 → 单章正文 → 章节结算 → 事件结算 → 卷结算 → 下一卷</code></pre><p>已有正文可以导入并反向拆解，再进入同一套卷—事件流程；导入原文不会被覆盖。</p><h5>使用入口</h5><ul><li>双击 <code>文秘写作-启动.cmd</code> 启动。</li><li>启动后先进入登录/注册页；首次使用请用邮箱、昵称和至少10位密码注册，首个注册账号自动成为管理员，以后使用同一邮箱和密码登录。</li><li>双击 <code>文秘写作-停止.cmd</code> 停止本项目进程。</li><li>双击桌面的“文秘写作项目文档”查看当前规则和功能说明。</li><li>项目总入口：<span class="document-reference">PROJECT_HANDBOOK.md · PROJECT_HANDBOOK.md</span>。</li><li>使用说明：<span class="document-reference">docs/USER_GUIDE.md · docs/USER_GUIDE.md</span>。</li></ul><h5>界面</h5><ul><li>当前实现以书籍切换、创作阶段导航和中心工作区为基础；产品仍在快速迭代，导航密度、页面结构和视觉风格都可继续重设计。</li><li>作者按开书、设定、分卷、事件、章纲和正文逐层推进，AI方案、作者选择、融合、修订和确认版本保存在对应业务对象中。</li><li>手机端优先保证当前书、当前任务、状态、主操作和失败恢复可达；桌面端提供更宽的比较与写作空间。</li><li>普通作者界面只显示业务语言，不显示内部模型、任务、方法、路径或协议字段。</li></ul><h5>技术边界</h5><p>React、TypeScript、Vite、Fastify、SQLite、独立 Worker、REST/SSE 和本地 LanceDB 投影。本机测试时服务只监听 <code>127.0.0.1</code>；公网部署时通过 Caddy 反向代理对外提供 HTTPS 服务。</p><h5>公网部署</h5><p>详见 <span class="document-reference">docs/DEPLOY.md · docs/DEPLOY.md</span>。部署文件位于 <code>deploy/</code> 目录：</p><ul><li><code>deploy/Caddyfile</code> — Caddy 反向代理配置（TLS + 限流 + 静态文件）</li><li><code>deploy/wenmi-api.service</code> — API systemd 服务单元</li><li><code>deploy/wenmi-worker.service</code> — Worker systemd 服务单元</li><li><code>deploy/backup.sh</code> — SQLite 数据库自动备份脚本</li><li><code>deploy/.env.production.example</code> — 生产环境变量模板</li></ul><h5>当前验证</h5><p>截至2026-08-12，仓库当前验证基线为：运行时可达性审计零孤儿源码，类型检查通过，158个测试文件中的585项测试通过，Contracts/API/Worker/Web生产构建通过。其他文档中的较小测试数字属于对应阶段的历史验收快照，不代表当前基线；最新结算以<code>TASKS.md</code>顶部证据为准。真实模型长期文学质量仍按E3/E4证据积累，不以工程测试冒充。</p><hr><h3>项目总章程</h3><blockquote>当前源文件：<code>docs/PROJECT_CHARTER.md</code> · 指纹：<code>4c68e6a4ed89</code></blockquote><h4>项目总章程</h4><h5>产品使命</h5><p>帮助作者逐层完成长篇小说：系统准备资料、提出可选方案、辅助规划和写作、核对事实并结算实际状态；作者始终保有选择、修改、留白和最终确认权。质量提升不能把作品压成固定公式。</p><h5>主流程</h5><pre class="code-block"><code data-language="text">开书信息 → 非剧情设定 → 分卷方向 → 当前卷事件链 → 当前事件大纲
→ 完整章链与近期详细章纲 → 单章正文 → 章节/事件/卷结算 → 下一卷</code></pre><p>已有正文导入和反向拆解是兼容入口，原文不可覆盖；分析结果带来源，并回到同一对象链继续创作。</p><h5>分层职责</h5><ul><li>开书信息：题材、读者、风格等基础方向。</li><li>设定：世界舞台、主角底板、规则与代价、边界与留白等非剧情骨架；扩展项按需补。</li><li>卷方向：本卷大故事方向、主要变化、重点表达和卷末新局面。</li><li>事件链/事件大纲：卷内因果结构和可独立成立的小故事。</li><li>章链/详细章纲：完整章序列与最近章节的场景、情绪、信息、动作和接口。</li><li>正文：在当前章任务内自由表达。</li><li>结算：只记录正文真实发生的结果，并向后续规划反馈。</li></ul><p>规划描述未来，结算记录实际；上游确认版本改变时，下游候选必须失效、重编译或重新确认。</p><h5>创作合同</h5><ul><li>作者可见内容全部用大白话，软参考可不用、混合、重排或自定义。</li><li>专业叙事方法只在后台帮助生成有实质差异的具体路线，不在普通作者页面泄漏方法名。</li><li>首卷负责前500字兴趣、黄金三章追读和约10万有效正文字符内（或短卷卷末）重大高潮的故事职责；效果是硬目标，打法保持开放。</li><li>ContextCompiler区分硬事实、当前任务、软参考和创作空白；计划不能冒充事实，摘要和检索投影不能覆盖正式源。</li><li>创作团队的当前人数、岗位与模型绑定由产品规格和运行配置决定，规则文件不冻结界面呈现。</li></ul><h5>产品与界面</h5><p>产品仍在快速完善。左侧书籍切换、顶部功能导航和现有视觉语言只是当前实现，不是不可修改的章程。UI/UX 可以持续重构，只需保持书籍归属清楚、当前任务明确、作者数据不丢、旧内容可读，并优先保证手机端可操作。</p><p>每个页面优先回答三件事：我现在在哪里、系统正在做什么、下一步能做什么。表单按需展开，不要求作者一次填完未来层级；AI在作者需要选择或生成下一层时介入，不提前替作者锁死剧情。</p><h5>权威与版本</h5><p>作者确认的开书资料、设定、规划版本、原话和不可变正文是正式来源。SQLite正式对象与不可变原文是权威源；全文、向量、图谱、Wiki和摘要是可重建投影，事实争议必须回查正式源。</p><h5>基础安全</h5><ul><li>每个业务请求从已验证会话取得 <code>owner_id</code>，核心对象同时携带 <code>book_id</code>，禁止跨用户、跨书污染。</li><li>正文使用不可变完整版本；修改产生新版本。</li><li>API Key 只从环境变量读取，不进入数据库、日志、上下文、备份、导出或 Git。</li><li>普通删除为归档；永久删除作者数据需影响预览、<code>YES</code> 和二次确认。</li><li>不保存或展示思维链；只保存任务、来源、结论、预算和调用证据。</li><li>同模型不得冒充异模型独立意见，任务状态必须来自真实任务/心跳/调用事件。</li></ul><h5>成功定义</h5><p>作者能在手机或桌面上从开书连续推进到卷、事件、章纲和正文；每一步负担可控、状态可理解、失败可恢复。系统能长期衔接事实和规划，跨书隔离，可追溯，并保持原创性、人物生命力、情绪力度和整体阅读质量。</p><hr><h3>产品规格</h3><blockquote>当前源文件：<code>docs/PRODUCT.md</code> · 指纹：<code>d3180563e25e</code></blockquote><h4>产品规格</h4><h5>1. 产品定位</h5><p>文秘写作是面向长篇网文作者、使用统一账号体系的 AI 协作创作台。AI 模拟专业主创团队，但作者始终拥有最终选择、编辑、确认和定稿权。</p><h5>2. 信息架构</h5><h6>统一账号与管理后台</h6><p>本机测试与未来公网版本使用同一套账号。当前采用最短可用路径：邮箱、密码和昵称注册；邮箱与密码登录；退出立即撤销当前会话。首个成功注册的账号自动成为管理员，并复用、接管账号体系启用前的本机老板数据；后续账号为普通用户，每个账号获得全新的独立数据空间。密码只保存带独立盐值的高成本摘要，浏览器只保存 HttpOnly 会话 Cookie，服务端数据库只保存会话令牌摘要。</p><p>登录页不显示创作台数据。登录后左侧只列出当前账号的书籍，所有接口从会话派生 <code>owner_id</code>，不接受客户端自行指定所有者。管理员可查看总用户数、启用/暂停数量、已注册账号名下的用户书籍总数和用户列表，并可暂停或恢复普通账号；不能暂停自己或最后一个可用管理员。</p><p>手机号和微信登录不与首发邮箱登录混在同一开发门槛内。它们需要短信供应商或微信开放平台资质、回调域名、费用和真实凭证，后续通过独立身份绑定表接入，不能新建第二套用户数据或造成同一人多份书籍。公开运营前还必须完成邮箱验证/找回密码、注册和登录限流、HTTPS反向代理、隐私政策、用户协议、数据删除与备份恢复验收。</p><h6>创作台</h6><p>未登录时只显示统一登录/注册页；登录后进入创作台。当前实现提供书籍切换、创作阶段导航和中心工作区，但这些是可持续迭代的实现，不冻结左栏宽度、封面尺寸、导航数量、页面卡片或视觉风格。</p><p>信息架构必须保持四个结果：当前账号/书籍归属清楚，当前创作对象清楚，AI或作者任务状态清楚，下一步和恢复动作清楚。桌面可以使用侧栏、临时双栏比较和上下文面板；手机应转换为抽屉、分段页或全页编辑，不能机械缩小桌面多栏。</p><p>主流程围绕信息、非剧情设定、分卷方向、事件与章纲、正文和结算逐层展开；资料库、取名、团队、任务、灵感和设置是按需辅助能力。导航名称、分组和位置可以在不丢对象、不破坏旧数据的前提下继续重设计。书名原样保存；显示截断只影响视觉和可访问名称，不批量回写作者数据。</p><p>资料库按语义分层：设定来源页集中查看作者已确认设定；配角、势力、地点、地图、道具资源和生效规则分别展示正文结算或明确规则事实形成的正式资料，不重复铺设设定卡。主角独立使用实时面板，显示当前境界/等级、属性、技能、道具装备、资源及获得、消耗或失去的章节历史。配角卡默认只显示姓名和一条首次出场，展开后按来源查看身份、年龄、性格、门派/组织、境界、实力、属性、装备、关系和出场记录。势力查看人数规模、实力等级、驻地和地位；道具资源查看属性、效果、数量、归属与流转。地点查看单点资料，地图按正文到达顺序显示从出生地或首个正式场景开始的世界路线，不虚构坐标和方位。事件时间线只显示故事时间或章节范围加事件名；没有日期时用章节代替，不把人物每章出场、规划说明或结算长文当成时间线。规划对象不能冒充已经发生的资料，确实没有正式来源时才显示空状态。</p><p>当前视觉以安静、耐读、中心内容优先为目标。现有颜色和组件可作为过渡，不构成固定品牌规范；后续整体重设计应统一设计token、字号、间距、状态和响应式，而不是在旧页面继续叠加卡片、边框与说明。</p><p>手机端把浏览器真实可视高度作为应用壳高度。输入法弹出或收起时，当前输入控件自动滚入可见区域，保存、生成、融合、确认等主操作仍可通过页面内容区滚动到达；不得用隐藏业务功能换取适配。</p><h6>作者界面信息洁净</h6><p>主导航负责功能定位，具体形态可随整体信息架构调整。中心页不重复无用标题、宣传式副标题或常驻使用介绍；对象名称、真实进度、错误、影响和待作者选择的内容按实际需要显示。同一含义只保留一次，并优先放在最接近操作的位置。</p><p>创作页面只显示自然语言进度，例如“正在整理本书资料”“编剧正在构思”“方案已准备好”“已保留当前进度”。任务ID、内部状态/阶段键、检查点、ContextPack、哈希、JSON、SQL、Worker、SSE、原始供应商路径和模型内部ID只留在管理员后台审计与模型管理，不进入普通创作页面。静态说明仅在首次空状态、危险操作或容易误解的决定点按需出现。</p><h6>作者展示大白话门禁</h6><p>作者展示层设置统一大白话门禁。动态字段、成员状态、任务进度和错误进入页面前先翻译；内部编号、机器枚举、技术路径和协议字段不能原样显示。小说梗概、章纲叙述、正文和作者原话属于语义保护区，不做可能改变情节含义的机械替词；若故事文本混入资料核对、正史、结算、质量规则、测试说明或系统工作方式，页面停止裸露并提供重新生成或修改入口，不能把内部说明翻译后继续当小说。后台原件和失败证据保持不变。</p><p>门禁同时位于网络响应和组件显示两层。当前作者请求只接收洁净业务投影，失败只显示“发生了什么、资料是否保留、下一步怎么恢复”和不透明恢复编号；任务阶段、供应商、模型、方法、SQL、路径、堆栈和原始错误码仅管理员审计可见。旧缓存前端继续能调用新后端，但也不能获得真实内部供应商、模型和错误详情。</p><h6>AI 状态</h6><p>团队工作区显示全部14名创作成员的真实状态、当前任务、公开上下文摘要、输出摘要、耗时和失败/重试情况，不向普通作者显示模型供应商或内部绑定。模型管理只在管理员后台。小文秘书只显示确定性工具、导航和故障回执，不冒充创作成员。</p><h6>灵感</h6><p>灵感是与正式生产隔离的多成员讨论室。作者可选择1—3名讨论分身围绕当前书交流；讨论分身只读取本书已确认资料和作者本轮问题，不读取其他书，不执行设定、卷纲、事件、章纲、正文、正史或结算写入。讨论内容默认不进入ContextCompiler。作者点击“摘录为灵感”并选择具体业务对象后，摘录才作为带来源的作者原话进入正式流程。</p><h5>3. 开书</h5><p>作者填写并可修改：书名、频道与分类、融合题材、初始角色、必须遵守、金手指或特殊机制、开篇信息及其他自定义想法。书籍简介不在开书时采集：第一卷方案确认后，作者可在书名和书籍简介旁点“主编设计”，由主编依据第一卷故事、已确认设定和开书信息一次设计多套候选，作者选一套直接采用；第一卷未确认时提示先完成第一卷设计。主角性格按外在气质、思考决策、核心驱动力、人际模式、压力反应、道德边界与矛盾成长面分类，并允许自定义。开书任务只接收本书完整开书资料，排除其他书、未摘录灵感和模型猜测。</p><p>创建成功后生成书籍、定位版本、当前团队实例、模型绑定、预算和设定工作区；任何一步失败都不得留下半本书。成功后由作者选择设定项并主动开始AI设计，不自动启动长任务。</p><h5>4. 设定</h5><p>设定只负责书籍骨架，不提前代写卷剧情。四项核心设定固定为“故事舞台”“主角底板”“规则与代价”“边界与留白”；它们始终完整进入后续创作资料包。长期吸引力、力量/成长、势力、角色、资源、冲突方式等按题材和作者需要作为可选项推荐，不因多选就全部挤进每次模型调用。</p><p>设定阶段只读取开书信息、当前项、已确认前置设定和作者本项原话，不读取其他书、未摘录灵感、无关正文或未确认猜测。页面先显示“召集成员讨论”空状态；启动后显示每名参与成员的真实状态、任务、上下文摘要和输出摘要，方案返回后才显示方案卡。作者补充与修改输入默认折叠，按需展开。整份活动设定确认后才解锁分卷。</p><p>当前项由主编和两位编剧独立给出方案。作者可整份选择，也可只摘取多个方案中的片段，和自己的文字一起组成待确认稿；选择按方案稳定ID保存，重新排序或刷新不能错选。普通作者响应不暴露供应商、模型内部ID、任务ID、讨论记录ID或决策ID。</p><h5>5. 分卷</h5><p>作者填写或调整卷名、目标体量、卷目标、卷末状态、节奏偏好和自定义想法。主编组织两位异模型编剧独立设计，作者比较后选择、融合和编辑。</p><p>作者不先选择“三幕式”“五幕式”“猫咪写作法”等专业模板。系统在后台根据本书资料组合适合当前卷的叙事方法，每次至少给出两条真正不同的具体路线；前端只说明“主角为什么行动、局势怎样升级、关键选择与代价、高潮怎样解决、卷末留下什么”，并同时展示每条路线的收益、风险和后续影响。作者可选一条、逐项修改、融合或从空白稿开始。</p><p>第一卷额外生成开篇兑现计划：前500字必须发生可感知变化并建立困境、欲望或异常；前三章分别完成抓住读者、首次兑现并扩大冲突、解决一个小问题并打开更大目标；首个约10万字范围内或第一卷结束前必须完成一次改变局面的重大高潮。它们是针对本书的职责与兑现点，不是固定爽点间隔，也不要求每章机械打脸。</p><p>卷方案同时维护“全书故事脊柱”：长期欲望、核心压力、重大转向、长期兑现和允许探索的空白。它只负责让各卷一环扣一环，不提前填满事件和章节。后续卷读取上一卷真实结算、人物关系、开放问题、未兑现承诺和新局势，再重新生成两条具体路线，不能用上一卷计划冒充已经发生。</p><p>活动卷纲是当前卷未来创作的上层规划权威，不是已发生正史。</p><h5>6. 事件链与事件大纲</h5><p>系统把当前卷拆成有因果衔接的事件链。每个事件至少记录进入时的主角与局面状态、触发条件、目标、阻力、关键选择与代价、事件结果、人物与关系变化、结尾钩子、下一事件接口、预计章数和对应卷任务。事件之间必须形成“上一事件实际结果 → 主角与局面新状态 → 无法回避的新问题 → 主角选择与代价 → 本事件结果 → 下一事件接口”。作者界面默认把同一组正式字段即时呈现为故事动脉与预告卡，明确区分“已经发生”和“预计承接”；不另存第二份摘要。作者可切换细节视图，并移动、插入、拆分、合并和编辑事件。</p><p>选中事件后，编剧在完整事件链和活动卷纲约束下独立设计事件大纲。作者可以不选，或单选一种最想要的阅读感受，如扬眉吐气、细思极恐、关系震荡、意外反转，也可输入自己的话；一次不拼接多套完整节拍，避免要求互相争夺注意力。事件大纲必须说明起因、升级、关键转折、高潮、选择代价、实际可达结果和下一事件接口，但软参考不是硬公式。故事类摘要使用具体行动、选择困境和结果变化表达，不强迫每段套用固定悬念句式。</p><h5>7. 当前事件章纲</h5><p>系统先评估完整事件大纲需要的章节数和总字数，再由指定编剧拆成连续章链并细化单章。每章包含标题、目标字数、开头抓力、场景节拍、信息变化、人物选择、情绪变化、结尾钩子和作者指导意见。</p><p>作者可选“请另一位编剧看看”，让另一位异模型编剧只挑战当前章链候选或单章章纲的关键转折、核心冲突、选择代价与结尾钩子。页面至多显示3条替代思路及其收益、代价和后续影响；不自动融合、不自动采纳，也不产生第二份正式方案。</p><p>章纲读取分层资料包：四项核心设定全文、与本事件相关的可选设定全文、其余设定目录，完整活动卷纲、事件链、当前事件大纲和上一真实结果；挑战任务还冻结当前主方案的精确版本。任何任务都不得越过事件边界擅自规划其他事件。</p><p>第一卷前三章的章纲自动承接已确认的黄金三章职责；第一章还必须把前500字目标翻译为可执行的场景动作、信息变化和章末期待。正文只执行本章职责，不重新发明卷路线。</p><h5>8. 单章正文</h5><p>一次只正式生产当前最前的一章。单一活动写手根据完整章纲创作正文，可在不破坏上层约束的前提下自由处理对话、动作、描写、节奏和细节。正式正文必须是小说场景，不得夹带系统如何核对资料、维护正史、执行结算或评价质量的说明；题材面板和状态信息按当前场景需要自然出现，不要求每章重复完整清单。没有可用创作模型时任务诚实阻断，不自动退回本地验收夹具。</p><p>正文完成后，事实、文学、体验三席使用三种独立模型并行审查：</p><ul><li>事实席只核对设定、人物状态、时间、因果、战力、伏笔和来源。</li><li>文学席关注语言、场景、节奏、重复、人物声音和情绪力度。</li><li>体验席模拟目标读者，判断代入、期待、爽点、困惑和弃读风险。</li></ul><p>三席互不读取报告。作者可直接编辑或要求定点修订；确认后生成不可变定稿版本。</p><h5>9. 结算与下一卷</h5><p>章节结算只根据定稿正文更新事实、人物状态、关系、时间、伏笔、摘要和检索投影。事件完成后比较计划与实际，记录结果、代价、未解决问题和下一事件触发。卷完成后生成卷总结、遗留伏笔和主角当前状态；下一卷用该真实结算生成新的具体路线，不用上一卷计划预测替代实际结果。</p><h5>10. 续写与反向拆解</h5><p>作者可以导入已有正文。系统先解析章节、建立不可变原文和来源，再反向识别已发生设定、人物状态、事件、卷结构和开放问题。分析是带来源的派生候选，不能覆盖原文或冒充作者确认；补齐缺口后进入当前卷—事件流程。</p><h5>11. 模板与作者想法</h5><p>所有叙事方法、节拍和阅读感受都是软参考。作者原话按业务对象保存，并区分：必须、强偏好、灵感、问题。AI 可以提出有代价的替代方案，但不得静默违反“必须”，也不得把灵感自动升级为设定或正史。</p><p>题材、内部方法库和书况可以影响节奏快慢、兑现偏好、关系权重、悬念与反转倾向，但不得形成“每隔若干章一个爽点”“每个事件必须反转”或“固定打脸间隔”等生产公式。后端内部方法库统一提供版本和内容哈希，每个规划版本保存生成时的方法快照；规则更新只能发布新版本，不能原地改写已确认规划。</p><p>ContextCompiler为每份资料标注硬事实、当前任务、软参考或创作空白，并区分计划、确认和实际。硬事实和当前任务不做字符截断；预算不足时先删重复和低相关软资料，仍不足则明确阻断，不能静默丢掉人物、代价、伏笔或因果链。摘要只负责导航，争议必须回查正式源。</p><h5>12. 数据与安全</h5><p>每本书严格隔离。SQLite 正式对象和不可变文件是权威源；全文、向量、图谱、Wiki、摘要均可重建。普通删除为归档，永久删除作者数据需要强确认。来源、原创性、研究与安全检查保留为后台生产门禁，不设置独立页面。</p><h5>创作模型未连接时的作者体验</h5><p>没有可用创作模型时，作者仍可登录、切换书籍、查看和编辑已有设定/规划/章纲/正文、管理资料与导入原文；所有需要AI的入口在任务创建前暂停，并只显示“创作模型尚未连接”和下一步操作。前端不得展示<code>local-deterministic</code>、<code>wenmi-fixture</code>、模型路径、任务ID、ContextPack哈希或测试模板内容，也不得让成员卡片伪装为工作中。</p><p>旧不可变正文如果含内部检查说明、机器载荷或明显技术泄漏，默认显示质量提示而不是直接当小说展开；作者可主动查看历史原稿，原数据不删除。新生成正文必须是故事本身，面板、资源、装备和规则只在人物行动需要时自然出现。</p><hr><h3>UI/UX 重设计方向</h3><blockquote>当前源文件：<code>docs/UI_UX_REDESIGN_DIRECTION.md</code> · 指纹：<code>912876a11e83</code></blockquote><h4>UI/UX 重设计方向</h4><h5>1. 这次要解决的问题</h5><p>当前页面主要问题不是颜色，而是同一屏同时出现太多导航、状态、说明、卡片和操作；作者需要理解系统内部流程，才能知道下一步。手机端又把桌面信息压成多排入口和长卡片，导致首屏看不出当前任务。</p><p>重设计目标：作者进入任意页面后，几秒内知道当前书、当前阶段、AI在做什么、自己要决定什么、下一步是什么。</p><h5>2. GitHub写作产品给出的启发</h5><ul><li><a href="https://github.com/vkbo/novelWriter" target="_blank" rel="noreferrer">novelWriter</a>：项目树稳定组织长篇小文档，编辑面保持克制。启发是“层级随时可见，正文始终最重要”。</li><li><a href="https://github.com/olivierkes/manuskript" target="_blank" rel="noreferrer">Manuskript</a>：大纲、索引卡、故事线和无干扰写作分成不同工作模式。启发是“结构阶段和写作阶段不应共用一套拥挤页面”。</li><li><a href="https://github.com/smith-and-web/kindling" target="_blank" rel="noreferrer">Kindling</a>：写正文时大纲仍可见，但场景节拍可展开，也能切换全页正文。启发是“上层约束靠近正文但默认折叠”。</li><li><a href="https://github.com/Zettlr/Zettlr" target="_blank" rel="noreferrer">Zettlr</a>：稳定编辑区、可折叠工作区和临时多窗格。启发是“比较时才多栏，平时回到单工作区”。</li><li><a href="https://github.com/manuscriptapp/manuscript" target="_blank" rel="noreferrer">Manuscript</a>：iOS/macOS使用同一数据但不同呈现，含项目树、卡片和分屏。启发是“手机不是桌面缩小版”。</li></ul><p>不照抄任何外观，只采用这些成熟的任务结构。</p><h5>3. 新的信息架构</h5><pre class="code-block"><code data-language="text">账号
└─ 当前书
   ├─ 创作进度（开书 → 设定 → 卷 → 事件 → 章 → 正文）
   ├─ 当前工作（此刻唯一主任务）
   ├─ 资料（人物、世界、规则、线程和来源）
   └─ 辅助（团队、任务、灵感、取名、设置）</code></pre><p>创作进度是作者主路径；资料和辅助不应与六个创作阶段在同一层争抢十二个入口。全局任务中心负责跨书汇总，当前对象的AI任务仍在当前页就近显示。</p><h5>4. 页面骨架</h5><p>每个创作页使用相同状态骨架：</p><pre class="code-block"><code data-language="text">当前对象 + 简短状态
        ↓
活动结果 / 当前要完成的内容
        ↓
作者补充（可选、短、按需展开）
        ↓
唯一主操作
        ↓
AI进行中 / 方案比较 / 失败恢复（按状态替换）
        ↓
确认结果 + 下一层</code></pre><p>不要同时铺开作者输入、三份原始方案、质疑、融合稿、质检报告、历史版本和下一步。待决定时重点比较；确认后只留活动定稿和“查看过程/重新设计”。</p><h5>5. 桌面与手机</h5><h6>桌面</h6><ul><li>左侧或顶部保留一个稳定的书籍/阶段定位区，具体形态在原型后确定。</li><li>中间是单一主工作区；方案比较时临时双栏，正文写作时单栏。</li><li>右侧上下文只在写作、核对或审查时按需打开，不常驻。</li></ul><h6>手机</h6><ul><li>顶部只放返回/当前书/更多；阶段切换放进可滑动进度或全页导航，不堆两排十二按钮。</li><li>当前页以单列卡片或无卡片段落为主，一次只看一个方案；底部固定当前状态的主操作，但尊重安全区和键盘。</li><li>书籍、资料和辅助工具进入抽屉或独立页；抽屉不能被遮罩盖住。</li><li>正文编辑全屏优先，“本章任务/相关事实/审查”作为底部抽屉。</li></ul><h5>6. 三种工作模式</h5><ol><li>设计模式：设定、卷路线、事件和章链，强调比较、选择、重排与确认。</li><li>写作模式：正文占中心，最近章纲和事实按需展开。</li><li>复核模式：围绕精确版本展示差异、审查证据、作者修改和实际结算。</li></ol><p>同一对象可以切换模式，但不把三种模式的全部控件同时摆在一屏。</p><h5>7. 视觉原则</h5><ul><li>安静耐读，中心内容优先；少颜色、少厚边框、少阴影、少装饰渐变。</li><li>卡片只在“卡片本身可选择/重排”时使用；普通分组优先标题、留白、分隔线和列表。</li><li>一个强调色同时表达主操作或活动状态，不让多个按钮竞争。</li><li>页面文案是业务语言：状态、范围、影响、动作；删掉宣传语和重复教学。</li><li>字号、间距、圆角、颜色、焦点、状态和动效统一成token，不继续逐页补丁。</li></ul><h5>8. 实施顺序</h5><ol><li>应用壳、导航、手机抽屉和共享页面状态；</li><li>开书信息；</li><li>四项核心设定与按需补设定；</li><li>分卷双路线和首卷强启动；</li><li>事件链、事件大纲、完整章链和近期细纲；</li><li>正文写作、三审和结算；</li><li>资料库、团队、任务、灵感、取名和设置。</li></ol><p>每批先出交互原型和状态表，再实现；共享壳稳定后再统一视觉。旧数据和旧URL保持可读，新旧页面不要长期混用两套状态语义。</p><h5>9. 验收</h5><p>每页覆盖空、编辑、工作中、待决定、完成、失败/恢复；检查360/390/430px和桌面。验证当前书/对象不丢、刷新不漂移、重复点击不重复发任务、键盘不遮操作、长内容不溢出、错误有恢复动作。工程门禁按 <code>docs/ACCEPTANCE.md</code> 的风险矩阵执行。</p><hr><h3>创作工作流 V2 完整设计</h3><blockquote>当前源文件：<code>docs/CREATION_WORKFLOW_V2_DESIGN.md</code> · 指纹：<code>c35add707a82</code></blockquote><h4>创作工作流 V2 完整设计</h4><blockquote>分层创作的当前功能合同和状态见 <code>LAYERED_CREATION_IMPLEMENTATION_AND_ACCEPTANCE.md</code>；本文件描述目标工作流。历史逐项验收只用于专项追溯。</blockquote><h5>1. 核心对象链</h5><pre class="code-block"><code data-language="text">开书资料
  ↓
活动设定版本
  ↓
活动卷纲版本
  ↓
活动事件链 → 当前事件大纲版本
  ↓
完整事件章链 → 最近1—3章详细章纲
  ↓
正文候选 → 作者定稿 → 章节结算
  ↓
事件结算 → 卷结算 → 下一卷</code></pre><p>每一层只规划自己的尺度。上层规定目标、边界和因果，下层保留表达自由。规划是未来，结算是已发生事实。</p><h5>2. 页面与交互原则</h5><ul><li>登录后进入当前账号的创作台。书籍切换、创作阶段和中心工作区是当前基础概念，具体导航位置、封面、卡片和视觉可继续重设计。</li><li>桌面优先提供稳定主工作区和按需上下文/比较面板；手机将侧栏和多栏转换为抽屉、分段页或全页编辑，不缩小硬塞。</li><li>每页按空、编辑、AI工作中、待作者决定、完成、失败/恢复设计；同一状态只保留一个显著主操作。</li><li>顶部/侧边导航只负责定位；当前对象、真实进度、作者输入、AI候选、活动定稿和下一步在内容区清楚区分。</li><li>过程信息完成后收起，正文和作者决定优先；可选说明和高级设定按需展开。</li><li>普通创作页面只用自然语言，不显示任务/讨论/ContextPack/方法/模型内部ID、阶段键、哈希、JSON、SQL、路径、Worker或SSE；技术证据保留在管理员审计。</li><li>360/390/430px无非预期横向溢出，主要触控目标约44px，输入字号至少16px，键盘弹起后当前输入和提交仍可达。</li></ul><p>正式生产通过当前业务对象上的作者补充、AI方案、差异比较、选择/摘片、融合、修改和确认推进。独立灵感不推进状态、不修改正式对象；只有作者主动摘录并绑定目标对象后才成为正式输入。</p><p>当前页面与能力清单见 <code>docs/FEATURE_IMPLEMENTATION_GUIDE.md</code>。清单用于说明功能可达，不冻结入口数量、页面布局或视觉风格。</p><h5>3. 开书</h5><h6>作者输入</h6><p>书名、频道/分类、题材、初始角色、必须遵守、特殊机制、开篇信息和自由补充。每项保留原文与版本。书籍简介不在开书时采集；第一卷方案确认后，书名与书籍简介由主编依据第一卷故事、设定基线和开书信息设计多套候选，作者选一套直接采用。</p><h6>系统动作</h6><p>先校验再原子创建书籍、定位版本、当前团队、模型绑定、预算和设定工作区。创建成功后展示下一步，由作者主动选择设定项并开始AI设计，不自动启动长任务。</p><h6>AI边界</h6><p>开书只做理解和准备，不直接生成卷纲、事件、章纲或正文。</p><h5>4. 设定</h5><h6>交互</h6><p>设定只设计不涉及具体卷剧情的书籍骨架。四项固定核心为故事舞台、主角底板、规则与代价、边界与留白；题材决定的力量、势力、资源、长期吸引力等作为可选项，作者可以以后补。</p><p>进入当前项时先看到任务说明、参与成员和“召集成员讨论”；启动后显示三名成员各自的准备中/工作中/完成/失败状态、实际上下文摘要和输出摘要，方案返回后才显示三份卡片。作者原文、补充想法和修改意见默认折叠，点击时展开。作者可以：</p><ul><li>选一份；</li><li>选取一份或多份完整方案；</li><li>摘取多份方案中的局部片段再组合；</li><li>输入自己的版本；</li><li>补充必须/偏好/灵感；</li><li>要求某一份重做；</li><li>确认、稍后补充、故意留白或不适用。</li></ul><h6>AI介入</h6><p>主编和两位编剧读取同一最小资料包，互相不可见，各给一份真正推荐的方案。选择以稳定方案ID保存；作者选择后仅主编整理，不重新启动全团队。设定成员只在规则、能力、资源或世界逻辑需要时提供检查。作者界面只保留方案正文、理由、收益、代价和恢复入口，不暴露任务、供应商、模型或决策内部编号。</p><h6>解锁</h6><p>只有本书动态计算出的必要项确认后才生成活动设定版本；建议项不能锁死创作。</p><h5>5. 分卷</h5><h6>作者输入</h6><p>卷名、卷目标、预计体量、卷末状态、主要冲突和自由想法。作者可以用大白话补充“这一卷想让读者最期待什么”，不先选择专业结构。</p><h6>具体路线</h6><p>系统在后台从版本化叙事方法库选择并组合适合本书、本卷的骨架，普通创作界面永不显示专业方法名称。每次至少返回两条真正不同的具体路线，直接说明主角动机、局势升级、关键选择与代价、高潮解决、卷末接口、收益和风险。两条路线至少在主角动机、关键代价、高潮解决、卷末局面或升级过程中的两项不同，不能只换标题。</p><p>第一卷候选必须附带故事脊柱和开篇兑现计划：前500字的抓力职责、第一至第三章各自的行动/压力/兑现/下一期待，以及第一卷结束前或约10万字以内的重大高潮。故事脊柱只保存长期欲望、核心压力、重大转向、长期兑现和允许探索的空白，不提前细化事件。后续卷加入上一卷真实结算、人物关系、开放问题、未兑现承诺和当前局势后，重新生成具体路线。</p><h6>AI介入</h6><p>两位异模型编剧分别按冻结的不同内部骨架给出完整卷方案；主编在两份真实方案完成后比较目标覆盖、因果、高潮、人物变化和风险，形成融合候选。作者仍可直接选择、融合和编辑，内部方法来源只进审计。</p><h5>6. 事件链</h5><p>事件链把卷目标拆成可完成的小故事。作者可在生成前补充希望保留的事件数量、顺序或阶段；这些原话绑定当前卷的事件链对象，生成时同时继承确认卷方向仍有效的作者输入，不要求作者重复填写。两位异模型编剧独立拆链，主编只在两份完整候选保存为模型调用证据后融合为一条供作者确认的事件链。候选席从正式编剧岗位中按当前任务的长结构输出能力选择，并继续排除与第一编剧相同的供应商/模型绑定；某个模型已被真实证据证明在完整事件链上连续只输出思考块时，可由另一正式异模型编剧技术补位，但岗位人数、冻结资料包和两候选责任不变。两席并行调用必须全部终态后再统一成功或失败，不能一席先失败就让另一席丢失租约。编剧第二次输出若事件结构与因果合法、唯一问题只是卷责任稳定键漏标，或七项首卷硬责任齐全但额外混入了某个合法卷责任键，可作为内部故事候选交主编补齐映射或由系统过滤误放项；任意伪造键、首卷责任缺失和最终融合稿不适用该例外。方向版本标识由系统绑定当前活动版本，不让模型选择数据库对象。每个事件至少记录：标题、进入时的主角与局面状态、触发、目标、阻力、人物选择与代价、事件结果、人物与关系变化、结束条件与钩子、对应卷任务、预计章数和下一事件接口。</p><p>作者可见事件链默认使用故事动脉：节点显示事件标题、为什么现在发生，以及本卷开场、上一幕已发生或预计承接的局面；节点之间用“因为……所以……”说明因果。选中节点后默认显示由同一组正式字段即时组合的故事预告，包括上一幕、眼前麻烦、不得不作出的选择和这一幕会走到哪里。作者可以切换细节视图查看目标、阻力、选择与代价、结果、人物变化和下一事件接口。故事视图不生成第二份规划、不把预计结果冒充正史，也不能替代后台结构化因果字段。</p><p>事件之间必须用可检查的因果合同承接：上一事件实际结果 → 主角与局面新状态 → 无法回避的新问题 → 主角行动与代价 → 本事件结果 → 下一事件接口。不能只靠巧合、新敌人突然出现或计划摘要代替真实结算。</p><p>作者可以拖动、插入、删除、拆分或合并；系统实时检查因果断裂、章数空洞、卷任务遗漏和上游版本过期。调整不会自动改正文或正史。</p><h5>7. 当前事件大纲</h5><p>页面顶部固定显示活动卷纲任务、完整事件链位置、上一事件实际结果、当前主角与局面状态和下一事件需要的接口。作者可用“这段剧情最想让读者感受到什么”单选一个大白话方向，也可不选或输入自己的话；底层保存版本化软参考快照，但一次不拼接多套完整节拍，所有效果都不能变成必填公式。</p><p>两位编剧独立设计当前事件的起因、升级、转折、高潮、代价、结果和结尾钩子；主编只融合当前事件，不跨事件另造主线。作者可逐部分选案、重写或直接编辑。</p><h6>事件故事视图的表达合同</h6><p>故事类标题和摘要应尽量使用现在时、主动表达、具体人物行动、选择困境和结果变化，使作者一眼看懂故事正在怎样推进。展示层只能重组当前正式字段，不得补写新设定或把AI候选当成已发生事实；生成端也不得强迫每个事件使用“但是”“没想到”等固定句式。故事视图与细节视图读取同一事件版本，作者在细节视图的修改会立即反映到故事视图。</p><h5>8. 当前事件章纲</h5><p>系统先评估事件需要多少章、总字数和节奏分配，再生成完整章链。每章显示：</p><p>第一卷前三章还分别承接已经确认的开篇职责；第一章必须把前500字目标落成场景动作和信息变化。事件高潮章必须落实卷路线要求的关键选择、代价和不可逆结果，不能只写气氛变强。</p><ul><li>章节号、标题和预计字数；</li><li>本章目标与开头抓力；</li><li>2—5个场景节拍；</li><li>人物选择、信息变化和情绪变化；</li><li>本章与事件目标的关系；</li><li>结尾钩子；</li><li>作者指导意见。</li></ul><p>作者先确认完整事件章链，再细化或重做单章。章链不得越出当前事件。</p><p>主方案由指定编剧完成。作者如拿不准关键转折、核心冲突或结尾钩子，可以点击“请另一位编剧看看”，让另一位异模型编剧只针对当前候选版本给出最多3条替代思路。每条说明另一种走法、可能更好之处、需要承担的代价和对后文的影响。挑战意见不生成第二套正式章纲、不自动融合、不改变活动版本；作者可忽略，也可据此手动修改或重新生成。候选换版后，旧挑战意见只留作审计，不再显示为当前建议。</p><h5>9. 单章正文</h5><p>一次只启动一章。写手获得完整本章纲、四项核心设定全文、与本章相关的可选设定全文、其余设定目录、当前卷/事件约束、最近1—3章正式原文与结算、线程账本和按需检索证据；对话、动作、描写和细节可以自由发挥。</p><p>初稿完成后并行启动：</p><ul><li>事实审查：只指出可引用来源的事实矛盾和需确认项。</li><li>文学审查：指出具体段落的语言、节奏、重复、场景和人物声音问题。</li><li>体验审查：用目标读者口吻说明期待、困惑、爽点和弃读风险。</li></ul><p>作者决定是否改。定点修订不能改动未授权情节；定稿生成不可变正文版本。</p><h5>10. 结算</h5><p>章节结算从定稿正文更新已发生事实、人物状态、关系、时间、伏笔、摘要、线程账本和投影。事件结算比较事件大纲与实际，确定下一事件触发。卷结算比较卷纲与实际，形成卷总结、遗留问题和下一卷起点；下一卷根据该真实结算生成两条新的具体路线。</p><p>结算不为了让计划显得正确而改写正文事实。</p><h5>11. 上下文规则</h5><ul><li>开书：完整作者输入。</li><li>设定：完整开书＋当前项＋前置确认＋本项作者原话。</li><li>卷纲：完整开书骨架＋四项核心设定全文＋可选设定导航与按需全文＋上一卷真实结算＋当前状态＋作者卷想法。</li><li>事件链：分层开书/设定资料＋完整活动卷纲＋作者想法。</li><li>事件大纲：压缩上层＋完整事件链/当前事件＋上一事件实际结果和主角新状态。</li><li>章纲：压缩上层＋完整事件链和当前事件大纲。</li><li>正文：完整当前章纲＋活动卷/事件职责＋最近1—3章原文和结算＋相关正史与触发证据。</li></ul><p>其他书、未被作者摘录到当前对象的灵感、过期版本、无关候选和无依据猜测全部排除。</p><p>每个来源标注约束强度（硬事实、当前任务、软参考、创作空白）、真值状态（计划、确认、实际）和业务范围。硬事实与当前任务不按字符静默截断；超预算时先去重、去低相关软参考，仍无法装入则阻断并说明缺口。摘要只导航，事实争议回查正式源。</p><h5>12. 独立灵感</h5><p>作者从顶栏进入灵感，可选择1—3名创作成员的讨论分身。讨论分身只接收本书活动开书资料、已确认设定/规划/正史的压缩导航和作者本轮问题，并按需回查当前书正式源；它们不会获得生产任务租约，也不能调用确认、融合、正文、正史和结算写入。</p><p>每轮显示作者原话、成员身份、真实模型、任务状态和回答。讨论内容只保存在隔离域，不进入生产检索。作者可以把一段回答“摘录为灵感”，选择设定、卷纲、事件、章纲或正文对象及强度；系统保存原文、来源讨论和目标对象，之后由正常ContextCompiler按该对象规则纳入。</p><h5>13. 续写</h5><p>已有正文先预览、确认和不可变导入，再做带来源的反向拆解。作者确认人物、设定、事件和当前状态后补齐活动卷纲与事件；后续与新书使用同一章纲、正文、审查和结算流程。</p><h5>14. 失败与恢复</h5><p>每项生成任务保存幂等键、上游版本、作者输入、成员、模型、上下文包、预算、检查点和结果。已完成席位不重复调用；远程结果未知不自动重发；上游变化使候选过期；作者数据和正式正文不因任务失败回滚或删除。</p><h5>15. 已完成规划的持续可见性</h5><p>活动指针只表示当前可继续修改的对象，不等于历史内容是否存在。事件或卷完成结算后，界面继续展示已确认的卷纲、事件链、事件大纲和全部章纲，并明确标记为只读历史；作者可以核对正文从哪一版规划产生，但不能在历史页误触生成、重写、确认、冻结或结算。进入下一事件或下一卷后，新的活动对象与已完成记录并存。</p><p>状态推进与内容变更必须分开：事件从活动变为已结算、卷从活动变为已完成时，历史章纲继续校验并引用生成当时锁定的事件版本和卷纲版本，界面显示“结算版本已锁定”。只有活动上游真的换版、历史锁定来源缺失或对象被明确标记过期时，才显示重建或异常提示。</p><h5>真实模型前置门禁与长篇放行</h5><p>所有AI生成节点（设定方案、分卷、事件链、事件大纲、章纲、正文、审查、灵感和续写分析）在创建任务前检查真实创作模型。没有真实模型时不自动使用本地夹具、不生成候选、不改变正式对象，只提示作者连接模型；手工编辑、作者原文导入和已有内容阅读不受影响。</p><p>真实长篇生成按20、50、100、200章分段验收，上一阶段未通过故事性、连续性、非重复和作者盲读时不扩大到下一阶段。</p><hr><h3>文秘写作功能实现、交互、AI检索与上下文说明</h3><blockquote>当前源文件：<code>docs/FEATURE_IMPLEMENTATION_GUIDE.md</code> · 指纹：<code>18daa5123c60</code></blockquote><h4>文秘写作功能实现、交互、AI检索与上下文说明</h4><p>本文件说明当前版本每个作者功能“怎么用、页面如何反馈、后台如何实现、AI成员何时介入、检索什么以及明确排除什么”。它描述当前生效版本，不包含旧聊天工作流、旧页面名称或已经退出的功能。</p><h5>1. 全局界面与共同规则</h5><p>应用打开后直接进入创作台。左侧是单列竖版书籍封面栏，点击封面只切换当前书；顶部是信息、设定、分卷、规划、章纲、正文、资料库、取名、团队、任务、灵感和设置，点击只切换中心页面。书名不在顶部重复，页面已经能从入口和当前内容理解的介绍不再常驻显示。</p><p>所有作者可见动态文字先经过大白话展示门禁。页面不显示任务ID、数据库键、原始模型ID、JSON、内部阶段名、哈希、Worker或上下文包名称。技术原件继续写入后台审计，错误、取消、重试和恢复入口不能因为隐藏技术细节而消失。</p><p>共同数据规则：</p><ul><li>每次请求都携带当前<code>owner_id</code>和<code>book_id</code>，其他书籍不能进入结果；</li><li>正式对象保存活动版本，修改上游后先做影响判断，下游候选失效或要求重新确认；</li><li>正文每次修改创建新的不可变完整版本，不覆盖旧正文；</li><li>规划表示未来，章节/事件/卷结算表示正文实际发生，二者分开；</li><li>作者确认设定、正式正文和结算是权威源，摘要、图谱、资料卡和向量是可重建投影；</li><li>作者未写明、正文未发生或来源不足的内容显示未知，不由AI补造。</li></ul><h5>2. 十二个顶部功能</h5><h6>2.1 信息</h6><p><strong>作者交互：</strong> 查看和修改书名、频道、分类、题材、初始角色、必须遵守和其他开书资料，并查看当前书籍简介；页面不再展示故事方向、标签和作者意见入口。书名最多15字。书名和书籍简介旁的“主编设计”在第一卷方案确认后，由主编依据第一卷已确认方案、设定基线和开书信息一次产出多套候选，作者选一套直接采用；第一卷未确认时提示先完成第一卷设计。修改时显示会影响哪些后续对象，保存后回到干净的资料阅读态。</p><p><strong>后台实现：</strong> 开书字段保存在逐书定位与开书蓝图的活动版本中。修改创建新版本并更新活动指针，不重写旧版本、正文或来源记录。</p><p><strong>AI与上下文：</strong> 开书本身只接收作者填写的全部开书信息，不使用RAG猜缺失字段。定位分析可整理作者原话，但不能引入其他书、灵感讨论、后续规划或AI猜测。</p><h6>2.2 设定</h6><p><strong>作者交互：</strong> 初始页面只显示模块、真实进度和“召集成员”操作；未启动前不预放方案卡。启动后显示参与成员的自然语言状态，三份独立候选产生后才展示卡片。作者可比较、选取、融合、重写、直接编辑并逐项确认；作者补充输入默认折叠。</p><p><strong>后台实现：</strong> 每个设定模块有候选、决定、活动版本和来源。只有作者确认的内容进入设定基线和“设定来源”，讨论中内容不进入正史。</p><p><strong>AI与上下文：</strong> 主编组织当前模块，独立策划成员各自产生方案，融合角色只读取已经保存的候选。上下文包含完整开书信息、当前设定模块、作者对此模块的原话/附件和必要已确认依赖设定；排除卷纲、事件、正文、其他书、未摘录灵感和旧候选。</p><h6>2.3 分卷</h6><p><strong>作者交互：</strong> 选择当前卷，填写本卷想法，查看2—3个适合本书的节奏建议，也可展开更多、不选、混合、重排或自定义。候选出现后比较差异并确认卷目标、主要冲突、人物变化、高潮、代价和卷末入口。</p><p><strong>后台实现：</strong> 卷纲有活动版本、候选、决定、上游设定版本和影响链。确认卷纲后才能确认该卷事件链。</p><p><strong>AI与上下文：</strong> 主编统筹卷级方案；上下文包含覆盖全部开书字段的核心包、活动设定、长期承诺、作者卷意见和卷级软模板。后续卷另加上一卷真实结算、当前人物/势力/资源状态和开放线索。排除未实现规划冒充历史、其他卷全文和全库堆叠。</p><h6>2.4 规划</h6><p><strong>作者交互：</strong> 先查看当前卷的故事动脉，再点入一个事件设计完整事件大纲。节点卡显示事件标题、为什么现在发生，并区分本卷开场、上一幕已发生和预计承接；节点之间以“因为……所以……”解释因果。选中后默认显示上一幕、眼前麻烦、人物选择和这一幕终点的故事预告，可切换细节视图核对目标、阻力、选择与代价、结果、人物变化、下一事件接口、章节范围和卷任务。阅读感受方向只用大白话呈现，专业模板来源不在普通界面出现；作者可不选、混合、自定义、加入灵感、比较两份独立方案并按段融合。上层变化时显示具体影响和重建入口，而不是只显示模糊警告。</p><p><strong>后台实现：</strong> 事件链、事件、事件大纲分别版本化；卷纲约束事件链，事件链约束当前事件大纲。事件有计划状态和结算状态，已发生结果来自正文结算。</p><p><strong>AI与上下文：</strong> 事件链接收开书核心、活动设定、完整卷约束和作者事件链意见。事件大纲额外接收完整事件链、当前事件卡、上一事件真实结算或卷首状态、当前事件作者原话和按需检索的相关人物、势力、地点、道具、规则、线索与前因。其他事件完整大纲、未来结算和未摘录灵感不进入。</p><h6>2.5 章纲</h6><p><strong>作者交互：</strong> 系统先评估当前事件需要多少章和字数，再生成完整章链。每章显示章节任务、场景、关键行动、信息揭示、情绪变化、开头/结尾钩子和结束状态。作者可逐章修改、重写、调整顺序或确认。对关键转折拿不准时，可点击“请另一位编剧看看”；页面只显示最多3条自然语言替代建议，并明确收益、代价和后续影响，作者可以完全忽略。</p><p><strong>后台实现：</strong> 章纲绑定当前事件大纲版本和章节位置；批量生成仍逐章保存并校验连续性。挑战任务冻结精确章链候选或单章章纲版本，只把结果保存到任务检查点，不写入正式章纲、不自动融合。目标换版后旧建议不再作为当前建议。事件大纲变化后，未确认章纲失效或要求重建。</p><p><strong>AI与上下文：</strong> 指定编剧生成主方案；另一位异模型编剧仅在作者触发时挑战关键节点。主方案上下文包含压缩但覆盖完整的开书、设定、卷纲和事件链，完整当前事件大纲、上一真实结算和作者章链/单章意见。挑战者再读取精确主方案版本，但不读取其他候选、聊天或审查报告。系统不只给一个摘要，也不加载其他事件全文。</p><h6>2.6 正文</h6><p><strong>作者交互：</strong> 一次聚焦一章。主笔生成初稿后进入事实、文学和体验三份独立审查；页面显示正文和可定位的自然语言建议。作者可直接编辑、定点重写、保留满意部分或定稿。定稿前不会结算，下一章不能绕过活动章纲直接生成。</p><p><strong>后台实现：</strong> 正文是不可变完整版本；活动写手只有一个结果进入审查。三席绑定同一正文和章纲但互不读取报告。作者定稿后执行章节结算，更新正式事实、人物状态、来源、检索投影和当前进度。</p><p><strong>AI与上下文：</strong> 主笔接收开书核心、活动设定、卷约束、事件链、完整事件大纲、完整本章章纲、必要前章、当前正史、作者意见和明确自由区。事实席检索规则、时间、能力、知情、人物状态、道具和来源；文学席检索人物声音、情绪与必要近期原文；体验席读取卖点、目标读者、事件位置和期待兑现。三席报告隔离。</p><h6>2.7 资料库</h6><p><strong>作者交互：</strong> 在13个页签查看设定来源、主角实时状态、配角档案、势力档案、地点、世界路线图、道具资源、事件时间线、生效规则、标签、待补内容和内容来源。右上角“关系与轨迹”切换到关系图。资料详情可展开，来源可回查。</p><p><strong>后台实现：</strong> 实体、正式事实、关系、人物状态史、结算事件和来源存在SQLite权威表；资料档案与世界路线是可重建查询视图。资料库不写剧情，不把规划直接升级为正史。</p><p><strong>AI与上下文：</strong> 事实席在章节结算时只提取正文明确、会影响后续的持久事实。类型字段是可选语义，不要求每章或每本凑齐。资料库本身用于结构化直达和检索导航；ContextCompiler只为当前任务选择必要字段，不把整个资料库塞入每次模型调用。</p><p>资料库各页签详见第3节。</p><h6>2.8 取名</h6><p><strong>作者交互：</strong> 选择人物、势力、地点、物品等目标，填写语义、风格、禁用字和数量，生成候选后挑选或复制。候选不会自动创建正式人物或改写正文。</p><p><strong>后台实现：</strong> 保存命名请求、候选、来源和采用状态；采用后仍要绑定到明确业务对象或由作者写入正式内容。</p><p><strong>AI与上下文：</strong> 只读取当前书题材、语言风格、目标对象、相关已确认设定和作者禁用条件。排除其他书名字、未确认候选和无关全文，避免串名。</p><h6>2.9 团队</h6><p><strong>作者交互：</strong> 显示14名创作成员的真实状态卡：等待什么、正在处理什么、使用的上下文摘要和已完成输出摘要。点击卡片查看经过整理的信息，不显示思维链。</p><p><strong>后台实现：</strong> 状态来自任务、心跳、模型调用和工具事件，不使用定时动画伪造。岗位、成员实例和模型绑定分离；普通作者只看成员与业务状态，完整模型来源只在管理员审计。</p><p><strong>AI与上下文：</strong> 团队页不额外触发创作。每次成员调用使用与具体业务任务绑定的冻结ContextPack；上下文详情只显示可公开摘要，原始包留在审计层。</p><h6>2.10 任务</h6><p><strong>作者交互：</strong> 按书查看等待、运行、完成、失败、暂停和需要处理的任务。可取消、继续、重试或查看影响；状态使用“正在整理设定”“正在写第3章”等大白话。</p><p><strong>后台实现：</strong> 任务使用幂等键、租约、检查点、取消栅栏和晚到结果隔离。失败恢复不重复提交已完成正式对象；结果未知需要调和后才能重试。</p><p><strong>AI与上下文：</strong> 任务页不改变成员上下文。重试沿用冻结输入或明确创建新任务版本；如果上游版本已经变化，旧结果拒绝落库。</p><h6>2.11 灵感</h6><p><strong>作者交互：</strong> 作者与独立灵感分身讨论人物、情节或选择。讨论只给启发，不生成或修改设定、卷纲、事件、章纲、正文和正史。作者必须主动“摘录并绑定”到具体业务对象，内容才成为该对象的作者输入。</p><p><strong>后台实现：</strong> 灵感消息与正式对象、任务和正史分库存储；未摘录讨论不会进入正式检索，也不形成持续聊天记忆。</p><p><strong>AI与上下文：</strong> 灵感成员可读取当前书作者允许的资料帮助讨论，但输出是建议。正式创作成员排除未摘录聊天；摘录后只读取绑定目标、原文和作者强度。</p><h6>2.12 设置</h6><p><strong>作者交互：</strong> 管理主题、字体和普通运行偏好；不显示模型供应商、内部绑定或密钥。模型方案、算力消耗和连接管理位于管理员后台。</p><p><strong>后台实现：</strong> 模型绑定有版本和生效时间，只影响未来任务和新快照；已完成调用保留真实审计。密钥只来自环境变量，不在任何页面回显。</p><p><strong>AI与上下文：</strong> 设置页不触发内容生成，也不修改已有上下文包。未来任务按管理员当前有效绑定选择模型；没有可用真实创作模型时诚实阻断，不用确定性夹具冒充创作。</p><h5>3. 资料库十三个页签</h5><div class="table-scroll"><table><thead><tr><th>页签</th><th>作者看到什么</th><th>数据来源与实现</th><th>空缺处理</th></tr></thead><tbody><tr><td>总览</td><td>当前书的实体、事实、关系、事件、标签、待补数量和开书摘要</td><td>按当前书聚合权威表和开书活动版本</td><td>只显示真实计数</td></tr><tr><td>设定来源</td><td>作者逐项确认的设定原文、板块和确认来源</td><td>活动设定基线</td><td>未确认候选不显示</td></tr><tr><td>主角</td><td>当前境界/等级、属性、技能、装备、资源、伤势、身份及完整变化史</td><td>主角状态追加账本；获得、更新、消耗、失去均保留章节/时间</td><td>不可归类项进入待确认，不猜分类</td></tr><tr><td>配角</td><td>折叠态只显示姓名和首次出场；展开身份、年龄、性格、门派、境界、实力、属性、装备、关系和出场记录</td><td><code>character</code>实体中排除主角，按正式事实语义聚合</td><td>每个未写明字段显示“尚未写明”</td></tr><tr><td>势力</td><td>负责人、人数规模、整体实力、等级、驻地、地位和成员</td><td><code>organization</code>实体及本书事实；可从明确人物所属关系反向得到成员</td><td>不用世界观说明填空</td></tr><tr><td>地点</td><td>地点类型、所属区域、方位、特点和出场记录</td><td><code>location</code>实体和正式事实</td><td>没有方位就保持未知</td></tr><tr><td>地图</td><td>从出生地或首个正式场景出发，按章节连接实际到达的大地点</td><td>地点首次正式出现、明确出生地和作者初始地图说明；仅大范围节点进入路线</td><td>不生成坐标；无方向证据不显示东南西北</td></tr><tr><td>道具资源</td><td>类型、等级品质、属性、效果、数量、当前归属、状态和获得/转移/消耗/失去记录</td><td><code>item/resource/skill/stat_panel</code>实体、事实和明确持有关系</td><td>不从名字猜属性和主人</td></tr><tr><td>事件时间线</td><td>每行只显示故事时间或章节范围＋事件名</td><td>已结算事件、章节覆盖和事件结算；详细摘要留后台</td><td>无年月日时直接显示章节范围</td></tr><tr><td>生效规则</td><td>真正约束后文的确认规则和规则事实</td><td>明确规则设定及<code>world_rule</code>实体</td><td>策划理念不重复显示</td></tr><tr><td>标签</td><td>标签名称、说明、适用对象和使用数量</td><td>标签定义与分配关系</td><td>新标签不自动改正文</td></tr><tr><td>待补内容</td><td>已发现且需要以后补充或确认的信息缺口</td><td>资料缺口记录，带目标、严重性和状态</td><td>不以AI猜测自动关闭</td></tr><tr><td>内容来源</td><td>按对象列出事实、来源章节和正文短依据</td><td>正式事实与不可变稿件来源</td><td>技术ID和内部证据级别不直接展示</td></tr></tbody></table></div><p>关系与轨迹视图从正式关系投影读取人物、势力和其他对象之间的有向关系。没有可靠关系时显示空状态，不能用共现代替关系。</p><h5>4. AI成员介入与任务包</h5><p>当前产品配置为14名创作成员。普通作者可在团队页查看姓名、岗位与真实业务状态，模型绑定只在管理员后台查看；业务职责按节点划分：主编统筹全局与融合，策划/编剧提供独立方案，数据准备角色编译上下文，活动主笔写正文，事实/文学/体验三席独立审查，维护角色负责结算与长期连续性。小文秘书是本地工具，不是第12名创作成员，不给剧情结论。</p><p>每次模型调用都保存：目标对象、冻结上游版本、作者原话、纳入与排除来源、预算、调用快照和结果。系统不保存或展示思维链。</p><p>上下文按任务动态编译：</p><ol><li>直接放入当前活动上游对象和作者原话，不与相似度结果竞争；</li><li>生成结构化查询计划，确定人物、势力、地点、道具、规则、时间、因果和原文需求；</li><li>按需组合结构化直达、全文、向量、关系、时间/因果和正式原文回查；</li><li>过滤其他书、失效版本、无来源候选、未摘录灵感和错误时间；</li><li>按权威、任务相关、时间与因果必要性重排，预算内裁剪；</li><li>保存来源指纹，提交结果前再次核对上游版本和正史水位。</li></ol><p>不存在一份固定“岗位永远读取这些内容”的永久包。相同成员在设定、事件、正文或审查任务中读取的资料随当前对象变化。类型化资料档案帮助精准定位，但不会自动全部进入上下文。</p><h5>5. 版本、失效、结算与恢复</h5><ul><li>设定变化：提示受影响的卷、事件、章纲和未定稿正文候选；作者查看影响后重建或保留；</li><li>卷纲变化：当前卷事件链和下游候选需要重新校验；</li><li>事件链变化：受影响的事件大纲和章纲失效；</li><li>事件大纲变化：当前事件章纲和未定稿正文候选失效；</li><li>章纲变化：对应未定稿正文候选失效，已定稿正文不自动改写；</li><li>章节结算：只读取作者确认正文，写入实际事实、状态、来源和检索投影；</li><li>事件结算：汇总该事件已结算章节的实际结果、代价、人物状态和下一触发；</li><li>卷结算：汇总本卷全部事件实际结果、开放线索和下一卷真实入口。</li></ul><p>任务失败时从检查点恢复；模型超时、格式错误或取消都有明确状态。晚到结果、过期上游结果和跨书结果拒绝落库。普通删除是归档；正文、已合并迁移和作者原件不随代码清理删除。</p><h5>6. 验收时作者应看到的结果</h5><ul><li>每个入口可点击，切换页面不乱跳、不白屏；</li><li>页面没有重复标题、重复说明、机器键、英文协议或乱码；</li><li>配角、势力、地点、地图和道具各自显示正确语义，不再共享一套通用卡；</li><li>未知字段诚实显示“尚未写明”，不会看起来像已经设定；</li><li>时间线每行只有时间/章节和事件名，详细证据仍可从来源回查；</li><li>地图路线来自实际章节，不制造方向和坐标；</li><li>其他书籍内容不会出现在当前书；</li><li>上游变化会说明具体影响并提供恢复入口；</li><li>AI成员状态来自真实任务，候选、融合、正文和三席审查可追溯；</li><li>文档、代码、测试和桌面文档中心在每次开发结算后同步到同一当前版本。</li></ul><h5>14. 统一账号与管理员后台</h5><p><strong>前端交互：</strong> 未登录时只显示登录/注册页。注册填写昵称、邮箱、至少10位密码和确认密码；登录只填邮箱密码。登录后左栏底部显示当前昵称和身份，并提供退出；管理员额外显示“管理”入口。管理页显示用户总数、启用/暂停数、已注册账号名下的“用户书籍”总数、搜索和状态筛选；每个用户显示昵称、邮箱、角色、状态和注册/最近登录时间，可暂停或恢复。</p><p><strong>后端逻辑：</strong> 注册以事务创建账号归属。首个账号原子授予admin；如果账号体系启用前已有未认领的本机老板所有者和书籍，则直接复用该owner，使原书籍、正文、资料库、任务和上下文完整归入管理员账号，不复制任何创作表。第二个及以后账号创建全新owner。密码用scrypt，登录令牌只以摘要落库。请求策略先验证Host/Origin/跨站写入，再从Cookie解析账号；领域路由统一使用会话owner。管理员状态变更写审计，暂停同时撤销全部会话。</p><p><strong>上下文与检索：</strong> 账号、邮箱、密码、会话和管理员审计不属于创作资料，ContextCompiler始终排除。登录owner只作为硬隔离范围，不能成为故事内容或AI提示。AI成员只能检索当前owner下当前书的已允许来源。</p><p><strong>当前边界：</strong> 邮箱密码和管理员核心已实现；桌面启动不会自动签发会话，未登录访问受保护接口返回401，真实流程验收脚本必须通过 <code>WENMI_E2E_EMAIL</code> 与 <code>WENMI_E2E_PASSWORD</code> 登录。公开运营前仍需邮箱验证/找回、持久限流、HTTPS、协议隐私、账号导出/注销和生产备份。手机号、微信以后绑定到现有用户。</p><hr><h3>文秘写作使用说明</h3><blockquote>当前源文件：<code>docs/USER_GUIDE.md</code> · 指纹：<code>ef59f84e0fd9</code></blockquote><h4>文秘写作使用说明</h4><h5>启动与停止</h5><p>双击桌面的“文秘写作”入口，等待浏览器打开。首次使用请在登录页用邮箱、昵称和至少10位密码注册；系统中的第一个账号会成为管理员。以后使用同一邮箱和密码登录。若桌面入口缺失，可双击项目根目录的“文秘写作-启动.cmd”。若启动窗口提示错误，不要重复点击，记录错误后再处理。停止时使用“文秘写作-停止”入口，只停止本项目登记的进程。</p><h5>新建一本书</h5><ol><li>在创作台左侧书籍栏点击“新建书籍”。</li><li>填写书名、频道/分类、题材、初始角色、必须遵守和自己的补充想法。</li><li>确认创建后进入设定。确认第一卷方案后，可在“信息”页点书名或书籍简介旁的“主编设计”，让主编依据第一卷故事、设定和开书信息设计多套书名或简介候选，选一套直接采用。</li><li>在每个设定项查看主编与两位编剧的独立方案；选择、组合、直接改写或要求重做。</li><li>所有当前必需设定确认后进入当前卷。</li></ol><h5>规划当前卷</h5><ol><li>填写卷目标、预计体量、卷末状态和自己的想法。</li><li>选择大白话节奏参考，也可以不用或混合多个模板。</li><li>比较 AI 候选，确认活动卷纲。</li><li>生成事件链，检查每个事件为什么发生、解决什么、带来什么新状态。</li><li>选中当前事件，生成并确认完整事件大纲。</li><li>让系统评估章数和字数，再生成当前事件章纲。</li></ol><h5>写正文</h5><ol><li>打开章纲，补充本章指导意见。</li><li>点击开始撰写；一次只正式生成一章。</li><li>查看事实、文学、体验三份独立报告。</li><li>直接编辑或让写手按指定建议修订。</li><li>满意后定稿，系统才会结算本章事实和状态。</li></ol><h5>事件和卷结束</h5><p>事件全部章节定稿后查看事件结算，确认实际结果、人物变化、遗留问题和下一事件触发。当前卷完成后查看卷结算，再规划下一卷。规划内容不是正史，只有定稿正文及确认资料才记录已发生事实。</p><h5>续写已有作品</h5><ol><li>新建书时选择导入已有正文。</li><li>核对章节识别和顺序后确认导入。</li><li>原文保存为不可变版本，系统不会改写。</li><li>查看带来源的反向拆解结果，确认或修改人物、设定、事件与当前状态。</li><li>补齐当前卷、事件和章纲后继续写作。</li></ol><h5>资料库和取名</h5><ul><li>资料库统一查看人物、势力、地点、物品、规则、事件、关系、情绪、伏笔、信息差、来源、冲突与缺口。</li><li>取名按人物、地点、势力、物品、生灵和能力生成候选，不会自动写入设定。</li></ul><h5>AI 成员状态</h5><p>顶部“团队”显示全部14名创作成员。“准备中”表示正在编译本次资料；“工作中”表示真实模型调用已经发出；“完成”表示结果已保存；“失败/超时”会显示原因和可执行操作。小文秘书不计入人数，也不作为创作成员显示。</p><p>所有AI任务都在服务器后台执行：下达任务（开书、续写、设定讨论等）后即可关闭页面或退出登录，任务不会中断，重新打开后可在任务中心查看进度与结果。不同用户、不同书籍的任务同时并行执行，互不排队；同一本书内同时只执行一个任务，以保证设定与正文的一致性。章节生成到“审校检查点”时会暂停等待作者确认，这是功能设计而非中断，确认后继续。</p><h5>书籍与创作导航</h5><p>登录后可以切换当前书、创建或归档书籍，再进入当前书的创作阶段。当前版本仍可能使用左侧书籍区和顶部功能区，但后续会持续调整；请以页面显示的当前书名、当前对象状态和主操作为准。</p><p>手机端书籍和辅助功能可能收进抽屉或分段页面；桌面端可能提供更宽的对象导航和临时比较面板。无论布局如何变化，切换书籍不会改写数据，长书名保留原文，显示截断不影响正式书名。开发验收运行标识只转换为普通中文标签，内部标识不展示给作者。</p><h5>数据边界</h5><p>作者输入、附件、选择和反馈保存在所属对象中，不写入聊天记忆。其他书不会进入当前书上下文。摘要和向量只用于导航，事实争议会回查正式资料和定稿正文。</p><h5>测试与备份说明</h5><p>开发和自动测试可以使用确定性假模型验证流程、格式与恢复机制，但它不代表真实模型的文学质量，也不能冒充真实模型调用。当前Git历史与同一磁盘上的副本都不等于第二物理备份；重要书籍应另存到另一块物理磁盘后，才能声称具备该级别灾备。</p><h5>查看已完成的规划</h5><p>事件或整卷完成后，规划和章纲不会消失。进入“规划”可以查看已完成事件链、每个事件的大纲和版本；进入“章纲”可以查看该事件全部已确认、已冻结的章纲；一卷包含多个已完成事件时，可在页面顶部切换事件。历史页只供核对和复制，不显示重新生成、冻结、写作或结算按钮。若正文已经存在而这两页为空，应视为界面或工作流缺陷，不能按“正文数量足够”判定流程通过。</p><h5>当前项目文档合订版</h5><p>桌面“文秘写作项目文档”首页顶部提供“一页看完当前项目”。打开后可在一个页面阅读并复制全部现行产品、流程、AI成员、上下文、检索、架构、数据、验收和Skill资料。项目根目录中的 docs/PROJECT_REFERENCE_BUNDLE.md 是同一内容的Markdown版本，适合整体复制给外部顾问。</p><h5>账号与管理员</h5><p>本机使用也需要登录。退出后当前浏览器会话立即失效，但书籍仍保留在该账号下。左栏底部显示当前昵称、身份和算力值余额；管理员点击“管理”可查看用户统计、搜索用户并暂停或恢复普通账号。暂停账号后其已有会话立即失效。当前没有上线邮箱找回密码、手机号或微信登录，公开邀请其他人之前应先补齐这些运营能力。</p><h5>会员与算力值</h5><p>普通账号需要管理员开通会员后才能生成内容。会员分三档：包月（3亿算力值）、包季（10亿算力值）、包年（百亿算力值），算力值即token，按周期内实际生成消耗扣减，用完或到期后生成会被暂停，续费后立即恢复。管理员账号不限算力值。无生效会员的非管理员账号在进入书籍工作区时，会看到可关闭的“内测说明”弹窗，提示需要联系管理员微信595341366开通会员；关闭后仍可浏览书籍与资料，但调用AI生成（开书、续写、分析等）时会被“会员提示”弹窗阻断。弹窗每20秒自动刷新会员状态，管理员开通后自动解除限制，也可点击“刷新会员状态”立即生效。服务端同时有生成门禁兜底，未开通或算力值用完的账号即使绕过前端也无法创建生成任务。管理员在“管理”页选择套餐即可开通或续费，也可撤销会员，并能查看每个账号的周期消耗与累计消耗。</p><hr><h3>分层创作系统：当前方案与验收</h3><blockquote>当前源文件：<code>docs/LAYERED_CREATION_IMPLEMENTATION_AND_ACCEPTANCE.md</code> · 指纹：<code>4f18e2297950</code></blockquote><h4>分层创作系统：当前方案与验收</h4><blockquote>本文是分层创作的当前功能合同和状态表，不再承担每次开发的148项全量门禁。旧总表完整保留在 Git 基线 <code>e8517d9</code> 的同名文件中。</blockquote><h5>1. 目标</h5><p>让小白作者不需要一次填完整本书，而是在需要时完成当前层：开书定方向，设定定非剧情骨架，卷定大故事，事件定因果小故事，章纲定近期表达，正文执行，结算把真实结果带回下一层。</p><p>硬参考只约束不能违反的事实和当前任务；软参考允许AI调整；开放区明确留给创作发挥。任何层都不能把未确认计划冒充已发生事实。</p><h5>2. 对象与职责</h5><div class="table-scroll"><table><thead><tr><th>层级</th><th>负责</th><th>不负责</th></tr></thead><tbody><tr><td>开书信息</td><td>题材、目标读者、基调、基础承诺、作者已有想法</td><td>世界百科、整书剧情</td></tr><tr><td>非剧情设定</td><td>世界舞台、主角底板、规则与代价、边界与留白；扩展设定按需补</td><td>卷剧情、事件顺序、章场景</td></tr><tr><td>全书故事总线</td><td>长期核心矛盾、主角长期欲望、最终方向和可开放线程</td><td>固定每卷细节</td></tr><tr><td>卷方向</td><td>本卷开场局面、推动、升级、关键选择、高潮、代价、卷末新局面、重点表达</td><td>逐事件排期和逐章场景</td></tr><tr><td>事件链</td><td>卷内事件顺序、因果、承诺/铺垫/兑现责任</td><td>事件内部全部场景</td></tr><tr><td>事件大纲</td><td>当前小故事的目标、对立、转折、高潮、后果和下一事件接口</td><td>逐章正文表达</td></tr><tr><td>完整章链</td><td>当前事件全部章节的责任与顺序</td><td>远期章节细节冻结</td></tr><tr><td>近期详细章纲</td><td>最近1—3章的场景、人物行动、情绪、信息、回报与章末接口</td><td>代写完整正文</td></tr><tr><td>正文与结算</td><td>正文自由表达；结算记录实际变化、事实、线程和后续影响</td><td>用计划替代实际</td></tr></tbody></table></div><p>作者原话绑定具体对象，区分必须遵守、强烈偏好、灵感参考和需要先问。AI未采用作者原话时要说明原因；作者可以修改、留空、重做或回到上层。</p><h5>3. 设定体验</h5><p>默认只显示四项核心设定：</p><ol><li>世界舞台；</li><li>主角底板；</li><li>规则与代价；</li><li>边界与留白。</li></ol><p>系统可按题材推荐扩展设定，但不能让作者多选一大串后才允许写作。写到需要时再补设定：立即补、带着明确空白继续、或把它作为本层开放问题。扩展项没有确认时不注入下游硬上下文。</p><p>每项可由多名编剧独立提出方案，作者可整选、摘片、补自己的话、融合、编辑和重新设计；选择必须刷新不漂移，确认后收起旧候选，只保留定稿和重做入口。整份设定质检只处理会阻断下游的真实矛盾，不替作者自动确认。</p><h5>4. 内部结构方法与卷路线</h5><p>三幕式、五幕式、英雄之旅、故事圈、七点式、八序列、黄金三章、爽点/悬念/单元剧/多线等保存在后台版本化方法库。每项记录适用问题、长度/题材、可移动节点、套路风险、版本和指纹。</p><p>作者不看方法名、幕、节拍或内部键。卷设计读取开书、活动设定、故事总线、上一卷真实结算和作者本卷想法，判断当前卷最需要解决的任务，再选择两条不同的内部路线交给独立编剧。每名编剧只收到自己的精简软参考。</p><p>普通页面展示至少两条代入本书的具体路线，包括：开场局面、推动事件、主角行动、阻力升级、关键选择、关系变化、高潮、代价、解决结果、卷末状态、好看点和风险。两条路线至少在主动/被动、对立力量、因果路径、关键选择、关系变化、代价、高潮触发、卷末状态或读者体验中的多个维度有真实区别，不能只换措辞。</p><p>作者可整份选择、跨方案摘片、让主编融合、自己编辑或全部重做。事件链只接收确认后的故事责任，不接收内部方法名。后续卷根据上一卷实际重新选择结构，不继承固定模板。</p><h5>5. 首卷强启动</h5><p>首卷强启动属于第一卷设计，不属于设定。效果必须达到，写法由AI针对题材设计。</p><ul><li>主要追读动力：爽感、冲突、情绪、秘密、新奇、人物、关系或混合。</li><li>前500有效正文字符：明确读者为什么继续看，包括即时处境、情绪抓力、读者问题和马上会发生的变化。</li><li>黄金三章：第一章进入处境并启动；第二章主动行动、阻力升级并展示独特看点；第三章给第一次明确回报，同时打开更大期待。</li><li>持续追读：处境、关系、身份、信息、能力/资源、目标、冲突和阶段回报持续发生有效变化。</li><li>重大高潮：不晚于累计约10万有效正文字符；短卷在卷末完成。必须兑现重要承诺，包含重大选择、代价、主要冲突变化、不可逆新局面和下一阶段入口。</li><li>防疲劳：冲突类型、爽感/压迫、情绪/回报和快慢节奏要换味，不能连续复制同一种打脸、误会、追杀或反转。</li></ul><p>事件链必须标明谁承载开篇、黄金三章、早期回报、升级、高潮铺垫、高潮和后果。第一事件先形成三章整体启动包，只冻结第一章；每章结算后保留总体承诺并校准后续细节。系统按定稿正文累计有效字符，提前预警高潮可能逾期，不等到最后一刻突然切高潮。</p><h5>6. 事件、章纲与衔接</h5><p>事件链遵循：承诺提出 → 人物行动 → 阻力升级 → 阶段回报 → 新局面 → 再升级 → 高潮兑现 → 后果。数量由卷任务决定，不用固定十事件。</p><p>当前事件大纲要说明它从上一实际结果如何开始、人物要什么、谁/什么阻止、关键选择、转折与代价、如何结束、留下什么事实和下一事件问题。事件阅读感受是可留空的单选软参考，不允许一次多选整套节拍。</p><p>完整章链保证当前事件有完整顺序；详细章纲只滚动细化最近1—3章。第一章额外包含前500字兴趣锚点、主角即时处境、第一处有效变化、独特看点首次露出、小回报和章末期待。第一章明显全是说明或无抓力时定点重写，不直接继续第二章。</p><h5>7. ContextCompiler与资料包</h5><p>每次调用只编译当前任务需要的包：</p><ul><li>身份与对象：owner、book、当前层和活动版本；</li><li>硬事实：确认开书、相关设定、正式正文/结算和明确禁止项；</li><li>当前任务：上层确认责任、目标、输出合同和停止条件；</li><li>连续性：最近正文、上一实际结果、活动线程、相关人物/关系/资源/时间因果；</li><li>软参考：作者偏好、卷重点表达、内部结构软工具；</li><li>开放区：AI可以自由决定的场景、对白、意象、节奏和合理惊喜；</li><li>来源与预算：每项来源、版本、选择理由、排除理由和预算。</li></ul><p>明确排除其他书、未摘录灵感、未确认候选、过期版本、整库全文堆叠、AI猜测和无关审查报告。硬事实/当前任务若放不下应诚实阻断或回查正式源，不能静默截断。摘要只导航，争议回查原文。</p><h5>8. 前端交互</h5><p>整体信息架构和视觉允许继续重设计。必须保持：当前书清楚、当前层清楚、任务状态清楚、下一步清楚、旧内容可找回。</p><p>页面按状态而不是按数据库表堆内容：</p><ol><li>说明当前要完成什么；</li><li>作者可选补充（默认收起或简短）；</li><li>AI开始工作的明确按钮；</li><li>工作中进度与参与者；</li><li>方案差异和作者选择；</li><li>确认后的简洁结果与继续下一层；</li><li>失败原因和就地恢复。</li></ol><p>手机优先，360/390/430px无横向溢出，主操作可单手触达，触控目标约44px，输入法弹起后仍能编辑和提交。不要用重复大卡、长说明、专业术语和过多同时可见按钮制造负担。</p><h5>9. 作者API与运行边界</h5><p>普通作者响应只返回业务对象、白话状态、结果和恢复动作；不返回供应商/模型内部ID、任务/讨论/ContextPack/方法键、路径、堆栈、SQL、JSON合同或原始枚举。管理员审计走独立路由。</p><p>任务需要幂等、检查点、失败恢复和预算结算；重复恢复不重复扣量。Worker不直接改核心业务表或正式正文。作者确认后才进入正式版本，下游任务绑定当时的精确活动版本。</p><h5>10. 当前状态与剩余验收</h5><div class="table-scroll"><table><thead><tr><th>能力</th><th>当前状态</th><th>仍需做什么</th></tr></thead><tbody><tr><td>四项核心设定与按需补设定</td><td>E2工程已实现</td><td>随新UI继续减负和真机走查</td></tr><tr><td>内部方法库、双路线、选择/融合</td><td>E2工程已实现</td><td>多题材真实模型差异盲读</td></tr><tr><td>首卷500字/黄金三章/重大高潮追踪</td><td>E2工程已实现</td><td>真实正文连读和高潮效果验证</td></tr><tr><td>事件链、事件大纲、完整章链、近期细纲</td><td>E2工程已实现</td><td>持续优化交互与长期衔接</td></tr><tr><td>ContextCompiler分层与洁净投影</td><td>E2工程已实现</td><td>真实长篇检索/注意力评估</td></tr><tr><td>手机静态组件门禁</td><td>E2工程已实现</td><td>生产真机与输入法实际走查</td></tr><tr><td>单书20章真实链路</td><td>曾启动但已按老板要求停止</td><td>以后只在老板明确要求时继续</td></tr></tbody></table></div><p>E2表示工程可达，不代表文学质量或爆款结果。普通UI或功能开发不需要重跑20/50/100/200章；只有专项长篇验收才逐阶段执行。</p><h5>11. 精简验收清单</h5><ul><li>[ ] 各层职责清楚，计划/实际和硬/软/开放不混淆。</li><li>[ ] 作者无需一次填完，能留空、编辑、重做和恢复。</li><li>[ ] 设定只含非剧情骨架，扩展项不无故阻塞。</li><li>[ ] 双路线具体、有实质差异，普通页面无内部方法名。</li><li>[ ] 首卷职责贯穿卷、事件、前三章、第一章和实际字数追踪。</li><li>[ ] 事件与章节读取上一实际结果，承诺/铺垫/兑现能追踪。</li><li>[ ] ContextPack无跨书、未确认候选、过期版本和技术泄漏。</li><li>[ ] 手机主操作、输入和失败恢复可达。</li><li>[ ] 旧数据可读，确认版本可追溯，正文不可变。</li><li>[ ] 测试与本次风险相称；工程证据不冒充文学效果。</li></ul><hr><h2>二、AI成员、上下文、检索与创作质量</h2><h3>AI团队与介入规则</h3><blockquote>当前源文件：<code>docs/AGENT_SYSTEM.md</code> · 指纹：<code>d97c04e1cb4e</code></blockquote><h4>AI团队与介入规则</h4><h5>1. 团队组成</h5><p>每本书保持14名创作成员；岗位、Agent实例和模型绑定相互独立。同一个模型可以承担多个岗位，但界面必须如实显示，不能冒充异模型意见。</p><ol><li>主编 貂蝉：决定全局优先级，组织卷纲、事件和融合；负责事件与卷的节奏体检。</li><li>副编 西施：资料员、摘要员和主编备份。代表确定性 <code>ContextCompiler</code> 的资料准备职责，负责编译、压缩、去重、标注来源和排除项；不做事实判断，也不垄断数据库或检索。只有真实调用副编模型时，团队页才显示副编正在工作。</li><li>编剧A 婉儿：偏强冲突、爽点节拍和快速推进。</li><li>编剧B 红玉：偏递进、人物关系、铺垫和因果。</li><li>编剧C 幼薇：偏脑洞、反套路和题材化新鲜感。</li><li>设定 文姬：检查世界、规则、能力、资源和命名体系。</li><li>主笔 秋香：当前活动正文写手。</li><li>副笔 湘君：候补写手或局部润色，不默认串行重写整章。</li><li>事实审查 班昭：设定、正史与因果事实核对，固定承担正文审查事实席。</li><li>文学审查 妲己：语言、节奏、场景、重复和人物声音。</li><li>体验审查 昭君：目标读者视角的代入、期待、爽点、困惑和弃读风险。</li><li>体验·挑剔读者 妙玉：老白读者视角的毒点、吐槽点和弃读风险找茬。</li><li>研究 道韫：只为明确事实研究任务提供有来源资料，不决定剧情。</li><li>来源与版权 弄玉：执行来源、授权、原创性和风险检查，不设置独立页面。</li></ol><p>小文秘书是本地确定性工具角色，不属于14名创作成员，不给剧情结论、不冒充模型、不保存聊天记忆。</p><h5>2. 介入时机</h5><div class="table-scroll"><table><thead><tr><th>阶段</th><th>主持/执行</th><th>其他成员</th><th>输出</th></tr></thead><tbody><tr><td>开书</td><td>系统确定性校验</td><td>无</td><td>书籍、定位版本、团队、预算、设定任务</td></tr><tr><td>设定项</td><td>主编＋两位编剧独立提案</td><td>设定按需要检查</td><td>三份候选、作者选择、主编整理稿</td></tr><tr><td>分卷</td><td>主编主持</td><td>两位异模型编剧独立设计，设定/研究按需</td><td>卷候选、差异、融合稿</td></tr><tr><td>事件链</td><td>主编</td><td>两位编剧</td><td>事件序列、因果衔接、卷任务覆盖</td></tr><tr><td>事件大纲</td><td>主编融合</td><td>两位编剧独立方案，设定按需</td><td>当前事件完整大纲</td></tr><tr><td>章纲</td><td>指定编剧生成主方案</td><td>作者可选红玉或幼薇中任一位只挑战关键转折、冲突或钩子；设定/事实按需预检</td><td>完整事件章链、单章章纲；至多3条不自动采纳的挑战建议</td></tr><tr><td>正文</td><td>单一活动写手</td><td>设定/研究只提供证据</td><td>单章正文候选</td></tr><tr><td>审查</td><td>三席并行</td><td>事实席由班昭固定承担，文学、体验两席按异模型规则选座；三席互不读取，写手与三审合计四个不同模型来源；挑剔读者（妙玉）不进固定席，作者在正文页按需点&quot;请挑剔读者找茬&quot;单独跑，结果只供参考不卡定稿</td><td>各席独立报告</td></tr><tr><td>结算</td><td>确定性结算＋必要抽取</td><td>主编查看事件/卷偏差，并在结算完成后出节奏体检报告；副编写大白话摘要</td><td>事实、状态、伏笔、摘要、下一层承接、节奏体检报告</td></tr></tbody></table></div><p>各阶段提示词统一注入&quot;本书题材简报&quot;（频道、分类、融合题材、标签、基调、节奏策略、目标读者），简报只取自作者已确认的开书信息；岗位身份不随题材更换。</p><h5>3. 独立性</h5><p>两位编剧独立阶段互不可见，不交叉投票；主编只有在独立结果全部保存后才读取并融合。审查席使用与活动写手不同的模型，彼此不读取报告；每章固定三席（事实由班昭固定承担，文学、体验按异模型规则选座），写手与三审合计四个不同模型来源；妙玉作为挑剔读者不进固定席，正文页按需找茬、结果只供参考（DEC-CURRENT-067）。幼薇参与灵感讨论并可在章纲阶段由作者指定挑战候选；三编剧提案管线由后续批次接入。模型不可用或实际来源重复时必须明确降级或阻断，不能伪装独立；没有真实创作模型时，设定、分卷、事件、章纲、正文、审查、灵感和续写分析都不能用本地确定性夹具冒充成员工作。</p><h5>4. 创造性边界</h5><p>上层规划提供目标、边界、因果和必须项，不规定每句写法。AI可以提出有代价的偏离方案；局部合理发挥可以直接执行，影响卷目标、事件结果、人物核心选择或正史规则的偏离必须先给作者看影响。</p><p>模板只是软参考。岗位提示词不得把质量规范、评分表或固定叙事结构全文注入模型，也不得要求每章同时满足所有爽点和审查指标。</p><p>章纲挑战者不是第二套正式方案，也不参与自动融合。它只能针对作者指定的章链候选或单章章纲版本，提出少量替代思路及收益、代价和后续影响；作者可以忽略，只有作者主动修改或重新生成后，内容才会进入正式对象。</p><p>副编与文姬的职责必须分开：副编/<code>ContextCompiler</code>只准备可追溯资料；文姬是使用该资料进行设定判断的模型；正文事实核对由班昭承担。正文的占位符、格式、字数、内部治理口吻和最近章节大段复用等硬检查由确定性代码执行，不属于任何AI成员。质量规则只进入检查与审查，不进入主笔小说正文。 主笔调用只接收自然语言的资料角色、是否必须遵守和内容正文；来源ID、版本、哈希、优先级、检索理由与Token统计保存在后台ContextPack和调用审计，不进入主笔创作提示。状态面板只有在真实任务和真实模型调用发生时才显示工作中；模型未连接时统一显示“创作模型尚未连接”，不展示夹具名称或内部模型ID。</p><h5>5. 真实状态</h5><p>状态由任务、上下文编译、模型调用、心跳和保存事件驱动：等待、准备中、工作中、完成、失败、超时、已取消、等待作者。界面不得用计时器或文案伪造工作。</p><h5>6. 失败与恢复</h5><ul><li>确定性失败可在幂等键和检查点保护下重试。</li><li>远程结果未知不自动重试，先调和。</li><li>正文主笔一次调用失败后只允许同一模型再试1次；供应商结果未知时不盲重试。两次明确技术失败、超时或不可用后，副笔才可按同一冻结资料包接管且最多1次。作者不满意风格不属于技术失败。</li><li>已完成成员意见复用，未完成成员单独重做。</li><li>主编租约变化后旧结果必须通过epoch门禁。</li><li>作者退回时保留满意部分，修订只读取明确反馈和当前候选。</li></ul><h5>7. 追溯</h5><p>每个结果能追溯到任务、Agent、岗位、模型快照、上下文包、作者输入、上游版本、预算和输出哈希。不保存模型内部思维链。</p><h5>8. 思考与输出预算（2026-08-18 评估定稿，当晚复核翻倍）</h5><p><strong>设计结论：注意力保护放在输入侧，输出侧保持宽松上限。</strong></p><ul><li>输入侧（资料包）有界：讨论主编 7.2k Token（设定成组 16k）、成员 8k、章管线按上下文包预算编译。资料过多会分散注意力，这一侧不放宽。</li><li>输出侧（max_tokens 与思考预算）是上限而非目标：模型写够即停（end_turn），宽松上限不会拉长输出、不影响注意力；上限过紧才会截断 → 结构校验失败 → 重试 → 双倍计费并中断任务（2026-08-18 生产多次实测）。</li><li>思考预算是&quot;必然要花&quot;的额度（模型基本用满预算），可见输出是&quot;用多少算多少&quot;的封顶。</li></ul><p><strong>当前取值</strong>：</p><div class="table-scroll"><table><thead><tr><th>项目</th><th>值</th><th>依据</th></tr></thead><tbody><tr><td>思考预算（全部套餐模型、全部用途统一）</td><td>16,000 Token</td><td>方舟六个在役模型实测接受 enabled+budget 且预算生效；disabled 反被 glm-5.3/kimi 拒绝；老板复核后从 8,000 翻倍——预算是上限，用多少算多少，只保证复杂任务不被思考额度截断</td></tr><tr><td>讨论可见输出：阶段抽卡/交叉质疑/普通成员地板</td><td>6,000</td><td>上限是天花板不是目标；宽松不拉长输出，过紧才会截断重试</td></tr><tr><td>讨论可见输出：编剧独立方案</td><td>4,000</td><td>完整方案的实测尺寸</td></tr><tr><td>讨论可见输出：主编通用 / 设定成组融合 / 剧情总纲 / 滚动章纲</td><td>3,600 / 8,000 / 6,000 / 6,500</td><td>均为真实截断事故后调出的最小安全值</td></tr><tr><td>章管线：正文 draft/rewrite / 审查 / 主编汇总 / 其他</td><td>8,000 / 6,000 / 6,000 / 4,000</td><td>正文合同 2700-3200 有效字符 ≈ 3-4k Token，重写须返全章</td></tr><tr><td>卷纲 / 事件章纲（章链/细化）</td><td>12,000 / 12,000、9,000</td><td>十事件卷纲与多章章纲的实测尺寸</td></tr><tr><td>结算后续 / 主编设计 / 续写分析</td><td>4,000、6,000 / 4,000 / 8,192</td><td>结构化报告的实测尺寸</td></tr></tbody></table></div><p><strong>调用侧不变量</strong>：max_tokens = 可见输出上限 + 16,000 思考预算；八处预算冻结必须追加同一份思考预算（thinkingTokenAllowance），否则结算端以&quot;实际用量超过冻结上限&quot;拒绝。调整任何一侧时两侧必须同时改。</p><p><strong>额度考量</strong>：两个方舟套餐是包月额度。思考预算提到 16k 后，一轮四人讨论最坏多耗约 6 万 Token，占 3,000 万套餐的 0.2%，可忽略；截断重试一次的浪费远大于思考预算本身。预算是上限不是定量，只有模型真实使用才计费。</p><h5>分层设计中的AI介入</h5><ul><li>设定三席只在作者点击召集后工作，输出可整份选择或按片段组合；主编只整理作者选中的内容。</li><li>分卷两位编剧接收系统冻结的不同内部骨架，各自写成大白话具体路线；主编比较和融合，但专业方法名不得进入作者界面。</li><li>事件编剧只在活动卷路线与事件链边界内设计当前小故事；阅读感受是不选或单选的软参考。</li><li>章纲编剧把卷与事件职责拆成连续章链；第一卷前三章和首章前500字职责必须继续向下传递。</li><li>写手接收当前章完整任务、最近1—3章、线程账本和按需资料，在对白、动作、意象和场景细节上保留自由；三席审查仍互不读取报告。</li></ul><hr><h3>AI成员完整工作手册（当前实际运行版）</h3><blockquote>当前源文件：<code>docs/ROLE_PROMPTS.md</code> · 指纹：<code>3bfac0737634</code></blockquote><h4>AI成员完整工作手册（当前实际运行版）</h4><blockquote>本文把文秘写作14名创作成员的职责、介入节点、资料包、工作方法、输出规则、独立设计、融合、压缩、审查、重试和作者控制权整理在同一处。它描述当前代码实际采用的运行方式，不是理想化岗位介绍。</blockquote><h5>1. 基本概念</h5><h6>1.1 “思考规则”不等于隐藏思维链</h6><p>系统不会保存、展示或要求模型输出内部思维链。本文所说的“思考规则”，是作者可以检查和调整的外部工作方法：</p><ol><li>核对正式事实与作者偏好；</li><li>确认本次任务允许改变哪一层；</li><li>按规定顺序完成设计或审查；</li><li>按输出合同提交结果；</li><li>无依据内容标成不确定；</li><li>结论能回到当前书、对象和版本。</li></ol><p>系统只保存任务输入快照、资料包清单、提示词版本、模型结果、结构化报告和作者选择，不保存模型隐藏推理。</p><h6>1.2 资料包大小和输出字数不同</h6><ul><li><strong>输入Token上限</strong>：本次发给模型的资料容量上限。</li><li><strong>输入字符上限</strong>：资料包文本字符上限。</li><li><strong>输出Token上限</strong>：模型本次最多返回的容量。</li><li><strong>正文有效字数</strong>：真正验收的中文、英文和数字有效字符。</li><li>预算是上限，不代表每次塞满；实际使用量由任务快照记录。</li></ul><h6>1.3 三类资料严格分开</h6><ol><li><strong>必须读取</strong>：开书信息、活动设定、活动卷纲、当前事件、当前章纲、作者明确要求等直接依据。</li><li><strong>按需检索</strong>：与人物、地点、道具、伏笔、时间和因果相关的正式资料及原文证据。</li><li><strong>禁止混入</strong>：其他书、未摘录灵感聊天、过期候选、被替换版本、无关全文、AI猜测和其他审查员报告。</li></ol><p>必须资料超预算时应停止并重新整理，不得悄悄删掉硬约束。可选资料按优先级取舍，并记录未纳入项目及原因。</p><h5>2. 一次AI任务怎样运行</h5><pre class="code-block"><code data-language="text">作者触发任务
→ 冻结当前书、业务对象和活动版本
→ 确认成员、模型和输出合同
→ ContextCompiler编译必须资料与按需资料
→ 生成可追溯ContextPack
→ 编译岗位提示词、任务提示词和输出规则
→ 调用模型
→ 校验身份、格式、来源、字数和业务边界
→ 保存候选或审查报告
→ 作者选择、融合、修改或确认
→ 只有确认版本才能成为下游正式依据</code></pre><h6>2.1 任务冻结内容</h6><ul><li><code>owner_id</code>、<code>book_id</code>；</li><li>开书、设定、卷、事件、章纲、正文活动版本；</li><li>岗位与模型绑定快照；</li><li>提示词模板版本；</li><li>资料包、未纳入资料及原因；</li><li>输入与输出预算；</li><li>上游工作流指纹。</li></ul><p>生成期间上游正式版本变化时，旧结果不能覆盖新版本，只能作为过期候选重新生成或重新确认。</p><h6>2.2 提示词组成</h6><ol><li><strong>岗位合同</strong>：身份、擅长、职责、边界和工作方法；</li><li><strong>全局硬规则</strong>：只处理当前书；不展示思维链；不伪造来源、状态或异模型意见；候选不自动成为正史；保护人物生命力和合理惊喜；</li><li><strong>任务说明</strong>：本次节点与目标；</li><li><strong>输出合同</strong>：字段、长度和合法值；</li><li><strong>本书岗位补充要求</strong>：团队页可为每本书的每位成员保存最多4000字补充要求，版本化保存，不能覆盖系统硬规则；</li><li><strong>冻结资料包</strong>：正式资料和按需证据；</li><li><strong>技术修复提示</strong>：只修格式，不借机改变创意。</li></ol><p>提示词模板按内容生成指纹和不可变快照。模板改变生成新版本，旧版本保留追溯。</p><blockquote>“岗位补充要求保存成功”只表示配置已版本化。验收某次任务还要查看调用快照，确认补充要求确实进入了该次提示词。</blockquote><h6>2.3 压缩与整理</h6><ol><li><strong>上游定长整理</strong>：开书、设定、上一卷或上一事件结算整理为任务摘要；</li><li><strong>正文专用胶囊</strong>：只拿完整本章章纲、最近状态、前章尾部、承诺与风格胶囊；</li><li><strong>检索证据块</strong>：按任务检索实体、伏笔、时间、因果和原文；</li><li><strong>预算裁剪</strong>：硬资料不静默裁剪；可选资料按优先级、重复度和预算纳入，排除有记录。</li></ol><p>Token估算对中文字符按约1 Token、其他字符按约0.25 Token计算，仅用于预算，不等于厂商最终计费。</p><h5>3. 全流程介入图</h5><pre class="code-block"><code data-language="text">开书信息（作者填写）
→ 设定小组独立提案 → 主编融合 → 作者逐项确认
→ 编剧A/B独立卷纲 → 主编融合 → 作者确认
→ 编剧A/B独立事件 → 主编融合 → 作者确认
→ 指定编剧拆事件章节序列；作者可选红玉或幼薇挑战关键节点 → 作者确认
→ 指定编剧逐章细化章纲；作者可选红玉或幼薇挑战钩子或冲突 → 作者确认
→ 单一主笔写正文；两次明确技术失败后副笔最多接管一次
→ 确定性代码硬检查
→ 事实 + 文学 + 体验三席审查并行、互不偷看（挑剔读者退出固定席，正文页可单独点&quot;请挑剔读者找茬&quot;）
→ 主编汇总分歧 → 必要时主笔定点修改 → 作者定稿
→ 章节结算 → 事件结算 → 卷结算 → 下一卷</code></pre><p>开书信息不靠AI猜测。结算只记录正式正文实际发生的内容，不能把未来规划倒灌为正史。</p><h5>4. 节点资料包与输出上限</h5><p>各节点的可见输出上限与思考预算只有一份权威取值表：<code>docs/AGENT_SYSTEM.md</code> 第 8 节（含不变量：max_tokens＝可见输出上限＋16,000 思考预算，八处预算冻结同步追加）。本表不再复制输出数值，只记录各节点的资料包规模与机制分工；实际使用量以调用快照为准。</p><div class="table-scroll"><table><thead><tr><th>节点</th><th>参与成员</th><th>输入Token</th><th>输入字符</th><th>按需检索</th><th>当前机制</th></tr></thead><tbody><tr><td>开书</td><td>无AI必需介入</td><td>—</td><td>作者总输入约18000字以内</td><td>0</td><td>作者填写</td></tr><tr><td>单项设定候选</td><td>设定小组候选成员</td><td>8000</td><td>动态</td><td>最多9组</td><td>候选互不读取；建议通常200—400字</td></tr><tr><td>设定融合</td><td>指定主编/编辑</td><td>7200</td><td>动态</td><td>最多12组</td><td>读取候选、作者选择和当前依据</td></tr><tr><td>卷纲独立方案</td><td>编剧A、B</td><td>24000</td><td>58000</td><td>每人最多9组</td><td>两案并行独立</td></tr><tr><td>卷纲融合</td><td>主编</td><td>32000</td><td>76000</td><td>最多12组</td><td>对比融合，不机械平均</td></tr><tr><td>事件独立方案</td><td>编剧A、B</td><td>18000</td><td>42000</td><td>每人最多7组</td><td>两案并行独立</td></tr><tr><td>事件融合</td><td>主编</td><td>24000</td><td>56000</td><td>最多10组</td><td>保留强因果和真实分歧</td></tr><tr><td>事件章节序列</td><td>指定编剧</td><td>16000</td><td>36000</td><td>当前不额外RAG</td><td>判断章数并拆分连续章节</td></tr><tr><td>章链挑战</td><td>作者指定的另一位异模型编剧（红玉或幼薇）</td><td>12000</td><td>28000</td><td>当前不额外RAG</td><td>读取精确章链候选，最多3条关键替代建议</td></tr><tr><td>单章章纲</td><td>指定编剧</td><td>22000</td><td>50000</td><td>当前不额外RAG</td><td>读取完整事件和确认序列</td></tr><tr><td>单章挑战</td><td>作者指定的另一位异模型编剧（红玉或幼薇）</td><td>14000</td><td>32000</td><td>当前不额外RAG</td><td>读取精确单章候选，最多3条钩子/冲突替代建议</td></tr><tr><td>正文初稿</td><td>活动主笔</td><td>4800</td><td>4800</td><td>硬证据最多4组、可选最多6组</td><td>目标2700—3200有效字；硬范围2350—3650</td></tr><tr><td>整章重写</td><td>活动主笔</td><td>9000</td><td>9000</td><td>动态</td><td>保留作者指令和当前正文</td></tr><tr><td>事实审查</td><td>事实职责成员</td><td>15000</td><td>15000</td><td>最多8组</td><td>先字段事实，再因果和认知边界</td></tr><tr><td>文学审查</td><td>文学审查</td><td>8500</td><td>8500</td><td>最多6组</td><td>只审文学表达</td></tr><tr><td>体验审查</td><td>体验审查</td><td>8500</td><td>8500</td><td>最多6组</td><td>按阅读顺序检查体验</td></tr><tr><td>挑剔读者找茬</td><td>妙玉（按需，不进固定审校席）</td><td>8500</td><td>8500</td><td>最多6组</td><td>找毒点、弃读风险和逻辑吐槽；结果只供参考不卡定稿</td></tr><tr><td>审查汇总</td><td>主编</td><td>8000</td><td>动态</td><td>只读各席报告</td><td>保存分歧，不用多数票压硬错误</td></tr><tr><td>定点修改</td><td>活动主笔</td><td>9000</td><td>9000</td><td>当前正文和必改项</td><td>正常生产最多自动2轮</td></tr></tbody></table></div><p>卷纲和事件需要大范围约束；正文只执行当前章，因此使用较小而硬的资料包；事实审查需回查正式依据，所以比文学和体验资料包更大。</p><h5>5. 十四名成员怎样工作</h5><p>本手册只定义岗位方法，不复制易过期的模型绑定。真实任务以管理员当前模型方案、书籍冻结快照和调用审计为准；普通作者页面不显示供应商或内部模型ID。</p><h6>5.1 貂蝉｜主编</h6><ul><li><strong>介入</strong>：设定、卷纲、事件候选完成后融合（融合稿必须带爽点兑现、逻辑链闭环、新鲜感来源三块说明）；审查后汇总；事件或卷结算完成后出节奏体检报告（爽点与付费点位置、高潮间隔、压抑时长、恢复节拍、风险与建议）；卷末承接下一卷。</li><li><strong>接收</strong>：当前任务包、已保存独立候选、作者选择与意见、正式上游约束。审查汇总时只读各席报告，不重审正文。</li><li><strong>方法</strong>：先找共同硬约束，再比较因果、人物动机、代价、卷目标和下一接口；冲突处择优，不机械平均；保留分歧和未知。</li><li><strong>输出</strong>：设定/卷纲/事件融合稿；审查优先级与保留分歧。</li><li><strong>边界</strong>：不伪造共识，不替作者确认，不以多数票压过事实错误，不在汇总时偷改正文。</li></ul><h6>5.2 西施｜副编</h6><ul><li><strong>介入</strong>：副编定位调整为资料员、摘要员和主编备份；资料编译仍由确定性<code>ContextCompiler</code>在每次任务前完成，摘要维护已落地：事件或卷结算完成后，西施把结算实际结果写成不超过六句的大白话摘要（结算后续任务的第二步，真实模型调用）；主编租约失效时按同一冻结资料包接管。只有确有需要并发生真实模型调用时，西施才显示正在工作。</li><li><strong>接收</strong>：当前书正式对象、版本、来源、预算、检索重点、排除规则和正式结算。</li><li><strong>方法</strong>：确定性结构化直达 → 全文/向量/关系/时间因果检索 → 原文回查；去重排序；编译资料包；记录纳入与排除。</li><li><strong>输出</strong>：ContextPack、来源/排除清单、状态导航、实体和伏笔检索结果；事件/卷大白话摘要。</li><li><strong>边界</strong>：只准备资料，不判断设定真假，不决定剧情，不把猜测写成事实，不混书，不把规划当正文。事实与逻辑判断由文姬读取已经编译好的资料后完成。</li><li><strong>真实状态</strong>：确定性服务不能伪装成副编模型调用；团队状态、任务和模型快照必须如实。</li></ul><h6>5.3 婉儿｜编剧A</h6><ul><li><strong>介入</strong>：独立卷纲A、独立事件A；被指定时生成事件章节序列或单章章纲；设定类目讨论的提案席（侧重爽点、强冲突与持续追读张力），输出可勾选碎片。</li><li><strong>接收</strong>：压缩开书与活动设定、卷任务和软节奏模板、作者意见、事件种子、上一事件真实结算、活动卷纲与完整事件。</li><li><strong>方法</strong>：明确进入状态和本层责任；建立触发→行动→阻力→选择→代价→结果因果链；服务卷目标但不写死场景；保留合理惊喜；新设定无依据时标未知。</li><li><strong>输出</strong>：完整卷纲A、事件A或章纲。</li><li><strong>边界</strong>：不看B未提交方案，不跨卷决定全局，不把模板当公式，不为反转破坏人物动机。</li></ul><h6>5.4 红玉｜编剧B</h6><ul><li><strong>介入</strong>：与A并行生成卷纲B、事件B；被指定时设计章纲；设定类目讨论的提案席（侧重因果链与逻辑闭环），输出可勾选碎片。</li><li><strong>独立性</strong>：与A使用同一任务依据，但有独立模型、任务、资料包快照和输出；不是检查A，也不能偷看A后换词。</li><li><strong>方法</strong>：从关系、铺垫兑现、信息差和长期后果寻找完整另一条路线；不为不同而猎奇；明确必达与自由区；用下一接口检查结尾。</li><li><strong>输出</strong>：完整卷纲B、事件B或章纲。</li></ul><h6>5.5 幼薇｜编剧C</h6><ul><li><strong>介入</strong>：脑洞、反套路与题材化新鲜感方向的独立方案；被指定时参与章纲挑战。</li><li><strong>接收</strong>：与编剧A/B同一任务依据，但使用独立模型、任务和资料包快照；不看其他编剧未提交方案。</li><li><strong>方法</strong>：寻找“没那么常规但成立”的第三条路；新鲜感必须落地为具体行动和代价；脑洞服务人物和主线，不为猎奇破坏因果。</li><li><strong>输出</strong>：剧情方案、玩法重组建议或跨度估算。</li><li><strong>边界</strong>：不把讨论写入正史，不为反转而反转，不冒充其他模型意见。</li></ul><h6>5.6 文姬｜设定</h6><ul><li><strong>介入</strong>：设定阶段；资料库事实候选提取；设定类目讨论的提案席（侧重规则严谨与可核验），输出可勾选碎片。正文后的事实一致性审查改由班昭承担。当前模型由管理员方案和任务快照决定。</li><li><strong>设定资料</strong>：全部开书信息、当前设定项、作者意见、已确认相关设定。</li><li><strong>审查资料</strong>：不可变正文、章纲和上游约束、前文状态、相关正式原文与资料库证据；不读文学和体验报告。</li><li><strong>方法</strong>：设定时守住开书承诺，补世界逻辑、人物边界和可持续冲突。审查先查人物/能力/物品/地点/时间/数量/状态，再查因果、认知边界和伏笔；问题带位置、双方证据和修复动作；证据不足标未知。</li><li><strong>输出</strong>：设定候选、事实报告、最多16条待复核事实候选。</li><li><strong>边界</strong>：使用副编/<code>ContextCompiler</code>已经编译的资料做判断，不负责检索编排或资料包压缩；不评价文笔，不把软偏好判违规，不抹掉人物合理变化。</li></ul><h6>5.7 秋香｜主笔</h6><ul><li><strong>介入</strong>：章纲确认后写正文；硬检查或审查要求时定点修改；作者要求时整章重写。</li><li><strong>接收</strong>：完整本章章纲；约1500字工作单、650字开篇胶囊、600字阶段结算、400字前章状态、500字前章尾部、400字承诺与伏笔、风格胶囊和少量正式证据。不接收整书全文或其他书。</li><li><strong>方法</strong>：先完成必达结尾与禁区；把纲要写成场景、行动、对话和反应；保持人物可辨识；在自由区创造细节和惊喜；结尾准确交接下一章。</li><li><strong>输出</strong>：目标2700—3200有效字，硬范围2350—3650；每次修改创建新版本。</li><li><strong>边界</strong>：不擅改卷/事件结果；不输出提示词、JSON、内部说明或占位符；不写成逐字段说明或模板腔。</li></ul><h6>5.8 湘君｜副笔</h6><ul><li><strong>介入</strong>：主笔首次明确技术失败后，同一模型只重试1次；两次明确失败、超时或不可用后才接管，且整章最多接管1次。供应商结果未知先调和，不盲重试。</li><li><strong>接收</strong>：与主笔同一冻结任务包、两次失败证据和接管原因。</li><li><strong>规则</strong>：按同一章纲、目标2700—3200与硬范围2350—3650完成；显示真实模型和原因；接管仍失败就交作者处理。</li><li><strong>边界</strong>：作者对文风、情节或表达不满意不属于技术失败；不伪装第二位独立主笔，不并行竞写，不因风格偏好抢占主笔，不产生两个正式版本。</li></ul><h6>5.9 班昭｜事实审查</h6><ul><li><strong>介入</strong>：正文通过硬检查后，与文学、体验审查并行，固定承担事实席；资料库事实候选复核。</li><li><strong>接收</strong>：不可变完整正文、设定基线、正史与时间线、来源证据；不读文学和体验报告。</li><li><strong>方法</strong>：先锚定同一对象、同一指标、同一范围再比对；只报告有正文或权威来源证据的矛盾；主观耗时与推断不升级为硬冲突。</li><li><strong>输出</strong>：事实点评JSON：事实矛盾、需确认项和来源证据。</li><li><strong>边界</strong>：不臆造数量对应关系，不作文学评价，不直接改正文。</li></ul><h6>5.10 妲己｜文学审查</h6><ul><li><strong>介入</strong>：正文通过硬检查后，与另两审并行；修改后按新版本重审。</li><li><strong>接收</strong>：不可变正文、章纲、写作合同、风格胶囊、必要近章对照和少量证据；不读另两份报告。</li><li><strong>方法</strong>：查场景、叙述、节奏、情绪、人物声音、重复、空泛和模板腔；保护作者风格；每条问题定位原文并给动作。</li><li><strong>输出</strong>：通过/需修改/阻断；最多8项问题、分数和文学风险。只描述可观察AI腔，不判断作者身份或AI概率。</li></ul><h6>5.11 昭君｜体验审查</h6><ul><li><strong>介入</strong>：与事实、文学审查并行。</li><li><strong>接收</strong>：当前正文、前章必要衔接、章纲、目标读者、情绪目标和少量证据；不读其他报告。</li><li><strong>方法</strong>：按阅读顺序标出跳读、困惑、反感、无感和期待位置；区分个人偏好与广泛风险；检查情绪兑现是否有铺垫和代价；敏感内容给位置和处理动作。</li><li><strong>输出</strong>：最多8项问题、分数、读者风险和敏感内容风险，前端转成自然语言。</li></ul><h6>5.12 妙玉｜体验·挑剔读者</h6><ul><li><strong>介入</strong>：待命成员，不进每章固定审校席（DEC-CURRENT-067：固定席只有事实、文学、体验三席）。作者在正文页点&quot;请挑剔读者找茬&quot;时单独跑一次完整找茬，结果只供参考、不影响定稿；也参与灵感讨论与体验向找茬预演。</li><li><strong>接收</strong>：完整正文、目标读者画像、情绪与钩子投影；不读其他报告。</li><li><strong>方法</strong>：站在最挑剔读者的立场逐段挑刺；每个槽点给出具体位置和读者原话式表达；区分真毒点和口味差异。</li><li><strong>输出</strong>：毒点清单、弃读风险和差评预演。</li><li><strong>边界</strong>：不参与剧情方案，不直接改正文，不把口味差异当错误。</li></ul><h6>5.13 道韫｜研究</h6><ul><li><strong>介入</strong>：只有当前任务需要现实知识、专业常识、历史背景或术语核实时按需触发。</li><li><strong>接收</strong>：明确研究问题、当前书范围、允许来源、所服务对象和必要虚构规则。</li><li><strong>方法</strong>：区分正式来源、可靠二手来源、推断和未知；给适用范围和不确定性；转成创作可用材料。</li><li><strong>输出</strong>：研究摘要、来源、限制和事实候选。</li><li><strong>边界</strong>：不无来源断言，不用现实资料推翻明确虚构规则，不直接改剧情或正史。</li></ul><h6>5.14 弄玉｜来源与版权</h6><ul><li><strong>介入</strong>：导入正文、外部引用、相似风险和发布前来源审查；硬检查发现来源不清时。</li><li><strong>接收</strong>：当前书导入来源、引用片段、正式正文和来源记录；不拿其他用户书籍当素材。</li><li><strong>方法</strong>：判断作者原文/正式引用/公共事实/新生成；检查长度、来源和边界；只报告可观察相似；给改写、缩短、标注或移除动作。</li><li><strong>输出</strong>：来源记录、风险、相似位置和处理建议。</li><li><strong>边界</strong>：不混入其他书，不保存密钥隐私或付费全文，不用模糊指控代替证据。</li></ul><h5>6. 各节点怎样设计、融合与确认</h5><h6>6.1 开书</h6><p>作者输入书名、卖点、题材、标签、目标读者、总字数、主角、初始目标、金手指、开篇场景和自定义想法。这是全书源头，不从其他书、聊天或AI猜测补齐；未填的可选项保持未知。</p><h6>6.2 设定</h6><p><strong>候选</strong>：设定小组成员读取同一份最小必要资料但独立生成；单个候选通常200—400字，具体到能直接落地，并用一句话告诉作者这项设定以后写故事时要抓住什么；方案拆成4至8条作者可逐条勾选或全选的具体主张（碎片），每条是一句能独立成立、互不重复的话，合起来覆盖完整方案；不显示JSON、模型指令或工作流术语。作者可采纳、修改、重写或补充。作者在讨论中补充的想法区分&quot;必须遵守&quot;（方案不得与之冲突）与&quot;仅供参考&quot;（成员以专业判断为主导设计，方案中符合作者想法的观点保持两到五成、最多一半）；&quot;我再改改&quot;的定点修改意见一律按必须遵守处理。</p><p><strong>融合</strong>：编辑只读取已保存候选、作者选择和当前设定依据；落库定稿只写结论本身——核心项通常80—150字、任何一项最多300字，论证、举例、备选和解释不进入落库内容（可留在面向作者的说明里），因为定稿会作为硬指标进入后续创作资料包，冗长会稀释注意力；面向作者的说明用大白话说清这份设定让这本书好看在哪、写作时要抓住什么。未确认内容不进入正式资料库。</p><h6>6.3 分卷</h6><p>编剧A/B都要输出：卷名和开始状态；核心目标、冲突和失败代价；人物变化；事件序列及每个事件的进入、触发、行动、结果、下一接口和章节范围；信息揭示；压力升级与恢复；卷末状态、遗留线索、下一卷触发；必达、禁区、自由区和待确认问题。</p><p>两案独立保存后，主编比较因果、人物、代价、节奏和长线价值，不机械平均。融合稿仍需作者确认。</p><h6>6.4 规划·事件</h6><p>编剧A/B都要输出：事件标题及卷责任；开始状态、触发、参与人物与目标；阻力、选择与代价、信息变化；局部推进、必须结果和自由区；结束条件、下一事件影响、人物弧与卷高潮贡献；建议章节范围和未知项。</p><p>后端保留结构字段，前端默认转成“上一幕、当前困境、必须选择、可能代价、下一幕钩子”的故事预告；可切换大纲模式，但默认不把内部字段堆成配置表。</p><h6>6.5 事件章节序列</h6><p><strong>主方案由指定编剧完成，不是A/B两案再融合。</strong></p><p>编剧先评估事件结束条件需要多少章，再生成连续章节：章节号和标题、事件责任、开始状态、人物目标、冲突、选择与代价、信息变化、故事节拍、结束状态、下一章接口、软建议和自由区。后一章开始必须承接前一章结束，整套章节覆盖事件结束条件。</p><p>作者可选“请另一位编剧看看”。挑战者必须是另一位异模型编剧，读取活动卷纲、完整事件、当前章链候选精确版本和作者关注点，输入预算12000 Token/28000字符，输出不超过1800 Token。只给最多3条关键替代思路，每条写明另一种走法、可能收益、代价和对后续章节的影响；不完整重写、不自动融合、不写正式版本。</p><h6>6.6 单章章纲</h6><p><strong>主方案由指定编剧细化，不走双方案融合。</strong></p><p>资料包含活动卷纲、完整事件、确认章节序列、最近1—3章章纲和作者意见。输出本章功能、开始和必达结束状态、出场人物、冲突、情绪目标、场景节拍、信息控制、伏笔动作、结尾钩子、必写、禁区、候选和自由区。</p><p>作者可选红玉或幼薇挑战当前单章候选。挑战资料冻结完整事件、确认序列、目标章纲精确版本和必要近章接口，输入预算14000 Token/32000字符，输出不超过1800 Token。只挑战核心冲突、人物选择、转折或结尾钩子中的关键点，最多3条；作者可忽略，候选换版后旧建议不再作为当前建议。</p><h6>6.7 正文与审查</h6><ul><li>单一活动主笔写正式初稿。主笔首次明确技术失败后只重试1次；供应商结果未知不盲重试；两次明确失败、超时或不可用后副笔才接管，且最多1次。风格不满意走作者修订，不触发接管。</li><li>硬检查由确定性代码执行，不属于任何AI成员。顺序为占位符/内部指令 → 标题/格式 → 正文长度 → 版本/来源 → 版权风险；优先目标2700—3200有效字，低于2350或高于3650直接打回；最多2次定点修复，仍失败则阻断。</li><li>事实、文学、体验三个职责读同一不可变正文，用不同模型并行，互不读报告；写手与这三席合计四个不同模型来源。挑剔读者（妙玉）不进固定席，作者在正文页按需点&quot;请挑剔读者找茬&quot;单独跑，结果只供参考不卡定稿。</li><li>主编只汇总报告并保留分歧；事实硬错误不能被两份主观“通过”投票覆盖。</li><li>正常生产最多自动定点修改2轮；新稿若破坏已通过硬门禁，就拒绝新稿并保留上一版本，冲突交作者。</li></ul><h5>7. 输出和前端规则</h5><h6>7.1 后端与作者界面分层</h6><ul><li>模型与后端可用严格JSON校验和保存；</li><li>作者页面必须转为自然语言卡片、故事摘要、报告和明确操作；</li><li>不显示JSON键、内部枚举、提示词指令、检索分数、数据库字段、Token日志、异常堆栈或思维链；</li><li>技术进度翻译成“正在核对人物状态”等大白话。</li></ul><h6>7.2 输出门禁</h6><ul><li>身份必须与任务指定成员一致；</li><li>正文版本、模型快照和业务对象必须与冻结任务一致；</li><li>格式错误只做技术修复，不改变创意；</li><li>卷纲与事件最多2次技术尝试；</li><li>审查报告可做1次格式修复，仍失败则阻断；</li><li>结果状态未知时不盲重试，避免两个正式版本；</li><li>正文修改创建新版本，不覆盖旧版。</li></ul><h6>7.3 作者意见优先级</h6><ol><li><strong>必须遵守</strong>：除非与正式事实冲突，否则是硬要求；</li><li><strong>尽量照顾</strong>：强偏好，冲突时说明取舍；</li><li><strong>灵感参考</strong>：可吸收、重组或不用；</li><li><strong>我想先问问</strong>：只回答，不自动改变正式对象。</li></ol><p>独立灵感聊天不自动进资料包。只有作者主动摘录并绑定到设定、卷、事件、章纲或正文后才成为正式输入。</p><h5>8. 上下文与检索</h5><h6>8.1 节点资料矩阵</h6><p>各任务的&quot;必须接收 / 按需检索 / 明确排除&quot;权威矩阵只有一份：<code>docs/LONGFORM_QUALITY.md</code> 第 8.3 节。本文不再复制，避免多份拷贝漂移；验收时以该矩阵逐项核对 ContextPack。</p><h6>8.2 混合检索顺序</h6><p>结构化直达 → 全文精确检索 → 向量语义检索 → 关系检索 → 时间/因果检索 → 正式原文回查。检索不依赖单一相似度阈值；结果带来源、版本、对象和证据；摘要只导航，不能单独裁决事实。</p><h6>8.3 长期防跑偏</h6><p>卷纲约束事件，事件链约束事件大纲，事件大纲约束章纲，章纲约束正文。规划写未来，结算写真实发生。每章保存进入/结束状态，每事件和每卷用真实结算衔接后续。上游版本变化时，下游旧候选失效或重新确认。</p><h5>9. 怎样调整每个成员的质量</h5><h6>9.1 不改代码</h6><ul><li>团队页修改本书某成员的岗位补充要求，最多4000字；</li><li>在每个业务节点写作者意见并选择优先级；</li><li>更换岗位模型绑定并产生新版本；</li><li>选择、混合或放弃方案；</li><li>指定要保留的段落和重写目标。</li></ul><p>推荐写法：</p><pre class="code-block"><code data-language="text">关注什么：人物选择必须付出真实代价。
优先顺序：先人物动机，再反转，再节奏。
不要做什么：不要靠突然出现的新能力解围。
输出习惯：重大转折写清触发、选择、代价和后果。
不确定时：列为待确认，不自行补成设定。</code></pre><h6>9.2 需要改规格和代码</h6><ul><li>单成员节点改为双成员独立方案再融合；</li><li>Token/字符预算和检索数量；</li><li>输出字段、问题数、正文字数；</li><li>重试、副笔接管和自动修改轮数；</li><li>审查职责边界；</li><li>必须读取和必须排除的资料类型。</li></ul><p>这类调整必须同步工作流、Agent、上下文、质量、API、验收和测试，不能只改提示词。</p><h6>9.3 调整后验收</h6><ol><li>显示真实成员和模型；</li><li>资料包只含当前用户、书、对象和活动版本；</li><li>硬资料未被静默删除；</li><li>岗位补充要求进入实际调用快照；</li><li>输出符合结构、字数和边界；</li><li>页面无技术字段、内部指令、乱码和思维链；</li><li>候选不自动成为正式版本；</li><li>上游改变后旧候选不污染下游；</li><li>多书切换不串任务、资料、提示词和状态；</li><li>失败、重试和接管记录真实。</li></ol><h5>10. 当前真实现状和质量关注点</h5><ol><li>团队固定14名；事实审查由班昭固定承担；小文秘书不计入创作成员。</li><li>卷纲和事件已是双编剧独立方案加主编融合，作者最终确认。</li><li>事件章节序列和单章章纲只有一个正式主方案；作者可选让另一位异模型编剧提出最多3条非正式挑战建议，不自动融合。</li><li>正文是单一主笔；主笔最多两次明确技术尝试，之后副笔按同一冻结资料包最多接管一次。</li><li>审查是异模型多席独立审查（每章固定三席：事实、文学、体验；挑剔读者按需找茬），主编最后汇总。</li><li>压缩、去重、版本冻结和资料包编译很多由确定性代码完成，不能伪装为模型工作。</li><li>岗位补充提示词必须用调用快照验收；保存配置不等于所有生产链已注入。</li><li>当前正文硬合同是目标2700—3200有效字、硬范围2350—3650，旧通用提示不得覆盖。</li><li>后端JSON和作者界面分层；作者看到自然语言和故事化表达。</li><li>所有预算是当前代码配置，不是创作公式，可以经测试调整但不能破坏隔离和追溯。</li></ol><h5>11. 运行依据</h5><ul><li><code>apps/api/src/contracts/agent-team-v2.ts</code></li><li><code>apps/api/src/application/agents/prompt-compiler.ts</code></li><li><code>apps/api/src/application/agents/agent-prompt-preference-service.ts</code></li><li><code>apps/api/src/application/memory/context-pack-service.ts</code></li><li><code>apps/api/src/application/memory/writer-context-policy.ts</code></li><li><code>apps/api/src/application/discussions/discussion-pipeline-service.ts</code></li><li><code>apps/api/src/application/planning/volume-plan-generation-pipeline-service.ts</code></li><li><code>apps/api/src/application/planning/story-event-generation-pipeline-service.ts</code></li><li><code>apps/api/src/application/planning/event-chapter-generation-pipeline-service.ts</code></li><li><code>apps/api/src/application/creation/chapter-pipeline-service.ts</code></li><li><code>docs/CREATION_WORKFLOW_V2_DESIGN.md</code></li><li><code>docs/AGENT_SYSTEM.md</code></li><li><code>docs/MEMORY.md</code></li><li><code>docs/HYBRID_RAG_DESIGN.md</code></li><li><code>docs/LONGFORM_QUALITY.md</code></li><li><code>docs/ACCEPTANCE.md</code></li></ul><p>如本文与实际任务调用快照不一致，以老板最新决定和当前运行证据为准，并立即同步本文。</p><h5>小文秘书（不属于14名）</h5><p>只负责导航、附件、任务状态、确定性校验和故障回执。不调用模型给剧情建议，不冒充创作成员，不保存灵感聊天记忆。</p><hr><h3>上下文、记忆与任务资料规范</h3><blockquote>当前源文件：<code>docs/MEMORY.md</code> · 指纹：<code>acc4db380621</code></blockquote><h4>上下文、记忆与任务资料规范</h4><h5>1. 原则</h5><p>上下文由确定性 ContextCompiler 按任务编译，不由拟人成员自由访问全库。越往下游越压缩上层信息，但上层硬约束必须完整保留；当前任务对象使用完整版本。其他书、旧聊天、过期版本、无关候选、全文堆叠和无依据猜测始终排除。</p><h5>2. 权威层</h5><ol><li>作者原始输入与不可变导入原件。</li><li>作者确认的开书、设定和活动规划版本。</li><li>定稿正文与章节/事件/卷结算形成的正史事实。</li><li>摘要、Wiki、图谱、全文和向量投影。</li></ol><p>低层不能推翻高层。摘要只导航，事实争议回查正式源。</p><h5>3. 任务上下文矩阵</h5><div class="table-scroll"><table><thead><tr><th>任务</th><th>必须接收</th><th>必须排除</th></tr></thead><tbody><tr><td>开书</td><td>作者填写的全部开书信息、附件和明确约束</td><td>其他书、聊天、AI猜测</td></tr><tr><td>设定方案</td><td>完整开书信息、当前设定项、核心人物/读者承诺/作者禁区、与本项存在直接依赖的已确认设定、作者本项原话；融合额外接收作者选中方案的规则骨架并保留原方案ID回查</td><td>无关已确认设定、方案的重复解释与未选备选、无关正文、其他书、未确认候选</td></tr><tr><td>分卷</td><td>无损压缩后的完整开书与设定、上一卷正式结算、当前角色状态、节奏选择、作者卷想法</td><td>旧卷候选、无关细节、聊天历史</td></tr><tr><td>事件链</td><td>压缩开书/设定、完整活动卷纲、模板与作者想法</td><td>其他卷未来猜测、过期卷纲</td></tr><tr><td>事件大纲</td><td>压缩开书/设定/卷纲、完整事件链和当前事件卡、上一事件结果、作者本事件想法、触发伏笔</td><td>其他事件草案、无关人物全集</td></tr><tr><td>章纲</td><td>压缩上层信息、完整事件链、完整当前事件大纲、上一章链状态、作者章纲想法</td><td>越过当前事件的自由扩写</td></tr><tr><td>章纲挑战</td><td>与主方案相同的冻结上游、精确目标候选版本和作者本次关注点</td><td>其他候选、其他事件全文、聊天、审查报告、未摘录灵感；挑战意见不自动进入后续资料包</td></tr><tr><td>正文</td><td>压缩卷纲、事件链和事件大纲、完整当前章纲、最近正式正文/结算、触发实体与声音证据、作者本章意见</td><td>全书全文、其他候选、其他书</td></tr><tr><td>事实审查</td><td>当前正文、冻结上游版本、命中设定/事实/时间/伏笔原文</td><td>文学和体验报告</td></tr><tr><td>文学审查</td><td>当前完整正文、章纲、表达基线、必要相邻正文</td><td>事实席或体验席报告</td></tr><tr><td>体验审查</td><td>当前完整正文、目标读者、章纲目标、必要前章</td><td>其他审查报告</td></tr><tr><td>结算</td><td>定稿正文、冻结章纲、已有正史、当前事件/卷目标</td><td>草稿和未确认建议</td></tr></tbody></table></div><h5>4. 压缩规则</h5><p>压缩不是删掉上层规则。必须保留：身份、目标、因果、时间、能力上限、关系、禁区、未回收伏笔、卷目标、当前事件结果和作者必须项。可压缩：重复解释、已回收低优先细节、无关场景描写和未采用候选。</p><p>每份压缩物保存来源列表、版本、内容哈希、生成策略和可回查位置。长度由任务预算和证据密度决定，不使用固定“最近5章后遗忘”规则。</p><p>资料包去重分两层执行。完全相同的内容只保留一份；某个活动章纲、前章正文或其他权威对象已经以完整版本进入硬来源时，同一对象、同一版本的尾段、摘要和检索切片不再重复注入。只有切片包含完整来源没有覆盖的独立内容，或完整来源根本未进入资料包时，才保留该切片。所有排除项继续记录来源、版本和排除理由，去重不能变成静默丢证据。</p><h5>5. 检索触发</h5><p>实体、别名、规则、物品、地点、时间、因果、伏笔、人物声音或冲突信号出现时，先结构化直达，再结合FTS、向量、关系和时间过滤。高风险事实至少回查一段正式原文。低相关结果不因相似度分数高就自动注入。</p><h5>6. 写入与结算</h5><p>模型输出默认是候选。只有作者确认资料和定稿正文结算可以更新正式状态。章节结算按正文实际内容检查人物、势力、地点、道具/资源、规则、事件、人物变化、关系、时间、伏笔和摘要；存在且对后续有价值时追加，不存在时保持空结果，不为分类覆盖编造。事件/卷结算聚合实际结果并记录计划偏差。投影异步重建，失败不能污染正式源。</p><h5>7. 续写</h5><p>导入全文保存在不可变原件和章节版本中。反向拆解结果带来源，仅作为待确认派生资料。续写任务按实体和当前目标回查旧文，不把整本全文塞入每次模型调用。</p><h5>8. 验收</h5><p>上下文测试至少覆盖跨书隔离、版本失效、硬约束位置、长输入预算、对抗检索、来源回查、摘要消融、同源全文覆盖切片、只有切片时不误删独立证据、人物声音和连续多章漂移。召回提高不能以原创性、人物可辨识度或整体阅读质量下降为代价。</p><h5>9. 题材无关的资料沉淀</h5><p>事实审查和章节结算不得依赖某一本样稿的人名、道具或题材关键词。每个题材都按当前正文实际出现的实体、行动、关系、时间、状态和规则生成候选；没有持久事实时返回空候选并说明原因，不能补造。</p><p>进入正式资料的候选必须同时满足：</p><ol><li>绑定当前书、来源章节和不可变定稿正文版本；</li><li>证据原句能在该正文中逐字回查，不能使用模型摘要代替；</li><li>实体、关系目标、时间和知情状态在当前书内可解析；</li><li>章节结算或带来源的作者修订明确激活，未确认候选不进入正史；</li><li>图谱、时间线、人物状态和检索投影能删除重建，不能反向修改正文。</li></ol><p>历史章节需要补建结构化资料时，不修改原正文、旧结算或旧正史修订；先在数据库副本验证来源和幂等，再创建可追溯的纠错修订，重建投影并完成跨书检查。</p><p>验收不能只数全文切片、实体总数或情绪投影；还要分别检查主角状态与历史、配角、势力、地点、世界路线图、道具/资源、生效规则、聚合事件时间线、正式事实、人物关系、来源回查和作者界面的自然语言显示。设定来源不得重复冒充分类正式资料；人物每章出现不得冒充事件。类型档案要验证字段与来源的语义匹配：配角年龄/性格/门派/装备、势力规模/实力/驻地、道具属性/归属、地图节点/路线和时间线的时间/章节都只能来自本书权威源。某分类确有证据却显示空白，或没有证据却被猜测填充，均视为资料沉淀或展示适配失败。</p><hr><h3>当前卷—事件工作流的混合RAG设计</h3><blockquote>当前源文件：<code>docs/HYBRID_RAG_DESIGN.md</code> · 指纹：<code>973438752576</code></blockquote><h4>当前卷—事件工作流的混合RAG设计</h4><h5>1. 目标与边界</h5><p>混合RAG只为当前书、当前任务补充必要证据。它不能替代开书信息、活动设定、活动卷纲、活动事件、完整章纲、定稿正文或作者原话，也不能把摘要、向量结果、Wiki或AI候选升级为正史。</p><p>系统不建立聊天、会话摘要或对话记忆检索源。作者输入必须属于明确的开书、设定、卷、事件、章纲、正文、审查或结算对象。每次查询必须携带 <code>owner_id</code>、<code>book_id</code>、任务类型、目标对象和冻结版本；其他书籍永远排除。</p><h5>2. 数据权威顺序</h5><ol><li>作者确认的开书信息、设定、资料条目和显式约束；</li><li>作者定稿的不可变正文版本及其正史结算；</li><li>当前任务直接引用的活动卷纲、事件链、事件大纲和章纲；</li><li>章节、事件和卷结算；</li><li>带来源的作者原话、附件和导入原件；</li><li>从上述来源重建的结构化事实、全文索引、关系、时间线、Wiki、摘要和向量；</li><li>AI候选、审查建议、失败任务和测试结果。</li></ol><p>规划描述未来，正史描述实际发生。两者必须分开存储、分开检索和分开显示。派生层发生冲突时回查上级正式源，不以相似度或摘要覆盖正式源。</p><h5>3. 本地目标架构</h5><ul><li>SQLite：书籍、版本、活动指针、作者输入、资料、正史、结算、任务、调用、来源和关系的权威库；</li><li>SQLite FTS5：专有名词、原句、规则、场景关键词和否定表达的全文检索；</li><li>LanceDB OSS TypeScript本地嵌入：可重建的语义向量投影；</li><li>SQLite关系与时间投影：人物、势力、地点、物品、规则、线索、知情、状态和因果邻域；</li><li>不可变文件：导入原文、正式正文和附件原件；SQLite保存路径、哈希、范围和版本；</li><li>派生Wiki与摘要：只做导航和展示，必须携带来源、水位和重建版本；</li><li>ContextCompiler：把活动上游版本、作者原话和按需检索证据编译成不可变ContextPack。</li></ul><p>所有投影都能从SQLite权威记录和不可变原件重建。投影缺失、损坏或水位落后时，不得把它当成事实源。</p><h5>4. 索引对象</h5><div class="table-scroll"><table><thead><tr><th>当前对象</th><th>主要索引单位</th><th>必须携带的版本信息</th><th>用途</th></tr></thead><tbody><tr><td>开书信息</td><td>字段、作者原话、附件引用</td><td>开书活动版本</td><td>定位、题材、角色、核心机制和必须项</td></tr><tr><td>设定</td><td>设定模块、实体卡、规则条目</td><td>设定活动版本</td><td>世界、人物、势力、地点、物品和规则</td></tr><tr><td>分卷</td><td>卷目标、主要因果、人物变化、高潮、卷末接口</td><td>卷纲活动版本及上游设定版本</td><td>约束当前卷</td></tr><tr><td>事件链</td><td>事件卡、前后触发、卷任务映射</td><td>事件链版本及卷纲版本</td><td>定位当前事件职责</td></tr><tr><td>事件大纲</td><td>入口、行动链、转折、结果、代价、下一触发</td><td>当前事件活动版本</td><td>约束事件内剧情</td></tr><tr><td>章纲</td><td>章职责、场景、信息、情绪、结尾状态</td><td>当前章纲版本及事件版本</td><td>正文直接执行依据</td></tr><tr><td>正式正文</td><td>章、场景、段落、人物声音证据</td><td>不可变正文版本、正史水位</td><td>原文回查与连续性</td></tr><tr><td>三级结算</td><td>实际结果、状态变化、开放线索、来源</td><td>章/事件/卷结算版本</td><td>后续任务的真实起点</td></tr><tr><td>资料库</td><td>设定来源、主角状态史、配角档案、势力档案、地点档案、世界路线、道具资源档案、生效规则、正文事件时间线与来源</td><td>正式事实/状态版本、正史有效区间与结算范围</td><td>按语义类型精确查询；类型字段可选且缺失不补造，地点与地图分开，时间线无日期时用章节范围；设定来源不混入正式实体，规划事件不冒充实际事件</td></tr></tbody></table></div><p>原始内容不因重切片而改变。新切片策略创建新快照并原子切换；旧快照只用于回滚宽限，不参与当前检索。</p><h5>5. 任务型上下文路由</h5><h6>5.1 开书与设定</h6><p>开书任务直接接收作者填写的全部信息，不做RAG补造。设定候选接收完整开书活动版本、当前设定模块、作者本模块原话与附件，以及已确认的直接依赖设定。排除其他书、非对象化历史输入、卷纲、事件、正文和未确认AI猜测。</p><h6>5.2 分卷</h6><p>接收完整覆盖开书字段的 <code>BookCorePack</code>、<code>SettingConstraintPack</code>、长期承诺、作者选择的卷级软模板和本卷原话；后续卷再加入上一卷真实结算与当前状态。检索只补充与本卷目标相关的开放线索、人物/势力状态、规则和必要原文。</p><h6>5.3 事件链与事件大纲</h6><p>事件链接收开书核心、活动设定、完整 <code>VolumeConstraintPack</code>、作者事件链想法和事件级软模板。事件大纲额外接收完整 <code>EventChainPack</code>、当前事件卡、上一事件真实结算或卷首状态，以及作者对当前事件的全部原话。检索围绕当前事件实体、地点、规则、道具、线索和前因展开，不加载其他事件完整大纲。</p><h6>5.4 当前事件章纲</h6><p>接收压缩但完整覆盖的开书、设定、卷纲和事件链，完整 <code>CurrentEventPack</code>，上一真实结算与作者章链/单章意见。系统先评估事件总字数和章数，再生成完整章节序列；当前章完整章纲不以摘要替代。</p><h6>5.5 单章正文</h6><p>接收 <code>BookCorePack</code>、<code>SettingConstraintPack</code>、<code>VolumeConstraintPack</code>、<code>EventChainPack</code>、<code>CurrentEventPack</code>、完整 <code>CurrentChapterOutlineFull</code>、必要前章、当前正史、作者修改意见和明确自由区。RAG只补充本章真实需要的实体、规则、时间、因果、人物声音和必要原文，不注入全书正文、其他事件完整大纲或整套模板。</p><h6>5.6 三类审查</h6><p>事实、文学和体验审查绑定同一不可变正文和同一完整章纲，但附加证据分开编译，三份报告互不读取：</p><ul><li>事实审查：设定、正史、时间线、状态、能力、知情、道具、地点和线索来源；</li><li>文学审查：题材与表达偏好、人物声音、关系、情绪进度和必要近期原文；</li><li>体验审查：卖点、目标读者、事件位置、阅读进度、必要前章和期待兑现。</li></ul><h6>5.7 结算与下一卷</h6><p>章节、事件和卷结算只从作者确认正文、下级结算和既有正史提取实际结果，规划只用于计划—实际对照。下一卷以完整开书核心、活动设定、长期承诺、上一卷完整真实结算、当前状态和开放线索为起点，不能把未实现计划当成已发生事实。</p><h6>5.8 类型化资料直达</h6><p>配角、势力、地点和道具/资源档案是从权威实体、正式事实、状态和来源重建的结构化查询视图。检索器可按年龄、性格、所属、规模、实力、驻地、地点层级、道具属性、归属和流转等实际存在的字段直达，再回查原文；空字段不形成查询事实。世界路线只辅助地点先后和移动查询，不能把图上相邻自动解释为地理相邻。类型档案不构成永久岗位包，ContextCompiler仍按当前任务选择最小充分资料。</p><h5>6. 检索执行顺序</h5><ol><li>校验 <code>owner_id/book_id</code>、目标对象、任务权限和冻结活动版本；</li><li>把直接活动版本和作者原话放入ContextPack，不经过相似度竞争；</li><li>从任务类型生成结构化查询计划，列明实体、时间、因果、来源和所需证据种类；</li><li>按需并行执行精确查询、FTS、向量、关系、时间/因果和原文回查；</li><li>过滤跨书、失效版本、错误故事时间、无来源和权限不匹配结果；</li><li>标注事实、人物认知、秘密、谎言、推断、规划和软参考，禁止混层；</li><li>按来源权威、任务关系、时间与因果必要性重排并去重：完全相同的内容只保留一份；同一对象、同一版本的完整权威源已经纳入时排除其摘要、尾段和检索切片，只有切片包含未覆盖的独立证据或完整源未纳入时才保留；随后只扩展必要父块/邻块；</li><li>记录纳入、排除、裁剪和冲突理由；</li><li>在预算内编译不可变ContextPack并保存来源指纹；</li><li>提交前再次核对活动版本与正史水位，过期任务结果拒绝落库。</li></ol><p>不设置一个全局相似度阈值决定所有通道。向量只负责语义候选，不能静默决定实体身份、事实真伪或活动版本。</p><h5>7. 检索不足与冲突</h5><ul><li>找不到依据：输出“未知/需确认”，不补造；</li><li>同名或别名歧义：列出候选和来源，正式任务在消歧后继续；</li><li>规划与正文冲突：正文结算代表实际发生，后续规划是否修订由作者决定；</li><li>正式源之间冲突：提交事实审查，展示双方来源和有效时间；</li><li>结果过多：先按任务关系、权威、时间和因果裁剪，不删除直接上游约束；</li><li>结果过少：扩大别名、关系、时间和原文邻域，不先降低全局门槛；</li><li>向量不可用：明确降级为结构化＋FTS＋关系＋原文回查；依赖语义且无法替代的任务暂停并说明原因。</li></ul><h5>8. 创造性保护</h5><p>ContextPack把硬底线、任务约束和软参考分栏。模板、声音片段、相似场景和节奏建议必须标为可不用；主笔保留对白、动作、意象、局部调度、场景细节和自然因果实现的自由空间。</p><p>正文检索目标是“最小充分”，不是“最大召回”。先形成场景方案，再针对具体缺口回查，避免大量旧正文导致模仿、重复和人物机械化。检索方案改变时必须用相同模型与相近预算做多样本盲评，事实更准不能抵消原创性、合理惊喜、人物可辨识度、情绪力度和整体阅读质量下降。</p><h5>9. 投影、水位与恢复</h5><p>切片、FTS、关系、Wiki和向量通过版本化快照构建。非活动快照完成来源覆盖、跨书隔离、时间过滤、冻结查询和无答案探针后，才能按书原子切换。构建失败继续使用上一有效快照；若上一快照与当前权威水位不一致，则降级或阻断相关任务。</p><p>Worker只写投影、候选和任务结果，不直接修改正式正文或核心正史。所有写入使用幂等键、租约栅栏、检查点和晚到结果隔离。投影目录损坏时从权威源重建，不恢复成事实源。</p><h5>10. 可观测与验收</h5><p>每次检索保存：任务、查询计划、通道、命中、过滤原因、来源、版本、水位、裁剪、预算、耗时、降级和ContextPack指纹，但不保存模型思维链或密钥。</p><p>必须通过：</p><ul><li>其他书籍零命中，错活动版本和过期候选被拒绝；</li><li><code>BookCorePack</code>覆盖作者已填开书字段100%，空字段不会被AI补造；</li><li>卷、事件链、事件大纲、章纲和正文能回查完整上游版本；</li><li>三类审查绑定同一正文但附加证据与报告相互隔离；</li><li>摘要误导、否定、别名、时间冲突、因果、多跳关系和无答案查询；</li><li>规划未实现内容不会进入三级结算；</li><li>下一卷读取上一卷真实结算；</li><li>投影中断、重复执行、错水位、向量缺失、重建和回滚；</li><li>检索增益与创造性非劣效对照。</li></ul><h5>15. 分层资料包与注意力门禁</h5><p>检索不能决定四项核心设定是否进入：故事舞台、主角底板、规则与代价、边界与留白始终全文直达。其余设定先按当前卷、事件、章纲或正文任务计算相关性，最多选取直接相关项全文，其余只列名称和可回查键，不把全文堆进提示词。</p><p>每个候选来源都携带约束强度、真值状态、业务范围和依赖版本。检索命中只能补充证据，不能把软参考、规划或摘要升级为硬事实；所谓硬命中如果不是当前任务的直接权威源，仍放入可选证据区。</p><p>正文连续性优先读取最近1—3章不可变正文、章节结算、当前事件线程账本和未回收伏笔。更早原文通过结构化事实、线程状态、全文或向量检索按需回查，不做全书全文堆叠。</p><p>硬事实和当前任务超过预算时任务失败并报告缺口，不允许头部加尾部截断。调用方计算预算后由ContextCompiler自动加入的相关硬设定，可使用岗位显式配置的有界专用余量；有效预算只扩到实际硬来源大小，未使用余量不能被软资料占用，超过余量仍失败。软资料先同源去重、去低相关项和缩短导航；被排除内容、原因和原始来源仍进入审计。</p><p>验收增加：四核心全文覆盖、相关可选设定召回、低相关目录延后、计划/实际不混层、最近章连续、线程承接、无硬来源字符裁剪和跨书零命中。</p><hr><h3>长篇小说资料切片最终设计</h3><blockquote>当前源文件：<code>docs/CHUNKING_DESIGN.md</code> · 指纹：<code>1ff34cb4217a</code></blockquote><h4>长篇小说资料切片最终设计</h4><h5>1. 明确结论与置信度</h5><p>文秘写作采用“不可变原始资料＋结构节点＋父子检索块＋原子事实”的多粒度切片，不采用整章单块、全资料统一固定字数或无条件重叠。切片只负责定位和取回资料，不能替代原文、事实、规划层级或正史版本。</p><p>设计结论置信度为高：结构优先、父子检索、原子事实、来源回链、版本化快照和最小充分扩展能够直接对应长篇小说的语义边界、故事时间、人物认知和注意力问题。具体字符目标值置信度为中：本文给出可运行的初始默认值，但默认值必须在目标电脑和独立中文小说金标上与固定切片、纯语义切片比较后锁定。参数调优属于版本化实现配置，不重新决定权威架构。</p><p>本设计已在当前长篇release实现为 <code>content_chunks</code>、分类型结构切片、FTS/LanceDB可重建投影和多来源切片快照原子切换，并取得500万字符/1500章E2工程证据。当前机器未发现已验证本地嵌入资产时向量通道如实降级；E2不能冒充E3语义金标或E4文学质量提升。</p><h5>2. 当前事实基线</h5><ul><li>正文已经使用不可变完整文件和内容哈希，SQLite保存业务权威与文件指针。</li><li>当前运行时检索只有结构化事实、SQLite FTS5/BM25和固定同义词扩展；尚无真实向量、父子块或分类型切片。</li><li>DEC-012已确定SQLite权威源、LanceDB可重建向量投影、SQLite关系/Wiki和混合检索；DEC-016已确定临时、候选、正史、派生四层生命周期。</li><li>目标单书规模为500万规范化中文字符、1500章；较早卷和事件默认使用结算摘要导航，关键实体、规则、承诺、因果或冲突触发后下钻原文。</li><li>需要保护的不只是召回率，还包括人物声音、原创性、情绪力度、合理惊喜和整体阅读质量；大段历史正文可能提高事实覆盖却压低创作新鲜度。</li></ul><h5>3. 能力追踪矩阵</h5><div class="table-scroll"><table><thead><tr><th>痛点/可观察失败</th><th>根因</th><th>最终机制</th><th>最强反例</th><th>验证证据</th></tr></thead><tbody><tr><td>对白和回答被拆开</td><td>固定长度不理解语义单元</td><td>段落、对白轮次、动作—反应优先；字符数只作软边界</td><td>超长独白仍可能超过模型适合长度</td><td>边界完整率、人工错误集、召回对照</td></tr><tr><td>命中一小段却缺上下文</td><td>只有扁平块</td><td>场景根→场景节拍父块→检索子块；按问题有界扩父/邻块</td><td>父块过大仍会分散注意力</td><td>证据完整率、注入Token、位置敏感测试</td></tr><tr><td>同一段被重复召回</td><td>盲目文本重叠和多种派生重复</td><td>默认不复制重叠；使用前后邻接、来源范围和派生去重</td><td>边界查询可能因零重叠漏召回</td><td>与80—120字符重叠基线消融</td></tr><tr><td>“人物以为”变成客观事实</td><td>文本块没有观点与叙事模式</td><td>故事时间、视角、说话人、认知范围、回忆/梦境/计划元数据</td><td>自动抽取可能误判含蓄叙述</td><td>谎言、误解、反事实和不可靠叙述对抗集</td></tr><tr><td>正文修订后命中旧块</td><td>块和索引没有来源版本/水位</td><td>不可变切片快照、正史版本硬过滤、原子切换、旧快照失效</td><td>切换中断可能留下半成品</td><td>中断、重复执行、旧版本和重建故障注入</td></tr><tr><td>通用对白“你来了”检索错误</td><td>子块缺实体和场景语境</td><td>证据原文与嵌入文本分离；嵌入文本加入最小上下文头</td><td>头信息过多会形成标签锚定</td><td>无关键词、同句异人/异场景金标</td></tr><tr><td>检索更准但正文更像旧文</td><td>相似场景和风格片段注入过多</td><td>主笔只取最小硬证据和2—4条可选声音证据</td><td>过少证据可能丢失人物声音</td><td>全量包、最小包、硬事实包成对盲评</td></tr><tr><td>重复台词或意象被错误删除</td><td>全局内容哈希去重忽略叙事位置</td><td>原始位置均保留；只在单次结果中按来源/派生关系去重</td><td>真正重复噪声会占候选</td><td>重复、呼应、刻意复沓样本</td></tr></tbody></table></div><h5>4. 最强替代方案与取舍</h5><div class="table-scroll"><table><thead><tr><th>方案</th><th>优点</th><th>主要代价</th><th>结论</th></tr></thead><tbody><tr><td>固定500字符＋100字符重叠</td><td>实现最简单、易复现</td><td>切断对白/因果、重复多、跨结构污染</td><td>作为基线，不作为默认</td></tr><tr><td>整章或整场景单块</td><td>上下文完整</td><td>检索粒度粗、Token高、长场景注意力差</td><td>只保留导航父节点，不直接默认注入</td></tr><tr><td>纯模型语义切片</td><td>可识别复杂边界</td><td>非确定、成本和恢复一致性差，模型升级会改变全部边界</td><td>可作实验候选，不作为权威默认</td></tr><tr><td>纯句子/段落切片</td><td>来源精确</td><td>缺少场景上下文，多跳和隐含因果弱</td><td>作为叶子边界来源，不单独使用</td></tr><tr><td>结构语义＋父子块＋原子事实</td><td>同时支持精确召回、上下文扩展、确定性事实和可重建</td><td>Schema、切片器、快照和评测更复杂</td><td>最终采用</td></tr></tbody></table></div><p>最强替代是固定长度切片。它更便宜，但其错误恰好集中在小说最重要的对白、动作—反应、场景转折和叙事视角，因此只适合做可比较基线。推荐方案增加的复杂度全部位于可重建投影，不增加第二权威源。</p><h5>5. 预先验尸与反例</h5><p>假设方案在第1000章失败，最可能的传播路径是：边界识别把场景切错→向量只命中半个因果链→Wiki从半块抽取错误结论→上下文把错误投影交给编剧/主笔→新章进一步固化错误。修正是让重要结论必须回查原子事实或原文，并使切片、Wiki和向量都保持可失效投影。</p><p>其他高风险反例：</p><ul><li>一个场景跨越两个章节，若强行生成跨文件父块，会增加版本与恢复复杂度；因此章节仍是文件硬边界，用 <code>continues_scene_id</code> 连接连续场景。</li><li>一段超长独白、诗歌、书信或属性面板不能按普通段落处理；因此保留块类型并采用专用降级切分。</li><li>梦境、回忆、预言、人物计划和假想战斗语义相似，但故事时间和真实性不同；因此叙事模式与事实状态先于向量相似度过滤。</li><li>全局去掉相同文字会删除有意复沓、口头禅和伏笔呼应；因此不对不同来源位置做物理去重。</li><li>大量场景标题、标签和人物名拼入嵌入文本会提高表面召回但压倒正文语义；因此上下文头必须短、稳定、版本化，普通标签不拼入。</li><li>更细的块可能提高Recall@K，却使主笔收到碎片化材料并降低整体写作；因此检索指标和创作非劣效必须同时通过。</li></ul><h5>6. 修正后的最终设计</h5><h6>6.1 四种表示各司其职</h6><ol><li><strong>不可变原始资料</strong>：正式正文、设定、规划和历史稿件的完整文件，是最终证据。</li><li><strong>结构节点</strong>：书→卷→故事弧→章→场景→场景节拍，以及设定卡/规划节点。结构节点负责导航和范围，不必全部向模型注入。</li><li><strong>检索块</strong>：适合FTS和向量召回的子块，命中后按任务决定是否扩展父块、相邻块或关系节点。</li><li><strong>原子事实</strong>：主体—关系/属性—值—故事时间—观点主体—证据，处理生死、位置、知情、数量、关系和规则；语义检索只能帮助发现，最终判断使用结构化记录和原文。</li></ol><p>摘要、Wiki、向量和上下文头都属于派生投影，不得成为第五种权威。</p><h6>6.2 原文规范化和稳定来源定位</h6><ul><li>原文件保持UTF-8原样不可变。切片前只为索引生成独立 <code>index_text</code>：统一换行、Unicode NFC、移除BOM和无意义控制字符；不自动简繁转换，不统一标点，不改写作者空格、断句或措辞。</li><li>证据范围使用原始UTF-8 <code>start_byte/end_byte</code>、段落序号和内容哈希定位。<code>index_text</code> 必须保存回到原文范围的映射，不能把规范化文本直接当成引用证据。</li><li>每个来源版本保存 <code>source_hash</code>；每个块保存 <code>content_hash</code> 和 <code>index_text_hash</code>。来源哈希不一致时拒绝构建或使用该快照。</li><li><code>chunk_id</code> 在一个切片快照内唯一；新策略创建新快照和新块，使用 <code>supersedes_chunk_id</code>/来源范围追溯，不原地改变历史块。</li></ul><h6>6.3 正式正文层级与默认参数</h6><pre class="code-block"><code data-language="text">章节文件（权威）
└─ 场景根节点（完整导航范围，可很长）
   ├─ 场景节拍父块（上下文扩展单位）
   │  ├─ 检索子块
   │  └─ 检索子块
   └─ 场景节拍父块</code></pre><ul><li>场景根由明确分隔符、时间/地点/视角变化、叙事目标或主要冲突变化、行动—反应链闭合共同判断。只换说话人不构成新场景。</li><li>已确认章纲和场景契约只可作为边界提示，不能强迫已经写出的正文服从计划边界；实际原文结构与章纲不一致时保存偏离关系并以原文证据为准。</li><li>边界置信不足时不伪造精确场景，降级为同章段落组并标记 <code>boundary_confidence</code>；重要检索可以扩展邻块或回到章内原文。</li><li>场景节拍父块初始目标1200—3000个中文字符，软上限4500；完整短场景可以直接成为一个父块。父块主要用于有界扩展，不默认全部嵌入上下文。</li><li>检索子块软下限350、目标约500—600、软上限700、默认硬上限1000个中文字符。完整对白轮次、动作—反应对、句子和短诗节优先保持完整；语义单元略超软上限时允许保留。</li><li>超过硬上限的单段先按句子切；超长单句再按不破坏引号、括号、列表项和因果连接的分句切。超长独白各子块保持同一说话人和连续组ID。</li><li>实际嵌入模型的输入Token上限高于字符规则优先级：任何块连同上下文头超过模型安全输入预算时，必须继续按语义边界拆分，不能依赖模型静默截断。</li><li>过短段落只允许与同场景、同叙事功能的相邻段合并；不得为了凑长度跨场景、跨视角或跨叙事模式拼接。</li><li>章节是物理硬边界。跨章连续场景通过 <code>continues_scene_id</code>、前后节点和事件关系连接，不创建跨两个不可变文件的物理块。</li></ul><p>字符目标值只控制异常长短，不推翻语义边界。实现时同时记录中文字符、Unicode码点、UTF-8字节和实际模型Token，不能用固定“字符=Token”换算。</p><h6>6.4 默认不复制重叠</h6><ul><li>检索子块默认原文零复制重叠，使用 <code>prev_chunk_id/next_chunk_id</code>、父块和事件/实体边补足边界上下文。</li><li>命中位于子块首尾、查询涉及因果/对白承接或重排置信不足时，允许按预算扩展一个同场景邻块，并记录 <code>expansion_reason</code>。</li><li>80—120字符的同场景重叠保留为基准实验策略。只有独立金标证明它提高边界证据完整率，且重复注入、磁盘、延迟和创作锚定均不过门槛时，才可成为新版本默认。</li><li>父块包含子块属于结构包含，不算重复索引；组包时不能同时无差别注入父块和其全部子块。</li></ul><h6>6.5 设定、规划、事实与派生资料</h6><div class="table-scroll"><table><thead><tr><th>资料类型</th><th>父级/子级</th><th>初始子块目标</th><th>特殊规则</th></tr></thead><tbody><tr><td>人物/势力/地点/物品设定</td><td>实体卡→身份、能力、限制、历史、状态、关系、知情等方面</td><td>100—600字符</td><td>客观事实、人物认知、秘密、谎言和推断分开</td></tr><tr><td>世界规则</td><td>规则卡→条件、效果、限制、例外、代价</td><td>100—600字符</td><td>规则与例外建立显式关系，不合并冲突版本</td></tr><tr><td>总纲阶段/故事弧/章纲</td><td>层级节点→目标、冲突、必须结果、可选节拍、承诺、开放问题</td><td>100—500字符</td><td><code>planned/active/fulfilled/abandoned/superseded</code> 分开；章纲引用相关总纲阶段和确认故事弧；计划不冒充已发生事实</td></tr><tr><td>原子事实</td><td>结构化断言→确定性可读渲染</td><td>一条断言</td><td>不做文本重叠；嵌入只用于发现，裁决回到事实与证据</td></tr><tr><td>Wiki</td><td>实体页→一个主题段</td><td>150—500字符</td><td>每条结论回链事实或原文；整页不作为一个向量块</td></tr><tr><td>人物声音/表达证据</td><td>人物/叙述者→已确认短片段</td><td>150—400字符</td><td>独立受限索引；主笔默认最多2—4条，标注可不用、不可仿写原句</td></tr><tr><td>场景/章节/弧/卷摘要</td><td>层级连续性节点</td><td>按字段和来源范围</td><td>锚定事实与原文增量生成；不能无来源地递归总结摘要</td></tr><tr><td>作者想法/方案候选/草稿</td><td>业务对象与任务→问题组/暂存场景</td><td>按对象与任务边界</td><td>仅对象或任务临时索引，不进正式索引，不跨任务默认召回</td></tr><tr><td>研究/拆书资料</td><td>研究任务/来源→主张/短摘录/结构卡</td><td>按证据边界</td><td>与创作索引物理和权限隔离；版权原文不得进入主笔包</td></tr></tbody></table></div><p>结构化表格、属性面板、诗歌、书信、日志和聊天体正文保留 <code>block_type</code>。表格/属性面板优先解析为结构化字段并保留整块原文证据；诗歌、书信和日志优先保持作品内部结构，不强行与普通叙事段落合并。</p><h6>6.6 块元数据合同</h6><p>每个块至少携带：</p><ul><li>隔离：<code>owner_id</code>、<code>book_id</code>、权限域；</li><li>来源：类型、ID、不可变版本、原文哈希、字节范围、段落范围；</li><li>结构：章、场景、节拍、父块、前后块、顺序、块类型；</li><li>粒度：<code>leaf/parent/summary</code> 检索层级、是否参与FTS/向量、是否允许直接注入；</li><li>叙事：故事时间范围、叙事时间、视角人物、说话人、地点、叙事模式；</li><li>语义：实体/事件绑定及抽取状态；自动抽取保持候选，不能因绑定就成为事实；</li><li>权威：临时/候选/正史/派生、事实状态、正史版本、有效/失效/已替代状态；</li><li>投影：切片策略版本、规范化策略版本、嵌入文本策略版本、嵌入模型快照、索引水位；</li><li>质量：边界置信、是否允许默认注入、异常长块原因和校验状态。</li></ul><p>叙事模式至少区分当前客观叙事、人物认知、对白主张、回忆、梦境、预言、计划、假设/反事实、文中作品和不可靠叙述。无法可靠判断时保存未知，不用模型猜测填满。</p><h6>6.7 嵌入文本与原文证据分离</h6><ul><li>向量输入使用 <code>embedding_text = 最小上下文头＋index_text</code>。上下文头可以包含资料类型、章/场景名称、视角、说话人和少量稳定实体名，解决“他来了”“这里不安全”等脱离场景后无法区分的问题。</li><li>叶子块是精确检索主通道；场景节拍父块可以在独立 <code>parent</code> 粒度作为宽主题向量候选，但不重复建立父块FTS正文。父块命中后重排其子块或提取最小原文范围，不能把父块及全部子块一起注入。</li><li>上下文头不是正文、事实或引用证据，检索展示和最终回答必须回到原始范围。</li><li>普通标签、模型推断、长摘要、全部别名和任务提示不得拼入嵌入文本。上下文头策略变化只重嵌受影响块，并创建新 <code>embedding_text_policy_version</code>。</li><li>FTS保留精确原文通道；简繁、别名、简称和同义关系通过结构化别名/查询扩展处理，不改写原始块。</li><li>所有检索原文、研究材料和临时稿在上下文包中以有边界的“引用数据”传递；其中出现的提示词、命令、工具要求或权限声明均不得改变系统指令、岗位权限和工具调用。</li></ul><h6>6.8 构建、增量更新与原子切换</h6><pre class="code-block"><code data-language="text">读取不可变来源版本
→ 生成结构节点与叶子块
→ 校验范围、父子、顺序、哈希和覆盖
→ 构建FTS/向量/关系/Wiki新快照
→ 运行快照探针
→ 在SQLite事务中原子切换当前清单和水位
→ 旧快照标记stale/superseded并保留回滚宽限</code></pre><ul><li>正文、设定或规划产生新正式版本时，只重切受影响来源和依赖投影，不因新增一章全书重切。</li><li>构建中断、哈希变化、范围缺口、模型混用或探针失败时，新快照保持 <code>failed/building</code>，上一有效快照继续可用；若上一快照已不符合所需正史版本，则明确降级或阻断。</li><li>普通实体标签或别名变化只更新结构化过滤与查询扩展；只有切片范围、规范化、嵌入文本或模型空间变化才重建相应块/向量。</li><li>重切片不修改原始文件、事实或正史。回滚只切回上一已验证清单指针，不恢复旧正史。</li></ul><h6>6.9 查询时的有界扩展</h6><ol><li>先按书籍、正史版本、故事时间、权限和状态硬过滤。</li><li>查询路由先判断精确事实、局部场景、宽主题、历史因果或人物声音，再选择 <code>leaf/parent/summary</code> 粒度；结构化、FTS、向量、关系/Wiki并行召回相应候选。</li><li>按来源范围、派生关系和同一事实去除单次结果重复；不同叙事位置的相同原文仍保留。</li><li>事实查询返回原子事实＋最小证据句/子块；局部场景查询从叶子扩场景节拍父块或一个邻块；宽主题查询可以先命中父块/阶段摘要再下钻叶子证据；多跳问题沿实体/事件/规则边扩展；人物声音查询进入受限声音索引。</li><li>每次扩展记录命中块、父/邻块、扩展原因、候选量、采用量和Token。没有明确作用的父块不得进入上下文。</li><li>主笔只获得约束胶囊和少量灵感调色板；编剧、设定师、审校的扩展维度和预算在岗位检索合同中另行配置，不能靠切片器给所有岗位同一资料。</li></ol><h6>6.10 作者可见与可解释性</h6><p>作者在资料库看到原始资料、实体、事实、来源片段、版本、故事时间和派生状态，不需要看到向量数组。检索预览可以展示“命中了哪个来源片段、为什么扩展父/邻块、最终给了哪个岗位多少资料、哪些资料被排除”。默认界面不要求作者管理技术块；高级诊断页可按来源查看块边界和重建状态。</p><h5>7. 创造性与输出质量保护</h5><p>切片策略会改变模型看到什么，因此不声称对创造性零影响。硬事实和来源准确是门禁；历史相似场景、人物声音、意象、情绪和风格证据属于限量软资料。</p><ul><li>主笔自由创作区必须明确存在，切片器不能把父块、邻块和命中资料自动变成逐项执行清单。</li><li>与固定切片、整章上下文、只有硬事实和当前基线建立对照；使用相同模型族、相近预算、多次采样、匿名随机的成对盲评。</li><li>上述比较执行创造性与输出质量非劣效合同；事实、检索或一致性改善不能抵消任何核心创作维度的有意义下降。</li><li>分别评价原创性、合理惊喜、人物声音、情绪力度、语言画面、节奏、旧文模仿、检索锚定和整体质量；不能用事实正确率提高抵消任一核心创作维度退化。</li><li>如果最小块导致创作碎片化，先调整查询扩父/邻块策略；如果父块导致模仿旧文，减少软原文并保留硬事实。不得用全书资料包作为永久兜底。</li><li>召回到的风格和相似场景允许不用；人物声音证据最多2—4条且不得要求复写句式。</li><li>样本不足或评审分歧大时结论为不确定，保持旧策略或实验态，不升级为默认。</li></ul><h5>8. 测试与证据等级</h5><h6>E0：规格</h6><p>本文、DEC-017、数据字段、默认参数、基线、停止和回滚规则完整且无冲突。</p><h6>E1：机制存在</h6><p>存在版本化切片器、块/快照Schema、Repository、投影任务、原子清单指针、FTS/向量构建、来源回链和诊断接口。</p><h6>E2：构造与故障测试</h6><ul><li>每个叶子块能按字节范围和哈希精确恢复原文；父子包含、顺序和邻接正确。</li><li>除显式分类的空白/分隔符外，叶子范围覆盖完整来源且不存在非预期交叉；重复构建结果确定。</li><li>对话、动作—反应、超长段落、诗歌、书信、属性面板、跨章场景、梦境、回忆、谎言和反事实通过边界夹具。</li><li>两书、正式/临时、当前/旧正史零串线；构建中断、重复执行、旧模型、错水位、目录损坏、原子切换和回滚通过。</li></ul><h6>E3：独立金标与满规模</h6><ul><li>在500万字符、1500章语料上分层抽样，查询和边界金标与切片器规则、固定同义词和实现代码独立。</li><li>至少比较固定500＋100重叠、纯段落/语义切片、本文父子块＋零盲目重叠三组；80—1
