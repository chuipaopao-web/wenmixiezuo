正文候选 → 作者定稿 → 章节结算
  ↓
事件结算 → 卷结算 → 下一卷</code></pre><p>每一层只规划自己的尺度。上层规定目标、边界和因果，下层保留表达自由。规划是未来，结算是已发生事实。</p><h2>2. 页面与交互原则</h2><ul><li>登录后进入当前账号的创作台。书籍切换、创作阶段和中心工作区是当前基础概念，具体导航位置、封面、卡片和视觉可继续重设计。</li><li>桌面优先提供稳定主工作区和按需上下文/比较面板；手机将侧栏和多栏转换为抽屉、分段页或全页编辑，不缩小硬塞。</li><li>每页按空、编辑、AI工作中、待作者决定、完成、失败/恢复设计；同一状态只保留一个显著主操作。</li><li>顶部/侧边导航只负责定位；当前对象、真实进度、作者输入、AI候选、活动定稿和下一步在内容区清楚区分。</li><li>过程信息完成后收起，正文和作者决定优先；可选说明和高级设定按需展开。</li><li>普通创作页面只用自然语言，不显示任务/讨论/ContextPack/方法/模型内部ID、阶段键、哈希、JSON、SQL、路径、Worker或SSE；技术证据保留在管理员审计。</li><li>360/390/430px无非预期横向溢出，主要触控目标约44px，输入字号至少16px，键盘弹起后当前输入和提交仍可达。</li></ul><p>正式生产通过当前业务对象上的作者补充、AI方案、差异比较、选择/摘片、融合、修改和确认推进。独立灵感不推进状态、不修改正式对象；只有作者主动摘录并绑定目标对象后才成为正式输入。</p><p>当前页面与能力清单见 <code>docs/FEATURE_IMPLEMENTATION_GUIDE.md</code>。清单用于说明功能可达，不冻结入口数量、页面布局或视觉风格。</p><h2>3. 开书</h2><h3>作者输入</h3><p>书名、频道/分类、题材、初始角色、必须遵守、特殊机制、开篇信息和自由补充。每项保留原文与版本。书籍简介不在开书时采集；第一卷方案确认后，书名与书籍简介由主编依据第一卷故事、设定基线和开书信息设计多套候选，作者选一套直接采用。</p><h3>系统动作</h3><p>先校验再原子创建书籍、定位版本、当前团队、模型绑定、预算和设定工作区。创建成功后展示下一步，由作者主动选择设定项并开始AI设计，不自动启动长任务。</p><h3>AI边界</h3><p>开书只做理解和准备，不直接生成卷纲、事件、章纲或正文。</p><h2>4. 设定</h2><h3>交互</h3><p>设定只设计不涉及具体卷剧情的书籍骨架。四项固定核心为故事舞台、主角底板、规则与代价、边界与留白；题材决定的力量、势力、资源、长期吸引力等作为可选项，作者可以以后补。</p><p>进入当前项时先看到任务说明、参与成员和“召集成员讨论”；启动后显示三名成员各自的准备中/工作中/完成/失败状态、实际上下文摘要和输出摘要，方案返回后才显示三份卡片。作者原文、补充想法和修改意见默认折叠，点击时展开。作者可以：</p><ul><li>选一份；</li><li>选取一份或多份完整方案；</li><li>摘取多份方案中的局部片段再组合；</li><li>输入自己的版本；</li><li>补充必须/偏好/灵感；</li><li>要求某一份重做；</li><li>确认、稍后补充、故意留白或不适用。</li></ul><h3>AI介入</h3><p>主编和两位编剧读取同一最小资料包，互相不可见，各给一份真正推荐的方案。选择以稳定方案ID保存；作者选择后仅主编整理，不重新启动全团队。设定成员只在规则、能力、资源或世界逻辑需要时提供检查。作者界面只保留方案正文、理由、收益、代价和恢复入口，不暴露任务、供应商、模型或决策内部编号。</p><h3>解锁</h3><p>只有本书动态计算出的必要项确认后才生成活动设定版本；建议项不能锁死创作。</p><h2>5. 分卷</h2><h3>作者输入</h3><p>卷名、卷目标、预计体量、卷末状态、主要冲突和自由想法。作者可以用大白话补充“这一卷想让读者最期待什么”，不先选择专业结构。</p><h3>具体路线</h3><p>系统在后台从版本化叙事方法库选择并组合适合本书、本卷的骨架，普通创作界面永不显示专业方法名称。每次至少返回两条真正不同的具体路线，直接说明主角动机、局势升级、关键选择与代价、高潮解决、卷末接口、收益和风险。两条路线至少在主角动机、关键代价、高潮解决、卷末局面或升级过程中的两项不同，不能只换标题。</p><p>第一卷候选必须附带故事脊柱和开篇兑现计划：前500字的抓力职责、第一至第三章各自的行动/压力/兑现/下一期待，以及第一卷结束前或约10万字以内的重大高潮。故事脊柱只保存长期欲望、核心压力、重大转向、长期兑现和允许探索的空白，不提前细化事件。后续卷加入上一卷真实结算、人物关系、开放问题、未兑现承诺和当前局势后，重新生成具体路线。</p><h3>AI介入</h3><p>两位异模型编剧分别按冻结的不同内部骨架给出完整卷方案；主编在两份真实方案完成后比较目标覆盖、因果、高潮、人物变化和风险，形成融合候选。作者仍可直接选择、融合和编辑，内部方法来源只进审计。</p><h2>6. 事件链</h2><p>事件链把卷目标拆成可完成的小故事。作者可在生成前补充希望保留的事件数量、顺序或阶段；这些原话绑定当前卷的事件链对象，生成时同时继承确认卷方向仍有效的作者输入，不要求作者重复填写。两位异模型编剧独立拆链，主编只在两份完整候选保存为模型调用证据后融合为一条供作者确认的事件链。候选席从正式编剧岗位中按当前任务的长结构输出能力选择，并继续排除与第一编剧相同的供应商/模型绑定；某个模型已被真实证据证明在完整事件链上连续只输出思考块时，可由另一正式异模型编剧技术补位，但岗位人数、冻结资料包和两候选责任不变。两席并行调用必须全部终态后再统一成功或失败，不能一席先失败就让另一席丢失租约。编剧第二次输出若事件结构与因果合法、唯一问题只是卷责任稳定键漏标，或七项首卷硬责任齐全但额外混入了某个合法卷责任键，可作为内部故事候选交主编补齐映射或由系统过滤误放项；任意伪造键、首卷责任缺失和最终融合稿不适用该例外。方向版本标识由系统绑定当前活动版本，不让模型选择数据库对象。每个事件至少记录：标题、进入时的主角与局面状态、触发、目标、阻力、人物选择与代价、事件结果、人物与关系变化、结束条件与钩子、对应卷任务、预计章数和下一事件接口。</p><p>作者可见事件链默认使用故事动脉：节点显示事件标题、为什么现在发生，以及本卷开场、上一幕已发生或预计承接的局面；节点之间用“因为……所以……”说明因果。选中节点后默认显示由同一组正式字段即时组合的故事预告，包括上一幕、眼前麻烦、不得不作出的选择和这一幕会走到哪里。作者可以切换细节视图查看目标、阻力、选择与代价、结果、人物变化和下一事件接口。故事视图不生成第二份规划、不把预计结果冒充正史，也不能替代后台结构化因果字段。</p><p>事件之间必须用可检查的因果合同承接：上一事件实际结果 → 主角与局面新状态 → 无法回避的新问题 → 主角行动与代价 → 本事件结果 → 下一事件接口。不能只靠巧合、新敌人突然出现或计划摘要代替真实结算。</p><p>作者可以拖动、插入、删除、拆分或合并；系统实时检查因果断裂、章数空洞、卷任务遗漏和上游版本过期。调整不会自动改正文或正史。</p><h2>7. 当前事件大纲</h2><p>页面顶部固定显示活动卷纲任务、完整事件链位置、上一事件实际结果、当前主角与局面状态和下一事件需要的接口。作者可用“这段剧情最想让读者感受到什么”单选一个大白话方向，也可不选或输入自己的话；底层保存版本化软参考快照，但一次不拼接多套完整节拍，所有效果都不能变成必填公式。</p><p>两位编剧独立设计当前事件的起因、升级、转折、高潮、代价、结果和结尾钩子；主编只融合当前事件，不跨事件另造主线。作者可逐部分选案、重写或直接编辑。</p><h3>事件故事视图的表达合同</h3><p>故事类标题和摘要应尽量使用现在时、主动表达、具体人物行动、选择困境和结果变化，使作者一眼看懂故事正在怎样推进。展示层只能重组当前正式字段，不得补写新设定或把AI候选当成已发生事实；生成端也不得强迫每个事件使用“但是”“没想到”等固定句式。故事视图与细节视图读取同一事件版本，作者在细节视图的修改会立即反映到故事视图。</p><h2>8. 当前事件章纲</h2><p>系统先评估事件需要多少章、总字数和节奏分配，再生成完整章链。每章显示：</p><p>第一卷前三章还分别承接已经确认的开篇职责；第一章必须把前500字目标落成场景动作和信息变化。事件高潮章必须落实卷路线要求的关键选择、代价和不可逆结果，不能只写气氛变强。</p><ul><li>章节号、标题和预计字数；</li><li>本章目标与开头抓力；</li><li>2—5个场景节拍；</li><li>人物选择、信息变化和情绪变化；</li><li>本章与事件目标的关系；</li><li>结尾钩子；</li><li>作者指导意见。</li></ul><p>作者先确认完整事件章链，再细化或重做单章。章链不得越出当前事件。</p><p>主方案由指定编剧完成。作者如拿不准关键转折、核心冲突或结尾钩子，可以点击“请另一位编剧看看”，让另一位异模型编剧只针对当前候选版本给出最多3条替代思路。每条说明另一种走法、可能更好之处、需要承担的代价和对后文的影响。挑战意见不生成第二套正式章纲、不自动融合、不改变活动版本；作者可忽略，也可据此手动修改或重新生成。候选换版后，旧挑战意见只留作审计，不再显示为当前建议。</p><h2>9. 单章正文</h2><p>一次只启动一章。写手获得完整本章纲、四项核心设定全文、与本章相关的可选设定全文、其余设定目录、当前卷/事件约束、最近1—3章正式原文与结算、线程账本和按需检索证据；对话、动作、描写和细节可以自由发挥。</p><p>初稿完成后并行启动：</p><ul><li>事实审查：只指出可引用来源的事实矛盾和需确认项。</li><li>文学审查：指出具体段落的语言、节奏、重复、场景和人物声音问题。</li><li>体验审查：用目标读者口吻说明期待、困惑、爽点和弃读风险。</li></ul><p>作者决定是否改。定点修订不能改动未授权情节；定稿生成不可变正文版本。</p><h2>10. 结算</h2><p>章节结算从定稿正文更新已发生事实、人物状态、关系、时间、伏笔、摘要、线程账本和投影。事件结算比较事件大纲与实际，确定下一事件触发。卷结算比较卷纲与实际，形成卷总结、遗留问题和下一卷起点；下一卷根据该真实结算生成两条新的具体路线。</p><p>结算不为了让计划显得正确而改写正文事实。</p><h2>11. 上下文规则</h2><ul><li>开书：完整作者输入。</li><li>设定：完整开书＋当前项＋前置确认＋本项作者原话。</li><li>卷纲：完整开书骨架＋四项核心设定全文＋可选设定导航与按需全文＋上一卷真实结算＋当前状态＋作者卷想法。</li><li>事件链：分层开书/设定资料＋完整活动卷纲＋作者想法。</li><li>事件大纲：压缩上层＋完整事件链/当前事件＋上一事件实际结果和主角新状态。</li><li>章纲：压缩上层＋完整事件链和当前事件大纲。</li><li>正文：完整当前章纲＋活动卷/事件职责＋最近1—3章原文和结算＋相关正史与触发证据。</li></ul><p>其他书、未被作者摘录到当前对象的灵感、过期版本、无关候选和无依据猜测全部排除。</p><p>每个来源标注约束强度（硬事实、当前任务、软参考、创作空白）、真值状态（计划、确认、实际）和业务范围。硬事实与当前任务不按字符静默截断；超预算时先去重、去低相关软参考，仍无法装入则阻断并说明缺口。摘要只导航，事实争议回查正式源。</p><h2>12. 独立灵感</h2><p>作者从顶栏进入灵感，可选择1—3名创作成员的讨论分身。讨论分身只接收本书活动开书资料、已确认设定/规划/正史的压缩导航和作者本轮问题，并按需回查当前书正式源；它们不会获得生产任务租约，也不能调用确认、融合、正文、正史和结算写入。</p><p>每轮显示作者原话、成员身份、真实模型、任务状态和回答。讨论内容只保存在隔离域，不进入生产检索。作者可以把一段回答“摘录为灵感”，选择设定、卷纲、事件、章纲或正文对象及强度；系统保存原文、来源讨论和目标对象，之后由正常ContextCompiler按该对象规则纳入。</p><h2>13. 续写</h2><p>已有正文先预览、确认和不可变导入，再做带来源的反向拆解。作者确认人物、设定、事件和当前状态后补齐活动卷纲与事件；后续与新书使用同一章纲、正文、审查和结算流程。</p><h2>14. 失败与恢复</h2><p>每项生成任务保存幂等键、上游版本、作者输入、成员、模型、上下文包、预算、检查点和结果。已完成席位不重复调用；远程结果未知不自动重发；上游变化使候选过期；作者数据和正式正文不因任务失败回滚或删除。</p><h2>15. 已完成规划的持续可见性</h2><p>活动指针只表示当前可继续修改的对象，不等于历史内容是否存在。事件或卷完成结算后，界面继续展示已确认的卷纲、事件链、事件大纲和全部章纲，并明确标记为只读历史；作者可以核对正文从哪一版规划产生，但不能在历史页误触生成、重写、确认、冻结或结算。进入下一事件或下一卷后，新的活动对象与已完成记录并存。</p><p>状态推进与内容变更必须分开：事件从活动变为已结算、卷从活动变为已完成时，历史章纲继续校验并引用生成当时锁定的事件版本和卷纲版本，界面显示“结算版本已锁定”。只有活动上游真的换版、历史锁定来源缺失或对象被明确标记过期时，才显示重建或异常提示。</p><h2>真实模型前置门禁与长篇放行</h2><p>所有AI生成节点（设定方案、分卷、事件链、事件大纲、章纲、正文、审查、灵感和续写分析）在创建任务前检查真实创作模型。没有真实模型时不自动使用本地夹具、不生成候选、不改变正式对象，只提示作者连接模型；手工编辑、作者原文导入和已有内容阅读不受影响。</p><p>真实长篇生成按20、50、100、200章分段验收，上一阶段未通过故事性、连续性、非重复和作者盲读时不扩大到下一阶段。</p></template><template id="document-16" data-title="数据模型规格" data-path="docs/DATA_MODEL.md" data-meta="当前正式文档 · 11.1 KB · 8491080cb7f7"><h1>数据模型规格</h1><h2>1. 总原则</h2><ul><li>SQLite是正式业务数据唯一权威。</li><li>所有书内核心记录包含 <code>owner_id</code> 与 <code>book_id</code>。</li><li>已合并迁移只向前追加，不修改、不删除。</li><li>正文和关键规划采用不可变版本；活动指针与历史版本分离。</li><li>摘要、全文、向量、图谱和Wiki均可从正式对象重建。</li></ul><h2>2. 身份、书籍与模型</h2><ul><li><code>user_accounts</code>：登录账号，保存规范化邮箱、昵称、密码盐值与摘要、角色、状态和最近登录时间；邮箱唯一，账号与 <code>owners</code> 一对一。</li><li><code>auth_sessions</code>：持久登录会话，只保存随机令牌摘要、到期时间、最近活动和撤销时间；不保存明文令牌。</li><li><code>user_memberships</code>：会员记录，每账号至多一条，保存套餐（包月/包季/包年）、算力值配额、周期起止、状态（生效/撤销）与经办管理员；算力值消耗按 <code>usage_ledger</code> 周期内汇总，不单独存储余额。</li><li><code>auth_audit_events</code>：注册、成功/失败登录、退出、暂停和恢复审计；不进入模型上下文或作者导出。</li><li><code>owners</code>：每个注册账号对应的创作数据所有者；首位管理员复用历史本机老板所有者，后续账号各自新建所有者。</li><li><code>books</code>：书籍、状态、版本、正史修订和活动主编epoch。</li><li><code>book_onboarding_profiles</code>、<code>positioning_versions</code>、<code>book_expression_profiles</code>：开书原始资料、定位与表达基线版本。</li><li><code>book_branding_designs</code>：主编设计书名或书籍简介的任务记录、候选方案和来源指纹；采用结果写回开书蓝图的不可变新版本，不原地覆盖。</li><li><code>role_templates</code>、<code>agent_instances</code>：岗位模板和逐书Agent实例。</li><li><code>model_config_snapshots</code>、<code>agent_model_bindings</code>：不可变模型快照与活动绑定。</li><li><code>editor_leases</code>、<code>writer_leases</code>：主编和写手租约。</li><li><code>budgets</code>、<code>budget_reservations</code>、<code>usage_ledger</code>：调用预算和结算。</li></ul><h2>3. 作者输入与附件</h2><ul><li><code>author_planning_inputs</code>：作者附着于设定、卷、事件、章纲或正文的原话，保存意图等级、版本和状态。</li><li><code>author_input_links</code>：作者输入与生成任务/候选的有序关联。</li><li><code>author_attachments</code>：作者附件正式对象，保存原件、解析状态、摘要、绑定对象和来源；当前规划链接类型统一为 <code>author_attachment</code>。</li><li>0042迁移将旧库中的附件表原位升级，不复制或删除附件内容；<code>origin_record_id</code> 与 <code>origin_attached_at</code> 只保留历史来源，不进入当前作者接口或创作语义。</li></ul><h2>4. 设定协作</h2><ul><li><code>setting_outline_workspace</code>：当前设定项、状态、候选和确认结果。</li><li><code>setting_outline_item_versions</code>：设定项不可变版本链；每次确认追加一条版本并记录来源（manual/guidance/discussion），当前生效内容仍以 <code>setting_outline_workspace</code> 为准。</li><li><code>setting_proposal_fragments</code>：设定类目讨论三席提案拆出的可勾选碎片；按提案落库，解析失败时以整份方案作单条 implicit 碎片兜底。</li><li><code>setting_fusion_drafts</code>：主编按作者勾选碎片产生的融合稿；保存所选碎片、段级来源标记（fragment/stitch）与融合正文，按设定项取最新一份。</li><li><code>discussions</code>、<code>discussion_participants</code>、<code>discussion_opinions</code>、<code>discussion_decisions</code>：对象化AI提案、独立意见与主编整理记录。</li><li>独立提案保存真实Agent、模型快照和输出；作者选择、组合、修订和确认另行记录。</li></ul><h2>5. 卷—事件—章纲规划</h2><ul><li><code>volume_plans</code>及版本表：活动卷纲、候选、模板实例与版本/哈希快照、作者输入、上游依赖和历史切换。</li><li><code>story_events</code>及版本表：卷内事件链、顺序、进入状态、因果触发、选择与代价、结果、结束钩子、下一事件接口、事件卡和事件大纲。</li><li>叙事模板注册表由后端统一版本化发布；活动规划只保存不可变模板引用与节拍快照，不依赖前端硬编码，也不允许规则更新原地改变旧规划。</li><li>模板推荐信号是按当前 <code>owner_id + book_id</code> 即时编译的非权威排序输入，来源限于开书资料、活动卷和最近真实卷结算，不写入正史。</li><li><code>event_chapter_outlines</code>及版本表：当前事件章链、章节详细章纲、预计字数和上游版本引用。</li><li>章纲挑战意见不是正式规划对象，不新增真相表；它随任务检查点、上下文包和模型调用保存，并冻结目标候选版本。作者主动修改或重新生成后，新的章纲版本才成为正式候选。</li><li><code>planning_settlement_assessments</code>：事件/卷计划与实际差异及下一层承接。</li></ul><p>规划对象描述未来，不直接写入正史。活动版本必须引用活动上游版本；上游改变后旧候选标记过期。</p><h2>6. 章节与正文</h2><ul><li><code>volumes</code>、<code>chapters</code>：物理卷与章节目录。</li><li><code>manuscript_versions</code>：完整不可变正文版本。</li><li><code>writer_selections</code>、<code>chapter_work_orders</code>：活动写手与冻结写作工单。</li><li><code>review_reports</code>、<code>editor_review_syntheses</code>：事实、文学、体验独立报告和可执行修订清单。</li><li><code>chapter_settlements</code>及派生表：定稿后实际发生内容、人物状态、伏笔和投影更新。</li></ul><h2>7. 正史、知识和检索</h2><ul><li>正史事实、实体、关系、时间线、开放线程和来源表：只接收作者确认资料或定稿结算。</li></ul><h3>资料库公开视图</h3><ul><li>作者可见界面统一称“配角”；<code>entities.entity_type=&#039;character&#039;</code>只是稳定内部存储键，同时包含主角与配角，不能被前端直接当作“配角”分类。公开配角视图通过同书主角档案的<code>entity_id</code>和姓名确定性排除主角，不修改旧实体键。</li><li>设定来源、正式实体/事实、人物当前状态和正文事件时间线是四类不同投影视图，不能互相复制或替代。</li><li>主角状态使用<code>protagonist_state_entries</code>追加修订，<code>state_status</code>与<code>effective_chapter_number/story_time</code>表达获得、有效、消耗、失去、死亡、退役或归档及发生位置；历史永不由当前面板删除。</li><li>公开资料档案按实体类型聚合可选字段：配角身份/年龄/性格/归属/境界/实力/属性/装备/关系，势力负责人/规模/实力/等级/驻地/地位/成员，地点类型/上级区域/方位/特点，道具资源类型/等级/属性/效果/数量/归属/状态/流转。聚合结果是可重建查询视图，底层仍以实体、正式事实、状态历史和不可变来源为准；缺失值不补造。</li><li>地点资料与世界路线图分开。路线节点来自地点首次正式出现或作者确认出生地，边来自章节先后或明确移动事实；无方向证据时方向为空，不持久化虚构坐标。</li><li>作者事件时间线由已结算<code>story_events</code>、章节覆盖、<code>stage_settlements</code>及正文事实聚合；规划版本只提供后台归属，实际状态必须来自结算。正文没有明确故事时间时保存空值，公开<code>display_time</code>回退为章节范围，不伪造日期。</li><li><code>chunk_snapshots</code>与检索块：不可变切片快照和原子活动指针。</li><li>FTS表：关键词与短语检索投影。</li><li>LanceDB：本地向量投影，可删除重建，不能成为事实源。</li><li>Wiki、图谱、摘要：派生导航，必须保留来源指针。</li></ul><h2>8. 任务、调用与审计</h2><ul><li><code>tasks</code>、<code>task_attempts</code>、<code>task_phases</code>、<code>task_dependencies</code>：持久任务、尝试、检查点和依赖。</li><li><code>context_packs</code>：每次调用冻结的来源清单、预算、哈希和排除项。</li><li><code>model_calls</code>、<code>model_call_results</code>、<code>model_call_reconciliations</code>：模型调用、结果与中断调和。</li><li><code>projection_outbox</code>、<code>projection_jobs</code>：正式事务到可重建投影的可靠交接。</li><li>操作、备份、恢复、永久删除墓碑和安全审计表记录不可逆或高风险动作。</li></ul><h2>9. 迁移与保留</h2><p>已合并迁移保持不可变，新增结构使用向前迁移。作者原件、正式正文、任务来源和恢复记录按数据生命周期保留；永久清理作者数据只能通过书籍彻底删除流程执行。</p><p>迁移中的旧表名、旧字段名和旧任务类型只承担升级或恢复职责，不得作为当前Repository、路由、检索源或作者界面契约。</p><h2>10. 关键不变量</h2><ul><li>跨书查询结果必须为0。</li><li>一个书内同一层级最多一个活动版本。</li><li>正文修改必然产生新版本。</li><li>投影删除或损坏不能破坏正式源。</li><li>未确认候选不能升级为正史。</li><li>任务结果提交必须通过租约、attempt、书籍和主编epoch校验。</li></ul><h2>作者可见名称与稳定关联键</h2><p>功能显示名与持久化关联分离：</p><div class="table-scroll"><table><thead><tr><th>作者看到的名称</th><th>稳定功能键</th><th>作者输入 surface</th><th>主要正式对象</th></tr></thead><tbody><tr><td>信息</td><td>framework</td><td>book_profile</td><td>开书信息与书籍档案</td></tr><tr><td>设定</td><td>basic</td><td>setting</td><td>设定活动版本、候选与基线</td></tr><tr><td>分卷</td><td>master</td><td>volume_plan</td><td>volume_plans及版本</td></tr><tr><td>规划</td><td>event</td><td>event</td><td>story_events、事件链与事件大纲版本</td></tr><tr><td>章纲</td><td>chapter</td><td>chapter_outline</td><td>event_chapter_outlines及版本</td></tr><tr><td>正文</td><td>manuscript</td><td>manuscript</td><td>manuscript_versions</td></tr><tr><td>资料库</td><td>library</td><td>无直接作者输入面</td><td>可重建资料、图谱与来源投影</td></tr><tr><td>取名</td><td>naming</td><td>无固定surface</td><td>命名候选与占用记录</td></tr></tbody></table></div><p>团队、任务、灵感和设置是工具域，不改变上述创作对象的数据库身份。显示名称改动不得修改已合并迁移、表名、枚举、对象ID或历史来源文字。已有历史文字通过作者展示层只读转换，新数据继续使用稳定键建立关联。</p><h2>11. 账号数据不变量</h2><ul><li>规范化邮箱全局唯一；一个账号只绑定一个 <code>owner_id</code>，一个 <code>owner_id</code> 只绑定一个账号。</li><li>首个注册账号在同一写事务中成为管理员；至少保留一个活动管理员。</li><li>历史本机老板所有者只能由首位管理员接管一次；接管只更新账号到所有者的一对一关联，不复制或改写任何书籍与创作对象。第二个及以后账号不得复用该所有者。</li><li>密码、密码盐值、会话令牌或令牌摘要不得进入公开 API、日志、模型上下文、书籍导出或检索投影。</li><li>账号暂停立即撤销该用户全部活动会话，不删除其书籍和创作数据。</li><li>书籍、任务、附件、检索和 SSE 的 <code>owner_id</code> 只能来自登录会话；客户端提交值不能扩大权限。</li></ul><h2>分层设计的兼容数据</h2><ul><li>活动设定核心键固定为world-stage、protagonist-situation、rules-costs、boundaries-blanks；story-kernel和opposition等历史键继续作为可选或旧版项读取，不迁移删除作者数据。</li><li>卷内容JSON可选保存routeCard、storySpine和firstVolumeLaunch；旧卷缺失时解析成功，新卷确认后随版本不可变。</li><li>内部叙事方法保存版本、方法键和任务快照，作者公开投影不保存或返回专业名称。</li><li>设定融合选择保存稳定方案ID、完整方案ID列表、片段来源和作者文字，不保存依赖前端排序的数组下标。</li><li>ContextPack不可变来源清单保存约束强度、真值状态、业务范围和依赖，并参与来源指纹。</li></ul></template><template id="document-17" data-title="当前生效决定" data-path="docs/DECISIONS.md" data-meta="当前正式文档 · 3.8 KB · ce29f6b69e41"><h1>当前生效决定</h1><blockquote>本文件只保留会影响下一次开发的短决定。2026-08-21以前的完整决定日志保留在 Git 基线 <code>e8517d9</code>，必要时按编号追溯；默认开发不读取。</blockquote><h2>DEC-CURRENT-093 轻量规则与持续UI迭代（2026-08-21）</h2><ol><li>项目仍是未完成的初始产品，功能、工作流细节、页面结构、导航密度、卡片数量和视觉风格都允许继续调整；旧截图和旧文档不得冻结 UI。</li><li>默认阅读改成任务路由：新开发任务读一次短 <code>HANDOFF.md</code>；单页 UI 只读相关代码和 UI Skill；长篇工作流才触发长篇质量 Skill；大型规格仅按需查相应小节。</li><li>规则和验收按风险分级。普通 UI/文案不再强制设计审查、全量测试、四端构建、迁移恢复、真实模型或长期章节验收。安全/数据/核心工作流仍使用完整门禁。</li><li>Web 静态资源独立发布不重启后端时不要求等待任务清零；API、Worker或迁移发布继续执行连续30秒零在途任务和回滚门禁。</li><li>历史事故、旧验收证据和一次性发布日志只留在 Git 历史，不进入默认阅读、当前文档中心或产品检索。</li><li>长篇质量 Skill 只保护对象边界、真值、上下文、创造性和运行闭环，不固定 UI、团队呈现、测试数量或部署流程。</li><li>新增项目级 <code>wenmi-ui-ux</code> Skill，手机优先、逐层显露、单状态单主操作；大规模视觉重设计可按需使用已安装的 OpenAI 官方 <code>frontend-app-builder</code>。</li></ol><h2>当前产品决定摘要</h2><h3>分层创作</h3><p>开书给基础方向，设定只做非剧情骨架，卷定大故事方向，事件链定卷内因果，事件大纲定小故事，完整章链定顺序，近期详细章纲定场景与情绪，正文自由执行，结算只记实际。作者不需要一次填完整本书。</p><h3>设定与上下文</h3><p>核心设定为世界舞台、主角底板、规则与代价、边界与留白；其他设定按需补。作者原话绑定具体对象并区分必须、强偏好、灵感和问题。ContextCompiler按硬事实、当前任务、软参考和开放区编译，排除其他书、未确认候选、未摘录灵感和过期版本。</p><h3>卷路线与首卷</h3><p>后台结构方法版本化、可审计，普通作者只看至少两条具体且有实质差异的故事路线，可整选、片选、融合、编辑或重做。首卷必须设计前500字兴趣职责、黄金三章整体承诺、持续追读变化、防疲劳和约10万字内或卷末重大高潮；不得把打脸、战斗、反转等手段硬编码成统一公式。</p><h3>作者界面</h3><p>普通作者只看业务名称、自然状态、差异、结果和恢复动作，不看模型供应商、内部任务/讨论/方法ID、JSON、路径或堆栈。页面要逐层推进、少填少选、手机优先；作者始终可以修改、留空、重做或回到上一步。现有左书栏和顶部功能栏可作为连续性起点，但不是不可改变的门禁。</p><h3>数据与账号</h3><p>本机和公网使用统一账号登录；业务身份只来自已验证会话。核心对象携带 <code>owner_id</code>、<code>book_id</code>；正文不可变；SQLite正式对象是权威源，索引和摘要可重建。普通删除归档，永久删除需双重确认。</p><h3>AI协作与质量</h3><p>产品当前使用14名创作成员，岗位、实例和模型绑定解耦；成员数量或呈现如需调整，以老板后续决定和产品规格为准。同模型不冒充异模型独立复核。事实一致性不能以牺牲原创性、人物选择、合理惊喜、情绪力度和可读性为代价。</p><h3>验收与声明</h3><p>工程可达、真实模型质量和长期阅读效果分开声明。字段存在、页面可见或确定性夹具只证明工程层；文学质量必须来自真实内容阅读。默认按变更风险选择测试，不再把旧的148项总表作为每次开发门禁。</p></template><template id="document-18" data-title="文秘写作 · 公网部署指南" data-path="docs/DEPLOY.md" data-meta="当前正式文档 · 11.2 KB · 3f7a971800fe"><h1>文秘写作 · 公网部署指南</h1><p>本文档说明如何将文秘写作部署到香港云服务器，通过 <code>wenmixiezuo.com</code> 域名对外提供服务。</p><h2>部署架构</h2><pre class="code-block"><code data-language="">用户浏览器 (HTTPS)
       │
       ▼
  Caddy 反向代理 (:443)          ← TLS 终止、安全头、请求大小限制
       │
       ├─ /api/*  ──→  API 服务 (127.0.0.1:43111)
       ├─ /health  ──→  API 健康检查
       └─ 其他      ──→  静态文件 (apps/web/dist)
                              │
                              ▼
                         Worker 服务 (独立进程)
                              │
                              ▼
                         SQLite (WAL 模式)
                         LanceDB (向量检索)</code></pre><ul><li><strong>Caddy</strong>：反向代理 + TLS（Let&#039;s Encrypt 自动证书）+ 静态文件；限流由应用层 <code>@fastify/rate-limit</code> 提供（注册 3/5分钟、登录 10/5分钟、全局 100/分钟），Caddy 配置只使用内置模块，无需 xcaddy 编译插件</li><li><strong>API</strong>：Fastify 5，监听 <code>127.0.0.1:43111</code>，不直接暴露公网</li><li><strong>Worker</strong>：独立进程，监听 <code>127.0.0.1:43111</code> 内部端点，执行模型任务</li><li><strong>数据库</strong>：<code>node:sqlite</code> 内置 SQLite，WAL 模式，文件存储于 <code>data/database/</code></li></ul><h2>前置条件</h2><h3>1. 服务器</h3><ul><li><strong>操作系统</strong>：Ubuntu 24.04 LTS（推荐）或 22.04 LTS</li><li><strong>CPU</strong>：4 核以上（LanceDB 向量索引需要）</li><li><strong>内存</strong>：4 GB 以上（推荐 8 GB，模型推理时 <code>@huggingface/transformers</code> 需要）</li><li><strong>磁盘</strong>：40 GB 以上（系统 + 项目 + 数据库 + 备份）</li><li><strong>网络</strong>：公网 IP，端口 80 和 443 可访问</li></ul><h3>2. 域名</h3><ul><li>购买 <code>wenmixiezuo.com</code>（任意域名注册商）</li><li>将域名 DNS A 记录指向服务器公网 IP</li><li>等待 DNS 生效（通常 5-30 分钟）</li></ul><h3>3. 软件依赖</h3><pre class="code-block"><code data-language="bash"># 更新系统
sudo apt update &amp;&amp; sudo apt upgrade -y

# 安装 Node.js 24（使用 NodeSource）
curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
sudo apt install -y nodejs

# 验证版本
node --version   # 应输出 v24.x.x
npm --version    # 应输出 11.x.x

# 安装 Caddy
sudo apt install -y debian-keyring debian-archive-keyring apt-transport-https
curl -1sLf &#039;https://dl.cloudsmith.io/public/caddy/stable/gpg.key&#039; | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
curl -1sLf &#039;https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt&#039; | sudo tee /etc/apt/sources.list.d/caddy-stable.list
sudo apt update
sudo apt install -y caddy

# 安装 SQLite 命令行工具（用于备份）
sudo apt install -y sqlite3

# 安装其他工具
sudo apt install -y git curl unzip build-essential</code></pre><h2>部署步骤</h2><h3>第一步：创建系统用户</h3><pre class="code-block"><code data-language="bash">sudo useradd -r -m -d /opt/wenmi -s /bin/bash wenmi
sudo usermod -aG wenmi wenmi</code></pre><h3>第二步：部署项目代码</h3><pre class="code-block"><code data-language="bash"># 克隆仓库（替换为实际仓库地址）
sudo mkdir -p /opt/wenmi
sudo chown wenmi:wenmi /opt/wenmi
sudo -u wenmi git clone https://github.com/chuipaopao-web/wenmixiezuo.git /opt/wenmi

# 或者从本机 rsync 上传
# rsync -avz --exclude &#039;node_modules&#039; --exclude &#039;data&#039; \
#   ./ wenmixiezuo.com:/opt/wenmi/</code></pre><h3>第三步：安装依赖并构建</h3><pre class="code-block"><code data-language="bash">cd /opt/wenmi
sudo -u wenmi npm ci --ignore-scripts
sudo -u wenmi npm run build</code></pre><h3>第四步：配置环境变量</h3><pre class="code-block"><code data-language="bash"># 复制模板
sudo -u wenmi cp deploy/.env.production.example deploy/.env.production

# 编辑配置，填入真实的 API Key 和模型 ID
sudo -u wenmi nano deploy/.env.production</code></pre><p><strong>必须配置的变量：</strong></p><div class="table-scroll"><table><thead><tr><th>变量</th><th>说明</th></tr></thead><tbody><tr><td><code>WENMI_PUBLIC_ORIGIN</code></td><td><code>https://wenmixiezuo.com</code></td></tr><tr><td><code>WENMI_ARK_AGENT_PLAN_API_KEY</code></td><td>火山方舟 Agent Plan API Key</td></tr><tr><td><code>WENMI_ARK_AGENT_PLAN_*_MODEL</code></td><td>各模型的端点 ID</td></tr><tr><td><code>WENMI_WORKER_TOKEN</code></td><td>建议设置固定值（至少 32 字符）</td></tr></tbody></table></div><blockquote><strong>创作模型来源二选一</strong>：配置 <code>WENMI_ARK_AGENT_PLAN_API_KEY</code>（火山方舟 Agent Plan）或 <code>WENMI_OPENCODEGO_API_KEY</code>（opencodego，配置后优先，角色模型默认沿用 Agent Plan 同款分配）。opencodego 的地址/逐角色模型覆盖见 <code>deploy/.env.production.example</code>。注意 opencodego 的 go 目录当前没有豆包模型：未显式设置 <code>WENMI_OPENCODEGO_DOUBAO_MODEL</code> 时体验席自动保留方舟 Agent Plan 绑定，因此切换 opencodego 后仍需保留 <code>WENMI_ARK_AGENT_PLAN_API_KEY</code>。</blockquote><h3>第五步：运行数据库迁移</h3><pre class="code-block"><code data-language="bash">cd /opt/wenmi
sudo -u wenmi npm run migrate</code></pre><h3>第六步：安装本地嵌入模型（可选但推荐）</h3><pre class="code-block"><code data-language="bash">cd /opt/wenmi
sudo -u wenmi npm run models:install</code></pre><h3>第七步：配置 Caddy</h3><pre class="code-block"><code data-language="bash"># 安装 Caddy 配置
sudo cp /opt/wenmi/deploy/Caddyfile /etc/caddy/Caddyfile

# 创建日志目录
sudo mkdir -p /var/log/caddy
sudo chown caddy:caddy /var/log/caddy

# 验证配置
sudo caddy adapt --config /etc/caddy/Caddyfile

# 启动 Caddy
sudo systemctl enable caddy
sudo systemctl restart caddy</code></pre><h3>第八步：配置 systemd 服务</h3><pre class="code-block"><code data-language="bash"># 安装服务单元文件
sudo cp /opt/wenmi/deploy/wenmi-api.service /etc/systemd/system/
sudo cp /opt/wenmi/deploy/wenmi-worker.service /etc/systemd/system/

# 重新加载 systemd
sudo systemctl daemon-reload

# 启动服务
sudo systemctl enable wenmi-api wenmi-worker
sudo systemctl start wenmi-api

# 等待 API 就绪后启动 Worker
sleep 5
sudo systemctl start wenmi-worker</code></pre><h3>第九步：配置自动备份</h3><pre class="code-block"><code data-language="bash"># 确保备份脚本可执行
sudo chmod +x /opt/wenmi/deploy/backup.sh

# 添加 cron 定时任务（每日凌晨 3 点）
sudo -u wenmi crontab -e
# 添加以下行：
# 0 3 * * * /opt/wenmi/deploy/backup.sh &gt;&gt; /var/log/wenmi-backup.log 2&gt;&amp;1</code></pre><h3>第十步：验证部署</h3><pre class="code-block"><code data-language="bash"># 检查 Caddy 状态
sudo systemctl status caddy

# 检查 API 状态
sudo systemctl status wenmi-api
curl -s http://127.0.0.1:43111/health | python3 -m json.tool

# 检查 Worker 状态
sudo systemctl status wenmi-worker

# 检查 HTTPS 访问
curl -s https://wenmixiezuo.com/health | python3 -m json.tool</code></pre><h2>日常运维</h2><h3>查看日志</h3><pre class="code-block"><code data-language="bash"># API 日志
sudo journalctl -u wenmi-api -f -n 100

# Worker 日志
sudo journalctl -u wenmi-worker -f -n 100

# Caddy 访问日志
sudo tail -f /var/log/caddy/wenmi-access.log

# 备份日志
sudo tail -f /var/log/wenmi-backup.log</code></pre><h3>重启服务</h3><pre class="code-block"><code data-language="bash"># 先停 Worker（等待当前任务完成）
sudo systemctl stop wenmi-worker
# 再停 API
sudo systemctl stop wenmi-api
# 启动 API
sudo systemctl start wenmi-api
# 再启动 Worker
sleep 5
sudo systemctl start wenmi-worker</code></pre><h3>更新部署</h3><p>服务器在线目录不含<code>.git</code>。所有构建先在公网不可见的 <code>/opt/wenmi-releases/&lt;commit&gt;</code> 完成，在线目录只做经过验证的原子切换。</p><h4>Web-only（不改API、Worker、迁移）</h4><ol><li>本机运行相关Web测试、Web类型检查/构建和文档检查；提交后用LF归档上传暂存目录。</li><li>在暂存目录构建Web，验证入口和哈希资源；不得先覆盖当前在线 <code>apps/web/dist</code>。</li><li>把新哈希JS/CSS作为新增资源放入在线静态目录，保留旧哈希资源；备份旧<code>index.html</code>后原子替换入口。</li><li>验证首页、新资源、登录、目标页面和旧入口回滚。此流程不重启API/Worker、不改数据库，因此不等待在途任务清零。</li></ol><h4>API / Worker / 数据迁移</h4><ol><li>本机按风险运行完整 <code>npm run verify</code> 及受影响迁移/恢复测试；使用 <code>git -c core.autocrlf=false -c core.eol=lf archive</code> 生成发布包。</li><li>在唯一暂存目录完成受影响服务构建和迁移预检；迁移只向后兼容，已合并迁移字节变化立即停止。</li><li>正式迁移前备份数据库。查询 <code>tasks</code>，<code>working</code>、<code>queued</code>、<code>pending</code>、<code>waiting_confirmation</code> 连续30秒为0，并在每次重启前立即复核；只等待，不取消/暂停/改写作者任务。</li><li>逐个原子切换并重启受影响服务，每一步检查active、日志、健康和任务恢复；失败立即回滚，不继续扩大。</li><li>最后切换需要更新的Web入口，验证旧缓存兼容、登录、书籍隔离和核心链路。旧构建保留到验收结束。</li></ol><p>暂存、备份和切换路径带提交号，不复用未核验旧目录。发布命令逐步执行并逐步看结果。</p><h3>手动备份</h3><pre class="code-block"><code data-language="bash">sudo -u wenmi /opt/wenmi/deploy/backup.sh</code></pre><h3>恢复备份</h3><pre class="code-block"><code data-language="bash"># 1. 停止服务
sudo systemctl stop wenmi-worker wenmi-api

# 2. 校验备份文件
sha256sum -c /opt/wenmi/data/backups/daily/wenmi-YYYYMMDD.sqlite.sha256

# 3. 替换数据库
sudo -u wenmi cp /opt/wenmi/data/database/wenmi.sqlite \
  /opt/wenmi/data/database/wenmi.sqlite.before-restore
sudo -u wenmi cp /opt/wenmi/data/backups/daily/wenmi-YYYYMMDD.sqlite \
  /opt/wenmi/data/database/wenmi.sqlite

# 4. 恢复文件
sudo -u wenmi tar -xzf /opt/wenmi/data/backups/daily/wenmi-files-YYYYMMDD.tar.gz \
  -C /opt/wenmi/data/

# 5. 启动服务
sudo systemctl start wenmi-api
sleep 5
sudo systemctl start wenmi-worker

# 6. 验证健康检查
curl -s http://127.0.0.1:43111/health | python3 -m json.tool</code></pre><h2>安全清单</h2><p>部署完成后，逐项确认以下安全检查：</p><ul><li>[ ] Caddy 已启用 HTTPS（<code>curl -I https://wenmixiezuo.com</code> 返回 200）</li><li>[ ] HTTP 自动跳转到 HTTPS</li><li>[ ] API 端口 <code>43111</code> 不对外暴露（<code>curl http://服务器公网IP:43111/health</code> 不可达）</li><li>[ ] 注册接口限流生效（短时间内连续注册 3 次后被拒绝）</li><li>[ ] 登录接口限流生效</li><li>[ ] Cookie 设置了 <code>HttpOnly</code>、<code>SameSite=Lax</code>、<code>Secure</code></li><li>[ ] 安全响应头存在（<code>X-Content-Type-Options</code>、<code>X-Frame-Options</code> 等）</li><li>[ ] 错误信息不泄露内部路径或密钥</li><li>[ ] <code>.env.production</code> 文件权限为 <code>600</code>（<code>ls -la /opt/wenmi/deploy/.env.production</code>）</li><li>[ ] 备份脚本已加入 cron 且正常执行</li><li>[ ] 第二物理备份已配置（不同磁盘或远程存储）</li></ul><h2>成本估算</h2><div class="table-scroll"><table><thead><tr><th>项目</th><th>月费（美元）</th><th>年费（美元）</th></tr></thead><tbody><tr><td>香港云服务器（4C8G）</td><td>~$25-40</td><td>~$300-480</td></tr><tr><td>域名 wenmixiezuo.com</td><td>~$1-2</td><td>~$12-15</td></tr><tr><td>Let&#039;s Encrypt 证书</td><td>免费</td><td>免费</td></tr><tr><td>火山方舟模型 API</td><td>按量计费</td><td>取决于创作量</td></tr><tr><td><strong>合计（不含模型）</strong></td><td><strong>~$26-42</strong></td><td><strong>~$312-495</strong></td></tr></tbody></table></div><p>模型 API 费用取决于实际使用量。每章正文（约 3,000-5,000 字）的模型调用费用约为 ¥0.5-3.0 人民币，包含设定、规划、正文、审查和点评的全流程。</p><h2>故障排查</h2><h3>Caddy 启动失败</h3><pre class="code-block"><code data-language="bash"># 检查端口占用
sudo ss -tlnp | grep -E &#039;:80|:443&#039;

# 检查配置语法
sudo caddy adapt --config /etc/caddy/Caddyfile

# 查看 Caddy 日志
sudo journalctl -u caddy -n 50</code></pre><h3>API 启动失败</h3><pre class="code-block"><code data-language="bash"># 查看 API 日志
sudo journalctl -u wenmi-api -n 50

# 手动运行测试
cd /opt/wenmi
sudo -u wenmi node apps/api/dist/main.js</code></pre><h3>Worker 无法连接 API</h3><pre class="code-block"><code data-language="bash"># 确认 API 已启动
curl -s http://127.0.0.1:43111/health

# 确认 Worker Token 一致
# API 启动时从环境变量读取 WENMI_WORKER_TOKEN
# Worker 启动时从同一环境变量文件读取</code></pre><h3>HTTPS 证书问题</h3><p>Let&#039;s Encrypt 证书在 Caddy 启动时自动申请和续期。如果证书申请失败：</p><pre class="code-block"><code data-language="bash"># 确认域名 DNS 已指向服务器 IP
dig wenmixiezuo.com +short

# 确认端口 80 可公网访问
sudo ufw status
sudo ufw allow 80/tcp
sudo ufw allow 443/tcp</code></pre></template><template id="document-19" data-title="设计治理与审计" data-path="docs/DESIGN_GOVERNANCE_AUDIT.md" data-meta="当前正式文档 · 2.3 KB · 4b42a51a30d8"><h1>设计治理与审计</h1><h2>何时使用</h2><p>只有以下高风险变化建立 <code>design_review_id</code>：账号/权限隔离、作者数据不可变性、数据库语义与迁移、跨服务恢复、模型计费与现金、ContextCompiler权威来源、不可逆架构或会大范围改变创作质量的机制。</p><p>纯文案、普通UI、组件重排、低风险样式、明确机械修复、局部兼容字段和可逆实验不启动完整设计审计。</p><h2>最小记录</h2><p>高风险设计在 <code>docs/DECISIONS.md</code> 或专项文档记录：</p><ul><li>问题与可观察证据；</li><li>已知事实、推断、用户偏好和未知；</li><li>采用方案与一个有价值的替代方案；</li><li>数据/权限/兼容/回滚影响；</li><li>对应测试和停止条件。</li></ul><p>不要求复制Skill全文、重复所有规格或生成固定长度报告。</p><h2>审查深度</h2><ul><li>安全、数据、权限、恢复：检查隔离、版本、来源、幂等和回滚。</li><li>上下文/检索：检查活动版本、正式来源、其他书排除、预算和可重建投影。</li><li>创作机制：再检查作者控制权、人物生命力、合理惊喜、情绪力度与题材差异，不能只提升一致性。</li><li>普通产品/UI变化：一次实现审查即可，重点看任务是否更易完成、状态是否更清楚、手机是否可达。</li></ul><p>两轮独立审查只用于不可逆或影响广泛的高风险设计，不是所有开发的默认流程。</p><h2>证据口径</h2><p>E0规格、E1机制、E2确定性工程、E3真实模型/独立阅读、E4真实长篇。只按实际证据等级陈述，不用自动测试承诺市场效果。</p><h2>精简与折旧</h2><p>规则只保留能防止当前真实风险的通用条款。事故细节、单书实体、旧测试数量、旧模型名单和一次性发布过程只留在 Git 历史，不继续污染默认提示。新增规则要能说明它防止什么；若现有基础安全或测试已经覆盖，就不再添加第二条门禁。</p><p>删除源码或正式数据前仍需确认入口、动态引用、任务、迁移、恢复和作者数据边界；文档与Skill精简优先归档，确认无当前引用后再移出默认目录。</p><h2>当前长期设计记录</h2><p>分层创作、首卷启动和内部结构路线的当前产品合同已汇总到 <code>docs/LAYERED_CREATION_IMPLEMENTATION_AND_ACCEPTANCE.md</code>。旧 <code>DR-20260820-*</code> 全文保留在 Git 基线 <code>e8517d9</code>，需要追溯时再读对应文件历史。</p></template><template id="document-20" data-title="当前开发路线" data-path="docs/DEVELOPMENT_ROADMAP.md" data-meta="当前正式文档 · 2.6 KB · df397122b31c"><h1>当前开发路线</h1><h2>P0 UI/UX整体重设计</h2><p>状态：重新打开，当前最高优先级。</p><ul><li>应用壳和手机导航：重新组织书籍、创作阶段、资料与辅助功能，不沿用两排入口或固定卡片布局。</li><li>开书：只收基础方向，表单分组、推荐和AI介入更简洁。</li><li>设定：四项核心清楚，扩展项按需；AI方案、片选、融合、质检和前置阻断在同页可理解、可恢复。</li><li>分卷：双路线比较围绕具体故事差异，首卷强启动自然融入，不显示内部结构术语。</li><li>事件/章纲：从卷方向到事件链、事件大纲、完整章链和近期细纲逐层可见，上一实际结果清楚。</li><li>正文：全屏写作优先，本章任务、相关事实、审查和结算按需打开。</li><li>资料/辅助：资料库、团队、任务、灵感、取名和设置不与主创作阶段争抢首层导航。</li></ul><p>每页先确定状态和交互原型，再统一视觉。手机检查360/390/430px，桌面检查比较、长内容与键盘操作。</p><h2>P0 核心流程稳定</h2><ul><li>设定整理、整份质检和第一卷规划的失败恢复保持可达。</li><li>活动版本、上游前置和作者确认不因UI重构失真。</li><li>普通作者响应保持白话洁净；管理员审计保留完整证据。</li><li>老旧数据、旧URL和已确认内容继续可读，不批量覆盖作者数据。</li></ul><h2>P1 分层创作质量</h2><ul><li>四项核心设定、按需补设定、内部双路线、首卷500字/黄金三章/重大高潮、事件链、章链、ContextCompiler继续按真实使用反馈优化。</li><li>重点防止候选同质、软参考变硬、计划污染实际、重复情节、人物工具化和上下文噪声。</li><li>真实文学质量按题材样本阅读；工程字段和自动测试不承诺爆款效果。</li></ul><h2>P2 运营与可靠性</h2><ul><li>账号、会员、预算、后台模型管理、任务恢复和备份按真实运营问题迭代。</li><li>Web-only发布与后端发布分开；API/Worker/迁移继续使用静默窗口和回滚。</li><li>邮箱验证、找回密码、协议/隐私、导出/注销等在公开运营前完成。</li></ul><h2>暂停项</h2><ul><li>单书20章验收已按老板要求停止；只有重新明确要求才继续。</li><li>50/100/200章不作为当前开发任务，也不阻塞UI和功能调整。</li><li>历史事故、旧双书和旧测试数字只在Git历史追溯。</li></ul><h2>验证方式</h2><p>按 <code>docs/ACCEPTANCE.md</code> 风险矩阵选择：UI页做相关组件测试、Web类型检查/构建和关键宽度；数据、权限、迁移、恢复或核心工作流才运行完整 <code>npm run verify</code>。当前最近已知全量基线为184个测试文件、779项通过，最新迁移0062。</p></template><template id="document-21" data-title="长篇创作系统评测协议" data-path="docs/EVALUATION_PROTOCOL.md" data-meta="当前正式文档 · 3.6 KB · 88c3af9dae46"><h1>长篇创作系统评测协议</h1><h2>1. 目标</h2><p>评测系统是否在长篇持续创作中同时做到：事实可靠、规划不漂移、人物有生命力、输出不机械、作者可控制、任务可恢复。工程正确性和文学质量分开声明。</p><h2>2. 证据等级</h2><ul><li>E0：规则和指标已定义。</li><li>E1：代码机制存在并有局部测试。</li><li>E2：确定性测试、故障注入、规模回放和恢复证据。</li><li>E3：独立金标、真实模型和盲评。</li><li>E4：真实作者、跨卷长篇纵向效果。</li></ul><p>短流程、固定样例或模拟模型不能声明E3/E4。</p><h2>3. 工程数据集</h2><p>覆盖开书、设定、卷纲、事件链、事件大纲、章纲、正文、三席审查、章节/事件/卷结算和续写。每组包含正常、边界、错误、取消、重复、版本冲突和跨书对抗样例。</p><h2>4. 不可妥协指标</h2><ul><li>跨书污染：0。</li><li>未确认候选进入正史：0。</li><li>正文静默覆盖：0。</li><li>远程结果未知自动重复调用：0。</li><li>模型来源伪造：0。</li><li>迁移失败导致数据丢失：0。</li><li>非对象化消息接口、跨书结果和无来源正式结论：0。</li></ul><h2>5. 检索与上下文</h2><p>测试结构化直达、FTS、向量、关系、时间/因果、别名、否定、旧版本和原文回查。记录召回、精确、来源正确、跨书隔离、硬约束保留、上下文预算和降级行为。</p><p>对每类任务验证上下文矩阵：完整当前对象、压缩上层约束、作者原话、活动版本和明确排除项。</p><h2>6. 创造性非劣效</h2><p>任何会改变检索、上下文、提示、规划、生成或审查的机制，都与当前流程或弱治理基线比较。盲评维度：</p><ul><li>原创性与合理惊喜；</li><li>人物可辨识度和选择可信度；</li><li>情绪力度与节奏；</li><li>因果和上层目标承接；</li><li>文风自然度与重复；</li><li>整体阅读意愿。</li></ul><p>一致性提升不能用显著降低任一核心创作维度交换。</p><h2>7. Agent独立性</h2><p>验证两位编剧独立阶段互不可见、主编后置融合；三席审查模型来源不同、互不读取报告且不同于活动写手；真实状态来自任务和调用。重复模型来源必须被识别并降级。</p><h2>8. 纵向评测</h2><p>至少跨多个事件和一个完整卷观察人物漂移、目标遗忘、伏笔、时间线、文风同质、重复冲突、高潮疲劳和摘要失真。500万字符容量测试只证明工程可运行，不证明文学质量。</p><h2>9. 反迎合</h2><p>构造作者意见与正史冲突、作者自相矛盾、明显会破坏卷目标的灵感和审查意见互相冲突样例。系统应指出代价和来源，不能盲从，也不能擅自替作者决定。</p><h2>10. 报告</h2><p>每次评测保存版本、模型、提示、上下文策略、数据集、随机种子、原始结果、评分者、差异和失败样例。报告只给可重复证据，不把主观偏好包装成绝对标准。</p><p>真实长篇评测必须在证据中保存书籍ID。工具允许用书名定位时，同名书按“活动书优先、最近更新优先”选择；需要检查历史或归档副本时必须直接传书籍ID，禁止把同名空壳或归档副本误报为当前测试书。</p><p>两本专用虚构测试书在生成、审查和逐章确认期间保持独立账号隔离；全部验收完成、停止相关服务并创建可恢复备份后，才迁入首位管理员数据域。迁移范围只包含明确的测试书ID及其全链路数据、文件和可重建投影，不能迁入该测试账号的其他书，也不能改变其他用户的数据归属。迁移后必须复核数据库完整性、外键、文件、索引、上下文隔离、管理员书架可见性和原测试账号不可见性。</p></template><template id="document-22" data-title="文秘写作功能实现、交互、AI检索与上下文说明" data-path="docs/FEATURE_IMPLEMENTATION_GUIDE.md" data-meta="当前正式文档 · 19.6 KB · 18daa5123c60"><h1>文秘写作功能实现、交互、AI检索与上下文说明</h1><p>本文件说明当前版本每个作者功能“怎么用、页面如何反馈、后台如何实现、AI成员何时介入、检索什么以及明确排除什么”。它描述当前生效版本，不包含旧聊天工作流、旧页面名称或已经退出的功能。</p><h2>1. 全局界面与共同规则</h2><p>应用打开后直接进入创作台。左侧是单列竖版书籍封面栏，点击封面只切换当前书；顶部是信息、设定、分卷、规划、章纲、正文、资料库、取名、团队、任务、灵感和设置，点击只切换中心页面。书名不在顶部重复，页面已经能从入口和当前内容理解的介绍不再常驻显示。</p><p>所有作者可见动态文字先经过大白话展示门禁。页面不显示任务ID、数据库键、原始模型ID、JSON、内部阶段名、哈希、Worker或上下文包名称。技术原件继续写入后台审计，错误、取消、重试和恢复入口不能因为隐藏技术细节而消失。</p><p>共同数据规则：</p><ul><li>每次请求都携带当前<code>owner_id</code>和<code>book_id</code>，其他书籍不能进入结果；</li><li>正式对象保存活动版本，修改上游后先做影响判断，下游候选失效或要求重新确认；</li><li>正文每次修改创建新的不可变完整版本，不覆盖旧正文；</li><li>规划表示未来，章节/事件/卷结算表示正文实际发生，二者分开；</li><li>作者确认设定、正式正文和结算是权威源，摘要、图谱、资料卡和向量是可重建投影；</li><li>作者未写明、正文未发生或来源不足的内容显示未知，不由AI补造。</li></ul><h2>2. 十二个顶部功能</h2><h3>2.1 信息</h3><p><strong>作者交互：</strong> 查看和修改书名、频道、分类、题材、初始角色、必须遵守和其他开书资料，并查看当前书籍简介；页面不再展示故事方向、标签和作者意见入口。书名最多15字。书名和书籍简介旁的“主编设计”在第一卷方案确认后，由主编依据第一卷已确认方案、设定基线和开书信息一次产出多套候选，作者选一套直接采用；第一卷未确认时提示先完成第一卷设计。修改时显示会影响哪些后续对象，保存后回到干净的资料阅读态。</p><p><strong>后台实现：</strong> 开书字段保存在逐书定位与开书蓝图的活动版本中。修改创建新版本并更新活动指针，不重写旧版本、正文或来源记录。</p><p><strong>AI与上下文：</strong> 开书本身只接收作者填写的全部开书信息，不使用RAG猜缺失字段。定位分析可整理作者原话，但不能引入其他书、灵感讨论、后续规划或AI猜测。</p><h3>2.2 设定</h3><p><strong>作者交互：</strong> 初始页面只显示模块、真实进度和“召集成员”操作；未启动前不预放方案卡。启动后显示参与成员的自然语言状态，三份独立候选产生后才展示卡片。作者可比较、选取、融合、重写、直接编辑并逐项确认；作者补充输入默认折叠。</p><p><strong>后台实现：</strong> 每个设定模块有候选、决定、活动版本和来源。只有作者确认的内容进入设定基线和“设定来源”，讨论中内容不进入正史。</p><p><strong>AI与上下文：</strong> 主编组织当前模块，独立策划成员各自产生方案，融合角色只读取已经保存的候选。上下文包含完整开书信息、当前设定模块、作者对此模块的原话/附件和必要已确认依赖设定；排除卷纲、事件、正文、其他书、未摘录灵感和旧候选。</p><h3>2.3 分卷</h3><p><strong>作者交互：</strong> 选择当前卷，填写本卷想法，查看2—3个适合本书的节奏建议，也可展开更多、不选、混合、重排或自定义。候选出现后比较差异并确认卷目标、主要冲突、人物变化、高潮、代价和卷末入口。</p><p><strong>后台实现：</strong> 卷纲有活动版本、候选、决定、上游设定版本和影响链。确认卷纲后才能确认该卷事件链。</p><p><strong>AI与上下文：</strong> 主编统筹卷级方案；上下文包含覆盖全部开书字段的核心包、活动设定、长期承诺、作者卷意见和卷级软模板。后续卷另加上一卷真实结算、当前人物/势力/资源状态和开放线索。排除未实现规划冒充历史、其他卷全文和全库堆叠。</p><h3>2.4 规划</h3><p><strong>作者交互：</strong> 先查看当前卷的故事动脉，再点入一个事件设计完整事件大纲。节点卡显示事件标题、为什么现在发生，并区分本卷开场、上一幕已发生和预计承接；节点之间以“因为……所以……”解释因果。选中后默认显示上一幕、眼前麻烦、人物选择和这一幕终点的故事预告，可切换细节视图核对目标、阻力、选择与代价、结果、人物变化、下一事件接口、章节范围和卷任务。阅读感受方向只用大白话呈现，专业模板来源不在普通界面出现；作者可不选、混合、自定义、加入灵感、比较两份独立方案并按段融合。上层变化时显示具体影响和重建入口，而不是只显示模糊警告。</p><p><strong>后台实现：</strong> 事件链、事件、事件大纲分别版本化；卷纲约束事件链，事件链约束当前事件大纲。事件有计划状态和结算状态，已发生结果来自正文结算。</p><p><strong>AI与上下文：</strong> 事件链接收开书核心、活动设定、完整卷约束和作者事件链意见。事件大纲额外接收完整事件链、当前事件卡、上一事件真实结算或卷首状态、当前事件作者原话和按需检索的相关人物、势力、地点、道具、规则、线索与前因。其他事件完整大纲、未来结算和未摘录灵感不进入。</p><h3>2.5 章纲</h3><p><strong>作者交互：</strong> 系统先评估当前事件需要多少章和字数，再生成完整章链。每章显示章节任务、场景、关键行动、信息揭示、情绪变化、开头/结尾钩子和结束状态。作者可逐章修改、重写、调整顺序或确认。对关键转折拿不准时，可点击“请另一位编剧看看”；页面只显示最多3条自然语言替代建议，并明确收益、代价和后续影响，作者可以完全忽略。</p><p><strong>后台实现：</strong> 章纲绑定当前事件大纲版本和章节位置；批量生成仍逐章保存并校验连续性。挑战任务冻结精确章链候选或单章章纲版本，只把结果保存到任务检查点，不写入正式章纲、不自动融合。目标换版后旧建议不再作为当前建议。事件大纲变化后，未确认章纲失效或要求重建。</p><p><strong>AI与上下文：</strong> 指定编剧生成主方案；另一位异模型编剧仅在作者触发时挑战关键节点。主方案上下文包含压缩但覆盖完整的开书、设定、卷纲和事件链，完整当前事件大纲、上一真实结算和作者章链/单章意见。挑战者再读取精确主方案版本，但不读取其他候选、聊天或审查报告。系统不只给一个摘要，也不加载其他事件全文。</p><h3>2.6 正文</h3><p><strong>作者交互：</strong> 一次聚焦一章。主笔生成初稿后进入事实、文学和体验三份独立审查；页面显示正文和可定位的自然语言建议。作者可直接编辑、定点重写、保留满意部分或定稿。定稿前不会结算，下一章不能绕过活动章纲直接生成。</p><p><strong>后台实现：</strong> 正文是不可变完整版本；活动写手只有一个结果进入审查。三席绑定同一正文和章纲但互不读取报告。作者定稿后执行章节结算，更新正式事实、人物状态、来源、检索投影和当前进度。</p><p><strong>AI与上下文：</strong> 主笔接收开书核心、活动设定、卷约束、事件链、完整事件大纲、完整本章章纲、必要前章、当前正史、作者意见和明确自由区。事实席检索规则、时间、能力、知情、人物状态、道具和来源；文学席检索人物声音、情绪与必要近期原文；体验席读取卖点、目标读者、事件位置和期待兑现。三席报告隔离。</p><h3>2.7 资料库</h3><p><strong>作者交互：</strong> 在13个页签查看设定来源、主角实时状态、配角档案、势力档案、地点、世界路线图、道具资源、事件时间线、生效规则、标签、待补内容和内容来源。右上角“关系与轨迹”切换到关系图。资料详情可展开，来源可回查。</p><p><strong>后台实现：</strong> 实体、正式事实、关系、人物状态史、结算事件和来源存在SQLite权威表；资料档案与世界路线是可重建查询视图。资料库不写剧情，不把规划直接升级为正史。</p><p><strong>AI与上下文：</strong> 事实席在章节结算时只提取正文明确、会影响后续的持久事实。类型字段是可选语义，不要求每章或每本凑齐。资料库本身用于结构化直达和检索导航；ContextCompiler只为当前任务选择必要字段，不把整个资料库塞入每次模型调用。</p><p>资料库各页签详见第3节。</p><h3>2.8 取名</h3><p><strong>作者交互：</strong> 选择人物、势力、地点、物品等目标，填写语义、风格、禁用字和数量，生成候选后挑选或复制。候选不会自动创建正式人物或改写正文。</p><p><strong>后台实现：</strong> 保存命名请求、候选、来源和采用状态；采用后仍要绑定到明确业务对象或由作者写入正式内容。</p><p><strong>AI与上下文：</strong> 只读取当前书题材、语言风格、目标对象、相关已确认设定和作者禁用条件。排除其他书名字、未确认候选和无关全文，避免串名。</p><h3>2.9 团队</h3><p><strong>作者交互：</strong> 显示14名创作成员的真实状态卡：等待什么、正在处理什么、使用的上下文摘要和已完成输出摘要。点击卡片查看经过整理的信息，不显示思维链。</p><p><strong>后台实现：</strong> 状态来自任务、心跳、模型调用和工具事件，不使用定时动画伪造。岗位、成员实例和模型绑定分离；普通作者只看成员与业务状态，完整模型来源只在管理员审计。</p><p><strong>AI与上下文：</strong> 团队页不额外触发创作。每次成员调用使用与具体业务任务绑定的冻结ContextPack；上下文详情只显示可公开摘要，原始包留在审计层。</p><h3>2.10 任务</h3><p><strong>作者交互：</strong> 按书查看等待、运行、完成、失败、暂停和需要处理的任务。可取消、继续、重试或查看影响；状态使用“正在整理设定”“正在写第3章”等大白话。</p><p><strong>后台实现：</strong> 任务使用幂等键、租约、检查点、取消栅栏和晚到结果隔离。失败恢复不重复提交已完成正式对象；结果未知需要调和后才能重试。</p><p><strong>AI与上下文：</strong> 任务页不改变成员上下文。重试沿用冻结输入或明确创建新任务版本；如果上游版本已经变化，旧结果拒绝落库。</p><h3>2.11 灵感</h3><p><strong>作者交互：</strong> 作者与独立灵感分身讨论人物、情节或选择。讨论只给启发，不生成或修改设定、卷纲、事件、章纲、正文和正史。作者必须主动“摘录并绑定”到具体业务对象，内容才成为该对象的作者输入。</p><p><strong>后台实现：</strong> 灵感消息与正式对象、任务和正史分库存储；未摘录讨论不会进入正式检索，也不形成持续聊天记忆。</p><p><strong>AI与上下文：</strong> 灵感成员可读取当前书作者允许的资料帮助讨论，但输出是建议。正式创作成员排除未摘录聊天；摘录后只读取绑定目标、原文和作者强度。</p><h3>2.12 设置</h3><p><strong>作者交互：</strong> 管理主题、字体和普通运行偏好；不显示模型供应商、内部绑定或密钥。模型方案、算力消耗和连接管理位于管理员后台。</p><p><strong>后台实现：</strong> 模型绑定有版本和生效时间，只影响未来任务和新快照；已完成调用保留真实审计。密钥只来自环境变量，不在任何页面回显。</p><p><strong>AI与上下文：</strong> 设置页不触发内容生成，也不修改已有上下文包。未来任务按管理员当前有效绑定选择模型；没有可用真实创作模型时诚实阻断，不用确定性夹具冒充创作。</p><h2>3. 资料库十三个页签</h2><div class="table-scroll"><table><thead><tr><th>页签</th><th>作者看到什么</th><th>数据来源与实现</th><th>空缺处理</th></tr></thead><tbody><tr><td>总览</td><td>当前书的实体、事实、关系、事件、标签、待补数量和开书摘要</td><td>按当前书聚合权威表和开书活动版本</td><td>只显示真实计数</td></tr><tr><td>设定来源</td><td>作者逐项确认的设定原文、板块和确认来源</td><td>活动设定基线</td><td>未确认候选不显示</td></tr><tr><td>主角</td><td>当前境界/等级、属性、技能、装备、资源、伤势、身份及完整变化史</td><td>主角状态追加账本；获得、更新、消耗、失去均保留章节/时间</td><td>不可归类项进入待确认，不猜分类</td></tr><tr><td>配角</td><td>折叠态只显示姓名和首次出场；展开身份、年龄、性格、门派、境界、实力、属性、装备、关系和出场记录</td><td><code>character</code>实体中排除主角，按正式事实语义聚合</td><td>每个未写明字段显示“尚未写明”</td></tr><tr><td>势力</td><td>负责人、人数规模、整体实力、等级、驻地、地位和成员</td><td><code>organization</code>实体及本书事实；可从明确人物所属关系反向得到成员</td><td>不用世界观说明填空</td></tr><tr><td>地点</td><td>地点类型、所属区域、方位、特点和出场记录</td><td><code>location</code>实体和正式事实</td><td>没有方位就保持未知</td></tr><tr><td>地图</td><td>从出生地或首个正式场景出发，按章节连接实际到达的大地点</td><td>地点首次正式出现、明确出生地和作者初始地图说明；仅大范围节点进入路线</td><td>不生成坐标；无方向证据不显示东南西北</td></tr><tr><td>道具资源</td><td>类型、等级品质、属性、效果、数量、当前归属、状态和获得/转移/消耗/失去记录</td><td><code>item/resource/skill/stat_panel</code>实体、事实和明确持有关系</td><td>不从名字猜属性和主人</td></tr><tr><td>事件时间线</td><td>每行只显示故事时间或章节范围＋事件名</td><td>已结算事件、章节覆盖和事件结算；详细摘要留后台</td><td>无年月日时直接显示章节范围</td></tr><tr><td>生效规则</td><td>真正约束后文的确认规则和规则事实</td><td>明确规则设定及<code>world_rule</code>实体</td><td>策划理念不重复显示</td></tr><tr><td>标签</td><td>标签名称、说明、适用对象和使用数量</td><td>标签定义与分配关系</td><td>新标签不自动改正文</td></tr><tr><td>待补内容</td><td>已发现且需要以后补充或确认的信息缺口</td><td>资料缺口记录，带目标、严重性和状态</td><td>不以AI猜测自动关闭</td></tr><tr><td>内容来源</td><td>按对象列出事实、来源章节和正文短依据</td><td>正式事实与不可变稿件来源</td><td>技术ID和内部证据级别不直接展示</td></tr></tbody></table></div><p>关系与轨迹视图从正式关系投影读取人物、势力和其他对象之间的有向关系。没有可靠关系时显示空状态，不能用共现代替关系。</p><h2>4. AI成员介入与任务包</h2><p>当前产品配置为14名创作成员。普通作者可在团队页查看姓名、岗位与真实业务状态，模型绑定只在管理员后台查看；业务职责按节点划分：主编统筹全局与融合，策划/编剧提供独立方案，数据准备角色编译上下文，活动主笔写正文，事实/文学/体验三席独立审查，维护角色负责结算与长期连续性。小文秘书是本地工具，不是第12名创作成员，不给剧情结论。</p><p>每次模型调用都保存：目标对象、冻结上游版本、作者原话、纳入与排除来源、预算、调用快照和结果。系统不保存或展示思维链。</p><p>上下文按任务动态编译：</p><ol><li>直接放入当前活动上游对象和作者原话，不与相似度结果竞争；</li><li>生成结构化查询计划，确定人物、势力、地点、道具、规则、时间、因果和原文需求；</li><li>按需组合结构化直达、全文、向量、关系、时间/因果和正式原文回查；</li><li>过滤其他书、失效版本、无来源候选、未摘录灵感和错误时间；</li><li>按权威、任务相关、时间与因果必要性重排，预算内裁剪；</li><li>保存来源指纹，提交结果前再次核对上游版本和正史水位。</li></ol><p>不存在一份固定“岗位永远读取这些内容”的永久包。相同成员在设定、事件、正文或审查任务中读取的资料随当前对象变化。类型化资料档案帮助精准定位，但不会自动全部进入上下文。</p><h2>5. 版本、失效、结算与恢复</h2><ul><li>设定变化：提示受影响的卷、事件、章纲和未定稿正文候选；作者查看影响后重建或保留；</li><li>卷纲变化：当前卷事件链和下游候选需要重新校验；</li><li>事件链变化：受影响的事件大纲和章纲失效；</li><li>事件大纲变化：当前事件章纲和未定稿正文候选失效；</li><li>章纲变化：对应未定稿正文候选失效，已定稿正文不自动改写；</li><li>章节结算：只读取作者确认正文，写入实际事实、状态、来源和检索投影；</li><li>事件结算：汇总该事件已结算章节的实际结果、代价、人物状态和下一触发；</li><li>卷结算：汇总本卷全部事件实际结果、开放线索和下一卷真实入口。</li></ul><p>任务失败时从检查点恢复；模型超时、格式错误或取消都有明确状态。晚到结果、过期上游结果和跨书结果拒绝落库。普通删除是归档；正文、已合并迁移和作者原件不随代码清理删除。</p><h2>6. 验收时作者应看到的结果</h2><ul><li>每个入口可点击，切换页面不乱跳、不白屏；</li><li>页面没有重复标题、重复说明、机器键、英文协议或乱码；</li><li>配角、势力、地点、地图和道具各自显示正确语义，不再共享一套通用卡；</li><li>未知字段诚实显示“尚未写明”，不会看起来像已经设定；</li><li>时间线每行只有时间/章节和事件名，详细证据仍可从来源回查；</li><li>地图路线来自实际章节，不制造方向和坐标；</li><li>其他书籍内容不会出现在当前书；</li><li>上游变化会说明具体影响并提供恢复入口；</li><li>AI成员状态来自真实任务，候选、融合、正文和三席审查可追溯；</li><li>文档、代码、测试和桌面文档中心在每次开发结算后同步到同一当前版本。</li></ul><h2>14. 统一账号与管理员后台</h2><p><strong>前端交互：</strong> 未登录时只显示登录/注册页。注册填写昵称、邮箱、至少10位密码和确认密码；登录只填邮箱密码。登录后左栏底部显示当前昵称和身份，并提供退出；管理员额外显示“管理”入口。管理页显示用户总数、启用/暂停数、已注册账号名下的“用户书籍”总数、搜索和状态筛选；每个用户显示昵称、邮箱、角色、状态和注册/最近登录时间，可暂停或恢复。</p><p><strong>后端逻辑：</strong> 注册以事务创建账号归属。首个账号原子授予admin；如果账号体系启用前已有未认领的本机老板所有者和书籍，则直接复用该owner，使原书籍、正文、资料库、任务和上下文完整归入管理员账号，不复制任何创作表。第二个及以后账号创建全新owner。密码用scrypt，登录令牌只以摘要落库。请求策略先验证Host/Origin/跨站写入，再从Cookie解析账号；领域路由统一使用会话owner。管理员状态变更写审计，暂停同时撤销全部会话。</p><p><strong>上下文与检索：</strong> 账号、邮箱、密码、会话和管理员审计不属于创作资料，ContextCompiler始终排除。登录owner只作为硬隔离范围，不能成为故事内容或AI提示。AI成员只能检索当前owner下当前书的已允许来源。</p><p><strong>当前边界：</strong> 邮箱密码和管理员核心已实现；桌面启动不会自动签发会话，未登录访问受保护接口返回401，真实流程验收脚本必须通过 <code>WENMI_E2E_EMAIL</code> 与 <code>WENMI_E2E_PASSWORD</code> 登录。公开运营前仍需邮箱验证/找回、持久限流、HTTPS、协议隐私、账号导出/注销和生产备份。手机号、微信以后绑定到现有用户。</p></template><template id="document-23" data-title="当前卷—事件工作流的混合RAG设计" data-path="docs/HYBRID_RAG_DESIGN.md" data-meta="当前正式文档 · 12.5 KB · 973438752576"><h1>当前卷—事件工作流的混合RAG设计</h1><h2>1. 目标与边界</h2><p>混合RAG只为当前书、当前任务补充必要证据。它不能替代开书信息、活动设定、活动卷纲、活动事件、完整章纲、定稿正文或作者原话，也不能把摘要、向量结果、Wiki或AI候选升级为正史。</p><p>系统不建立聊天、会话摘要或对话记忆检索源。作者输入必须属于明确的开书、设定、卷、事件、章纲、正文、审查或结算对象。每次查询必须携带 <code>owner_id</code>、<code>book_id</code>、任务类型、目标对象和冻结版本；其他书籍永远排除。</p><h2>2. 数据权威顺序</h2><ol><li>作者确认的开书信息、设定、资料条目和显式约束；</li><li>作者定稿的不可变正文版本及其正史结算；</li><li>当前任务直接引用的活动卷纲、事件链、事件大纲和章纲；</li><li>章节、事件和卷结算；</li><li>带来源的作者原话、附件和导入原件；</li><li>从上述来源重建的结构化事实、全文索引、关系、时间线、Wiki、摘要和向量；</li><li>AI候选、审查建议、失败任务和测试结果。</li></ol><p>规划描述未来，正史描述实际发生。两者必须分开存储、分开检索和分开显示。派生层发生冲突时回查上级正式源，不以相似度或摘要覆盖正式源。</p><h2>3. 本地目标架构</h2><ul><li>SQLite：书籍、版本、活动指针、作者输入、资料、正史、结算、任务、调用、来源和关系的权威库；</li><li>SQLite FTS5：专有名词、原句、规则、场景关键词和否定表达的全文检索；</li><li>LanceDB OSS TypeScript本地嵌入：可重建的语义向量投影；</li><li>SQLite关系与时间投影：人物、势力、地点、物品、规则、线索、知情、状态和因果邻域；</li><li>不可变文件：导入原文、正式正文和附件原件；SQLite保存路径、哈希、范围和版本；</li><li>派生Wiki与摘要：只做导航和展示，必须携带来源、水位和重建版本；</li><li>ContextCompiler：把活动上游版本、作者原话和按需检索证据编译成不可变ContextPack。</li></ul><p>所有投影都能从SQLite权威记录和不可变原件重建。投影缺失、损坏或水位落后时，不得把它当成事实源。</p><h2>4. 索引对象</h2><div class="table-scroll"><table><thead><tr><th>当前对象</th><th>主要索引单位</th><th>必须携带的版本信息</th><th>用途</th></tr></thead><tbody><tr><td>开书信息</td><td>字段、作者原话、附件引用</td><td>开书活动版本</td><td>定位、题材、角色、核心机制和必须项</td></tr><tr><td>设定</td><td>设定模块、实体卡、规则条目</td><td>设定活动版本</td><td>世界、人物、势力、地点、物品和规则</td></tr><tr><td>分卷</td><td>卷目标、主要因果、人物变化、高潮、卷末接口</td><td>卷纲活动版本及上游设定版本</td><td>约束当前卷</td></tr><tr><td>事件链</td><td>事件卡、前后触发、卷任务映射</td><td>事件链版本及卷纲版本</td><td>定位当前事件职责</td></tr><tr><td>事件大纲</td><td>入口、行动链、转折、结果、代价、下一触发</td><td>当前事件活动版本</td><td>约束事件内剧情</td></tr><tr><td>章纲</td><td>章职责、场景、信息、情绪、结尾状态</td><td>当前章纲版本及事件版本</td><td>正文直接执行依据</td></tr><tr><td>正式正文</td><td>章、场景、段落、人物声音证据</td><td>不可变正文版本、正史水位</td><td>原文回查与连续性</td></tr><tr><td>三级结算</td><td>实际结果、状态变化、开放线索、来源</td><td>章/事件/卷结算版本</td><td>后续任务的真实起点</td></tr><tr><td>资料库</td><td>设定来源、主角状态史、配角档案、势力档案、地点档案、世界路线、道具资源档案、生效规则、正文事件时间线与来源</td><td>正式事实/状态版本、正史有效区间与结算范围</td><td>按语义类型精确查询；类型字段可选且缺失不补造，地点与地图分开，时间线无日期时用章节范围；设定来源不混入正式实体，规划事件不冒充实际事件</td></tr></tbody></table></div><p>原始内容不因重切片而改变。新切片策略创建新快照并原子切换；旧快照只用于回滚宽限，不参与当前检索。</p><h2>5. 任务型上下文路由</h2><h3>5.1 开书与设定</h3><p>开书任务直接接收作者填写的全部信息，不做RAG补造。设定候选接收完整开书活动版本、当前设定模块、作者本模块原话与附件，以及已确认的直接依赖设定。排除其他书、非对象化历史输入、卷纲、事件、正文和未确认AI猜测。</p><h3>5.2 分卷</h3><p>接收完整覆盖开书字段的 <code>BookCorePack</code>、<code>SettingConstraintPack</code>、长期承诺、作者选择的卷级软模板和本卷原话；后续卷再加入上一卷真实结算与当前状态。检索只补充与本卷目标相关的开放线索、人物/势力状态、规则和必要原文。</p><h3>5.3 事件链与事件大纲</h3><p>事件链接收开书核心、活动设定、完整 <code>VolumeConstraintPack</code>、作者事件链想法和事件级软模板。事件大纲额外接收完整 <code>EventChainPack</code>、当前事件卡、上一事件真实结算或卷首状态，以及作者对当前事件的全部原话。检索围绕当前事件实体、地点、规则、道具、线索和前因展开，不加载其他事件完整大纲。</p><h3>5.4 当前事件章纲</h3><p>接收压缩但完整覆盖的开书、设定、卷纲和事件链，完整 <code>CurrentEventPack</code>，上一真实结算与作者章链/单章意见。系统先评估事件总字数和章数，再生成完整章节序列；当前章完整章纲不以摘要替代。</p><h3>5.5 单章正文</h3><p>接收 <code>BookCorePack</code>、<code>SettingConstraintPack</code>、<code>VolumeConstraintPack</code>、<code>EventChainPack</code>、<code>CurrentEventPack</code>、完整 <code>CurrentChapterOutlineFull</code>、必要前章、当前正史、作者修改意见和明确自由区。RAG只补充本章真实需要的实体、规则、时间、因果、人物声音和必要原文，不注入全书正文、其他事件完整大纲或整套模板。</p><h3>5.6 三类审查</h3><p>事实、文学和体验审查绑定同一不可变正文和同一完整章纲，但附加证据分开编译，三份报告互不读取：</p><ul><li>事实审查：设定、正史、时间线、状态、能力、知情、道具、地点和线索来源；</li><li>文学审查：题材与表达偏好、人物声音、关系、情绪进度和必要近期原文；</li><li>体验审查：卖点、目标读者、事件位置、阅读进度、必要前章和期待兑现。</li></ul><h3>5.7 结算与下一卷</h3><p>章节、事件和卷结算只从作者确认正文、下级结算和既有正史提取实际结果，规划只用于计划—实际对照。下一卷以完整开书核心、活动设定、长期承诺、上一卷完整真实结算、当前状态和开放线索为起点，不能把未实现计划当成已发生事实。</p><h3>5.8 类型化资料直达</h3><p>配角、势力、地点和道具/资源档案是从权威实体、正式事实、状态和来源重建的结构化查询视图。检索器可按年龄、性格、所属、规模、实力、驻地、地点层级、道具属性、归属和流转等实际存在的字段直达，再回查原文；空字段不形成查询事实。世界路线只辅助地点先后和移动查询，不能把图上相邻自动解释为地理相邻。类型档案不构成永久岗位包，ContextCompiler仍按当前任务选择最小充分资料。</p><h2>6. 检索执行顺序</h2><ol><li>校验 <code>owner_id/book_id</code>、目标对象、任务权限和冻结活动版本；</li><li>把直接活动版本和作者原话放入ContextPack，不经过相似度竞争；</li><li>从任务类型生成结构化查询计划，列明实体、时间、因果、来源和所需证据种类；</li><li>按需并行执行精确查询、FTS、向量、关系、时间/因果和原文回查；</li><li>过滤跨书、失效版本、错误故事时间、无来源和权限不匹配结果；</li><li>标注事实、人物认知、秘密、谎言、推断、规划和软参考，禁止混层；</li><li>按来源权威、任务关系、时间与因果必要性重排并去重：完全相同的内容只保留一份；同一对象、同一版本的完整权威源已经纳入时排除其摘要、尾段和检索切片，只有切片包含未覆盖的独立证据或完整源未纳入时才保留；随后只扩展必要父块/邻块；</li><li>记录纳入、排除、裁剪和冲突理由；</li><li>在预算内编译不可变ContextPack并保存来源指纹；</li><li>提交前再次核对活动版本与正史水位，过期任务结果拒绝落库。</li></ol><p>不设置一个全局相似度阈值决定所有通道。向量只负责语义候选，不能静默决定实体身份、事实真伪或活动版本。</p><h2>7. 检索不足与冲突</h2><ul><li>找不到依据：输出“未知/需确认”，不补造；</li><li>同名或别名歧义：列出候选和来源，正式任务在消歧后继续；</li><li>规划与正文冲突：正文结算代表实际发生，后续规划是否修订由作者决定；</li><li>正式源之间冲突：提交事实审查，展示双方来源和有效时间；</li><li>结果过多：先按任务关系、权威、时间和因果裁剪，不删除直接上游约束；</li><li>结果过少：扩大别名、关系、时间和原文邻域，不先降低全局门槛；</li><li>向量不可用：明确降级为结构化＋FTS＋关系＋原文回查；依赖语义且无法替代的任务暂停并说明原因。</li></ul><h2>8. 创造性保护</h2><p>ContextPack把硬底线、任务约束和软参考分栏。模板、声音片段、相似场景和节奏建议必须标为可不用；主笔保留对白、动作、意象、局部调度、场景细节和自然因果实现的自由空间。</p><p>正文检索目标是“最小充分”，不是“最大召回”。先形成场景方案，再针对具体缺口回查，避免大量旧正文导致模仿、重复和人物机械化。检索方案改变时必须用相同模型与相近预算做多样本盲评，事实更准不能抵消原创性、合理惊喜、人物可辨识度、情绪力度和整体阅读质量下降。</p><h2>9. 投影、水位与恢复</h2><p>切片、FTS、关系、Wiki和向量通过版本化快照构建。非活动快照完成来源覆盖、跨书隔离、时间过滤、冻结查询和无答案探针后，才能按书原子切换。构建失败继续使用上一有效快照；若上一快照与当前权威水位不一致，则降级或阻断相关任务。</p><p>Worker只写投影、候选和任务结果，不直接修改正式正文或核心正史。所有写入使用幂等键、租约栅栏、检查点和晚到结果隔离。投影目录损坏时从权威源重建，不恢复成事实源。</p><h2>10. 可观测与验收</h2><p>每次检索保存：任务、查询计划、通道、命中、过滤原因、来源、版本、水位、裁剪、预算、耗时、降级和ContextPack指纹，但不保存模型思维链或密钥。</p><p>必须通过：</p><ul><li>其他书籍零命中，错活动版本和过期候选被拒绝；</li><li><code>BookCorePack</code>覆盖作者已填开书字段100%，空字段不会被AI补造；</li><li>卷、事件链、事件大纲、章纲和正文能回查完整上游版本；</li><li>三类审查绑定同一正文但附加证据与报告相互隔离；</li><li>摘要误导、否定、别名、时间冲突、因果、多跳关系和无答案查询；</li><li>规划未实现内容不会进入三级结算；</li><li>下一卷读取上一卷真实结算；</li><li>投影中断、重复执行、错水位、向量缺失、重建和回滚；</li><li>检索增益与创造性非劣效对照。</li></ul><h2>15. 分层资料包与注意力门禁</h2><p>检索不能决定四项核心设定是否进入：故事舞台、主角底板、规则与代价、边界与留白始终全文直达。其余设定先按当前卷、事件、章纲或正文任务计算相关性，最多选取直接相关项全文，其余只列名称和可回查键，不把全文堆进提示词。</p><p>每个候选来源都携带约束强度、真值状态、业务范围和依赖版本。检索命中只能补充证据，不能把软参考、规划或摘要升级为硬事实；所谓硬命中如果不是当前任务的直接权威源，仍放入可选证据区。</p><p>正文连续性优先读取最近1—3章不可变正文、章节结算、当前事件线程账本和未回收伏笔。更早原文通过结构化事实、线程状态、全文或向量检索按需回查，不做全书全文堆叠。</p><p>硬事实和当前任务超过预算时任务失败并报告缺口，不允许头部加尾部截断。调用方计算预算后由ContextCompiler自动加入的相关硬设定，可使用岗位显式配置的有界专用余量；有效预算只扩到实际硬来源大小，未使用余量不能被软资料占用，超过余量仍失败。软资料先同源去重、去低相关项和缩短导航；被排除内容、原因和原始来源仍进入审计。</p><p>验收增加：四核心全文覆盖、相关可选设定召回、低相关目录延后、计划/实际不混层、最近章连续、线程承接、无硬来源字符裁剪和跨书零命中。</p></template><template id="document-24" data-title="分层创作系统：当前方案与验收" data-path="docs/LAYERED_CREATION_IMPLEMENTATION_AND_ACCEPTANCE.md" data-meta="当前正式文档 · 9.9 KB · 4f18e2297950"><h1>分层创作系统：当前方案与验收</h1><blockquote>本文是分层创作的当前功能合同和状态表，不再承担每次开发的148项全量门禁。旧总表完整保留在 Git 基线 <code>e8517d9</code> 的同名文件中。</blockquote><h2>1. 目标</h2><p>让小白作者不需要一次填完整本书，而是在需要时完成当前层：开书定方向，设定定非剧情骨架，卷定大故事，事件定因果小故事，章纲定近期表达，正文执行，结算把真实结果带回下一层。</p><p>硬参考只约束不能违反的事实和当前任务；软参考允许AI调整；开放区明确留给创作发挥。任何层都不能把未确认计划冒充已发生事实。</p><h2>2. 对象与职责</h2><div class="table-scroll"><table><thead><tr><th>层级</th><th>负责</th><th>不负责</th></tr></thead><tbody><tr><td>开书信息</td><td>题材、目标读者、基调、基础承诺、作者已有想法</td><td>世界百科、整书剧情</td></tr><tr><td>非剧情设定</td><td>世界舞台、主角底板、规则与代价、边界与留白；扩展设定按需补</td><td>卷剧情、事件顺序、章场景</td></tr><tr><td>全书故事总线</td><td>长期核心矛盾、主角长期欲望、最终方向和可开放线程</td><td>固定每卷细节</td></tr><tr><td>卷方向</td><td>本卷开场局面、推动、升级、关键选择、高潮、代价、卷末新局面、重点表达</td><td>逐事件排期和逐章场景</td></tr><tr><td>事件链</td><td>卷内事件顺序、因果、承诺/铺垫/兑现责任</td><td>事件内部全部场景</td></tr><tr><td>事件大纲</td><td>当前小故事的目标、对立、转折、高潮、后果和下一事件接口</td><td>逐章正文表达</td></tr><tr><td>完整章链</td><td>当前事件全部章节的责任与顺序</td><td>远期章节细节冻结</td></tr><tr><td>近期详细章纲</td><td>最近1—3章的场景、人物行动、情绪、信息、回报与章末接口</td><td>代写完整正文</td></tr><tr><td>正文与结算</td><td>正文自由表达；结算记录实际变化、事实、线程和后续影响</td><td>用计划替代实际</td></tr></tbody></table></div><p>作者原话绑定具体对象，区分必须遵守、强烈偏好、灵感参考和需要先问。AI未采用作者原话时要说明原因；作者可以修改、留空、重做或回到上层。</p><h2>3. 设定体验</h2><p>默认只显示四项核心设定：</p><ol><li>世界舞台；</li><li>主角底板；</li><li>规则与代价；</li><li>边界与留白。</li></ol><p>系统可按题材推荐扩展设定，但不能让作者多选一大串后才允许写作。写到需要时再补设定：立即补、带着明确空白继续、或把它作为本层开放问题。扩展项没有确认时不注入下游硬上下文。</p><p>每项可由多名编剧独立提出方案，作者可整选、摘片、补自己的话、融合、编辑和重新设计；选择必须刷新不漂移，确认后收起旧候选，只保留定稿和重做入口。整份设定质检只处理会阻断下游的真实矛盾，不替作者自动确认。</p><h2>4. 内部结构方法与卷路线</h2><p>三幕式、五幕式、英雄之旅、故事圈、七点式、八序列、黄金三章、爽点/悬念/单元剧/多线等保存在后台版本化方法库。每项记录适用问题、长度/题材、可移动节点、套路风险、版本和指纹。</p><p>作者不看方法名、幕、节拍或内部键。卷设计读取开书、活动设定、故事总线、上一卷真实结算和作者本卷想法，判断当前卷最需要解决的任务，再选择两条不同的内部路线交给独立编剧。每名编剧只收到自己的精简软参考。</p><p>普通页面展示至少两条代入本书的具体路线，包括：开场局面、推动事件、主角行动、阻力升级、关键选择、关系变化、高潮、代价、解决结果、卷末状态、好看点和风险。两条路线至少在主动/被动、对立力量、因果路径、关键选择、关系变化、代价、高潮触发、卷末状态或读者体验中的多个维度有真实区别，不能只换措辞。</p><p>作者可整份选择、跨方案摘片、让主编融合、自己编辑或全部重做。事件链只接收确认后的故事责任，不接收内部方法名。后续卷根据上一卷实际重新选择结构，不继承固定模板。</p><h2>5. 首卷强启动</h2><p>首卷强启动属于第一卷设计，不属于设定。效果必须达到，写法由AI针对题材设计。</p><ul><li>主要追读动力：爽感、冲突、情绪、秘密、新奇、人物、关系或混合。</li><li>前500有效正文字符：明确读者为什么继续看，包括即时处境、情绪抓力、读者问题和马上会发生的变化。</li><li>黄金三章：第一章进入处境并启动；第二章主动行动、阻力升级并展示独特看点；第三章给第一次明确回报，同时打开更大期待。</li><li>持续追读：处境、关系、身份、信息、能力/资源、目标、冲突和阶段回报持续发生有效变化。</li><li>重大高潮：不晚于累计约10万有效正文字符；短卷在卷末完成。必须兑现重要承诺，包含重大选择、代价、主要冲突变化、不可逆新局面和下一阶段入口。</li><li>防疲劳：冲突类型、爽感/压迫、情绪/回报和快慢节奏要换味，不能连续复制同一种打脸、误会、追杀或反转。</li></ul><p>事件链必须标明谁承载开篇、黄金三章、早期回报、升级、高潮铺垫、高潮和后果。第一事件先形成三章整体启动包，只冻结第一章；每章结算后保留总体承诺并校准后续细节。系统按定稿正文累计有效字符，提前预警高潮可能逾期，不等到最后一刻突然切高潮。</p><h2>6. 事件、章纲与衔接</h2><p>事件链遵循：承诺提出 → 人物行动 → 阻力升级 → 阶段回报 → 新局面 → 再升级 → 高潮兑现 → 后果。数量由卷任务决定，不用固定十事件。</p><p>当前事件大纲要说明它从上一实际结果如何开始、人物要什么、谁/什么阻止、关键选择、转折与代价、如何结束、留下什么事实和下一事件问题。事件阅读感受是可留空的单选软参考，不允许一次多选整套节拍。</p><p>完整章链保证当前事件有完整顺序；详细章纲只滚动细化最近1—3章。第一章额外包含前500字兴趣锚点、主角即时处境、第一处有效变化、独特看点首次露出、小回报和章末期待。第一章明显全是说明或无抓力时定点重写，不直接继续第二章。</p><h2>7. ContextCompiler与资料包</h2><p>每次调用只编译当前任务需要的包：</p><ul><li>身份与对象：owner、book、当前层和活动版本；</li><li>硬事实：确认开书、相关设定、正式正文/结算和明确禁止项；</li><li>当前任务：上层确认责任、目标、输出合同和停止条件；</li><li>连续性：最近正文、上一实际结果、活动线程、相关人物/关系/资源/时间因果；</li><li>软参考：作者偏好、卷重点表达、内部结构软工具；</li><li>开放区：AI可以自由决定的场景、对白、意象、节奏和合理惊喜；</li><li>来源与预算：每项来源、版本、选择理由、排除理由和预算。</li></ul><p>明确排除其他书、未摘录灵感、未确认候选、过期版本、整库全文堆叠、AI猜测和无关审查报告。硬事实/当前任务若放不下应诚实阻断或回查正式源，不能静默截断。摘要只导航，争议回查原文。</p><h2>8. 前端交互</h2><p>整体信息架构和视觉允许继续重设计。必须保持：当前书清楚、当前层清楚、任务状态清楚、下一步清楚、旧内容可找回。</p><p>页面按状态而不是按数据库表堆内容：</p><ol><li>说明当前要完成什么；</li><li>作者可选补充（默认收起或简短）；</li><li>AI开始工作的明确按钮；</li><li>工作中进度与参与者；</li><li>方案差异和作者选择；</li><li>确认后的简洁结果与继续下一层；</li><li>失败原因和就地恢复。</li></ol><p>手机优先，360/390/430px无横向溢出，主操作可单手触达，触控目标约44px，输入法弹起后仍能编辑和提交。不要用重复大卡、长说明、专业术语和过多同时可见按钮制造负担。</p><h2>9. 作者API与运行边界</h2><p>普通作者响应只返回业务对象、白话状态、结果和恢复动作；不返回供应商/模型内部ID、任务/讨论/ContextPack/方法键、路径、堆栈、SQL、JSON合同或原始枚举。管理员审计走独立路由。</p><p>任务需要幂等、检查点、失败恢复和预算结算；重复恢复不重复扣量。Worker不直接改核心业务表或正式正文。作者确认后才进入正式版本，下游任务绑定当时的精确活动版本。</p><h2>10. 当前状态与剩余验收</h2><div class="table-scroll"><table><thead><tr><th>能力</th><th>当前状态</th><th>仍需做什么</th></tr></thead><tbody><tr><td>四项核心设定与按需补设定</td><td>E2工程已实现</td><td>随新UI继续减负和真机走查</td></tr><tr><td>内部方法库、双路线、选择/融合</td><td>E2工程已实现</td><td>多题材真实模型差异盲读</td></tr><tr><td>首卷500字/黄金三章/重大高潮追踪</td><td>E2工程已实现</td><td>真实正文连读和高潮效果验证</td></tr><tr><td>事件链、事件大纲、完整章链、近期细纲</td><td>E2工程已实现</td><td>持续优化交互与长期衔接</td></tr><tr><td>ContextCompiler分层与洁净投影</td><td>E2工程已实现</td><td>真实长篇检索/注意力评估</td></tr><tr><td>手机静态组件门禁</td><td>E2工程已实现</td><td>生产真机与输入法实际走查</td></tr><tr><td>单书20章真实链路</td><td>曾启动但已按老板要求停止</td><td>以后只在老板明确要求时继续</td></tr></tbody></table></div><p>E2表示工程可达，不代表文学质量或爆款结果。普通UI或功能开发不需要重跑20/50/100/200章；只有专项长篇验收才逐阶段执行。</p><h2>11. 精简验收清单</h2><ul><li>[ ] 各层职责清楚，计划/实际和硬/软/开放不混淆。</li><li>[ ] 作者无需一次填完，能留空、编辑、重做和恢复。</li><li>[ ] 设定只含非剧情骨架，扩展项不无故阻塞。</li><li>[ ] 双路线具体、有实质差异，普通页面无内部方法名。</li><li>[ ] 首卷职责贯穿卷、事件、前三章、第一章和实际字数追踪。</li><li>[ ] 事件与章节读取上一实际结果，承诺/铺垫/兑现能追踪。</li><li>[ ] ContextPack无跨书、未确认候选、过期版本和技术泄漏。</li><li>[ ] 手机主操作、输入和失败恢复可达。</li><li>[ ] 旧数据可读，确认版本可追溯，正文不可变。</li><li>[ ] 测试与本次风险相称；工程证据不冒充文学效果。</li></ul></template><template id="document-25" data-title="长篇小说创作质量与工作流规范 V2" data-path="docs/LONGFORM_QUALITY.md" data-meta="当前正式文档 · 34.2 KB · f175fa7f6fa2"><h1>长篇小说创作质量与工作流规范 V2</h1><blockquote>生效日期：2026-08-09<br>适用版本：<code>wm-longform-r1-20260719-003435-e4d7b8b7</code><br>设计审查：<code>DR-20260809-volume-event-quality-v2</code><br>当前工作流：卷驱动事件链 V2</blockquote><h2>1. 目的</h2><p>本规范用于保证长篇小说在持续创作中保持事实可靠、规划可追溯、人物有生命力、事件有因果、正文有创造性、失败可恢复，并让作者始终拥有最终决定权。</p><p>本规范不是AI成员的逐项写作评分表，也不是产品岗位和模型配置的上级规则。它不固定团队人数、岗位名称、模型供应商、永久上下文字段或叙事公式；实际岗位和模型绑定由当前《AI成员系统》与活动配置决定。</p><h2>2. 现行边界</h2><h3>2.1 不设创作质量层级</h3><p>不再建立面向作者或AI成员的“质量层级、质量分层报告、逐层过关”机制。质量问题按当前工作流节点、影响和证据直接报告，不用等级驱动创作。</p><p>E0—E4只表示工程结论的证据强度，不能表示小说档次，不能注入创作提示词，也不能限制AI方案。</p><h3>2.2 对象化协作与作者原话</h3><p>作者只在明确的开书、设定、卷纲、事件、章纲和正文对象上推进正式创作，不使用聊天推进或抽象创作模式分流。独立灵感只提供启发，不能推进正式状态或写入正式对象。</p><p>作者在开书、设定、卷纲、事件、章纲和正文对象旁直接输入想法、附件与修改意见。AI成员直接提交方案；作者选择、局部融合、编辑、退回或确认。</p><p>正式生产不建立聊天记忆、会话摘要或对话检索源。独立灵感默认隔离；只有作者主动摘录并绑定目标对象的片段，才作为带来源的作者原话进入正式流程。作者原话必须保留在明确业务对象上，并区分：</p><ul><li>必须遵守；</li><li>强偏好；</li><li>灵感参考；</li><li>待回答问题。</li></ul><p>任务、候选、选择、调用、来源、版本和恢复记录继续保存，但它们是业务与审计记录，不是聊天记忆。</p><h3>2.3 不把规范全文注入创作上下文</h3><p>本规范和对应Skill只用于开发设计、故障诊断与验收。AI成员只接收当前任务所需的最小事实、规划、作者原话和创作边界；不得接收本规范全文、工程证据等级或全量检查清单。</p><h3>2.4 作者界面信息洁净</h3><p>顶部功能栏已经说明当前功能，中心页不得再次堆叠同名标题、宣传副标题和固定使用说明。同一含义只在最接近操作的位置显示一次；对象名称、真实进度、错误、风险、版本影响和待作者决定的内容仍必须可见。</p><p>普通创作页面用自然语言解释真实任务状态，不直接显示任务ID、内部状态或阶段键、检查点、ContextPack、哈希、JSON、SQL、Worker、SSE、原始供应商路径或模型内部ID。技术证据继续保存在后台任务、调用和审计记录中，不能因为前端隐藏而删除。未知状态不得回退显示机器键，统一转成“正在处理”或“需要处理”。</p><p>静态帮助只在首次空状态、危险操作、不可逆影响或容易误解的决策点按需出现；能够从按钮、字段、对象和进度直接理解的内容不再重复解释。</p><h3>2.5 大白话展示门禁与语义保护</h3><p>所有动态文字必须经过统一作者展示门禁后才能进入普通创作页面。门禁至少区分界面说明、真实进度、错误反馈和故事文本：前三类翻译术语、过滤内部编号与机器键并给出自然语言恢复动作；故事梗概、章纲叙述、正文和作者原话不得机械替换人物用词、世界观术语或剧情语义。故事文本若混入资料回查、正史管理、结算规则、质量理由、测试解释或“为什么这样写”等内部治理说明，不能翻译后继续冒充小说，必须停止展示并提供重新生成或修改入口；后台原件和失败证据不得删除。</p><p>关键选择控件必须可见、稳定且可键盘操作。切换作者意见强度不得触发提交、导航、页面重载或滚动跳转；不得以透明绝对定位控件承载会改变当前视图的核心选择。</p><h2>3. 当前权威工作流</h2><pre class="code-block"><code data-language="text">开书信息
→ 设定
→ 分卷
→ 当前卷事件链
→ 当前事件大纲
→ 当前事件完整章节序列
→ 近期一至三章详细章纲
→ 单章正文
→ 章节结算
→ 事件结算
→ 卷结算
→ 下一卷</code></pre><p>只细化当前一卷。卷长、事件长、章节数和节拍数都是可修订估计，不是硬规则。</p><h2>4. 数据与规划权威</h2><h3>4.1 已发生事实</h3><p>以下内容可以成为已发生事实：</p><ol><li>作者确认的开书信息与设定正史；</li><li>作者定稿的不可变正文版本；</li><li>从定稿正文和既有正史生成并确认的章节、事件和卷结算；</li><li>带明确来源的人工修订。</li></ol><h3>4.2 未来规划</h3><p>分卷、事件链、事件大纲和章纲都是未来创作的活动规划，不是正史。</p><ul><li>卷纲约束本卷目标、核心冲突、主要因果、人物变化、高潮、卷末状态和下一卷接口；</li><li>事件链约束卷内事件职责、顺序和因果衔接；</li><li>事件大纲约束当前事件的入口、行动、结果、代价和下一触发；</li><li>章纲约束本章功能、关键场景和结束状态。</li></ul><p>规划不能直接写入资料库正史。正文实际结果与规划不同，以作者确认正文及结算为“已经发生”，后续规划是否修订由作者决定。</p><h3>资料库语义门禁</h3><p>资料库必须把作者确认设定、正文正式实体与事实、人物当前状态、正文实际事件时间线分开。势力、地点、道具和生效规则不能用同一批设定卡重复填充；主角从配角索引排除。配角、势力、地点、道具/资源使用各自的可选语义档案：配角可记录身份、年龄、性格、门派、境界、属性、装备与关系；势力可记录规模、实力、等级、驻地与地位；道具资源可记录属性、效果、数量、归属和流转。正文或确认设定没有依据的字段必须显示未知，不能为了卡片完整而补造。</p><p>主角状态是可追溯账本，不是静态人物简介。获得、更新、消耗和失去的物品/资源，境界、属性、技能、伤势与身份变化都应在正文明确时记录发生章节或故事时间；未知保持未知。地点资料与世界路线图分开：路线从明确出生地或首个正式场景开始，只按正文到达章节连接，不猜坐标与方位。事件时间线聚合正文已结算事件，作者可见层只显示故事时间或章节范围加事件名；规划只留在后台作为归属和差异对照。</p><p>类型化资料是检索入口，不是创作公式。ContextCompiler只能按当前任务和活动版本选择必要档案，不得因为存在字段模板就把全部人物、势力、地图和道具塞入每次调用，也不得阻止AI提出符合上游约束的新内容；新内容在作者确认或正文结算前仍是候选。</p><h3>4.3 派生层</h3><p>摘要、Wiki、图谱、全文索引、向量、关系投影、标签和质量统计均可重建，只用于导航、检索和诊断，不能成为事实权威。</p><h2>5. 规划版本与依赖</h2><p>设定、卷纲、事件和章纲的每次AI生成、作者修改或融合都产生新版本，不静默覆盖。</p><p>正式正文任务必须冻结：</p><ul><li>活动开书/设定版本；</li><li>活动卷纲版本；</li><li>活动事件版本；</li><li>活动事件章节链版本；</li><li>当前章纲版本；</li><li>工作流版本和模型绑定快照。</li></ul><p>确认上游新版本前，系统显示改变字段和受影响的事件、章纲、正文候选与任务。确认后，错版下游候选必须失效、等待重核或由作者明确保留，禁止静默重写。</p><h2>6. 作者意见与AI方案闭环</h2><p>每个规划节点使用同一闭环：</p><ol><li>作者输入原话、附件、偏好强度和目标对象；</li><li>系统冻结活动上游版本；</li><li>ContextCompiler为实际参与的AI成员分别编译任务包；</li><li>成员直接输出独立方案；</li><li>前端展示方案共同点、实质差异、代价、未知和来源；</li><li>作者可选整份、按部分融合、直接编辑、退回或不采用；</li><li>融合成员只在作者明确选择后整合被选部分；</li><li>作者再次确认后生成活动版本；</li><li>系统计算下游影响并给出下一步。</li></ol><p>AI方案不自动投票、不自动确认，不用“多数意见”替代作者决定。同一模型承担多个岗位时必须如实显示，不得冒充异模型共识。</p><h2>7. 分层节奏规则</h2><p>专业叙事方法只在后端版本库、任务快照和审计中存在。卷级任务从方法库组合两个不同骨架，但作者只看到针对本书写成的具体路线；事件级只允许不选、单选一种阅读感受或输入自己的话，不能拼接多套完整节拍。</p><p>卷候选至少有两条路线，且在动机、升级、选择代价、高潮解决或卷末局面中的至少两项实质不同。普通创作界面不显示“猫咪写作、三幕式、五幕式”等来源，只说明主角如何行动、经历什么、怎样解决、代价和后续影响。作者可以选择、融合、编辑或不用，内部方法快照不能变成硬公式。</p><p>第一卷路线强制携带开篇职责，但职责仍按本书具体化：</p><ul><li>前500字建立立即可感知的变化、困境、欲望或异常；</li><li>第一至第三章分别抓住读者、首次兑现并扩大压力、完成小闭环并打开更大目标；</li><li>约10万字以内或第一卷结束前完成一次改变局面的重大高潮。</li></ul><p>这些要求不能翻译成固定爽点、反转、打脸或高潮频率，也不能要求每章重复同一种节拍。</p><p>事件规划默认把现有正式字段即时投影为故事视图：区分已经发生的上一幕与未来预计承接，以具体行动、困境、选择和结果变化帮助作者理解；细节视图继续完整保留结构化字段。展示投影不落成第二套正史，不补写无依据事实，也不以固定“但是/没想到”句式或数值张力曲线限制AI发挥。</p><h2>8. ContextCompiler与任务型上下文</h2><h3>8.1 总原则</h3><p>上下文由确定性ContextCompiler按任务编译，不由某个AI岗位垄断数据库或检索。岗位可以变化，任务所需信息随当前书、当前节点和活动版本变化。</p><p>每个ContextPack至少记录：</p><ul><li><code>owner_id</code>、<code>book_id</code>；账号归属只能来自已验证会话。首位管理员接管历史本机owner只改变访问归属，不改写故事对象；其他用户owner必须完全隔离；</li><li>任务类型与目标对象；</li><li>活动版本和修订号；</li><li>作者原话及强度；</li><li>直接权威源；</li><li>约束强度：硬事实、当前任务、软参考或创作空白；</li><li>真值状态：计划、确认或实际；</li><li>业务范围和依赖版本；</li><li>检索查询、纳入与排除理由；</li><li>冲突、裁剪、预算和来源指纹；</li><li>ContextCompiler版本。</li></ul><h3>8.2 完整输入与无损压缩</h3><p>开书信息体量有限，开书和设定任务直接接收完整活动版本。从卷纲开始按层组织资料：四项核心设定全文常驻，与任务相关的可选设定全文进入，其他可选设定只给目录并允许回查。压缩必须完整覆盖选中的有效字段，不是只生成几句摘要。</p><p><code>BookCorePack</code>必须覆盖作者填写的全部开书信息：书名、定位/卖点、题材与标签、目标读者、预计规模、节奏/风格、初始角色、身份、性格、目标、核心机制/金手指、开篇场景、自定义信息、必须项、强偏好、灵感、问题和附件引用。空字段保留为空，AI不得补造。</p><p>设定、卷纲和事件分别形成可回查原文的 <code>SettingConstraintPack</code>、<code>VolumeConstraintPack</code>、<code>EventChainPack</code>和<code>CurrentEventPack</code>。无损压缩遵守：</p><ul><li>作者已填写字段覆盖率100%；</li><li>作者原话、必须项、强偏好、硬设定、核心机制和上层因果不丢失；</li><li>每个压缩项携带来源对象、版本和字段/片段引用；</li><li>硬约束、软节奏/模板和灵感分开；</li><li>上游修订后重新编译，旧任务包失效；</li><li>超预算时先去重、删除低相关软参考并缩短导航措辞，不对硬事实和当前任务做字符截断；仍不足就明确阻断。</li></ul><p>ContextCompiler在调用方计算基础预算后自动加入的相关硬设定，使用岗位显式配置的有界硬来源专用余量。最终有效预算只扩到实际硬来源大小，未使用余量不能被检索切片、声音证据或其他软参考占用；实际硬来源超过基础预算与专用余量之和时继续明确阻断。事实审查可使用该机制保证正文、完整章纲、相关设定和正史证据无截断，文学与体验审查仍保持各自小资料包。</p><p>去重必须理解来源覆盖关系，而不只是比较字符串。若活动章纲、前章正文或其他权威对象已经以完整版本进入硬来源，同一对象、同一版本的尾段、摘要和检索切片应排除；只有切片提供完整来源未覆盖的独立证据，或完整来源未被纳入时才保留。完全相同的硬来源、可选来源也只保留一份。每项排除都写入ContextPack审计，保留来源、版本和理由，禁止为了缩短输入静默丢失独立证据。</p><h3>8.3 任务上下文矩阵</h3><div class="table-scroll"><table><thead><tr><th>任务</th><th>直接接收</th><th>按需检索</th><th>明确排除</th></tr></thead><tbody><tr><td>开书</td><td>作者填写的全部开书字段、自定义信息、附件、导入内容和偏好；不压缩</td><td>导入旧稿时仅查导入范围</td><td>其他书、聊天、AI猜测和未填信息补造</td></tr><tr><td>设定候选</td><td>完整开书活动版、当前设定模块、该模块全部作者自定义信息和附件；后续模块加入核心人物/读者承诺/作者禁区与已确认的直接依赖设定；融合只重复注入作者选中方案的规则骨架，完整方案按ID回查</td><td>当前书内开书字段、已确认设定依赖和附件来源</td><td>其他书、聊天、卷纲、事件、章纲、正文、无关设定、方案的重复解释/未选备选和未确认AI猜测</td></tr><tr><td>卷纲候选</td><td>完整<code>BookCorePack</code>、四项核心设定全文、可选设定目录与相关全文、长期承诺、本卷作者原话；第一卷加入开篇职责，后续卷加入上一卷真实结算和当前状态</td><td>大线索、人物/势力状态、历史实际因果和必要原文</td><td>其他书、聊天、未实现规划、全文正文和内部方法全集</td></tr><tr><td>事件链/蓝图</td><td><code>BookCorePack</code>中的定位/标签/主角/核心机制、分层设定包、完整<code>VolumeConstraintPack</code>和事件链作者原话</td><td>卷目标相关线索、角色/势力状态和重大因果</td><td>其他书、聊天、无关旧事件、正文全文、固定章数和无依据跨卷扩张</td></tr><tr><td>事件大纲</td><td><code>BookCorePack</code>、分层设定包、完整<code>VolumeConstraintPack</code>、完整<code>EventChainPack</code>、当前事件卡全部信息、上一事件真实结算/卷首状态、当前事件作者原话和单一软参考</td><td>相关人物、地点、规则、道具、线索、历史因果和必要原文</td><td>其他书、聊天、全卷正文、其他事件完整大纲、无关资料和越过事件链的扩写</td></tr><tr><td>章纲</td><td>分层开书/设定资料、完整卷纲/事件链/<code>CurrentEventPack</code>、上一真实结算和作者章链/单章意见；首三章加入开篇职责</td><td>当前事件和本章事实、角色状态、线索、前文因果和场景原文</td><td>其他书、聊天、无关卷/事件、全部人物卡和无关正文</td></tr><tr><td>正文</td><td>四项核心设定全文、相关可选设定全文、其他设定目录、完整当前章纲、当前卷/事件职责、最近1—3章原文与结算、线程账本、作者意见和自由区</td><td>实体、规则、因果、时间、人物声音和必要原文</td><td>其他书、聊天、全书正文、内部方法原文、其他事件完整大纲、其他章节完整章纲和无关报告</td></tr><tr><td>事实审查</td><td>开书硬边界、设定/卷/事件链/当前事件约束、完整当前章纲、同一不可变正文、前章/上一结算、正史、时间线、人物/物品/能力/地点状态和线索</td><td>正文实际出现实体、规则、时间、知情、能力、道具、线索及正式原文</td><td>其他书、聊天、其他审查报告、AI候选、纯审美偏好；无证据时不得把留白/谎言/谜团判错</td></tr><tr><td>文学审查</td><td>开书题材/读者/表达偏好、压缩卷/事件上下文、完整当前章纲、同一不可变正文、必要前章、人物声音/关系/情绪证据和作者本章意见</td><td>人物代表性原文、近期同类场景、本事件情绪进度</td><td>其他书、聊天、其他审查报告、全量正史、无关设定和固定文风/节拍表</td></tr><tr><td>体验审查</td><td>开书卖点/标签/目标读者、压缩卷纲、完整事件链中的当前位置、当前事件、完整当前章纲、同一不可变正文、必要前章、事件阅读进度和作者预期感受</td><td>必要前章、已定稿事件体验锚点和题材承诺</td><td>其他书、聊天、其他审查报告、全量设定、固定爽点/反转/打脸次数</td></tr><tr><td>章节结算</td><td>当前章定稿正文全文/版本、完整章纲、前章结算、既有正史、当前状态和相关线索；卷/事件规划只作对照</td><td>正文来源、相关正史和冲突证据</td><td>其他书、聊天、未定稿正文、AI候选和正文未发生的章纲内容</td></tr><tr><td>事件结算</td><td>当前事件全部章结算、必要定稿原文、事件初始正史状态、完整当前事件、事件链和卷纲；规划只作对照</td><td>事件正文来源、状态变化和开放线索</td><td>其他书、聊天、未定稿章节、AI候选和计划未发生内容</td></tr><tr><td>卷结算</td><td>本卷全部事件结算、必要正文回查、卷首正史状态、完整卷纲和事件链；卷纲只作对照</td><td>卷内正式来源、状态、承诺和线索</td><td>其他书、聊天、未结算事件、未定稿正文、AI候选和未实现卷计划</td></tr><tr><td>下一卷</td><td>全字段<code>BookCorePack</code>、分层活动设定、故事脊柱、上一卷完整真实结算、更早卷结算历史、当前人物/势力/资源状态、开放线索、作者新卷原话和附件</td><td>下一卷相关设定、结算、跨卷承诺和必要原文</td><td>其他书、聊天、旧AI候选、过期版本、未实现计划冒充事实和全书正文堆叠</td></tr></tbody></table></div><p>章纲任务先评估当前事件所需总字数和章节数，再生成完整章节序列。每章至少确定章节职责、主要场景、关键行动/信息、情绪变化、前后衔接、结尾状态和预计字数；只把近期一至三章提升为正文可用的详细冻结章纲，其余章节继续作为可调整的事件内规划。</p><p>章链和单章章纲默认只有一份主方案。作者可选启动另一位异模型编剧的轻量挑战，但挑战者只读取冻结上游、精确主方案版本和作者本次关注点，至多提出3个关键替代方向，并说明收益、代价和后续影响。挑战意见不是正式方案，不自动融合、不进入生产上下文；只有作者主动修改或重新生成产生的新版本才可成为正式候选。</p><p>正文先通过确定性硬检查，再进入三类审查。硬检查由代码执行，不属于任何AI成员，顺序覆盖机器协议/占位符、标题与格式、有效字符数、版本与来源、内部治理口吻、最近5章长段落复用和版权风险。只换章名、地点、人物名、数值或段落顺序仍算模板复用；正常角色名、世界观术语、连续状态和短语重复不构成硬错误。正文优先目标为2700—3200有效字，低于2350或高于3650直接打回；确定性修复最多2轮，仍失败则阻断并交作者处理。三席不得使用ContextPack的<code>tokenCount</code>、供应商输入/输出Token或模型估算，重新裁决作者正文的有效字数、格式和占位符；报告中出现这类越权问题时由服务端移除，仍存在的事实、文学和体验问题继续保留。</p><p>主笔首次明确技术失败后只允许同一模型重试1次；供应商结果未知不得盲重试。两次明确失败、超时或不可用后，副笔才可基于同一冻结资料包接管且最多1次。作者对文风或情节不满意不属于技术失败，必须走作者修订或重写流程。</p><p>卷方向候选同样区分“结果未知”和“结果已知但合同无效”：供应商结果未知时必须停止，待作者或管理员明确重试后才可按冻结检查点处理；模型已成功返回但在有界重试后仍缺首卷强启动、全书故事总线或其他必需合同字段时，不接受坏稿、不反复复用无效结果，应把它记为结果已知的可替补技术失败，由另一异模型成员基于同一资料包补位。单纯不喜欢某条故事路线不属于技术失败。</p><p>卷方向任务跨重试恢复已有候选时，必须从已落库模型调用恢复该候选的实际生产者，不能按任务最初席位猜测；技术补位应排除本任务已尝试成员以及相同供应商与模型绑定，确保两条作者可见路线仍由异模型独立产生。</p><p>事件链由两位异模型编剧在同一冻结资料包上独立设计，主编融合；资料包必须包含确认卷方向仍有效的作者原话和当前事件链对象的作者输入。模型已成功返回、但稳定责任键、因果移交或卷责任覆盖不符合合同时，只允许基于同一冻结资料包做一次定点结构纠错；纠错提示必须给出合法稳定键且不得放宽首卷七项责任。供应商结果未知仍立即停止，不能因结构重试规则而盲重放。</p><p>长事件链、卷方向和长篇审校的模型业务上限为15分钟时，底层HTTP dispatcher的响应头与响应体等待不得仍停留在5分钟默认值；连接建立最多30秒，已连接后的长推理等待与业务上限一致。延长等待只消除传输层误中断，不改变结果未知停止、人工明确恢复和有界重试规则。</p><p>若模型已返回<code>stop_reason=max_tokens</code>且只有思考块、无可见文字，这是结果已知的可恢复失败，不是结构坏稿或结果未知。完整事件链对GLM 5.3预留更大的可见输出额度；仍为空时只允许在同一attempt内再扩大一次，总调用次数继续受两次门禁约束，不能与结构纠错叠加成第三次。</p><p>若两档额度仍由同一模型全部耗在思考块，则该模型对“完整事件链长结构JSON”记为当前能力不匹配；新一轮事件链在第二、第三正式编剧中优先选择另一异模型席位，不改变14人团队、不把同模型换名冒充独立，也不让主编或非编剧代替候选。</p><p>并行两席必须使用<code>allSettled</code>语义等到全部模型调用终态，再决定任务失败或进入融合；禁止一席先失败就结束租约，使另一席成功结果变成晚到中断。第二次编剧输出若已通过事件结构和事件交接，仅缺卷方向责任的稳定映射键，或七项首卷硬责任齐全但把某个合法卷责任键额外放进首卷责任数组，可保留为内部故事候选，让主编补齐映射或由系统过滤误放项；任意伪造键、首卷责任缺失、事件结构错误和最终融合稿不适用该窄容错。方向版本标识属于任务元数据，由系统绑定当前活动版本，不使用模型返回值决定。</p><p>三类审查必须绑定同一份不可变正文和同一个完整当前章纲，但附加上下文按职责隔离，也不能读取彼此报告：事实席拿硬事实与来源，文学席拿人物声音和表达证据，体验席拿目标读者、题材承诺和阅读进度。冻结章纲中的必须实现、禁止违反、当前章结束状态和下一章接口属于任务边界；文学席和体验席可以建议更自然的写法，但不能为了审美偏好要求删除必写人物线、关键行动、信息或承接接口。</p><p>事实席的重大冲突必须同时证明两端属于同一对象、同一指标和同一范围；两个独立数量、主观估算的耗时、公开来源与隐藏结论、行动意图与固定句序之间不得被臆造为一一对应。文学席和体验席若提出的修复只需删改、压缩、移动一两句，或增减一个局部动作、反应和过渡，而主场景、人物动机、核心因果与章末接口仍成立，则最高只能记为轻微建议并保持通过。严重级别按实际修复范围决定，不按报告措辞的激烈程度决定。</p><p>结算分为章节、事件和卷三级。每一级只从作者定稿正文、下一级已确认结算和既有正史提取实际结果；卷纲、事件大纲和章纲只能用于计划—实际差异，不能写入“已发生”。下一卷必须以完整真实卷结算为起点，上一卷未实现计划只能作为重新选择的候选。</p><h2>9. 混合RAG V2</h2><h3>9.1 目标架构</h3><p>SQLite保存正式业务源、版本、关系、来源、任务和结算；LanceDB只保存可重建的本地向量投影。检索按任务组合：</p><ol><li>结构化精确查询；</li><li>全文检索；</li><li>向量语义召回；</li><li>人物、势力、地点、道具、规则和线索关系扩展；</li><li>时间与因果邻域；</li><li>已确认设定、正文与来源附件原文回查。</li></ol><h3>9.2 路由与融合</h3><p>工作流节点、目标对象、活动版本和任务意图先决定检索通道，再决定召回数量。禁止用一个全局相似度阈值处理全部任务。</p><p>融合前必须执行：</p><ul><li>书籍隔离；</li><li>活动版本和有效期检查；</li><li>来源权威检查；</li><li>时间、因果和状态一致性；</li><li>冲突标注；</li><li>去重和预算裁剪；</li><li>纳入/排除理由记录。</li></ul><p>摘要只导航，发现事实不确定或冲突时回查正式源。找不到依据就标注未知或需确认，不补造。</p><h3>9.3 与全书长度解耦</h3><p>模型上下文不随总字数线性增长。跨卷信息依靠版本化卷结算、开放线索、实体状态和按需原文回查；不得用“只记最近固定章数”作为长期遗忘规则。</p><h2>10. 动态分层规划 V2</h2><p>动态分层采用当前卷—事件对象链：</p><pre class="code-block"><code data-language="text">全书长期承诺与活动设定
