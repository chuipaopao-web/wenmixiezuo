→ 当前事件章纲 → 单章正文 → 章节结算 → 事件结算 → 卷结算 → 下一卷</code></pre><ul><li>卷纲约束事件，事件链约束事件大纲，事件大纲约束章纲，章纲约束正文。</li><li>规划描述未来；结算只记录正文实际发生的内容。上游版本变化时下游候选必须失效或重新确认。</li><li>作者可见模板全部使用大白话，是可不用、混合、重排和自定义的软参考。</li><li>作者原话附着明确业务对象，并区分必须、强偏好、灵感和问题。</li><li>作者通过设定、卷、事件、章纲和正文对象直接接收AI方案、比较差异、选择、融合与修改。独立灵感只提供启发，不写正式对象；只有作者主动摘录并绑定目标对象后才成为正式作者输入。</li><li>已有正文续写和反向拆解保留；原文不可覆盖，分析结果必须带来源且只作为派生资料。</li></ul><h5>技术与数据</h5><ul><li>React、TypeScript、Vite、Node.js稳定LTS、Fastify、SQLite、LanceDB OSS本地投影、REST与SSE。</li><li>本地模块化单体加独立Worker；服务只监听 <code>127.0.0.1</code>。</li><li>业务层通过Repository访问数据；Worker不得直接修改核心业务表或正式正文。</li><li>核心对象和查询携带 <code>owner_id</code>、<code>book_id</code>；跨书污染必须为0。</li><li>正文使用不可变完整版本；任何修改创建新版本。</li><li>SQLite正式对象和不可变原文是权威源；FTS、向量、图谱、Wiki和摘要都是可重建投影。</li><li>摘要只导航；事实争议回查正式源。</li><li>API Key只从环境变量读取，不得写入数据库、日志、上下文、备份、导出或Git。</li><li>普通删除为归档；作者数据永久删除仍需影响预览、输入 <code>YES</code> 和二次确认。</li></ul><h5>Agent与上下文</h5><ul><li>创作团队保持11名成员；未经老板另行决定不得改变人数。</li><li>小文秘书是本地工具角色，不是第12名创作成员，不能给剧情结论或冒充异模型意见。</li><li>岗位、Agent实例和模型绑定解耦；同模型不得冒充异模型独立复核。</li><li>状态由真实任务、心跳、模型调用和工具事件驱动。</li><li>每次模型调用保存上下文包、调用、预算和任务快照；不保存或展示思维链。</li><li>正文使用单一活动写手；事实、文学、体验三职责由三异模型独立审查，彼此不读取报告。</li><li>ContextCompiler按任务和活动版本动态编译资料，排除其他书、未摘录灵感、过期版本、无关候选、全文堆叠和AI猜测。</li><li>检索组合结构化直达、全文、向量、关系、时间/因果与正式原文回查，不依赖单一相似度阈值。</li></ul><h5>质量、开发与删除门禁</h5><ul><li>长篇质量Skill保护创造性，不得把软倾向变成硬公式或固定创作模式。</li><li>重要设计记录 <code>design_review_id</code>、事实/推断/偏好/未知、替代方案、两轮审查、证据、停止条件和回滚。</li><li>一致性提升不得抵消原创性、合理惊喜、人物可辨识度、情绪力度和整体阅读质量。</li><li>当前Codex默认独立开发，不调用其他开发Agent；产品运行时AI成员不等于开发成员。</li><li>发现规格缺口先更新当前规格，再改代码。</li><li>删除源码前执行启动入口、动态引用、路由、测试、迁移和恢复引用检查；只删除零依赖或已完成替代的实现。</li><li>每个重要阶段执行类型检查、全量测试、构建、迁移、运行、隔离与相关恢复测试。</li><li>完成标准以 <code>docs/ACCEPTANCE.md</code> 为准；存在测试失败、文档冲突或重大BUG时不得宣布完成。</li></ul><h5>当前文档</h5><ul><li><code>scripts/sync-project-docs.mjs</code> 的白名单是当前文档中心唯一收录范围。</li><li>白名单外的发布证据、一次性报告、临时计划、二进制元数据和无关文件不得进入当前文档中心或产品检索。</li><li>老板新决定写入 <code>docs/DECISIONS.md</code>，并同步所有受影响的当前规格。</li><li>Git历史只负责追溯，不作为默认知识库。</li><li>每次开发结算和最终回复前，只要源码、规格、Skill或任务状态发生变化，就必须运行 <code>node scripts/sync-project-docs.mjs</code> 与 <code>node scripts/sync-project-docs.mjs --check</code>；同步或检查失败不得结算。</li><li>标准 <code>npm run verify</code>、桌面文档入口、Git提交、合并和切换都会自动刷新当前文档中心。</li></ul><hr><h3>文秘写作当前知识地图</h3><blockquote>当前源文件：<code>KNOWLEDGE.md</code> · 指纹：<code>457469917370</code></blockquote><h4>文秘写作当前知识地图</h4><h5>产品主线</h5><p>文秘写作是本地优先的长篇小说AI协作平台。作者始终拥有最终决定权，AI通过明确对象提供独立方案、融合候选、正文和审查报告，不使用聊天推动流程。</p><p>主流程：开书 → 设定 → 卷纲 → 事件链 → 事件大纲 → 事件章纲 → 单章正文 → 章/事件/卷结算 → 下一卷。</p><p>已有作品可导入并反向拆解；作者原文保持不变，派生分析带来源并进入同一卷—事件工作流。</p><h5>权威对象</h5><ul><li>开书活动版：作者填写的全部开书信息和明确偏好。</li><li>设定活动版：世界、力量、势力、人物、规则等已确认设定。</li><li><code>volume_plans</code>：活动卷纲与不可变候选版本。</li><li><code>story_events</code>：卷内事件链、事件卡和事件大纲版本。</li><li><code>event_chapter_outlines</code>：当前事件章链与单章详细章纲。</li><li><code>manuscript_versions</code>：不可变正文版本。</li><li>章节、事件、卷结算：正文实际发生内容的正式聚合。</li><li>正史事实、实体、时间线和关系：由定稿正文与确认资料产生。</li></ul><p>SQLite正式对象与不可变原文是权威源。摘要、图谱、Wiki、FTS和LanceDB只作导航或可重建投影。</p><h5>AI协作</h5><p>11名创作成员保持不变。卷纲与重要事件由主编组织两位异模型编剧独立提案后融合；章纲在当前事件约束下拆分；正文由单一活动写手完成；事实、文学、体验三席使用三异模型独立审查。小文秘书只处理确定性工具、导航和安全回执。</p><h5>上下文原则</h5><ul><li>开书和设定阶段完整保留作者输入。</li><li>越往下游越压缩上层信息，但必须覆盖所有上层硬约束。</li><li>当前对象使用完整内容：当前卷、当前事件链、当前事件大纲或当前章纲按任务选择完整注入。</li><li>历史只按触发实体、规则、时间、因果、伏笔和人物声音回查。</li><li>其他书、聊天、过期版本、无关候选和无依据猜测始终排除。</li></ul><h5>当前入口</h5><ul><li>产品与功能：<code>docs/PRODUCT.md</code></li><li>完整交互：<code>docs/CREATION_WORKFLOW_V2_DESIGN.md</code></li><li>AI成员：<code>docs/AGENT_SYSTEM.md</code></li><li>上下文：<code>docs/MEMORY.md</code></li><li>检索：<code>docs/HYBRID_RAG_DESIGN.md</code></li><li>质量：<code>docs/LONGFORM_QUALITY.md</code></li><li>API：<code>docs/API.md</code></li><li>验收：<code>docs/ACCEPTANCE.md</code></li><li>当前任务：<code>TASKS.md</code></li></ul><p>当前文档中心、产品检索和Codex默认上下文只读取显式白名单与当前活动对象。</p><hr><h3>文秘写作当前任务</h3><blockquote>当前源文件：<code>TASKS.md</code> · 指纹：<code>909382c29fe8</code></blockquote><h4>文秘写作当前任务</h4><h5>当前任务：统一创作台顶部去重与全项目验收</h5><h6>当前已实现</h6><ul><li>[x] 功能栏统一为信息、设定、分卷、规划、章纲、正文、资料库、取名、团队、任务、灵感、设置；前后端共享名称合同，数据库稳定键和旧书关联保持不变。</li></ul><ul><li>[x] 开书信息、设定、分卷、事件链、事件大纲、事件章纲、单章正文、章节/事件/卷结算和下一卷对象链；</li><li>[x] 作者原话、附件、方案比较、局部融合、直接编辑、定点重写和确认；</li><li>[x] 11名创作成员、单一活动写手和事实/文学/体验三异模型审查；</li><li>[x] 任务型ContextCompiler、结构化/全文/向量/关系/时间因果/原文混合检索；</li><li>[x] 已有正文不可变导入、来源分析、反向拆解和续写；</li><li>[x] 图谱、资料库、取名和作者附件；</li><li>[x] Contracts、API、Worker和Web运行时可达性审计均为0个孤儿源码；</li><li>[x] 类型检查通过；</li><li>[x] 全量145个测试文件、543项测试通过；</li><li>[x] Contracts、API、Worker和Web生产构建通过；</li><li>[x] 当前文档白名单共34份资料，卡片可在同一页面阅读全文；</li><li>[x] 桌面打开、开发结算、验证、提交、合并和切换自动刷新文档中心。</li><li>[x] 当前运行时不再调用或宣传退出的对话式创作能力；历史迁移、旧任务拒绝和旧书升级仅用于恢复兼容；</li><li>[x] 作者附件物理模型通过0042前向迁移统一为 <code>author_attachments</code>，原件和来源保留；</li><li>[x] 当前语义清理完成后建立Git结算恢复点。</li><li>[x] 修复活动事件版本引用，以及事件/卷结算后规划和章纲不可见的问题。</li><li>[x] 修复正常事件/卷结算被误判为上层版本变化的问题；已结算章纲改为校验并展示锁定历史版本。</li><li>[x] 用当前流程数据审计逐章验证卷纲、事件链、事件大纲、章纲和正文版本绑定。</li><li>[x] 生成按六个目录合并、可整页复制的当前项目完整合订版。</li><li>[x] 统一创作台重新布局：左侧只放书籍，顶部放全部功能，中心只显示当前书籍的当前功能页面。</li><li>[x] 左侧书籍栏采用可独立纵向滚动的单列固定84×118像素大封面；书名在左侧书籍栏中只写在封面内，中心信息页保留一次干净标题；书名最多15字并按长度四档缩小字号；自动测试运行键在作者界面转换为可区分的中文标签，数据库原始测试证据和已有旧标题保持不变。</li><li>[x] 全面替换旧浅绿色视觉为iOS式冷白蓝灰玻璃界面，并完成桌面端与窄屏回归。</li><li>[x] 删除顶部重复的“当前书籍/当前功能”摘要条，功能栏直接上移到首行；手机书籍抽屉入口并入功能栏，信息页保留唯一的页面书名标题。</li><li>[x] 独立灵感完成：只读当前书籍信息，不改正式对象；只有作者明确摘录的建议才可进入指定创作对象。</li><li>[x] 使用本地确定性模型完整跑通修仙新书的9项设定、1卷、2事件、20份章纲、20章正文、60份审查、章节/事件/卷结算；数据与逐级版本证据保留。</li><li>[x] 在真实本地服务上复测迁移、启动、健康、停止和重启。</li></ul><h6>待完成的真实环境证据</h6><ul><li>[ ] 使用真实套餐模型完成从开书到20章正文的端到端文学质量验收；</li><li>[ ] 使用真实大文件复测已有作品导入、分析和续写；</li><li>[ ] 完成第二物理介质备份与恢复演练。</li></ul><h6>不参与普通精简的数据</h6><ul><li>已合并数据库迁移；</li><li>作者书籍、导入原件、附件原件和正式正文；</li><li>当前活动规划、正史、任务来源、调用与恢复记录；</li><li>续写与反向拆解能力；</li><li>11名创作成员和当前模型绑定机制。</li></ul><h6>完成门槛</h6><p>类型、全量测试、构建、迁移、启动、跨书隔离、任务恢复、对象化工作流和文档同步全部通过；存在重大BUG、正文覆盖、跨书污染、不可恢复任务或文档版本错配时不得宣布完成。</p><hr><h2>六、长篇质量审查 Skill</h2><h3>卷—事件工作流的上下文与混合检索</h3><blockquote>当前源文件：<code>.agents/skills/wenmi-longform-quality/references/context-and-rag.md</code> · 指纹：<code>4d2ff5591b05</code></blockquote><h4>卷—事件工作流的上下文与混合检索</h4><h5>1. 原则</h5><p>上下文由确定性的 <code>ContextCompiler</code> 按任务编译，不由某个拟人岗位垄断数据库，也不依赖聊天记忆。</p><p>每个ContextPack都要记录：<code>owner_id</code>、<code>book_id</code>、任务类型、目标对象、活动版本、作者原话、直接权威源、检索查询、纳入/排除理由、裁剪结果、预算、来源指纹和编译版本。</p><p>直接活动版本是规划任务的首要输入；检索用于补充相关事实、历史因果、人物状态、开放线索和声音证据，不能覆盖直接权威源。</p><h5>2. 数据权威</h5><p>按用途区分：</p><ol><li>作者确认的开书信息、设定和正史事实；</li><li>已确认正文不可变版本；</li><li>分卷、事件和章纲的活动规划版本；</li><li>章节、事件与卷结算；</li><li>带来源的作者原话与附件；</li><li>可重建摘要、Wiki、向量、关系和分析投影；</li><li>AI候选、审查报告和失败任务记录。</li></ol><p>规划描述未来，不是已经发生的事实。摘要、Wiki、向量和图谱都是导航或派生层，不得反向成为正史。</p><p>正式生产不建立聊天历史、会话摘要或对话记忆源。独立灵感保存在隔离域，默认不是生产上下文或事实源；只有作者主动摘录并绑定具体业务对象的片段，才转为带讨论来源的作者原话。任务过程保存为候选、决定、调用与检查点，而不是可无限累积的对话。</p><h5>3. 完整输入与无损压缩</h5><p>“压缩”不是只保留几句摘要，而是把上游全部有效字段编译成更短的结构化约束包。信息可以换成紧凑表达，覆盖范围不能缩水。</p><p>开书信息较短，开书与设定任务直接接收完整活动版本。卷纲及后续任务使用 <code>BookCorePack</code>，它必须覆盖开书活动版本中的全部作者字段：书名、定位/卖点、题材与标签、目标读者、预计规模、节奏/风格选择、主角及其他初始角色、身份、性格、目标、核心机制/金手指、开篇场景、作者自定义内容、必须项、强偏好、灵感、问题和附件引用。没有填写的字段保留为空，不由AI猜测补齐。</p><p>其他上游信息分别编译为：</p><ul><li><code>SettingConstraintPack</code>：活动设定中的世界、人物、力量/规则、势力、地点、物品和明确禁区；</li><li><code>VolumeConstraintPack</code>：活动卷纲的卷目标、卷首状态、核心冲突、主要因果、人物变化、高潮、卷末状态、下一卷接口、节奏选择和作者原话；</li><li><code>EventChainPack</code>：本卷全部事件的次序、职责、入口、结果、前后触发和当前事件位置；</li><li><code>CurrentEventPack</code>：当前事件卡、活动事件大纲、进入状态、行动链、结果/代价、章节范围估计和下一触发；</li><li><code>CurrentChapterOutlineFull</code>：当前章纲全部字段，不做摘要替代。</li><li><code>CurrentManuscriptFull</code>：三类审查共同绑定的同一份不可变当前正文全文；</li><li><code>ChapterSettlementPack</code>、<code>EventSettlementPack</code>、<code>VolumeSettlementPack</code>：分别记录已经实际发生的章、事件和卷结果，均带正文/正史来源，不把计划内容写成事实。</li></ul><p>无损压缩必须满足：</p><ol><li>所有作者已填字段都有对应字段或显式引用，不能因“看起来不重要”而删除；</li><li>作者原话、<code>must</code>、强偏好和问题保留原文，不能只保留AI改写摘要；</li><li>活动上游目标、硬设定、关键人物、核心机制和因果接口不得省略；</li><li>每个压缩项携带来源对象、版本、字段或片段引用，遇到歧义可回查完整原文；</li><li>硬约束、软节奏/模板和灵感分栏，避免软信息被误当事实；</li><li>上游版本改变后重新编译，旧压缩包随冻结任务失效；</li><li>超预算时先去重、缩短措辞和移除与当前任务无关的正文证据，不删除上游核心字段。</li></ol><h5>4. 任务上下文矩阵</h5><h6>开书信息</h6><ul><li>接收：作者填写的全部开书字段、自定义内容、附件、导入内容和显式偏好，不做摘要替代。</li><li>检索：新书默认不检索；导入旧稿时只检索导入范围。</li><li>排除：其他书籍、聊天/历史会话、未确认AI猜测和任何未由作者填写的补造信息。</li></ul><h6>设定候选</h6><ul><li>接收：完整开书活动版本、当前设定模块、作者针对该模块的全部自定义原话与附件；后续设定模块额外接收已经确认且与本模块存在直接依赖的设定。</li><li>推演目标：只基于开书方向和作者自定义信息提出当前设定方案；需要新增但没有依据的内容明确标成候选，等待作者确认。</li><li>检索：只做当前书内的开书字段、已确认设定依赖和附件来源精确回查。</li><li>排除：其他书籍、聊天/会话记忆、卷纲、事件、章纲、正文、无关设定模块、未确认AI猜测和外部随机灵感。</li></ul><h6>分卷候选</h6><ul><li>接收：覆盖全部开书字段的 <code>BookCorePack</code>、<code>SettingConstraintPack</code>、全书长期承诺或主线骨架、作者选择的卷节奏/卷级软模板、本卷全部自定义原话；后续卷还接收上一卷真实结算和当前人物/势力状态。</li><li>推演目标：在开书定位、题材标签、主角与核心机制、活动设定和作者节奏选择下，规划当前卷目标、主要因果、人物变化、高潮和卷末接口。</li><li>检索：未回收大线索、相关人物与规则、上卷实际因果结果和必要正文锚点。</li><li>排除：其他书籍、聊天、上一卷未实现计划、全书正文、事件级模板库全集和与本卷无关的细节。</li></ul><h6>当前卷事件链</h6><ul><li>接收：<code>BookCorePack</code>中的定位、题材标签、主角和核心机制，<code>SettingConstraintPack</code>，完整 <code>VolumeConstraintPack</code>，作者对事件链的全部自定义原话和事件级软模板选择。</li><li>推演目标：沿卷纲的总目标和主要因果向下拆出小事件；每个事件都要说明对卷目标的职责、进入状态、结果和下一触发。</li><li>检索：只补充与卷目标直接相关的开放线索、角色/势力当前状态和重大历史因果。</li><li>排除：其他书籍、聊天、无关旧事件、全文正文、固定章数公式和未在卷纲内取得依据的跨卷扩张。</li></ul><h6>当前事件大纲候选</h6><ul><li>接收：<code>BookCorePack</code>、<code>SettingConstraintPack</code>、完整 <code>VolumeConstraintPack</code>、完整 <code>EventChainPack</code>、当前事件卡全部字段、上一事件真实结算或卷首状态、作者对当前事件的全部自定义原话和事件级软模板。</li><li>推演目标：在卷纲和事件链的双重约束下推演单个事件的起点、行动升级、转折、结果、代价和下一触发；不得把后续事件职责提前吞并。</li><li>检索：当前事件相关人物、地点、规则、道具、开放线索、历史因果和必要原文。</li><li>排除：其他书籍、聊天、全卷正文、其他事件的完整大纲、无关资料和与事件链冲突的无依据扩写。</li></ul><h6>当前事件章纲</h6><ul><li>接收：<code>BookCorePack</code>、<code>SettingConstraintPack</code>、完整 <code>VolumeConstraintPack</code>、完整 <code>EventChainPack</code>、完整 <code>CurrentEventPack</code>、上一事件/章节真实结算和作者对章链或单章的全部原话。</li><li>推演目标：先评估当前事件需要的总字数和章节数，再拆出完整章节序列；每章至少确定章节职责、主要场景、关键行动/信息、情绪变化、与前后章衔接、结尾状态和预计字数。</li><li>检索：当前事件和本章相关事实、角色状态、开放线索、前文因果与场景原文锚点。</li><li>排除：其他书籍、聊天、无关卷/事件、全部人物卡和与当前事件无关的正文。</li><li>冻结：完整事件章节序列全部保留，但只把近期一至三章提升为可供正文使用的详细冻结章纲；后续章信息继续作为可调整的事件内规划。</li></ul><h6>单章正文</h6><ul><li>接收：<code>BookCorePack</code>、<code>SettingConstraintPack</code>、压缩但完整覆盖的 <code>VolumeConstraintPack</code>、<code>EventChainPack</code>和 <code>CurrentEventPack</code>，以及当前章的完整 <code>CurrentChapterOutlineFull</code>；同时接收前章结尾及必要全文、当前正史状态、相关事实与开放线索、表达基线、作者修改意见和明确创作自由区。</li><li>创作目标：在卷目标、事件职责、当前事件大纲和本章完整章纲的层层约束下写出正文；约束方向与结果，不把压缩包逐句扩写成说明文。</li><li>检索：本章实体、规则、因果、时间、声音与相似场景证据；必要时回查原文。</li><li>排除：其他书籍、聊天、全书正文、整套模板原文、其他事件完整大纲、其他章节完整章纲和无关审查报告。</li></ul><h6>事实审查</h6><ul><li>接收：<code>BookCorePack</code>中的硬边界、<code>SettingConstraintPack</code>、<code>VolumeConstraintPack</code>、<code>EventChainPack</code>、完整 <code>CurrentEventPack</code>、完整 <code>CurrentChapterOutlineFull</code>、同一 <code>CurrentManuscriptFull</code>、前章完整正文或必要原文、上一章/事件真实结算、当前正史、时间线、角色/关系/物品/能力/地点状态和开放线索。</li><li>目标：核对正文是否违反开书硬边界、设定、卷/事件/章纲已确认约束和已经发生的事实；只报告可验证矛盾、来源缺失、时间/状态错误、战力/能力越界、知情错误、伏笔状态错误和版本错配，并引用具体来源。</li><li>检索：正文中实际出现的实体、行为、规则、时间、地点、道具、能力、知情和开放线索；冲突时回查正式设定、正文和结算原文。</li><li>排除：其他书籍、聊天、文学/体验审查报告、未确认AI候选、无关正文、纯审美偏好和固定节拍评分；有意留白、人物说谎和开放谜团不能在没有事实证据时判错。</li></ul><h6>文学审查</h6><ul><li>接收：<code>BookCorePack</code>中的题材、目标读者和作者表达偏好，压缩的<code>VolumeConstraintPack</code>、<code>EventChainPack</code>和<code>CurrentEventPack</code>，完整 <code>CurrentChapterOutlineFull</code>、同一 <code>CurrentManuscriptFull</code>、前章或近期必要正文、当前出场人物的声音/关系/情绪证据和作者本章意见。</li><li>目标：判断正文是否把章纲写成有生命的场景，重点检查人物声音、动机呈现、对白、场景感、情绪推进、叙事清晰度、重复、解释过度、模板腔和不自然的段落；提出定点建议，不改写事实和规划。</li><li>检索：当前人物的代表性说话/行为原文、近期同类场景和本事件情绪进度；只取能帮助文学判断的证据。</li><li>排除：其他书籍、聊天、事实/体验审查报告、全量正史包、无关设定、固定文风/节拍评分表和把所有章节统一成同一语气的规则。</li></ul><h6>体验审查</h6><ul><li>接收：<code>BookCorePack</code>中的一句话卖点、题材标签和目标读者，压缩的<code>VolumeConstraintPack</code>、完整 <code>EventChainPack</code>中的当前事件位置、<code>CurrentEventPack</code>、完整 <code>CurrentChapterOutlineFull</code>、同一 <code>CurrentManuscriptFull</code>、必要前章、当前事件截至本章的阅读进度和作者希望读者获得的感受。</li><li>目标：以目标读者视角判断是否看得懂、是否愿意继续、期待是否建立或兑现、节奏是否拖沓/仓促、情绪是否到位、主角行为是否令人信服、结尾是否自然产生下一章兴趣；输出主观体验，不冒充事实裁决。</li><li>检索：必要前章、当前事件已定稿章节的体验锚点和题材承诺，不无差别检索全书。</li><li>排除：其他书籍、聊天、事实/文学审查报告、全量设定证据、固定爽点/反转/打脸次数和把个人偏好包装成普遍读者结论。</li></ul><h6>章节结算</h6><ul><li>接收：作者定稿的当前章不可变正文全文、正文版本、完整当前章纲、前一章结算、既有正史、当前人物/关系/物品/能力/地点状态和相关开放线索；压缩卷/事件规划只用于差异对照。</li><li>输出：本章实际发生的行动与因果、人物/关系/资源/能力/地点/知情变化、新增/推进/回收/作废线索、正文来源、与章纲差异及对后续章纲的影响。</li><li>排除：其他书籍、聊天、未定稿正文、AI草稿/审查候选、未在正文出现的章纲内容和无来源推断。</li></ul><h6>事件结算</h6><ul><li>接收：当前事件全部已确认 <code>ChapterSettlementPack</code>、必要的定稿正文原文、事件开始时的正史状态、完整 <code>CurrentEventPack</code>、<code>EventChainPack</code>和 <code>VolumeConstraintPack</code>；规划只用于计划—实际对照。</li><li>输出：事件实际入口、关键行动链、结果、代价、角色/关系/资源变化、开放/回收线索、下一事件真实触发、未实现/调整实现/新增结果及对剩余事件链和卷纲的影响。</li><li>排除：其他书籍、聊天、未定稿章节、AI候选、计划中未写出的事实和其他事件无关正文。</li></ul><h6>卷结算</h6><ul><li>接收：本卷全部已确认 <code>EventSettlementPack</code>、必要的章节/正文原文回查、卷首正史状态、完整 <code>VolumeConstraintPack</code>和 <code>EventChainPack</code>；活动卷纲只用于计划—实际对照。</li><li>输出：本卷实际主线与因果、人物/关系/势力/资源最终状态、重要收益与代价、已兑现/未兑现承诺、开放线索、下一卷真实入口、卷纲差异和来源。</li><li>排除：其他书籍、聊天、未结算事件、未定稿正文、AI候选和卷纲中未实际发生的内容。</li></ul><h6>下一卷规划</h6><ul><li>接收：完整覆盖全部开书字段的 <code>BookCorePack</code>、当前 <code>SettingConstraintPack</code>、全书长期承诺/主线骨架、上一卷完整 <code>VolumeSettlementPack</code>、更早卷的结构化结算历史、当前人物/关系/势力/资源状态、全部仍开放的大线索、作者对下一卷的全部原话、选择的卷节奏/软模板和附件。</li><li>推演目标：从上一卷实际结束状态和真实开放线索出发设计下一卷，延续全书定位与核心机制；可以吸收上一卷未实现计划作为“待重新选择的候选”，但不能把它当成已经发生。</li><li>检索：与下一卷目标、开放线索、当前状态和跨卷承诺直接相关的正式设定、结算和必要正文原文。</li><li>排除：其他书籍、聊天/会话摘要、上一卷未实现计划冒充事实、旧AI候选、过期活动版本和全书正文无差别堆叠。</li></ul><h5>5. 混合检索路由</h5><p>按照任务选择通道，不设一个全局相似度阈值：</p><ul><li>精确通道：ID、名称、别名、规则、版本和活动指针；</li><li>全文通道：专有名词、原句、约定和场景关键词；</li><li>语义通道：同义表达、主题与声音相似片段；</li><li>关系通道：人物、势力、地点、道具、规则和线索邻域；</li><li>时间/因果通道：前因、后果、最近状态和阶段结算；</li><li>原文回查：已确认正文、设定与来源附件。</li></ul><p>融合前依次执行书籍隔离、版本有效性、权威层级、时间一致性、冲突标注、去重和预算裁剪。相似结果若缺少来源或与活动版本冲突，只能作为待核候选。</p><h5>6. 检索不足与冲突</h5><ul><li>找不到依据：标注未知或需确认，不补造。</li><li>事实冲突：把冲突双方和来源交给事实审查或作者裁决。</li><li>规划与正文冲突：正文结算代表实际发生；是否修订后续规划由作者决定。</li><li>召回过多：按任务关系、来源权威、时间邻近和因果必要性裁剪。</li><li>召回过少：扩大别名、关系、时间和原文邻域，不先降低全局阈值。</li></ul><h5>7. 必测项</h5><ul><li>跨书隔离与越权；</li><li>错活动版本和过期候选；</li><li>直接权威源不会被语义召回覆盖；</li><li>摘要误导时能回查原文；</li><li>作者灵感不会被升级为硬事实；</li><li><code>BookCorePack</code>对全部开书字段的覆盖率为100%，空字段不会被AI补造；</li><li>卷、事件链、事件大纲、章纲和正文均能回查各自上游完整版本；</li><li>压缩前后作者必须项、强偏好、核心机制、活动设定和上层因果不丢失；</li><li>三类审查绑定同一正文与完整当前章纲，但事实/文学/体验附加资料和结果相互隔离；</li><li>章节、事件和卷结算均只能从已确认正文、下级结算和既有正史提取实际结果；</li><li>下一卷使用上一卷完整真实结算，未实现计划不会冒充历史事实；</li><li>规划未实现内容不会进入结算；</li><li>中间、开头和末尾位置证据召回；</li><li>同义、否定、时间、因果、关系和对抗查询；</li><li>检索增益与创造性非劣效对照。</li></ul><hr><h3>创造性、人物生命力与输出非劣效</h3><blockquote>当前源文件：<code>.agents/skills/wenmi-longform-quality/references/creativity-and-output-quality.md</code> · 指纹：<code>3bbe3fb9afeb</code></blockquote><h4>创造性、人物生命力与输出非劣效</h4><h5>1. 审查边界</h5><p>质量审查不能成为小说生成器的逐项打分提示。它用于发现系统机制是否把创作压平，而不是要求每章同时满足所有指标。</p><p>不要设置创作质量层级，也不要把报告等级展示给AI成员作为行为门禁。工程证据等级只说明“系统结论有多少证据”，不评价小说属于什么档次。</p><h5>2. 三类约束</h5><h6>硬底线</h6><p>作者确认事实、活动版本、数据隔离、安全、版权来源、费用、不可逆操作和明确禁止项。</p><h6>当前任务约束</h6><p>活动卷纲、当前事件、当前章纲中被作者确认的目标、入口、结果和边界。它们约束方向，但不替代正文中的自然实现。</p><h6>软参考</h6><p>卷级/事件级模板、节拍建议、题材惯例、作者灵感、风格倾向、审查意见、字数和章数估计。</p><p>软参考可以不用、自定义、混合、拆分、合并或重排。AI可以有理由偏离；有价值的重大偏离形成候选和影响预览，由作者裁决。</p><h5>3. 保留创作自由区</h5><p>正式正文任务至少给写手保留：</p><ul><li>对白的具体表达；</li><li>动作、细节、意象和环境选择；</li><li>场景内部调度；</li><li>符合人物动机的局部反应；</li><li>不改变关键因果的自然过渡；</li><li>章纲未穷举但不违反事实的小发现。</li></ul><p>禁止把卷纲、事件和章纲逐句复制进正文，禁止要求每章机械命中固定爽点、反转或钩子数量。</p><h5>4. 人物生命力</h5><p>检查人物是否仍具有：</p><ul><li>可辨识的语言、节奏和关注点；</li><li>与经历、关系和当前状态一致的行动动机；</li><li>在约束内作出非模板化选择的空间；</li><li>可积累的情绪、误解、欲望、代价和关系变化；</li><li>与其他人物不完全同质的判断方式。</li></ul><p>人物一致不等于永远不变。变化必须有可追踪经历或事件作为原因；不要用静态性格标签阻止成长，也不要用“成长”掩盖无因漂移。</p><h5>5. 方案多样性</h5><p>独立候选应在因果路径、角色选择、冲突解决、代价或情绪落点上有实质差异，而不是更换同义词。</p><p>检查：</p><ul><li>ContextPack是否被过度模板化导致所有成员同解；</li><li>融合者是否平均化或抹掉最有价值的差异；</li><li>作者是否能按部分采用，而不是只能整份二选一；</li><li>同模型是否被错误显示成独立异模型意见；</li><li>退回重写是否保留作者已认可部分。</li></ul><h5>6. 非劣效维度</h5><p>根据变更影响选择测试，不要求每次全部执行：</p><ul><li>原创性；</li><li>合理惊喜；</li><li>人物可辨识度；</li><li>情绪力度；</li><li>因果自然度；</li><li>叙事清晰度；</li><li>检索锚定；</li><li>卷、事件、章之间的方向一致性；</li><li>整体阅读质量；</li><li>作者决策效率和修改负担。</li></ul><p>局部可逆修改可做针对性多样本对照；岗位默认、ContextCompiler、检索或全链路改变必须做跨题材、跨节点或纵向盲评。</p><h5>7. 反迎合</h5><p>AI候选和审查报告要区分：作者明确决定、强偏好、灵感、问题、事实、推断和未知。</p><p>不应因为作者提出一个想法就：</p><ul><li>把它升级为正史；</li><li>假称所有成员赞同；</li><li>隐藏代价和反例；</li><li>自动覆盖已有活动版本；</li><li>用礼貌措辞替代实质比较。</li></ul><h5>8. 停止条件</h5><p>出现以下任一情况时停止扩大新机制，并保留旧版本可切回：</p><ul><li>人物可辨识度或合理惊喜显著下降；</li><li>候选方案趋同且差异只剩措辞；</li><li>模板命中率上升但整体阅读质量下降；</li><li>检索内容挤占创作自由区；</li><li>审查建议导致正文反复机械重写；</li><li>作者完成一个节点的选择和确认成本明显上升。</li></ul><hr><h3>验收与工程证据合同</h3><blockquote>当前源文件：<code>.agents/skills/wenmi-longform-quality/references/evaluation-contract.md</code> · 指纹：<code>914ab8c9b827</code></blockquote><h4>验收与工程证据合同</h4><h5>1. 证据等级只描述结论可信度</h5><ul><li>E0：设计、Schema或代码存在，尚未证明运行。</li><li>E1：单元测试或确定性夹具通过。</li><li>E2：本地集成、迁移、恢复和界面流程通过。</li><li>E3：独立金标、对抗样本、真实模型多样本或盲评通过。</li><li>E4：真实长篇连续运行和纵向质量证据通过。</li></ul><p>E0—E4不是小说质量层级，不进入AI成员提示词，不限制候选方案，也不能把一章评成“E2质量”。任何质量声明必须写明适用范围、样本、基线和不确定性。</p><h5>2. 新工作流覆盖矩阵</h5><p>至少覆盖：</p><ol><li>开书信息创建与修改；</li><li>设定模块候选、作者编辑与确认；</li><li>分卷候选、差异比较、融合、版本和影响预览；</li><li>当前卷事件链新增、删除、重排和因果衔接；</li><li>当前事件大纲候选、软模板和作者原话；</li><li>当前事件完整章节序列与近期一至三章细纲；</li><li>单章正文冻结规划链、单写手生成和作者定稿；</li><li>事实、文学、体验审查对同一不可变正文独立取证；</li><li>章节、事件和卷结算只读取实际正文与正史；</li><li>下一卷引用上一卷真实结算而不是未实现计划。</li></ol><p>正式生产不再测试聊天推进、会话记忆、对话摘要或模式路由。独立灵感需要测试：跨书隔离；不能写正式对象；不能确认生产讨论；未摘录内容不进入ContextCompiler；作者摘录后只以目标对象的作者原话进入；删除讨论不影响正式源。</p><h5>3. 数据与版本测试</h5><ul><li>所有核心记录含 <code>owner_id</code>、<code>book_id</code>；</li><li>跨书、错书和越权查询被拒绝；</li><li>候选、活动版本和历史版本不可混淆；</li><li>上游版本变化使下游冻结对象失效或等待重核；</li><li>正文修改产生新不可变版本；</li><li>规划不进入正史，结算不把未实现计划当事实；</li><li>归档、恢复、取消、重试和晚到结果可重复执行；</li><li>迁移能在空库和升级库运行，已合并迁移不修改。</li></ul><h5>4. ContextCompiler与RAG测试</h5><ul><li>每种任务包均有确定性直接源和任务预算；</li><li>作者原话保留，强度和目标对象不丢失；</li><li>直接活动版本不被相似召回覆盖；</li><li>结构化、全文、向量、关系、时间/因果和原文回查可按需组合；</li><li>同义、否定、别名、时间、因果、关系和跨位置查询有独立用例；</li><li>检索包含纳入、排除、来源和冲突轨迹；</li><li>摘要错误时能够回查正式源；</li><li>禁用灵感检索后正式任务上下文仍完整；未摘录讨论的消融结果必须等价。</li></ul><h5>5. AI协作测试</h5><ul><li>独立候选使用独立ContextPack和真实ModelCall；</li><li>候选来源、模型、任务和版本可追溯；</li><li>同模型不会被标成异模型；</li><li>融合只读取已保存候选且不自动确认；</li><li>作者可部分采用、编辑、退回和撤回；</li><li>正式正文只有一个活动写手结果进入审查；</li><li>审查角色不会互相读取结果后伪装独立；</li><li>硬事实错误与文学/体验建议分开处理。</li></ul><h5>6. 创造性非劣效</h5><p>与旧流程或弱治理基线对比时，使用盲化、多样本和反顺序评估。按影响选择原创性、合理惊喜、人物可辨识度、情绪力度、因果自然度、检索锚定和整体阅读质量。</p><p>固定同义词、同源样本或连续五章只能证明有限运行，不能证明长篇质量。新卷—事件工作流要宣称跨卷稳定，至少需要跨事件、跨卷、不同位置与真实状态演化证据。</p><h5>7. 失败与恢复</h5><p>模拟：</p><ul><li>模型超时、5xx、格式错误和取消；</li><li>Worker崩溃、租约过期和重复领取；</li><li>上游版本在候选生成中改变；</li><li>部分候选成功、融合失败；</li><li>章节结算中断；</li><li>索引重建、向量投影缺失和原文回查失败；</li><li>桌面启动、数据库升级和端口占用。</li></ul><p>恢复不得重复计费、重复写入、接受晚到结果、产生半结算或静默覆盖作者内容。</p><h5>8. 报告格式</h5><p>报告按问题和工作流节点组织，不输出固定质量层级。每项结论标注：基线、样本、结果、证据等级、局限、停止条件和回滚方法。</p><hr><h3>卷—事件长篇故障模型</h3><blockquote>当前源文件：<code>.agents/skills/wenmi-longform-quality/references/longform-failure-model.md</code> · 指纹：<code>d7492e648067</code></blockquote><h4>卷—事件长篇故障模型</h4><h5>使用方法</h5><p>先确认可观察症状，再从真实版本、ContextPack、检索轨迹、调用记录、正文和结算寻找根因。一个症状可以有多个根因，不要用“换更强模型”跳过定位。</p><h5>F1 设定漂移</h5><ul><li>症状：能力、规则、身份或世界规律前后矛盾。</li><li>常见根因：活动设定版本错配、摘要冒充权威、原文未回查、作者新想法被误升格。</li></ul><h5>F2 卷方向漂移</h5><ul><li>症状：事件各自精彩但不服务本卷目标，卷末无法完成承诺。</li><li>常见根因：事件任务未引用活动卷纲、卷纲过度抽象、上游修订未使下游失效。</li></ul><h5>F3 事件失控</h5><ul><li>症状：事件跨越边界、吞并后续事件、因果断裂或无法自然引出下一事件。</li><li>常见根因：事件入口/结果/下一触发不清、检索注入无关灵感、模板取代本卷约束。</li></ul><h5>F4 章纲越级</h5><ul><li>症状：章纲新增重大设定、改写事件结果或提前完成卷高潮。</li><li>常见根因：章纲未绑定活动事件、一次冻结过多远期细纲、版本依赖缺失。</li></ul><h5>F5 正文机械化</h5><ul><li>症状：正文像大纲扩写、节拍生硬、对白和场景缺少生命。</li><li>常见根因：上下文塞入全量规划、模板硬化、自由区不足、审查清单进入写手提示词。</li></ul><h5>F6 人物漂移或扁平化</h5><ul><li>症状：声音趋同、动机突变、角色只执行剧情功能。</li><li>常见根因：缺少人物声音原文和状态因果、静态标签过强、审校反复统一文风。</li></ul><h5>F7 检索错锚</h5><ul><li>症状：召回相似但错误的实体、时间、卷或版本。</li><li>常见根因：仅依赖向量相似度、未做书籍/版本过滤、别名和时间关系缺失。</li></ul><h5>F8 上下文膨胀</h5><ul><li>症状：模型忽略关键约束、复述资料、候选同质、费用和延迟上升。</li><li>常见根因：岗位固定全量包、聊天历史累积、多个规划层全文重复、无排除理由和预算。</li></ul><h5>F9 作者原话丢失</h5><ul><li>症状：AI只看到摘要，作者意图被改写或灵感被硬化。</li><li>常见根因：对话摘要替代对象化原话、强度未标注、来源对象不明确。</li></ul><h5>F10 候选伪独立</h5><ul><li>症状：多份方案几乎相同，或同模型被展示成异模型共识。</li><li>常见根因：共用同一生成结果、候选互读、共享随机种子/模板过强、来源显示失真。</li></ul><h5>F11 融合平均化</h5><ul><li>症状：融合稿消除各方案亮点，只剩无风险折中。</li><li>常见根因：自动投票、无作者选择范围、融合者未记录采用/舍弃理由。</li></ul><h5>F12 审查越权</h5><ul><li>症状：文学或体验意见被当成事实错误，AI自动重写作者已认可内容。</li><li>常见根因：审查职责混淆、报告进入写手循环、软建议升级为阻塞门禁。</li></ul><h5>F13 结算污染</h5><ul><li>症状：资料库或下一卷记住了正文未发生的计划。</li><li>常见根因：从卷纲/事件大纲直接提取正史、章节未定稿就结算、计划—实际未分层。</li></ul><h5>F14 版本错配</h5><ul><li>症状：正文引用过期卷纲、事件或章纲，修改后下游仍可提交。</li><li>常见根因：活动指针、哈希或修订号未冻结，影响预览与失效链缺失。</li></ul><h5>F15 重试与晚到污染</h5><ul><li>症状：重复候选、重复计费、取消后结果仍被采用、半结算。</li><li>常见根因：幂等键、租约、取消栅栏、检查点和事务边界缺失。</li></ul><h5>F16 长期遗忘</h5><ul><li>症状：跨事件或跨卷的承诺、关系和规则无法回收。</li><li>常见根因：只保留最近固定章数、摘要无来源、没有事件/卷结算和按需原文回查。</li></ul><h5>F17 工作流与界面脱节</h5><ul><li>症状：按钮制造假进度、页面仍要求聊天、作者不知道当前对象和下一步。</li><li>常见根因：前端状态机未绑定真实任务、旧入口未退役、对象层级和状态名不一致。</li></ul><h5>F18 遗留聊天依赖</h5><ul><li>症状：新流程删除聊天页后，规划、附件、点名、检索或恢复失效。</li><li>常见根因：业务意图和附件只存消息表、任务依赖会话ID、对话摘要被当作唯一上下文。</li></ul><h5>F19 质量治理反噬</h5><ul><li>症状：审查分数更高但故事更平、人物更像、作者选择成本更大。</li><li>常见根因：把质量维度硬编码进提示词、固定岗位上下文、门禁过密、局部指标替代整体阅读。</li></ul><h5>停止原则</h5><p>出现跨书、正史污染、不可恢复覆盖、版本错配或结算污染时立即停止正式提交。出现创作质量显著非劣效失败时停止扩大机制，保留候选与证据，回滚提示词、检索或门禁配置而不删除作者数据。</p><hr><h3>卷—事件生产闭环与运行质量</h3><blockquote>当前源文件：<code>.agents/skills/wenmi-longform-quality/references/runtime-quality-loops.md</code> · 指纹：<code>f8070072defb</code></blockquote><h4>卷—事件生产闭环与运行质量</h4><h5>1. 规划节点通用闭环</h5><p>设定、卷纲、事件链、事件大纲和章纲统一使用对象化闭环：</p><ol><li>作者在当前对象旁输入原话、附件和偏好强度；</li><li>系统冻结目标对象、活动上游版本和工作流版本；</li><li>ContextCompiler为配置中的AI成员分别准备任务包；</li><li>成员直接提交独立候选，不通过灵感推进；</li><li>页面比较候选的共同点、差异、代价、未知和来源；</li><li>作者选择整份、按部分融合、直接编辑、退回或暂不处理；</li><li>融合者只在作者明确选择后整合，不自动投票或确认；</li><li>作者最终确认，生成新的不可变活动版本；</li><li>系统计算下游影响并使错版候选失效或等待重核。</li></ol><p>岗位数量和名称由当前产品配置决定；闭环只要求候选来源真实、版本可追溯和作者可裁决。</p><h5>2. 当前卷闭环</h5><p>输入以开书、活动设定、上一卷真实结算、当前状态、本卷作者原话和卷级软模板为主。</p><p>卷纲确认后建立事件链。卷纲只负责本卷目标、核心冲突、主要因果、人物变化、高潮、卷末状态和下一卷接口；不预写每章，不把模板节拍硬化。</p><h5>3. 当前事件闭环</h5><p>事件链先确定事件职责、顺序和衔接。选择当前事件后，候选必须引用活动卷纲、事件入口、预期结果、上一事件真实结算和下一事件触发。</p><p>事件大纲确认后生成完整章节序列，并仅详细冻结最近一至三章。事件尚未结算时，下一个事件可以规划但不能把未发生结果当作事实。</p><h5>4. 单章正文闭环</h5><ol><li>冻结活动卷纲、事件、事件章节链和当前章纲版本；</li><li>编译直接权威源、相关检索证据、作者意见和创作自由区；</li><li>一个活动写手生成完整草稿；</li><li>做确定性硬检查：结构、空输出、越权、来源、版本、明显事实边界；</li><li>按当前产品配置启动相互独立的事实、文学和体验审查；</li><li>事实问题引用来源，文学和体验意见保留为建议；</li><li>作者直接修改、要求定点重写或接受草稿；</li><li>作者定稿后生成新的不可变正文版本；</li><li>在事务中完成章节结算，再允许下一章正式生成。</li></ol><p>不要默认让两个写手串行整稿；不要批量正式写章；不要因审查建议自动无限重写。</p><h5>5. 章节结算</h5><p>章节结算只读取作者确认正文和既有正史，产生：</p><ul><li>本章实际发生的关键因果；</li><li>人物、关系、地点、道具、规则与势力状态变化；</li><li>新增、推进、回收或作废的开放线索；</li><li>可定位到正文版本和片段的来源；</li><li>与章纲的差异及对后续规划的影响。</li></ul><p>结算、正史更新、活动指针推进和下一章解锁必须位于同一Repository事务或具备可证明的原子补偿。</p><h5>6. 事件结算</h5><p>当前事件全部章节定稿并完成章节结算后：</p><ul><li>聚合实际事件入口、关键行动、结果、代价和下一触发；</li><li>对照事件大纲，标注已实现、调整实现、未实现和新增结果；</li><li>更新角色状态、开放线索和相关正史来源；</li><li>生成不可变事件结算；</li><li>以实际结果编译下一事件，而不是照抄原计划。</li></ul><h5>7. 卷结算</h5><p>当前卷全部事件结算后：</p><ul><li>聚合卷内实际主线、人物变化、势力状态、重要收益与代价；</li><li>汇总仍开放的大线索和下一卷入口；</li><li>将卷纲仅作为计划—实际差异来源；</li><li>生成不可变卷结算；</li><li>下一卷必须冻结上一卷确认版本和真实卷结算。</li></ul><h5>8. 任务状态与恢复</h5><p>任务状态由持久化任务、模型调用、工具事件和心跳驱动。至少支持准备、运行、完成、失败、超时、取消、重试等待和失效。</p><p>运行规则：</p><ul><li>幂等键覆盖作者重复点击；</li><li>租约和心跳防止重复领取；</li><li>检查点保存已完成候选，后续失败不重复调用；</li><li>取消栅栏拒绝晚到结果；</li><li>上游版本变化使任务失效；</li><li>技术重试有界，不自动重复计费；</li><li>格式修复不得改变创意内容；</li><li>所有写入经Repository完成。</li></ul><h5>9. 可观测性</h5><p>记录任务类型、目标对象、活动版本、ContextPack、成员与模型快照、调用耗时、预算、检索轨迹、候选版本、作者选择、失败原因、重试和结算事务。</p><p>不保存模型内部思维链，不以动画或本地计时器伪造AI工作状态。</p><h5>10. 正式生产与灵感边界</h5><p>正式闭环不通过聊天消息推进、不读取会话摘要、不依赖会话ID。独立灵感必须使用隔离记录和只读正式资料检索，不能获得正式对象写入能力；未摘录讨论不得进入ContextCompiler。作者摘录时必须选择目标对象和强度，保存原文、讨论来源和目标绑定，再由正常作者输入规则处理。</p><p>旧对话式生产兼容记录按当前数据保留政策归档；先停止生产路由和运行时读取，再删除无引用装配。不要把“隔离讨论”扩大为删除版权、安全、来源、审计或恢复机制。</p><hr><h3>当前工作流、界面与项目精简</h3><blockquote>当前源文件：<code>.agents/skills/wenmi-longform-quality/references/workflow-and-simplification.md</code> · 指纹：<code>f179540f512c</code></blockquote><h4>当前工作流、界面与项目精简</h4><h5>1. 作者主流程</h5><p>创作台只围绕当前书显示六个主步骤：</p><ol><li>开书信息；</li><li>设定；</li><li>当前卷；</li><li>规划；</li><li>章纲设计；</li><li>正文创作。</li></ol><p>事件结算、卷结算和下一卷规划是对象状态推进；图谱、资料库和取名是当前书内辅助工具。作者在对应对象旁输入想法，AI成员提交方案卡片，作者比较、选择、融合、修改和确认。</p><h5>2. 页面共同交互</h5><p>每个规划页面至少显示：</p><ul><li>当前对象及其上游归属；</li><li>当前活动版本和确认状态；</li><li>作者原话、附件和意图强度；</li><li>可选的大白话模板说明；</li><li>真实任务状态与AI候选来源；</li><li>候选差异、未知、代价和影响；</li><li>选择整份、按部分融合、直接编辑、定点重写和确认；</li><li>上游变更后的下游影响预览；</li><li>下一步唯一主操作。</li></ul><p>前端不展示内部提示词、JSON键、技术状态名、相似度阈值或抽象叙事术语。模板用大白话说明“怎样推进、适合什么、可能有什么风险、放进本书会怎样”。</p><h5>3. 动态规划界面</h5><h6>当前卷</h6><p>以任务阶段、人物变化和因果板展示，不强制固定章数。卷级模板只是软起点，可不用、自定义、混合和重排。</p><h6>规划</h6><p>先显示卷内事件时间轴或列表，再进入当前事件详情。事件卡突出目标、入口、结果、对应卷任务和与前后事件的因果连接。事件级模板与卷级模板分开，不能把专业模板名称直接作为作者界面标题。</p><h6>章纲设计</h6><p>显示当前事件完整章节序列，只把近期一至三章提升为可直接写作的详细章纲。上章未结算或上游版本改变时，后续详细章纲必须等待重核，不能静默成为正式写作依据。</p><h6>正文创作</h6><p>正文是主区域，事实、文学和体验三份报告是辅助侧栏。作者可以定位修改、保留满意部分、要求定点重写或直接定稿，不被强迫接受软建议。</p><h5>4. AI成员介入</h5><p>Skill不固定团队人数和名称。界面按当前产品配置展示本节点实际参与者：</p><ul><li>规划节点：独立候选成员、融合成员和作者；</li><li>正文节点：活动写手、独立审查成员和作者；</li><li>数据准备：显示为系统准备、编译和检索过程，不虚构成额外创作意见。</li></ul><p>成员状态必须来自真实任务、模型调用、工具事件和检查点；等待上游时显示等待，不显示假进度。同一模型承担多个岗位时必须如实显示共同模型来源。</p><h5>5. 项目精简规则</h5><p>当前仓库只保留能服务以下范围的代码与文档：当前对象化工作流、已有作品导入与续写、图谱、资料库、取名、上下文编译、混合检索、AI任务、三级审查、三级结算、安全、恢复、测试和桌面运行。</p><p>每次精简必须同时检查：</p><ul><li>当前路由、类型、任务、Worker、恢复和迁移是否引用；</li><li>已有书籍读取、来源、安全、调用审计、附件或恢复是否需要；</li><li>是否存在更清晰的唯一入口；</li><li>删除后能否通过Git和向前迁移恢复；</li><li>静态可达性、类型、测试、构建和本地运行是否通过。</li></ul><p>不可变正文、作者原件、已合并迁移和作者数据不作为“无用文件”清理。投影、缓存和生成页面必须能从当前权威源重建。</p><h5>6. 当前文档中心</h5><p>桌面文档中心只读取显式白名单中的当前产品、流程、架构、上下文、质量、验收和Codex规则，以及本Skill的Markdown正文。一次性报告、发布证据、临时计划、二进制元数据和未被当前流程引用的文件不进入中心。</p><p>卡片必须能在同一页面展开完整正文，显示源路径、内容指纹和生成时间。打开桌面入口、执行开发结算、提交或合并代码时自动重新生成；检查失败则不得完成开发结算。</p><h5>7. 验收</h5><ul><li>从开书到下一卷只通过明确业务对象推进；</li><li>每个节点作者都能输入原话并看到真实候选；</li><li>卷、事件、章纲和正文版本依赖正确；</li><li>AI状态与真实任务一致；</li><li>上游修订有影响预览和失效链；</li><li>上下文包不缺关键作者意图，也不读取其他书；</li><li>已有书籍可读、迁移可升级、恢复不丢数据；</li><li>前端没有死路由或空白占位；</li><li>文档中心全文可读、自动更新且只显示白名单内容；</li><li>精简前后创造性和整体输出质量不显著下降。</li></ul><hr><h3>文秘写作长篇质量审查</h3><blockquote>当前源文件：<code>.agents/skills/wenmi-longform-quality/SKILL.md</code> · 指纹：<code>7b049e5b6c27</code></blockquote><hr><p>name: wenmi-longform-quality description: 审查和设计文秘写作按开书、设定、卷纲、事件链、事件大纲、章纲、单章正文、事件结算与卷结算推进的长篇小说质量、任务上下文、混合检索、AI协作、项目精简和验收机制；用于重要流程、RAG、规划粒度、Agent职责、生成审校、人物漂移、剧情失控、检索错误、文风同质、重复、迎合或跨章质量下降。普通事实问答、纯文案修改、低风险样式调整和明确机械修复不使用。</p><hr><h4>文秘写作长篇质量审查</h4><h5>目标</h5><p>在不压缩AI合理创作空间的前提下，降低长篇创作的事实漂移、层级越权、错误检索、版本错配、结算失真和不可恢复失败。</p><p>本Skill是开发设计与验收工具，不是小说创作岗位的上级提示词。不要把本Skill全文、检查表、证据等级或评分维度注入AI成员上下文。</p><h5>当前工作流基线</h5><p>按以下正式生产对象链审查，不使用聊天推进、对话记忆或抽象创作模式分流：</p><p><code>开书信息 → 设定 → 分卷 → 当前卷事件链 → 当前事件大纲 → 当前事件章纲 → 单章正文 → 章节结算 → 事件结算 → 卷结算 → 下一卷</code></p><p>每个规划节点允许作者输入原话，AI成员直接提交可比较方案，作者选择、融合、编辑或退回；只有作者确认的版本才能成为下游活动版本。</p><p>独立灵感可以作为生产流程之外的辅助域存在，但它不能生成、确认或修改正式对象，也不能成为生产记忆或检索源。只有作者主动摘录、选择强度并绑定具体业务对象的片段，才能以作者原话进入上述对象链。</p><h5>不得做的事</h5><ul><li>不建立面向创作成员的“质量层级”或分层报告门禁。</li><li>不固定团队人数、岗位名称、模型供应商或永久上下文字段；这些由当前产品规格和任务类型决定。</li><li>不定义开放讨论、创意推演、试写、正式生产等创作模式，也不要求模式路由。</li><li>不把聊天记录或对话摘要当作长期事实源；灵感默认隔离，作者主动摘录的原话必须附着到明确的书、设定、卷、事件、章纲或正文任务对象。</li><li>不把卷级或事件级叙事模板变成硬公式，不固定爽点、反转、打脸、节拍或章数。</li><li>不以向量库、多Agent、长上下文、更强模型或更高审校分数代替根因分析。</li><li>不以一致性提升抵消原创性、合理惊喜、人物可辨识度、情绪力度或整体阅读质量下降。</li></ul><h5>审查顺序</h5><h6>1. 确认任务边界</h6><p>记录当前任务对应的工作流节点、目标对象、活动版本、作者原话、硬事实、软偏好、未知项和下游影响。</p><p>若是重大设计，建立唯一 <code>design_review_id</code>，按 <code>docs/DESIGN_GOVERNANCE_AUDIT.md</code> 记录Skill快照、替代方案、两轮审查、证据等级、停止条件和回滚方法。</p><h6>2. 建立故障链</h6><p>对每个重要问题建立：</p><p><code>痛点 → 可观察症状 → 根因假设 → 机制 → 反例 → 指标 → 证据 → 停止条件</code></p><p>先从真实代码、数据、ContextPack、检索轨迹、模型调用和版本依赖建立基线；证据不足时标注未知，不补造结论。</p><h6>3. 检查规划对象链</h6><p>确认：</p><ul><li>卷纲只约束当前卷的目标、主要因果、人物变化、高潮与卷末接口；</li><li>事件链说明事件职责、次序和因果衔接；</li><li>事件大纲细化当前事件，不跨越活动卷纲；</li><li>章纲引用活动事件，只冻结当前事件的完整章节序列和近期一至三章细纲；</li><li>正文任务冻结卷纲、事件和章纲版本，同时保留对白、动作、意象、局部调度和自然因果实现的自由区；</li><li>事件结算与卷结算只从作者确认的正文和正史生成，规划只能用于差异对照。</li></ul><p>上游版本变化时，必须显示影响并使相关下游候选失效或等待重核，禁止静默改写。</p><h6>4. 编译任务型上下文</h6><p>不要审核“某岗位永远收到哪些字段”，而要审核“当前任务需要哪一组完整上游约束和补充证据”。最小充分只用于排除其他书籍、未摘录灵感和当前任务无关材料，不能用来裁掉作者已经填写的开书字段、作者原话、活动设定或上层规划因果。</p><p>ContextCompiler至少按任务区分：设定候选、卷纲候选、事件链、事件大纲、章纲、正文、事实审查、文学审查、体验审查、章节结算、事件结算、卷结算和下一卷规划。</p><p>上下文选择遵守：</p><ol><li>开书和设定直接接收完整开书活动版本；卷纲及后续使用覆盖全部开书字段、可回查原文的结构化 <code>BookCorePack</code>；</li><li>卷、事件链、事件大纲、章纲、正文、三类审查、三级结算和下一卷逐层接收压缩但完整覆盖的上游约束，并接收当前目标对象的完整信息；</li><li>事实、文学和体验审查绑定同一不可变正文与完整当前章纲，但按职责分离附加资料，且不读取彼此报告；</li><li>章节、事件和卷结算只把作者确认正文及既有正史作为事实源，规划只用于“计划—实际”对照；下一卷必须以真实卷结算为起点；</li><li>直接活动版本优先于检索结果；</li><li>作者原话原样保留并标注强度；</li><li>摘要只导航，事实回查正式源；</li><li>只检索与当前任务、实体、时间和因果相关的内容；</li><li>记录纳入、排除、裁剪和来源理由；</li><li>软偏好与模板不得伪装成事实或硬规则；</li><li>留出明确创作预算，避免上下文把正文压成资料复述。</li></ol><p>详细任务矩阵见 <code>references/context-and-rag.md</code>。</p><h6>5. 审查AI协作与作者裁决</h6><p>AI成员的数量、名称和分工可以随产品规格变化。Skill只检查这些结果性条件：</p><ul><li>配置为独立提案的成员必须拥有独立ContextPack和真实调用记录；</li><li>同一模型不得冒充异模型独立意见；</li><li>融合者只能读取已保存候选，并明确说明采用、调整或舍弃了什么；</li><li>作者能够比较、局部融合、直接编辑、退回和最终确认；</li><li>未被作者确认的候选不得进入活动规划或正史；</li><li>一个正式正文版本只由一个活动写手负责，除非作者明确选择接管或定点重写；</li><li>审查意见不得自动重写正文或把软建议升级为硬错误。</li></ul><h6>6. 审查混合检索</h6><p>检索必须以工作流节点、对象身份和版本依赖为路由条件，按需组合：</p><ul><li>结构化精确查询；</li><li>全文检索；</li><li>向量语义召回；</li><li>关系扩展；</li><li>时间与因果邻域；</li><li>正史原文和不可变正文回查。</li></ul><p>禁止用单一相似度阈值决定全部召回。检索结果必须经过书籍隔离、版本有效性、来源权威、时间一致性、冲突检测、去重和预算裁剪。</p><h6>7. 保护创造性和人物生命力</h6><p>把约束分为三类：</p><ul><li>硬底线：作者确认事实、活动版本、数据隔离、安全、版权来源、费用和不可逆操作；</li><li>任务约束：当前卷、事件、章纲明确要求；</li><li>软参考：模板、节拍建议、作者灵感、风格倾向和审查建议。</li></ul><p>只有前两类能够阻止正式提交。软参考可以被AI有理由地偏离；重大且有价值的偏离应形成影响预览交由作者选择。</p><p>质量指标用于离线验收和故障诊断，不应作为正文逐项打分提示。详见 <code>references/creativity-and-output-quality.md</code>。</p><h6>8. 审查结算与恢复</h6><p>每章、每事件、每卷都要区分“计划发生什么”和“实际发生了什么”。结算只聚合已确认正文、正史变更、角色状态、开放线索、因果结果和来源。</p><p>检查幂等键、租约、取消栅栏、检查点、晚到结果隔离、原子事务、不可变版本和恢复入口。Worker不得直接修改正式正文或核心正史。</p><h6>9. 做两轮审查</h6><p>第一轮检查可靠性：事实、版本、隔离、来源、检索锚定、任务状态、失败恢复和可观测性。</p><p>第二轮检查非劣效：上下文是否膨胀、模板是否公式化、人物是否变平、方案是否同质、AI是否迎合、作者决策成本是否增加、整体阅读质量是否下降。</p><h5>输出要求</h5><p>输出应直接服务当前决定，不固定“质量分层报告”。至少给出：</p><ol><li>已确认事实、作者决定、推断和未知项；</li><li>与当前工作流节点对应的问题和根因；</li><li>推荐机制及被否决替代方案；</li><li>对创造性、人物、检索、版本和恢复的影响；</li><li>可执行验收、证据等级、停止条件和回滚方法。</li></ol><p>无问题时可以给出简短结论，不为凑格式制造风险。</p><h5>参考路由</h5><ul><li>检索、ContextCompiler、工作流任务包：<code>references/context-and-rag.md</code></li><li>创造性、人物与输出非劣效：<code>references/creativity-and-output-quality.md</code></li><li>证据等级、测试和验收：<code>references/evaluation-contract.md</code></li><li>长篇故障分类与根因：<code>references/longform-failure-model.md</code></li><li>单章到卷结算与恢复：<code>references/runtime-quality-loops.md</code></li><li>新工作流、界面和项目精简：<code>references/workflow-and-simplification.md</code></li></ul><h5>验证</h5><p>修改本Skill后运行Skill Creator提供的 <code>quick_validate.py</code>，并执行：</p><p><code>node .agents/skills/wenmi-longform-quality/scripts/validate-audit.mjs &lt;audit-file&gt;</code></p><p>若验证失败、参考文件与主文件冲突、或Skill开始反向固定产品岗位与创作模式，停止发布并回滚本次Skill变更。</p></template><template id="document-1" data-title="卷—事件工作流的上下文与混合检索" data-path=".agents/skills/wenmi-longform-quality/references/context-and-rag.md" data-meta="长篇质量 Skill · 16.0 KB · 4d2ff5591b05"><h1>卷—事件工作流的上下文与混合检索</h1><h2>1. 原则</h2><p>上下文由确定性的 <code>ContextCompiler</code> 按任务编译，不由某个拟人岗位垄断数据库，也不依赖聊天记忆。</p><p>每个ContextPack都要记录：<code>owner_id</code>、<code>book_id</code>、任务类型、目标对象、活动版本、作者原话、直接权威源、检索查询、纳入/排除理由、裁剪结果、预算、来源指纹和编译版本。</p><p>直接活动版本是规划任务的首要输入；检索用于补充相关事实、历史因果、人物状态、开放线索和声音证据，不能覆盖直接权威源。</p><h2>2. 数据权威</h2><p>按用途区分：</p><ol><li>作者确认的开书信息、设定和正史事实；</li><li>已确认正文不可变版本；</li><li>分卷、事件和章纲的活动规划版本；</li><li>章节、事件与卷结算；</li><li>带来源的作者原话与附件；</li><li>可重建摘要、Wiki、向量、关系和分析投影；</li><li>AI候选、审查报告和失败任务记录。</li></ol><p>规划描述未来，不是已经发生的事实。摘要、Wiki、向量和图谱都是导航或派生层，不得反向成为正史。</p><p>正式生产不建立聊天历史、会话摘要或对话记忆源。独立灵感保存在隔离域，默认不是生产上下文或事实源；只有作者主动摘录并绑定具体业务对象的片段，才转为带讨论来源的作者原话。任务过程保存为候选、决定、调用与检查点，而不是可无限累积的对话。</p><h2>3. 完整输入与无损压缩</h2><p>“压缩”不是只保留几句摘要，而是把上游全部有效字段编译成更短的结构化约束包。信息可以换成紧凑表达，覆盖范围不能缩水。</p><p>开书信息较短，开书与设定任务直接接收完整活动版本。卷纲及后续任务使用 <code>BookCorePack</code>，它必须覆盖开书活动版本中的全部作者字段：书名、定位/卖点、题材与标签、目标读者、预计规模、节奏/风格选择、主角及其他初始角色、身份、性格、目标、核心机制/金手指、开篇场景、作者自定义内容、必须项、强偏好、灵感、问题和附件引用。没有填写的字段保留为空，不由AI猜测补齐。</p><p>其他上游信息分别编译为：</p><ul><li><code>SettingConstraintPack</code>：活动设定中的世界、人物、力量/规则、势力、地点、物品和明确禁区；</li><li><code>VolumeConstraintPack</code>：活动卷纲的卷目标、卷首状态、核心冲突、主要因果、人物变化、高潮、卷末状态、下一卷接口、节奏选择和作者原话；</li><li><code>EventChainPack</code>：本卷全部事件的次序、职责、入口、结果、前后触发和当前事件位置；</li><li><code>CurrentEventPack</code>：当前事件卡、活动事件大纲、进入状态、行动链、结果/代价、章节范围估计和下一触发；</li><li><code>CurrentChapterOutlineFull</code>：当前章纲全部字段，不做摘要替代。</li><li><code>CurrentManuscriptFull</code>：三类审查共同绑定的同一份不可变当前正文全文；</li><li><code>ChapterSettlementPack</code>、<code>EventSettlementPack</code>、<code>VolumeSettlementPack</code>：分别记录已经实际发生的章、事件和卷结果，均带正文/正史来源，不把计划内容写成事实。</li></ul><p>无损压缩必须满足：</p><ol><li>所有作者已填字段都有对应字段或显式引用，不能因“看起来不重要”而删除；</li><li>作者原话、<code>must</code>、强偏好和问题保留原文，不能只保留AI改写摘要；</li><li>活动上游目标、硬设定、关键人物、核心机制和因果接口不得省略；</li><li>每个压缩项携带来源对象、版本、字段或片段引用，遇到歧义可回查完整原文；</li><li>硬约束、软节奏/模板和灵感分栏，避免软信息被误当事实；</li><li>上游版本改变后重新编译，旧压缩包随冻结任务失效；</li><li>超预算时先去重、缩短措辞和移除与当前任务无关的正文证据，不删除上游核心字段。</li></ol><h2>4. 任务上下文矩阵</h2><h3>开书信息</h3><ul><li>接收：作者填写的全部开书字段、自定义内容、附件、导入内容和显式偏好，不做摘要替代。</li><li>检索：新书默认不检索；导入旧稿时只检索导入范围。</li><li>排除：其他书籍、聊天/历史会话、未确认AI猜测和任何未由作者填写的补造信息。</li></ul><h3>设定候选</h3><ul><li>接收：完整开书活动版本、当前设定模块、作者针对该模块的全部自定义原话与附件；后续设定模块额外接收已经确认且与本模块存在直接依赖的设定。</li><li>推演目标：只基于开书方向和作者自定义信息提出当前设定方案；需要新增但没有依据的内容明确标成候选，等待作者确认。</li><li>检索：只做当前书内的开书字段、已确认设定依赖和附件来源精确回查。</li><li>排除：其他书籍、聊天/会话记忆、卷纲、事件、章纲、正文、无关设定模块、未确认AI猜测和外部随机灵感。</li></ul><h3>分卷候选</h3><ul><li>接收：覆盖全部开书字段的 <code>BookCorePack</code>、<code>SettingConstraintPack</code>、全书长期承诺或主线骨架、作者选择的卷节奏/卷级软模板、本卷全部自定义原话；后续卷还接收上一卷真实结算和当前人物/势力状态。</li><li>推演目标：在开书定位、题材标签、主角与核心机制、活动设定和作者节奏选择下，规划当前卷目标、主要因果、人物变化、高潮和卷末接口。</li><li>检索：未回收大线索、相关人物与规则、上卷实际因果结果和必要正文锚点。</li><li>排除：其他书籍、聊天、上一卷未实现计划、全书正文、事件级模板库全集和与本卷无关的细节。</li></ul><h3>当前卷事件链</h3><ul><li>接收：<code>BookCorePack</code>中的定位、题材标签、主角和核心机制，<code>SettingConstraintPack</code>，完整 <code>VolumeConstraintPack</code>，作者对事件链的全部自定义原话和事件级软模板选择。</li><li>推演目标：沿卷纲的总目标和主要因果向下拆出小事件；每个事件都要说明对卷目标的职责、进入状态、结果和下一触发。</li><li>检索：只补充与卷目标直接相关的开放线索、角色/势力当前状态和重大历史因果。</li><li>排除：其他书籍、聊天、无关旧事件、全文正文、固定章数公式和未在卷纲内取得依据的跨卷扩张。</li></ul><h3>当前事件大纲候选</h3><ul><li>接收：<code>BookCorePack</code>、<code>SettingConstraintPack</code>、完整 <code>VolumeConstraintPack</code>、完整 <code>EventChainPack</code>、当前事件卡全部字段、上一事件真实结算或卷首状态、作者对当前事件的全部自定义原话和事件级软模板。</li><li>推演目标：在卷纲和事件链的双重约束下推演单个事件的起点、行动升级、转折、结果、代价和下一触发；不得把后续事件职责提前吞并。</li><li>检索：当前事件相关人物、地点、规则、道具、开放线索、历史因果和必要原文。</li><li>排除：其他书籍、聊天、全卷正文、其他事件的完整大纲、无关资料和与事件链冲突的无依据扩写。</li></ul><h3>当前事件章纲</h3><ul><li>接收：<code>BookCorePack</code>、<code>SettingConstraintPack</code>、完整 <code>VolumeConstraintPack</code>、完整 <code>EventChainPack</code>、完整 <code>CurrentEventPack</code>、上一事件/章节真实结算和作者对章链或单章的全部原话。</li><li>推演目标：先评估当前事件需要的总字数和章节数，再拆出完整章节序列；每章至少确定章节职责、主要场景、关键行动/信息、情绪变化、与前后章衔接、结尾状态和预计字数。</li><li>检索：当前事件和本章相关事实、角色状态、开放线索、前文因果与场景原文锚点。</li><li>排除：其他书籍、聊天、无关卷/事件、全部人物卡和与当前事件无关的正文。</li><li>冻结：完整事件章节序列全部保留，但只把近期一至三章提升为可供正文使用的详细冻结章纲；后续章信息继续作为可调整的事件内规划。</li></ul><h3>单章正文</h3><ul><li>接收：<code>BookCorePack</code>、<code>SettingConstraintPack</code>、压缩但完整覆盖的 <code>VolumeConstraintPack</code>、<code>EventChainPack</code>和 <code>CurrentEventPack</code>，以及当前章的完整 <code>CurrentChapterOutlineFull</code>；同时接收前章结尾及必要全文、当前正史状态、相关事实与开放线索、表达基线、作者修改意见和明确创作自由区。</li><li>创作目标：在卷目标、事件职责、当前事件大纲和本章完整章纲的层层约束下写出正文；约束方向与结果，不把压缩包逐句扩写成说明文。</li><li>检索：本章实体、规则、因果、时间、声音与相似场景证据；必要时回查原文。</li><li>排除：其他书籍、聊天、全书正文、整套模板原文、其他事件完整大纲、其他章节完整章纲和无关审查报告。</li></ul><h3>事实审查</h3><ul><li>接收：<code>BookCorePack</code>中的硬边界、<code>SettingConstraintPack</code>、<code>VolumeConstraintPack</code>、<code>EventChainPack</code>、完整 <code>CurrentEventPack</code>、完整 <code>CurrentChapterOutlineFull</code>、同一 <code>CurrentManuscriptFull</code>、前章完整正文或必要原文、上一章/事件真实结算、当前正史、时间线、角色/关系/物品/能力/地点状态和开放线索。</li><li>目标：核对正文是否违反开书硬边界、设定、卷/事件/章纲已确认约束和已经发生的事实；只报告可验证矛盾、来源缺失、时间/状态错误、战力/能力越界、知情错误、伏笔状态错误和版本错配，并引用具体来源。</li><li>检索：正文中实际出现的实体、行为、规则、时间、地点、道具、能力、知情和开放线索；冲突时回查正式设定、正文和结算原文。</li><li>排除：其他书籍、聊天、文学/体验审查报告、未确认AI候选、无关正文、纯审美偏好和固定节拍评分；有意留白、人物说谎和开放谜团不能在没有事实证据时判错。</li></ul><h3>文学审查</h3><ul><li>接收：<code>BookCorePack</code>中的题材、目标读者和作者表达偏好，压缩的<code>VolumeConstraintPack</code>、<code>EventChainPack</code>和<code>CurrentEventPack</code>，完整 <code>CurrentChapterOutlineFull</code>、同一 <code>CurrentManuscriptFull</code>、前章或近期必要正文、当前出场人物的声音/关系/情绪证据和作者本章意见。</li><li>目标：判断正文是否把章纲写成有生命的场景，重点检查人物声音、动机呈现、对白、场景感、情绪推进、叙事清晰度、重复、解释过度、模板腔和不自然的段落；提出定点建议，不改写事实和规划。</li><li>检索：当前人物的代表性说话/行为原文、近期同类场景和本事件情绪进度；只取能帮助文学判断的证据。</li><li>排除：其他书籍、聊天、事实/体验审查报告、全量正史包、无关设定、固定文风/节拍评分表和把所有章节统一成同一语气的规则。</li></ul><h3>体验审查</h3><ul><li>接收：<code>BookCorePack</code>中的一句话卖点、题材标签和目标读者，压缩的<code>VolumeConstraintPack</code>、完整 <code>EventChainPack</code>中的当前事件位置、<code>CurrentEventPack</code>、完整 <code>CurrentChapterOutlineFull</code>、同一 <code>CurrentManuscriptFull</code>、必要前章、当前事件截至本章的阅读进度和作者希望读者获得的感受。</li><li>目标：以目标读者视角判断是否看得懂、是否愿意继续、期待是否建立或兑现、节奏是否拖沓/仓促、情绪是否到位、主角行为是否令人信服、结尾是否自然产生下一章兴趣；输出主观体验，不冒充事实裁决。</li><li>检索：必要前章、当前事件已定稿章节的体验锚点和题材承诺，不无差别检索全书。</li><li>排除：其他书籍、聊天、事实/文学审查报告、全量设定证据、固定爽点/反转/打脸次数和把个人偏好包装成普遍读者结论。</li></ul><h3>章节结算</h3><ul><li>接收：作者定稿的当前章不可变正文全文、正文版本、完整当前章纲、前一章结算、既有正史、当前人物/关系/物品/能力/地点状态和相关开放线索；压缩卷/事件规划只用于差异对照。</li><li>输出：本章实际发生的行动与因果、人物/关系/资源/能力/地点/知情变化、新增/推进/回收/作废线索、正文来源、与章纲差异及对后续章纲的影响。</li><li>排除：其他书籍、聊天、未定稿正文、AI草稿/审查候选、未在正文出现的章纲内容和无来源推断。</li></ul><h3>事件结算</h3><ul><li>接收：当前事件全部已确认 <code>ChapterSettlementPack</code>、必要的定稿正文原文、事件开始时的正史状态、完整 <code>CurrentEventPack</code>、<code>EventChainPack</code>和 <code>VolumeConstraintPack</code>；规划只用于计划—实际对照。</li><li>输出：事件实际入口、关键行动链、结果、代价、角色/关系/资源变化、开放/回收线索、下一事件真实触发、未实现/调整实现/新增结果及对剩余事件链和卷纲的影响。</li><li>排除：其他书籍、聊天、未定稿章节、AI候选、计划中未写出的事实和其他事件无关正文。</li></ul><h3>卷结算</h3><ul><li>接收：本卷全部已确认 <code>EventSettlementPack</code>、必要的章节/正文原文回查、卷首正史状态、完整 <code>VolumeConstraintPack</code>和 <code>EventChainPack</code>；活动卷纲只用于计划—实际对照。</li><li>输出：本卷实际主线与因果、人物/关系/势力/资源最终状态、重要收益与代价、已兑现/未兑现承诺、开放线索、下一卷真实入口、卷纲差异和来源。</li><li>排除：其他书籍、聊天、未结算事件、未定稿正文、AI候选和卷纲中未实际发生的内容。</li></ul><h3>下一卷规划</h3><ul><li>接收：完整覆盖全部开书字段的 <code>BookCorePack</code>、当前 <code>SettingConstraintPack</code>、全书长期承诺/主线骨架、上一卷完整 <code>VolumeSettlementPack</code>、更早卷的结构化结算历史、当前人物/关系/势力/资源状态、全部仍开放的大线索、作者对下一卷的全部原话、选择的卷节奏/软模板和附件。</li><li>推演目标：从上一卷实际结束状态和真实开放线索出发设计下一卷，延续全书定位与核心机制；可以吸收上一卷未实现计划作为“待重新选择的候选”，但不能把它当成已经发生。</li><li>检索：与下一卷目标、开放线索、当前状态和跨卷承诺直接相关的正式设定、结算和必要正文原文。</li><li>排除：其他书籍、聊天/会话摘要、上一卷未实现计划冒充事实、旧AI候选、过期活动版本和全书正文无差别堆叠。</li></ul><h2>5. 混合检索路由</h2><p>按照任务选择通道，不设一个全局相似度阈值：</p><ul><li>精确通道：ID、名称、别名、规则、版本和活动指针；</li><li>全文通道：专有名词、原句、约定和场景关键词；</li><li>语义通道：同义表达、主题与声音相似片段；</li><li>关系通道：人物、势力、地点、道具、规则和线索邻域；</li><li>时间/因果通道：前因、后果、最近状态和阶段结算；</li><li>原文回查：已确认正文、设定与来源附件。</li></ul><p>融合前依次执行书籍隔离、版本有效性、权威层级、时间一致性、冲突标注、去重和预算裁剪。相似结果若缺少来源或与活动版本冲突，只能作为待核候选。</p><h2>6. 检索不足与冲突</h2><ul><li>找不到依据：标注未知或需确认，不补造。</li><li>事实冲突：把冲突双方和来源交给事实审查或作者裁决。</li><li>规划与正文冲突：正文结算代表实际发生；是否修订后续规划由作者决定。</li><li>召回过多：按任务关系、来源权威、时间邻近和因果必要性裁剪。</li><li>召回过少：扩大别名、关系、时间和原文邻域，不先降低全局阈值。</li></ul><h2>7. 必测项</h2><ul><li>跨书隔离与越权；</li><li>错活动版本和过期候选；</li><li>直接权威源不会被语义召回覆盖；</li><li>摘要误导时能回查原文；</li><li>作者灵感不会被升级为硬事实；</li><li><code>BookCorePack</code>对全部开书字段的覆盖率为100%，空字段不会被AI补造；</li><li>卷、事件链、事件大纲、章纲和正文均能回查各自上游完整版本；</li><li>压缩前后作者必须项、强偏好、核心机制、活动设定和上层因果不丢失；</li><li>三类审查绑定同一正文与完整当前章纲，但事实/文学/体验附加资料和结果相互隔离；</li><li>章节、事件和卷结算均只能从已确认正文、下级结算和既有正史提取实际结果；</li><li>下一卷使用上一卷完整真实结算，未实现计划不会冒充历史事实；</li><li>规划未实现内容不会进入结算；</li><li>中间、开头和末尾位置证据召回；</li><li>同义、否定、时间、因果、关系和对抗查询；</li><li>检索增益与创造性非劣效对照。</li></ul></template><template id="document-2" data-title="创造性、人物生命力与输出非劣效" data-path=".agents/skills/wenmi-longform-quality/references/creativity-and-output-quality.md" data-meta="长篇质量 Skill · 3.6 KB · 3bbe3fb9afeb"><h1>创造性、人物生命力与输出非劣效</h1><h2>1. 审查边界</h2><p>质量审查不能成为小说生成器的逐项打分提示。它用于发现系统机制是否把创作压平，而不是要求每章同时满足所有指标。</p><p>不要设置创作质量层级，也不要把报告等级展示给AI成员作为行为门禁。工程证据等级只说明“系统结论有多少证据”，不评价小说属于什么档次。</p><h2>2. 三类约束</h2><h3>硬底线</h3><p>作者确认事实、活动版本、数据隔离、安全、版权来源、费用、不可逆操作和明确禁止项。</p><h3>当前任务约束</h3><p>活动卷纲、当前事件、当前章纲中被作者确认的目标、入口、结果和边界。它们约束方向，但不替代正文中的自然实现。</p><h3>软参考</h3><p>卷级/事件级模板、节拍建议、题材惯例、作者灵感、风格倾向、审查意见、字数和章数估计。</p><p>软参考可以不用、自定义、混合、拆分、合并或重排。AI可以有理由偏离；有价值的重大偏离形成候选和影响预览，由作者裁决。</p><h2>3. 保留创作自由区</h2><p>正式正文任务至少给写手保留：</p><ul><li>对白的具体表达；</li><li>动作、细节、意象和环境选择；</li><li>场景内部调度；</li><li>符合人物动机的局部反应；</li><li>不改变关键因果的自然过渡；</li><li>章纲未穷举但不违反事实的小发现。</li></ul><p>禁止把卷纲、事件和章纲逐句复制进正文，禁止要求每章机械命中固定爽点、反转或钩子数量。</p><h2>4. 人物生命力</h2><p>检查人物是否仍具有：</p><ul><li>可辨识的语言、节奏和关注点；</li><li>与经历、关系和当前状态一致的行动动机；</li><li>在约束内作出非模板化选择的空间；</li><li>可积累的情绪、误解、欲望、代价和关系变化；</li><li>与其他人物不完全同质的判断方式。</li></ul><p>人物一致不等于永远不变。变化必须有可追踪经历或事件作为原因；不要用静态性格标签阻止成长，也不要用“成长”掩盖无因漂移。</p><h2>5. 方案多样性</h2><p>独立候选应在因果路径、角色选择、冲突解决、代价或情绪落点上有实质差异，而不是更换同义词。</p><p>检查：</p><ul><li>ContextPack是否被过度模板化导致所有成员同解；</li><li>融合者是否平均化或抹掉最有价值的差异；</li><li>作者是否能按部分采用，而不是只能整份二选一；</li><li>同模型是否被错误显示成独立异模型意见；</li><li>退回重写是否保留作者已认可部分。</li></ul><h2>6. 非劣效维度</h2><p>根据变更影响选择测试，不要求每次全部执行：</p><ul><li>原创性；</li><li>合理惊喜；</li><li>人物可辨识度；</li><li>情绪力度；</li><li>因果自然度；</li><li>叙事清晰度；</li><li>检索锚定；</li><li>卷、事件、章之间的方向一致性；</li><li>整体阅读质量；</li><li>作者决策效率和修改负担。</li></ul><p>局部可逆修改可做针对性多样本对照；岗位默认、ContextCompiler、检索或全链路改变必须做跨题材、跨节点或纵向盲评。</p><h2>7. 反迎合</h2><p>AI候选和审查报告要区分：作者明确决定、强偏好、灵感、问题、事实、推断和未知。</p><p>不应因为作者提出一个想法就：</p><ul><li>把它升级为正史；</li><li>假称所有成员赞同；</li><li>隐藏代价和反例；</li><li>自动覆盖已有活动版本；</li><li>用礼貌措辞替代实质比较。</li></ul><h2>8. 停止条件</h2><p>出现以下任一情况时停止扩大新机制，并保留旧版本可切回：</p><ul><li>人物可辨识度或合理惊喜显著下降；</li><li>候选方案趋同且差异只剩措辞；</li><li>模板命中率上升但整体阅读质量下降；</li><li>检索内容挤占创作自由区；</li><li>审查建议导致正文反复机械重写；</li><li>作者完成一个节点的选择和确认成本明显上升。</li></ul></template><template id="document-3" data-title="验收与工程证据合同" data-path=".agents/skills/wenmi-longform-quality/references/evaluation-contract.md" data-meta="长篇质量 Skill · 4.1 KB · 914ab8c9b827"><h1>验收与工程证据合同</h1><h2>1. 证据等级只描述结论可信度</h2><ul><li>E0：设计、Schema或代码存在，尚未证明运行。</li><li>E1：单元测试或确定性夹具通过。</li><li>E2：本地集成、迁移、恢复和界面流程通过。</li><li>E3：独立金标、对抗样本、真实模型多样本或盲评通过。</li><li>E4：真实长篇连续运行和纵向质量证据通过。</li></ul><p>E0—E4不是小说质量层级，不进入AI成员提示词，不限制候选方案，也不能把一章评成“E2质量”。任何质量声明必须写明适用范围、样本、基线和不确定性。</p><h2>2. 新工作流覆盖矩阵</h2><p>至少覆盖：</p><ol><li>开书信息创建与修改；</li><li>设定模块候选、作者编辑与确认；</li><li>分卷候选、差异比较、融合、版本和影响预览；</li><li>当前卷事件链新增、删除、重排和因果衔接；</li><li>当前事件大纲候选、软模板和作者原话；</li><li>当前事件完整章节序列与近期一至三章细纲；</li><li>单章正文冻结规划链、单写手生成和作者定稿；</li><li>事实、文学、体验审查对同一不可变正文独立取证；</li><li>章节、事件和卷结算只读取实际正文与正史；</li><li>下一卷引用上一卷真实结算而不是未实现计划。</li></ol><p>正式生产不再测试聊天推进、会话记忆、对话摘要或模式路由。独立灵感需要测试：跨书隔离；不能写正式对象；不能确认生产讨论；未摘录内容不进入ContextCompiler；作者摘录后只以目标对象的作者原话进入；删除讨论不影响正式源。</p><h2>3. 数据与版本测试</h2><ul><li>所有核心记录含 <code>owner_id</code>、<code>book_id</code>；</li><li>跨书、错书和越权查询被拒绝；</li><li>候选、活动版本和历史版本不可混淆；</li><li>上游版本变化使下游冻结对象失效或等待重核；</li><li>正文修改产生新不可变版本；</li><li>规划不进入正史，结算不把未实现计划当事实；</li><li>归档、恢复、取消、重试和晚到结果可重复执行；</li><li>迁移能在空库和升级库运行，已合并迁移不修改。</li></ul><h2>4. ContextCompiler与RAG测试</h2><ul><li>每种任务包均有确定性直接源和任务预算；</li><li>作者原话保留，强度和目标对象不丢失；</li><li>直接活动版本不被相似召回覆盖；</li><li>结构化、全文、向量、关系、时间/因果和原文回查可按需组合；</li><li>同义、否定、别名、时间、因果、关系和跨位置查询有独立用例；</li><li>检索包含纳入、排除、来源和冲突轨迹；</li><li>摘要错误时能够回查正式源；</li><li>禁用灵感检索后正式任务上下文仍完整；未摘录讨论的消融结果必须等价。</li></ul><h2>5. AI协作测试</h2><ul><li>独立候选使用独立ContextPack和真实ModelCall；</li><li>候选来源、模型、任务和版本可追溯；</li><li>同模型不会被标成异模型；</li><li>融合只读取已保存候选且不自动确认；</li><li>作者可部分采用、编辑、退回和撤回；</li><li>正式正文只有一个活动写手结果进入审查；</li><li>审查角色不会互相读取结果后伪装独立；</li><li>硬事实错误与文学/体验建议分开处理。</li></ul><h2>6. 创造性非劣效</h2><p>与旧流程或弱治理基线对比时，使用盲化、多样本和反顺序评估。按影响选择原创性、合理惊喜、人物可辨识度、情绪力度、因果自然度、检索锚定和整体阅读质量。</p><p>固定同义词、同源样本或连续五章只能证明有限运行，不能证明长篇质量。新卷—事件工作流要宣称跨卷稳定，至少需要跨事件、跨卷、不同位置与真实状态演化证据。</p><h2>7. 失败与恢复</h2><p>模拟：</p><ul><li>模型超时、5xx、格式错误和取消；</li><li>Worker崩溃、租约过期和重复领取；</li><li>上游版本在候选生成中改变；</li><li>部分候选成功、融合失败；</li><li>章节结算中断；</li><li>索引重建、向量投影缺失和原文回查失败；</li><li>桌面启动、数据库升级和端口占用。</li></ul><p>恢复不得重复计费、重复写入、接受晚到结果、产生半结算或静默覆盖作者内容。</p><h2>8. 报告格式</h2><p>报告按问题和工作流节点组织，不输出固定质量层级。每项结论标注：基线、样本、结果、证据等级、局限、停止条件和回滚方法。</p></template><template id="document-4" data-title="卷—事件长篇故障模型" data-path=".agents/skills/wenmi-longform-quality/references/longform-failure-model.md" data-meta="长篇质量 Skill · 4.5 KB · d7492e648067"><h1>卷—事件长篇故障模型</h1><h2>使用方法</h2><p>先确认可观察症状，再从真实版本、ContextPack、检索轨迹、调用记录、正文和结算寻找根因。一个症状可以有多个根因，不要用“换更强模型”跳过定位。</p><h2>F1 设定漂移</h2><ul><li>症状：能力、规则、身份或世界规律前后矛盾。</li><li>常见根因：活动设定版本错配、摘要冒充权威、原文未回查、作者新想法被误升格。</li></ul><h2>F2 卷方向漂移</h2><ul><li>症状：事件各自精彩但不服务本卷目标，卷末无法完成承诺。</li><li>常见根因：事件任务未引用活动卷纲、卷纲过度抽象、上游修订未使下游失效。</li></ul><h2>F3 事件失控</h2><ul><li>症状：事件跨越边界、吞并后续事件、因果断裂或无法自然引出下一事件。</li><li>常见根因：事件入口/结果/下一触发不清、检索注入无关灵感、模板取代本卷约束。</li></ul><h2>F4 章纲越级</h2><ul><li>症状：章纲新增重大设定、改写事件结果或提前完成卷高潮。</li><li>常见根因：章纲未绑定活动事件、一次冻结过多远期细纲、版本依赖缺失。</li></ul><h2>F5 正文机械化</h2><ul><li>症状：正文像大纲扩写、节拍生硬、对白和场景缺少生命。</li><li>常见根因：上下文塞入全量规划、模板硬化、自由区不足、审查清单进入写手提示词。</li></ul><h2>F6 人物漂移或扁平化</h2><ul><li>症状：声音趋同、动机突变、角色只执行剧情功能。</li><li>常见根因：缺少人物声音原文和状态因果、静态标签过强、审校反复统一文风。</li></ul><h2>F7 检索错锚</h2><ul><li>症状：召回相似但错误的实体、时间、卷或版本。</li><li>常见根因：仅依赖向量相似度、未做书籍/版本过滤、别名和时间关系缺失。</li></ul><h2>F8 上下文膨胀</h2><ul><li>症状：模型忽略关键约束、复述资料、候选同质、费用和延迟上升。</li><li>常见根因：岗位固定全量包、聊天历史累积、多个规划层全文重复、无排除理由和预算。</li></ul><h2>F9 作者原话丢失</h2><ul><li>症状：AI只看到摘要，作者意图被改写或灵感被硬化。</li><li>常见根因：对话摘要替代对象化原话、强度未标注、来源对象不明确。</li></ul><h2>F10 候选伪独立</h2><ul><li>症状：多份方案几乎相同，或同模型被展示成异模型共识。</li><li>常见根因：共用同一生成结果、候选互读、共享随机种子/模板过强、来源显示失真。</li></ul><h2>F11 融合平均化</h2><ul><li>症状：融合稿消除各方案亮点，只剩无风险折中。</li><li>常见根因：自动投票、无作者选择范围、融合者未记录采用/舍弃理由。</li></ul><h2>F12 审查越权</h2><ul><li>症状：文学或体验意见被当成事实错误，AI自动重写作者已认可内容。</li><li>常见根因：审查职责混淆、报告进入写手循环、软建议升级为阻塞门禁。</li></ul><h2>F13 结算污染</h2><ul><li>症状：资料库或下一卷记住了正文未发生的计划。</li><li>常见根因：从卷纲/事件大纲直接提取正史、章节未定稿就结算、计划—实际未分层。</li></ul><h2>F14 版本错配</h2><ul><li>症状：正文引用过期卷纲、事件或章纲，修改后下游仍可提交。</li><li>常见根因：活动指针、哈希或修订号未冻结，影响预览与失效链缺失。</li></ul><h2>F15 重试与晚到污染</h2><ul><li>症状：重复候选、重复计费、取消后结果仍被采用、半结算。</li><li>常见根因：幂等键、租约、取消栅栏、检查点和事务边界缺失。</li></ul><h2>F16 长期遗忘</h2><ul><li>症状：跨事件或跨卷的承诺、关系和规则无法回收。</li><li>常见根因：只保留最近固定章数、摘要无来源、没有事件/卷结算和按需原文回查。</li></ul><h2>F17 工作流与界面脱节</h2><ul><li>症状：按钮制造假进度、页面仍要求聊天、作者不知道当前对象和下一步。</li><li>常见根因：前端状态机未绑定真实任务、旧入口未退役、对象层级和状态名不一致。</li></ul><h2>F18 遗留聊天依赖</h2><ul><li>症状：新流程删除聊天页后，规划、附件、点名、检索或恢复失效。</li><li>常见根因：业务意图和附件只存消息表、任务依赖会话ID、对话摘要被当作唯一上下文。</li></ul><h2>F19 质量治理反噬</h2><ul><li>症状：审查分数更高但故事更平、人物更像、作者选择成本更大。</li><li>常见根因：把质量维度硬编码进提示词、固定岗位上下文、门禁过密、局部指标替代整体阅读。</li></ul><h2>停止原则</h2><p>出现跨书、正史污染、不可恢复覆盖、版本错配或结算污染时立即停止正式提交。出现创作质量显著非劣效失败时停止扩大机制，保留候选与证据，回滚提示词、检索或门禁配置而不删除作者数据。</p></template><template id="document-5" data-title="卷—事件生产闭环与运行质量" data-path=".agents/skills/wenmi-longform-quality/references/runtime-quality-loops.md" data-meta="长篇质量 Skill · 5.0 KB · f8070072defb"><h1>卷—事件生产闭环与运行质量</h1><h2>1. 规划节点通用闭环</h2><p>设定、卷纲、事件链、事件大纲和章纲统一使用对象化闭环：</p><ol><li>作者在当前对象旁输入原话、附件和偏好强度；</li><li>系统冻结目标对象、活动上游版本和工作流版本；</li><li>ContextCompiler为配置中的AI成员分别准备任务包；</li><li>成员直接提交独立候选，不通过灵感推进；</li><li>页面比较候选的共同点、差异、代价、未知和来源；</li><li>作者选择整份、按部分融合、直接编辑、退回或暂不处理；</li><li>融合者只在作者明确选择后整合，不自动投票或确认；</li><li>作者最终确认，生成新的不可变活动版本；</li><li>系统计算下游影响并使错版候选失效或等待重核。</li></ol><p>岗位数量和名称由当前产品配置决定；闭环只要求候选来源真实、版本可追溯和作者可裁决。</p><h2>2. 当前卷闭环</h2><p>输入以开书、活动设定、上一卷真实结算、当前状态、本卷作者原话和卷级软模板为主。</p><p>卷纲确认后建立事件链。卷纲只负责本卷目标、核心冲突、主要因果、人物变化、高潮、卷末状态和下一卷接口；不预写每章，不把模板节拍硬化。</p><h2>3. 当前事件闭环</h2><p>事件链先确定事件职责、顺序和衔接。选择当前事件后，候选必须引用活动卷纲、事件入口、预期结果、上一事件真实结算和下一事件触发。</p><p>事件大纲确认后生成完整章节序列，并仅详细冻结最近一至三章。事件尚未结算时，下一个事件可以规划但不能把未发生结果当作事实。</p><h2>4. 单章正文闭环</h2><ol><li>冻结活动卷纲、事件、事件章节链和当前章纲版本；</li><li>编译直接权威源、相关检索证据、作者意见和创作自由区；</li><li>一个活动写手生成完整草稿；</li><li>做确定性硬检查：结构、空输出、越权、来源、版本、明显事实边界；</li><li>按当前产品配置启动相互独立的事实、文学和体验审查；</li><li>事实问题引用来源，文学和体验意见保留为建议；</li><li>作者直接修改、要求定点重写或接受草稿；</li><li>作者定稿后生成新的不可变正文版本；</li><li>在事务中完成章节结算，再允许下一章正式生成。</li></ol><p>不要默认让两个写手串行整稿；不要批量正式写章；不要因审查建议自动无限重写。</p><h2>5. 章节结算</h2><p>章节结算只读取作者确认正文和既有正史，产生：</p><ul><li>本章实际发生的关键因果；</li><li>人物、关系、地点、道具、规则与势力状态变化；</li><li>新增、推进、回收或作废的开放线索；</li><li>可定位到正文版本和片段的来源；</li><li>与章纲的差异及对后续规划的影响。</li></ul><p>结算、正史更新、活动指针推进和下一章解锁必须位于同一Repository事务或具备可证明的原子补偿。</p><h2>6. 事件结算</h2><p>当前事件全部章节定稿并完成章节结算后：</p><ul><li>聚合实际事件入口、关键行动、结果、代价和下一触发；</li><li>对照事件大纲，标注已实现、调整实现、未实现和新增结果；</li><li>更新角色状态、开放线索和相关正史来源；</li><li>生成不可变事件结算；</li><li>以实际结果编译下一事件，而不是照抄原计划。</li></ul><h2>7. 卷结算</h2><p>当前卷全部事件结算后：</p><ul><li>聚合卷内实际主线、人物变化、势力状态、重要收益与代价；</li><li>汇总仍开放的大线索和下一卷入口；</li><li>将卷纲仅作为计划—实际差异来源；</li><li>生成不可变卷结算；</li><li>下一卷必须冻结上一卷确认版本和真实卷结算。</li></ul><h2>8. 任务状态与恢复</h2><p>任务状态由持久化任务、模型调用、工具事件和心跳驱动。至少支持准备、运行、完成、失败、超时、取消、重试等待和失效。</p><p>运行规则：</p><ul><li>幂等键覆盖作者重复点击；</li><li>租约和心跳防止重复领取；</li><li>检查点保存已完成候选，后续失败不重复调用；</li><li>取消栅栏拒绝晚到结果；</li><li>上游版本变化使任务失效；</li><li>技术重试有界，不自动重复计费；</li><li>格式修复不得改变创意内容；</li><li>所有写入经Repository完成。</li></ul><h2>9. 可观测性</h2><p>记录任务类型、目标对象、活动版本、ContextPack、成员与模型快照、调用耗时、预算、检索轨迹、候选版本、作者选择、失败原因、重试和结算事务。</p><p>不保存模型内部思维链，不以动画或本地计时器伪造AI工作状态。</p><h2>10. 正式生产与灵感边界</h2><p>正式闭环不通过聊天消息推进、不读取会话摘要、不依赖会话ID。独立灵感必须使用隔离记录和只读正式资料检索，不能获得正式对象写入能力；未摘录讨论不得进入ContextCompiler。作者摘录时必须选择目标对象和强度，保存原文、讨论来源和目标绑定，再由正常作者输入规则处理。</p><p>旧对话式生产兼容记录按当前数据保留政策归档；先停止生产路由和运行时读取，再删除无引用装配。不要把“隔离讨论”扩大为删除版权、安全、来源、审计或恢复机制。</p></template><template id="document-6" data-title="当前工作流、界面与项目精简" data-path=".agents/skills/wenmi-longform-quality/references/workflow-and-simplification.md" data-meta="长篇质量 Skill · 4.4 KB · f179540f512c"><h1>当前工作流、界面与项目精简</h1><h2>1. 作者主流程</h2><p>创作台只围绕当前书显示六个主步骤：</p><ol><li>开书信息；</li><li>设定；</li><li>当前卷；</li><li>规划；</li><li>章纲设计；</li><li>正文创作。</li></ol><p>事件结算、卷结算和下一卷规划是对象状态推进；图谱、资料库和取名是当前书内辅助工具。作者在对应对象旁输入想法，AI成员提交方案卡片，作者比较、选择、融合、修改和确认。</p><h2>2. 页面共同交互</h2><p>每个规划页面至少显示：</p><ul><li>当前对象及其上游归属；</li><li>当前活动版本和确认状态；</li><li>作者原话、附件和意图强度；</li><li>可选的大白话模板说明；</li><li>真实任务状态与AI候选来源；</li><li>候选差异、未知、代价和影响；</li><li>选择整份、按部分融合、直接编辑、定点重写和确认；</li><li>上游变更后的下游影响预览；</li><li>下一步唯一主操作。</li></ul><p>前端不展示内部提示词、JSON键、技术状态名、相似度阈值或抽象叙事术语。模板用大白话说明“怎样推进、适合什么、可能有什么风险、放进本书会怎样”。</p><h2>3. 动态规划界面</h2><h3>当前卷</h3><p>以任务阶段、人物变化和因果板展示，不强制固定章数。卷级模板只是软起点，可不用、自定义、混合和重排。</p><h3>规划</h3><p>先显示卷内事件时间轴或列表，再进入当前事件详情。事件卡突出目标、入口、结果、对应卷任务和与前后事件的因果连接。事件级模板与卷级模板分开，不能把专业模板名称直接作为作者界面标题。</p><h3>章纲设计</h3><p>显示当前事件完整章节序列，只把近期一至三章提升为可直接写作的详细章纲。上章未结算或上游版本改变时，后续详细章纲必须等待重核，不能静默成为正式写作依据。</p><h3>正文创作</h3><p>正文是主区域，事实、文学和体验三份报告是辅助侧栏。作者可以定位修改、保留满意部分、要求定点重写或直接定稿，不被强迫接受软建议。</p><h2>4. AI成员介入</h2><p>Skill不固定团队人数和名称。界面按当前产品配置展示本节点实际参与者：</p><ul><li>规划节点：独立候选成员、融合成员和作者；</li><li>正文节点：活动写手、独立审查成员和作者；</li><li>数据准备：显示为系统准备、编译和检索过程，不虚构成额外创作意见。</li></ul><p>成员状态必须来自真实任务、模型调用、工具事件和检查点；等待上游时显示等待，不显示假进度。同一模型承担多个岗位时必须如实显示共同模型来源。</p><h2>5. 项目精简规则</h2><p>当前仓库只保留能服务以下范围的代码与文档：当前对象化工作流、已有作品导入与续写、图谱、资料库、取名、上下文编译、混合检索、AI任务、三级审查、三级结算、安全、恢复、测试和桌面运行。</p><p>每次精简必须同时检查：</p><ul><li>当前路由、类型、任务、Worker、恢复和迁移是否引用；</li><li>已有书籍读取、来源、安全、调用审计、附件或恢复是否需要；</li><li>是否存在更清晰的唯一入口；</li><li>删除后能否通过Git和向前迁移恢复；</li><li>静态可达性、类型、测试、构建和本地运行是否通过。</li></ul><p>不可变正文、作者原件、已合并迁移和作者数据不作为“无用文件”清理。投影、缓存和生成页面必须能从当前权威源重建。</p><h2>6. 当前文档中心</h2><p>桌面文档中心只读取显式白名单中的当前产品、流程、架构、上下文、质量、验收和Codex规则，以及本Skill的Markdown正文。一次性报告、发布证据、临时计划、二进制元数据和未被当前流程引用的文件不进入中心。</p><p>卡片必须能在同一页面展开完整正文，显示源路径、内容指纹和生成时间。打开桌面入口、执行开发结算、提交或合并代码时自动重新生成；检查失败则不得完成开发结算。</p><h2>7. 验收</h2><ul><li>从开书到下一卷只通过明确业务对象推进；</li><li>每个节点作者都能输入原话并看到真实候选；</li><li>卷、事件、章纲和正文版本依赖正确；</li><li>AI状态与真实任务一致；</li><li>上游修订有影响预览和失效链；</li><li>上下文包不缺关键作者意图，也不读取其他书；</li><li>已有书籍可读、迁移可升级、恢复不丢数据；</li><li>前端没有死路由或空白占位；</li><li>文档中心全文可读、自动更新且只显示白名单内容；</li><li>精简前后创造性和整体输出质量不显著下降。</li></ul></template><template id="document-7" data-title="文秘写作长篇质量审查" data-path=".agents/skills/wenmi-longform-quality/SKILL.md" data-meta="长篇质量 Skill · 9.3 KB · 7b049e5b6c27"><details class="frontmatter"><summary>文档元数据</summary><pre>name: wenmi-longform-quality
description: 审查和设计文秘写作按开书、设定、卷纲、事件链、事件大纲、章纲、单章正文、事件结算与卷结算推进的长篇小说质量、任务上下文、混合检索、AI协作、项目精简和验收机制；用于重要流程、RAG、规划粒度、Agent职责、生成审校、人物漂移、剧情失控、检索错误、文风同质、重复、迎合或跨章质量下降。普通事实问答、纯文案修改、低风险样式调整和明确机械修复不使用。</pre></details><h1>文秘写作长篇质量审查</h1><h2>目标</h2><p>在不压缩AI合理创作空间的前提下，降低长篇创作的事实漂移、层级越权、错误检索、版本错配、结算失真和不可恢复失败。</p><p>本Skill是开发设计与验收工具，不是小说创作岗位的上级提示词。不要把本Skill全文、检查表、证据等级或评分维度注入AI成员上下文。</p><h2>当前工作流基线</h2><p>按以下正式生产对象链审查，不使用聊天推进、对话记忆或抽象创作模式分流：</p><p><code>开书信息 → 设定 → 分卷 → 当前卷事件链 → 当前事件大纲 → 当前事件章纲 → 单章正文 → 章节结算 → 事件结算 → 卷结算 → 下一卷</code></p><p>每个规划节点允许作者输入原话，AI成员直接提交可比较方案，作者选择、融合、编辑或退回；只有作者确认的版本才能成为下游活动版本。</p><p>独立灵感可以作为生产流程之外的辅助域存在，但它不能生成、确认或修改正式对象，也不能成为生产记忆或检索源。只有作者主动摘录、选择强度并绑定具体业务对象的片段，才能以作者原话进入上述对象链。</p><h2>不得做的事</h2><ul><li>不建立面向创作成员的“质量层级”或分层报告门禁。</li><li>不固定团队人数、岗位名称、模型供应商或永久上下文字段；这些由当前产品规格和任务类型决定。</li><li>不定义开放讨论、创意推演、试写、正式生产等创作模式，也不要求模式路由。</li><li>不把聊天记录或对话摘要当作长期事实源；灵感默认隔离，作者主动摘录的原话必须附着到明确的书、设定、卷、事件、章纲或正文任务对象。</li><li>不把卷级或事件级叙事模板变成硬公式，不固定爽点、反转、打脸、节拍或章数。</li><li>不以向量库、多Agent、长上下文、更强模型或更高审校分数代替根因分析。</li><li>不以一致性提升抵消原创性、合理惊喜、人物可辨识度、情绪力度或整体阅读质量下降。</li></ul><h2>审查顺序</h2><h3>1. 确认任务边界</h3><p>记录当前任务对应的工作流节点、目标对象、活动版本、作者原话、硬事实、软偏好、未知项和下游影响。</p><p>若是重大设计，建立唯一 <code>design_review_id</code>，按 <code>docs/DESIGN_GOVERNANCE_AUDIT.md</code> 记录Skill快照、替代方案、两轮审查、证据等级、停止条件和回滚方法。</p><h3>2. 建立故障链</h3><p>对每个重要问题建立：</p><p><code>痛点 → 可观察症状 → 根因假设 → 机制 → 反例 → 指标 → 证据 → 停止条件</code></p><p>先从真实代码、数据、ContextPack、检索轨迹、模型调用和版本依赖建立基线；证据不足时标注未知，不补造结论。</p><h3>3. 检查规划对象链</h3><p>确认：</p><ul><li>卷纲只约束当前卷的目标、主要因果、人物变化、高潮与卷末接口；</li><li>事件链说明事件职责、次序和因果衔接；</li><li>事件大纲细化当前事件，不跨越活动卷纲；</li><li>章纲引用活动事件，只冻结当前事件的完整章节序列和近期一至三章细纲；</li><li>正文任务冻结卷纲、事件和章纲版本，同时保留对白、动作、意象、局部调度和自然因果实现的自由区；</li><li>事件结算与卷结算只从作者确认的正文和正史生成，规划只能用于差异对照。</li></ul><p>上游版本变化时，必须显示影响并使相关下游候选失效或等待重核，禁止静默改写。</p><h3>4. 编译任务型上下文</h3><p>不要审核“某岗位永远收到哪些字段”，而要审核“当前任务需要哪一组完整上游约束和补充证据”。最小充分只用于排除其他书籍、未摘录灵感和当前任务无关材料，不能用来裁掉作者已经填写的开书字段、作者原话、活动设定或上层规划因果。</p><p>ContextCompiler至少按任务区分：设定候选、卷纲候选、事件链、事件大纲、章纲、正文、事实审查、文学审查、体验审查、章节结算、事件结算、卷结算和下一卷规划。</p><p>上下文选择遵守：</p><ol><li>开书和设定直接接收完整开书活动版本；卷纲及后续使用覆盖全部开书字段、可回查原文的结构化 <code>BookCorePack</code>；</li><li>卷、事件链、事件大纲、章纲、正文、三类审查、三级结算和下一卷逐层接收压缩但完整覆盖的上游约束，并接收当前目标对象的完整信息；</li><li>事实、文学和体验审查绑定同一不可变正文与完整当前章纲，但按职责分离附加资料，且不读取彼此报告；</li><li>章节、事件和卷结算只把作者确认正文及既有正史作为事实源，规划只用于“计划—实际”对照；下一卷必须以真实卷结算为起点；</li><li>直接活动版本优先于检索结果；</li><li>作者原话原样保留并标注强度；</li><li>摘要只导航，事实回查正式源；</li><li>只检索与当前任务、实体、时间和因果相关的内容；</li><li>记录纳入、排除、裁剪和来源理由；</li><li>软偏好与模板不得伪装成事实或硬规则；</li><li>留出明确创作预算，避免上下文把正文压成资料复述。</li></ol><p>详细任务矩阵见 <code>references/context-and-rag.md</code>。</p><h3>5. 审查AI协作与作者裁决</h3><p>AI成员的数量、名称和分工可以随产品规格变化。Skill只检查这些结果性条件：</p><ul><li>配置为独立提案的成员必须拥有独立ContextPack和真实调用记录；</li><li>同一模型不得冒充异模型独立意见；</li><li>融合者只能读取已保存候选，并明确说明采用、调整或舍弃了什么；</li><li>作者能够比较、局部融合、直接编辑、退回和最终确认；</li><li>未被作者确认的候选不得进入活动规划或正史；</li><li>一个正式正文版本只由一个活动写手负责，除非作者明确选择接管或定点重写；</li><li>审查意见不得自动重写正文或把软建议升级为硬错误。</li></ul><h3>6. 审查混合检索</h3><p>检索必须以工作流节点、对象身份和版本依赖为路由条件，按需组合：</p><ul><li>结构化精确查询；</li><li>全文检索；</li><li>向量语义召回；</li><li>关系扩展；</li><li>时间与因果邻域；</li><li>正史原文和不可变正文回查。</li></ul><p>禁止用单一相似度阈值决定全部召回。检索结果必须经过书籍隔离、版本有效性、来源权威、时间一致性、冲突检测、去重和预算裁剪。</p><h3>7. 保护创造性和人物生命力</h3><p>把约束分为三类：</p><ul><li>硬底线：作者确认事实、活动版本、数据隔离、安全、版权来源、费用和不可逆操作；</li><li>任务约束：当前卷、事件、章纲明确要求；</li><li>软参考：模板、节拍建议、作者灵感、风格倾向和审查建议。</li></ul><p>只有前两类能够阻止正式提交。软参考可以被AI有理由地偏离；重大且有价值的偏离应形成影响预览交由作者选择。</p><p>质量指标用于离线验收和故障诊断，不应作为正文逐项打分提示。详见 <code>references/creativity-and-output-quality.md</code>。</p><h3>8. 审查结算与恢复</h3><p>每章、每事件、每卷都要区分“计划发生什么”和“实际发生了什么”。结算只聚合已确认正文、正史变更、角色状态、开放线索、因果结果和来源。</p><p>检查幂等键、租约、取消栅栏、检查点、晚到结果隔离、原子事务、不可变版本和恢复入口。Worker不得直接修改正式正文或核心正史。</p><h3>9. 做两轮审查</h3><p>第一轮检查可靠性：事实、版本、隔离、来源、检索锚定、任务状态、失败恢复和可观测性。</p><p>第二轮检查非劣效：上下文是否膨胀、模板是否公式化、人物是否变平、方案是否同质、AI是否迎合、作者决策成本是否增加、整体阅读质量是否下降。</p><h2>输出要求</h2><p>输出应直接服务当前决定，不固定“质量分层报告”。至少给出：</p><ol><li>已确认事实、作者决定、推断和未知项；</li><li>与当前工作流节点对应的问题和根因；</li><li>推荐机制及被否决替代方案；</li><li>对创造性、人物、检索、版本和恢复的影响；</li><li>可执行验收、证据等级、停止条件和回滚方法。</li></ol><p>无问题时可以给出简短结论，不为凑格式制造风险。</p><h2>参考路由</h2><ul><li>检索、ContextCompiler、工作流任务包：<code>references/context-and-rag.md</code></li><li>创造性、人物与输出非劣效：<code>references/creativity-and-output-quality.md</code></li><li>证据等级、测试和验收：<code>references/evaluation-contract.md</code></li><li>长篇故障分类与根因：<code>references/longform-failure-model.md</code></li><li>单章到卷结算与恢复：<code>references/runtime-quality-loops.md</code></li><li>新工作流、界面和项目精简：<code>references/workflow-and-simplification.md</code></li></ul><h2>验证</h2><p>修改本Skill后运行Skill Creator提供的 <code>quick_validate.py</code>，并执行：</p><p><code>node .agents/skills/wenmi-longform-quality/scripts/validate-audit.mjs &lt;audit-file&gt;</code></p><p>若验证失败、参考文件与主文件冲突、或Skill开始反向固定产品岗位与创作模式，停止发布并回滚本次Skill变更。</p></template><template id="document-8" data-title="文秘写作开发协作规则" data-path="AGENTS.md" data-meta="Codex 工作规则 · 5.9 KB · 727afe759933"><h1>文秘写作开发协作规则</h1><h2>权威顺序</h2><ol><li>老板最新明确决定；</li><li>本文件与 <code>docs/PROJECT_CHARTER.md</code>；</li><li><code>docs/DECISIONS.md</code> 中当前生效的决定；</li><li>当前产品、工作流、架构、数据、Agent、上下文、检索、质量、API与验收文档；</li><li>当前代码、测试和运行证据。</li></ol><p>历史文件和Git历史只用于追溯，不得驱动开发、进入产品检索或覆盖新决定。</p><h2>项目边界</h2><ul><li>项目只位于 <code>D:\wenmixiezuo</code>，不得引用或依赖其他项目。</li><li>普通安全、可逆、零现金开发操作无需逐项请示。实际付费、新密钥或登录、永久删除作者数据、生产恢复和重大架构变更才暂停。</li><li>老板已确认清理旧文档、旧代码和旧聊天链；删除前仍必须完成替代、零引用检查和测试。</li><li>已合并数据库迁移不得修改或删除；作者数据不得随旧功能代码一起永久删除。</li></ul><h2>开工前必读</h2><ol><li><code>PROJECT_HANDBOOK.md</code></li><li><code>docs/PROJECT_CHARTER.md</code></li><li><code>docs/DECISIONS.md</code></li><li><code>docs/PRODUCT.md</code></li><li><code>docs/CREATION_WORKFLOW_V2_DESIGN.md</code></li><li><code>docs/ARCHITECTURE.md</code></li><li><code>docs/DATA_MODEL.md</code></li><li><code>docs/AGENT_SYSTEM.md</code></li><li><code>docs/MEMORY.md</code></li><li><code>docs/LONGFORM_QUALITY.md</code></li><li><code>docs/API.md</code></li><li><code>docs/DEVELOPMENT_ROADMAP.md</code></li><li><code>docs/ACCEPTANCE.md</code></li><li><code>KNOWLEDGE.md</code></li><li><code>TASKS.md</code></li></ol><p>涉及检索或切片时完整读取 <code>docs/HYBRID_RAG_DESIGN.md</code> 与 <code>docs/CHUNKING_DESIGN.md</code>。涉及重要架构、上下文、Agent、生成、审校或质量变更时，还要读取 <code>docs/DESIGN_GOVERNANCE_AUDIT.md</code> 和 <code>.agents/skills/wenmi-longform-quality/SKILL.md</code>。</p><h2>当前工作流</h2><pre class="code-block"><code data-language="text">开书信息 → 设定 → 分卷 → 当前卷事件链 → 当前事件大纲
→ 当前事件章纲 → 单章正文 → 章节结算 → 事件结算 → 卷结算 → 下一卷</code></pre><ul><li>卷纲约束事件，事件链约束事件大纲，事件大纲约束章纲，章纲约束正文。</li><li>规划描述未来；结算只记录正文实际发生的内容。上游版本变化时下游候选必须失效或重新确认。</li><li>作者可见模板全部使用大白话，是可不用、混合、重排和自定义的软参考。</li><li>作者原话附着明确业务对象，并区分必须、强偏好、灵感和问题。</li><li>作者通过设定、卷、事件、章纲和正文对象直接接收AI方案、比较差异、选择、融合与修改。独立灵感只提供启发，不写正式对象；只有作者主动摘录并绑定目标对象后才成为正式作者输入。</li><li>已有正文续写和反向拆解保留；原文不可覆盖，分析结果必须带来源且只作为派生资料。</li></ul><h2>技术与数据</h2><ul><li>React、TypeScript、Vite、Node.js稳定LTS、Fastify、SQLite、LanceDB OSS本地投影、REST与SSE。</li><li>本地模块化单体加独立Worker；服务只监听 <code>127.0.0.1</code>。</li><li>业务层通过Repository访问数据；Worker不得直接修改核心业务表或正式正文。</li><li>核心对象和查询携带 <code>owner_id</code>、<code>book_id</code>；跨书污染必须为0。</li><li>正文使用不可变完整版本；任何修改创建新版本。</li><li>SQLite正式对象和不可变原文是权威源；FTS、向量、图谱、Wiki和摘要都是可重建投影。</li><li>摘要只导航；事实争议回查正式源。</li><li>API Key只从环境变量读取，不得写入数据库、日志、上下文、备份、导出或Git。</li><li>普通删除为归档；作者数据永久删除仍需影响预览、输入 <code>YES</code> 和二次确认。</li></ul><h2>Agent与上下文</h2><ul><li>创作团队保持11名成员；未经老板另行决定不得改变人数。</li><li>小文秘书是本地工具角色，不是第12名创作成员，不能给剧情结论或冒充异模型意见。</li><li>岗位、Agent实例和模型绑定解耦；同模型不得冒充异模型独立复核。</li><li>状态由真实任务、心跳、模型调用和工具事件驱动。</li><li>每次模型调用保存上下文包、调用、预算和任务快照；不保存或展示思维链。</li><li>正文使用单一活动写手；事实、文学、体验三职责由三异模型独立审查，彼此不读取报告。</li><li>ContextCompiler按任务和活动版本动态编译资料，排除其他书、未摘录灵感、过期版本、无关候选、全文堆叠和AI猜测。</li><li>检索组合结构化直达、全文、向量、关系、时间/因果与正式原文回查，不依赖单一相似度阈值。</li></ul><h2>质量、开发与删除门禁</h2><ul><li>长篇质量Skill保护创造性，不得把软倾向变成硬公式或固定创作模式。</li><li>重要设计记录 <code>design_review_id</code>、事实/推断/偏好/未知、替代方案、两轮审查、证据、停止条件和回滚。</li><li>一致性提升不得抵消原创性、合理惊喜、人物可辨识度、情绪力度和整体阅读质量。</li><li>当前Codex默认独立开发，不调用其他开发Agent；产品运行时AI成员不等于开发成员。</li><li>发现规格缺口先更新当前规格，再改代码。</li><li>删除源码前执行启动入口、动态引用、路由、测试、迁移和恢复引用检查；只删除零依赖或已完成替代的实现。</li><li>每个重要阶段执行类型检查、全量测试、构建、迁移、运行、隔离与相关恢复测试。</li><li>完成标准以 <code>docs/ACCEPTANCE.md</code> 为准；存在测试失败、文档冲突或重大BUG时不得宣布完成。</li></ul><h2>当前文档</h2><ul><li><code>scripts/sync-project-docs.mjs</code> 的白名单是当前文档中心唯一收录范围。</li><li>白名单外的发布证据、一次性报告、临时计划、二进制元数据和无关文件不得进入当前文档中心或产品检索。</li><li>老板新决定写入 <code>docs/DECISIONS.md</code>，并同步所有受影响的当前规格。</li><li>Git历史只负责追溯，不作为默认知识库。</li><li>每次开发结算和最终回复前，只要源码、规格、Skill或任务状态发生变化，就必须运行 <code>node scripts/sync-project-docs.mjs</code> 与 <code>node scripts/sync-project-docs.mjs --check</code>；同步或检查失败不得结算。</li><li>标准 <code>npm run verify</code>、桌面文档入口、Git提交、合并和切换都会自动刷新当前文档中心。</li></ul></template><template id="document-9" data-title="验收标准" data-path="docs/ACCEPTANCE.md" data-meta="当前正式文档 · 6.6 KB · 76e16904fe91"><h1>验收标准</h1><h2>1. 完成定义</h2><p>只有当前功能、代码、迁移、测试和文档一致，且下列门禁全部有证据时才能宣布完成。测试数量不能代替真实模型长期质量证据。</p><h2>2. 工程门禁</h2><ul><li>Contracts、API、Worker、Web和测试类型检查通过。</li><li>全量自动测试通过，无跳过旧失败测试冒充完成。</li><li>四端生产构建通过。</li><li>空库迁移、旧库顺序升级和重复迁移通过。</li><li>本地启动、健康、Worker心跳、退出和再次启动通过。</li><li>运行时可达性审计四端均为0个孤儿源码。</li></ul><h2>3. 数据门禁</h2><ul><li>所有书内核心读写携带 <code>owner_id</code>、<code>book_id</code>。</li><li>跨书读取、修改、任务、附件和检索污染为0。</li><li>正文修改产生新版本，不能静默覆盖。</li><li>投影删除重建后正式源哈希不变。</li><li>普通删除可恢复；彻底删除只对已归档书开放并执行影响预览、<code>YES</code>和二次确认。</li></ul><h2>4. 工作流验收</h2><p>模拟作者完整执行：</p><ol><li>启动即进入统一创作台；创建书籍并核对全部开书信息与专业分组性格标签。</li><li>完成设定项三席独立方案、选择、融合、修订和确认。</li><li>创建并确认分卷。</li><li>生成、调整并确认事件链。</li><li>生成并确认第一个事件大纲。</li><li>评估章数并确认当前事件章纲。</li><li>在至少两个连续事件中完成至少20章单章正文、三席审查、修订、定稿和章节结算。</li><li>完成两个事件结算、当前卷结算和下一卷入口；逐章核对人物、事件与上游约束，禁止无章纲正文和无事件正文。</li></ol><p>每一步验证页面交互、AI成员介入、上下文来源、任务状态、失败恢复和作者修改。</p><p>界面同时验证：左栏只包含新建、单列固定84×118像素竖版封面书籍切换、归档与恢复，书籍列表必须单列排列并在栏内通过可见滚动条纵向滚动；在左侧书籍栏中，书名只能出现在封面内，封面右侧不得重复，封面下只显示状态或测试标签；中心“信息”页允许且必须以干净书名作为开书资料标题。新建和改名最多15字，1—4字、5—7字、8—10字、11—15字须应用四档递减字号并完整显示；已有超长标题不改写数据库，兼容显示为14字加省略号且可访问名称保留完整标题。功能栏必须直接位于页面最上方，包含信息、设定、分卷、规划、章纲、正文、资料库、取名、团队、任务、灵感和设置；不得在其上方保留“当前书籍/当前功能”摘要条或当前功能圆点标签。点击左侧切换书籍，点击顶部切换中心页面。自动验收运行键不得作为乱码或英文尾缀暴露给作者，已知测试书须显示干净中文书名和可区分的中文测试标签，数据库原始证据不得改写，普通书名不得误清理。界面默认呈现iOS式冷白蓝灰玻璃视觉，不得继续显示旧浅绿色大画布。还需验证11名成员状态卡、图谱资料库统一入口、无常驻右栏、信号图标、卷章统计条和横向导航滚动条。设定项在启动前不得预显示方案卡，作者补充和修改输入默认折叠。</p><p>灵感必须证明：只读本书已确认资料；不能修改任何正式对象；未摘录内容不进入生产上下文；作者摘录后只进入指定对象；跨书污染为0。</p><p>活动事件期间，工作流接口必须返回真实的事件版本引用。事件或卷结算后，已确认事件链、事件大纲和章纲必须继续在原页面以只读历史显示，且不能暴露会修改历史的操作。每一章还必须能从正文流水线追溯到对应的事件章纲正式版本；只有正文数量而没有逐级版本绑定，不得判定通过。</p><p>事件结算和卷结算后，章纲序列必须保持 <code>completed + valid</code>，并显示“结算版本已锁定”；正常状态推进不得显示“上层已变化，需重建”。测试必须同时覆盖事件结算后和卷结算后两种状态。</p><h2>5. 上下文与检索门禁</h2><ul><li>开书/设定不读取其他书、未摘录灵感或模型猜测。</li><li>卷、事件、章纲和正文都能追溯上层活动版本。</li><li>当前对象完整注入，上层信息无损压缩，硬约束不丢失。</li><li>混合检索覆盖结构化、FTS、向量、关系、时间/因果与原文回查。</li><li>摘要错误不能覆盖正式事实。</li><li>对抗查询、别名、否定、时间冲突、旧版本和跨书测试通过。</li></ul><h2>6. Agent与模型门禁</h2><ul><li>界面显示11名创作成员，岗位和模型来源真实。</li><li>两位编剧独立阶段互不可见；主编后置融合。</li><li>单一活动写手写正文。</li><li>事实、文学、体验使用三个独立且不同于写手的模型，互不读取报告。</li><li>模型不可用、重复来源或结果未知时明确降级/阻断。</li><li>每次调用有上下文包、预算、任务、模型快照和结果证据。</li></ul><h2>7. 创造性与质量门禁</h2><p>重要的检索、上下文、提示词、生成或审查改动必须与旧流程或弱治理基线做非劣效对照。至少评估原创性、合理惊喜、人物可辨识度、情绪力度、节奏、检索锚定和整体阅读质量。一致性提高不能抵消核心创作维度下降。</p><p>证据等级：E0规格；E1机制；E2确定性工程；E3独立盲评/真实模型；E4真实长篇纵向效果。当前工程测试只能支持E2声明。</p><h2>8. 续写验收</h2><p>导入预览不写正式章节；确认后原文不可变；分析结果带来源且为候选；不能补造历史审查；续写重新进入卷—事件流程；旧全文按需检索而非每次全量注入。</p><h2>9. 文档验收</h2><p>文档中心只包含显式白名单中的当前正式文档和当前Skill；所有现行文档必须相互一致，并且能够在同一页面阅读全文。</p><p>文档中心必须额外生成按目录汇总的单页合订版，完整收录白名单中的全部资料、原始路径和内容哈希，并提供复制全文入口。合订版与独立文档必须由同一次同步产生且校验一致。</p><h2>10. 重大缺陷</h2><p>出现跨书污染、作者原文/正文覆盖、未确认候选入正史、任务重复扣费、结果未知自动重发、模型来源伪造、迁移不可升级、服务无法启动或主流程阻塞，均不得验收。</p><h2>11. 当前E2纵向基线</h2><p>当前确定性工程基线必须以一部全新修仙测试书贯通开书、9个必要设定项、卷纲、两个事件、20份章纲、20章正文、60份独立审查报告、20次章节结算、2次事件结算和1次卷结算。正文必须包含当前书人物与设定，且不得泄漏其他测试夹具。该基线只证明对象链、上下文和恢复机制，不冒充真实套餐模型文学质量的E3证据。</p></template><template id="document-10" data-title="AI团队与介入规则" data-path="docs/AGENT_SYSTEM.md" data-meta="当前正式文档 · 3.6 KB · 7b4e58b0cc50"><h1>AI团队与介入规则</h1><h2>1. 团队组成</h2><p>每本书保持11名创作成员；岗位、Agent实例和模型绑定相互独立。同一个模型可以承担多个岗位，但界面必须如实显示，不能冒充异模型意见。</p><ol><li>主编：决定全局优先级，组织卷纲、事件和融合。</li><li>副编：帮助整理结构、来源和任务资料，不垄断数据库或检索。</li><li>编剧A：偏强冲突、反转和快速推进。</li><li>编剧B：偏递进、人物关系、铺垫和因果。</li><li>设定：检查世界、规则、能力、资源和命名体系。</li><li>主笔：当前活动正文写手。</li><li>副笔：候补写手或局部润色，不默认串行重写整章。</li><li>文学审查：语言、节奏、场景、重复和人物声音。</li><li>体验审查：目标读者代入、期待、爽点、困惑和弃读风险。</li><li>研究：只为明确事实研究任务提供有来源资料，不决定剧情。</li><li>来源与版权：执行来源、授权、原创性和风险检查，不设置独立页面。</li></ol><p>小文秘书是本地确定性工具角色，不属于11名创作成员，不给剧情结论、不冒充模型、不保存聊天记忆。</p><h2>2. 介入时机</h2><div class="table-scroll"><table><thead><tr><th>阶段</th><th>主持/执行</th><th>其他成员</th><th>输出</th></tr></thead><tbody><tr><td>开书</td><td>系统确定性校验</td><td>无</td><td>书籍、定位版本、团队、预算、设定任务</td></tr><tr><td>设定项</td><td>主编＋两位编剧独立提案</td><td>设定按需要检查</td><td>三份候选、作者选择、主编整理稿</td></tr><tr><td>分卷</td><td>主编主持</td><td>两位异模型编剧独立设计，设定/研究按需</td><td>卷候选、差异、融合稿</td></tr><tr><td>事件链</td><td>主编</td><td>两位编剧</td><td>事件序列、因果衔接、卷任务覆盖</td></tr><tr><td>事件大纲</td><td>主编融合</td><td>两位编剧独立方案，设定按需</td><td>当前事件完整大纲</td></tr><tr><td>章纲</td><td>主编或编剧执行拆分</td><td>设定/事实按需预检</td><td>完整事件章链与单章章纲</td></tr><tr><td>正文</td><td>单一活动写手</td><td>设定/研究只提供证据</td><td>单章正文候选</td></tr><tr><td>审查</td><td>三席并行</td><td>事实、文学、体验互不读取</td><td>三份独立报告</td></tr><tr><td>结算</td><td>确定性结算＋必要抽取</td><td>主编查看事件/卷偏差</td><td>事实、状态、伏笔、摘要、下一层承接</td></tr></tbody></table></div><h2>3. 独立性</h2><p>两位编剧独立阶段互不可见，不交叉投票；主编只有在独立结果全部保存后才读取并融合。三席审查使用与活动写手不同的三个模型，彼此不读取报告。模型不可用或实际来源重复时必须明确降级或阻断，不能伪装独立。</p><h2>4. 创造性边界</h2><p>上层规划提供目标、边界、因果和必须项，不规定每句写法。AI可以提出有代价的偏离方案；局部合理发挥可以直接执行，影响卷目标、事件结果、人物核心选择或正史规则的偏离必须先给作者看影响。</p><p>模板只是软参考。岗位提示词不得把质量规范、评分表或固定叙事结构全文注入模型，也不得要求每章同时满足所有爽点和审查指标。</p><h2>5. 真实状态</h2><p>状态由任务、上下文编译、模型调用、心跳和保存事件驱动：等待、准备中、工作中、完成、失败、超时、已取消、等待作者。界面不得用计时器或文案伪造工作。</p><h2>6. 失败与恢复</h2><ul><li>确定性失败可在幂等键和检查点保护下重试。</li><li>远程结果未知不自动重试，先调和。</li><li>已完成成员意见复用，未完成成员单独重做。</li><li>主编租约变化后旧结果必须通过epoch门禁。</li><li>作者退回时保留满意部分，修订只读取明确反馈和当前候选。</li></ul><h2>7. 追溯</h2><p>每个结果能追溯到任务、Agent、岗位、模型快照、上下文包、作者输入、上游版本、预算和输出哈希。不保存模型内部思维链。</p></template><template id="document-11" data-title="当前API与事件契约" data-path="docs/API.md" data-meta="当前正式文档 · 5.3 KB · 5127e058e8f9"><h1>当前API与事件契约</h1><h2>1. 通用规则</h2><ul><li>前缀：<code>/api/v1</code>；健康检查为 <code>/health</code>。</li><li>服务仅监听 <code>127.0.0.1</code>。</li><li>所有书内接口从路径获取 <code>bookId</code>，服务端同时绑定本地 <code>owner_id</code>。</li><li>成功响应包含 <code>data</code> 与请求追踪ID；失败响应包含稳定错误码、可读消息、是否可重试和必要详情。</li><li>创建/生成命令使用幂等键；版本化修改携带期望版本，冲突返回409。</li><li>长任务返回任务ID，通过任务查询和SSE观察，不在HTTP连接中假装同步完成。</li></ul><h2>2. 运行与能力</h2><ul><li><code>GET /health</code>：API与数据库健康。</li><li><code>GET /api/v1/runtime/worker</code>：Worker心跳和队列状态。</li><li><code>GET /api/v1/runtime/readiness</code>：数据库、迁移、模型与投影准备度。</li><li><code>POST /api/v1/runtime/session</code>：建立本机页面会话。</li><li><code>GET /api/v1/capabilities</code>：当前模型、检索和运行能力。</li></ul><h2>3. 书架与开书</h2><ul><li>书籍草稿：创建、更新、确认。</li><li><code>GET /api/v1/books</code>：书架。</li><li>书籍详情、开书资料、定位、表达基线、归档、恢复和彻底删除。</li><li><code>GET /api/v1/opening-taxonomy</code>：频道、分类、题材和标签目录。</li><li><code>GET /api/v1/books/:bookId/workflow</code>：当前卷—事件工作流状态。</li></ul><p>确认开书会原子创建书籍、定位版本、团队、模型绑定、预算、设定工作区和首个设定任务。</p><h2>4. 设定对象协作</h2><ul><li><code>GET /api/v1/books/:bookId/setting-outline-workspace</code>：当前设定工作区。</li><li><code>GET /api/v1/books/:bookId/setting-outline-workspace/:itemKey/collaboration</code>：当前项AI方案与任务。</li><li><code>POST .../collaboration/start</code>：主编和两位编剧独立提案。</li><li><code>POST .../collaboration/synthesize</code>：按作者选中的方案整理候选。</li><li><code>POST .../collaboration/revise</code>：按作者本轮意见修订候选。</li><li>设定项确认、跳过/留白和整份设定基线确认使用独立命令。</li></ul><p>这些接口直接读写当前设定对象、候选、作者选择和确认结果。</p><h2>5. 作者想法与附件</h2><p>作者想法按 <code>surface</code>、<code>subjectType</code>、<code>subjectId</code> 附着开书、设定、卷、事件、章纲或正文，并保存原话、意图等级、版本和状态。附件使用 <code>/author-attachments</code> 上传、读取、绑定和丢弃。</p><h2>6. 分卷</h2><p><code>/api/v1/books/:bookId/volume-plans</code> 提供列表、创建和详情。单个卷计划支持：作者输入、候选、AI生成任务、选择/融合、确认、历史切换、影响预览和结算。所有修改校验工作流版本与上游设定版本。</p><h2>7. 事件链与事件大纲</h2><p><code>/api/v1/books/:bookId/volume-plans/:volumePlanId/story-events</code> 管理事件列表、顺序、插入、移动、拆分、合并、候选生成、确认和因果衔接。单个事件通过 <code>/story-events/:eventId</code> 获取详情、生成事件大纲和执行事件结算。</p><h2>8. 当前事件章纲</h2><p><code>/api/v1/books/:bookId/story-events/:eventId/chapter-outlines</code> 管理章数评估、批量章链候选、单章详细章纲、作者修改、确认和历史版本。生成任务冻结活动卷纲、事件链、事件大纲和作者输入。</p><h2>9. 正文与审查</h2><p>章节接口提供目录、写作工单、单章生成、状态、稿件版本、作者编辑、定点修订和定稿。正式生产一次只处理一章。三席报告分别读取和展示；作者定稿后才能执行章节结算。</p><h2>10. 续写与反向拆解</h2><p>已有正文接口支持文件/文本导入、解析预览、章节顺序确认、不可变入库、分析任务、来源查看和反向规划候选。分析完成后通过设定、卷、事件和章纲对象继续。</p><h2>11. 图谱、资料库、检索和取名</h2><p>按书提供人物状态、实体、事实、关系、时间线、伏笔、来源、缺口、图谱投影、混合检索和命名候选。检索响应标注来源、版本、证据等级和降级状态；不暴露其他书结果。</p><h2>12. 团队、任务与模型</h2><ul><li>团队模板、逐书成员、岗位公开说明、真实状态和模型绑定。</li><li>任务中心、任务详情、暂停、取消、失败重试和结果未知调和。</li><li>模型调用、预算和用量只显示可审计元数据，不返回密钥或思维链。</li></ul><h2>13. 备份、恢复和删除</h2><p>备份、导出、导入和恢复操作均有操作ID、状态和校验结果。普通删除为归档。彻底删除只允许已归档书，先查看影响，再输入大小写不敏感的 <code>YES</code> 并二次提交；服务端原子清理并写墓碑。</p><h2>14. SSE事件</h2><p>事件至少覆盖任务排队/开始/阶段/完成/失败/取消，模型调用开始/完成/中断，预算变化，投影水位，书籍版本变化和Worker心跳。事件只是状态通知，客户端重新读取正式对象作为最终状态。</p><h2>作者可见功能名合同</h2><p>接口向作者返回的功能名称统一为：信息、设定、分卷、规划、章纲、正文、资料库、取名、团队、任务、灵感、设置。公开显示名来自 Contracts 共享合同。</p><p>API路由、请求字段和数据库surface继续使用稳定英文键，不随显示名改动：book_profile、setting、volume_plan、event、chapter_outline、manuscript。这样已有书籍、幂等键、任务恢复、上下文包和来源引用不需要迁移。接口返回历史自由文本前必须经过作者展示清洗，把旧称转换为当前名称，但不回写历史记录。</p></template><template id="document-12" data-title="系统架构" data-path="docs/ARCHITECTURE.md" data-meta="当前正式文档 · 4.1 KB · 28738f21024a"><h1>系统架构</h1><h2>1. 总体形态</h2><p>本地模块化单体加独立 Worker：</p><pre class="code-block"><code data-language="text">React/Vite Web → Fastify REST/SSE → Application Services → Repositories → SQLite/Files
                                      ↓ outbox/tasks
                                  Independent Worker → Model adapters / projections</code></pre><p>服务只监听 <code>127.0.0.1</code>。不使用微服务、WebSocket或需要独立运维的向量/图数据库。</p><h2>2. 模块边界</h2><ul><li>Web：统一创作台、书籍切换、对象编辑、团队/任务状态、隔离灵感、报告和辅助工具。</li><li>API：认证、校验、领域命令、查询投影、任务排队、SSE。</li><li>Worker：领取长任务、编译上下文、调用模型、保存候选和重建投影。</li><li>Contracts：跨端共享的请求、响应和事件类型。</li><li>Repositories：业务代码访问SQLite的唯一入口；新增应用服务不得直接写SQL。</li><li>Files：不可变正文、导入原件、附件、备份和可重建投影文件。</li></ul><h2>3. 当前工作流编排</h2><p>开书、设定、卷纲、事件、章纲、正文和结算分别使用明确领域对象与版本链。任务冻结上游版本、作者输入、模型绑定、预算和上下文包。上游改变时下游候选失效或重新确认，不静默沿用。</p><p>对象页面直接启动正式AI任务并展示结果；正式生产不依赖聊天入口、消息回复流水线或会话记忆。灵感是隔离的辅助域，只保存讨论轮次和引用，不能调用正式对象写入；只有作者主动摘录并绑定业务对象后才转成 <code>author_planning_inputs</code>。</p><h2>4. 写入模型</h2><p>SQLite使用单写者事务、外键、WAL和向前迁移。每项核心写入携带 <code>owner_id</code>、<code>book_id</code>。跨书访问在Repository入口校验。</p><p>正文使用不可变完整版本。Worker只能保存任务结果、候选、调用记录和投影，不得直接覆盖正式正文或正史。作者确认由API事务提交。</p><h2>5. 任务与恢复</h2><p>任务状态：pending → queued → working → succeeded/failed/cancelled/paused/blocked。领取使用租约、attempt编号和lease token；模型结果提交还校验主编epoch。结果未知时冻结并等待调和，不盲目重试远程调用。</p><p>每次模型调用保存：任务、Agent、模型快照、输入哈希、上下文包、预算预留、耗时、Token、结果哈希和最终状态。不保存思维链。</p><h2>6. 上下文与检索</h2><p>确定性 ContextCompiler 按任务编译资料：先取活动版本与结构化直达，再按实体、时间、因果、伏笔、声音和来源触发混合检索。SQLite是正式源；FTS、LanceDB、Wiki、图谱和摘要都是可重建投影。</p><p>检索永远携带书籍隔离键；其他书、未摘录灵感、过期版本、无关候选和模型猜测不能进入生产上下文。灵感自己的检索只读取当前书已确认正式源，不能读取其他讨论会话作为事实。</p><h2>7. 模型与Agent</h2><p>岗位、Agent实例和模型绑定分离。卷纲与事件规划可并行调用两位互不可见的异模型编剧，随后由主编融合；正文只有一个活动写手；事实、文学、体验三席使用三异模型独立审查。</p><h2>8. 文件与附件</h2><p>作者附件绑定具体开书、设定、卷、事件、章纲或正文对象。原件不可变，解析文本和预览可重建；公开API和运行时统一使用作者附件语义。</p><h2>9. 前端布局</h2><p>桌面端为左侧纯书籍栏、顶部完整功能栏和中心创作台。书籍栏只切换书；功能栏统一切换信息、设定、分卷、规划、章纲、正文、资料库、取名、团队、任务、灵感和设置。不设第二套对象导航或常驻成员右栏。默认使用iOS式浅色玻璃视觉。窄屏时书籍栏变抽屉、功能进入紧凑菜单。创作台内部按对象加载，正文和长列表虚拟化或分页。任务通过SSE更新，不伪造进度。</p><h2>10. 构建与可达性</h2><p>启动入口为API、Worker、Web和共享Contracts。<code>scripts/audit-runtime-reachability.mjs</code> 必须报告四端零孤儿源码。生产构建、类型检查、全量测试、迁移和启动验证均为发布门禁。</p></template><template id="document-13" data-title="长篇小说资料切片最终设计" data-path="docs/CHUNKING_DESIGN.md" data-meta="当前正式文档 · 23.0 KB · e4ea8ceeeb39"><h1>长篇小说资料切片最终设计</h1><h2>1. 明确结论与置信度</h2><p>文秘写作采用“不可变原始资料＋结构节点＋父子检索块＋原子事实”的多粒度切片，不采用整章单块、全资料统一固定字数或无条件重叠。切片只负责定位和取回资料，不能替代原文、事实、规划层级或正史版本。</p><p>设计结论置信度为高：结构优先、父子检索、原子事实、来源回链、版本化快照和最小充分扩展能够直接对应长篇小说的语义边界、故事时间、人物认知和注意力问题。具体字符目标值置信度为中：本文给出可运行的初始默认值，但默认值必须在目标电脑和独立中文小说金标上与固定切片、纯语义切片比较后锁定。参数调优属于版本化实现配置，不重新决定权威架构。</p><p>本设计已在当前长篇release实现为 <code>content_chunks</code>、分类型结构切片、FTS/LanceDB可重建投影和多来源切片快照原子切换，并取得500万字符/1500章E2工程证据。当前机器未发现已验证本地嵌入资产时向量通道如实降级；E2不能冒充E3语义金标或E4文学质量提升。</p><h2>2. 当前事实基线</h2><ul><li>正文已经使用不可变完整文件和内容哈希，SQLite保存业务权威与文件指针。</li><li>当前运行时检索只有结构化事实、SQLite FTS5/BM25和固定同义词扩展；尚无真实向量、父子块或分类型切片。</li><li>DEC-012已确定SQLite权威源、LanceDB可重建向量投影、SQLite关系/Wiki和混合检索；DEC-016已确定临时、候选、正史、派生四层生命周期。</li><li>目标单书规模为500万规范化中文字符、1500章；较早卷和事件默认使用结算摘要导航，关键实体、规则、承诺、因果或冲突触发后下钻原文。</li><li>需要保护的不只是召回率，还包括人物声音、原创性、情绪力度、合理惊喜和整体阅读质量；大段历史正文可能提高事实覆盖却压低创作新鲜度。</li></ul><h2>3. 能力追踪矩阵</h2><div class="table-scroll"><table><thead><tr><th>痛点/可观察失败</th><th>根因</th><th>最终机制</th><th>最强反例</th><th>验证证据</th></tr></thead><tbody><tr><td>对白和回答被拆开</td><td>固定长度不理解语义单元</td><td>段落、对白轮次、动作—反应优先；字符数只作软边界</td><td>超长独白仍可能超过模型适合长度</td><td>边界完整率、人工错误集、召回对照</td></tr><tr><td>命中一小段却缺上下文</td><td>只有扁平块</td><td>场景根→场景节拍父块→检索子块；按问题有界扩父/邻块</td><td>父块过大仍会分散注意力</td><td>证据完整率、注入Token、位置敏感测试</td></tr><tr><td>同一段被重复召回</td><td>盲目文本重叠和多种派生重复</td><td>默认不复制重叠；使用前后邻接、来源范围和派生去重</td><td>边界查询可能因零重叠漏召回</td><td>与80—120字符重叠基线消融</td></tr><tr><td>“人物以为”变成客观事实</td><td>文本块没有观点与叙事模式</td><td>故事时间、视角、说话人、认知范围、回忆/梦境/计划元数据</td><td>自动抽取可能误判含蓄叙述</td><td>谎言、误解、反事实和不可靠叙述对抗集</td></tr><tr><td>正文修订后命中旧块</td><td>块和索引没有来源版本/水位</td><td>不可变切片快照、正史版本硬过滤、原子切换、旧快照失效</td><td>切换中断可能留下半成品</td><td>中断、重复执行、旧版本和重建故障注入</td></tr><tr><td>通用对白“你来了”检索错误</td><td>子块缺实体和场景语境</td><td>证据原文与嵌入文本分离；嵌入文本加入最小上下文头</td><td>头信息过多会形成标签锚定</td><td>无关键词、同句异人/异场景金标</td></tr><tr><td>检索更准但正文更像旧文</td><td>相似场景和风格片段注入过多</td><td>主笔只取最小硬证据和2—4条可选声音证据</td><td>过少证据可能丢失人物声音</td><td>全量包、最小包、硬事实包成对盲评</td></tr><tr><td>重复台词或意象被错误删除</td><td>全局内容哈希去重忽略叙事位置</td><td>原始位置均保留；只在单次结果中按来源/派生关系去重</td><td>真正重复噪声会占候选</td><td>重复、呼应、刻意复沓样本</td></tr></tbody></table></div><h2>4. 最强替代方案与取舍</h2><div class="table-scroll"><table><thead><tr><th>方案</th><th>优点</th><th>主要代价</th><th>结论</th></tr></thead><tbody><tr><td>固定500字符＋100字符重叠</td><td>实现最简单、易复现</td><td>切断对白/因果、重复多、跨结构污染</td><td>作为基线，不作为默认</td></tr><tr><td>整章或整场景单块</td><td>上下文完整</td><td>检索粒度粗、Token高、长场景注意力差</td><td>只保留导航父节点，不直接默认注入</td></tr><tr><td>纯模型语义切片</td><td>可识别复杂边界</td><td>非确定、成本和恢复一致性差，模型升级会改变全部边界</td><td>可作实验候选，不作为权威默认</td></tr><tr><td>纯句子/段落切片</td><td>来源精确</td><td>缺少场景上下文，多跳和隐含因果弱</td><td>作为叶子边界来源，不单独使用</td></tr><tr><td>结构语义＋父子块＋原子事实</td><td>同时支持精确召回、上下文扩展、确定性事实和可重建</td><td>Schema、切片器、快照和评测更复杂</td><td>最终采用</td></tr></tbody></table></div><p>最强替代是固定长度切片。它更便宜，但其错误恰好集中在小说最重要的对白、动作—反应、场景转折和叙事视角，因此只适合做可比较基线。推荐方案增加的复杂度全部位于可重建投影，不增加第二权威源。</p><h2>5. 预先验尸与反例</h2><p>假设方案在第1000章失败，最可能的传播路径是：边界识别把场景切错→向量只命中半个因果链→Wiki从半块抽取错误结论→上下文把错误投影交给编剧/主笔→新章进一步固化错误。修正是让重要结论必须回查原子事实或原文，并使切片、Wiki和向量都保持可失效投影。</p><p>其他高风险反例：</p><ul><li>一个场景跨越两个章节，若强行生成跨文件父块，会增加版本与恢复复杂度；因此章节仍是文件硬边界，用 <code>continues_scene_id</code> 连接连续场景。</li><li>一段超长独白、诗歌、书信或属性面板不能按普通段落处理；因此保留块类型并采用专用降级切分。</li><li>梦境、回忆、预言、人物计划和假想战斗语义相似，但故事时间和真实性不同；因此叙事模式与事实状态先于向量相似度过滤。</li><li>全局去掉相同文字会删除有意复沓、口头禅和伏笔呼应；因此不对不同来源位置做物理去重。</li><li>大量场景标题、标签和人物名拼入嵌入文本会提高表面召回但压倒正文语义；因此上下文头必须短、稳定、版本化，普通标签不拼入。</li><li>更细的块可能提高Recall@K，却使主笔收到碎片化材料并降低整体写作；因此检索指标和创作非劣效必须同时通过。</li></ul><h2>6. 修正后的最终设计</h2><h3>6.1 四种表示各司其职</h3><ol><li><strong>不可变原始资料</strong>：正式正文、设定、规划和历史稿件的完整文件，是最终证据。</li><li><strong>结构节点</strong>：书→卷→故事弧→章→场景→场景节拍，以及设定卡/规划节点。结构节点负责导航和范围，不必全部向模型注入。</li><li><strong>检索块</strong>：适合FTS和向量召回的子块，命中后按任务决定是否扩展父块、相邻块或关系节点。</li><li><strong>原子事实</strong>：主体—关系/属性—值—故事时间—观点主体—证据，处理生死、位置、知情、数量、关系和规则；语义检索只能帮助发现，最终判断使用结构化记录和原文。</li></ol><p>摘要、Wiki、向量和上下文头都属于派生投影，不得成为第五种权威。</p><h3>6.2 原文规范化和稳定来源定位</h3><ul><li>原文件保持UTF-8原样不可变。切片前只为索引生成独立 <code>index_text</code>：统一换行、Unicode NFC、移除BOM和无意义控制字符；不自动简繁转换，不统一标点，不改写作者空格、断句或措辞。</li><li>证据范围使用原始UTF-8 <code>start_byte/end_byte</code>、段落序号和内容哈希定位。<code>index_text</code> 必须保存回到原文范围的映射，不能把规范化文本直接当成引用证据。</li><li>每个来源版本保存 <code>source_hash</code>；每个块保存 <code>content_hash</code> 和 <code>index_text_hash</code>。来源哈希不一致时拒绝构建或使用该快照。</li><li><code>chunk_id</code> 在一个切片快照内唯一；新策略创建新快照和新块，使用 <code>supersedes_chunk_id</code>/来源范围追溯，不原地改变历史块。</li></ul><h3>6.3 正式正文层级与默认参数</h3><pre class="code-block"><code data-language="text">章节文件（权威）
└─ 场景根节点（完整导航范围，可很长）
   ├─ 场景节拍父块（上下文扩展单位）
   │  ├─ 检索子块
   │  └─ 检索子块
   └─ 场景节拍父块</code></pre><ul><li>场景根由明确分隔符、时间/地点/视角变化、叙事目标或主要冲突变化、行动—反应链闭合共同判断。只换说话人不构成新场景。</li><li>已确认章纲和场景契约只可作为边界提示，不能强迫已经写出的正文服从计划边界；实际原文结构与章纲不一致时保存偏离关系并以原文证据为准。</li><li>边界置信不足时不伪造精确场景，降级为同章段落组并标记 <code>boundary_confidence</code>；重要检索可以扩展邻块或回到章内原文。</li><li>场景节拍父块初始目标1200—3000个中文字符，软上限4500；完整短场景可以直接成为一个父块。父块主要用于有界扩展，不默认全部嵌入上下文。</li><li>检索子块软下限350、目标约500—600、软上限700、默认硬上限1000个中文字符。完整对白轮次、动作—反应对、句子和短诗节优先保持完整；语义单元略超软上限时允许保留。</li><li>超过硬上限的单段先按句子切；超长单句再按不破坏引号、括号、列表项和因果连接的分句切。超长独白各子块保持同一说话人和连续组ID。</li><li>实际嵌入模型的输入Token上限高于字符规则优先级：任何块连同上下文头超过模型安全输入预算时，必须继续按语义边界拆分，不能依赖模型静默截断。</li><li>过短段落只允许与同场景、同叙事功能的相邻段合并；不得为了凑长度跨场景、跨视角或跨叙事模式拼接。</li><li>章节是物理硬边界。跨章连续场景通过 <code>continues_scene_id</code>、前后节点和事件关系连接，不创建跨两个不可变文件的物理块。</li></ul><p>字符目标值只控制异常长短，不推翻语义边界。实现时同时记录中文字符、Unicode码点、UTF-8字节和实际模型Token，不能用固定“字符=Token”换算。</p><h3>6.4 默认不复制重叠</h3><ul><li>检索子块默认原文零复制重叠，使用 <code>prev_chunk_id/next_chunk_id</code>、父块和事件/实体边补足边界上下文。</li><li>命中位于子块首尾、查询涉及因果/对白承接或重排置信不足时，允许按预算扩展一个同场景邻块，并记录 <code>expansion_reason</code>。</li><li>80—120字符的同场景重叠保留为基准实验策略。只有独立金标证明它提高边界证据完整率，且重复注入、磁盘、延迟和创作锚定均不过门槛时，才可成为新版本默认。</li><li>父块包含子块属于结构包含，不算重复索引；组包时不能同时无差别注入父块和其全部子块。</li></ul><h3>6.5 设定、规划、事实与派生资料</h3><div class="table-scroll"><table><thead><tr><th>资料类型</th><th>父级/子级</th><th>初始子块目标</th><th>特殊规则</th></tr></thead><tbody><tr><td>人物/势力/地点/物品设定</td><td>实体卡→身份、能力、限制、历史、状态、关系、知情等方面</td><td>100—600字符</td><td>客观事实、人物认知、秘密、谎言和推断分开</td></tr><tr><td>世界规则</td><td>规则卡→条件、效果、限制、例外、代价</td><td>100—600字符</td><td>规则与例外建立显式关系，不合并冲突版本</td></tr><tr><td>总纲阶段/故事弧/章纲</td><td>层级节点→目标、冲突、必须结果、可选节拍、承诺、开放问题</td><td>100—500字符</td><td><code>planned/active/fulfilled/abandoned/superseded</code> 分开；章纲引用相关总纲阶段和确认故事弧；计划不冒充已发生事实</td></tr><tr><td>原子事实</td><td>结构化断言→确定性可读渲染</td><td>一条断言</td><td>不做文本重叠；嵌入只用于发现，裁决回到事实与证据</td></tr><tr><td>Wiki</td><td>实体页→一个主题段</td><td>150—500字符</td><td>每条结论回链事实或原文；整页不作为一个向量块</td></tr><tr><td>人物声音/表达证据</td><td>人物/叙述者→已确认短片段</td><td>150—400字符</td><td>独立受限索引；主笔默认最多2—4条，标注可不用、不可仿写原句</td></tr><tr><td>场景/章节/弧/卷摘要</td><td>层级连续性节点</td><td>按字段和来源范围</td><td>锚定事实与原文增量生成；不能无来源地递归总结摘要</td></tr><tr><td>作者想法/方案候选/草稿</td><td>业务对象与任务→问题组/暂存场景</td><td>按对象与任务边界</td><td>仅对象或任务临时索引，不进正式索引，不跨任务默认召回</td></tr><tr><td>研究/拆书资料</td><td>研究任务/来源→主张/短摘录/结构卡</td><td>按证据边界</td><td>与创作索引物理和权限隔离；版权原文不得进入主笔包</td></tr></tbody></table></div><p>结构化表格、属性面板、诗歌、书信、日志和聊天体正文保留 <code>block_type</code>。表格/属性面板优先解析为结构化字段并保留整块原文证据；诗歌、书信和日志优先保持作品内部结构，不强行与普通叙事段落合并。</p><h3>6.6 块元数据合同</h3><p>每个块至少携带：</p><ul><li>隔离：<code>owner_id</code>、<code>book_id</code>、权限域；</li><li>来源：类型、ID、不可变版本、原文哈希、字节范围、段落范围；</li><li>结构：章、场景、节拍、父块、前后块、顺序、块类型；</li><li>粒度：<code>leaf/parent/summary</code> 检索层级、是否参与FTS/向量、是否允许直接注入；</li><li>叙事：故事时间范围、叙事时间、视角人物、说话人、地点、叙事模式；</li><li>语义：实体/事件绑定及抽取状态；自动抽取保持候选，不能因绑定就成为事实；</li><li>权威：临时/候选/正史/派生、事实状态、正史版本、有效/失效/已替代状态；</li><li>投影：切片策略版本、规范化策略版本、嵌入文本策略版本、嵌入模型快照、索引水位；</li><li>质量：边界置信、是否允许默认注入、异常长块原因和校验状态。</li></ul><p>叙事模式至少区分当前客观叙事、人物认知、对白主张、回忆、梦境、预言、计划、假设/反事实、文中作品和不可靠叙述。无法可靠判断时保存未知，不用模型猜测填满。</p><h3>6.7 嵌入文本与原文证据分离</h3><ul><li>向量输入使用 <code>embedding_text = 最小上下文头＋index_text</code>。上下文头可以包含资料类型、章/场景名称、视角、说话人和少量稳定实体名，解决“他来了”“这里不安全”等脱离场景后无法区分的问题。</li><li>叶子块是精确检索主通道；场景节拍父块可以在独立 <code>parent</code> 粒度作为宽主题向量候选，但不重复建立父块FTS正文。父块命中后重排其子块或提取最小原文范围，不能把父块及全部子块一起注入。</li><li>上下文头不是正文、事实或引用证据，检索展示和最终回答必须回到原始范围。</li><li>普通标签、模型推断、长摘要、全部别名和任务提示不得拼入嵌入文本。上下文头策略变化只重嵌受影响块，并创建新 <code>embedding_text_policy_version</code>。</li><li>FTS保留精确原文通道；简繁、别名、简称和同义关系通过结构化别名/查询扩展处理，不改写原始块。</li><li>所有检索原文、研究材料和临时稿在上下文包中以有边界的“引用数据”传递；其中出现的提示词、命令、工具要求或权限声明均不得改变系统指令、岗位权限和工具调用。</li></ul><h3>6.8 构建、增量更新与原子切换</h3><pre class="code-block"><code data-language="text">读取不可变来源版本
→ 生成结构节点与叶子块
→ 校验范围、父子、顺序、哈希和覆盖
→ 构建FTS/向量/关系/Wiki新快照
→ 运行快照探针
→ 在SQLite事务中原子切换当前清单和水位
