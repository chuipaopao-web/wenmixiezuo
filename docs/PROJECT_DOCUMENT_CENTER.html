20同场景重叠作为消融变量。</li><li>题材覆盖对话密集、战斗、悬疑、群像、多视角、说明密集、非线性时间和文中作品。</li><li>分别报告Recall@K、Precision@K、MRR、nDCG、边界证据完整率、错误实体/时间率、无答案准确率、重复注入率、上下文Token、P50/P95延迟、构建时间、重建范围、磁盘和内存。</li><li>硬状态正确率100%、跨书污染0、来源回链100%；其余阈值在看结果前由独立评测方案按题材和样本冻结，不能看完结果后降低门槛。</li></ul><h6>E4：真实创作影响</h6><p>用真实岗位模型比较最小父子块上下文、固定切片、整章/全量包和只有硬事实基线。先做跨人物/场景/题材多样本盲评，再进入20/50/100—200章纵向评测；只有实际覆盖1000章以上和目标字数范围，才能声明相应规模的长期效果。</p><p>E3检索提升不能替代E4文学质量证据。任何核心创造性维度低于预设非劣效门槛，默认策略不通过。</p><h5>9. 剩余风险与未知项</h5><ul><li>中文小说不同题材、排版和平均段落长度差异较大，350—700、1200—3000和4500只能作为初始默认值；最终锁定需要独立基准。</li><li>自动场景边界、说话人、视角和叙事模式识别可能误判含蓄转换或不可靠叙述；低置信必须允许未知和原文回查。</li><li>最小上下文头可能提高实体区分，也可能产生名称锚定；需要与无头文本做消融。</li><li>零复制重叠减少重复，但可能降低边界改写召回；邻块扩展与小重叠必须通过同一金标比较。</li><li>本地嵌入模型、量化、维度和分词对中文长文本的最佳组合仍取决于目标电脑实测。</li><li>E0完整设计不能证明切片器可运行、检索更准或正文更好；这些结论分别需要E1—E4。</li></ul><h5>10. 停止、回滚和升级条件</h5><ul><li>来源范围无法精确回链、叶子覆盖存在缺口、块跨书/跨权限、当前与旧正史混用时，停止构建和正式检索。</li><li>新快照未完成探针或原子切换时不得上线；失败后保留上一有效快照，若其版本过旧则降级结构化＋FTS或阻断相关正式任务。</li><li>独立金标中边界完整、无答案、时间/实体正确性未优于最佳简单基线，保持简单基线，不因设计复杂而强行启用。</li><li>创造性、人物声音、情绪力度或整体阅读质量低于预设非劣效门槛时，回滚切片策略、上下文头、父/邻块扩展或软资料数量；不回滚正史、安全、版权和隔离门禁。</li><li>只有目标电脑实测证明版本化父子切片在容量、延迟或恢复上不能达到门槛，才提交引入其他索引服务或重大架构改变；不能因为框架流行而升级。</li></ul><h5>11. 当前施工边界</h5><p>切片Schema由0012新增，迁移只建结构；重切片和嵌入由Worker后台执行。已有书籍先创建非活动快照，完成叶子覆盖、UTF-8范围、父子/邻接、来源哈希、跨书零命中和冻结检索探针后，才按书原子切换。构建失败或中断时继续使用上一活动快照，不能暴露半套块或在迁移事务里同步重切全书。</p><h5>12. 分层设计资料的切片边界</h5><p>四项核心设定和当前任务正式对象通过结构化直达进入ContextPack，不依赖向量切片拼回全文。可选设定仍生成可回查切片，但命中后必须按正式对象和版本取回完整有效字段，不能把一个相似片段当成整项设定。</p><p>卷路线、故事脊柱、第一卷开篇计划、事件链、事件大纲和章纲分别保持对象边界及依赖版本；切片不得跨对象拼接计划与实际，也不得跨卷、跨事件或跨书形成伪因果。</p><p>字符切片只服务检索证据。硬事实、当前任务和不可变原文是否完整由ContextCompiler的直接源门禁保证；任何模型输入上限不足都要在编译阶段明确阻断，不能依赖模型或字符串函数静默截断。</p><hr><h3>长篇小说创作质量与工作流规范 V2</h3><blockquote>当前源文件：<code>docs/LONGFORM_QUALITY.md</code> · 指纹：<code>f175fa7f6fa2</code></blockquote><h4>长篇小说创作质量与工作流规范 V2</h4><blockquote>生效日期：2026-08-09<br>适用版本：<code>wm-longform-r1-20260719-003435-e4d7b8b7</code><br>设计审查：<code>DR-20260809-volume-event-quality-v2</code><br>当前工作流：卷驱动事件链 V2</blockquote><h5>1. 目的</h5><p>本规范用于保证长篇小说在持续创作中保持事实可靠、规划可追溯、人物有生命力、事件有因果、正文有创造性、失败可恢复，并让作者始终拥有最终决定权。</p><p>本规范不是AI成员的逐项写作评分表，也不是产品岗位和模型配置的上级规则。它不固定团队人数、岗位名称、模型供应商、永久上下文字段或叙事公式；实际岗位和模型绑定由当前《AI成员系统》与活动配置决定。</p><h5>2. 现行边界</h5><h6>2.1 不设创作质量层级</h6><p>不再建立面向作者或AI成员的“质量层级、质量分层报告、逐层过关”机制。质量问题按当前工作流节点、影响和证据直接报告，不用等级驱动创作。</p><p>E0—E4只表示工程结论的证据强度，不能表示小说档次，不能注入创作提示词，也不能限制AI方案。</p><h6>2.2 对象化协作与作者原话</h6><p>作者只在明确的开书、设定、卷纲、事件、章纲和正文对象上推进正式创作，不使用聊天推进或抽象创作模式分流。独立灵感只提供启发，不能推进正式状态或写入正式对象。</p><p>作者在开书、设定、卷纲、事件、章纲和正文对象旁直接输入想法、附件与修改意见。AI成员直接提交方案；作者选择、局部融合、编辑、退回或确认。</p><p>正式生产不建立聊天记忆、会话摘要或对话检索源。独立灵感默认隔离；只有作者主动摘录并绑定目标对象的片段，才作为带来源的作者原话进入正式流程。作者原话必须保留在明确业务对象上，并区分：</p><ul><li>必须遵守；</li><li>强偏好；</li><li>灵感参考；</li><li>待回答问题。</li></ul><p>任务、候选、选择、调用、来源、版本和恢复记录继续保存，但它们是业务与审计记录，不是聊天记忆。</p><h6>2.3 不把规范全文注入创作上下文</h6><p>本规范和对应Skill只用于开发设计、故障诊断与验收。AI成员只接收当前任务所需的最小事实、规划、作者原话和创作边界；不得接收本规范全文、工程证据等级或全量检查清单。</p><h6>2.4 作者界面信息洁净</h6><p>顶部功能栏已经说明当前功能，中心页不得再次堆叠同名标题、宣传副标题和固定使用说明。同一含义只在最接近操作的位置显示一次；对象名称、真实进度、错误、风险、版本影响和待作者决定的内容仍必须可见。</p><p>普通创作页面用自然语言解释真实任务状态，不直接显示任务ID、内部状态或阶段键、检查点、ContextPack、哈希、JSON、SQL、Worker、SSE、原始供应商路径或模型内部ID。技术证据继续保存在后台任务、调用和审计记录中，不能因为前端隐藏而删除。未知状态不得回退显示机器键，统一转成“正在处理”或“需要处理”。</p><p>静态帮助只在首次空状态、危险操作、不可逆影响或容易误解的决策点按需出现；能够从按钮、字段、对象和进度直接理解的内容不再重复解释。</p><h6>2.5 大白话展示门禁与语义保护</h6><p>所有动态文字必须经过统一作者展示门禁后才能进入普通创作页面。门禁至少区分界面说明、真实进度、错误反馈和故事文本：前三类翻译术语、过滤内部编号与机器键并给出自然语言恢复动作；故事梗概、章纲叙述、正文和作者原话不得机械替换人物用词、世界观术语或剧情语义。故事文本若混入资料回查、正史管理、结算规则、质量理由、测试解释或“为什么这样写”等内部治理说明，不能翻译后继续冒充小说，必须停止展示并提供重新生成或修改入口；后台原件和失败证据不得删除。</p><p>关键选择控件必须可见、稳定且可键盘操作。切换作者意见强度不得触发提交、导航、页面重载或滚动跳转；不得以透明绝对定位控件承载会改变当前视图的核心选择。</p><h5>3. 当前权威工作流</h5><pre class="code-block"><code data-language="text">开书信息
→ 设定
→ 分卷
→ 当前卷事件链
→ 当前事件大纲
→ 当前事件完整章节序列
→ 近期一至三章详细章纲
→ 单章正文
→ 章节结算
→ 事件结算
→ 卷结算
→ 下一卷</code></pre><p>只细化当前一卷。卷长、事件长、章节数和节拍数都是可修订估计，不是硬规则。</p><h5>4. 数据与规划权威</h5><h6>4.1 已发生事实</h6><p>以下内容可以成为已发生事实：</p><ol><li>作者确认的开书信息与设定正史；</li><li>作者定稿的不可变正文版本；</li><li>从定稿正文和既有正史生成并确认的章节、事件和卷结算；</li><li>带明确来源的人工修订。</li></ol><h6>4.2 未来规划</h6><p>分卷、事件链、事件大纲和章纲都是未来创作的活动规划，不是正史。</p><ul><li>卷纲约束本卷目标、核心冲突、主要因果、人物变化、高潮、卷末状态和下一卷接口；</li><li>事件链约束卷内事件职责、顺序和因果衔接；</li><li>事件大纲约束当前事件的入口、行动、结果、代价和下一触发；</li><li>章纲约束本章功能、关键场景和结束状态。</li></ul><p>规划不能直接写入资料库正史。正文实际结果与规划不同，以作者确认正文及结算为“已经发生”，后续规划是否修订由作者决定。</p><h6>资料库语义门禁</h6><p>资料库必须把作者确认设定、正文正式实体与事实、人物当前状态、正文实际事件时间线分开。势力、地点、道具和生效规则不能用同一批设定卡重复填充；主角从配角索引排除。配角、势力、地点、道具/资源使用各自的可选语义档案：配角可记录身份、年龄、性格、门派、境界、属性、装备与关系；势力可记录规模、实力、等级、驻地与地位；道具资源可记录属性、效果、数量、归属和流转。正文或确认设定没有依据的字段必须显示未知，不能为了卡片完整而补造。</p><p>主角状态是可追溯账本，不是静态人物简介。获得、更新、消耗和失去的物品/资源，境界、属性、技能、伤势与身份变化都应在正文明确时记录发生章节或故事时间；未知保持未知。地点资料与世界路线图分开：路线从明确出生地或首个正式场景开始，只按正文到达章节连接，不猜坐标与方位。事件时间线聚合正文已结算事件，作者可见层只显示故事时间或章节范围加事件名；规划只留在后台作为归属和差异对照。</p><p>类型化资料是检索入口，不是创作公式。ContextCompiler只能按当前任务和活动版本选择必要档案，不得因为存在字段模板就把全部人物、势力、地图和道具塞入每次调用，也不得阻止AI提出符合上游约束的新内容；新内容在作者确认或正文结算前仍是候选。</p><h6>4.3 派生层</h6><p>摘要、Wiki、图谱、全文索引、向量、关系投影、标签和质量统计均可重建，只用于导航、检索和诊断，不能成为事实权威。</p><h5>5. 规划版本与依赖</h5><p>设定、卷纲、事件和章纲的每次AI生成、作者修改或融合都产生新版本，不静默覆盖。</p><p>正式正文任务必须冻结：</p><ul><li>活动开书/设定版本；</li><li>活动卷纲版本；</li><li>活动事件版本；</li><li>活动事件章节链版本；</li><li>当前章纲版本；</li><li>工作流版本和模型绑定快照。</li></ul><p>确认上游新版本前，系统显示改变字段和受影响的事件、章纲、正文候选与任务。确认后，错版下游候选必须失效、等待重核或由作者明确保留，禁止静默重写。</p><h5>6. 作者意见与AI方案闭环</h5><p>每个规划节点使用同一闭环：</p><ol><li>作者输入原话、附件、偏好强度和目标对象；</li><li>系统冻结活动上游版本；</li><li>ContextCompiler为实际参与的AI成员分别编译任务包；</li><li>成员直接输出独立方案；</li><li>前端展示方案共同点、实质差异、代价、未知和来源；</li><li>作者可选整份、按部分融合、直接编辑、退回或不采用；</li><li>融合成员只在作者明确选择后整合被选部分；</li><li>作者再次确认后生成活动版本；</li><li>系统计算下游影响并给出下一步。</li></ol><p>AI方案不自动投票、不自动确认，不用“多数意见”替代作者决定。同一模型承担多个岗位时必须如实显示，不得冒充异模型共识。</p><h5>7. 分层节奏规则</h5><p>专业叙事方法只在后端版本库、任务快照和审计中存在。卷级任务从方法库组合两个不同骨架，但作者只看到针对本书写成的具体路线；事件级只允许不选、单选一种阅读感受或输入自己的话，不能拼接多套完整节拍。</p><p>卷候选至少有两条路线，且在动机、升级、选择代价、高潮解决或卷末局面中的至少两项实质不同。普通创作界面不显示“猫咪写作、三幕式、五幕式”等来源，只说明主角如何行动、经历什么、怎样解决、代价和后续影响。作者可以选择、融合、编辑或不用，内部方法快照不能变成硬公式。</p><p>第一卷路线强制携带开篇职责，但职责仍按本书具体化：</p><ul><li>前500字建立立即可感知的变化、困境、欲望或异常；</li><li>第一至第三章分别抓住读者、首次兑现并扩大压力、完成小闭环并打开更大目标；</li><li>约10万字以内或第一卷结束前完成一次改变局面的重大高潮。</li></ul><p>这些要求不能翻译成固定爽点、反转、打脸或高潮频率，也不能要求每章重复同一种节拍。</p><p>事件规划默认把现有正式字段即时投影为故事视图：区分已经发生的上一幕与未来预计承接，以具体行动、困境、选择和结果变化帮助作者理解；细节视图继续完整保留结构化字段。展示投影不落成第二套正史，不补写无依据事实，也不以固定“但是/没想到”句式或数值张力曲线限制AI发挥。</p><h5>8. ContextCompiler与任务型上下文</h5><h6>8.1 总原则</h6><p>上下文由确定性ContextCompiler按任务编译，不由某个AI岗位垄断数据库或检索。岗位可以变化，任务所需信息随当前书、当前节点和活动版本变化。</p><p>每个ContextPack至少记录：</p><ul><li><code>owner_id</code>、<code>book_id</code>；账号归属只能来自已验证会话。首位管理员接管历史本机owner只改变访问归属，不改写故事对象；其他用户owner必须完全隔离；</li><li>任务类型与目标对象；</li><li>活动版本和修订号；</li><li>作者原话及强度；</li><li>直接权威源；</li><li>约束强度：硬事实、当前任务、软参考或创作空白；</li><li>真值状态：计划、确认或实际；</li><li>业务范围和依赖版本；</li><li>检索查询、纳入与排除理由；</li><li>冲突、裁剪、预算和来源指纹；</li><li>ContextCompiler版本。</li></ul><h6>8.2 完整输入与无损压缩</h6><p>开书信息体量有限，开书和设定任务直接接收完整活动版本。从卷纲开始按层组织资料：四项核心设定全文常驻，与任务相关的可选设定全文进入，其他可选设定只给目录并允许回查。压缩必须完整覆盖选中的有效字段，不是只生成几句摘要。</p><p><code>BookCorePack</code>必须覆盖作者填写的全部开书信息：书名、定位/卖点、题材与标签、目标读者、预计规模、节奏/风格、初始角色、身份、性格、目标、核心机制/金手指、开篇场景、自定义信息、必须项、强偏好、灵感、问题和附件引用。空字段保留为空，AI不得补造。</p><p>设定、卷纲和事件分别形成可回查原文的 <code>SettingConstraintPack</code>、<code>VolumeConstraintPack</code>、<code>EventChainPack</code>和<code>CurrentEventPack</code>。无损压缩遵守：</p><ul><li>作者已填写字段覆盖率100%；</li><li>作者原话、必须项、强偏好、硬设定、核心机制和上层因果不丢失；</li><li>每个压缩项携带来源对象、版本和字段/片段引用；</li><li>硬约束、软节奏/模板和灵感分开；</li><li>上游修订后重新编译，旧任务包失效；</li><li>超预算时先去重、删除低相关软参考并缩短导航措辞，不对硬事实和当前任务做字符截断；仍不足就明确阻断。</li></ul><p>ContextCompiler在调用方计算基础预算后自动加入的相关硬设定，使用岗位显式配置的有界硬来源专用余量。最终有效预算只扩到实际硬来源大小，未使用余量不能被检索切片、声音证据或其他软参考占用；实际硬来源超过基础预算与专用余量之和时继续明确阻断。事实审查可使用该机制保证正文、完整章纲、相关设定和正史证据无截断，文学与体验审查仍保持各自小资料包。</p><p>去重必须理解来源覆盖关系，而不只是比较字符串。若活动章纲、前章正文或其他权威对象已经以完整版本进入硬来源，同一对象、同一版本的尾段、摘要和检索切片应排除；只有切片提供完整来源未覆盖的独立证据，或完整来源未被纳入时才保留。完全相同的硬来源、可选来源也只保留一份。每项排除都写入ContextPack审计，保留来源、版本和理由，禁止为了缩短输入静默丢失独立证据。</p><h6>8.3 任务上下文矩阵</h6><div class="table-scroll"><table><thead><tr><th>任务</th><th>直接接收</th><th>按需检索</th><th>明确排除</th></tr></thead><tbody><tr><td>开书</td><td>作者填写的全部开书字段、自定义信息、附件、导入内容和偏好；不压缩</td><td>导入旧稿时仅查导入范围</td><td>其他书、聊天、AI猜测和未填信息补造</td></tr><tr><td>设定候选</td><td>完整开书活动版、当前设定模块、该模块全部作者自定义信息和附件；后续模块加入核心人物/读者承诺/作者禁区与已确认的直接依赖设定；融合只重复注入作者选中方案的规则骨架，完整方案按ID回查</td><td>当前书内开书字段、已确认设定依赖和附件来源</td><td>其他书、聊天、卷纲、事件、章纲、正文、无关设定、方案的重复解释/未选备选和未确认AI猜测</td></tr><tr><td>卷纲候选</td><td>完整<code>BookCorePack</code>、四项核心设定全文、可选设定目录与相关全文、长期承诺、本卷作者原话；第一卷加入开篇职责，后续卷加入上一卷真实结算和当前状态</td><td>大线索、人物/势力状态、历史实际因果和必要原文</td><td>其他书、聊天、未实现规划、全文正文和内部方法全集</td></tr><tr><td>事件链/蓝图</td><td><code>BookCorePack</code>中的定位/标签/主角/核心机制、分层设定包、完整<code>VolumeConstraintPack</code>和事件链作者原话</td><td>卷目标相关线索、角色/势力状态和重大因果</td><td>其他书、聊天、无关旧事件、正文全文、固定章数和无依据跨卷扩张</td></tr><tr><td>事件大纲</td><td><code>BookCorePack</code>、分层设定包、完整<code>VolumeConstraintPack</code>、完整<code>EventChainPack</code>、当前事件卡全部信息、上一事件真实结算/卷首状态、当前事件作者原话和单一软参考</td><td>相关人物、地点、规则、道具、线索、历史因果和必要原文</td><td>其他书、聊天、全卷正文、其他事件完整大纲、无关资料和越过事件链的扩写</td></tr><tr><td>章纲</td><td>分层开书/设定资料、完整卷纲/事件链/<code>CurrentEventPack</code>、上一真实结算和作者章链/单章意见；首三章加入开篇职责</td><td>当前事件和本章事实、角色状态、线索、前文因果和场景原文</td><td>其他书、聊天、无关卷/事件、全部人物卡和无关正文</td></tr><tr><td>正文</td><td>四项核心设定全文、相关可选设定全文、其他设定目录、完整当前章纲、当前卷/事件职责、最近1—3章原文与结算、线程账本、作者意见和自由区</td><td>实体、规则、因果、时间、人物声音和必要原文</td><td>其他书、聊天、全书正文、内部方法原文、其他事件完整大纲、其他章节完整章纲和无关报告</td></tr><tr><td>事实审查</td><td>开书硬边界、设定/卷/事件链/当前事件约束、完整当前章纲、同一不可变正文、前章/上一结算、正史、时间线、人物/物品/能力/地点状态和线索</td><td>正文实际出现实体、规则、时间、知情、能力、道具、线索及正式原文</td><td>其他书、聊天、其他审查报告、AI候选、纯审美偏好；无证据时不得把留白/谎言/谜团判错</td></tr><tr><td>文学审查</td><td>开书题材/读者/表达偏好、压缩卷/事件上下文、完整当前章纲、同一不可变正文、必要前章、人物声音/关系/情绪证据和作者本章意见</td><td>人物代表性原文、近期同类场景、本事件情绪进度</td><td>其他书、聊天、其他审查报告、全量正史、无关设定和固定文风/节拍表</td></tr><tr><td>体验审查</td><td>开书卖点/标签/目标读者、压缩卷纲、完整事件链中的当前位置、当前事件、完整当前章纲、同一不可变正文、必要前章、事件阅读进度和作者预期感受</td><td>必要前章、已定稿事件体验锚点和题材承诺</td><td>其他书、聊天、其他审查报告、全量设定、固定爽点/反转/打脸次数</td></tr><tr><td>章节结算</td><td>当前章定稿正文全文/版本、完整章纲、前章结算、既有正史、当前状态和相关线索；卷/事件规划只作对照</td><td>正文来源、相关正史和冲突证据</td><td>其他书、聊天、未定稿正文、AI候选和正文未发生的章纲内容</td></tr><tr><td>事件结算</td><td>当前事件全部章结算、必要定稿原文、事件初始正史状态、完整当前事件、事件链和卷纲；规划只作对照</td><td>事件正文来源、状态变化和开放线索</td><td>其他书、聊天、未定稿章节、AI候选和计划未发生内容</td></tr><tr><td>卷结算</td><td>本卷全部事件结算、必要正文回查、卷首正史状态、完整卷纲和事件链；卷纲只作对照</td><td>卷内正式来源、状态、承诺和线索</td><td>其他书、聊天、未结算事件、未定稿正文、AI候选和未实现卷计划</td></tr><tr><td>下一卷</td><td>全字段<code>BookCorePack</code>、分层活动设定、故事脊柱、上一卷完整真实结算、更早卷结算历史、当前人物/势力/资源状态、开放线索、作者新卷原话和附件</td><td>下一卷相关设定、结算、跨卷承诺和必要原文</td><td>其他书、聊天、旧AI候选、过期版本、未实现计划冒充事实和全书正文堆叠</td></tr></tbody></table></div><p>章纲任务先评估当前事件所需总字数和章节数，再生成完整章节序列。每章至少确定章节职责、主要场景、关键行动/信息、情绪变化、前后衔接、结尾状态和预计字数；只把近期一至三章提升为正文可用的详细冻结章纲，其余章节继续作为可调整的事件内规划。</p><p>章链和单章章纲默认只有一份主方案。作者可选启动另一位异模型编剧的轻量挑战，但挑战者只读取冻结上游、精确主方案版本和作者本次关注点，至多提出3个关键替代方向，并说明收益、代价和后续影响。挑战意见不是正式方案，不自动融合、不进入生产上下文；只有作者主动修改或重新生成产生的新版本才可成为正式候选。</p><p>正文先通过确定性硬检查，再进入三类审查。硬检查由代码执行，不属于任何AI成员，顺序覆盖机器协议/占位符、标题与格式、有效字符数、版本与来源、内部治理口吻、最近5章长段落复用和版权风险。只换章名、地点、人物名、数值或段落顺序仍算模板复用；正常角色名、世界观术语、连续状态和短语重复不构成硬错误。正文优先目标为2700—3200有效字，低于2350或高于3650直接打回；确定性修复最多2轮，仍失败则阻断并交作者处理。三席不得使用ContextPack的<code>tokenCount</code>、供应商输入/输出Token或模型估算，重新裁决作者正文的有效字数、格式和占位符；报告中出现这类越权问题时由服务端移除，仍存在的事实、文学和体验问题继续保留。</p><p>主笔首次明确技术失败后只允许同一模型重试1次；供应商结果未知不得盲重试。两次明确失败、超时或不可用后，副笔才可基于同一冻结资料包接管且最多1次。作者对文风或情节不满意不属于技术失败，必须走作者修订或重写流程。</p><p>卷方向候选同样区分“结果未知”和“结果已知但合同无效”：供应商结果未知时必须停止，待作者或管理员明确重试后才可按冻结检查点处理；模型已成功返回但在有界重试后仍缺首卷强启动、全书故事总线或其他必需合同字段时，不接受坏稿、不反复复用无效结果，应把它记为结果已知的可替补技术失败，由另一异模型成员基于同一资料包补位。单纯不喜欢某条故事路线不属于技术失败。</p><p>卷方向任务跨重试恢复已有候选时，必须从已落库模型调用恢复该候选的实际生产者，不能按任务最初席位猜测；技术补位应排除本任务已尝试成员以及相同供应商与模型绑定，确保两条作者可见路线仍由异模型独立产生。</p><p>事件链由两位异模型编剧在同一冻结资料包上独立设计，主编融合；资料包必须包含确认卷方向仍有效的作者原话和当前事件链对象的作者输入。模型已成功返回、但稳定责任键、因果移交或卷责任覆盖不符合合同时，只允许基于同一冻结资料包做一次定点结构纠错；纠错提示必须给出合法稳定键且不得放宽首卷七项责任。供应商结果未知仍立即停止，不能因结构重试规则而盲重放。</p><p>长事件链、卷方向和长篇审校的模型业务上限为15分钟时，底层HTTP dispatcher的响应头与响应体等待不得仍停留在5分钟默认值；连接建立最多30秒，已连接后的长推理等待与业务上限一致。延长等待只消除传输层误中断，不改变结果未知停止、人工明确恢复和有界重试规则。</p><p>若模型已返回<code>stop_reason=max_tokens</code>且只有思考块、无可见文字，这是结果已知的可恢复失败，不是结构坏稿或结果未知。完整事件链对GLM 5.3预留更大的可见输出额度；仍为空时只允许在同一attempt内再扩大一次，总调用次数继续受两次门禁约束，不能与结构纠错叠加成第三次。</p><p>若两档额度仍由同一模型全部耗在思考块，则该模型对“完整事件链长结构JSON”记为当前能力不匹配；新一轮事件链在第二、第三正式编剧中优先选择另一异模型席位，不改变14人团队、不把同模型换名冒充独立，也不让主编或非编剧代替候选。</p><p>并行两席必须使用<code>allSettled</code>语义等到全部模型调用终态，再决定任务失败或进入融合；禁止一席先失败就结束租约，使另一席成功结果变成晚到中断。第二次编剧输出若已通过事件结构和事件交接，仅缺卷方向责任的稳定映射键，或七项首卷硬责任齐全但把某个合法卷责任键额外放进首卷责任数组，可保留为内部故事候选，让主编补齐映射或由系统过滤误放项；任意伪造键、首卷责任缺失、事件结构错误和最终融合稿不适用该窄容错。方向版本标识属于任务元数据，由系统绑定当前活动版本，不使用模型返回值决定。</p><p>三类审查必须绑定同一份不可变正文和同一个完整当前章纲，但附加上下文按职责隔离，也不能读取彼此报告：事实席拿硬事实与来源，文学席拿人物声音和表达证据，体验席拿目标读者、题材承诺和阅读进度。冻结章纲中的必须实现、禁止违反、当前章结束状态和下一章接口属于任务边界；文学席和体验席可以建议更自然的写法，但不能为了审美偏好要求删除必写人物线、关键行动、信息或承接接口。</p><p>事实席的重大冲突必须同时证明两端属于同一对象、同一指标和同一范围；两个独立数量、主观估算的耗时、公开来源与隐藏结论、行动意图与固定句序之间不得被臆造为一一对应。文学席和体验席若提出的修复只需删改、压缩、移动一两句，或增减一个局部动作、反应和过渡，而主场景、人物动机、核心因果与章末接口仍成立，则最高只能记为轻微建议并保持通过。严重级别按实际修复范围决定，不按报告措辞的激烈程度决定。</p><p>结算分为章节、事件和卷三级。每一级只从作者定稿正文、下一级已确认结算和既有正史提取实际结果；卷纲、事件大纲和章纲只能用于计划—实际差异，不能写入“已发生”。下一卷必须以完整真实卷结算为起点，上一卷未实现计划只能作为重新选择的候选。</p><h5>9. 混合RAG V2</h5><h6>9.1 目标架构</h6><p>SQLite保存正式业务源、版本、关系、来源、任务和结算；LanceDB只保存可重建的本地向量投影。检索按任务组合：</p><ol><li>结构化精确查询；</li><li>全文检索；</li><li>向量语义召回；</li><li>人物、势力、地点、道具、规则和线索关系扩展；</li><li>时间与因果邻域；</li><li>已确认设定、正文与来源附件原文回查。</li></ol><h6>9.2 路由与融合</h6><p>工作流节点、目标对象、活动版本和任务意图先决定检索通道，再决定召回数量。禁止用一个全局相似度阈值处理全部任务。</p><p>融合前必须执行：</p><ul><li>书籍隔离；</li><li>活动版本和有效期检查；</li><li>来源权威检查；</li><li>时间、因果和状态一致性；</li><li>冲突标注；</li><li>去重和预算裁剪；</li><li>纳入/排除理由记录。</li></ul><p>摘要只导航，发现事实不确定或冲突时回查正式源。找不到依据就标注未知或需确认，不补造。</p><h6>9.3 与全书长度解耦</h6><p>模型上下文不随总字数线性增长。跨卷信息依靠版本化卷结算、开放线索、实体状态和按需原文回查；不得用“只记最近固定章数”作为长期遗忘规则。</p><h5>10. 动态分层规划 V2</h5><p>动态分层采用当前卷—事件对象链：</p><pre class="code-block"><code data-language="text">全书长期承诺与活动设定

近期一至三章详细章纲
        ↓
单章正文与真实结算</code></pre><p>远期只保留方向和接口，近期才细化。每完成一章以实际结算更新后续章纲；每完成一个事件以事件结算更新后续事件；每完成一卷以卷结算规划下一卷。</p><p>这不是限制AI只能执行计划。正文中的合理局部发挥属于自由区；可能显著改善故事但改变上层因果的偏离，保留为候选并显示影响，由作者决定修订上层规划还是回到原计划。</p><h5>11. 正文生产闭环 V2</h5><h6>11.1 生成</h6><ol><li>冻结卷纲、事件、事件章节链和当前章纲；</li><li>编译任务上下文和创作自由区；</li><li>当前活动写手生成完整草稿；</li><li>做结构、空输出、版本、来源和明显硬边界检查；</li><li>进入独立审查。</li></ol><p>正式正文逐章生成。上一章未定稿和结算，不启动下一章正式生成。禁止默认批量正式写章，也不默认两个写手串行重写整稿。</p><h6>11.2 审查</h6><p>当前产品配置的审查成员对同一不可变草稿独立工作：</p><ul><li>事实连续性：只判断可验证事实、设定、时间、状态、版本和来源；</li><li>文学人物：关注表达、人物声音、情绪、场景和机械感；</li><li>读者体验：关注代入、节奏、期待、厌烦点和下一章吸引力。</li></ul><p>岗位和模型映射由当前《AI成员系统》定义，本规范不冻结名字和人数。</p><p>硬事实错误必须处理；文学和体验意见由作者裁决。审查不得读取彼此结果后冒充独立意见，不得自动无限改稿；两轮后仍有分歧时展示给作者。</p><h6>11.3 定稿</h6><p>作者可直接编辑、要求定点重写、保留满意部分或确认。每次修改形成新不可变正文版本，旧版本可追溯，不静默覆盖。</p><h5>12. 结算闭环</h5><h6>12.1 章节结算</h6><p>从定稿正文提取本章实际因果、角色与关系变化、地点/道具/规则状态、开放或回收线索及正文来源。与章纲差异只用于调整后续，不把章纲补成事实。</p><h6>12.2 事件结算</h6><p>事件全部章节定稿后，聚合实际入口、行动、结果、代价、下一触发和状态变化，并对照事件大纲标记已实现、调整实现、未实现和新增结果。</p><h6>12.3 卷结算</h6><p>卷内事件全部结算后，聚合实际主线、人物变化、势力状态、重要收益与代价、开放线索和下一卷入口。下一卷必须引用真实卷结算，不能引用上一卷未写出的计划。</p><p>所有结算、正史更新、活动指针推进和下一步解锁必须事务化或具有可证明的原子补偿，禁止半结算。</p><h5>13. 创造性与人物保护</h5><h6>13.1 三类约束</h6><ul><li>硬底线：作者确认事实、活动版本、数据隔离、安全、版权来源、费用与不可逆操作；</li><li>当前任务约束：活动卷、事件和章纲中被确认的目标与边界；</li><li>软参考：内部叙事方法、节拍、题材惯例、作者灵感、风格倾向、审查建议和篇幅估计。</li></ul><p>只有硬底线和明确任务约束能够阻止正式提交。软参考不得自动升级为硬规则。</p><h6>13.2 正文自由区</h6><p>写手可以自由决定对白、动作、意象、环境、场景调度、局部反应和不改变关键因果的自然过渡。规则要求“方向可信”，不是“每句照纲执行”。</p><h6>13.3 人物连续性</h6><p>人物要保持可辨识声音、基于经历的动机和关系记忆，同时允许有因果依据的成长与反常。静态标签不能阻止成长，“成长”也不能掩盖无因漂移。</p><h5>14. 运行状态与恢复</h5><p>AI状态必须来自持久化任务、真实模型调用、工具事件和心跳，不用前端计时器或口头回复伪造。</p><p>核心任务至少具备：</p><ul><li>幂等键；</li><li>租约与心跳；</li><li>有界重试；</li><li>候选检查点；</li><li>取消栅栏和晚到结果隔离；</li><li>上游版本失效检测；</li><li>预算与调用记录；</li><li>Repository事务和恢复入口。</li></ul><p>不保存模型内部思维链，只保存任务步骤、依据、结论和结果。</p><h5>15. 质量诊断与非劣效</h5><p>质量维度只用于离线验收和故障诊断，可按变更影响选择：</p><ul><li>原创性；</li><li>合理惊喜；</li><li>人物可辨识度；</li><li>情绪力度；</li><li>因果自然度；</li><li>叙事清晰度；</li><li>检索锚定；</li><li>卷—事件—章方向一致性；</li><li>整体阅读质量；</li><li>作者选择与修改成本。</li></ul><p>任何检索、上下文、模板、提示词、生成或审查机制改变，都要相对现行基线或弱治理基线做与影响相称的非劣效测试。一致性变好不能抵消人物、惊喜和阅读质量显著下降。</p><h5>16. 工程证据门禁</h5><ul><li>E0：设计、Schema或代码存在；</li><li>E1：单元测试或确定性夹具通过；</li><li>E2：本地集成、迁移、恢复和界面流程通过；</li><li>E3：独立金标、对抗样本、真实模型多样本或盲评通过；</li><li>E4：真实长篇连续运行和纵向质量证据通过。</li></ul><p>固定同义词和连续五章不能证明长篇质量。任何声明必须说明样本、范围、基线、局限和证据等级。</p><h5>17. 必测清单</h5><ul><li>从开书到下一卷完整对象化流程，无聊天依赖；</li><li>作者原话在各节点原样保存且强度正确；</li><li>AI候选真实、独立、来源和模型如实显示；</li><li>作者选择、局部融合、编辑、退回、撤回和确认；</li><li>卷纲、事件、章纲和正文版本依赖及错版失效；</li><li>结构化、全文、语义、关系、时间/因果和原文回查；</li><li>跨书隔离、否定、别名、时间、因果、冲突和对抗查询；</li><li>正文单写手、三类独立审查和不可变定稿；</li><li>章节、事件和卷结算不受未实现计划污染；</li><li>超时、取消、重试、Worker崩溃、晚到结果和半结算恢复；</li><li>空库迁移、升级迁移、已有书籍读取、桌面启动和本地运行；</li><li>创造性、人物和整体阅读质量非劣效。</li></ul><h5>18. 停止与回滚</h5><p>发现跨书、正史污染、不可恢复覆盖、错版正文提交或结算污染时，立即停止正式提交并保留证据。</p><p>发现候选明显同质、人物可辨识度下降、模板化上升、检索挤占创作空间或作者操作负担显著增加时，停止扩大新机制，回滚相关提示词、ContextCompiler、检索或前端装配，不删除作者原话、规划版本、正文、正史、结算和调用证据。本地确定性生成只能作为显式E1/E2夹具，且边界覆盖设定、分卷、事件、章纲、正文、审查、灵感和续写分析；没有真实创作模型时必须在任务创建前阻断，不能用夹具完成作者创作链，更不能把流程跑通冒充文学质量通过。</p><p>分层创作停止条件必须由确定性规则给出可追溯标识，至少覆盖候选同质、作者负担增加、软参考变硬、计划污染事实、技术信息泄漏、上下文完整性失败、手机主操作不可达、旧前端不兼容、质量非劣效失败和跨书/不可变内容违规。回滚通过<code>layeredCreationWrites=read_only</code>或<code>WENMI_LAYERED_CREATION_WRITES=read_only</code>只阻断设定缺口、故事线程、卷/事件/章纲、设定基线和表达基线等新分层写入；所有读取和作者原话保存继续可用。进入只读前后必须逐项快照作者输入、定稿正文、结算、规划版本和模型调用证据，验证字节级不变。</p><p>真实长篇以20、50、100、200章为四道停止关。每道关都要通读故事本身并回查冻结的开书、分卷、事件和章纲版本；检查场景是否成立、人物是否主动、回报是否有因果与代价、配角和敌手是否拥有自己的判断、事实/数值/关系是否连续、前后章是否复用同一骨架。自动相似度、字数和审查结论只用于定位，不能替代连续阅读判断。失败后停止扩大并保留不可变失败版本，修复后以新版本继续。</p><h5>19. 规范与Skill治理</h5><p>本规范的实现约束由 <code>.agents/skills/wenmi-longform-quality/SKILL.md</code> 及其参考文件辅助审查。Skill更新不得静默改变当前产品工作流；重大变更必须先形成新决定和 <code>design_review_id</code>，再同步当前规格、代码和验收。</p><p>若Skill与老板最新决定、项目章程或当前工作流冲突，以更高权威为准并立即修订Skill。</p><hr><h3>超长篇连续性设计</h3><blockquote>当前源文件：<code>docs/ULTRA_LONGFORM_CONTINUITY.md</code> · 指纹：<code>b3df1a36af16</code></blockquote><h4>超长篇连续性设计</h4><h5>1. 规模目标</h5><p>单书按约500万规范化中文字符、约1500章设计。模型上下文必须与全书总量解耦，不能靠把全文或全部摘要常驻上下文维持连续性。</p><h5>2. 长期知识层</h5><ol><li>权威原件：作者输入、导入原文、确认设定、活动规划和定稿正文。</li><li>当前状态：人物、势力、资源、地点、规则和关系的活动状态。</li><li>开放承诺：伏笔、目标、债务、谜团、未解决冲突和承诺。</li><li>层级结算：章节、事件、卷和全书骨架的可回查摘要。</li><li>检索投影：FTS、向量、图谱和Wiki。</li></ol><p>摘要和投影不能推翻权威原件。</p><h5>3. 卷—事件连续性</h5><p>分卷是当前卷未来创作权威；事件链将卷目标拆成因果相连的小故事；事件大纲决定当前事件完整闭环；章纲只拆当前事件；正文冻结所有活动上游版本。事件和卷结算把实际结果传给下一层。</p><h5>4. 滚动规划</h5><p>不一次规划1000章。先确认当前卷和完整事件链，再完整设计当前事件，最后细化当前事件章链。上游可以版本化调整，但旧版本保留并使依赖候选过期。</p><h5>5. 历史回查</h5><p>旧阶段默认使用卷/事件/章节结算导航；当实体、规则、时间、因果、伏笔、关系或人物声音触发时，逐级回查正式原文。不存在固定“超过N章就遗忘”的规则。</p><h5>6. 人物连续性</h5><p>人物状态至少区分身份、目标、能力、资源、关系、知情范围、情绪倾向和未兑现承诺。状态变化只能来自作者确认资料或定稿正文结算，并保存来源。人物声音从高置信正式片段按需检索。</p><h5>7. 伏笔与因果</h5><p>伏笔记录埋设来源、当前状态、预期窗口、关联实体和回收证据。因果链记录事件结果如何改变下一事件触发。计划中的伏笔不是已经发生；未在正文出现不能结算为已埋。</p><h5>8. 上下文预算</h5><p>当前任务完整对象优先；上层硬约束放在高注意力位置；历史证据按触发检索。内容过长时先去重复、分级导航和压缩解释，不能删掉身份、目标、因果、规则、作者必须项或未解决承诺。</p><h5>9. Agent长期陪伴</h5><p>长期陪伴意味着岗位身份、版本化模型绑定、任务历史、来源和质量结果可追溯，不意味着常驻模型进程或保存聊天。成员每次从正式状态和任务资料重新进入工作。</p><h5>10. 续写</h5><p>已有正文不可变保存并按章/场景切片。反向拆解提取人物、设定、事件、卷结构和开放承诺，全部带来源并等待确认；未来创作仍使用当前卷—事件流程。</p><h5>11. 验收</h5><p>E2验证满规模存储、检索、重建、恢复、隔离和有界上下文；E3验证跨题材真实模型盲评；E4验证真实作者跨卷长期创作。任何阶段出现人物漂移、因果断裂、摘要覆盖事实或创造性明显下降都触发停止和回退。</p><hr><h3>长篇创作系统评测协议</h3><blockquote>当前源文件：<code>docs/EVALUATION_PROTOCOL.md</code> · 指纹：<code>88c3af9dae46</code></blockquote><h4>长篇创作系统评测协议</h4><h5>1. 目标</h5><p>评测系统是否在长篇持续创作中同时做到：事实可靠、规划不漂移、人物有生命力、输出不机械、作者可控制、任务可恢复。工程正确性和文学质量分开声明。</p><h5>2. 证据等级</h5><ul><li>E0：规则和指标已定义。</li><li>E1：代码机制存在并有局部测试。</li><li>E2：确定性测试、故障注入、规模回放和恢复证据。</li><li>E3：独立金标、真实模型和盲评。</li><li>E4：真实作者、跨卷长篇纵向效果。</li></ul><p>短流程、固定样例或模拟模型不能声明E3/E4。</p><h5>3. 工程数据集</h5><p>覆盖开书、设定、卷纲、事件链、事件大纲、章纲、正文、三席审查、章节/事件/卷结算和续写。每组包含正常、边界、错误、取消、重复、版本冲突和跨书对抗样例。</p><h5>4. 不可妥协指标</h5><ul><li>跨书污染：0。</li><li>未确认候选进入正史：0。</li><li>正文静默覆盖：0。</li><li>远程结果未知自动重复调用：0。</li><li>模型来源伪造：0。</li><li>迁移失败导致数据丢失：0。</li><li>非对象化消息接口、跨书结果和无来源正式结论：0。</li></ul><h5>5. 检索与上下文</h5><p>测试结构化直达、FTS、向量、关系、时间/因果、别名、否定、旧版本和原文回查。记录召回、精确、来源正确、跨书隔离、硬约束保留、上下文预算和降级行为。</p><p>对每类任务验证上下文矩阵：完整当前对象、压缩上层约束、作者原话、活动版本和明确排除项。</p><h5>6. 创造性非劣效</h5><p>任何会改变检索、上下文、提示、规划、生成或审查的机制，都与当前流程或弱治理基线比较。盲评维度：</p><ul><li>原创性与合理惊喜；</li><li>人物可辨识度和选择可信度；</li><li>情绪力度与节奏；</li><li>因果和上层目标承接；</li><li>文风自然度与重复；</li><li>整体阅读意愿。</li></ul><p>一致性提升不能用显著降低任一核心创作维度交换。</p><h5>7. Agent独立性</h5><p>验证两位编剧独立阶段互不可见、主编后置融合；三席审查模型来源不同、互不读取报告且不同于活动写手；真实状态来自任务和调用。重复模型来源必须被识别并降级。</p><h5>8. 纵向评测</h5><p>至少跨多个事件和一个完整卷观察人物漂移、目标遗忘、伏笔、时间线、文风同质、重复冲突、高潮疲劳和摘要失真。500万字符容量测试只证明工程可运行，不证明文学质量。</p><h5>9. 反迎合</h5><p>构造作者意见与正史冲突、作者自相矛盾、明显会破坏卷目标的灵感和审查意见互相冲突样例。系统应指出代价和来源，不能盲从，也不能擅自替作者决定。</p><h5>10. 报告</h5><p>每次评测保存版本、模型、提示、上下文策略、数据集、随机种子、原始结果、评分者、差异和失败样例。报告只给可重复证据，不把主观偏好包装成绝对标准。</p><p>真实长篇评测必须在证据中保存书籍ID。工具允许用书名定位时，同名书按“活动书优先、最近更新优先”选择；需要检查历史或归档副本时必须直接传书籍ID，禁止把同名空壳或归档副本误报为当前测试书。</p><p>两本专用虚构测试书在生成、审查和逐章确认期间保持独立账号隔离；全部验收完成、停止相关服务并创建可恢复备份后，才迁入首位管理员数据域。迁移范围只包含明确的测试书ID及其全链路数据、文件和可重建投影，不能迁入该测试账号的其他书，也不能改变其他用户的数据归属。迁移后必须复核数据库完整性、外键、文件、索引、上下文隔离、管理员书架可见性和原测试账号不可见性。</p><hr><h2>三、系统架构、数据、接口与运行</h2><h3>系统架构</h3><blockquote>当前源文件：<code>docs/ARCHITECTURE.md</code> · 指纹：<code>3d86082fe745</code></blockquote><h4>系统架构</h4><h5>1. 总体形态</h5><p>统一账号的模块化单体加独立 Worker：</p><pre class="code-block"><code data-language="text">React/Vite Web → Fastify REST/SSE → Application Services → Repositories → SQLite/Files
                                      ↓ outbox/tasks
                                  Independent Worker → Model adapters / projections</code></pre><p>Fastify API 与 Worker 协调端口继续只监听 <code>127.0.0.1</code>。本机由浏览器直接访问；公网部署由同机 HTTPS 反向代理接收域名流量并转发到回环端口，数据库和 Worker 不直接暴露。不使用微服务、WebSocket或需要独立运维的向量/图数据库。</p><h5>2. 模块边界</h5><ul><li>Web：统一创作台、书籍切换、对象编辑、团队/任务状态、隔离灵感、报告和辅助工具。</li><li>API：认证、校验、领域命令、查询投影、任务排队、SSE。</li><li>Worker：领取长任务、编译上下文、调用模型、保存候选和重建投影。</li><li>Contracts：跨端共享的请求、响应和事件类型。</li><li>Repositories：业务代码访问SQLite的唯一入口；新增应用服务不得直接写SQL。</li><li>Files：不可变正文、导入原件、附件、备份和可重建投影文件。</li></ul><h5>3. 当前工作流编排</h5><p>开书、设定、卷纲、事件、章纲、正文和结算分别使用明确领域对象与版本链。任务冻结上游版本、作者输入、模型绑定、预算和上下文包。上游改变时下游候选失效或重新确认，不静默沿用。</p><p>对象页面直接启动正式AI任务并展示结果；正式生产不依赖聊天入口、消息回复流水线或会话记忆。灵感是隔离的辅助域，只保存讨论轮次和引用，不能调用正式对象写入；只有作者主动摘录并绑定业务对象后才转成 <code>author_planning_inputs</code>。</p><h5>4. 写入模型</h5><p>SQLite使用单写者事务、外键、WAL和向前迁移。每项核心写入携带 <code>owner_id</code>、<code>book_id</code>。跨书访问在Repository入口校验。并发投影短暂占用写锁时，只允许上下文包落库与同任务附件绑定做有限、可观测的锁冲突重试；非锁错误立即失败，达到次数后保持原任务可恢复，不能无限重试或掩盖数据错误。</p><p>正文使用不可变完整版本。Worker只能保存任务结果、候选、调用记录和投影，不得直接覆盖正式正文或正史。作者确认由API事务提交。</p><h5>5. 任务与恢复</h5><p>任务状态：pending → queued → working → succeeded/failed/cancelled/paused/blocked。领取使用租约、attempt编号和lease token；模型结果提交还校验主编epoch。结果未知时冻结并等待调和，不盲目重试远程调用。</p><p>每次模型调用保存：任务、Agent、模型快照、输入哈希、上下文包、预算预留、耗时、Token、结果哈希和最终状态。不保存思维链。</p><p>长篇规划、审校等慢推理调用的HTTP响应头与响应体等待上限必须与模型业务超时一致，当前最高15分钟；连接建立仍最多30秒。任何一层先中断且无法确认供应商结果时继续记为结果未知，不能因放宽传输等待而自动重放。</p><h5>6. 上下文与检索</h5><p>确定性 ContextCompiler 按任务编译资料：先取活动版本与结构化直达，再按实体、时间、因果、伏笔、声音和来源触发混合检索。SQLite是正式源；FTS、LanceDB、Wiki、图谱和摘要都是可重建投影。</p><p>检索永远携带书籍隔离键；其他书、未摘录灵感、过期版本、无关候选和模型猜测不能进入生产上下文。灵感自己的检索只读取当前书已确认正式源，不能读取其他讨论会话作为事实。</p><h5>7. 模型与Agent</h5><p>岗位、Agent实例和模型绑定分离。卷纲与事件规划可并行调用两位互不可见的异模型编剧，随后由主编融合；正文只有一个活动写手；事实、文学、体验三席使用三异模型独立审查。</p><h5>8. 文件与附件</h5><p>作者附件绑定具体开书、设定、卷、事件、章纲或正文对象。原件不可变，解析文本和预览可重建；公开API和运行时统一使用作者附件语义。</p><h5>9. 前端架构</h5><p>Web保留账号/书籍归属、创作对象路由、主工作区和按需上下文四类职责，具体使用左栏、顶部栏、抽屉、分段导航或面板由UI/UX持续调整。布局不能成为业务状态来源；路由、活动对象和持久任务状态才是来源。</p><p>桌面可使用临时双栏比较或上下文面板，手机转换为抽屉、全页编辑和顺序比较。正文与长列表按需要虚拟化/分页。任务通过持久状态和SSE更新，不伪造进度；普通作者只看自然业务状态，管理员审计保留内部证据。</p><p>移动端高度以<code>visualViewport.height</code>同步CSS变量，不依赖固定视口猜测键盘高度；焦点和可视视口变化时让当前控件与主操作可达，无<code>visualViewport</code>时安全降级。</p><h5>10. 构建与可达性</h5><p>启动入口为API、Worker、Web和共享Contracts。验证按 <code>docs/ACCEPTANCE.md</code> 的风险矩阵执行：单页UI只验证Web相关范围；数据、权限、迁移、跨服务恢复或核心工作流变化才运行四端全量门禁。发布时按Web-only或API/Worker/迁移类型选择 <code>docs/DEPLOY.md</code> 对应流程。</p><h5>11. 作者展示门禁</h5><p>Web 的 <code>AuthorPresentationGate</code> 是作者可见动态内容的统一边界：结构化内容递归过滤技术字段，状态与错误映射为自然语言，未知机器值使用安全兜底；业务对象、API响应和数据库原件不在展示层被改写。门禁区分界面、进度、错误和故事文本，故事文本与作者原话只剥离机器协议，禁止全局术语替换改变叙事语义。</p><p>API在展示层之前再设置网络洁净投影边界：当前Web对普通作者请求和SSE发送<code>clean-v1</code>能力头，Fastify统一删除任务/讨论/模型/方法/错误内部字段并只保留业务恢复动作；旧缓存前端不发能力头时走兼容结构。兼容别名只在新Web内存中恢复给既有组件，不能重新写入网络缓存。完整任务、阶段、模型、工具和方法证据只由独立管理员审计路由返回。</p><h5>12. 账号、会话与管理后台</h5><p>认证属于基础设施边界，但账号状态和管理员权限由应用服务判定。<code>user_accounts</code> 一对一关联 <code>owners</code>；首次注册在事务内优先复用尚未认领且含本机书籍的历史老板所有者，后续注册创建新所有者。升级库只重新绑定唯一空管理员的所有者关系，不批量改写任何创作表。<code>auth_sessions</code> 只保存随机令牌的 SHA-256 摘要；密码使用每账号独立盐值的 scrypt 摘要。浏览器通过 HttpOnly、SameSite=Lax Cookie 维持会话，HTTPS 部署额外启用 Secure。所有业务路由在进入应用服务前从会话解析 <code>user_id + owner_id + role</code>，领域路由不再读取固定配置所有者。</p><p>首个注册使用 <code>BEGIN IMMEDIATE</code> 原子判断并授予管理员角色。管理员路由只提供统计、用户检索、暂停和恢复；暂停用户时撤销其所有活动会话。不能暂停当前管理员自己或最后一个活动管理员。测试注入身份只存在于受控测试配置，不进入生产路由。</p><p>公网保持单域部署：<code>https://wenmixiezuo.com</code> 同时承载 Web 与 <code>/api</code>，反向代理负责 TLS、请求大小、访问日志脱敏与外围限流。API、SQLite、文件、LanceDB 和 Worker 仍位于服务器本机回环/本地文件边界。完整部署步骤见 <button type="button" class="inline-doc-link" data-open-document="document-18">DEPLOY.md</button>。手机号、微信以后作为登录身份绑定到现有 <code>user_id</code>，不能建立第二套书籍所有权。</p><h5>分层规划与上下文编译</h5><p>设定工作区固定四个核心模块，并保留可扩展的可选模块。卷版本可携带具体路线、故事脊柱和第一卷开篇计划；旧卷版本缺少这些可选字段时仍可读取和编辑。内部叙事方法注册表只服务方案编排、版本快照和审计，作者API投影不返回专业来源。</p><p>ContextPack来源清单新增约束强度、真值状态、业务范围和依赖。硬事实与当前任务进入不可裁剪区；相关可选设定以全文进入，其他可选设定只进入延后目录。编译器先做同源去重和低相关软资料淘汰，不能用头尾截断伪装成功。</p><p>卷路线由卷规划服务生成，事件与章纲只读取已确认路线并逐层落实。第一卷开篇职责从卷版本向事件章链、单章章纲和正文任务传递；任何下层都不能重新发明另一条卷路线。</p><hr><h3>数据模型规格</h3><blockquote>当前源文件：<code>docs/DATA_MODEL.md</code> · 指纹：<code>8491080cb7f7</code></blockquote><h4>数据模型规格</h4><h5>1. 总原则</h5><ul><li>SQLite是正式业务数据唯一权威。</li><li>所有书内核心记录包含 <code>owner_id</code> 与 <code>book_id</code>。</li><li>已合并迁移只向前追加，不修改、不删除。</li><li>正文和关键规划采用不可变版本；活动指针与历史版本分离。</li><li>摘要、全文、向量、图谱和Wiki均可从正式对象重建。</li></ul><h5>2. 身份、书籍与模型</h5><ul><li><code>user_accounts</code>：登录账号，保存规范化邮箱、昵称、密码盐值与摘要、角色、状态和最近登录时间；邮箱唯一，账号与 <code>owners</code> 一对一。</li><li><code>auth_sessions</code>：持久登录会话，只保存随机令牌摘要、到期时间、最近活动和撤销时间；不保存明文令牌。</li><li><code>user_memberships</code>：会员记录，每账号至多一条，保存套餐（包月/包季/包年）、算力值配额、周期起止、状态（生效/撤销）与经办管理员；算力值消耗按 <code>usage_ledger</code> 周期内汇总，不单独存储余额。</li><li><code>auth_audit_events</code>：注册、成功/失败登录、退出、暂停和恢复审计；不进入模型上下文或作者导出。</li><li><code>owners</code>：每个注册账号对应的创作数据所有者；首位管理员复用历史本机老板所有者，后续账号各自新建所有者。</li><li><code>books</code>：书籍、状态、版本、正史修订和活动主编epoch。</li><li><code>book_onboarding_profiles</code>、<code>positioning_versions</code>、<code>book_expression_profiles</code>：开书原始资料、定位与表达基线版本。</li><li><code>book_branding_designs</code>：主编设计书名或书籍简介的任务记录、候选方案和来源指纹；采用结果写回开书蓝图的不可变新版本，不原地覆盖。</li><li><code>role_templates</code>、<code>agent_instances</code>：岗位模板和逐书Agent实例。</li><li><code>model_config_snapshots</code>、<code>agent_model_bindings</code>：不可变模型快照与活动绑定。</li><li><code>editor_leases</code>、<code>writer_leases</code>：主编和写手租约。</li><li><code>budgets</code>、<code>budget_reservations</code>、<code>usage_ledger</code>：调用预算和结算。</li></ul><h5>3. 作者输入与附件</h5><ul><li><code>author_planning_inputs</code>：作者附着于设定、卷、事件、章纲或正文的原话，保存意图等级、版本和状态。</li><li><code>author_input_links</code>：作者输入与生成任务/候选的有序关联。</li><li><code>author_attachments</code>：作者附件正式对象，保存原件、解析状态、摘要、绑定对象和来源；当前规划链接类型统一为 <code>author_attachment</code>。</li><li>0042迁移将旧库中的附件表原位升级，不复制或删除附件内容；<code>origin_record_id</code> 与 <code>origin_attached_at</code> 只保留历史来源，不进入当前作者接口或创作语义。</li></ul><h5>4. 设定协作</h5><ul><li><code>setting_outline_workspace</code>：当前设定项、状态、候选和确认结果。</li><li><code>setting_outline_item_versions</code>：设定项不可变版本链；每次确认追加一条版本并记录来源（manual/guidance/discussion），当前生效内容仍以 <code>setting_outline_workspace</code> 为准。</li><li><code>setting_proposal_fragments</code>：设定类目讨论三席提案拆出的可勾选碎片；按提案落库，解析失败时以整份方案作单条 implicit 碎片兜底。</li><li><code>setting_fusion_drafts</code>：主编按作者勾选碎片产生的融合稿；保存所选碎片、段级来源标记（fragment/stitch）与融合正文，按设定项取最新一份。</li><li><code>discussions</code>、<code>discussion_participants</code>、<code>discussion_opinions</code>、<code>discussion_decisions</code>：对象化AI提案、独立意见与主编整理记录。</li><li>独立提案保存真实Agent、模型快照和输出；作者选择、组合、修订和确认另行记录。</li></ul><h5>5. 卷—事件—章纲规划</h5><ul><li><code>volume_plans</code>及版本表：活动卷纲、候选、模板实例与版本/哈希快照、作者输入、上游依赖和历史切换。</li><li><code>story_events</code>及版本表：卷内事件链、顺序、进入状态、因果触发、选择与代价、结果、结束钩子、下一事件接口、事件卡和事件大纲。</li><li>叙事模板注册表由后端统一版本化发布；活动规划只保存不可变模板引用与节拍快照，不依赖前端硬编码，也不允许规则更新原地改变旧规划。</li><li>模板推荐信号是按当前 <code>owner_id + book_id</code> 即时编译的非权威排序输入，来源限于开书资料、活动卷和最近真实卷结算，不写入正史。</li><li><code>event_chapter_outlines</code>及版本表：当前事件章链、章节详细章纲、预计字数和上游版本引用。</li><li>章纲挑战意见不是正式规划对象，不新增真相表；它随任务检查点、上下文包和模型调用保存，并冻结目标候选版本。作者主动修改或重新生成后，新的章纲版本才成为正式候选。</li><li><code>planning_settlement_assessments</code>：事件/卷计划与实际差异及下一层承接。</li></ul><p>规划对象描述未来，不直接写入正史。活动版本必须引用活动上游版本；上游改变后旧候选标记过期。</p><h5>6. 章节与正文</h5><ul><li><code>volumes</code>、<code>chapters</code>：物理卷与章节目录。</li><li><code>manuscript_versions</code>：完整不可变正文版本。</li><li><code>writer_selections</code>、<code>chapter_work_orders</code>：活动写手与冻结写作工单。</li><li><code>review_reports</code>、<code>editor_review_syntheses</code>：事实、文学、体验独立报告和可执行修订清单。</li><li><code>chapter_settlements</code>及派生表：定稿后实际发生内容、人物状态、伏笔和投影更新。</li></ul><h5>7. 正史、知识和检索</h5><ul><li>正史事实、实体、关系、时间线、开放线程和来源表：只接收作者确认资料或定稿结算。</li></ul><h6>资料库公开视图</h6><ul><li>作者可见界面统一称“配角”；<code>entities.entity_type=&#039;character&#039;</code>只是稳定内部存储键，同时包含主角与配角，不能被前端直接当作“配角”分类。公开配角视图通过同书主角档案的<code>entity_id</code>和姓名确定性排除主角，不修改旧实体键。</li><li>设定来源、正式实体/事实、人物当前状态和正文事件时间线是四类不同投影视图，不能互相复制或替代。</li><li>主角状态使用<code>protagonist_state_entries</code>追加修订，<code>state_status</code>与<code>effective_chapter_number/story_time</code>表达获得、有效、消耗、失去、死亡、退役或归档及发生位置；历史永不由当前面板删除。</li><li>公开资料档案按实体类型聚合可选字段：配角身份/年龄/性格/归属/境界/实力/属性/装备/关系，势力负责人/规模/实力/等级/驻地/地位/成员，地点类型/上级区域/方位/特点，道具资源类型/等级/属性/效果/数量/归属/状态/流转。聚合结果是可重建查询视图，底层仍以实体、正式事实、状态历史和不可变来源为准；缺失值不补造。</li><li>地点资料与世界路线图分开。路线节点来自地点首次正式出现或作者确认出生地，边来自章节先后或明确移动事实；无方向证据时方向为空，不持久化虚构坐标。</li><li>作者事件时间线由已结算<code>story_events</code>、章节覆盖、<code>stage_settlements</code>及正文事实聚合；规划版本只提供后台归属，实际状态必须来自结算。正文没有明确故事时间时保存空值，公开<code>display_time</code>回退为章节范围，不伪造日期。</li><li><code>chunk_snapshots</code>与检索块：不可变切片快照和原子活动指针。</li><li>FTS表：关键词与短语检索投影。</li><li>LanceDB：本地向量投影，可删除重建，不能成为事实源。</li><li>Wiki、图谱、摘要：派生导航，必须保留来源指针。</li></ul><h5>8. 任务、调用与审计</h5><ul><li><code>tasks</code>、<code>task_attempts</code>、<code>task_phases</code>、<code>task_dependencies</code>：持久任务、尝试、检查点和依赖。</li><li><code>context_packs</code>：每次调用冻结的来源清单、预算、哈希和排除项。</li><li><code>model_calls</code>、<code>model_call_results</code>、<code>model_call_reconciliations</code>：模型调用、结果与中断调和。</li><li><code>projection_outbox</code>、<code>projection_jobs</code>：正式事务到可重建投影的可靠交接。</li><li>操作、备份、恢复、永久删除墓碑和安全审计表记录不可逆或高风险动作。</li></ul><h5>9. 迁移与保留</h5><p>已合并迁移保持不可变，新增结构使用向前迁移。作者原件、正式正文、任务来源和恢复记录按数据生命周期保留；永久清理作者数据只能通过书籍彻底删除流程执行。</p><p>迁移中的旧表名、旧字段名和旧任务类型只承担升级或恢复职责，不得作为当前Repository、路由、检索源或作者界面契约。</p><h5>10. 关键不变量</h5><ul><li>跨书查询结果必须为0。</li><li>一个书内同一层级最多一个活动版本。</li><li>正文修改必然产生新版本。</li><li>投影删除或损坏不能破坏正式源。</li><li>未确认候选不能升级为正史。</li><li>任务结果提交必须通过租约、attempt、书籍和主编epoch校验。</li></ul><h5>作者可见名称与稳定关联键</h5><p>功能显示名与持久化关联分离：</p><div class="table-scroll"><table><thead><tr><th>作者看到的名称</th><th>稳定功能键</th><th>作者输入 surface</th><th>主要正式对象</th></tr></thead><tbody><tr><td>信息</td><td>framework</td><td>book_profile</td><td>开书信息与书籍档案</td></tr><tr><td>设定</td><td>basic</td><td>setting</td><td>设定活动版本、候选与基线</td></tr><tr><td>分卷</td><td>master</td><td>volume_plan</td><td>volume_plans及版本</td></tr><tr><td>规划</td><td>event</td><td>event</td><td>story_events、事件链与事件大纲版本</td></tr><tr><td>章纲</td><td>chapter</td><td>chapter_outline</td><td>event_chapter_outlines及版本</td></tr><tr><td>正文</td><td>manuscript</td><td>manuscript</td><td>manuscript_versions</td></tr><tr><td>资料库</td><td>library</td><td>无直接作者输入面</td><td>可重建资料、图谱与来源投影</td></tr><tr><td>取名</td><td>naming</td><td>无固定surface</td><td>命名候选与占用记录</td></tr></tbody></table></div><p>团队、任务、灵感和设置是工具域，不改变上述创作对象的数据库身份。显示名称改动不得修改已合并迁移、表名、枚举、对象ID或历史来源文字。已有历史文字通过作者展示层只读转换，新数据继续使用稳定键建立关联。</p><h5>11. 账号数据不变量</h5><ul><li>规范化邮箱全局唯一；一个账号只绑定一个 <code>owner_id</code>，一个 <code>owner_id</code> 只绑定一个账号。</li><li>首个注册账号在同一写事务中成为管理员；至少保留一个活动管理员。</li><li>历史本机老板所有者只能由首位管理员接管一次；接管只更新账号到所有者的一对一关联，不复制或改写任何书籍与创作对象。第二个及以后账号不得复用该所有者。</li><li>密码、密码盐值、会话令牌或令牌摘要不得进入公开 API、日志、模型上下文、书籍导出或检索投影。</li><li>账号暂停立即撤销该用户全部活动会话，不删除其书籍和创作数据。</li><li>书籍、任务、附件、检索和 SSE 的 <code>owner_id</code> 只能来自登录会话；客户端提交值不能扩大权限。</li></ul><h5>分层设计的兼容数据</h5><ul><li>活动设定核心键固定为world-stage、protagonist-situation、rules-costs、boundaries-blanks；story-kernel和opposition等历史键继续作为可选或旧版项读取，不迁移删除作者数据。</li><li>卷内容JSON可选保存routeCard、storySpine和firstVolumeLaunch；旧卷缺失时解析成功，新卷确认后随版本不可变。</li><li>内部叙事方法保存版本、方法键和任务快照，作者公开投影不保存或返回专业名称。</li><li>设定融合选择保存稳定方案ID、完整方案ID列表、片段来源和作者文字，不保存依赖前端排序的数组下标。</li><li>ContextPack不可变来源清单保存约束强度、真值状态、业务范围和依赖，并参与来源指纹。</li></ul><hr><h3>当前API与事件契约</h3><blockquote>当前源文件：<code>docs/API.md</code> · 指纹：<code>abb50efa0321</code></blockquote><h4>当前API与事件契约</h4><h5>1. 通用规则</h5><ul><li>前缀：<code>/api/v1</code>；健康检查为 <code>/health</code>。</li><li>API仅监听 <code>127.0.0.1</code>；公网由同机HTTPS反向代理转发 <code>/api</code>，不得直接暴露API、SQLite或Worker端口。</li><li>所有书内接口从路径获取 <code>bookId</code>，服务端从已验证登录会话绑定 <code>owner_id</code>；客户端不能提交或替换所有者。</li><li>后台、Worker和旧缓存前端继续使用稳定内部错误码；当前作者前端为普通 <code>/api/v1</code> 请求发送 <code>x-wenmi-author-projection: clean-v1</code>，成功响应只保留作者业务对象，失败响应只返回自然语言 <code>message</code>、业务恢复 <code>action</code>、<code>retryable</code> 与不透明 <code>recoveryKey</code>，不得返回内部错误码、详情、路径、SQL、模型或Worker状态。</li><li>创建/生成命令使用幂等键；版本化修改携带期望版本，冲突返回409。</li><li>长任务返回任务ID，通过任务查询和SSE观察，不在HTTP连接中假装同步完成。</li></ul><h5>2. 运行与能力</h5><ul><li><code>GET /health</code>：公开的API、轻量数据库探针与Worker心跳状态；不创建账号会话，也不在高频探针中执行全库扫描。</li><li><code>GET /api/v1/runtime/worker</code>：Worker心跳和队列状态。</li><li><code>GET /api/v1/runtime/readiness</code>：数据库、迁移、模型与投影准备度。</li><li><code>POST /api/v1/auth/register</code>：邮箱、密码、昵称注册；首个账号原子授予管理员角色，并在存在未认领本机老板数据时接管该所有者；后续账号创建全新独立所有者并签发会话。</li><li><code>POST /api/v1/auth/login</code>：邮箱密码登录，成功后签发 HttpOnly Cookie。</li><li><code>POST /api/v1/auth/logout</code>：撤销当前会话并清除 Cookie。</li><li><code>GET /api/v1/auth/me</code>：读取当前账号公开资料与角色。</li><li><code>GET /api/v1/admin/overview</code>：管理员查看用户与书籍总览。</li><li><code>GET /api/v1/admin/audit/books/:bookId/tasks/:taskId</code>：管理员按书籍和任务读取完整任务、阶段、模型调用、工具调用与内部方法审计；普通作者路由没有该投影。</li><li><code>GET /api/v1/admin/users</code>：管理员按关键字和状态查看账号。</li><li><code>PATCH /api/v1/admin/users/:userId/status</code>：管理员暂停或恢复账号。</li><li><code>GET /api/v1/membership/me</code>：当前账号会员状态（套餐、算力值配额/已用/剩余、到期时间）；管理员返回 <code>isAdmin: true</code> 不限额。</li><li><code>GET /api/v1/admin/memberships</code>：管理员查看全部账号的会员与算力值消耗（周期内消耗与累计消耗）。</li><li><code>POST /api/v1/admin/memberships/:userId</code>：管理员开通或续费会员，Body使用 <code>plan</code>：<code>bronze</code>（青铜20万算力值，长期体验）/<code>silver</code>（白银2000万）/<code>gold</code>（黄金5000万）/<code>diamond</code>（钻石2亿）；付费档当前周期12个月。算力值=真实token×2，普通作者页面不出现token口径。</li><li><code>POST /api/v1/admin/memberships/:userId/revoke</code>：管理员撤销会员。</li><li>生成门禁：账号体系内的非管理员用户必须持有生效会员且周期内算力值未用完，否则任务创建返回 <code>MEMBERSHIP_REQUIRED</code>、<code>MEMBERSHIP_EXPIRED</code> 或 <code>MEMBERSHIP_QUOTA_EXHAUSTED</code>（403，附管理员联系方式）。</li><li><code>GET /api/v1/capabilities</code>：当前检索和运行能力；普通作者投影不返回模型配置，管理员通过独立管理接口查看。</li></ul><h5>3. 书架与开书</h5><ul><li>书籍草稿：创建、更新、确认。</li><li><code>GET /api/v1/books</code>：书架。</li><li>书籍详情、开书资料、定位、表达基线、归档、恢复和彻底删除。</li><li><code>POST /api/v1/books/:bookId/branding-designs</code>：主编依据第一卷已确认方案、设定基线和开书信息设计书名或书籍简介候选（<code>kind</code> 为 <code>title</code> 或 <code>synopsis</code>）；第一卷未确认返回409并提示先设计第一卷。</li><li><code>GET /api/v1/books/:bookId/branding-designs/latest?kind=</code>：当前类型最新一轮主编设计及其候选。</li><li><code>GET /api/v1/opening-taxonomy</code>：频道、分类、题材和标签目录。</li><li><code>GET /api/v1/books/:bookId/workflow</code>：当前卷—事件工作流状态。</li></ul><p>确认开书会原子创建书籍、定位版本、团队、模型绑定、预算、设定工作区和首个设定任务。</p><h5>4. 设定对象协作</h5><ul><li><code>GET /api/v1/books/:bookId/setting-outline-workspace</code>：当前设定工作区。</li><li><code>GET /api/v1/books/:bookId/setting-outline-workspace/:itemKey/collaboration</code>：当前项AI方案与任务。</li><li><code>POST .../collaboration/start</code>：主编和两位编剧独立提案。</li><li><code>POST .../collaboration/synthesize</code>：按作者选中的方案整理候选。</li><li><code>POST .../collaboration/revise</code>：按作者本轮意见修订候选。</li><li>设定项确认、跳过/留白和整份设定基线确认使用独立命令。</li></ul><p>这些接口直接读写当前设定对象、候选、作者选择和确认结果。</p><h5>5. 作者想法与附件</h5><p>作者想法按 <code>surface</code>、<code>subjectType</code>、<code>subjectId</code> 附着开书、设定、卷、事件链、事件、章纲或正文，并保存原话、意图等级、版本和状态。事件链使用 <code>surface=event</code>、<code>subjectType=event_sequence</code>、<code>subjectId=volumePlanId</code>；生成接口接收对应 <code>authorInputRefs</code>，同时继承确认卷方向仍有效的作者原话。附件使用 <code>/author-attachments</code> 上传、读取、绑定和丢弃。</p><h5>6. 分卷</h5><p><code>/api/v1/books/:bookId/volume-plans</code> 提供列表、创建和详情。单个卷计划支持：作者输入、候选、AI生成任务、选择/融合、确认、历史切换、影响预览和结算。所有修改校验工作流版本与上游设定版本。</p><p><code>GET /api/v1/books/:bookId/planning-templates?scope=volume|event</code> 返回后端统一模板注册表的公开投影、版本和哈希。推荐排序输入只来自该 <code>bookId</code> 的开书资料、当前活动卷和最近真实卷结算；推荐标记只改变展示顺序。客户端保存规划时提交所选模板版本、哈希和混合引用快照；自定义和不使用模板不绑定系统模板。</p><h5>7. 事件链与事件大纲</h5><p><code>/api/v1/books/:bookId/volume-plans/:volumePlanId/story-events</code> 管理事件列表、顺序、插入、移动、拆分、合并、候选生成、确认和因果衔接。单个事件通过 <code>/story-events/:eventId</code> 获取详情、生成事件大纲和执行事件结算。</p><h5>8. 当前事件章纲</h5><p><code>/api/v1/books/:bookId/story-events/:eventId/chapter-outlines</code> 管理章数评估、批量章链候选、单章详细章纲、作者修改、确认和历史版本。生成任务冻结活动卷纲、事件链、事件大纲和作者输入。</p><p><code>POST /api/v1/books/:bookId/story-events/:eventId/chapter-sequence/versions/:sequenceVersionId/challenge</code> 请求另一位编剧挑战当前章链候选；<code>POST /api/v1/books/:bookId/story-events/:eventId/event-chapter-outlines/:outlineId/versions/:outlineVersionId/challenge</code> 挑战当前单章章纲。<code>GET .../chapter-sequence/generation?kind=sequence_challenge|detail_challenge</code> 读取当前建议任务。结果只含目标版本、自然语言摘要和最多3条替代建议，不创建正式章纲版本，也不自动采纳。</p><h5>9. 正文与审查</h5><p>章节接口提供目录、写作工单、单章生成、状态、稿件版本、作者编辑、定点修订和定稿。正式生产一次只处理一章。三席报告分别读取和展示；作者定稿后才能执行章节结算。</p><h5>10. 续写与反向拆解</h5><p>已有正文接口支持文件/文本导入、解析预览、章节顺序确认、不可变入库、分析任务、来源查看和反向规划候选。分析完成后通过设定、卷、事件和章纲对象继续。</p><h5>11. 图谱、资料库、检索和取名</h5><p>按书提供人物状态、实体、事实、关系、时间线、伏笔、来源、缺口、图谱投影、混合检索和命名候选。检索响应标注来源、版本、证据等级和降级状态；不暴露其他书结果。</p><p><code>GET /api/v1/books/:bookId/library</code>返回独立的<code>settings</code>设定来源、<code>supportingCharacters</code>配角集合、正式<code>entities/facts</code>、按已结算事件聚合的<code>timeline</code>，以及<code>supportingCharacterProfiles</code>、<code>organizationProfiles</code>、<code>locationProfiles</code>、<code>itemResourceProfiles</code>和<code>worldMap</code>类型化公开视图。<code>supportingCharacters</code>及配角档案排除主角档案已绑定实体或同名实体；内部实体类型仍使用稳定键<code>character</code>。档案字段值携带来源章节，缺失字段返回空数组，不由接口补造。<code>worldMap</code>只从地点正式出场、明确出生地和作者初始地图说明构建大范围路线，方向无证据时为<code>null</code>。时间线保留后台结算摘要和规划归属供审计，同时提供<code>display_time</code>：正文有故事时间时使用故事时间，否则回退章节范围；作者页面只显示<code>display_time + event_title</code>。分类页不得自行按关键词把<code>settings</code>复制到势力、地点、道具或规则页，普通界面不得展示内部事实键或记录编号。</p><h5>12. 团队、任务与模型</h5><ul><li>团队模板、逐书成员、岗位公开说明、真实状态和模型绑定。</li><li>任务中心、任务详情、暂停、取消、失败重试和结果未知调和。</li><li>模型调用、预算和用量只显示可审计元数据，不返回密钥或思维链。</li></ul><h5>13. 备份、恢复和删除</h5><p>备份、导出、导入和恢复操作均有操作ID、状态和校验结果。普通删除为归档。彻底删除只允许已归档书，先查看影响，再输入大小写不敏感的 <code>YES</code> 并二次提交；服务端原子清理并写墓碑。</p><h5>14. SSE事件</h5><p>事件至少覆盖任务排队/开始/阶段/完成/失败/取消，模型调用开始/完成/中断，预算变化，投影水位，书籍版本变化和Worker心跳。事件只是状态通知，客户端重新读取正式对象作为最终状态。</p><h5>作者可见功能名合同</h5><p>接口向作者返回的功能名称统一为：信息、设定、分卷、规划、章纲、正文、资料库、取名、团队、任务、灵感、设置。公开显示名来自 Contracts 共享合同。</p><p>API路由、请求字段和数据库surface继续使用稳定英文键，不随显示名改动：book_profile、setting、volume_plan、event、chapter_outline、manuscript。这样已有书籍、幂等键、任务恢复、上下文包和来源引用不需要迁移。接口返回历史自由文本前必须经过作者展示清洗，把旧称转换为当前名称，但不回写历史记录。</p><h5>13. 认证与错误语义</h5><p><code>/health</code> 与注册/登录是公开入口；Worker内部执行使用独立Worker令牌；其他 <code>/api/v1</code> 接口都要求有效账号会话。写请求继续校验精确 Origin、Host、<code>Sec-Fetch-Site</code> 和 JSON 内容类型。登录失败统一返回“邮箱或密码不正确”，不泄露邮箱是否存在；暂停账号返回明确联系管理员提示；无效或空 JSON 返回自然中文格式错误，不向前端暴露堆栈、SQL或内部路径。</p><p>当前作者端错误合同按业务动作恢复，不按机器错误码分支：会员问题返回开通/续费/补充算力动作，设定质检问题返回查看问题动作，登录失效返回刷新登录动作，其余失败返回安全重试或返回修改动作。旧缓存前端未发送洁净投影头时继续收到向后兼容的旧结构，但其中供应商、模型和原始错误详情也必须使用安全占位，不能泄漏真实内部值。</p><h5>14. 分层设计的作者投影</h5><p>设定协作接口使用稳定proposalId接收整份方案与片段选择，融合请求可同时提交wholeProposalIds、selectedFragments和作者文字。作者响应只返回方案正文、理由、收益、代价、成员显示名和可恢复任务键；供应商、模型内部ID、讨论任务ID和决策ID只在审计接口保留。</p><p>洁净投影由API <code>onSend</code>统一递归完成，覆盖普通JSON与SSE；它删除owner/source内部ID、供应商/模型、任务阶段、模型与工具调用、内部方法版本/指纹、原始错误、路径和堆栈，并把剩余任务/讨论键改名为恢复/协作业务键。Web只在内存中为旧组件恢复兼容别名，网络响应和浏览器缓存都不重新出现被删除字段。管理员审计走独立 <code>/api/v1/admin/audit/...</code> 物理路由并再次校验管理员身份。</p><p>卷规划内容向后兼容增加routeCard、storySpine和firstVolumeLaunch。第一卷生成候选必须包含三章开篇职责和重大高潮字数上限；旧客户端省略这些字段时仍能读取旧版本和保存原有字段，后端字段只增不删。</p><p>公开事件软参考不返回专业来源字段。事件大纲生成最多接收一个阅读感受选择；旧请求中的选择数组继续可解析，但只采用明确的主选择，不能拼接多套完整节拍。</p><hr><h3>运行时工作流与状态机</h3><blockquote>当前源文件：<code>docs/RUNTIME_WORKFLOWS.md</code> · 指纹：<code>12c2393e58dc</code></blockquote><h4>运行时工作流与状态机</h4><h5>1. 统一任务状态</h5><pre class="code-block"><code data-language="text">pending → queued → working → succeeded
                    ├→ paused → queued
                    ├→ failed → queued（仅可安全重试）
                    ├→ blocked
                    └→ cancelled</code></pre><p>任务包含书籍隔离键、幂等键、上游版本、负责人、预算、阶段、检查点、attempt、租约和错误码。状态只由真实数据库和Worker事件驱动。</p><h5>2. 开书</h5><p>校验全部作者输入 → 建立书籍草稿 → 作者确认 → 单事务创建书籍/定位/14名成员/模型绑定/预算/设定工作区 → 排队首个设定提案。失败回滚整笔事务。</p><h5>3. 设定</h5><p>当前设定项准备完整开书资料与作者本项原话 → 主编和两位编剧互不可见地独立生成 → 保存三份意见 → 作者选择/组合/自写 → 主编只按选择整理 → 作者确认 → 推进下一项。全部必要项确认后生成活动设定版本。</p><h5>4. 分卷</h5><p>编译开书、设定、上一卷结算、当前状态、节奏和作者想法 → 两位编剧独立方案 → 主编融合 → 作者编辑/确认 → 活动卷纲生效。上游版本变化会使候选过期。</p><h5>5. 事件链与事件大纲</h5><p>活动卷纲 → 生成事件序列与因果衔接 → 作者调整顺序/增删拆并 → 确认事件链。选中当前事件后，结合完整事件链、卷目标和作者意见生成事件大纲候选 → 作者融合/确认。</p><h5>6. 当前事件章纲</h5><p>先评估完整事件需要的章数和字数，再生成连续章链。每章纲冻结卷纲、事件链和事件大纲版本。作者确认整个事件章链后，最前未完成章进入正文生产。</p><h5>7. 单章正文</h5><p>准备冻结资料包 → 单一活动写手生成完整初稿 → 硬格式与边界检查 → 事实/文学/体验三席并行审查 → 形成可执行修改清单 → 作者编辑或定点修订 → 作者定稿 → 不可变正文版本 → 章节结算。硬检查同时拦截内部治理说明和最近5章大段模板复用；最多2轮定点修复，仍失败则阻断。</p><p>三席互不读取报告；正式正文不批量跨章生成。结果未知时停止自动重试。本地确定性写手只用于显式测试，正常作者流程缺少创作模型时直接提示配置模型，不生成伪正文。</p><h5>8. 事件与卷结算</h5><p>事件所有章节定稿后，按正文实际内容汇总结果、代价、人物变化、伏笔和下一事件触发；比较计划与实际并由作者确认。卷内事件全部完成后生成卷结算、遗留问题和下一卷起点。</p><h5>9. 续写</h5><p>导入预览 → 作者核对 → 不可变原文入库 → 分析和切片任务 → 带来源的设定/状态/事件/卷候选 → 作者确认缺口 → 进入当前卷—事件流程。导入和分析不补造历史审查报告。</p><h5>10. 失败恢复</h5><ul><li>租约过期：Worker恢复检查点，已成功调用不重复执行。</li><li>本地确定性调用中断：可证明未执行时释放预算并重试。</li><li>远程结果未知：进入调和，不自动重发。</li><li>上游版本变更：旧候选过期，正式数据不回滚。</li><li>SQLite短暂写锁：只对上下文包落库和同任务附件绑定的明确锁冲突做最多3次有限退避；非锁错误立即失败，耗尽后保留检查点供任务恢复。</li><li>投影失败：正式事务保留，outbox重试重建。</li><li>主编切换：新epoch拒绝旧主编的迟到提交。</li></ul><h5>11. 已退役运行流</h5><p>运行时只接受绑定明确业务对象与活动版本的作者输入和AI任务，不注册非对象化消息入口或会话任务。</p><hr><h3>当前账号安全、隐私与运行运维合同</h3><blockquote>当前源文件：<code>docs/SECURITY_AND_OPERATIONS.md</code> · 指纹：<code>6c039b3d0b5d</code></blockquote><h4>当前账号安全、隐私与运行运维合同</h4><h5>1. 保护目标</h5><p>保护书籍隔离、作者原件、正式正文、正史、活动规划、模型凭证、本机文件、预算、任务提交、检索投影和备份。浏览器输入、导入文件、附件、模型输出、检索文本和工具响应全部视为不可信输入。</p><p>安全机制只保护数据和运行边界，不替作者决定剧情，也不把软创作建议升级为硬门禁。</p><h5>2. 网络与部署边界</h5><ul><li>API、Worker协调端口、SQLite、文件、LanceDB和内部健康信息不直接暴露公网；</li><li>本机测试时API与Web开发服务使用回环地址；公网时由同机HTTPS反向代理接收 <code>wenmixiezuo.com</code> 并转发到回环端口；</li><li>Host只接受API监听地址和配置的Web域名，Origin只接受当前Web Origin，写请求校验 <code>Sec-Fetch-Site</code> 与JSON内容类型；</li><li>CORS只允许配置的Web Origin并携带凭证；SSE使用同一账号会话和书籍权限，不在URL携带令牌；</li><li>反向代理负责TLS证书、HTTP到HTTPS跳转、请求大小和访问日志；公网部署时注册、登录与全局请求限流由应用层 <code>@fastify/rate-limit</code> 在API内执行；</li><li>不开放SQLite、Worker、向量库、图数据库或开发服务器端口，不以端口映射代替正式部署；</li><li>联网研究继续经过域名、协议、地址、跳转、大小和内容类型限制。</li><li>完整公网部署步骤、Caddy 配置、systemd 服务单元、备份脚本和运维命令见 <button type="button" class="inline-doc-link" data-open-document="document-18">DEPLOY.md</button>。</li></ul><h5>3. 账号、密码与HTTP会话</h5><p>本机和公网使用同一账号体系，不存在固定本机用户或自动取得数据权限的页面会话。首发采用邮箱加密码：邮箱规范化后唯一；密码长度10至128字符，使用每账号独立随机盐和scrypt摘要，不保存或记录明文。首个注册账号在 <code>BEGIN IMMEDIATE</code> 事务中成为管理员；若历史本机老板所有者尚未被账号认领且包含书籍，该管理员在同一事务中复用它。后续账号为普通用户并创建全新所有者。升级迁移只允许在“唯一管理员、当前所有者无书、历史所有者存在且未认领”的条件下切换关联，不复制、不删除创作数据。</p><p>登录成功生成高熵随机令牌，浏览器只通过 HttpOnly、SameSite=Lax、Path=/ Cookie持有明文；服务端 <code>auth_sessions</code> 只保存SHA-256摘要、到期、最近活动和撤销时间。公网HTTPS启用Secure；退出、账号暂停和到期立即使会话失效。API重启不应让有效会话无故失效。</p><p>除 <code>/health</code>、注册和登录外，所有作者API必须验证会话；Worker内部端点使用独立且恒定时间比较的Worker令牌。所有业务范围从会话取得 <code>user_id + owner_id + role</code>，不能信任客户端提交的owner。管理员只能进入专用管理路由；普通业务路由即使管理员访问，也仍只读取管理员自己owner下的书籍。</p><h5>3a. 会员与算力值门禁</h5><p>普通账号注册时自动获得长期有效的青铜体验（20万算力值）；付费档为白银2000万、黄金5000万、钻石2亿算力值，当前周期12个月。算力值=真实token×2；<code>usage_ledger</code>与预算保存真实token，作者界面只显示算力值。生成门禁在 <code>TaskService.create</code> 统一执行：会员缺失、到期或算力耗尽分别返回可恢复的403；开书确认本身不触发AI任务，建书后由作者主动开始设定协作。管理员和未关联账号的本机遗留/测试owner不受会员门禁；会员开通、续费和撤销只限管理员，每账号至多一条活动记录，升级后书籍预算按配额的一半真实token同步刷新。</p><p>公开邀请用户前必须补齐并验收：邮箱验证、找回密码、注册/登录限流与异常告警、用户协议与隐私政策、账号注销和数据导出、HTTPS反向代理、备份恢复、管理员账号预创建。手机号和微信需要真实供应商/开放平台凭证与回调域名，后续绑定到同一 <code>user_id</code>，不能创建第二套账号数据。</p><h5>4. 输入与输出限制</h5><div class="table-scroll"><table><thead><tr><th>对象</th><th>当前限制原则</th></tr></thead><tbody><tr><td>作者单字段输入</td><td>按字段Schema和Unicode字符数限制；保留原话，拒绝控制字符和异常超长输入</td></tr><tr><td>作者附件</td><td>白名单类型、大小上限、哈希、独立保存名、解析状态和绑定对象</td></tr><tr><td>导入正文</td><td>先进入预览与隔离区，确认章节顺序后才写不可变原件</td></tr><tr><td>查询与筛选</td><td>参数化SQL、枚举白名单、分页上限、书籍隔离键</td></tr><tr><td>模型输出</td><td>Schema校验、长度限制、来源检查和候选状态；不能直接执行代码或SQL</td></tr><tr><td>SSE事件</td><td>固定事件类型、结构化数据、单事件大小限制和断线恢复游标</td></tr><tr><td>日志字段</td><td>脱敏、截断、路径归一和密钥扫描</td></tr></tbody></table></div><p>前端显示模型文本时使用React文本转义；需要Markdown时只允许安全子集，不允许任意HTML、脚本、事件属性或危险URL。</p><h5>5. 书籍与版本隔离</h5><p>所有核心记录携带 <code>owner_id</code> 和 <code>book_id</code>。Repository方法必须显式接收隔离范围；跨书查询、任务领取、检索、附件绑定、正文读取和SSE订阅均测试错误书籍ID零命中。</p><p>活动开书、设定、卷纲、事件和章纲版本通过明确指针引用。任务冻结上游版本、正史水位和主编epoch；上游改变、主编切换或任务取消后，迟到结果只能进入隔离记录，不能覆盖当前候选或正式数据。</p><h5>6. 模型凭证与隐私</h5><ul><li>API Key只从环境变量读取；</li><li>Key不得写入SQLite、配置文件、Git、日志、任务、ContextPack、模型请求快照、导出或备份；</li><li>错误信息只显示供应商、模型、状态码、请求ID和可执行处理，不显示认证头；</li><li>模型调用只发送当前任务编译后的当前书籍信息；其他书、无关正文和未授权附件不得进入请求；</li><li>调用记录保存模型绑定、预算、Token、耗时、来源指纹、结果状态和安全摘要，不保存思维链；</li><li>本地嵌入模型只读取允许索引的文本，不联网下载运行时代码。</li></ul><h5>7. 作者原件、附件与正文</h5><p>作者附件和导入原件使用独立不可变文件保存，SQLite记录哈希、大小、类型、创建时间、绑定对象和解析状态。展示文件名与物理保存名分离，禁止路径穿越、绝对路径注入、符号链接逃逸和脚本执行。</p><p>正文使用不可变完整版本。任何编辑、AI修订或作者接管都创建新版本；定稿与结算在事务中引用明确正文版本。正式正文文件写入采用临时文件、刷新、原子改名和哈希校验，禁止静默覆盖。</p><p>普通删除为归档。书籍永久删除只允许已归档书，必须先显示影响预览；用户输入 <code>YES</code> 并再次确认后，服务端重新校验归档状态，在事务和文件清理协调下删除全书数据并写墓碑。</p><h5>8. Agent、工具与权限</h5><p>岗位、Agent实例和模型绑定分离。创作成员只获得当前任务ContextPack和允许提交的候选类型，不能自由访问数据库、文件系统、网络、密钥或其他书。</p><p>小文秘书是确定性本地工具角色，只处理导航、附件、任务状态、格式检查和故障回执，不给剧情结论、不冒充模型，也没有通用Shell、SQL或联网权限。</p><p>模型提出以下行为时只能形成候选或被阻断：提升正史、覆盖正文、扩大联网、增加费用、永久删除、跨书读取、修改权限、绕过作者确认、执行任意SQL或命令。最终授权由应用状态机判定，不由自然语言自称判定。</p><h5>9. 联网研究与版权来源</h5><p>联网只允许 <code>http/https</code>，拒绝环回、私网、链路本地、文件协议、非标准重定向和解析后地址变化。每次跳转重新校验，限制响应大小、超时、内容类型和并发。下载内容进入来源区，不自动成为设定、正史或正文事实。</p><p>研究记录保存URL、标题、抓取时间、来源类型、短摘录、主张、许可备注和用途。大段版权原文不得进入主笔ContextPack；系统使用主张、结构卡和必要短摘录，并与创作索引物理隔离。</p><h5>10. 任务、租约与恢复</h5><p>任务状态由SQLite事务维护：<code>pending → queued → working → succeeded</code>，并支持 <code>failed</code>、<code>timeout</code>、<code>cancelled</code> 和可重试状态。Worker只能领取允许的任务类型，写入检查点、心跳、租约epoch和幂等键。</p><ul><li>Worker失联后等待租约超时再接管；</li><li>取消或重写后，原任务结果即使返回也不能提交；</li><li>内容格式错误和可重试供应商故障按任务策略有限重试；</li><li>预算、权限、版本错配、作者确认缺失和永久操作不自动重试；</li><li>Worker不得直接修改正式正文或核心正史；</li><li>失败任务保留已完成候选与检查点，恢复时不重复收费调用。</li></ul><p>成员状态只由真实任务、心跳、模型调用和工具事件派生。等待上游时显示等待，不使用定时动画伪造工作。</p><h5>11. 检索投影安全</h5><p>SQLite正式源和不可变原件是恢复依据。FTS、LanceDB、关系、Wiki、摘要和切片均为可重建投影，并携带书籍、来源版本、故事时间、水位和快照ID。</p><p>构建新快照时继续使用已验证活动快照。新快照通过来源覆盖、跨书隔离、时间过滤、无答案和冻结查询探针后原子切换。投影损坏或水位落后时明确降级或阻断，不静默使用陈旧结果。</p><h5>12. 日志与可观测性</h5><p>结构化日志允许：时间、组件、任务、书籍匿名标识、请求ID、模型、状态、耗时、Token、预算、错误类别、检索通道、水位和恢复动作。</p><p>日志禁止：API Key、Cookie、认证头、正文全文、附件正文、作者敏感原话、完整ContextPack、任意本机私密路径和模型思维链。错误堆栈在对外显示前移除密钥、查询参数、用户内容和非项目路径。</p><h5>13. 备份与恢复</h5><p>一致性备份至少包含SQLite在线备份、不可变原件/正文、必要配置清单、活动版本指针和文件哈希。向量、FTS缓存和其他可重建投影可以不作为唯一备份，但恢复后必须重建并验证水位。</p><p>同一磁盘上的复制和Git历史不等于第二物理备份。重要书籍需要写入另一块物理磁盘并完成恢复演练。恢复顺序为：校验清单与哈希 → 恢复权威数据 → 校验书籍隔离和活动版本 → 重建投影 → 运行探针 → 开放写入。</p><h5>14. 桌面启动与停止</h5><p>桌面启动器只启动本项目登记的API、Worker和Web进程，先执行迁移，再通过不创建账号会话的轻量 <code>/health</code> 探针确认数据库与Worker就绪，最后打开登录页。全库完整性检查属于迁移、备份和正式验收，不放入高频启动轮询。模型套餐地址必须通过严格路径校验；错误时停止启动并显示可处理原因。</p><p>兼容环境中的 <code>ANTHROPIC_AUTH_TOKEN</code> 只有在同一进程或Windows用户环境同时提供 <code>ANTHROPIC_BASE_URL</code>，且该地址严格等于火山方舟HTTPS主机的 <code>/api/plan</code> 或 <code>/api/coding</code> 时才可按对应套餐使用。地址缺失、普通Anthropic地址、未知主机、端口、查询参数、片段或其他路径均视为无效；专用 <code>WENMI_ARK_*</code> 凭证与端点始终优先。兼容令牌不复制到项目文件或另一环境变量，只在启动进程内存中解析，并与其他模型凭证一起从Web和Worker环境移除。</p><p>停止入口只消费由本项目生成并校验的停止请求和进程登记，不枚举或终止其他应用。启动、停止、重复启动、异常退出和端口占用都要有明确回执。</p><h5>15. 必测项</h5><ul><li>Host、Origin、Cookie、CSRF、DNS重绑定、SSE和回环监听；</li><li>跨书读取、写入、任务、附件、检索和事件订阅零串线；</li><li>路径穿越、恶意文件名、异常编码、超长输入和危险Markdown；</li><li>密钥、正文、附件、ContextPack和本机路径不进入日志；</li><li>取消栅栏、租约接管、幂等、迟到结果、预算和主编epoch；</li><li>空库迁移、已有库顺序升级、重复迁移和失败恢复；</li><li>投影错水位、损坏、缺失、重建、降级和原子切换；</li><li>不可变正文、定稿结算和书籍永久删除双确认；</li><li>启动、停止、重复启动、端口冲突与桌面入口；</li><li>备份哈希、第二物理介质和完整恢复演练。</li></ul><hr><h3>文秘写作 · 公网部署指南</h3><blockquote>当前源文件：<code>docs/DEPLOY.md</code> · 指纹：<code>3f7a971800fe</code></blockquote><h4>文秘写作 · 公网部署指南</h4><p>本文档说明如何将文秘写作部署到香港云服务器，通过 <code>wenmixiezuo.com</code> 域名对外提供服务。</p><h5>部署架构</h5><pre class="code-block"><code data-language="">用户浏览器 (HTTPS)
       │
       ▼
  Caddy 反向代理 (:443)          ← TLS 终止、安全头、请求大小限制
       │
       ├─ /api/*  ──→  API 服务 (127.0.0.1:43111)
       ├─ /health  ──→  API 健康检查
       └─ 其他      ──→  静态文件 (apps/web/dist)
                              │
                              ▼
                         Worker 服务 (独立进程)
                              │
                              ▼
                         SQLite (WAL 模式)
                         LanceDB (向量检索)</code></pre><ul><li><strong>Caddy</strong>：反向代理 + TLS（Let&#039;s Encrypt 自动证书）+ 静态文件；限流由应用层 <code>@fastify/rate-limit</code> 提供（注册 3/5分钟、登录 10/5分钟、全局 100/分钟），Caddy 配置只使用内置模块，无需 xcaddy 编译插件</li><li><strong>API</strong>：Fastify 5，监听 <code>127.0.0.1:43111</code>，不直接暴露公网</li><li><strong>Worker</strong>：独立进程，监听 <code>127.0.0.1:43111</code> 内部端点，执行模型任务</li><li><strong>数据库</strong>：<code>node:sqlite</code> 内置 SQLite，WAL 模式，文件存储于 <code>data/database/</code></li></ul><h5>前置条件</h5><h6>1. 服务器</h6><ul><li><strong>操作系统</strong>：Ubuntu 24.04 LTS（推荐）或 22.04 LTS</li><li><strong>CPU</strong>：4 核以上（LanceDB 向量索引需要）</li><li><strong>内存</strong>：4 GB 以上（推荐 8 GB，模型推理时 <code>@huggingface/transformers</code> 需要）</li><li><strong>磁盘</strong>：40 GB 以上（系统 + 项目 + 数据库 + 备份）</li><li><strong>网络</strong>：公网 IP，端口 80 和 443 可访问</li></ul><h6>2. 域名</h6><ul><li>购买 <code>wenmixiezuo.com</code>（任意域名注册商）</li><li>将域名 DNS A 记录指向服务器公网 IP</li><li>等待 DNS 生效（通常 5-30 分钟）</li></ul><h6>3. 软件依赖</h6><pre class="code-block"><code data-language="bash">#### 更新系统

#### 安装 Node.js 24（使用 NodeSource）

sudo apt install -y nodejs

#### 验证版本
node --version   # 应输出 v24.x.x
npm --version    # 应输出 11.x.x

#### 安装 Caddy
sudo apt install -y debian-keyring debian-archive-keyring apt-transport-https
curl -1sLf &#039;https://dl.cloudsmith.io/public/caddy/stable/gpg.key&#039; | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
curl -1sLf &#039;https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt&#039; | sudo tee /etc/apt/sources.list.d/caddy-stable.list
sudo apt update
sudo apt install -y caddy

#### 安装 SQLite 命令行工具（用于备份）

#### 安装其他工具
sudo apt install -y git curl unzip build-essential</code></pre><h5>部署步骤</h5><h6>第一步：创建系统用户</h6><pre class="code-block"><code data-language="bash">sudo useradd -r -m -d /opt/wenmi -s /bin/bash wenmi
sudo usermod -aG wenmi wenmi</code></pre><h6>第二步：部署项目代码</h6><pre class="code-block"><code data-language="bash">#### 克隆仓库（替换为实际仓库地址）

#### 或者从本机 rsync 上传

#### 编辑配置，填入真实的 API Key 和模型 ID

#### 检查 HTTPS 访问

#### 再停 API

#### 启动 API

#### 再启动 Worker
sleep 5
sudo systemctl start wenmi-worker</code></pre><h6>更新部署</h6><p>服务器在线目录不含<code>.git</code>。所有构建先在公网不可见的 <code>/opt/wenmi-releases/&lt;commit&gt;</code> 完成，在线目录只做经过验证的原子切换。</p><h6>Web-only（不改API、Worker、迁移）</h6><ol><li>本机运行相关Web测试、Web类型检查/构建和文档检查；提交后用LF归档上传暂存目录。</li><li>在暂存目录构建Web，验证入口和哈希资源；不得先覆盖当前在线 <code>apps/web/dist</code>。</li><li>把新哈希JS/CSS作为新增资源放入在线静态目录，保留旧哈希资源；备份旧<code>index.html</code>后原子替换入口。</li><li>验证首页、新资源、登录、目标页面和旧入口回滚。此流程不重启API/Worker、不改数据库，因此不等待在途任务清零。</li></ol><h6>API / Worker / 数据迁移</h6><ol><li>本机按风险运行完整 <code>npm run verify</code> 及受影响迁移/恢复测试；使用 <code>git -c core.autocrlf=false -c core.eol=lf archive</code> 生成发布包。</li><li>在唯一暂存目录完成受影响服务构建和迁移预检；迁移只向后兼容，已合并迁移字节变化立即停止。</li><li>正式迁移前备份数据库。查询 <code>tasks</code>，<code>working</code>、<code>queued</code>、<code>pending</code>、<code>waiting_confirmation</code> 连续30秒为0，并在每次重启前立即复核；只等待，不取消/暂停/改写作者任务。</li><li>逐个原子切换并重启受影响服务，每一步检查active、日志、健康和任务恢复；失败立即回滚，不继续扩大。</li><li>最后切换需要更新的Web入口，验证旧缓存兼容、登录、书籍隔离和核心链路。旧构建保留到验收结束。</li></ol><p>暂存、备份和切换路径带提交号，不复用未核验旧目录。发布命令逐步执行并逐步看结果。</p><h6>手动备份</h6><pre class="code-block"><code data-language="bash">sudo -u wenmi /opt/wenmi/deploy/backup.sh</code></pre><h6>恢复备份</h6><pre class="code-block"><code data-language="bash">#### 1. 停止服务
sudo systemctl stop wenmi-worker wenmi-api

#### 2. 校验备份文件

#### 3. 替换数据库

  /opt/wenmi/data/database/wenmi.sqlite.before-restore
sudo -u wenmi cp /opt/wenmi/data/backups/daily/wenmi-YYYYMMDD.sqlite \
  /opt/wenmi/data/database/wenmi.sqlite

#### 4. 恢复文件
sudo -u wenmi tar -xzf /opt/wenmi/data/backups/daily/wenmi-files-YYYYMMDD.tar.gz \
  -C /opt/wenmi/data/

#### 5. 启动服务
sudo systemctl start wenmi-api
sleep 5
sudo systemctl start wenmi-worker

#### 6. 验证健康检查
curl -s http://127.0.0.1:43111/health | python3 -m json.tool</code></pre><h5>安全清单</h5><p>部署完成后，逐项确认以下安全检查：</p><ul><li>[ ] Caddy 已启用 HTTPS（<code>curl -I https://wenmixiezuo.com</code> 返回 200）</li><li>[ ] HTTP 自动跳转到 HTTPS</li><li>[ ] API 端口 <code>43111</code> 不对外暴露（<code>curl http://服务器公网IP:43111/health</code> 不可达）</li><li>[ ] 注册接口限流生效（短时间内连续注册 3 次后被拒绝）</li><li>[ ] 登录接口限流生效</li><li>[ ] Cookie 设置了 <code>HttpOnly</code>、<code>SameSite=Lax</code>、<code>Secure</code></li><li>[ ] 安全响应头存在（<code>X-Content-Type-Options</code>、<code>X-Frame-Options</code> 等）</li><li>[ ] 错误信息不泄露内部路径或密钥</li><li>[ ] <code>.env.production</code> 文件权限为 <code>600</code>（<code>ls -la /opt/wenmi/deploy/.env.production</code>）</li><li>[ ] 备份脚本已加入 cron 且正常执行</li><li>[ ] 第二物理备份已配置（不同磁盘或远程存储）</li></ul><h5>成本估算</h5><div class="table-scroll"><table><thead><tr><th>项目</th><th>月费（美元）</th><th>年费（美元）</th></tr></thead><tbody><tr><td>香港云服务器（4C8G）</td><td>~$25-40</td><td>~$300-480</td></tr><tr><td>域名 wenmixiezuo.com</td><td>~$1-2</td><td>~$12-15</td></tr><tr><td>Let&#039;s Encrypt 证书</td><td>免费</td><td>免费</td></tr><tr><td>火山方舟模型 API</td><td>按量计费</td><td>取决于创作量</td></tr><tr><td><strong>合计（不含模型）</strong></td><td><strong>~$26-42</strong></td><td><strong>~$312-495</strong></td></tr></tbody></table></div><p>模型 API 费用取决于实际使用量。每章正文（约 3,000-5,000 字）的模型调用费用约为 ¥0.5-3.0 人民币，包含设定、规划、正文、审查和点评的全流程。</p><h5>故障排查</h5><h6>Caddy 启动失败</h6><pre class="code-block"><code data-language="bash">#### 检查端口占用
sudo ss -tlnp | grep -E &#039;:80|:443&#039;

#### 检查配置语法

#### 查看 Caddy 日志

#### 手动运行测试

sudo -u wenmi node apps/api/dist/main.js</code></pre><h6>Worker 无法连接 API</h6><pre class="code-block"><code data-language="bash">#### 确认 API 已启动

#### 确认 Worker Token 一致
#### API 启动时从环境变量读取 WENMI_WORKER_TOKEN
#### Worker 启动时从同一环境变量文件读取</code></pre><h6>HTTPS 证书问题</h6><p>Let&#039;s Encrypt 证书在 Caddy 启动时自动申请和续期。如果证书申请失败：</p><pre class="code-block"><code data-language="bash">#### 确认域名 DNS 已指向服务器 IP
dig wenmixiezuo.com +short

#### 确认端口 80 可公网访问
sudo ufw status
sudo ufw allow 80/tcp
sudo ufw allow 443/tcp</code></pre><hr><h2>四、当前决定、开发计划与验收</h2><h3>当前生效决定</h3><blockquote>当前源文件：<code>docs/DECISIONS.md</code> · 指纹：<code>ce29f6b69e41</code></blockquote><h4>当前生效决定</h4><blockquote>本文件只保留会影响下一次开发的短决定。2026-08-21以前的完整决定日志保留在 Git 基线 <code>e8517d9</code>，必要时按编号追溯；默认开发不读取。</blockquote><h5>DEC-CURRENT-093 轻量规则与持续UI迭代（2026-08-21）</h5><ol><li>项目仍是未完成的初始产品，功能、工作流细节、页面结构、导航密度、卡片数量和视觉风格都允许继续调整；旧截图和旧文档不得冻结 UI。</li><li>默认阅读改成任务路由：新开发任务读一次短 <code>HANDOFF.md</code>；单页 UI 只读相关代码和 UI Skill；长篇工作流才触发长篇质量 Skill；大型规格仅按需查相应小节。</li><li>规则和验收按风险分级。普通 UI/文案不再强制设计审查、全量测试、四端构建、迁移恢复、真实模型或长期章节验收。安全/数据/核心工作流仍使用完整门禁。</li><li>Web 静态资源独立发布不重启后端时不要求等待任务清零；API、Worker或迁移发布继续执行连续30秒零在途任务和回滚门禁。</li><li>历史事故、旧验收证据和一次性发布日志只留在 Git 历史，不进入默认阅读、当前文档中心或产品检索。</li><li>长篇质量 Skill 只保护对象边界、真值、上下文、创造性和运行闭环，不固定 UI、团队呈现、测试数量或部署流程。</li><li>新增项目级 <code>wenmi-ui-ux</code> Skill，手机优先、逐层显露、单状态单主操作；大规模视觉重设计可按需使用已安装的 OpenAI 官方 <code>frontend-app-builder</code>。</li></ol><h5>当前产品决定摘要</h5><h6>分层创作</h6><p>开书给基础方向，设定只做非剧情骨架，卷定大故事方向，事件链定卷内因果，事件大纲定小故事，完整章链定顺序，近期详细章纲定场景与情绪，正文自由执行，结算只记实际。作者不需要一次填完整本书。</p><h6>设定与上下文</h6><p>核心设定为世界舞台、主角底板、规则与代价、边界与留白；其他设定按需补。作者原话绑定具体对象并区分必须、强偏好、灵感和问题。ContextCompiler按硬事实、当前任务、软参考和开放区编译，排除其他书、未确认候选、未摘录灵感和过期版本。</p><h6>卷路线与首卷</h6><p>后台结构方法版本化、可审计，普通作者只看至少两条具体且有实质差异的故事路线，可整选、片选、融合、编辑或重做。首卷必须设计前500字兴趣职责、黄金三章整体承诺、持续追读变化、防疲劳和约10万字内或卷末重大高潮；不得把打脸、战斗、反转等手段硬编码成统一公式。</p><h6>作者界面</h6><p>普通作者只看业务名称、自然状态、差异、结果和恢复动作，不看模型供应商、内部任务/讨论/方法ID、JSON、路径或堆栈。页面要逐层推进、少填少选、手机优先；作者始终可以修改、留空、重做或回到上一步。现有左书栏和顶部功能栏可作为连续性起点，但不是不可改变的门禁。</p><h6>数据与账号</h6><p>本机和公网使用统一账号登录；业务身份只来自已验证会话。核心对象携带 <code>owner_id</code>、<code>book_id</code>；正文不可变；SQLite正式对象是权威源，索引和摘要可重建。普通删除归档，永久删除需双重确认。</p><h6>AI协作与质量</h6><p>产品当前使用14名创作成员，岗位、实例和模型绑定解耦；成员数量或呈现如需调整，以老板后续决定和产品规格为准。同模型不冒充异模型独立复核。事实一致性不能以牺牲原创性、人物选择、合理惊喜、情绪力度和可读性为代价。</p><h6>验收与声明</h6><p>工程可达、真实模型质量和长期阅读效果分开声明。字段存在、页面可见或确定性夹具只证明工程层；文学质量必须来自真实内容阅读。默认按变更风险选择测试，不再把旧的148项总表作为每次开发门禁。</p><hr><h3>当前开发路线</h3><blockquote>当前源文件：<code>docs/DEVELOPMENT_ROADMAP.md</code> · 指纹：<code>df397122b31c</code></blockquote><h4>当前开发路线</h4><h5>P0 UI/UX整体重设计</h5><p>状态：重新打开，当前最高优先级。</p><ul><li>应用壳和手机导航：重新组织书籍、创作阶段、资料与辅助功能，不沿用两排入口或固定卡片布局。</li><li>开书：只收基础方向，表单分组、推荐和AI介入更简洁。</li><li>设定：四项核心清楚，扩展项按需；AI方案、片选、融合、质检和前置阻断在同页可理解、可恢复。</li><li>分卷：双路线比较围绕具体故事差异，首卷强启动自然融入，不显示内部结构术语。</li><li>事件/章纲：从卷方向到事件链、事件大纲、完整章链和近期细纲逐层可见，上一实际结果清楚。</li><li>正文：全屏写作优先，本章任务、相关事实、审查和结算按需打开。</li><li>资料/辅助：资料库、团队、任务、灵感、取名和设置不与主创作阶段争抢首层导航。</li></ul><p>每页先确定状态和交互原型，再统一视觉。手机检查360/390/430px，桌面检查比较、长内容与键盘操作。</p><h5>P0 核心流程稳定</h5><ul><li>设定整理、整份质检和第一卷规划的失败恢复保持可达。</li><li>活动版本、上游前置和作者确认不因UI重构失真。</li><li>普通作者响应保持白话洁净；管理员审计保留完整证据。</li><li>老旧数据、旧URL和已确认内容继续可读，不批量覆盖作者数据。</li></ul><h5>P1 分层创作质量</h5><ul><li>四项核心设定、按需补设定、内部双路线、首卷500字/黄金三章/重大高潮、事件链、章链、ContextCompiler继续按真实使用反馈优化。</li><li>重点防止候选同质、软参考变硬、计划污染实际、重复情节、人物工具化和上下文噪声。</li><li>真实文学质量按题材样本阅读；工程字段和自动测试不承诺爆款效果。</li></ul><h5>P2 运营与可靠性</h5><ul><li>账号、会员、预算、后台模型管理、任务恢复和备份按真实运营问题迭代。</li><li>Web-only发布与后端发布分开；API/Worker/迁移继续使用静默窗口和回滚。</li><li>邮箱验证、找回密码、协议/隐私、导出/注销等在公开运营前完成。</li></ul><h5>暂停项</h5><ul><li>单书20章验收已按老板要求停止；只有重新明确要求才继续。</li><li>50/100/200章不作为当前开发任务，也不阻塞UI和功能调整。</li><li>历史事故、旧双书和旧测试数字只在Git历史追溯。</li></ul><h5>验证方式</h5><p>按 <code>docs/ACCEPTANCE.md</code> 风险矩阵选择：UI页做相关组件测试、Web类型检查/构建和关键宽度；数据、权限、迁移、恢复或核心工作流才运行完整 <code>npm run verify</code>。当前最近已知全量基线为184个测试文件、779项通过，最新迁移0062。</p><hr><h3>验收标准</h3><blockquote>当前源文件：<code>docs/ACCEPTANCE.md</code> · 指纹：<code>a1aca0a2898d</code></blockquote><h4>验收标准</h4><h5>1. 完成的基本含义</h5><p>完成 = 用户目标已实现、受影响路径可用、没有已知阻断缺陷、验证与风险相称。工程机制通过、真实模型质量通过、长期阅读效果通过必须分别声明，不能互相冒充。</p><h5>2. 所有改动的共同检查</h5><ul><li>改动范围与用户要求一致，没有顺手扩大权限或覆盖无关修改。</li><li>无明文密钥、密码、会话、模型思维链、路径/堆栈或内部协议泄漏。</li><li>涉及书籍数据时，<code>owner_id</code>、<code>book_id</code> 隔离和不可变正文成立。</li><li>新失败状态有用户能理解的原因和恢复动作；旧数据与旧缓存至少可读或有明确兼容路径。</li><li>产品文案和页面不把软参考伪装成必须，不把计划冒充正文实际。</li></ul><h5>3. 按风险选择门禁</h5><div class="table-scroll"><table><thead><tr><th>变更类型</th><th>必须验证</th><th>不默认要求</th></tr></thead><tbody><tr><td>文案、规则、Skill</td><td>相关结构校验；当前文档同步与检查</td><td>全量应用测试、四端构建、生产部署</td></tr><tr><td>单页 UI/样式</td><td>相关组件测试（若有）；Web类型检查；Web构建；关键宽度走查</td><td>全量迁移、API/Worker构建、长期章节验收</td></tr><tr><td>局部前端逻辑</td><td>受影响测试；Web类型检查/构建；成功/空/加载/失败/恢复状态</td><td>无关包全量测试</td></tr><tr><td>局部API/Worker</td><td>受影响测试；对应包类型检查/构建；权限与错误合同</td><td>无关UI真机、长期文学验证</td></tr><tr><td>数据迁移/权限隔离/核心工作流</td><td><code>npm run verify</code>；迁移幂等/升级/恢复；真实服务冒烟；隔离测试</td><td>无关市场效果承诺</td></tr><tr><td>生产发布</td><td>按发布类型执行 <code>docs/DEPLOY.md</code>；保留回滚；公网冒烟</td><td>Web-only发布等待后端任务清零</td></tr></tbody></table></div><p>同一次提交中若包含多类改动，采用最高相关风险，不叠加无关门禁。</p><h5>4. UI/UX 验收</h5><p>页面至少覆盖：初始/空、可编辑、AI工作中、待作者决定、已完成、失败与恢复。每个状态只有一个显著主操作，次要操作不抢层级。</p><p>手机优先检查 360、390、430px：</p><ul><li>无非预期横向滚动；正文和输入区可读；固定区域不遮住主内容。</li><li>主要触控目标约44px；输入字号不小于16px；键盘弹起后焦点和提交按钮仍可达。</li><li>长文本、长书名、任务进度、错误提示不会把页面撑坏。</li><li>页面标题、当前对象、当前状态和下一步操作可以在首屏快速理解。</li></ul><p>桌面端检查层级、密度、键盘焦点、空白和长内容；不以堆卡片、堆说明或重复导航来填满页面。</p><h5>5. 分层创作验收</h5><ul><li>开书、设定、卷、事件、章纲、正文与结算职责不串层。</li><li>作者可以接受、选择片段、融合、编辑、留空或重做；刷新后选择和确认版本不漂移。</li><li>未确认候选、其他书、独立灵感、过期版本不进入正式下游上下文。</li><li>第一卷的前500字、黄金三章和重大高潮职责能逐层找到承载对象，但具体手段保持题材差异。</li><li>事件和章节衔接读取上一实际结果，不只重复上游计划。</li><li>普通作者只看白话故事责任，不看内部结构方法、模型/任务ID或机器合同。</li></ul><h5>6. AI与长篇质量证据</h5><ul><li>E0：规格存在。</li><li>E1：机制/字段存在。</li><li>E2：确定性工程链路与自动测试通过。</li><li>E3：真实模型、多样本或独立阅读证据通过。</li><li>E4：真实长篇分阶段阅读与连续性验证通过。</li></ul><p>只做到E1/E2时可以声明“工程实现完成”，不能声明“文学质量、爆款效果或长期稳定性完成”。真实长篇验收仅在用户明确要求时按20/50/100/200章或指定规模执行，不是日常开发门禁。</p><h5>7. 重大缺陷</h5><p>出现下列任一项不得宣布完成：跨用户/跨书泄漏、作者原文被覆盖、未授权永久删除、明文密钥/会话泄漏、旧数据无法进入且无迁移/恢复、主流程阻断、生产服务不可用、用户被困在无恢复动作的失败状态。</p><p>视觉偏好、次要文案和可继续优化项应如实记录，但不与安全或数据阻断混为同一级别。</p><h5>8. 文档与Skill</h5><p>当前规则只描述生效状态；历史证据在 Git。Skill 主文件保持短，参考按任务路由。当前规格、规则或Skill改变时运行：</p><pre class="code-block"><code data-language="powershell">node scripts/sync-project-docs.mjs
node scripts/sync-project-docs.mjs --check</code></pre><p>旧的A—J 148项表、200章事故证据与阶段发布日志已归档，仅在专项复核时使用，不再阻塞普通功能和UI迭代。</p><hr><h3>当前功能覆盖矩阵</h3><blockquote>当前源文件：<code>docs/COVERAGE_MATRIX.md</code> · 指纹：<code>7d818f69248d</code></blockquote><h4>当前功能覆盖矩阵</h4><div class="table-scroll"><table><thead><tr><th>能力</th><th>权威规格</th><th>主要实现</th><th>主要测试</th></tr></thead><tbody><tr><td>开书与定位</td><td>PRODUCT、WORKFLOW V2</td><td>books/onboarding/positioning</td><td>positioning-onboarding、api-flow</td></tr><tr><td>设定对象协作</td><td>WORKFLOW V2、AGENT SYSTEM</td><td>setting workspace/collaboration commands</td><td>setting-collaboration、setting panel</td></tr><tr><td>作者想法与附件</td><td>PRODUCT、DATA MODEL</td><td>author planning inputs/attachments</td><td>author-collaboration、author-attachments</td></tr><tr><td>分卷</td><td>WORKFLOW V2</td><td>volume plan services/pipelines</td><td>volume planning/generation tests</td></tr><tr><td>事件链与事件大纲</td><td>WORKFLOW V2</td><td>story event services/pipelines</td><td>story event planning/generation tests</td></tr><tr><td>当前事件章纲</td><td>WORKFLOW V2</td><td>event chapter outline services</td><td>event chapter outline/generation tests</td></tr><tr><td>单章正文与审查</td><td>PRODUCT、RUNTIME</td><td>chapter production/review services</td><td>chapter creation/review/approval tests</td></tr><tr><td>章节/事件/卷结算</td><td>LONGFORM QUALITY</td><td>settlement/continuity/projection</td><td>settlement projections/planning settlement tests</td></tr><tr><td>上下文与混合RAG</td><td>MEMORY、HYBRID RAG</td><td>context packs/retrieval orchestration</td><td>retrieval、context、isolation tests</td></tr><tr><td>续写与反向拆解</td><td>PRODUCT、WORKFLOW V2</td><td>continuation services</td><td>existing-manuscript-continuation</td></tr><tr><td>图谱/资料库/取名</td><td>PRODUCT</td><td>projections/knowledge/naming</td><td>projection、knowledge、naming tests</td></tr><tr><td>任务、预算和恢复</td><td>ARCHITECTURE、RUNTIME</td><td>task/model/budget services</td><td>fault/runtime/recovery tests</td></tr><tr><td>备份与删除</td><td>SECURI
