on type="button" class="card" data-category="Codex 工作规则" data-search="文秘写作当前任务 类型、全量测试、构建、迁移、启动、跨书隔离、任务恢复、对象化工作流和文档同步全部通过；存在重大bug、正文覆盖、跨书污染、不可恢复任务或文档版本错配时不得宣布完成。 tasks.md codex 工作规则" data-open-document="document-34"><div class="card-top"><span class="tag">Codex 工作规则</span><span class="meta">4.0 KB · 909382c29fe8</span></div><h2>文秘写作当前任务</h2><p>类型、全量测试、构建、迁移、启动、跨书隔离、任务恢复、对象化工作流和文档同步全部通过；存在重大BUG、正文覆盖、跨书污染、不可恢复任务或文档版本错配时不得宣布完成。</p><div class="card-footer"><span class="path">TASKS.md</span><span class="read">阅读全文 →</span></div></button></section></main><dialog id="reader"><div class="reader-shell"><header class="reader-head"><button type="button" class="copy-reader" id="copy-reader">复制全文</button><button type="button" class="close" id="close-reader" aria-label="关闭">×</button><h2 id="reader-title"></h2><div class="reader-meta" id="reader-meta"></div></header><article class="document" id="reader-content"></article></div></dialog><template id="project-reference-bundle" data-title="文秘写作当前项目完整合订版" data-path="docs/PROJECT_REFERENCE_BUNDLE.md" data-meta="六个目录 · 34份当前资料 · 可整页复制"><h1>文秘写作当前项目完整合订版</h1><p>本文件由当前文档白名单自动合并，只包含现版本生效的产品、流程、架构、数据、AI成员、上下文、检索、质量、开发与验收规则。适合整页复制给 DeepSeek 评审；原始短文档仍保留用于精确维护。</p><p>共 <strong>34</strong> 份源文档，按以下六个目录合并：</p><ul><li>一、产品定位与完整工作流（5份）</li><li>二、AI成员、上下文、检索与创作质量（8份）</li><li>三、系统架构、数据、接口与运行（5份）</li><li>四、当前决定、开发计划与验收（5份）</li><li>五、Codex开发协作与当前状态（4份）</li><li>六、长篇质量审查 Skill（7份）</li></ul><blockquote>权威说明：老板最新明确决定优先；本合订版由源文档自动生成，不单独手工维护。</blockquote><h2>一、产品定位与完整工作流</h2><h3>文秘写作</h3><blockquote>当前源文件：<code>README.md</code> · 指纹：<code>d1b1646f4e8a</code></blockquote><h4>文秘写作</h4><p>文秘写作是一套本地优先的长篇小说 AI 协作平台。作者通过明确的创作对象推进工作，AI 成员直接给出独立方案、融合候选、正文和审查报告，不使用聊天推动创作。</p><h5>当前工作流</h5><pre class="code-block"><code data-language="text">开书信息 → 设定 → 分卷 → 事件链 → 当前事件大纲
→ 当前事件章纲 → 单章正文 → 章节结算 → 事件结算 → 卷结算 → 下一卷</code></pre><p>已有正文可以导入并反向拆解，再进入同一套卷—事件流程；导入原文不会被覆盖。</p><h5>使用入口</h5><ul><li>双击 <code>文秘写作-启动.cmd</code> 启动。</li><li>双击 <code>文秘写作-停止.cmd</code> 停止本项目进程。</li><li>双击桌面的“文秘写作项目文档”查看当前规则和功能说明。</li><li>项目总入口：<span class="document-reference">PROJECT_HANDBOOK.md · PROJECT_HANDBOOK.md</span>。</li><li>使用说明：<span class="document-reference">docs/USER_GUIDE.md · docs/USER_GUIDE.md</span>。</li></ul><h5>界面</h5><ul><li>左栏以可纵向滚动的单列固定大竖版封面显示书籍，书名在书籍栏中只写在封面内，中心“信息”页保留一次资料标题；新建和改名最多15字，字号随字数自动缩小。自动测试运行键只转成中文标签展示，旧数据不被改写。</li><li>创作台主步骤：信息、设定、分卷、规划、章纲、正文。</li><li>辅助工具：资料库（含图谱）和取名；顶部同一功能栏另有团队、任务、灵感与设置，其上方不再重复当前书名或当前功能。</li><li>不提供独立对话页或独立版权页。</li><li>AI 方案、作者选择、融合和修订都保存在对应业务对象中。</li></ul><h5>技术边界</h5><p>React、TypeScript、Vite、Fastify、SQLite、独立 Worker、REST/SSE 和本地 LanceDB 投影。服务只监听 <code>127.0.0.1</code>。SQLite 正式对象和不可变原文是权威来源；全文索引、向量、摘要、图谱和 Wiki 都是可重建投影。</p><h5>当前验证</h5><p>仓库运行时可达性审计为零孤儿源码；类型检查、145个测试文件中的543项测试、Contracts/API/Worker/Web生产构建均已通过。真实模型长期文学质量仍按 E3/E4 证据积累，不以工程测试冒充。</p><hr><h3>项目总章程</h3><blockquote>当前源文件：<code>docs/PROJECT_CHARTER.md</code> · 指纹：<code>50d5e57799ca</code></blockquote><h4>项目总章程</h4><h5>产品使命</h5><p>帮助作者有规划地完成长篇小说，同时保留作者决定权、人物生命力和合理惊喜。系统负责准备资料、提出方案、执行正文、核对事实和结算状态，不能把创作压成固定公式。</p><h5>唯一主流程</h5><p>开书信息 → 设定 → 分卷 → 事件链 → 当前事件大纲 → 当前事件章纲 → 单章正文 → 章节/事件/卷结算 → 下一卷。</p><p>已有正文导入与反向拆解是兼容入口，最终仍进入同一主流程。</p><h5>产品边界</h5><ul><li>创作台承载开书、设定、卷纲、事件、章纲和正文。</li><li>图谱与资料库合并为资料库，取名是创作台辅助工具。</li><li>应用启动直接进入创作台；左栏只显示可滚动书籍列表、新建和归档操作，不设书架首页，也不混入对象功能导航。</li><li>顶部功能栏统一提供信息、设定、分卷、规划、章纲、正文、资料库、取名、团队、任务、灵感与设置；点击左侧切换书，点击顶部切换功能页面。</li><li>默认界面采用iOS式浅色玻璃视觉，不设置独立版权页面。</li><li>灵感与生产工作流隔离，不保存为生产记忆，不自动生成或修改任何正式对象；只有作者主动摘录到具体对象后才能作为作者输入。</li><li>作者原话附着具体对象；AI 通过方案、差异、融合和修改反馈协作。</li><li>创作团队保持11名成员；小文秘书是工具角色，不计入创作成员。</li></ul><h5>权威与版本</h5><ul><li>作者确认的开书资料、设定、规划版本和不可变正文是正式来源。</li><li>规划描述未来，结算记录已经发生的事实。</li><li>分卷约束事件，事件链约束事件大纲，事件大纲约束章纲，章纲约束正文。</li><li>上游版本改变时，下游候选必须失效、重编译或重新确认。</li><li>摘要、向量、全文索引、图谱和 Wiki 只作导航或投影，争议事实回查正式源。</li></ul><h5>不可突破的门禁</h5><ul><li>所有核心记录和查询携带 <code>owner_id</code>、<code>book_id</code>，禁止跨书污染。</li><li>正文采用不可变完整版本，修改产生新版本。</li><li>API Key 只来自环境变量，不进入数据库、日志、上下文、备份、导出或 Git。</li><li>作者数据普通删除为归档；永久删除需影响预览、输入 <code>YES</code> 和二次确认。</li><li>AI 状态由真实任务、心跳、调用和工具事件驱动。</li><li>同模型不得冒充异模型独立意见。</li><li>灵感分身不得冒充生产成员状态，也不得写入正式对象、正史或结算。</li><li>不保存或展示模型思维链，只保存任务、来源、结论和调用证据。</li></ul><h5>成功定义</h5><p>作者可以从新建书籍连续推进到卷、事件、章纲和正文；每一步知道 AI 成员为什么介入、读取了什么、输出保存在哪里。系统可恢复、可追溯、跨书隔离，并在提升一致性的同时不降低原创性、人物可辨识度、情绪力度和整体阅读质量。</p><hr><h3>产品规格</h3><blockquote>当前源文件：<code>docs/PRODUCT.md</code> · 指纹：<code>d65b63be3b13</code></blockquote><h4>产品规格</h4><h5>1. 产品定位</h5><p>文秘写作是面向长篇网文作者的本地 AI 协作创作台。AI 模拟专业主创团队，但作者始终拥有最终选择、编辑、确认和定稿权。</p><h5>2. 信息架构</h5><h6>创作台</h6><p>应用启动后直接进入创作台，不经过书架首页。左栏是紧凑的独立书籍栏，只承担新建书籍、多书滚动切换、归档书籍恢复和当前书归档；书籍区使用可见滚动条独立纵向滚动，使用单列固定84×118像素竖版封面。在左侧书籍栏中，书名只写在封面内，不在封面右侧重复；状态或测试标签只显示在封面下方。中心“信息”页仍显示一次当前书名，作为开书资料的页面标题。书名最多15字，按1—4字、5—7字、8—10字、11—15字四档自动缩小字号。点击左侧书籍后，中心区保留当前功能并加载该书对应页面。自动验收书的内部运行标识只在展示层翻译为“流程测试/验收测试”，数据库原始标题继续保留用于追溯；普通作者书名原样保存。已有超长标题不批量回写，封面兼容显示为14字加省略号，完整标题仍保留在可访问名称中。</p><p>功能栏直接位于页面最上方，依次提供信息、设定、分卷、规划、章纲、正文、资料库、取名、团队、任务、灵感和设置。功能栏上方不再设置“当前书籍/当前功能”摘要条，也不重复显示书名或当前功能标签。主步骤为信息、设定、分卷、规划、章纲和正文；资料库统一呈现人物/地点/物品资料、关系、时间、伏笔、情绪和信息差。独立版权页面不装配。去掉右侧常驻团队栏、信号图标、卷章统计条与横向滚动导航。</p><p>默认视觉使用iOS式浅色玻璃体系：冷白和蓝灰背景、半透明顶栏与侧栏、系统字体、蓝色强调、柔和投影、细边框和大圆角。页面内容使用清晰分组与留白，不再沿用旧浅绿色大画布和密集纸张风格。</p><h6>AI 状态</h6><p>团队工作区显示全部11名创作成员的真实状态、当前任务、上下文摘要、输出摘要、耗时、模型来源和失败/重试情况。小文秘书只显示确定性工具、导航和故障回执，不冒充创作成员。</p><h6>灵感</h6><p>灵感是与正式生产隔离的多成员讨论室。作者可选择1—3名讨论分身围绕当前书交流；讨论分身只读取本书已确认资料和作者本轮问题，不读取其他书，不执行设定、卷纲、事件、章纲、正文、正史或结算写入。讨论内容默认不进入ContextCompiler。作者点击“摘录为灵感”并选择具体业务对象后，摘录才作为带来源的作者原话进入正式流程。</p><h5>3. 开书</h5><p>作者填写并可修改：书名、频道与分类、融合题材、主要标签、初始角色、故事方向、必须遵守、金手指或特殊机制、开篇信息及其他自定义想法。主角性格按外在气质、思考决策、核心驱动力、人际模式、压力反应、道德边界与矛盾成长面分类，并允许自定义。开书任务只接收本书完整开书资料，排除其他书、未摘录灵感和模型猜测。</p><p>创建成功后生成书籍、定位版本、11名成员实例、模型绑定、预算、设定工作区和首个设定提案任务；任何一步失败都不得留下半本书。</p><h5>4. 设定</h5><p>系统按本书题材动态组织作品策划、世界环境、力量/成长、势力、角色、规则、资源、冲突方式和故意留白。当前项由主编和两位编剧各自独立给出方案，作者可选择一份、组合多份、写自己的版本或要求重做；主编只按作者选择整理待确认稿。</p><p>设定阶段只读取开书信息、当前项、已确认前置设定和作者本项原话，不读取其他书、未摘录灵感、无关正文或未确认猜测。页面先显示“召集成员讨论”空状态；启动后显示每名参与成员的真实状态、任务、上下文摘要和输出摘要，方案返回后才显示方案卡。作者补充与修改输入默认折叠，按需展开。整份活动设定确认后才解锁分卷。</p><h5>5. 分卷</h5><p>作者填写或调整卷名、目标体量、卷目标、卷末状态、节奏偏好和自定义想法。主编组织两位异模型编剧独立设计，作者比较后选择、融合和编辑。</p><p>前端用大白话作为模板主标题和说明，同时用次级来源标签明确“救猫咪结构、三幕式、五幕式”等方法来源。模板可不用、多选混合、重排或自定义。</p><p>活动卷纲是当前卷未来创作的上层规划权威，不是已发生正史。</p><h5>6. 事件链与事件大纲</h5><p>系统把当前卷拆成有因果衔接的事件链。每个事件包含目标、触发条件、主要阻力、结果、承接下一事件的变化、预计章数和对应卷任务。作者可以移动、插入、拆分、合并和编辑事件。</p><p>选中事件后，编剧在完整事件链和活动卷纲约束下独立设计事件大纲。作者可选择冲突/爽点方向并输入自己的灵感。事件大纲必须说明起因、升级、关键转折、高潮、代价、结果和下一事件钩子，但模板不是硬公式。</p><h5>7. 当前事件章纲</h5><p>系统先评估完整事件大纲需要的章节数和总字数，再拆成连续章链。每章包含标题、目标字数、开头抓力、场景节拍、信息变化、人物选择、情绪变化、结尾钩子和作者指导意见。</p><p>章纲读取压缩后的开书、设定、卷纲、事件链，以及完整当前事件大纲；不得越过事件边界擅自规划其他事件。</p><h5>8. 单章正文</h5><p>一次只正式生产当前最前的一章。单一活动写手根据完整章纲创作正文，可在不破坏上层约束的前提下自由处理对话、动作、描写、节奏和细节。</p><p>正文完成后，事实、文学、体验三席使用三种独立模型并行审查：</p><ul><li>事实席只核对设定、人物状态、时间、因果、战力、伏笔和来源。</li><li>文学席关注语言、场景、节奏、重复、人物声音和情绪力度。</li><li>体验席模拟目标读者，判断代入、期待、爽点、困惑和弃读风险。</li></ul><p>三席互不读取报告。作者可直接编辑或要求定点修订；确认后生成不可变定稿版本。</p><h5>9. 结算与下一卷</h5><p>章节结算只根据定稿正文更新事实、人物状态、关系、时间、伏笔、摘要和检索投影。事件完成后比较计划与实际，记录结果、代价、未解决问题和下一事件触发。卷完成后生成卷总结、遗留伏笔和主角当前状态，并让作者规划下一卷。</p><h5>10. 续写与反向拆解</h5><p>作者可以导入已有正文。系统先解析章节、建立不可变原文和来源，再反向识别已发生设定、人物状态、事件、卷结构和开放问题。分析是带来源的派生候选，不能覆盖原文或冒充作者确认；补齐缺口后进入当前卷—事件流程。</p><h5>11. 模板与作者想法</h5><p>所有模板是软参考。作者原话按业务对象保存，并区分：必须、强偏好、灵感、问题。AI 可以提出有代价的替代方案，但不得静默违反“必须”，也不得把灵感自动升级为设定或正史。</p><h5>12. 数据与安全</h5><p>每本书严格隔离。SQLite 正式对象和不可变文件是权威源；全文、向量、图谱、Wiki、摘要均可重建。普通删除为归档，永久删除作者数据需要强确认。来源、原创性、研究与安全检查保留为后台生产门禁，不设置独立页面。</p><hr><h3>创作工作流 V2 完整设计</h3><blockquote>当前源文件：<code>docs/CREATION_WORKFLOW_V2_DESIGN.md</code> · 指纹：<code>0a85eecfd255</code></blockquote><h4>创作工作流 V2 完整设计</h4><h5>1. 核心对象链</h5><pre class="code-block"><code data-language="text">开书资料
  ↓
活动设定版本
  ↓
活动卷纲版本
  ↓
活动事件链 → 当前事件大纲版本
  ↓
当前事件章纲版本 → 当前单章章纲
  ↓
正文候选 → 作者定稿 → 章节结算
  ↓
事件结算 → 卷结算 → 下一卷</code></pre><p>每一层只规划自己的尺度。上层规定目标、边界和因果，下层保留表达自由。规划是未来，结算是已发生事实。</p><h5>2. 页面总布局</h5><ul><li>启动即进入统一创作台，不设书架首页和返回书架。</li><li>左侧纯书籍栏：使用紧凑宽度和带可见纵向滚动条的单列书架，每本书为固定84×118像素竖版封面。在左侧书籍栏中，书名只显示在封面内，封面右侧不重复；封面下只放状态或中文测试标签。中心“信息”页保留一次书名作为开书资料标题。书名最多15字，并按1—4、5—7、8—10、11—15字四档缩小字号。这里还包含品牌、新建书籍、归档书籍和当前书归档操作，不显示任何创作功能；点击封面只切换当前书。自动测试运行键只转换为中文测试标签展示，不改数据库原始证据，也不改普通作者书名；已有超长标题仅做兼容省略显示。</li><li>顶部完整功能栏：直接占据页面最上方，功能依次为信息、设定、分卷、规划、章纲、正文、资料库、取名、团队、任务、灵感和设置。功能栏上方不显示当前书名、当前功能或第二层摘要；点击入口只切换中心页面。</li><li>中心创作台：只承载当前书籍的当前功能页面，不再重复一套横向或左侧对象导航。</li><li>不显示常驻右栏、信号图标、卷章统计或横向导航滚动条。</li><li>窄屏：书籍栏变抽屉，功能栏使用无横向滚动的紧凑菜单，中心对象编辑优先。</li><li>默认视觉使用iOS式浅色玻璃材质、蓝灰画布、系统字体、蓝色强调、细边框、柔和阴影和大圆角；深色主题保持同一信息层级。</li></ul><p>正式生产通过当前对象上的“我的想法”“生成方案”“选择”“融合”“修改”“确认”完成。另有独立灵感室，但它不推进状态、不生成或修改正式对象；作者只有主动把讨论片段摘录到具体对象后，该片段才成为正式作者输入。</p><h5>3. 开书</h5><h6>作者输入</h6><p>书名、频道/分类、题材、标签、初始角色、故事方向、必须遵守、特殊机制、开篇信息和自由补充。每项保留原文与版本。</p><h6>系统动作</h6><p>先校验再原子创建书籍、定位版本、11名成员、模型绑定、预算和设定工作区。创建成功后自动排队第一个设定项三席提案。</p><h6>AI边界</h6><p>开书只做理解和准备，不直接生成卷纲、事件、章纲或正文。</p><h5>4. 设定</h5><h6>交互</h6><p>左侧或顶部显示设定项。进入当前项时先看到任务说明、参与成员和“召集成员讨论”；启动后显示三名成员各自的准备中/工作中/完成/失败状态、实际上下文摘要和输出摘要，方案返回后才显示三份卡片。作者原文、补充想法和修改意见默认折叠，点击时展开。作者可以：</p><ul><li>选一份；</li><li>选多份并指定如何组合；</li><li>输入自己的版本；</li><li>补充必须/偏好/灵感；</li><li>要求某一份重做；</li><li>确认、稍后补充、故意留白或不适用。</li></ul><h6>AI介入</h6><p>主编和两位编剧读取同一最小资料包，互相不可见，各给一份真正推荐的方案。作者选择后仅主编整理，不重新启动全团队。设定成员只在规则、能力、资源或世界逻辑需要时提供检查。</p><h6>解锁</h6><p>只有本书动态计算出的必要项确认后才生成活动设定版本；建议项不能锁死创作。</p><h5>5. 分卷</h5><h6>作者输入</h6><p>卷名、卷目标、预计体量、卷末状态、主要冲突、节奏参考和自由想法。</p><h6>白话模板</h6><p>页面用“这段读者会看到什么”的大白话作主标题，并用较弱的来源标签显示“救猫咪结构、三幕式、五幕式”等专业方法，帮助有经验的作者识别。模板可以不用、多选混合、重排和自定义。节奏不是全程高压，必须有积累、兑现、代价和呼吸。</p><h6>AI介入</h6><p>两位异模型编剧分别给出完整卷方案；主编在两份真实方案完成后比较目标覆盖、因果、高潮、人物变化和风险，形成融合候选。作者仍可直接编辑。</p><h5>6. 事件链</h5><p>事件链把卷目标拆成可完成的小故事。每个事件至少记录：标题、触发、目标、阻力、关键变化、结果、代价、对应卷任务、预计章数和如何引出下一事件。</p><p>作者可以拖动、插入、删除、拆分或合并；系统实时检查因果断裂、章数空洞、卷任务遗漏和上游版本过期。调整不会自动改正文或正史。</p><h5>7. 当前事件大纲</h5><p>页面顶部固定显示活动卷纲任务、完整事件链位置、上一事件结果和下一事件需要的状态。作者选择想要的冲突/兑现方向并输入自己的想法。</p><p>两位编剧独立设计当前事件的起因、升级、转折、高潮、代价、结果和结尾钩子；主编只融合当前事件，不跨事件另造主线。作者可逐部分选案、重写或直接编辑。</p><h5>8. 当前事件章纲</h5><p>系统先评估事件需要多少章、总字数和节奏分配，再生成完整章链。每章显示：</p><ul><li>章节号、标题和预计字数；</li><li>本章目标与开头抓力；</li><li>2—5个场景节拍；</li><li>人物选择、信息变化和情绪变化；</li><li>本章与事件目标的关系；</li><li>结尾钩子；</li><li>作者指导意见。</li></ul><p>作者先确认完整事件章链，再细化或重做单章。章链不得越出当前事件。</p><h5>9. 单章正文</h5><p>一次只启动一章。写手获得完整章纲、压缩上层约束、最近正式上下文和按需检索证据；对话、动作、描写和细节可以自由发挥。</p><p>初稿完成后并行启动：</p><ul><li>事实审查：只指出可引用来源的事实矛盾和需确认项。</li><li>文学审查：指出具体段落的语言、节奏、重复、场景和人物声音问题。</li><li>体验审查：用目标读者口吻说明期待、困惑、爽点和弃读风险。</li></ul><p>作者决定是否改。定点修订不能改动未授权情节；定稿生成不可变正文版本。</p><h5>10. 结算</h5><p>章节结算从定稿正文更新已发生事实、人物状态、关系、时间、伏笔、摘要和投影。事件结算比较事件大纲与实际，确定下一事件触发。卷结算比较卷纲与实际，形成卷总结、遗留问题和下一卷起点。</p><p>结算不为了让计划显得正确而改写正文事实。</p><h5>11. 上下文规则</h5><ul><li>开书：完整作者输入。</li><li>设定：完整开书＋当前项＋前置确认＋本项作者原话。</li><li>卷纲：压缩完整开书/设定＋上一卷结算＋当前状态＋作者卷想法。</li><li>事件链：压缩开书/设定＋完整活动卷纲＋模板/作者想法。</li><li>事件大纲：压缩上层＋完整事件链/当前事件＋上一事件结果。</li><li>章纲：压缩上层＋完整事件链和当前事件大纲。</li><li>正文：压缩卷/事件信息＋完整当前章纲＋最近正史与触发证据。</li></ul><p>其他书、未被作者摘录到当前对象的灵感、过期版本、无关候选和无依据猜测全部排除。</p><h5>12. 独立灵感</h5><p>作者从顶栏进入灵感，可选择1—3名创作成员的讨论分身。讨论分身只接收本书活动开书资料、已确认设定/规划/正史的压缩导航和作者本轮问题，并按需回查当前书正式源；它们不会获得生产任务租约，也不能调用确认、融合、正文、正史和结算写入。</p><p>每轮显示作者原话、成员身份、真实模型、任务状态和回答。讨论内容只保存在隔离域，不进入生产检索。作者可以把一段回答“摘录为灵感”，选择设定、卷纲、事件、章纲或正文对象及强度；系统保存原文、来源讨论和目标对象，之后由正常ContextCompiler按该对象规则纳入。</p><h5>13. 续写</h5><p>已有正文先预览、确认和不可变导入，再做带来源的反向拆解。作者确认人物、设定、事件和当前状态后补齐活动卷纲与事件；后续与新书使用同一章纲、正文、审查和结算流程。</p><h5>14. 失败与恢复</h5><p>每项生成任务保存幂等键、上游版本、作者输入、成员、模型、上下文包、预算、检查点和结果。已完成席位不重复调用；远程结果未知不自动重发；上游变化使候选过期；作者数据和正式正文不因任务失败回滚或删除。</p><h5>15. 已完成规划的持续可见性</h5><p>活动指针只表示当前可继续修改的对象，不等于历史内容是否存在。事件或卷完成结算后，界面继续展示已确认的卷纲、事件链、事件大纲和全部章纲，并明确标记为只读历史；作者可以核对正文从哪一版规划产生，但不能在历史页误触生成、重写、确认、冻结或结算。进入下一事件或下一卷后，新的活动对象与已完成记录并存。</p><p>状态推进与内容变更必须分开：事件从活动变为已结算、卷从活动变为已完成时，历史章纲继续校验并引用生成当时锁定的事件版本和卷纲版本，界面显示“结算版本已锁定”。只有活动上游真的换版、历史锁定来源缺失或对象被明确标记过期时，才显示重建或异常提示。</p><hr><h3>文秘写作使用说明</h3><blockquote>当前源文件：<code>docs/USER_GUIDE.md</code> · 指纹：<code>622337302155</code></blockquote><h4>文秘写作使用说明</h4><h5>启动与停止</h5><p>双击桌面的“文秘写作”入口，等待浏览器打开。若桌面入口缺失，可双击项目根目录的“文秘写作-启动.cmd”。若启动窗口提示错误，不要重复点击，记录错误后再处理。停止时使用“文秘写作-停止”入口，只停止本项目登记的进程。</p><h5>新建一本书</h5><ol><li>在创作台左侧书籍栏点击“新建书籍”。</li><li>填写书名、频道/分类、题材与标签、初始角色、故事方向、必须遵守和自己的补充想法。</li><li>确认创建后进入设定。</li><li>在每个设定项查看主编与两位编剧的独立方案；选择、组合、直接改写或要求重做。</li><li>所有当前必需设定确认后进入当前卷。</li></ol><h5>规划当前卷</h5><ol><li>填写卷目标、预计体量、卷末状态和自己的想法。</li><li>选择大白话节奏参考，也可以不用或混合多个模板。</li><li>比较 AI 候选，确认活动卷纲。</li><li>生成事件链，检查每个事件为什么发生、解决什么、带来什么新状态。</li><li>选中当前事件，生成并确认完整事件大纲。</li><li>让系统评估章数和字数，再生成当前事件章纲。</li></ol><h5>写正文</h5><ol><li>打开章纲，补充本章指导意见。</li><li>点击开始撰写；一次只正式生成一章。</li><li>查看事实、文学、体验三份独立报告。</li><li>直接编辑或让写手按指定建议修订。</li><li>满意后定稿，系统才会结算本章事实和状态。</li></ol><h5>事件和卷结束</h5><p>事件全部章节定稿后查看事件结算，确认实际结果、人物变化、遗留问题和下一事件触发。当前卷完成后查看卷结算，再规划下一卷。规划内容不是正史，只有定稿正文及确认资料才记录已发生事实。</p><h5>续写已有作品</h5><ol><li>新建书时选择导入已有正文。</li><li>核对章节识别和顺序后确认导入。</li><li>原文保存为不可变版本，系统不会改写。</li><li>查看带来源的反向拆解结果，确认或修改人物、设定、事件与当前状态。</li><li>补齐当前卷、事件和章纲后继续写作。</li></ol><h5>资料库和取名</h5><ul><li>资料库统一查看人物、势力、地点、物品、规则、事件、关系、情绪、伏笔、信息差、来源、冲突与缺口。</li><li>取名按人物、地点、势力、物品、生灵和能力生成候选，不会自动写入设定。</li></ul><h5>AI 成员状态</h5><p>顶部“团队”显示全部11名创作成员。“准备中”表示正在编译本次资料；“工作中”表示真实模型调用已经发出；“完成”表示结果已保存；“失败/超时”会显示原因和可执行操作。小文秘书不计入人数，也不作为第12名成员显示。</p><h5>左侧书籍栏</h5><p>书籍栏使用单列固定大竖版封面并在栏内向下滚动。在左侧书籍栏中，书名只显示在封面内，封面右侧不再重复；封面下只显示“当前书籍”“创作中”或测试标签。中心“信息”页会显示一次干净书名，便于确认当前开书资料。顶部功能栏上方不再重复当前书名或当前功能。新建和修改书名最多15字，字数越多封面字号越小，15字以内始终完整显示。开发验收书若带内部运行标识，界面会显示为中文“流程测试”或“验收测试”；原始标识只保留在数据库和测试证据中，普通作者书名不会被改写。旧数据若超过15字不会被系统擅自截断保存，封面用省略号兼容展示。</p><h5>数据边界</h5><p>作者输入、附件、选择和反馈保存在所属对象中，不写入聊天记忆。其他书不会进入当前书上下文。摘要和向量只用于导航，事实争议会回查正式资料和定稿正文。</p><h5>测试与备份说明</h5><p>开发和自动测试可以使用确定性假模型验证流程、格式与恢复机制，但它不代表真实模型的文学质量，也不能冒充真实模型调用。当前Git历史与同一磁盘上的副本都不等于第二物理备份；重要书籍应另存到另一块物理磁盘后，才能声称具备该级别灾备。</p><h5>查看已完成的规划</h5><p>事件或整卷完成后，规划和章纲不会消失。进入“规划”可以查看已完成事件链、每个事件的大纲和版本；进入“章纲”可以查看该事件全部已确认、已冻结的章纲；一卷包含多个已完成事件时，可在页面顶部切换事件。历史页只供核对和复制，不显示重新生成、冻结、写作或结算按钮。若正文已经存在而这两页为空，应视为界面或工作流缺陷，不能按“正文数量足够”判定流程通过。</p><h5>当前项目文档合订版</h5><p>桌面“文秘写作项目文档”首页顶部提供“一页看完当前项目”。打开后可在一个页面阅读并复制全部现行产品、流程、AI成员、上下文、检索、架构、数据、验收和Skill资料。项目根目录中的 docs/PROJECT_REFERENCE_BUNDLE.md 是同一内容的Markdown版本，适合整体复制给外部顾问。</p><hr><h2>二、AI成员、上下文、检索与创作质量</h2><h3>AI团队与介入规则</h3><blockquote>当前源文件：<code>docs/AGENT_SYSTEM.md</code> · 指纹：<code>7b4e58b0cc50</code></blockquote><h4>AI团队与介入规则</h4><h5>1. 团队组成</h5><p>每本书保持11名创作成员；岗位、Agent实例和模型绑定相互独立。同一个模型可以承担多个岗位，但界面必须如实显示，不能冒充异模型意见。</p><ol><li>主编：决定全局优先级，组织卷纲、事件和融合。</li><li>副编：帮助整理结构、来源和任务资料，不垄断数据库或检索。</li><li>编剧A：偏强冲突、反转和快速推进。</li><li>编剧B：偏递进、人物关系、铺垫和因果。</li><li>设定：检查世界、规则、能力、资源和命名体系。</li><li>主笔：当前活动正文写手。</li><li>副笔：候补写手或局部润色，不默认串行重写整章。</li><li>文学审查：语言、节奏、场景、重复和人物声音。</li><li>体验审查：目标读者代入、期待、爽点、困惑和弃读风险。</li><li>研究：只为明确事实研究任务提供有来源资料，不决定剧情。</li><li>来源与版权：执行来源、授权、原创性和风险检查，不设置独立页面。</li></ol><p>小文秘书是本地确定性工具角色，不属于11名创作成员，不给剧情结论、不冒充模型、不保存聊天记忆。</p><h5>2. 介入时机</h5><div class="table-scroll"><table><thead><tr><th>阶段</th><th>主持/执行</th><th>其他成员</th><th>输出</th></tr></thead><tbody><tr><td>开书</td><td>系统确定性校验</td><td>无</td><td>书籍、定位版本、团队、预算、设定任务</td></tr><tr><td>设定项</td><td>主编＋两位编剧独立提案</td><td>设定按需要检查</td><td>三份候选、作者选择、主编整理稿</td></tr><tr><td>分卷</td><td>主编主持</td><td>两位异模型编剧独立设计，设定/研究按需</td><td>卷候选、差异、融合稿</td></tr><tr><td>事件链</td><td>主编</td><td>两位编剧</td><td>事件序列、因果衔接、卷任务覆盖</td></tr><tr><td>事件大纲</td><td>主编融合</td><td>两位编剧独立方案，设定按需</td><td>当前事件完整大纲</td></tr><tr><td>章纲</td><td>主编或编剧执行拆分</td><td>设定/事实按需预检</td><td>完整事件章链与单章章纲</td></tr><tr><td>正文</td><td>单一活动写手</td><td>设定/研究只提供证据</td><td>单章正文候选</td></tr><tr><td>审查</td><td>三席并行</td><td>事实、文学、体验互不读取</td><td>三份独立报告</td></tr><tr><td>结算</td><td>确定性结算＋必要抽取</td><td>主编查看事件/卷偏差</td><td>事实、状态、伏笔、摘要、下一层承接</td></tr></tbody></table></div><h5>3. 独立性</h5><p>两位编剧独立阶段互不可见，不交叉投票；主编只有在独立结果全部保存后才读取并融合。三席审查使用与活动写手不同的三个模型，彼此不读取报告。模型不可用或实际来源重复时必须明确降级或阻断，不能伪装独立。</p><h5>4. 创造性边界</h5><p>上层规划提供目标、边界、因果和必须项，不规定每句写法。AI可以提出有代价的偏离方案；局部合理发挥可以直接执行，影响卷目标、事件结果、人物核心选择或正史规则的偏离必须先给作者看影响。</p><p>模板只是软参考。岗位提示词不得把质量规范、评分表或固定叙事结构全文注入模型，也不得要求每章同时满足所有爽点和审查指标。</p><h5>5. 真实状态</h5><p>状态由任务、上下文编译、模型调用、心跳和保存事件驱动：等待、准备中、工作中、完成、失败、超时、已取消、等待作者。界面不得用计时器或文案伪造工作。</p><h5>6. 失败与恢复</h5><ul><li>确定性失败可在幂等键和检查点保护下重试。</li><li>远程结果未知不自动重试，先调和。</li><li>已完成成员意见复用，未完成成员单独重做。</li><li>主编租约变化后旧结果必须通过epoch门禁。</li><li>作者退回时保留满意部分，修订只读取明确反馈和当前候选。</li></ul><h5>7. 追溯</h5><p>每个结果能追溯到任务、Agent、岗位、模型快照、上下文包、作者输入、上游版本、预算和输出哈希。不保存模型内部思维链。</p><hr><h3>十一名创作成员提示词合同</h3><blockquote>当前源文件：<code>docs/ROLE_PROMPTS.md</code> · 指纹：<code>deddac8d95b4</code></blockquote><h4>十一名创作成员提示词合同</h4><h5>共同规则</h5><p>所有成员只接收任务编译后的当前书籍信息；先服从作者必须项和活动上游版本，再发挥岗位创造性。输出结论、依据、候选和风险，不输出思维链。模板是软参考。遇到来源不足时标记需确认，不编造依据。</p><h5>主编</h5><p>定位：全局策划与融合者。负责卷目标、事件因果、方案取舍和事件/卷结算承接；不代替作者确认，不包办正文。</p><p>核心提示：基于真实独立方案做取舍，明确为什么采用、舍弃和如何承接上层目标；合理惊喜优先于机械均衡。</p><h5>副编</h5><p>定位：结构与资料协调。帮助主编识别版本、来源、依赖、遗漏和摘要，但不垄断检索、不替编剧给剧情结论。</p><h5>编剧A</h5><p>定位：强冲突与快速兑现。擅长反转、升级、身份变化、危机和高密度因果。必须保持人物选择有代价，不能只堆爽点。</p><h5>编剧B</h5><p>定位：递进、关系与伏笔。擅长层层推进、情感积累、智谋、人物关系和长期伏笔。不能用拖慢代替铺垫。</p><h5>设定</h5><p>定位：世界与规则设计。维护规则、能力、资源、势力、物品和命名的一致性；新设定必须说明用途、边界和代价，不无限扩张世界观。</p><h5>主笔</h5><p>定位：活动正文写手。完整执行章纲的场景与结果，在局部对话、动作、描写、节奏和细节上自由发挥。不得擅自改变事件结果或角色核心动机。</p><h5>副笔</h5><p>定位：候补写手与局部表达支持。只有主笔不可用或作者明确要求时接管；默认不对整章做第二遍同质化改写。</p><h5>文学审查</h5><p>只评语言、场景、节奏、重复、人物声音、情绪力度和AI腔。建议定位到段落并说明修改目的，不把个人风格偏好当事实错误。</p><h5>体验审查</h5><p>模拟本书目标读者，报告期待、代入、爽点、困惑、厌烦和弃读风险。允许主观，但必须指出触发位置，不宣布客观真理。</p><h5>研究</h5><p>只处理明确研究问题，提供来源、日期、可信度和适用边界。研究资料默认是候选证据，不能直接改剧情、设定或正史。</p><h5>来源与版权</h5><p>检查来源、授权、相似表达和使用风险。只提供风险与处理建议，不设置独立页面，不以风险检查替代创作判断。</p><h5>小文秘书</h5><p>本地工具角色，负责导航、附件、任务状态、确定性校验和故障回执。不属于创作团队，不调用模型给剧情建议，不保存聊天记忆。</p><h5>独立性与模型</h5><p>两位编剧独立阶段互不可见；三席审查互不可见且使用三种不同模型。岗位与模型绑定可版本化，界面始终显示真实来源。同模型不得冒充多模型共识。</p><hr><h3>上下文、记忆与任务资料规范</h3><blockquote>当前源文件：<code>docs/MEMORY.md</code> · 指纹：<code>eb26a90d12f2</code></blockquote><h4>上下文、记忆与任务资料规范</h4><h5>1. 原则</h5><p>上下文由确定性 ContextCompiler 按任务编译，不由拟人成员自由访问全库。越往下游越压缩上层信息，但上层硬约束必须完整保留；当前任务对象使用完整版本。其他书、旧聊天、过期版本、无关候选、全文堆叠和无依据猜测始终排除。</p><h5>2. 权威层</h5><ol><li>作者原始输入与不可变导入原件。</li><li>作者确认的开书、设定和活动规划版本。</li><li>定稿正文与章节/事件/卷结算形成的正史事实。</li><li>摘要、Wiki、图谱、全文和向量投影。</li></ol><p>低层不能推翻高层。摘要只导航，事实争议回查正式源。</p><h5>3. 任务上下文矩阵</h5><div class="table-scroll"><table><thead><tr><th>任务</th><th>必须接收</th><th>必须排除</th></tr></thead><tbody><tr><td>开书</td><td>作者填写的全部开书信息、附件和明确约束</td><td>其他书、聊天、AI猜测</td></tr><tr><td>设定方案</td><td>完整开书信息、当前设定项、已确认前置设定、作者本项原话</td><td>无关正文、其他书、未确认候选</td></tr><tr><td>分卷</td><td>无损压缩后的完整开书与设定、上一卷正式结算、当前角色状态、节奏选择、作者卷想法</td><td>旧卷候选、无关细节、聊天历史</td></tr><tr><td>事件链</td><td>压缩开书/设定、完整活动卷纲、模板与作者想法</td><td>其他卷未来猜测、过期卷纲</td></tr><tr><td>事件大纲</td><td>压缩开书/设定/卷纲、完整事件链和当前事件卡、上一事件结果、作者本事件想法、触发伏笔</td><td>其他事件草案、无关人物全集</td></tr><tr><td>章纲</td><td>压缩上层信息、完整事件链、完整当前事件大纲、上一章链状态、作者章纲想法</td><td>越过当前事件的自由扩写</td></tr><tr><td>正文</td><td>压缩卷纲、事件链和事件大纲、完整当前章纲、最近正式正文/结算、触发实体与声音证据、作者本章意见</td><td>全书全文、其他候选、其他书</td></tr><tr><td>事实审查</td><td>当前正文、冻结上游版本、命中设定/事实/时间/伏笔原文</td><td>文学和体验报告</td></tr><tr><td>文学审查</td><td>当前完整正文、章纲、表达基线、必要相邻正文</td><td>事实席或体验席报告</td></tr><tr><td>体验审查</td><td>当前完整正文、目标读者、章纲目标、必要前章</td><td>其他审查报告</td></tr><tr><td>结算</td><td>定稿正文、冻结章纲、已有正史、当前事件/卷目标</td><td>草稿和未确认建议</td></tr></tbody></table></div><h5>4. 压缩规则</h5><p>压缩不是删掉上层规则。必须保留：身份、目标、因果、时间、能力上限、关系、禁区、未回收伏笔、卷目标、当前事件结果和作者必须项。可压缩：重复解释、已回收低优先细节、无关场景描写和未采用候选。</p><p>每份压缩物保存来源列表、版本、内容哈希、生成策略和可回查位置。长度由任务预算和证据密度决定，不使用固定“最近5章后遗忘”规则。</p><h5>5. 检索触发</h5><p>实体、别名、规则、物品、地点、时间、因果、伏笔、人物声音或冲突信号出现时，先结构化直达，再结合FTS、向量、关系和时间过滤。高风险事实至少回查一段正式原文。低相关结果不因相似度分数高就自动注入。</p><h5>6. 写入与结算</h5><p>模型输出默认是候选。只有作者确认资料和定稿正文结算可以更新正式状态。章节结算追加事实、人物变化、关系、时间、伏笔和摘要；事件/卷结算聚合实际结果并记录计划偏差。投影异步重建，失败不能污染正式源。</p><h5>7. 续写</h5><p>导入全文保存在不可变原件和章节版本中。反向拆解结果带来源，仅作为待确认派生资料。续写任务按实体和当前目标回查旧文，不把整本全文塞入每次模型调用。</p><h5>8. 验收</h5><p>上下文测试至少覆盖跨书隔离、版本失效、硬约束位置、长输入预算、对抗检索、来源回查、摘要消融、人物声音和连续多章漂移。召回提高不能以原创性、人物可辨识度或整体阅读质量下降为代价。</p><hr><h3>当前卷—事件工作流的混合RAG设计</h3><blockquote>当前源文件：<code>docs/HYBRID_RAG_DESIGN.md</code> · 指纹：<code>8019ce43a57d</code></blockquote><h4>当前卷—事件工作流的混合RAG设计</h4><h5>1. 目标与边界</h5><p>混合RAG只为当前书、当前任务补充必要证据。它不能替代开书信息、活动设定、活动卷纲、活动事件、完整章纲、定稿正文或作者原话，也不能把摘要、向量结果、Wiki或AI候选升级为正史。</p><p>系统不建立聊天、会话摘要或对话记忆检索源。作者输入必须属于明确的开书、设定、卷、事件、章纲、正文、审查或结算对象。每次查询必须携带 <code>owner_id</code>、<code>book_id</code>、任务类型、目标对象和冻结版本；其他书籍永远排除。</p><h5>2. 数据权威顺序</h5><ol><li>作者确认的开书信息、设定、资料条目和显式约束；</li><li>作者定稿的不可变正文版本及其正史结算；</li><li>当前任务直接引用的活动卷纲、事件链、事件大纲和章纲；</li><li>章节、事件和卷结算；</li><li>带来源的作者原话、附件和导入原件；</li><li>从上述来源重建的结构化事实、全文索引、关系、时间线、Wiki、摘要和向量；</li><li>AI候选、审查建议、失败任务和测试结果。</li></ol><p>规划描述未来，正史描述实际发生。两者必须分开存储、分开检索和分开显示。派生层发生冲突时回查上级正式源，不以相似度或摘要覆盖正式源。</p><h5>3. 本地目标架构</h5><ul><li>SQLite：书籍、版本、活动指针、作者输入、资料、正史、结算、任务、调用、来源和关系的权威库；</li><li>SQLite FTS5：专有名词、原句、规则、场景关键词和否定表达的全文检索；</li><li>LanceDB OSS TypeScript本地嵌入：可重建的语义向量投影；</li><li>SQLite关系与时间投影：人物、势力、地点、物品、规则、线索、知情、状态和因果邻域；</li><li>不可变文件：导入原文、正式正文和附件原件；SQLite保存路径、哈希、范围和版本；</li><li>派生Wiki与摘要：只做导航和展示，必须携带来源、水位和重建版本；</li><li>ContextCompiler：把活动上游版本、作者原话和按需检索证据编译成不可变ContextPack。</li></ul><p>所有投影都能从SQLite权威记录和不可变原件重建。投影缺失、损坏或水位落后时，不得把它当成事实源。</p><h5>4. 索引对象</h5><div class="table-scroll"><table><thead><tr><th>当前对象</th><th>主要索引单位</th><th>必须携带的版本信息</th><th>用途</th></tr></thead><tbody><tr><td>开书信息</td><td>字段、作者原话、附件引用</td><td>开书活动版本</td><td>定位、题材、角色、核心机制和必须项</td></tr><tr><td>设定</td><td>设定模块、实体卡、规则条目</td><td>设定活动版本</td><td>世界、人物、势力、地点、物品和规则</td></tr><tr><td>分卷</td><td>卷目标、主要因果、人物变化、高潮、卷末接口</td><td>卷纲活动版本及上游设定版本</td><td>约束当前卷</td></tr><tr><td>事件链</td><td>事件卡、前后触发、卷任务映射</td><td>事件链版本及卷纲版本</td><td>定位当前事件职责</td></tr><tr><td>事件大纲</td><td>入口、行动链、转折、结果、代价、下一触发</td><td>当前事件活动版本</td><td>约束事件内剧情</td></tr><tr><td>章纲</td><td>章职责、场景、信息、情绪、结尾状态</td><td>当前章纲版本及事件版本</td><td>正文直接执行依据</td></tr><tr><td>正式正文</td><td>章、场景、段落、人物声音证据</td><td>不可变正文版本、正史水位</td><td>原文回查与连续性</td></tr><tr><td>三级结算</td><td>实际结果、状态变化、开放线索、来源</td><td>章/事件/卷结算版本</td><td>后续任务的真实起点</td></tr><tr><td>资料库</td><td>人物、势力、地点、物品、规则、事件、来源</td><td>条目版本与正史有效区间</td><td>精确查询和关系扩展</td></tr></tbody></table></div><p>原始内容不因重切片而改变。新切片策略创建新快照并原子切换；旧快照只用于回滚宽限，不参与当前检索。</p><h5>5. 任务型上下文路由</h5><h6>5.1 开书与设定</h6><p>开书任务直接接收作者填写的全部信息，不做RAG补造。设定候选接收完整开书活动版本、当前设定模块、作者本模块原话与附件，以及已确认的直接依赖设定。排除其他书、非对象化历史输入、卷纲、事件、正文和未确认AI猜测。</p><h6>5.2 分卷</h6><p>接收完整覆盖开书字段的 <code>BookCorePack</code>、<code>SettingConstraintPack</code>、长期承诺、作者选择的卷级软模板和本卷原话；后续卷再加入上一卷真实结算与当前状态。检索只补充与本卷目标相关的开放线索、人物/势力状态、规则和必要原文。</p><h6>5.3 事件链与事件大纲</h6><p>事件链接收开书核心、活动设定、完整 <code>VolumeConstraintPack</code>、作者事件链想法和事件级软模板。事件大纲额外接收完整 <code>EventChainPack</code>、当前事件卡、上一事件真实结算或卷首状态，以及作者对当前事件的全部原话。检索围绕当前事件实体、地点、规则、道具、线索和前因展开，不加载其他事件完整大纲。</p><h6>5.4 当前事件章纲</h6><p>接收压缩但完整覆盖的开书、设定、卷纲和事件链，完整 <code>CurrentEventPack</code>，上一真实结算与作者章链/单章意见。系统先评估事件总字数和章数，再生成完整章节序列；当前章完整章纲不以摘要替代。</p><h6>5.5 单章正文</h6><p>接收 <code>BookCorePack</code>、<code>SettingConstraintPack</code>、<code>VolumeConstraintPack</code>、<code>EventChainPack</code>、<code>CurrentEventPack</code>、完整 <code>CurrentChapterOutlineFull</code>、必要前章、当前正史、作者修改意见和明确自由区。RAG只补充本章真实需要的实体、规则、时间、因果、人物声音和必要原文，不注入全书正文、其他事件完整大纲或整套模板。</p><h6>5.6 三类审查</h6><p>事实、文学和体验审查绑定同一不可变正文和同一完整章纲，但附加证据分开编译，三份报告互不读取：</p><ul><li>事实审查：设定、正史、时间线、状态、能力、知情、道具、地点和线索来源；</li><li>文学审查：题材与表达偏好、人物声音、关系、情绪进度和必要近期原文；</li><li>体验审查：卖点、目标读者、事件位置、阅读进度、必要前章和期待兑现。</li></ul><h6>5.7 结算与下一卷</h6><p>章节、事件和卷结算只从作者确认正文、下级结算和既有正史提取实际结果，规划只用于计划—实际对照。下一卷以完整开书核心、活动设定、长期承诺、上一卷完整真实结算、当前状态和开放线索为起点，不能把未实现计划当成已发生事实。</p><h5>6. 检索执行顺序</h5><ol><li>校验 <code>owner_id/book_id</code>、目标对象、任务权限和冻结活动版本；</li><li>把直接活动版本和作者原话放入ContextPack，不经过相似度竞争；</li><li>从任务类型生成结构化查询计划，列明实体、时间、因果、来源和所需证据种类；</li><li>按需并行执行精确查询、FTS、向量、关系、时间/因果和原文回查；</li><li>过滤跨书、失效版本、错误故事时间、无来源和权限不匹配结果；</li><li>标注事实、人物认知、秘密、谎言、推断、规划和软参考，禁止混层；</li><li>按来源权威、任务关系、时间与因果必要性重排，去重并扩展必要父块/邻块；</li><li>记录纳入、排除、裁剪和冲突理由；</li><li>在预算内编译不可变ContextPack并保存来源指纹；</li><li>提交前再次核对活动版本与正史水位，过期任务结果拒绝落库。</li></ol><p>不设置一个全局相似度阈值决定所有通道。向量只负责语义候选，不能静默决定实体身份、事实真伪或活动版本。</p><h5>7. 检索不足与冲突</h5><ul><li>找不到依据：输出“未知/需确认”，不补造；</li><li>同名或别名歧义：列出候选和来源，正式任务在消歧后继续；</li><li>规划与正文冲突：正文结算代表实际发生，后续规划是否修订由作者决定；</li><li>正式源之间冲突：提交事实审查，展示双方来源和有效时间；</li><li>结果过多：先按任务关系、权威、时间和因果裁剪，不删除直接上游约束；</li><li>结果过少：扩大别名、关系、时间和原文邻域，不先降低全局门槛；</li><li>向量不可用：明确降级为结构化＋FTS＋关系＋原文回查；依赖语义且无法替代的任务暂停并说明原因。</li></ul><h5>8. 创造性保护</h5><p>ContextPack把硬底线、任务约束和软参考分栏。模板、声音片段、相似场景和节奏建议必须标为可不用；主笔保留对白、动作、意象、局部调度、场景细节和自然因果实现的自由空间。</p><p>正文检索目标是“最小充分”，不是“最大召回”。先形成场景方案，再针对具体缺口回查，避免大量旧正文导致模仿、重复和人物机械化。检索方案改变时必须用相同模型与相近预算做多样本盲评，事实更准不能抵消原创性、合理惊喜、人物可辨识度、情绪力度和整体阅读质量下降。</p><h5>9. 投影、水位与恢复</h5><p>切片、FTS、关系、Wiki和向量通过版本化快照构建。非活动快照完成来源覆盖、跨书隔离、时间过滤、冻结查询和无答案探针后，才能按书原子切换。构建失败继续使用上一有效快照；若上一快照与当前权威水位不一致，则降级或阻断相关任务。</p><p>Worker只写投影、候选和任务结果，不直接修改正式正文或核心正史。所有写入使用幂等键、租约栅栏、检查点和晚到结果隔离。投影目录损坏时从权威源重建，不恢复成事实源。</p><h5>10. 可观测与验收</h5><p>每次检索保存：任务、查询计划、通道、命中、过滤原因、来源、版本、水位、裁剪、预算、耗时、降级和ContextPack指纹，但不保存模型思维链或密钥。</p><p>必须通过：</p><ul><li>其他书籍零命中，错活动版本和过期候选被拒绝；</li><li><code>BookCorePack</code>覆盖作者已填开书字段100%，空字段不会被AI补造；</li><li>卷、事件链、事件大纲、章纲和正文能回查完整上游版本；</li><li>三类审查绑定同一正文但附加证据与报告相互隔离；</li><li>摘要误导、否定、别名、时间冲突、因果、多跳关系和无答案查询；</li><li>规划未实现内容不会进入三级结算；</li><li>下一卷读取上一卷真实结算；</li><li>投影中断、重复执行、错水位、向量缺失、重建和回滚；</li><li>检索增益与创造性非劣效对照。</li></ul><hr><h3>长篇小说资料切片最终设计</h3><blockquote>当前源文件：<code>docs/CHUNKING_DESIGN.md</code> · 指纹：<code>e4ea8ceeeb39</code></blockquote><h4>长篇小说资料切片最终设计</h4><h5>1. 明确结论与置信度</h5><p>文秘写作采用“不可变原始资料＋结构节点＋父子检索块＋原子事实”的多粒度切片，不采用整章单块、全资料统一固定字数或无条件重叠。切片只负责定位和取回资料，不能替代原文、事实、规划层级或正史版本。</p><p>设计结论置信度为高：结构优先、父子检索、原子事实、来源回链、版本化快照和最小充分扩展能够直接对应长篇小说的语义边界、故事时间、人物认知和注意力问题。具体字符目标值置信度为中：本文给出可运行的初始默认值，但默认值必须在目标电脑和独立中文小说金标上与固定切片、纯语义切片比较后锁定。参数调优属于版本化实现配置，不重新决定权威架构。</p><p>本设计已在当前长篇release实现为 <code>content_chunks</code>、分类型结构切片、FTS/LanceDB可重建投影和多来源切片快照原子切换，并取得500万字符/1500章E2工程证据。当前机器未发现已验证本地嵌入资产时向量通道如实降级；E2不能冒充E3语义金标或E4文学质量提升。</p><h5>2. 当前事实基线</h5><ul><li>正文已经使用不可变完整文件和内容哈希，SQLite保存业务权威与文件指针。</li><li>当前运行时检索只有结构化事实、SQLite FTS5/BM25和固定同义词扩展；尚无真实向量、父子块或分类型切片。</li><li>DEC-012已确定SQLite权威源、LanceDB可重建向量投影、SQLite关系/Wiki和混合检索；DEC-016已确定临时、候选、正史、派生四层生命周期。</li><li>目标单书规模为500万规范化中文字符、1500章；较早卷和事件默认使用结算摘要导航，关键实体、规则、承诺、因果或冲突触发后下钻原文。</li><li>需要保护的不只是召回率，还包括人物声音、原创性、情绪力度、合理惊喜和整体阅读质量；大段历史正文可能提高事实覆盖却压低创作新鲜度。</li></ul><h5>3. 能力追踪矩阵</h5><div class="table-scroll"><table><thead><tr><th>痛点/可观察失败</th><th>根因</th><th>最终机制</th><th>最强反例</th><th>验证证据</th></tr></thead><tbody><tr><td>对白和回答被拆开</td><td>固定长度不理解语义单元</td><td>段落、对白轮次、动作—反应优先；字符数只作软边界</td><td>超长独白仍可能超过模型适合长度</td><td>边界完整率、人工错误集、召回对照</td></tr><tr><td>命中一小段却缺上下文</td><td>只有扁平块</td><td>场景根→场景节拍父块→检索子块；按问题有界扩父/邻块</td><td>父块过大仍会分散注意力</td><td>证据完整率、注入Token、位置敏感测试</td></tr><tr><td>同一段被重复召回</td><td>盲目文本重叠和多种派生重复</td><td>默认不复制重叠；使用前后邻接、来源范围和派生去重</td><td>边界查询可能因零重叠漏召回</td><td>与80—120字符重叠基线消融</td></tr><tr><td>“人物以为”变成客观事实</td><td>文本块没有观点与叙事模式</td><td>故事时间、视角、说话人、认知范围、回忆/梦境/计划元数据</td><td>自动抽取可能误判含蓄叙述</td><td>谎言、误解、反事实和不可靠叙述对抗集</td></tr><tr><td>正文修订后命中旧块</td><td>块和索引没有来源版本/水位</td><td>不可变切片快照、正史版本硬过滤、原子切换、旧快照失效</td><td>切换中断可能留下半成品</td><td>中断、重复执行、旧版本和重建故障注入</td></tr><tr><td>通用对白“你来了”检索错误</td><td>子块缺实体和场景语境</td><td>证据原文与嵌入文本分离；嵌入文本加入最小上下文头</td><td>头信息过多会形成标签锚定</td><td>无关键词、同句异人/异场景金标</td></tr><tr><td>检索更准但正文更像旧文</td><td>相似场景和风格片段注入过多</td><td>主笔只取最小硬证据和2—4条可选声音证据</td><td>过少证据可能丢失人物声音</td><td>全量包、最小包、硬事实包成对盲评</td></tr><tr><td>重复台词或意象被错误删除</td><td>全局内容哈希去重忽略叙事位置</td><td>原始位置均保留；只在单次结果中按来源/派生关系去重</td><td>真正重复噪声会占候选</td><td>重复、呼应、刻意复沓样本</td></tr></tbody></table></div><h5>4. 最强替代方案与取舍</h5><div class="table-scroll"><table><thead><tr><th>方案</th><th>优点</th><th>主要代价</th><th>结论</th></tr></thead><tbody><tr><td>固定500字符＋100字符重叠</td><td>实现最简单、易复现</td><td>切断对白/因果、重复多、跨结构污染</td><td>作为基线，不作为默认</td></tr><tr><td>整章或整场景单块</td><td>上下文完整</td><td>检索粒度粗、Token高、长场景注意力差</td><td>只保留导航父节点，不直接默认注入</td></tr><tr><td>纯模型语义切片</td><td>可识别复杂边界</td><td>非确定、成本和恢复一致性差，模型升级会改变全部边界</td><td>可作实验候选，不作为权威默认</td></tr><tr><td>纯句子/段落切片</td><td>来源精确</td><td>缺少场景上下文，多跳和隐含因果弱</td><td>作为叶子边界来源，不单独使用</td></tr><tr><td>结构语义＋父子块＋原子事实</td><td>同时支持精确召回、上下文扩展、确定性事实和可重建</td><td>Schema、切片器、快照和评测更复杂</td><td>最终采用</td></tr></tbody></table></div><p>最强替代是固定长度切片。它更便宜，但其错误恰好集中在小说最重要的对白、动作—反应、场景转折和叙事视角，因此只适合做可比较基线。推荐方案增加的复杂度全部位于可重建投影，不增加第二权威源。</p><h5>5. 预先验尸与反例</h5><p>假设方案在第1000章失败，最可能的传播路径是：边界识别把场景切错→向量只命中半个因果链→Wiki从半块抽取错误结论→上下文把错误投影交给编剧/主笔→新章进一步固化错误。修正是让重要结论必须回查原子事实或原文，并使切片、Wiki和向量都保持可失效投影。</p><p>其他高风险反例：</p><ul><li>一个场景跨越两个章节，若强行生成跨文件父块，会增加版本与恢复复杂度；因此章节仍是文件硬边界，用 <code>continues_scene_id</code> 连接连续场景。</li><li>一段超长独白、诗歌、书信或属性面板不能按普通段落处理；因此保留块类型并采用专用降级切分。</li><li>梦境、回忆、预言、人物计划和假想战斗语义相似，但故事时间和真实性不同；因此叙事模式与事实状态先于向量相似度过滤。</li><li>全局去掉相同文字会删除有意复沓、口头禅和伏笔呼应；因此不对不同来源位置做物理去重。</li><li>大量场景标题、标签和人物名拼入嵌入文本会提高表面召回但压倒正文语义；因此上下文头必须短、稳定、版本化，普通标签不拼入。</li><li>更细的块可能提高Recall@K，却使主笔收到碎片化材料并降低整体写作；因此检索指标和创作非劣效必须同时通过。</li></ul><h5>6. 修正后的最终设计</h5><h6>6.1 四种表示各司其职</h6><ol><li><strong>不可变原始资料</strong>：正式正文、设定、规划和历史稿件的完整文件，是最终证据。</li><li><strong>结构节点</strong>：书→卷→故事弧→章→场景→场景节拍，以及设定卡/规划节点。结构节点负责导航和范围，不必全部向模型注入。</li><li><strong>检索块</strong>：适合FTS和向量召回的子块，命中后按任务决定是否扩展父块、相邻块或关系节点。</li><li><strong>原子事实</strong>：主体—关系/属性—值—故事时间—观点主体—证据，处理生死、位置、知情、数量、关系和规则；语义检索只能帮助发现，最终判断使用结构化记录和原文。</li></ol><p>摘要、Wiki、向量和上下文头都属于派生投影，不得成为第五种权威。</p><h6>6.2 原文规范化和稳定来源定位</h6><ul><li>原文件保持UTF-8原样不可变。切片前只为索引生成独立 <code>index_text</code>：统一换行、Unicode NFC、移除BOM和无意义控制字符；不自动简繁转换，不统一标点，不改写作者空格、断句或措辞。</li><li>证据范围使用原始UTF-8 <code>start_byte/end_byte</code>、段落序号和内容哈希定位。<code>index_text</code> 必须保存回到原文范围的映射，不能把规范化文本直接当成引用证据。</li><li>每个来源版本保存 <code>source_hash</code>；每个块保存 <code>content_hash</code> 和 <code>index_text_hash</code>。来源哈希不一致时拒绝构建或使用该快照。</li><li><code>chunk_id</code> 在一个切片快照内唯一；新策略创建新快照和新块，使用 <code>supersedes_chunk_id</code>/来源范围追溯，不原地改变历史块。</li></ul><h6>6.3 正式正文层级与默认参数</h6><pre class="code-block"><code data-language="text">章节文件（权威）
└─ 场景根节点（完整导航范围，可很长）
   ├─ 场景节拍父块（上下文扩展单位）
   │  ├─ 检索子块
   │  └─ 检索子块
   └─ 场景节拍父块</code></pre><ul><li>场景根由明确分隔符、时间/地点/视角变化、叙事目标或主要冲突变化、行动—反应链闭合共同判断。只换说话人不构成新场景。</li><li>已确认章纲和场景契约只可作为边界提示，不能强迫已经写出的正文服从计划边界；实际原文结构与章纲不一致时保存偏离关系并以原文证据为准。</li><li>边界置信不足时不伪造精确场景，降级为同章段落组并标记 <code>boundary_confidence</code>；重要检索可以扩展邻块或回到章内原文。</li><li>场景节拍父块初始目标1200—3000个中文字符，软上限4500；完整短场景可以直接成为一个父块。父块主要用于有界扩展，不默认全部嵌入上下文。</li><li>检索子块软下限350、目标约500—600、软上限700、默认硬上限1000个中文字符。完整对白轮次、动作—反应对、句子和短诗节优先保持完整；语义单元略超软上限时允许保留。</li><li>超过硬上限的单段先按句子切；超长单句再按不破坏引号、括号、列表项和因果连接的分句切。超长独白各子块保持同一说话人和连续组ID。</li><li>实际嵌入模型的输入Token上限高于字符规则优先级：任何块连同上下文头超过模型安全输入预算时，必须继续按语义边界拆分，不能依赖模型静默截断。</li><li>过短段落只允许与同场景、同叙事功能的相邻段合并；不得为了凑长度跨场景、跨视角或跨叙事模式拼接。</li><li>章节是物理硬边界。跨章连续场景通过 <code>continues_scene_id</code>、前后节点和事件关系连接，不创建跨两个不可变文件的物理块。</li></ul><p>字符目标值只控制异常长短，不推翻语义边界。实现时同时记录中文字符、Unicode码点、UTF-8字节和实际模型Token，不能用固定“字符=Token”换算。</p><h6>6.4 默认不复制重叠</h6><ul><li>检索子块默认原文零复制重叠，使用 <code>prev_chunk_id/next_chunk_id</code>、父块和事件/实体边补足边界上下文。</li><li>命中位于子块首尾、查询涉及因果/对白承接或重排置信不足时，允许按预算扩展一个同场景邻块，并记录 <code>expansion_reason</code>。</li><li>80—120字符的同场景重叠保留为基准实验策略。只有独立金标证明它提高边界证据完整率，且重复注入、磁盘、延迟和创作锚定均不过门槛时，才可成为新版本默认。</li><li>父块包含子块属于结构包含，不算重复索引；组包时不能同时无差别注入父块和其全部子块。</li></ul><h6>6.5 设定、规划、事实与派生资料</h6><div class="table-scroll"><table><thead><tr><th>资料类型</th><th>父级/子级</th><th>初始子块目标</th><th>特殊规则</th></tr></thead><tbody><tr><td>人物/势力/地点/物品设定</td><td>实体卡→身份、能力、限制、历史、状态、关系、知情等方面</td><td>100—600字符</td><td>客观事实、人物认知、秘密、谎言和推断分开</td></tr><tr><td>世界规则</td><td>规则卡→条件、效果、限制、例外、代价</td><td>100—600字符</td><td>规则与例外建立显式关系，不合并冲突版本</td></tr><tr><td>总纲阶段/故事弧/章纲</td><td>层级节点→目标、冲突、必须结果、可选节拍、承诺、开放问题</td><td>100—500字符</td><td><code>planned/active/fulfilled/abandoned/superseded</code> 分开；章纲引用相关总纲阶段和确认故事弧；计划不冒充已发生事实</td></tr><tr><td>原子事实</td><td>结构化断言→确定性可读渲染</td><td>一条断言</td><td>不做文本重叠；嵌入只用于发现，裁决回到事实与证据</td></tr><tr><td>Wiki</td><td>实体页→一个主题段</td><td>150—500字符</td><td>每条结论回链事实或原文；整页不作为一个向量块</td></tr><tr><td>人物声音/表达证据</td><td>人物/叙述者→已确认短片段</td><td>150—400字符</td><td>独立受限索引；主笔默认最多2—4条，标注可不用、不可仿写原句</td></tr><tr><td>场景/章节/弧/卷摘要</td><td>层级连续性节点</td><td>按字段和来源范围</td><td>锚定事实与原文增量生成；不能无来源地递归总结摘要</td></tr><tr><td>作者想法/方案候选/草稿</td><td>业务对象与任务→问题组/暂存场景</td><td>按对象与任务边界</td><td>仅对象或任务临时索引，不进正式索引，不跨任务默认召回</td></tr><tr><td>研究/拆书资料</td><td>研究任务/来源→主张/短摘录/结构卡</td><td>按证据边界</td><td>与创作索引物理和权限隔离；版权原文不得进入主笔包</td></tr></tbody></table></div><p>结构化表格、属性面板、诗歌、书信、日志和聊天体正文保留 <code>block_type</code>。表格/属性面板优先解析为结构化字段并保留整块原文证据；诗歌、书信和日志优先保持作品内部结构，不强行与普通叙事段落合并。</p><h6>6.6 块元数据合同</h6><p>每个块至少携带：</p><ul><li>隔离：<code>owner_id</code>、<code>book_id</code>、权限域；</li><li>来源：类型、ID、不可变版本、原文哈希、字节范围、段落范围；</li><li>结构：章、场景、节拍、父块、前后块、顺序、块类型；</li><li>粒度：<code>leaf/parent/summary</code> 检索层级、是否参与FTS/向量、是否允许直接注入；</li><li>叙事：故事时间范围、叙事时间、视角人物、说话人、地点、叙事模式；</li><li>语义：实体/事件绑定及抽取状态；自动抽取保持候选，不能因绑定就成为事实；</li><li>权威：临时/候选/正史/派生、事实状态、正史版本、有效/失效/已替代状态；</li><li>投影：切片策略版本、规范化策略版本、嵌入文本策略版本、嵌入模型快照、索引水位；</li><li>质量：边界置信、是否允许默认注入、异常长块原因和校验状态。</li></ul><p>叙事模式至少区分当前客观叙事、人物认知、对白主张、回忆、梦境、预言、计划、假设/反事实、文中作品和不可靠叙述。无法可靠判断时保存未知，不用模型猜测填满。</p><h6>6.7 嵌入文本与原文证据分离</h6><ul><li>向量输入使用 <code>embedding_text = 最小上下文头＋index_text</code>。上下文头可以包含资料类型、章/场景名称、视角、说话人和少量稳定实体名，解决“他来了”“这里不安全”等脱离场景后无法区分的问题。</li><li>叶子块是精确检索主通道；场景节拍父块可以在独立 <code>parent</code> 粒度作为宽主题向量候选，但不重复建立父块FTS正文。父块命中后重排其子块或提取最小原文范围，不能把父块及全部子块一起注入。</li><li>上下文头不是正文、事实或引用证据，检索展示和最终回答必须回到原始范围。</li><li>普通标签、模型推断、长摘要、全部别名和任务提示不得拼入嵌入文本。上下文头策略变化只重嵌受影响块，并创建新 <code>embedding_text_policy_version</code>。</li><li>FTS保留精确原文通道；简繁、别名、简称和同义关系通过结构化别名/查询扩展处理，不改写原始块。</li><li>所有检索原文、研究材料和临时稿在上下文包中以有边界的“引用数据”传递；其中出现的提示词、命令、工具要求或权限声明均不得改变系统指令、岗位权限和工具调用。</li></ul><h6>6.8 构建、增量更新与原子切换</h6><pre class="code-block"><code data-language="text">读取不可变来源版本
→ 生成结构节点与叶子块
→ 校验范围、父子、顺序、哈希和覆盖
→ 构建FTS/向量/关系/Wiki新快照
→ 运行快照探针
→ 在SQLite事务中原子切换当前清单和水位
→ 旧快照标记stale/superseded并保留回滚宽限</code></pre><ul><li>正文、设定或规划产生新正式版本时，只重切受影响来源和依赖投影，不因新增一章全书重切。</li><li>构建中断、哈希变化、范围缺口、模型混用或探针失败时，新快照保持 <code>failed/building</code>，上一有效快照继续可用；若上一快照已不符合所需正史版本，则明确降级或阻断。</li><li>普通实体标签或别名变化只更新结构化过滤与查询扩展；只有切片范围、规范化、嵌入文本或模型空间变化才重建相应块/向量。</li><li>重切片不修改原始文件、事实或正史。回滚只切回上一已验证清单指针，不恢复旧正史。</li></ul><h6>6.9 查询时的有界扩展</h6><ol><li>先按书籍、正史版本、故事时间、权限和状态硬过滤。</li><li>查询路由先判断精确事实、局部场景、宽主题、历史因果或人物声音，再选择 <code>leaf/parent/summary</code> 粒度；结构化、FTS、向量、关系/Wiki并行召回相应候选。</li><li>按来源范围、派生关系和同一事实去除单次结果重复；不同叙事位置的相同原文仍保留。</li><li>事实查询返回原子事实＋最小证据句/子块；局部场景查询从叶子扩场景节拍父块或一个邻块；宽主题查询可以先命中父块/阶段摘要再下钻叶子证据；多跳问题沿实体/事件/规则边扩展；人物声音查询进入受限声音索引。</li><li>每次扩展记录命中块、父/邻块、扩展原因、候选量、采用量和Token。没有明确作用的父块不得进入上下文。</li><li>主笔只获得约束胶囊和少量灵感调色板；编剧、设定师、审校的扩展维度和预算在岗位检索合同中另行配置，不能靠切片器给所有岗位同一资料。</li></ol><h6>6.10 作者可见与可解释性</h6><p>作者在资料库看到原始资料、实体、事实、来源片段、版本、故事时间和派生状态，不需要看到向量数组。检索预览可以展示“命中了哪个来源片段、为什么扩展父/邻块、最终给了哪个岗位多少资料、哪些资料被排除”。默认界面不要求作者管理技术块；高级诊断页可按来源查看块边界和重建状态。</p><h5>7. 创造性与输出质量保护</h5><p>切片策略会改变模型看到什么，因此不声称对创造性零影响。硬事实和来源准确是门禁；历史相似场景、人物声音、意象、情绪和风格证据属于限量软资料。</p><ul><li>主笔自由创作区必须明确存在，切片器不能把父块、邻块和命中资料自动变成逐项执行清单。</li><li>与固定切片、整章上下文、只有硬事实和当前基线建立对照；使用相同模型族、相近预算、多次采样、匿名随机的成对盲评。</li><li>上述比较执行创造性与输出质量非劣效合同；事实、检索或一致性改善不能抵消任何核心创作维度的有意义下降。</li><li>分别评价原创性、合理惊喜、人物声音、情绪力度、语言画面、节奏、旧文模仿、检索锚定和整体质量；不能用事实正确率提高抵消任一核心创作维度退化。</li><li>如果最小块导致创作碎片化，先调整查询扩父/邻块策略；如果父块导致模仿旧文，减少软原文并保留硬事实。不得用全书资料包作为永久兜底。</li><li>召回到的风格和相似场景允许不用；人物声音证据最多2—4条且不得要求复写句式。</li><li>样本不足或评审分歧大时结论为不确定，保持旧策略或实验态，不升级为默认。</li></ul><h5>8. 测试与证据等级</h5><h6>E0：规格</h6><p>本文、DEC-017、数据字段、默认参数、基线、停止和回滚规则完整且无冲突。</p><h6>E1：机制存在</h6><p>存在版本化切片器、块/快照Schema、Repository、投影任务、原子清单指针、FTS/向量构建、来源回链和诊断接口。</p><h6>E2：构造与故障测试</h6><ul><li>每个叶子块能按字节范围和哈希精确恢复原文；父子包含、顺序和邻接正确。</li><li>除显式分类的空白/分隔符外，叶子范围覆盖完整来源且不存在非预期交叉；重复构建结果确定。</li><li>对话、动作—反应、超长段落、诗歌、书信、属性面板、跨章场景、梦境、回忆、谎言和反事实通过边界夹具。</li><li>两书、正式/临时、当前/旧正史零串线；构建中断、重复执行、旧模型、错水位、目录损坏、原子切换和回滚通过。</li></ul><h6>E3：独立金标与满规模</h6><ul><li>在500万字符、1500章语料上分层抽样，查询和边界金标与切片器规则、固定同义词和实现代码独立。</li><li>至少比较固定500＋100重叠、纯段落/语义切片、本文父子块＋零盲目重叠三组；80—120同场景重叠作为消融变量。</li><li>题材覆盖对话密集、战斗、悬疑、群像、多视角、说明密集、非线性时间和文中作品。</li><li>分别报告Recall@K、Precision@K、MRR、nDCG、边界证据完整率、错误实体/时间率、无答案准确率、重复注入率、上下文Token、P50/P95延迟、构建时间、重建范围、磁盘和内存。</li><li>硬状态正确率100%、跨书污染0、来源回链100%；其余阈值在看结果前由独立评测方案按题材和样本冻结，不能看完结果后降低门槛。</li></ul><h6>E4：真实创作影响</h6><p>用真实岗位模型比较最小父子块上下文、固定切片、整章/全量包和只有硬事实基线。先做跨人物/场景/题材多样本盲评，再进入20/50/100—200章纵向评测；只有实际覆盖1000章以上和目标字数范围，才能声明相应规模的长期效果。</p><p>E3检索提升不能替代E4文学质量证据。任何核心创造性维度低于预设非劣效门槛，默认策略不通过。</p><h5>9. 剩余风险与未知项</h5><ul><li>中文小说不同题材、排版和平均段落长度差异较大，350—700、1200—3000和4500只能作为初始默认值；最终锁定需要独立基准。</li><li>自动场景边界、说话人、视角和叙事模式识别可能误判含蓄转换或不可靠叙述；低置信必须允许未知和原文回查。</li><li>最小上下文头可能提高实体区分，也可能产生名称锚定；需要与无头文本做消融。</li><li>零复制重叠减少重复，但可能降低边界改写召回；邻块扩展与小重叠必须通过同一金标比较。</li><li>本地嵌入模型、量化、维度和分词对中文长文本的最佳组合仍取决于目标电脑实测。</li><li>E0完整设计不能证明切片器可运行、检索更准或正文更好；这些结论分别需要E1—E4。</li></ul><h5>10. 停止、回滚和升级条件</h5><ul><li>来源范围无法精确回链、叶子覆盖存在缺口、块跨书/跨权限、当前与旧正史混用时，停止构建和正式检索。</li><li>新快照未完成探针或原子切换时不得上线；失败后保留上一有效快照，若其版本过旧则降级结构化＋FTS或阻断相关正式任务。</li><li>独立金标中边界完整、无答案、时间/实体正确性未优于最佳简单基线，保持简单基线，不因设计复杂而强行启用。</li><li>创造性、人物声音、情绪力度或整体阅读质量低于预设非劣效门槛时，回滚切片策略、上下文头、父/邻块扩展或软资料数量；不回滚正史、安全、版权和隔离门禁。</li><li>只有目标电脑实测证明版本化父子切片在容量、延迟或恢复上不能达到门槛，才提交引入其他索引服务或重大架构改变；不能因为框架流行而升级。</li></ul><h5>11. 当前施工边界</h5><p>切片Schema由0012新增，迁移只建结构；重切片和嵌入由Worker后台执行。已有书籍先创建非活动快照，完成叶子覆盖、UTF-8范围、父子/邻接、来源哈希、跨书零命中和冻结检索探针后，才按书原子切换。构建失败或中断时继续使用上一活动快照，不能暴露半套块或在迁移事务里同步重切全书。</p><hr><h3>长篇小说创作质量与工作流规范 V2</h3><blockquote>当前源文件：<code>docs/LONGFORM_QUALITY.md</code> · 指纹：<code>8cf7b1b37206</code></blockquote><h4>长篇小说创作质量与工作流规范 V2</h4><blockquote>生效日期：2026-08-09<br>适用版本：<code>wm-longform-r1-20260719-003435-e4d7b8b7</code><br>设计审查：<code>DR-20260809-volume-event-quality-v2</code><br>当前工作流：卷驱动事件链 V2</blockquote><h5>1. 目的</h5><p>本规范用于保证长篇小说在持续创作中保持事实可靠、规划可追溯、人物有生命力、事件有因果、正文有创造性、失败可恢复，并让作者始终拥有最终决定权。</p><p>本规范不是AI成员的逐项写作评分表，也不是产品岗位和模型配置的上级规则。它不固定团队人数、岗位名称、模型供应商、永久上下文字段或叙事公式；实际岗位和模型绑定由当前《AI成员系统》与活动配置决定。</p><h5>2. 现行边界</h5><h6>2.1 不设创作质量层级</h6><p>不再建立面向作者或AI成员的“质量层级、质量分层报告、逐层过关”机制。质量问题按当前工作流节点、影响和证据直接报告，不用等级驱动创作。</p><p>E0—E4只表示工程结论的证据强度，不能表示小说档次，不能注入创作提示词，也不能限制AI方案。</p><h6>2.2 对象化协作与作者原话</h6><p>作者只在明确的开书、设定、卷纲、事件、章纲和正文对象上推进正式创作，不使用聊天推进或抽象创作模式分流。独立灵感只提供启发，不能推进正式状态或写入正式对象。</p><p>作者在开书、设定、卷纲、事件、章纲和正文对象旁直接输入想法、附件与修改意见。AI成员直接提交方案；作者选择、局部融合、编辑、退回或确认。</p><p>正式生产不建立聊天记忆、会话摘要或对话检索源。独立灵感默认隔离；只有作者主动摘录并绑定目标对象的片段，才作为带来源的作者原话进入正式流程。作者原话必须保留在明确业务对象上，并区分：</p><ul><li>必须遵守；</li><li>强偏好；</li><li>灵感参考；</li><li>待回答问题。</li></ul><p>任务、候选、选择、调用、来源、版本和恢复记录继续保存，但它们是业务与审计记录，不是聊天记忆。</p><h6>2.3 不把规范全文注入创作上下文</h6><p>本规范和对应Skill只用于开发设计、故障诊断与验收。AI成员只接收当前任务所需的最小事实、规划、作者原话和创作边界；不得接收本规范全文、工程证据等级或全量检查清单。</p><h5>3. 当前权威工作流</h5><pre class="code-block"><code data-language="text">开书信息
→ 设定
→ 分卷
→ 当前卷事件链
→ 当前事件大纲
→ 当前事件完整章节序列
→ 近期一至三章详细章纲
→ 单章正文
→ 章节结算
→ 事件结算
→ 卷结算
→ 下一卷</code></pre><p>只细化当前一卷。卷长、事件长、章节数和节拍数都是可修订估计，不是硬规则。</p><h5>4. 数据与规划权威</h5><h6>4.1 已发生事实</h6><p>以下内容可以成为已发生事实：</p><ol><li>作者确认的开书信息与设定正史；</li><li>作者定稿的不可变正文版本；</li><li>从定稿正文和既有正史生成并确认的章节、事件和卷结算；</li><li>带明确来源的人工修订。</li></ol><h6>4.2 未来规划</h6><p>分卷、事件链、事件大纲和章纲都是未来创作的活动规划，不是正史。</p><ul><li>卷纲约束本卷目标、核心冲突、主要因果、人物变化、高潮、卷末状态和下一卷接口；</li><li>事件链约束卷内事件职责、顺序和因果衔接；</li><li>事件大纲约束当前事件的入口、行动、结果、代价和下一触发；</li><li>章纲约束本章功能、关键场景和结束状态。</li></ul><p>规划不能直接写入资料库正史。正文实际结果与规划不同，以作者确认正文及结算为“已经发生”，后续规划是否修订由作者决定。</p><h6>4.3 派生层</h6><p>摘要、Wiki、图谱、全文索引、向量、关系投影、标签和质量统计均可重建，只用于导航、检索和诊断，不能成为事实权威。</p><h5>5. 规划版本与依赖</h5><p>设定、卷纲、事件和章纲的每次AI生成、作者修改或融合都产生新版本，不静默覆盖。</p><p>正式正文任务必须冻结：</p><ul><li>活动开书/设定版本；</li><li>活动卷纲版本；</li><li>活动事件版本；</li><li>活动事件章节链版本；</li><li>当前章纲版本；</li><li>工作流版本和模型绑定快照。</li></ul><p>确认上游新版本前，系统显示改变字段和受影响的事件、章纲、正文候选与任务。确认后，错版下游候选必须失效、等待重核或由作者明确保留，禁止静默重写。</p><h5>6. 作者意见与AI方案闭环</h5><p>每个规划节点使用同一闭环：</p><ol><li>作者输入原话、附件、偏好强度和目标对象；</li><li>系统冻结活动上游版本；</li><li>ContextCompiler为实际参与的AI成员分别编译任务包；</li><li>成员直接输出独立方案；</li><li>前端展示方案共同点、实质差异、代价、未知和来源；</li><li>作者可选整份、按部分融合、直接编辑、退回或不采用；</li><li>融合成员只在作者明确选择后整合被选部分；</li><li>作者再次确认后生成活动版本；</li><li>系统计算下游影响并给出下一步。</li></ol><p>AI方案不自动投票、不自动确认，不用“多数意见”替代作者决定。同一模型承担多个岗位时必须如实显示，不得冒充异模型共识。</p><h5>7. 模板规则</h5><p>卷级模板和事件级模板分开维护，只作软参考。</p><p>作者界面不用“猫咪写作、三幕式、五幕式”等专业名作为主标题，而用大白话说明：</p><ul><li>这套安排会怎样推进；</li><li>适合什么故事；</li><li>可能有什么套路风险；</li><li>放进当前书后大致怎样变化。</li></ul><p>作者可以不用模板、自定义、混合、拆分、合并和重排。模板不得固定爽点、反转、打脸、高潮或章数频率，也不得因为未命中模板而阻止AI方案。</p><h5>8. ContextCompiler与任务型上下文</h5><h6>8.1 总原则</h6><p>上下文由确定性ContextCompiler按任务编译，不由某个AI岗位垄断数据库或检索。岗位可以变化，任务所需信息随当前书、当前节点和活动版本变化。</p><p>每个ContextPack至少记录：</p><ul><li><code>owner_id</code>、<code>book_id</code>；</li><li>任务类型与目标对象；</li><li>活动版本和修订号；</li><li>作者原话及强度；</li><li>直接权威源；</li><li>检索查询、纳入与排除理由；</li><li>冲突、裁剪、预算和来源指纹；</li><li>ContextCompiler版本。</li></ul><h6>8.2 完整输入与无损压缩</h6><p>开书信息体量有限，开书和设定任务直接接收完整活动版本。从卷纲开始可以压缩，但压缩必须完整覆盖上游有效字段，不是只生成几句摘要。</p><p><code>BookCorePack</code>必须覆盖作者填写的全部开书信息：书名、定位/卖点、题材与标签、目标读者、预计规模、节奏/风格、初始角色、身份、性格、目标、核心机制/金手指、开篇场景、自定义信息、必须项、强偏好、灵感、问题和附件引用。空字段保留为空，AI不得补造。</p><p>设定、卷纲和事件分别形成可回查原文的 <code>SettingConstraintPack</code>、<code>VolumeConstraintPack</code>、<code>EventChainPack</code>和<code>CurrentEventPack</code>。无损压缩遵守：</p><ul><li>作者已填写字段覆盖率100%；</li><li>作者原话、必须项、强偏好、硬设定、核心机制和上层因果不丢失；</li><li>每个压缩项携带来源对象、版本和字段/片段引用；</li><li>硬约束、软节奏/模板和灵感分开；</li><li>上游修订后重新编译，旧任务包失效；</li><li>超预算时先去重和缩短措辞，不删除上游核心字段。</li></ul><h6>8.3 任务上下文矩阵</h6><div class="table-scroll"><table><thead><tr><th>任务</th><th>直接接收</th><th>按需检索</th><th>明确排除</th></tr></thead><tbody><tr><td>开书</td><td>作者填写的全部开书字段、自定义信息、附件、导入内容和偏好；不压缩</td><td>导入旧稿时仅查导入范围</td><td>其他书、聊天、AI猜测和未填信息补造</td></tr><tr><td>设定候选</td><td>完整开书活动版、当前设定模块、该模块全部作者自定义信息和附件；后续模块加入已确认的直接依赖设定</td><td>当前书内开书字段、已确认设定依赖和附件来源</td><td>其他书、聊天、卷纲、事件、章纲、正文、无关设定和未确认AI猜测</td></tr><tr><td>卷纲候选</td><td>完整覆盖开书字段的<code>BookCorePack</code>、<code>SettingConstraintPack</code>、长期承诺、作者选择的卷节奏/软模板、本卷全部自定义信息；后续卷加入上一卷真实结算和当前状态</td><td>大线索、人物/势力状态、历史实际因果和必要原文</td><td>其他书、聊天、未实现规划、全文正文、事件模板全集</td></tr><tr><td>事件链/蓝图</td><td><code>BookCorePack</code>中的定位/标签/主角/核心机制、<code>SettingConstraintPack</code>、完整<code>VolumeConstraintPack</code>、事件链作者原话和事件软模板</td><td>卷目标相关线索、角色/势力状态和重大因果</td><td>其他书、聊天、无关旧事件、正文全文、固定章数和无依据跨卷扩张</td></tr><tr><td>事件大纲</td><td><code>BookCorePack</code>、<code>SettingConstraintPack</code>、完整<code>VolumeConstraintPack</code>、完整<code>EventChainPack</code>、当前事件卡全部信息、上一事件真实结算/卷首状态、当前事件作者原话和软模板</td><td>相关人物、地点、规则、道具、线索、历史因果和必要原文</td><td>其他书、聊天、全卷正文、其他事件完整大纲、无关资料和越过事件链的扩写</td></tr><tr><td>章纲</td><td>压缩但完整覆盖的开书/设定/卷纲/事件链，完整<code>CurrentEventPack</code>，上一真实结算和作者章链/单章意见</td><td>当前事件和本章事实、角色状态、线索、前文因果和场景原文</td><td>其他书、聊天、无关卷/事件、全部人物卡和无关正文</td></tr><tr><td>正文</td><td><code>BookCorePack</code>、<code>SettingConstraintPack</code>、<code>VolumeConstraintPack</code>、<code>EventChainPack</code>、<code>CurrentEventPack</code>和当前章完整<code>CurrentChapterOutlineFull</code>，以及前章、当前正史、作者意见和自由区</td><td>实体、规则、因果、时间、人物声音和必要原文</td><td>其他书、聊天、全书正文、整套模板原文、其他事件完整大纲、其他章节完整章纲和无关报告</td></tr><tr><td>事实审查</td><td>开书硬边界、设定/卷/事件链/当前事件约束、完整当前章纲、同一不可变正文、前章/上一结算、正史、时间线、人物/物品/能力/地点状态和线索</td><td>正文实际出现实体、规则、时间、知情、能力、道具、线索及正式原文</td><td>其他书、聊天、其他审查报告、AI候选、纯审美偏好；无证据时不得把留白/谎言/谜团判错</td></tr><tr><td>文学审查</td><td>开书题材/读者/表达偏好、压缩卷/事件上下文、完整当前章纲、同一不可变正文、必要前章、人物声音/关系/情绪证据和作者本章意见</td><td>人物代表性原文、近期同类场景、本事件情绪进度</td><td>其他书、聊天、其他审查报告、全量正史、无关设定和固定文风/节拍表</td></tr><tr><td>体验审查</td><td>开书卖点/标签/目标读者、压缩卷纲、完整事件链中的当前位置、当前事件、完整当前章纲、同一不可变正文、必要前章、事件阅读进度和作者预期感受</td><td>必要前章、已定稿事件体验锚点和题材承诺</td><td>其他书、聊天、其他审查报告、全量设定、固定爽点/反转/打脸次数</td></tr><tr><td>章节结算</td><td>当前章定稿正文全文/版本、完整章纲、前章结算、既有正史、当前状态和相关线索；卷/事件规划只作对照</td><td>正文来源、相关正史和冲突证据</td><td>其他书、聊天、未定稿正文、AI候选和正文未发生的章纲内容</td></tr><tr><td>事件结算</td><td>当前事件全部章结算、必要定稿原文、事件初始正史状态、完整当前事件、事件链和卷纲；规划只作对照</td><td>事件正文来源、状态变化和开放线索</td><td>其他书、聊天、未定稿章节、AI候选和计划未发生内容</td></tr><tr><td>卷结算</td><td>本卷全部事件结算、必要正文回查、卷首正史状态、完整卷纲和事件链；卷纲只作对照</td><td>卷内正式来源、状态、承诺和线索</td><td>其他书、聊天、未结算事件、未定稿正文、AI候选和未实现卷计划</td></tr><tr><td>下一卷</td><td>全字段<code>BookCorePack</code>、活动设定、长期承诺、上一卷完整真实结算、更早卷结算历史、当前人物/势力/资源状态、开放线索、作者新卷原话、节奏/软模板和附件</td><td>下一卷相关设定、结算、跨卷承诺和必要原文</td><td>其他书、聊天、旧AI候选、过期版本、未实现计划冒充事实和全书正文堆叠</td></tr></tbody></table></div><p>章纲任务先评估当前事件所需总字数和章节数，再生成完整章节序列。每章至少确定章节职责、主要场景、关键行动/信息、情绪变化、前后衔接、结尾状态和预计字数；只把近期一至三章提升为正文可用的详细冻结章纲，其余章节继续作为可调整的事件内规划。</p><p>三类审查必须绑定同一份不可变正文和同一个完整当前章纲，但附加上下文按职责隔离，也不能读取彼此报告：事实席拿硬事实与来源，文学席拿人物声音和表达证据，体验席拿目标读者、题材承诺和阅读进度。</p><p>结算分为章节、事件和卷三级。每一级只从作者定稿正文、下一级已确认结算和既有正史提取实际结果；卷纲、事件大纲和章纲只能用于计划—实际差异，不能写入“已发生”。下一卷必须以完整真实卷结算为起点，上一卷未实现计划只能作为重新选择的候选。</p><h5>9. 混合RAG V2</h5><h6>9.1 目标架构</h6><p>SQLite保存正式业务源、版本、关系、来源、任务和结算；LanceDB只保存可重建的本地向量投影。检索按任务组合：</p><ol><li>结构化精确查询；</li><li>全文检索；</li><li>向量语义召回；</li><li>人物、势力、地点、道具、规则和线索关系扩展；</li><li>时间与因果邻域；</li><li>已确认设定、正文与来源附件原文回查。</li></ol><h6>9.2 路由与融合</h6><p>工作流节点、目标对象、活动版本和任务意图先决定检索通道，再决定召回数量。禁止用一个全局相似度阈值处理全部任务。</p><p>融合前必须执行：</p><ul><li>书籍隔离；</li><li>活动版本和有效期检查；</li><li>来源权威检查；</li><li>时间、因果和状态一致性；</li><li>冲突标注；</li><li>去重和预算裁剪；</li><li>纳入/排除理由记录。</li></ul><p>摘要只导航，发现事实不确定或冲突时回查正式源。找不到依据就标注未知或需确认，不补造。</p><h6>9.3 与全书长度解耦</h6><p>模型上下文不随总字数线性增长。跨卷信息依靠版本化卷结算、开放线索、实体状态和按需原文回查；不得用“只记最近固定章数”作为长期遗忘规则。</p><h5>10. 动态分层规划 V2</h5><p>动态分层采用当前卷—事件对象链：</p><pre class="code-block"><code data-language="text">全书长期承诺与活动设定

当前事件完整章节序列

近期一至三章详细章纲
        ↓
单章正文与真实结算</code></pre><p>远期只保留方向和接口，近期才细化。每完成一章以实际结算更新后续章纲；每完成一个事件以事件结算更新后续事件；每完成一卷以卷结算规划下一卷。</p><p>这不是限制AI只能执行计划。正文中的合理局部发挥属于自由区；可能显著改善故事但改变上层因果的偏离，保留为候选并显示影响，由作者决定修订上层规划还是回到原计划。</p><h5>11. 正文生产闭环 V2</h5><h6>11.1 生成</h6><ol><li>冻结卷纲、事件、事件章节链和当前章纲；</li><li>编译任务上下文和创作自由区；</li><li>当前活动写手生成完整草稿；</li><li>做结构、空输出、版本、来源和明显硬边界检查；</li><li>进入独立审查。</li></ol><p>正式正文逐章生成。上一章未定稿和结算，不启动下一章正式生成。禁止默认批量正式写章，也不默认两个写手串行重写整稿。</p><h6>11.2 审查</h6><p>当前产品配置的审查成员对同一不可变草稿独立工作：</p><ul><li>事实连续性：只判断可验证事实、设定、时间、状态、版本和来源；</li><li>文学人物：关注表达、人物声音、情绪、场景和机械感；</li><li>读者体验：关注代入、节奏、期待、厌烦点和下一章吸引力。</li></ul><p>岗位和模型映射由当前《AI成员系统》定义，本规范不冻结名字和人数。</p><p>硬事实错误必须处理；文学和体验意见由作者裁决。审查不得读取彼此结果后冒充独立意见，不得自动无限改稿；两轮后仍有分歧时展示给作者。</p><h6>11.3 定稿</h6><p>作者可直接编辑、要求定点重写、保留满意部分或确认。每次修改形成新不可变正文版本，旧版本可追溯，不静默覆盖。</p><h5>12. 结算闭环</h5><h6>12.1 章节结算</h6><p>从定稿正文提取本章实际因果、角色与关系变化、地点/道具/规则状态、开放或回收线索及正文来源。与章纲差异只用于调整后续，不把章纲补成事实。</p><h6>12.2 事件结算</h6><p>事件全部章节定稿后，聚合实际入口、行动、结果、代价、下一触发和状态变化，并对照事件大纲标记已实现、调整实现、未实现和新增结果。</p><h6>12.3 卷结算</h6><p>卷内事件全部结算后，聚合实际主线、人物变化、势力状态、重要收益与代价、开放线索和下一卷入口。下一卷必须引用真实卷结算，不能引用上一卷未写出的计划。</p><p>所有结算、正史更新、活动指针推进和下一步解锁必须事务化或具有可证明的原子补偿，禁止半结算。</p><h5>13. 创造性与人物保护</h5><h6>13.1 三类约束</h6><ul><li>硬底线：作者确认事实、活动版本、数据隔离、安全、版权来源、费用与不可逆操作；</li><li>当前任务约束：活动卷、事件和章纲中被确认的目标与边界；</li><li>软参考：模板、节拍、题材惯例、作者灵感、风格倾向、审查建议和篇幅估计。</li></ul><p>只有硬底线和明确任务约束能够阻止正式提交。软参考不得自动升级为硬规则。</p><h6>13.2 正文自由区</h6><p>写手可以自由决定对白、动作、意象、环境、场景调度、局部反应和不改变关键因果的自然过渡。规则要求“方向可信”，不是“每句照纲执行”。</p><h6>13.3 人物连续性</h6><p>人物要保持可辨识声音、基于经历的动机和关系记忆，同时允许有因果依据的成长与反常。静态标签不能阻止成长，“成长”也不能掩盖无因漂移。</p><h5>14. 运行状态与恢复</h5><p>AI状态必须来自持久化任务、真实模型调用、工具事件和心跳，不用前端计时器或口头回复伪造。</p><p>核心任务至少具备：</p><ul><li>幂等键；</li><li>租约与心跳；</li><li>有界重试；</li><li>候选检查点；</li><li>取消栅栏和晚到结果隔离；</li><li>上游版本失效检测；</li><li>预算与调用记录；</li><li>Repository事务和恢复入口。</li></ul><p>不保存模型内部思维链，只保存任务步骤、依据、结论和结果。</p><h5>15. 质量诊断与非劣效</h5><p>质量维度只用于离线验收和故障诊断，可按变更影响选择：</p><ul><li>原创性；</li><li>合理惊喜；</li><li>人物可辨识度；</li><li>情绪力度；</li><li>因果自然度；</li><li>叙事清晰度；</li><li>检索锚定；</li><li>卷—事件—章方向一致性；</li><li>整体阅读质量；</li><li>作者选择与修改成本。</li></ul><p>任何检索、上下文、模板、提示词、生成或审查机制改变，都要相对现行基线或弱治理基线做与影响相称的非劣效测试。一致性变好不能抵消人物、惊喜和阅读质量显著下降。</p><h5>16. 工程证据门禁</h5><ul><li>E0：设计、Schema或代码存在；</li><li>E1：单元测试或确定性夹具通过；</li><li>E2：本地集成、迁移、恢复和界面流程通过；</li><li>E3：独立金标、对抗样本、真实模型多样本或盲评通过；</li><li>E4：真实长篇连续运行和纵向质量证据通过。</li></ul><p>固定同义词和连续五章不能证明长篇质量。任何声明必须说明样本、范围、基线、局限和证据等级。</p><h5>17. 必测清单</h5><ul><li>从开书到下一卷完整对象化流程，无聊天依赖；</li><li>作者原话在各节点原样保存且强度正确；</li><li>AI候选真实、独立、来源和模型如实显示；</li><li>作者选择、局部融合、编辑、退回、撤回和确认；</li><li>卷纲、事件、章纲和正文版本依赖及错版失效；</li><li>结构化、全文、语义、关系、时间/因果和原文回查；</li><li>跨书隔离、否定、别名、时间、因果、冲突和对抗查询；</li><li>正文单写手、三类独立审查和不可变定稿；</li><li>章节、事件和卷结算不受未实现计划污染；</li><li>超时、取消、重试、Worker崩溃、晚到结果和半结算恢复；</li><li>空库迁移、升级迁移、已有书籍读取、桌面启动和本地运行；</li><li>创造性、人物和整体阅读质量非劣效。</li></ul><h5>18. 停止与回滚</h5><p>发现跨书、正史污染、不可恢复覆盖、错版正文提交或结算污染时，立即停止正式提交并保留证据。</p><p>发现候选明显同质、人物可辨识度下降、模板化上升、检索挤占创作空间或作者操作负担显著增加时，停止扩大新机制，回滚相关提示词、ContextCompiler、检索或前端装配，不删除作者原话、规划版本、正文、正史、结算和调用证据。</p><h5>19. 规范与Skill治理</h5><p>本规范的实现约束由 <code>.agents/skills/wenmi-longform-quality/SKILL.md</code> 及其参考文件辅助审查。Skill更新不得静默改变当前产品工作流；重大变更必须先形成新决定和 <code>design_review_id</code>，再同步当前规格、代码和验收。</p><p>若Skill与老板最新决定、项目章程或当前工作流冲突，以更高权威为准并立即修订Skill。</p><hr><h3>超长篇连续性设计</h3><blockquote>当前源文件：<code>docs/ULTRA_LONGFORM_CONTINUITY.md</code> · 指纹：<code>b3df1a36af16</code></blockquote><h4>超长篇连续性设计</h4><h5>1. 规模目标</h5><p>单书按约500万规范化中文字符、约1500章设计。模型上下文必须与全书总量解耦，不能靠把全文或全部摘要常驻上下文维持连续性。</p><h5>2. 长期知识层</h5><ol><li>权威原件：作者输入、导入原文、确认设定、活动规划和定稿正文。</li><li>当前状态：人物、势力、资源、地点、规则和关系的活动状态。</li><li>开放承诺：伏笔、目标、债务、谜团、未解决冲突和承诺。</li><li>层级结算：章节、事件、卷和全书骨架的可回查摘要。</li><li>检索投影：FTS、向量、图谱和Wiki。</li></ol><p>摘要和投影不能推翻权威原件。</p><h5>3. 卷—事件连续性</h5><p>分卷是当前卷未来创作权威；事件链将卷目标拆成因果相连的小故事；事件大纲决定当前事件完整闭环；章纲只拆当前事件；正文冻结所有活动上游版本。事件和卷结算把实际结果传给下一层。</p><h5>4. 滚动规划</h5><p>不一次规划1000章。先确认当前卷和完整事件链，再完整设计当前事件，最后细化当前事件章链。上游可以版本化调整，但旧版本保留并使依赖候选过期。</p><h5>5. 历史回查</h5><p>旧阶段默认使用卷/事件/章节结算导航；当实体、规则、时间、因果、伏笔、关系或人物声音触发时，逐级回查正式原文。不存在固定“超过N章就遗忘”的规则。</p><h5>6. 人物连续性</h5><p>人物状态至少区分身份、目标、能力、资源、关系、知情范围、情绪倾向和未兑现承诺。状态变化只能来自作者确认资料或定稿正文结算，并保存来源。人物声音从高置信正式片段按需检索。</p><h5>7. 伏笔与因果</h5><p>伏笔记录埋设来源、当前状态、预期窗口、关联实体和回收证据。因果链记录事件结果如何改变下一事件触发。计划中的伏笔不是已经发生；未在正文出现不能结算为已埋。</p><h5>8. 上下文预算</h5><p>当前任务完整对象优先；上层硬约束放在高注意力位置；历史证据按触发检索。内容过长时先去重复、分级导航和压缩解释，不能删掉身份、目标、因果、规则、作者必须项或未解决承诺。</p><h5>9. Agent长期陪伴</h5><p>长期陪伴意味着岗位身份、版本化模型绑定、任务历史、来源和质量结果可追溯，不意味着常驻模型进程或保存聊天。成员每次从正式状态和任务资料重新进入工作。</p><h5>10. 续写</h5><p>已有正文不可变保存并按章/场景切片。反向拆解提取人物、设定、事件、卷结构和开放承诺，全部带来源并等待确认；未来创作仍使用当前卷—事件流程。</p><h5>11. 验收</h5><p>E2验证满规模存储、检索、重建、恢复、隔离和有界上下文；E3验证跨题材真实模型盲评；E4验证真实作者跨卷长期创作。任何阶段出现人物漂移、因果断裂、摘要覆盖事实或创造性明显下降都触发停止和回退。</p><hr><h3>长篇创作系统评测协议</h3><blockquote>当前源文件：<code>docs/EVALUATION_PROTOCOL.md</code> · 指纹：<code>59b29e78b1be</code></blockquote><h4>长篇创作系统评测协议</h4><h5>1. 目标</h5><p>评测系统是否在长篇持续创作中同时做到：事实可靠、规划不漂移、人物有生命力、输出不机械、作者可控制、任务可恢复。工程正确性和文学质量分开声明。</p><h5>2. 证据等级</h5><ul><li>E0：规则和指标已定义。</li><li>E1：代码机制存在并有局部测试。</li><li>E2：确定性测试、故障注入、规模回放和恢复证据。</li><li>E3：独立金标、真实模型和盲评。</li><li>E4：真实作者、跨卷长篇纵向效果。</li></ul><p>短流程、固定样例或模拟模型不能声明E3/E4。</p><h5>3. 工程数据集</h5><p>覆盖开书、设定、卷纲、事件链、事件大纲、章纲、正文、三席审查、章节/事件/卷结算和续写。每组包含正常、边界、错误、取消、重复、版本冲突和跨书对抗样例。</p><h5>4. 不可妥协指标</h5><ul><li>跨书污染：0。</li><li>未确认候选进入正史：0。</li><li>正文静默覆盖：0。</li><li>远程结果未知自动重复调用：0。</li><li>模型来源伪造：0。</li><li>迁移失败导致数据丢失：0。</li><li>非对象化消息接口、跨书结果和无来源正式结论：0。</li></ul><h5>5. 检索与上下文</h5><p>测试结构化直达、FTS、向量、关系、时间/因果、别名、否定、旧版本和原文回查。记录召回、精确、来源正确、跨书隔离、硬约束保留、上下文预算和降级行为。</p><p>对每类任务验证上下文矩阵：完整当前对象、压缩上层约束、作者原话、活动版本和明确排除项。</p><h5>6. 创造性非劣效</h5><p>任何会改变检索、上下文、提示、规划、生成或审查的机制，都与当前流程或弱治理基线比较。盲评维度：</p><ul><li>原创性与合理惊喜；</li><li>人物可辨识度和选择可信度；</li><li>情绪力度与节奏；</li><li>因果和上层目标承接；</li><li>文风自然度与重复；</li><li>整体阅读意愿。</li></ul><p>一致性提升不能用显著降低任一核心创作维度交换。</p><h5>7. Agent独立性</h5><p>验证两位编剧独立阶段互不可见、主编后置融合；三席审查模型来源不同、互不读取报告且不同于活动写手；真实状态来自任务和调用。重复模型来源必须被识别并降级。</p><h5>8. 纵向评测</h5><p>至少跨多个事件和一个完整卷观察人物漂移、目标遗忘、伏笔、时间线、文风同质、重复冲突、高潮疲劳和摘要失真。500万字符容量测试只证明工程可运行，不证明文学质量。</p><h5>9. 反迎合</h5><p>构造作者意见与正史冲突、作者自相矛盾、明显会破坏卷目标的灵感和审查意见互相冲突样例。系统应指出代价和来源，不能盲从，也不能擅自替作者决定。</p><h5>10. 报告</h5><p>每次评测保存版本、模型、提示、上下文策略、数据集、随机种子、原始结果、评分者、差异和失败样例。报告只给可重复证据，不把主观偏好包装成绝对标准。</p><hr><h2>三、系统架构、数据、接口与运行</h2><h3>系统架构</h3><blockquote>当前源文件：<code>docs/ARCHITECTURE.md</code> · 指纹：<code>28738f21024a</code></blockquote><h4>系统架构</h4><h5>1. 总体形态</h5><p>本地模块化单体加独立 Worker：</p><pre class="code-block"><code data-language="text">React/Vite Web → Fastify REST/SSE → Application Services → Repositories → SQLite/Files
                                      ↓ outbox/tasks
                                  Independent Worker → Model adapters / projections</code></pre><p>服务只监听 <code>127.0.0.1</code>。不使用微服务、WebSocket或需要独立运维的向量/图数据库。</p><h5>2. 模块边界</h5><ul><li>Web：统一创作台、书籍切换、对象编辑、团队/任务状态、隔离灵感、报告和辅助工具。</li><li>API：认证、校验、领域命令、查询投影、任务排队、SSE。</li><li>Worker：领取长任务、编译上下文、调用模型、保存候选和重建投影。</li><li>Contracts：跨端共享的请求、响应和事件类型。</li><li>Repositories：业务代码访问SQLite的唯一入口；新增应用服务不得直接写SQL。</li><li>Files：不可变正文、导入原件、附件、备份和可重建投影文件。</li></ul><h5>3. 当前工作流编排</h5><p>开书、设定、卷纲、事件、章纲、正文和结算分别使用明确领域对象与版本链。任务冻结上游版本、作者输入、模型绑定、预算和上下文包。上游改变时下游候选失效或重新确认，不静默沿用。</p><p>对象页面直接启动正式AI任务并展示结果；正式生产不依赖聊天入口、消息回复流水线或会话记忆。灵感是隔离的辅助域，只保存讨论轮次和引用，不能调用正式对象写入；只有作者主动摘录并绑定业务对象后才转成 <code>author_planning_inputs</code>。</p><h5>4. 写入模型</h5><p>SQLite使用单写者事务、外键、WAL和向前迁移。每项核心写入携带 <code>owner_id</code>、<code>book_id</code>。跨书访问在Repository入口校验。</p><p>正文使用不可变完整版本。Worker只能保存任务结果、候选、调用记录和投影，不得直接覆盖正式正文或正史。作者确认由API事务提交。</p><h5>5. 任务与恢复</h5><p>任务状态：pending → queued → working → succeeded/failed/cancelled/paused/blocked。领取使用租约、attempt编号和lease token；模型结果提交还校验主编epoch。结果未知时冻结并等待调和，不盲目重试远程调用。</p><p>每次模型调用保存：任务、Agent、模型快照、输入哈希、上下文包、预算预留、耗时、Token、结果哈希和最终状态。不保存思维链。</p><h5>6. 上下文与检索</h5><p>确定性 ContextCompiler 按任务编译资料：先取活动版本与结构化直达，再按实体、时间、因果、伏笔、声音和来源触发混合检索。SQLite是正式源；FTS、LanceDB、Wiki、图谱和摘要都是可重建投影。</p><p>检索永远携带书籍隔离键；其他书、未摘录灵感、过期版本、无关候选和模型猜测不能进入生产上下文。灵感自己的检索只读取当前书已确认正式源，不能读取其他讨论会话作为事实。</p><h5>7. 模型与Agent</h5><p>岗位、Agent实例和模型绑定分离。卷纲与事件规划可并行调用两位互不可见的异模型编剧，随后由主编融合；正文只有一个活动写手；事实、文学、体验三席使用三异模型独立审查。</p><h5>8. 文件与附件</h5><p>作者附件绑定具体开书、设定、卷、事件、章纲或正文对象。原件不可变，解析文本和预览可重建；公开API和运行时统一使用作者附件语义。</p><h5>9. 前端布局</h5><p>桌面端为左侧纯书籍栏、顶部完整功能栏和中心创作台。书籍栏只切换书；功能栏统一切换信息、设定、分卷、规划、章纲、正文、资料库、取名、团队、任务、灵感和设置。不设第二套对象导航或常驻成员右栏。默认使用iOS式浅色玻璃视觉。窄屏时书籍栏变抽屉、功能进入紧凑菜单。创作台内部按对象加载，正文和长列表虚拟化或分页。任务通过SSE更新，不伪造进度。</p><h5>10. 构建与可达性</h5><p>启动入口为API、Worker、Web和共享Contracts。<code>scripts/audit-runtime-reachability.mjs</code> 必须报告四端零孤儿源码。生产构建、类型检查、全量测试、迁移和启动验证均为发布门禁。</p><hr><h3>数据模型规格</h3><blockquote>当前源文件：<code>docs/DATA_MODEL.md</code> · 指纹：<code>5b01d901b54d</code></blockquote><h4>数据模型规格</h4><h5>1. 总原则</h5><ul><li>SQLite是正式业务数据唯一权威。</li><li>所有书内核心记录包含 <code>owner_id</code> 与 <code>book_id</code>。</li><li>已合并迁移只向前追加，不修改、不删除。</li><li>正文和关键规划采用不可变版本；活动指针与历史版本分离。</li><li>摘要、全文、向量、图谱和Wiki均可从正式对象重建。</li></ul><h5>2. 身份、书籍与模型</h5><ul><li><code>owners</code>：本地所有者。</li><li><code>books</code>：书籍、状态、版本、正史修订和活动主编epoch。</li><li><code>book_onboarding_profiles</code>、<code>positioning_versions</code>、<code>book_expression_profiles</code>：开书原始资料、定位与表达基线版本。</li><li><code>role_templates</code>、<code>agent_instances</code>：岗位模板和逐书Agent实例。</li><li><code>model_config_snapshots</code>、<code>agent_model_bindings</code>：不可变模型快照与活动绑定。</li><li><code>editor_leases</code>、<code>writer_leases</code>：主编和写手租约。</li><li><code>budgets</code>、<code>budget_reservations</code>、<code>usage_ledger</code>：调用预算和结算。</li></ul><h5>3. 作者输入与附件</h5><ul><li><code>author_planning_inputs</code>：作者附着于设定、卷、事件、章纲或正文的原话，保存意图等级、版本和状态。</li><li><code>author_input_links</code>：作者输入与生成任务/候选的有序关联。</li><li><code>author_attachments</code>：作者附件正式对象，保存原件、解析状态、摘要、绑定对象和来源；当前规划链接类型统一为 <code>author_attachment</code>。</li><li>0042迁移将旧库中的附件表原位升级，不复制或删除附件内容；<code>origin_record_id</code> 与 <code>origin_attached_at</code> 只保留历史来源，不进入当前作者接口或创作语义。</li></ul><h5>4. 设定协作</h5><ul><li><code>setting_outline_workspace</code>：当前设定项、状态、候选和确认结果。</li><li><code>discussions</code>、<code>discussion_participants</code>、<code>discussion_opinions</code>、<code>discussion_decisions</code>：对象化AI提案、独立意见与主编整理记录。</li><li>独立提案保存真实Agent、模型快照和输出；作者选择、组合、修订和确认另行记录。</li></ul><h5>5. 卷—事件—章纲规划</h5><ul><li><code>volume_plans</code>及版本表：活动卷纲、候选、模板实例、作者输入、上游依赖和历史切换。</li><li><code>story_events</code>及版本表：卷内事件链、顺序、因果衔接、事件卡和事件大纲。</li><li><code>event_chapter_outlines</code>及版本表：当前事件章链、章节详细章纲、预计字数和上游版本引用。</li><li><code>planning_settlement_assessments</code>：事件/卷计划与实际差异及下一层承接。</li></ul><p>规划对象描述未来，不直接写入正史。活动版本必须引用活动上游版本；上游改变后旧候选标记过期。</p><h5>6. 章节与正文</h5><ul><li><code>volumes</code>、<code>chapters</code>：物理卷与章节目录。</li><li><code>manuscript_versions</code>：完整不可变正文版本。</li><li><code>writer_selections</code>、<code>chapter_work_orders</code>：活动写手与冻结写作工单。</li><li><code>review_reports</code>、<code>editor_review_syntheses</code>：事实、文学、体验独立报告和可执行修订清单。</li><li><code>chapter_settlements</code>及派生表：定稿后实际发生内容、人物状态、伏笔和投影更新。</li></ul><h5>7. 正史、知识和检索</h5><ul><li>正史事实、实体、关系、时间线、开放线程和来源表：只接收作者确认资料或定稿结算。</li><li><code>chunk_snapshots</code>与检索块：不可变切片快照和原子活动指针。</li><li>FTS表：关键词与短语检索投影。</li><li>LanceDB：本地向量投影，可删除重建，不能成为事实源。</li><li>Wiki、图谱、摘要：派生导航，必须保留来源指针。</li></ul><h5>8. 任务、调用与审计</h5><ul><li><code>tasks</code>、<code>task_attempts</code>、<code>task_phases</code>、<code>task_dependencies</code>：持久任务、尝试、检查点和依赖。</li><li><code>context_packs</code>：每次调用冻结的来源清单、预算、哈希和排除项。</li><li><code>model_calls</code>、<code>model_call_results</code>、<code>model_call_reconciliations</code>：模型调用、结果与中断调和。</li><li><code>projection_outbox</code>、<code>projection_jobs</code>：正式事务到可重建投影的可靠交接。</li><li>操作、备份、恢复、永久删除墓碑和安全审计表记录不可逆或高风险动作。</li></ul><h5>9. 迁移与保留</h5><p>已合并迁移保持不可变，新增结构使用向前迁移。作者原件、正式正文、任务来源和恢复记录按数据生命周期保留；永久清理作者数据只能通过书籍彻底删除流程执行。</p><p>迁移中的旧表名、旧字段名和旧任务类型只承担升级或恢复职责，不得作为当前Repository、路由、检索源或作者界面契约。</p><h5>10. 关键不变量</h5><ul><li>跨书查询结果必须为0。</li><li>一个书内同一层级最多一个活动版本。</li><li>正文修改必然产生新版本。</li><li>投影删除或损坏不能破坏正式源。</li><li>未确认候选不能升级为正史。</li><li>任务结果提交必须通过租约、attempt、书籍和主编epoch校验。</li></ul><h5>作者可见名称与稳定关联键</h5><p>功能显示名与持久化关联分离：</p><div class="table-scroll"><table><thead><tr><th>作者看到的名称</th><th>稳定功能键</th><th>作者输入 surface</th><th>主要正式对象</th></tr></thead><tbody><tr><td>信息</td><td>framework</td><td>book_profile</td><td>开书信息与书籍档案</td></tr><tr><td>设定</td><td>basic</td><td>setting</td><td>设定活动版本、候选与基线</td></tr><tr><td>分卷</td><td>master</td><td>volume_plan</td><td>volume_plans及版本</td></tr><tr><td>规划</td><td>event</td><td>event</td><td>story_events、事件链与事件大纲版本</td></tr><tr><td>章纲</td><td>chapter</td><td>chapter_outline</td><td>event_chapter_outlines及版本</td></tr><tr><td>正文</td><td>manuscript</td><td>manuscript</td><td>manuscript_versions</td></tr><tr><td>资料库</td><td>library</td><td>无直接作者输入面</td><td>可重建资料、图谱与来源投影</td></tr><tr><td>取名</td><td>naming</td><td>无固定surface</td><td>命名候选与占用记录</td></tr></tbody></table></div><p>团队、任务、灵感和设置是工具域，不改变上述创作对象的数据库身份。显示名称改动不得修改已合并迁移、表名、枚举、对象ID或历史来源文字。已有历史文字通过作者展示层只读转换，新数据继续使用稳定键建立关联。</p><hr><h3>当前API与事件契约</h3><blockquote>当前源文件：<code>docs/API.md</code> · 指纹：<code>5127e058e8f9</code></blockquote><h4>当前API与事件契约</h4><h5>1. 通用规则</h5><ul><li>前缀：<code>/api/v1</code>；健康检查为 <code>/health</code>。</li><li>服务仅监听 <code>127.0.0.1</code>。</li><li>所有书内接口从路径获取 <code>bookId</code>，服务端同时绑定本地 <code>owner_id</code>。</li><li>成功响应包含 <code>data</code> 与请求追踪ID；失败响应包含稳定错误码、可读消息、是否可重试和必要详情。</li><li>创建/生成命令使用幂等键；版本化修改携带期望版本，冲突返回409。</li><li>长任务返回任务ID，通过任务查询和SSE观察，不在HTTP连接中假装同步完成。</li></ul><h5>2. 运行与能力</h5><ul><li><code>GET /health</code>：API与数据库健康。</li><li><code>GET /api/v1/runtime/worker</code>：Worker心跳和队列状态。</li><li><code>GET /api/v1/runtime/readiness</code>：数据库、迁移、模型与投影准备度。</li><li><code>POST /api/v1/runtime/session</code>：建立本机页面会话。</li><li><code>GET /api/v1/capabilities</code>：当前模型、检索和运行能力。</li></ul><h5>3. 书架与开书</h5><ul><li>书籍草稿：创建、更新、确认。</li><li><code>GET /api/v1/books</code>：书架。</li><li>书籍详情、开书资料、定位、表达基线、归档、恢复和彻底删除。</li><li><code>GET /api/v1/opening-taxonomy</code>：频道、分类、题材和标签目录。</li><li><code>GET /api/v1/books/:bookId/workflow</code>：当前卷—事件工作流状态。</li></ul><p>确认开书会原子创建书籍、定位版本、团队、模型绑定、预算、设定工作区和首个设定任务。</p><h5>4. 设定对象协作</h5><ul><li><code>GET /api/v1/books/:bookId/setting-outline-workspace</code>：当前设定工作区。</li><li><code>GET /api/v1/books/:bookId/setting-outline-workspace/:itemKey/collaboration</code>：当前项AI方案与任务。</li><li><code>POST .../collaboration/start</code>：主编和两位编剧独立提案。</li><li><code>POST .../collaboration/synthesize</code>：按作者选中的方案整理候选。</li><li><code>POST .../collaboration/revise</code>：按作者本轮意见修订候选。</li><li>设定项确认、跳过/留白和整份设定基线确认使用独立命令。</li></ul><p>这些接口直接读写当前设定对象、候选、作者选择和确认结果。</p><h5>5. 作者想法与附件</h5><p>作者想法按 <code>surface</code>、<code>subjectType</code>、<code>subjectId</code> 附着开书、设定、卷、事件、章纲或正文，并保存原话、意图等级、版本和状态。附件使用 <code>/author-attachments</code> 上传、读取、绑定和丢弃。</p><h5>6. 分卷</h5><p><code>/api/v1/books/:bookId/volume-plans</code> 提供列表、创建和详情。单个卷计划支持：作者输入、候选、AI生成任务、选择/融合、确认、历史切换、影响预览和结算。所有修改校验工作流版本与上游设定版本。</p><h5>7. 事件链与事件大纲</h5><p><code>/api/v1/books/:bookId/volume-plans/:volumePlanId/story-events</code> 管理事件列表、顺序、插入、移动、拆分、合并、候选生成、确认和因果衔接。单个事件通过 <code>/story-events/:eventId</code> 获取详情、生成事件大纲和执行事件结算。</p><h5>8. 当前事件章纲</h5><p><code>/api/v1/books/:bookId/story-events/:eventId/chapter-outlines</code> 管理章数评估、批量章链候选、单章详细章纲、作者修改、确认和历史版本。生成任务冻结活动卷纲、事件链、事件大纲和作者输入。</p><h5>9. 正文与审查</h5><p>章节接口提供目录、写作工单、单章生成、状态、稿件版本、作者编辑、定点修订和定稿。正式生产一次只处理一章。三席报告分别读取和展示；作者定稿后才能执行章节结算。</p><h5>10. 续写与反向拆解</h5><p>已有正文接口支持文件/文本导入、解析预览、章节顺序确认、不可变入库、分析任务、来源查看和反向规划候选。分析完成后通过设定、卷、事件和章纲对象继续。</p><h5>11. 图谱、资料库、检索和取名</h5><p>按书提供人物状态、实体、事实、关系、时间线、伏笔、来源、缺口、图谱投影、混合检索和命名候选。检索响应标注来源、版本、证据等级和降级状态；不暴露其他书结果。</p><h5>12. 团队、任务与模型</h5><ul><li>团队模板、逐书成员、岗位公开说明、真实状态和模型绑定。</li><li>任务中心、任务详情、暂停、取消、失败重试和结果未知调和。</li><li>模型调用、预算和用量只显示可审计元数据，不返回密钥或思维链。</li></ul><h5>13. 备份、恢复和删除</h5><p>备份、导出、导入和恢复操作均有操作ID、状态和校验结果。普通删除为归档。彻底删除只允许已归档书，先查看影响，再输入大小写不敏感的 <code>YES</code> 并二次提交；服务端原子清理并写墓碑。</p><h5>14. SSE事件</h5><p>事件至少覆盖任务排队/开始/阶段/完成/失败/取消，模型调用开始/完成/中断，预算变化，投影水位，书籍版本变化和Worker心跳。事件只是状态通知，客户端重新读取正式对象作为最终状态。</p><h5>作者可见功能名合同</h5><p>接口向作者返回的功能名称统一为：信息、设定、分卷、规划、章纲、正文、资料库、取名、团队、任务、灵感、设置。公开显示名来自 Contracts 共享合同。</p><p>API路由、请求字段和数据库surface继续使用稳定英文键，不随显示名改动：book_profile、setting、volume_plan、event、chapter_outline、manuscript。这样已有书籍、幂等键、任务恢复、上下文包和来源引用不需要迁移。接口返回历史自由文本前必须经过作者展示清洗，把旧称转换为当前名称，但不回写历史记录。</p><hr><h3>运行时工作流与状态机</h3><blockquote>当前源文件：<code>docs/RUNTIME_WORKFLOWS.md</code> · 指纹：<code>60cbb0fccbf7</code></blockquote><h4>运行时工作流与状态机</h4><h5>1. 统一任务状态</h5><pre class="code-block"><code data-language="text">pending → queued → working → succeeded
                    ├→ paused → queued
                    ├→ failed → queued（仅可安全重试）
                    ├→ blocked
                    └→ cancelled</code></pre><p>任务包含书籍隔离键、幂等键、上游版本、负责人、预算、阶段、检查点、attempt、租约和错误码。状态只由真实数据库和Worker事件驱动。</p><h5>2. 开书</h5><p>校验全部作者输入 → 建立书籍草稿 → 作者确认 → 单事务创建书籍/定位/11名成员/模型绑定/预算/设定工作区 → 排队首个设定提案。失败回滚整笔事务。</p><h5>3. 设定</h5><p>当前设定项准备完整开书资料与作者本项原话 → 主编和两位编剧互不可见地独立生成 → 保存三份意见 → 作者选择/组合/自写 → 主编只按选择整理 → 作者确认 → 推进下一项。全部必要项确认后生成活动设定版本。</p><h5>4. 分卷</h5><p>编译开书、设定、上一卷结算、当前状态、节奏和作者想法 → 两位编剧独立方案 → 主编融合 → 作者编辑/确认 → 活动卷纲生效。上游版本变化会使候选过期。</p><h5>5. 事件链与事件大纲</h5><p>活动卷纲 → 生成事件序列与因果衔接 → 作者调整顺序/增删拆并 → 确认事件链。选中当前事件后，结合完整事件链、卷目标和作者意见生成事件大纲候选 → 作者融合/确认。</p><h5>6. 当前事件章纲</h5><p>先评估完整事件需要的章数和字数，再生成连续章链。每章纲冻结卷纲、事件链和事件大纲版本。作者确认整个事件章链后，最前未完成章进入正文生产。</p><h5>7. 单章正文</h5><p>准备冻结资料包 → 单一活动写手生成完整初稿 → 硬格式与边界检查 → 事实/文学/体验三席并行审查 → 形成可执行修改清单 → 作者编辑或定点修订 → 作者定稿 → 不可变正文版本 → 章节结算。</p><p>三席互不读取报告；正式正文不批量跨章生成。结果未知时停止自动重试。</p><h5>8. 事件与卷结算</h5><p>事件所有章节定稿后，按正文实际内容汇总结果、代价、人物变化、伏笔和下一事件触发；比较计划与实际并由作者确认。卷内事件全部完成后生成卷结算、遗留问题和下一卷起点。</p><h5>9. 续写</h5><p>导入预览 → 作者核对 → 不可变原文入库 → 分析和切片任务 → 带来源的设定/状态/事件/卷候选 → 作者确认缺口 → 进入当前卷—事件流程。导入和分析不补造历史审查报告。</p><h5>10. 失败恢复</h5><ul><li>租约过期：Worker恢复检查点，已成功调用不重复执行。</li><li>本地确定性调用中断：可证明未执行时释放预算并重试。</li><li>远程结果未知：进入调和，不自动重发。</li><li>上游版本变更：旧候选过期，正式数据不回滚。</li><li>投影失败：正式事务保留，outbox重试重建。</li><li>主编切换：新epoch拒绝旧主编的迟到提交。</li></ul><h5>11. 已退役运行流</h5><p>运行时只接受绑定明确业务对象与活动版本的作者输入和AI任务，不注册非对象化消息入口或会话任务。</p><hr><h3>当前本机安全、隐私与运行运维合同</h3><blockquote>当前源文件：<code>docs/SECURITY_AND_OPERATIONS.md</code> · 指纹：<code>fa5e87d7ac2c</code></blockquote><h4>当前本机安全、隐私与运行运维合同</h4><h5>1. 保护目标</h5><p>保护书籍隔离、作者原件、正式正文、正史、活动规划、模型凭证、本机文件、预算、任务提交、检索投影和备份。浏览器输入、导入文件、附件、模型输出、检索文本和工具响应全部视为不可信输入。</p><p>安全机制只保护数据和运行边界，不替作者决定剧情，也不把软创作建议升级为硬门禁。</p><h5>2. 网络边界</h5><ul><li>API、Worker协调和Web开发服务只监听 <code>127.0.0.1</code>；</li><li>Host只接受明确回环主机和配置端口，拒绝DNS重绑定；</li><li>CORS只允许当前本机Web Origin；</li><li>不开放局域网监听，不使用公网回调，不启动独立向量或图数据库服务；</li><li>SSE使用同一HTTP身份与书籍权限，不在URL携带密钥或长期Token；</li><li>联网研究必须由明确功能触发，经过域名、协议、地址、跳转、大小和内容类型限制。</li></ul><h5>3. 本机HTTP身份</h5><p>API每次启动生成随机会话秘密，只保存在内存。Web通过精确Origin允许的 <code>/api/v1/runtime/session</code> 获取短期HttpOnly、SameSite=Strict Cookie；重启后失效。所有数据接口校验会话，写操作同时校验Origin和 <code>Sec-Fetch-Site</code>。</p><p>本机HTTP不能依赖Secure Cookie作为唯一保护，因此必须同时使用回环监听、Host白名单、精确Origin、SameSite、短期会话和写操作检查。</p><h5>4. 输入与输出限制</h5><div class="table-scroll"><table><thead><tr><th>对象</th><th>当前限制原则</th></tr></thead><tbody><tr><td>作者单字段输入</td><td>按字段Schema和Unicode字符数限制；保留原话，拒绝控制字符和异常超长输入</td></tr><tr><td>作者附件</td><td>白名单类型、大小上限、哈希、独立保存名、解析状态和绑定对象</td></tr><tr><td>导入正文</td><td>先进入预览与隔离区，确认章节顺序后才写不可变原件</td></tr><tr><td>查询与筛选</td><td>参数化SQL、枚举白名单、分页上限、书籍隔离键</td></tr><tr><td>模型输出</td><td>Schema校验、长度限制、来源检查和候选状态；不能直接执行代码或SQL</td></tr><tr><td>SSE事件</td><td>固定事件类型、结构化数据、单事件大小限制和断线恢复游标</td></tr><tr><td>日志字段</td><td>脱敏、截断、路径归一和密钥扫描</td></tr></tbody></table></div><p>前端显示模型文本时使用React文本转义；需要Markdown时只允许安全子集，不允许任意HTML、脚本、事件属性或危险URL。</p><h5>5. 书籍与版本隔离</h5><p>所有核心记录携带 <code>owner_id</code> 和 <code>book_id</code>。Repository方法必须显式接收隔离范围；跨书查询、任务领取、检索、附件绑定、正文读取和SSE订阅均测试错误书籍ID零命中。</p><p>活动开书、设定、卷纲、事件和章纲版本通过明确指针引用。任务冻结上游版本、正史水位和主编epoch；上游改变、主编切换或任务取消后，迟到结果只能进入隔离记录，不能覆盖当前候选或正式数据。</p><h5>6. 模型凭证与隐私</h5><ul><li>API Key只从环境变量读取；</li><li>Key不得写入SQLite、配置文件、Git、日志、任务、ContextPack、模型请求快照、导出或备份；</li><li>错误信息只显示供应商、模型、状态码、请求ID和可执行处理，不显示认证头；</li><li>模型调用只发送当前任务编译后的当前书籍信息；其他书、无关正文和未授权附件不得进入请求；</li><li>调用记录保存模型绑定、预算、Token、耗时、来源指纹、结果状态和安全摘要，不保存思维链；</li><li>本地嵌入模型只读取允许索引的文本，不联网下载运行时代码。</li></ul><h5>7. 作者原件、附件与正文</h5><p>作者附件和导入原件使用独立不可变文件保存，SQLite记录哈希、大小、类型、创建时间、绑定对象和解析状态。展示文件名与物理保存名分离，禁止路径穿越、绝对路径注入、符号链接逃逸和脚本执行。</p><p>正文使用不可变完整版本。任何编辑、AI修订或作者接管都创建新版本；定稿与结算在事务中引用明确正文版本。正式正文文件写入采用临时文件、刷新、原子改名和哈希校验，禁止静默覆盖。</p><p>普通删除为归档。书籍永久删除只允许已归档书，必须先显示影响预览；用户输入 <code>YES</code> 并再次确认后，服务端重新校验归档状态，在事务和文件清理协调下删除全书数据并写墓碑。</p><h5>8. Agent、工具与权限</h5><p>岗位、Agent实例和模型绑定分离。创作成员只获得当前任务ContextPack和允许提交的候选类型，不能自由访问数据库、文件系统、网络、密钥或其他书。</p><p>小文秘书是确定性本地工具角色，只处理导航、附件、任务状态、格式检查和故障回执，不给剧情结论、不冒充模型，也没有通用Shell、SQL或联网权限。</p><p>模型提出以下行为时只能形成候选或被阻断：提升正史、覆盖正文、扩大联网、增加费用、永久删除、跨书读取、修改权限、绕过作者确认、执行任意SQL或命令。最终授权由应用状态机判定，不由自然语言自称判定。</p><h5>9. 联网研究与版权来源</h5><p>联网只允许 <code>http/https</code>，拒绝环回、私网、链路本地、文件协议、非标准重定向和解析后地址变化。每次跳转重新校验，限制响应大小、超时、内容类型和并发。下载内容进入来源区，不自动成为设定、正史或正文事实。</p><p>研究记录保存URL、标题、抓取时间、来源类型、短摘录、主张、许可备注和用途。大段版权原文不得进入主笔ContextPack；系统使用主张、结构卡和必要短摘录，并与创作索引物理隔离。</p><h5>10. 任务、租约与恢复</h5><p>任务状态由SQLite事务维护：<code>pending → queued → working → succeeded</code>，并支持 <code>failed</code>、<code>timeout</code>、<code>cancelled</code> 和可重试状态。Worker只能领取允许的任务类型，写入检查点、心跳、租约epoch和幂等键。</p><ul><li>Worker失联后等待租约超时再接管；</li><li>取消或重写后，原任务结果即使返回也不能提交；</li><li>内容格式错误和可重试供应商故障按任务策略有限重试；</li><li>预算、权限、版本错配、作者确认缺失和永久操作不自动重试；</li><li>Worker不得直接修改正式正文或核心正史；</li><li>失败任务保留已完成候选与检查点，恢复时不重复收费调用。</li></ul><p>成员状态只由真实任务、心跳、模型调用和工具事件派生。等待上游时显示等待，不使用定时动画伪造工作。</p><h5>11. 检索投影安全</h5><p>SQLite正式源和不可变原件是恢复依据。FTS、LanceDB、关系、Wiki、摘要和切片均为可重建投影，并携带书籍、来源版本、故事时间、水位和快照ID。</p><p>构建新快照时继续使用已验证活动快照。新快照通过来源覆盖、跨书隔离、时间过滤、无答案和冻结查询探针后原子切换。投影损坏或水位落后时明确降级或阻断，不静默使用陈旧结果。</p><h5>12. 日志与可观测性</h5><p>结构化日志允许：时间、组件、任务、书籍匿名标识、请求ID、模型、状态、耗时、Token、预算、错误类别、检索通道、水位和恢复动作。</p><p>日志禁止：API Key、Cookie、认证头、正文全文、附件正文、作者敏感原话、完整ContextPack、任意本机私密路径和模型思维链。错误堆栈在对外显示前移除密钥、查询参数、用户内容和非项目路径。</p><h5>13. 备份与恢复</h5><p>一致性备份至少包含SQLite在线备份、不可变原件/正文、必要配置清单、活动版本指针和文件哈希。向量、FTS缓存和其他可重建投影可以不作为唯一备份，但恢复后必须重建并验证水位。</p><p>同一磁盘上的复制和Git历史不等于第二物理备份。重要书籍需要写入另一块物理磁盘并完成恢复演练。恢复顺序为：校验清单与哈希 → 恢复权威数据 → 校验书籍隔离和活动版本 → 重建投影 → 运行探针 → 开放写入。</p><h5>14. 桌面启动与停止</h5><p>桌面启动器只启动本项目登记的API、Worker和Web进程，先执行迁移和健康检查，再打开页面。模型套餐地址必须通过严格路径校验；错误时停止启动并显示可处理原因。</p><p>停止入口只消费由本项目生成并校验的停止请求和进程登记，不枚举或终止其他应用。启动、停止、重复启动、异常退出和端口占用都要有明确回执。</p><h5>15. 必测项</h5><ul><li>Host、Origin、Cookie、CSRF、DNS重绑定、SSE和回环监听；</li><li>跨书读取、写入、任务、附件、检索和事件订阅零串线；</li><li>路径穿越、恶意文件名、异常编码、超长输入和危险Markdown；</li><li>密钥、正文、附件、ContextPack和本机路径不进入日志；</li><li>取消栅栏、租约接管、幂等、迟到结果、预算和主编epoch；</li><li>空库迁移、已有库顺序升级、重复迁移和失败恢复；</li><li>投影错水位、损坏、缺失、重建、降级和原子切换；</li><li>不可变正文、定稿结算和书籍永久删除双确认；</li><li>启动、停止、重复启动、端口冲突与桌面入口；</li><li>备份哈希、第二物理介质和完整恢复演练。</li></ul><hr><h2>四、当前决定、开发计划与验收</h2><h3>当前生效决定</h3><blockquote>当前源文件：<code>docs/DECISIONS.md</code> · 指纹：<code>e107570a23e2</code></blockquote><h4>当前生效决定</h4><p>本文只记录正在驱动当前版本的决定。</p><h5>DEC-CURRENT-001 项目边界</h5><p>文秘写作只在 <code>D:\wenmixiezuo</code> 开发和运行，不得引用或依赖其他项目。</p><h5>DEC-CURRENT-002 技术架构</h5><p>使用React、TypeScript、Vite、Node.js、Fastify、SQLite、LanceDB OSS本地投影、REST与SSE。采用本地模块化单体加独立Worker，服务只监听 <code>127.0.0.1</code>。</p><h5>DEC-CURRENT-003 卷—事件工作流</h5><p>当前流程固定为：开书信息 → 设定 → 分卷 → 当前卷事件链 → 当前事件大纲 → 当前事件章纲 → 单章正文 → 章节结算 → 事件结算 → 卷结算 → 下一卷。</p><h5>DEC-CURRENT-004 上下层约束</h5><p>卷纲约束卷内事件，事件链约束事件大纲，事件大纲约束章纲，章纲约束正文。规划只描述未来，结算只记录正文实际发生内容。上游活动版本变化必须使下游候选失效或重新确认。</p><h5>DEC-CURRENT-005 作者意见与模板</h5><p>作者原话附着明确业务对象，区分必须、强偏好、灵感和问题。卷级、事件级模板分开，作者可见名称全部使用大白话；模板是可不用、自定义、混合和重排的软参考。</p><h5>DEC-CURRENT-006 对象化协作</h5><p>AI成员直接在设定、卷、事件、章纲和正文对象旁提供方案、差异、选择、融合、修改与状态反馈。正式生产不依赖聊天或会话记忆。另设与生产任务隔离的“灵感室”：讨论成员可以读取当前书已确认资料并与作者交流，但讨论内容默认不进入正式上下文、不触发生成或修改；只有作者主动“摘录为灵感”并绑定具体业务对象后，摘录原话才成为该对象的作者输入。</p><h5>DEC-CURRENT-007 已有作品续写</h5><p>已有正文导入、分析和反向拆解保持可用。作者原文不可覆盖；分析是带来源的派生资料，并进入当前卷—事件流程，不能替代新书主流程。</p><h5>DEC-CURRENT-008 团队与模型</h5><p>当前创作团队保持11名成员。岗位、Agent实例和模型绑定解耦；小文秘书不是第12名创作成员。两位编剧必须真实独立，不能用同模型冒充异模型。正文由单一活动写手完成，事实、文学、体验三席使用三异模型独立审查。</p><h5>DEC-CURRENT-009 上下文与混合RAG</h5><p>ContextCompiler按任务和活动版本编译资料。检索组合结构化直达、全文、向量、关系、时间/因果与正式原文回查。摘要只导航，其他书、非对象化输入、过期版本、无关候选、全文堆叠和AI猜测必须排除。</p><h5>DEC-CURRENT-010 权威数据</h5><p>SQLite正式对象、不可变作者原文和正文版本是权威源；FTS、LanceDB、图谱、Wiki和摘要是可重建投影。核心对象与查询必须携带 <code>owner_id</code> 和 <code>book_id</code>。</p><h5>DEC-CURRENT-011 数据安全</h5><p>迁移只向前新增，已合并迁移不可修改。普通删除为归档；作者数据永久删除仍需影响预览、输入 <code>YES</code> 与二次确认。API Key只从环境变量读取。</p><h5>DEC-CURRENT-012 当前仓库范围</h5><p>文档中心只收录白名单中的当前正式文档和项目Skill。源码必须能由当前入口、任务或恢复机制到达；精简必须经过零引用、测试与恢复边界检查。</p><h5>DEC-CURRENT-013 长篇质量</h5><p>质量机制同时降低系统性失败并保护创造性。模板、节拍、文风和岗位经验不能硬编码成公式。事实、文学、体验审查各自独立；一致性提升不得抵消原创性、合理惊喜、人物可辨识度、情绪力度和整体阅读质量。</p><h5>DEC-CURRENT-014 文档自动同步</h5><p><code>PROJECT_HANDBOOK.md</code> 是固定入口；<code>scripts/sync-project-docs.mjs</code> 自动生成可阅读全文的当前文档目录与网页。桌面打开、开发结算、提交和合并都会刷新并校验白名单。</p><h5>DEC-CURRENT-015 当前语义与恢复边界</h5><p>当前正式生产流程、上下文包和评测脚本不得依赖对话推进、聊天摘要或会话记忆。独立灵感只允许写入隔离的讨论域，不能调用确认、融合、正文生成、正史或结算写入；未被作者摘录并绑定业务对象的讨论内容不得进入生产检索。已合并迁移、历史任务类型拦截、旧书数据升级适配和来源字段可以为恢复与兼容保留，但不得进入新生产任务路由。附件正式对象统一为 <code>author_attachments</code>，旧库通过前向迁移原位升级并保留全部原件。每次完成语义清理必须通过全量工程门禁，并创建可定位、可回退的Git结算提交。</p><h5>DEC-CURRENT-016 规划记录可见性与流程链验收</h5><p>活动事件确认后，工作流接口必须返回真实的当前事件版本引用。事件或卷结算可以清空活动指针，但不得让已确认的规划、事件大纲和章纲从作者界面消失；历史规划以只读方式持续可查。正文流程验收必须逐章证明“卷纲版本→事件链版本→事件大纲版本→章纲版本→正文版本”的真实绑定，不能只凭正文数量判断通过。与当前对象链冲突的旧审计口径作废。</p><h5>DEC-CURRENT-017 当前项目完整合订版</h5><p>当前文档中心除34份独立现行文档外，必须自动生成一份按六个目录合并的 docs/PROJECT_REFERENCE_BUNDLE.md。合订版完整收录白名单内容、标注原始路径与内容哈希，并提供一页阅读和复制全文入口；每次文档同步、开发结算和Git提交都自动重建，不收录历史版本、临时报告或白名单外资料。</p><h5>DEC-CURRENT-018 结算状态与版本变化分离</h5><p>事件结算和卷结算只推进业务状态并锁定历史，不代表卷纲或事件内容版本发生变化。进行中的章纲按当前活动卷纲与事件版本判断有效性；已完成或已归档章纲按生成时锁定的卷纲与事件版本判断历史完整性。正常结算不得把历史规划标记为“上层已变化”；只有锁定来源缺失或对象被明确标为过期时才显示异常。</p><h5>DEC-CURRENT-019 统一创作台与独立灵感</h5><p>应用启动后直接进入统一创作台，不再设置书架首页或“返回书架”。左栏是纯书籍栏，只显示新建书籍、可滚动书籍列表、归档书籍和当前书归档操作；点击左侧只切换当前书。顶部是完整功能栏，统一显示信息、设定、分卷、规划、章纲、正文、资料库、取名、团队、任务、灵感和设置；点击顶部只切换中心功能页面。团队页显示全部11名成员的真实状态、当前上下文摘要和输出摘要；任务页显示任务进度与恢复入口。图谱和资料库合并为“资料库”。右侧常驻成员栏、信号图标、卷章统计条和横向导航滚动条退出当前界面。</p><p>默认视觉采用iOS式浅色玻璃工作台：冷白与蓝灰画布、系统字体、半透明材质、细分隔线、蓝色活动态、柔和阴影和大圆角。旧浅绿色画布、绿色强调和纸张式密集排版退出默认界面；深色主题继续保留同一结构与层次。</p><p>独立灵感成员是创作成员的讨论分身，不增加11名生产团队人数。它们可以检索当前书已确认资料，为作者讨论和启发；不能创建或修改设定、卷纲、事件、章纲、正文、正史或结算。讨论结果只有经作者主动摘录、选择强度并绑定目标对象后，才以作者原话进入生产工作流。</p><h5>DEC-CURRENT-020 功能名称与稳定数据关联</h5><p>作者可见功能名固定为：信息、设定、分卷、规划、章纲、正文、资料库、取名、团队、任务、灵感、设置。Web、API和测试必须从 Contracts 的同一名称合同读取，不得各自维护第二份名称表。</p><p>显示名变化不改数据库稳定关联键：framework 对应 book_profile，basic 对应 setting，master 对应 volume_plan，event 对应 event，chapter 对应 chapter_outline，manuscript 对应 manuscript。表名、路由、枚举、迁移和已有对象ID继续保持稳定，避免破坏旧书、任务恢复和来源追踪。</p><p>历史任务、上下文包、模型调用结果、讨论记录与检索审计中的旧文字属于不可变来源证据，不做批量回写；作者展示层必须把旧称只读转换为当前名称。新界面、接口提示、模型任务说明和当前文档只使用当前名称。每次开发结算继续自动重建并校验桌面文档中心。</p><h5>DEC-CURRENT-021 书籍封面栏与测试标题展示</h5><p>左侧书籍栏固定为只容纳一张封面的紧凑宽度，使用可见滚动条独立纵向滚动和单列固定84×118像素竖版封面。在左侧书籍栏中，书名只显示在封面内，封面右侧不再重复；封面下只显示当前状态或测试标签。中心“信息”页保留一次干净书名作为开书资料标题。新建书籍和修改书名统一最多15个Unicode字符；封面标题按1—4字、5—7字、8—10字、11—15字四档递减字号，15字以内完整显示。书籍切换仍只改变当前书，不改变顶部当前功能。封面视觉由稳定书籍ID确定，不新增图片文件或外部依赖。已有超过15字的标题不做破坏性回写，兼容封面显示为14字加省略号，按钮可访问名称保留完整标题。</p><p>自动端到端验收写入标题的内部运行键属于可追溯测试证据，不是作者内容，也不是脱敏数据。作者展示层只对项目已知测试书名转换为干净中文书名和“流程测试/验收测试”标签；SQLite原始标题、任务、上下文和测试证据不批量回写。普通作者书名必须逐字保留，不使用广泛的英文尾缀裁剪规则。</p><h5>DEC-CURRENT-022 顶部摘要去重</h5><p>功能栏直接占据主界面最上方，不另设“当前书籍/当前功能”命令摘要条，也不显示重复的当前功能圆点标签。当前书通过左侧活动封面辨认，书名只在封面内和中心“信息”页资料标题各显示一次；其他中心功能不额外重复书名。窄屏打开书籍栏的按钮并入功能栏。该决定只改变展示结构，不修改数据库键、书籍关联、当前功能状态或作者数据。</p><hr><h3>当前开发与验收计划</h3><blockquote>当前源文件：<code>docs/DEVELOPMENT_ROADMAP.md</code> · 指纹：<code>0e1133a65b12</code></blockquote><h4>当前开发与验收计划</h4><h5>状态说明</h5><p>本路线只记录当前版本。完成以代码、迁移、测试、构建和本地运行证据为准；真实模型文学质量另按E3/E4积累。</p><h5>P1 仓库与文档中心</h5><ul><li>文档使用显式当前白名单，卡片可在同一页面阅读全文；</li><li>桌面打开、开发结算、提交和合并自动重新生成并校验；</li><li>文档显示源路径、内容指纹和生成时间；</li><li>运行时可达性审计覆盖Contracts、API、Worker和Web；</li><li>源码、测试和文档必须对应当前产品入口、任务或恢复机制。</li><li>当前运行时语义不得宣传或调用退出的对话式流程；恢复兼容代码必须可识别、不可被新任务路由触发。</li><li>每次清理完成后创建Git结算提交，作为可审计、可恢复的代码基线。</li></ul><p>状态：已实现；当前语义清理、文档刷新和Git结算后重新验收。</p><h5>P2 开书与设定对象化</h5><ul><li>完整开书信息与作者原话入库；</li><li>原子创建书籍、团队、模型绑定、预算和设定工作区；</li><li>设定项三席独立提案、作者选择/融合/修订和确认；</li><li>作者附件绑定业务对象。</li></ul><p>状态：已实现并有自动测试。</p><h5>P3 分卷</h5><ul><li>专用卷计划版本链、候选、活动指针和影响预览；</li><li>大白话节奏模板、作者卷想法、两编剧独立提案和主编融合；</li><li>上一卷真实结算与当前状态进入上下文。</li></ul><p>状态：已实现并有自动测试。</p><h5>P4 事件链与事件大纲</h5><ul><li>事件顺序、因果衔接、卷任务覆盖、移动/插入/拆分/合并；</li><li>当前事件完整大纲、两编剧独立生成、作者融合和确认；</li><li>活动卷纲版本约束与过期处理。</li></ul><p>状态：已实现并有自动测试。</p><h5>P5 当前事件章纲</h5><ul><li>章数/字数评估、完整事件章链、单章详细字段；</li><li>章纲引用活动卷纲、事件链、事件大纲和作者输入；</li><li>越级调用和版本冲突门禁。</li></ul><p>状态：已实现并有自动测试。</p><h5>P6 单章正文与三席审查</h5><ul><li>单一活动写手、冻结工单、完整正文版本；</li><li>事实/文学/体验三异模型独立报告；</li><li>作者编辑、定点修订、定稿和不可变版本。</li></ul><p>状态：基础生产链、自动测试和本地确定性双事件20章纵向复测通过；真实套餐模型E3文学质量复测待执行。</p><h5>P7 章节、事件和卷结算</h5><ul><li>章节事实、人物状态、关系、时间、伏笔和摘要更新；</li><li>事件/卷计划与实际差异、遗留问题和下一层承接；</li><li>投影outbox与可恢复重建。</li></ul><p>状态：已实现并有自动测试。</p><h5>P8 已有作品续写与反向拆解</h5><ul><li>预览、章节确认、不可变导入、分析、来源和候选确认；</li><li>反向结果进入设定、卷、事件和章纲对象。</li></ul><p>状态：保留并通过相关自动测试；真实大文件实机复测待执行。</p><h5>P9 UI与运行验收</h5><ul><li>左栏只显示书籍；顶部 和修改输入默认折叠。</p><p>灵感必须证明：只读本书已确认资料；不能修改任何正式对象；未摘录内容不进入生产上下文；作者摘录后只进入指定对象；跨书污染为0。</p><p>活动事件期间，工作流接口必须返回真实的事件版本引用。事件或卷结算后，已确认事件链、事件大纲和章纲必须继续在原页面以只读历史显示，且不能暴露会修改历史的操作。每一章还必须能从正文流水线追溯到对应的事件章纲正式版本；只有正文数量而没有逐级版本绑定，不得判定通过。</p><p>事件结算和卷结算后，章纲序列必须保持 <code>completed + valid</code>，并显示“结算版本已锁定”；正常状态推进不得显示“上层已变化，需重建”。测试必须同时覆盖事件结算后和卷结算后两种状态。</p><h5>5. 上下文与检索门禁</h5><ul><li>开书/设定不读取其他书、未摘录灵感或模型猜测。</li><li>卷、事件、章纲和正文都能追溯上层活动版本。</li><li>当前对象完整注入，上层信息无损压缩，硬约束不丢失。</li><li>混合检索覆盖结构化、FTS、向量、关系、时间/因果与原文回查。</li><li>摘要错误不能覆盖正式事实。</li><li>对抗查询、别名、否定、时间冲突、旧版本和跨书测试通过。</li></ul><h5>6. Agent与模型门禁</h5><ul><li>界面显示11名创作成员，岗位和模型来源真实。</li><li>两位编剧独立阶段互不可见；主编后置融合。</li><li>单一活动写手写正文。</li><li>事实、文学、体验使用三个独立且不同于写手的模型，互不读取报告。</li><li>模型不可用、重复来源或结果未知时明确降级/阻断。</li><li>每次调用有上下文包、预算、任务、模型快照和结果证据。</li></ul><h5>7. 创造性与质量门禁</h5><p>重要的检索、上下文、提示词、生成或审查改动必须与旧流程或弱治理基线做非劣效对照。至少评估原创性、合理惊喜、人物可辨识度、情绪力度、节奏、检索锚定和整体阅读质量。一致性提高不能抵消核心创作维度下降。</p><p>证据等级：E0规格；E1机制；E2确定性工程；E3独立盲评/真实模型；E4真实长篇纵向效果。当前工程测试只能支持E2声明。</p><h5>8. 续写验收</h5><p>导入预览不写正式章节；确认后原文不可变；分析结果带来源且为候选；不能补造历史审查；续写重新进入卷—事件流程；旧全文按需检索而非每次全量注入。</p><h5>9. 文档验收</h5><p>文档中心只包含显式白名单中的当前正式文档和当前Skill；所有现行文档必须相互一致，并且能够在同一页面阅读全文。</p><p>文档中心必须额外生成按目录汇总的单页合订版，完整收录白名单中的全部资料、原始路径和内容哈希，并提供复制全文入口。合订版与独立文档必须由同一次同步产生且校验一致。</p><h5>10. 重大缺陷</h5><p>出现跨书污染、作者原文/正文覆盖、未确认候选入正史、任务重复扣费、结果未知自动重发、模型来源伪造、迁移不可升级、服务无法启动或主流程阻塞，均不得验收。</p><h5>11. 当前E2纵向基线</h5><p>当前确定性工程基线必须以一部全新修仙测试书贯通开书、9个必要设定项、卷纲、两个事件、20份章纲、20章正文、60份独立审查报告、20次章节结算、2次事件结算和1次卷结算。正文必须包含当前书人物与设定，且不得泄漏其他测试夹具。该基线只证明对象链、上下文和恢复机制，不冒充真实套餐模型文学质量的E3证据。</p><hr><h3>当前功能覆盖矩阵</h3><blockquote>当前源文件：<code>docs/COVERAGE_MATRIX.md</code> · 指纹：<code>35ce3f7f54bd</code></blockquote><h4>当前功能覆盖矩阵</h4><div class="table-scroll"><table><thead><tr><th>能力</th><th>权威规格</th><th>主要实现</th><th>主要测试</th></tr></thead><tbody><tr><td>开书与定位</td><td>PRODUCT、WORKFLOW V2</td><td>books/onboarding/positioning</td><td>positioning-onboarding、api-flow</td></tr><tr><td>设定对象协作</td><td>WORKFLOW V2、AGENT SYSTEM</td><td>setting workspace/collaboration commands</td><td>setting-colla 、Agent、生成、审查、结算或长篇质量的重要变更使用本规范。纯文案、低风险样式和明确机械修复不启动完整审查。</p><h5>2. 权威顺序</h5><p>作者最新决定 → 项目章程与开发规则 → 当前生效决定 → 当前规格 → 代码和证据。Git只提供追溯，不能覆盖当前规格。</p><h5>3. 设计记录</h5><p>每项重大设计创建唯一 <code>design_review_id</code>，记录：</p><ul><li>问题、可观察症状和真实根因；</li><li>已确认事实、推断、作者偏好和未知；</li><li>适用Skill名称与文件哈希；</li><li>至少一个最强替代方案及取舍；</li><li>机制、反例、指标、证据等级和停止条件；</li><li>影响文件、迁移、回滚和复核人。</li></ul><h5>4. 两轮审查</h5><p>第一轮检查正确性、安全、恢复、跨书隔离、版本和来源。第二轮检查创造性、人物生命力、合理惊喜、情绪力度、整体阅读质量和作者控制权。第一轮提升不能抵消第二轮下降。</p><h5>5. 上下文和RAG变更</h5><p>必须验证任务矩阵、其他书排除、活动版本、作者原话、硬约束位置、来源回查、预算、降级和投影可重建。不能用“增加向量、多Agent或更大上下文”代替根因证据。</p><h5>6. 创作机制变更</h5><p>相对现行流程或弱治理基线做非劣效对照。局部修改使用多样本对照；全链路修改使用跨题材、跨阶段和纵向盲评。评分表不得直接成为正文提示词。</p><h5>7. 证据等级</h5><p>E0规格，E1机制存在，E2确定性工程，E3独立金标/真实模型盲评，E4真实长篇纵向效果。不得用短流程或固定同义词测试声明E3/E4。</p><h5>8. 精简审计</h5><p>精简前检查启动入口、动态引用、路由、Worker任务、迁移、恢复、测试和作者数据。只有当前产品不需要且运行时零引用的代码或资料才能移出工作树。已合并迁移、作者原件和不可变正文不参与普通精简。</p><h5>9. 当前审计基线</h5><p><code>DR-20260810-UNIFIED-DESK-20</code>：当前工作流为开书—设定—卷—事件链—事件大纲—章纲—正文—三级结算；统一创作台和独立灵感只围绕这些对象运行。开发结算必须通过运行时可达性、类型、全量测试、四端构建、真实本地服务和文档同步，并以双事件20章确定性纵向流程作为E2基线。真实套餐模型20章文学质量仍需独立E3证据，不能由自动测试冒充。</p><h5>10. DR-20260810-SEMANTIC-CLEANUP</h5><ul><li>问题与根因：当前对象化工作流已经替代对话式入口，但Worker能力声明、少量展示工具、旧评测脚本、上下文策略默认值和附件物理表名仍携带旧语义；根因是功能迁移后缺少一次跨入口、路由、数据、测试和恢复边界的统一收口。</li><li>已确认事实：当前主流程是对象化协作；作者附件仍是有效能力；已合并迁移不可改；历史任务必须被明确拒绝而不是重新执行；旧书升级适配必须保留；Git需要承担后期恢复点。</li><li>作者偏好：清理代码语义残留，仓库只表达当前功能，同时保留Git结算便于恢复。</li><li>未知：真实存量库中的旧附件数量与真实模型长篇效果，不用推断替代迁移测试和E3/E4验收。</li><li>适用Skill：<code>wenmi-longform-quality</code>；SHA-256 <code>5bfe9c079103ba048eddd7c257abd35800e8f26f9461ad0bd84f3424b562b7c8</code>。</li><li>选择机制：删除零引用旧运行时和旧评测入口；当前展示只保留通用净化；上下文策略升级到对象化版本；新增0042前向迁移，将旧附件表和字段原位改为作者附件语义，并升级规划输入链接类型；保留迁移、历史任务拒绝和旧书升级适配。</li><li>最强替代方案：新建附件表、复制数据、删除旧表。该方案命名更直接，但复制与删除扩大数据风险，且不优于SQLite原位重命名，因此放弃。</li><li>第一轮审查：验证迁移保留原件与来源、旧表退出、链接同步升级、跨书/任务/版本边界不变；运行迁移、类型、全量测试、构建、可达性与文档校验。</li><li>第二轮审查：不改11名成员、创作提示词、卷—事件—章纲约束和软模板；清理只减少错误上下文与错误能力暗示，不增加创作公式。</li><li>证据与停止条件：E2工程证据全部通过且Git工作树完成结算才可结束；出现数据丢失、旧任务被重新执行、跨书污染、当前附件无法进入卷纲上下文或任一门禁失败立即停止。</li><li>回滚：代码和文档可回退到本次结算前提交；0042只做保数据重命名，已升级数据库不倒退迁移，必要时由后续前向迁移修正。</li></ul><h5>11. DR-20260810-WORKFLOW-VISIBILITY</h5><ul><li>问题与根因：实际十章书籍具备卷纲、事件链、事件大纲和事件章纲正式记录，但结算后活动事件指针被清空，前端又只读取活动事件并只显示待处理章纲；卷计划列表还只选择活动状态，因此作者看到“规划、章纲为空”。服务端工作流同时把活动事件引用固定返回为空，放大了问题。旧数据审计只统计正文数量，不能证明逐级规划链存在。 进一步从新书复测发现，旧十章脚本仍调用已退役的对话消息接口，本地确定性模型也缺少设定对象融合落库合同；两者都会让“测试已通过”的结论失真。</li><li>已确认事实：目标书籍存在1个已确认卷纲、1个已结算事件、1个已完成章链、10份已结算事件章纲和10章定稿正文；每章流水线均能通过正式制品版本追溯到对应事件章纲。缺陷属于工作流引用与历史可见性，不是规划数据丢失。</li><li>作者偏好：从头核对流程；规划和章纲不得在正文完成后消失；项目资料需要可整页复制。</li><li>未知：真实套餐模型的十章文学质量仍需独立E3证据，不由本次确定性数据与界面修复代替。</li><li>适用Skill：wenmi-longform-quality；SHA-256 5bfe9c079103ba048eddd7c257abd35800e8f26f9461ad0bd84f3424b562b7c8。</li><li>选择机制：工作流返回真实活动事件版本；活动对象不存在时按当前卷最新已完成事件加载只读历史；事件页和章纲页区分可编辑活动态与只读完成态；重写当前数据审计，逐级检查开书、设定、卷纲、事件链、事件大纲、章纲、正文及结算绑定；文档同步额外生成单页合订版。</li><li>最强替代方案：结算时继续保留活动指针。该方案会混淆“已完成”与“仍可修改”，使误操作和重复结算风险上升，因此选择清空活动指针但保留只读历史。</li><li>第一轮审查：验证活动引用、完成态加载、禁止历史修改、每章版本绑定、数据库完整性、跨书作用域、类型、测试、构建和文档同步。</li><li>第二轮审查：不改变11名成员、提示词、模板或创作自由；只恢复作者对真实规划链的可见性和验证能力，不把审计字段注入正文生成。</li><li>证据与停止条件：目标书逐级数据审计、组件回归、全量工程门禁和真实启动均通过才可结算；任一规划层缺失、正文无法追溯章纲、历史页可误修改或其他书数据混入立即停止。</li><li>回滚：前后端和文档可通过本次Git结算提交回退；不修改或删除正式作者数据和既有迁移。</li></ul><h5>12. DR-20260810-SETTLED-HISTORY-VALIDITY</h5><ul><li>问题与根因：刚完成的测试书没有任何作者修改，但已结算事件的章纲页显示“上层已变化，需重建”。章纲有效性查询只接受状态为活动的事件、卷纲及其版本；事件结算和卷结算正常推进状态后，活动快照查询返回空，于是把业务状态推进误判为内容换版。</li><li>已确认事实：测试书的卷纲版本、事件版本、事件章链、10份章纲和10章正文绑定均存在；事件章链状态为已完成，来源版本未改变且没有被标记过期。缺陷只在有效性解释与界面文案，不是作者修改或数据丢失。</li><li>作者偏好：没有修改就不得提示重建；提示必须让作者能区分正常结算、真实上游换版和历史来源异常。</li><li>未知：永久删除或未来归档策略是否允许物理移除来源版本；当前权威规则不允许普通流程删除正式来源，因此本次按来源存在性校验。</li><li>适用Skill：<code>wenmi-longform-quality</code>；SHA-256 <code>5bfe9c079103ba048eddd7c257abd35800e8f26f9461ad0bd84f3424b562b7c8</code>。</li><li>选择机制：活动章纲继续对比当前活动快照；已完成或已归档章纲改为按自身锁定的事件版本和卷纲版本查询历史快照。锁定来源存在且对象未明确过期时返回有效，并显示“结算版本已锁定”。</li><li>最强替代方案：只在前端隐藏警告。该方案会掩盖服务端仍返回错误有效性，其他客户端和后续验收仍会误判，因此否决。</li><li>第一轮审查：覆盖事件结算后、卷结算后、活动态和真实过期态；历史查询继续强制 <code>owner_id + book_id + event_id + version_id</code>，不放宽跨书隔离。</li><li>第二轮审查：不 it结算提交回退前端与规格；不修改数据库迁移和作者数据。</li></ul><h5>DR-20260810-WORKSPACE-LABELS 功能名称统一</h5><ul><li>已确认事实：作者要求12个功能入口使用信息、设定、分卷、规划、章纲、正文、资料库、取名、团队、任务、灵感、设置；数据库已有稳定surface、对象ID、任务来源和不可变审计文字。</li><li>作者偏好：前端、后端提示、数据库关联和当前文档必须一致，每次开发结算自动更新文档中心。</li><li>推断：把显示名直接改成数据库枚举会造成无收益迁移并威胁旧书恢复；显示层与稳定键分离更安全。</li><li>方案比较：方案一批量改表名、枚举和历史文字，风险高且会破坏来源证据；方案二由Contracts提供单一显示名合同，保持稳定键并在展示层转换旧文字。选择方案二。</li><li>第一轮审查：检查12个功能顺序、Web/API共享依赖、author input surface映射和界面点击测试。</li><li>第二轮审查：检查旧数据只读展示、全量类型/测试/构建、真实启动和文档中心同步；任一失败即停止结算。</li><li>回滚：回退本次Git提交即可恢复旧显示；数据库无结构和数据回写，因此无需数据回滚。</li></ul><hr><h2>五、Codex开发协作与当前状态</h2><h3>文秘写作项目总入口</h3><blockquote>当前源文件：<code>PROJECT_HANDBOOK.md</code> · 指纹：<code>51a50a6ef77e</code></blockquote><h4>文秘写作项目总入口</h4><p>这是老板和 Codex 查看当前项目规则的固定入口，只指向当前生效文档和当前Skill。</p><h5>当前产品主流程</h5><pre class="code-block"><code data-language="text">开书信息
