登录、永久删除作者数据、生产恢复和不可逆架构迁移才停下确认。</p><h5>2. 最小阅读</h5><p>不要为每个任务通读项目文档。</p><ul><li>普通问答、状态说明：按问题查证，不强制读文档。</li><li>一次新的开发任务：先读一次 <code>HANDOFF.md</code>；同一任务后续不重复读。</li><li>单页 UI、文案、小修：相关页面代码 + <code>.agents/skills/wenmi-ui-ux/SKILL.md</code>；需要确认产品语义时只查对应规格小节。</li><li>工作流、上下文、检索、生成审校或长篇质量：相关代码 + <code>.agents/skills/wenmi-longform-quality/SKILL.md</code>；由 Skill 路由到一份必要参考，不全量读取。</li><li>数据/API/部署：只加读 <code>docs/DATA_MODEL.md</code>、<code>docs/API.md</code> 或 <code>docs/DEPLOY.md</code> 中受影响部分。</li><li><code>docs/DECISIONS.md</code> 是短索引，不再累积事故日志；历史决定按需从 Git 查。</li></ul><h5>3. 当前产品底线</h5><p>主流程：开书信息 → 非剧情设定 → 分卷方向 → 当前卷事件链 → 当前事件大纲 → 完整章链与近期详细章纲 → 单章正文 → 章节/事件/卷结算 → 下一卷。</p><p>规划描述未来，结算只记录正文实际发生；上游确认版本变化时，下游候选失效或重编译。专业结构方法只供后台设计，普通作者只看本书的白话路线。UI 和布局处于持续迭代期，没有固定卡片数量、固定页面结构或不可改视觉风格；默认手机优先、少填少选、逐层推进。</p><h5>4. 基础安全</h5><p>以下是始终保留的硬门禁：</p><ul><li>业务身份来自已验证会话；核心查询和写入携带 <code>owner_id</code>、<code>book_id</code>，跨书污染必须为零。</li><li>正文采用不可变完整版本，修改产生新版本；正式作者原文、结算和已合并迁移不得被普通清理覆盖。</li><li>API Key 只来自环境变量，不进入数据库、日志、上下文、备份、导出或 Git。</li><li>普通删除优先归档；永久删除作者数据必须有影响预览、<code>YES</code> 和二次确认。</li><li>不保存或展示模型思维链；同一模型不得伪装成异模型独立复核。</li><li>外部写入、付费、生产恢复和破坏性操作严格限定到用户授权范围。</li></ul><h5>5. 开发方式</h5><p>先看真实页面、状态和代码，再改最小闭环。产品尚未定型，UI、交互和功能规格都允许继续调整；不要让旧文档或 Skill 阻止合理迭代。发现规格与老板新决定冲突时，直接更新当前规格并把旧内容移到历史归档。</p><p>只在以下高风险变化建立 <code>design_review_id</code>：权限/账号隔离、作者数据不可变性、数据库语义、跨服务恢复、模型调用计费、ContextCompiler 权威来源或不可逆架构。普通 UI、文案、组件重排、局部接口兼容和明确 BUG 修复不做两轮设计审计。</p><p>编辑文件使用 <code>apply_patch</code>；若工具本身故障，先留可恢复副本，再使用可审计的固定路径替代方式。保留用户已有改动，不用 <code>git reset --hard</code> 或 <code>git checkout --</code> 覆盖。</p><h5>6. 按风险验证</h5><ul><li>文档/Skill：Skill 结构校验（如适用）+ <code>node scripts/sync-project-docs.mjs</code> + <code>--check</code>。</li><li>单页 UI/样式：相关组件测试（若有）+ Web 类型检查 + Web 构建；有浏览器环境时检查 360/390/430px 与桌面。</li><li>局部业务逻辑/API：受影响测试 + 对应包类型检查/构建。</li><li>数据迁移、权限隔离、跨服务恢复、核心工作流：全量 <code>npm run verify</code>，再做相关迁移/恢复/运行测试。</li></ul><p>测试应与风险相称。不要把200章文学验收、全量迁移、四端构建或生产真机检查强加给普通 UI 微调；也不要用字段存在或夹具通过冒充真实文学质量。</p><h5>7. 部署</h5><ul><li>Web 静态资源单独发布：在暂存目录构建，保留旧哈希资源，原子切换入口并验证首页、资源、登录和核心页面；不重启 API/Worker，因此不要求等待任务清零。</li><li>API/Worker/迁移发布：向后兼容；重启前在途任务连续30秒为零并立即复核，逐服务切换、看日志、保留回滚版本。</li><li>不取消、暂停或改写作者任务来制造部署窗口。生产异常优先回滚，不边猜边改数据。</li></ul><h5>8. 文档与提交</h5><p>只有当前规格、规则、Skill 或状态改变时才运行文档同步；纯代码小修若文档语义未变，无需改文档。逻辑完整的一批改动再提交；推送和生产部署只在已授权且通道可用时进行。</p><hr><h3>文秘写作当前知识地图</h3><blockquote>当前源文件：<code>KNOWLEDGE.md</code> · 指纹：<code>7ad7f7c630ef</code></blockquote><h4>文秘写作当前知识地图</h4><h5>产品主线</h5><p>文秘写作是使用统一账号体系、支持本机测试和后续公网部署的长篇小说AI协作平台。作者始终拥有最终决定权，AI通过明确对象提供独立方案、融合候选、正文和审查报告，不使用聊天推动流程。</p><p>主流程：开书 → 非剧情设定 → 卷方向 → 事件链 → 事件大纲 → 完整章链与近期详细章纲 → 单章正文 → 章/事件/卷结算 → 下一卷。</p><p>已有作品可导入并反向拆解；作者原文保持不变，派生分析带来源并进入同一卷—事件工作流。</p><h5>权威对象</h5><ul><li>开书活动版：作者填写的全部开书信息和明确偏好。</li><li>设定活动版：世界、力量、势力、人物、规则等已确认设定。</li><li><code>volume_plans</code>：活动卷纲与不可变候选版本。</li><li><code>story_events</code>：卷内事件链、事件卡和事件大纲版本。</li><li><code>event_chapter_outlines</code>：当前事件章链与单章详细章纲。</li><li><code>manuscript_versions</code>：不可变正文版本。</li><li>章节、事件、卷结算：正文实际发生内容的正式聚合。</li><li>正史事实、实体、时间线和关系：由定稿正文与确认资料产生。</li></ul><p>SQLite正式对象与不可变原文是权威源。摘要、图谱、Wiki、FTS和LanceDB只作导航或可重建投影。</p><h5>AI协作</h5><p>当前产品配置为14名创作成员；人数、岗位和界面呈现可由老板后续决定调整。卷纲与重要事件由主编组织两位异模型编剧独立提案后融合；章纲在当前事件约束下拆分；正文由单一活动写手完成；事实、文学、体验三席使用三异模型独立审查。小文秘书只处理确定性工具、导航和安全回执。</p><h5>上下文原则</h5><ul><li>开书和设定阶段完整保留作者输入。</li><li>下游按硬事实、当前任务、软参考和开放区编译资料；必要硬资料不静默截断。</li><li>当前对象使用完整内容：当前卷、当前事件链、当前事件大纲或当前章纲按任务选择完整注入。</li><li>历史只按触发实体、规则、时间、因果、伏笔和人物声音回查。</li><li>其他书、聊天、过期版本、无关候选和无依据猜测始终排除。</li></ul><h5>当前入口</h5><ul><li>产品与功能：<code>docs/PRODUCT.md</code></li><li>完整交互：<code>docs/CREATION_WORKFLOW_V2_DESIGN.md</code></li><li>AI成员：<code>docs/AGENT_SYSTEM.md</code></li><li>上下文：<code>docs/MEMORY.md</code></li><li>检索：<code>docs/HYBRID_RAG_DESIGN.md</code></li><li>质量：<code>docs/LONGFORM_QUALITY.md</code></li><li>API：<code>docs/API.md</code></li><li>验收：<code>docs/ACCEPTANCE.md</code></li><li>当前任务：<code>TASKS.md</code></li><li>UI/UX：<code>.agents/skills/wenmi-ui-ux/SKILL.md</code></li><li>长篇质量：<code>.agents/skills/wenmi-longform-quality/SKILL.md</code></li></ul><p>当前文档中心、产品检索和Codex默认上下文只读取显式白名单与当前活动对象。</p><h5>账号与隔离</h5><p>本机也必须先登录，不保留固定本机用户。当前使用邮箱加密码，首个账号为管理员。登录会话确定 <code>owner_id</code>，所有书籍与创作数据严格按账号隔离；管理员能管理账号状态，但普通创作接口仍只读取当前登录用户自己的书籍。手机号和微信以后绑定到同一用户，不另建创作身份。 本地确定性生成只服务E1/E2工程测试，不能在正常作者流程冒充设定、规划、章纲、正文、审查、灵感或续写成员。真实长篇按20、50、100、200章逐段验收；前一阶段出现模板复用、无场景正文、人物工具化、内部说明或事实漂移时停止扩大。</p><hr><h3>当前任务</h3><blockquote>当前源文件：<code>TASKS.md</code> · 指纹：<code>51fd0f22da22</code></blockquote><h4>当前任务</h4><blockquote>只记录现在要做的事。旧的200章验收、事故修复、测试数字和发布流水保留在 Git 基线 <code>e8517d9</code>，默认不读取。</blockquote><h5>P0：UI/UX整体重设计</h5><ul><li>[ ] 基于手机端作者旅程确定新的信息架构和应用壳，不受旧12入口、固定封面、卡片和iOS玻璃风格约束。</li><li>[ ] 建立共享设计token、页面状态模型、主操作、错误恢复和响应式规范。</li><li>[ ] 按应用壳 → 开书 → 设定 → 分卷 → 事件/章纲 → 正文顺序逐页实施和浏览器走查。</li><li>[ ] 每页覆盖空、编辑、AI工作中、待决定、完成、失败/恢复；手机检查360/390/430px。</li></ul><h5>P0：核心流程稳定</h5><ul><li>[ ] 持续排查真实用户的设定整理失败、前置质检状态和第一卷规划恢复路径；不因UI重构放松数据与版本门禁。</li><li>[ ] 确保活动设定、卷方向、事件链、章纲和正文版本可以从页面直接理解和继续。</li><li>[ ] 普通作者响应保持白话洁净，管理员审计保持完整。</li></ul><h5>P1：真实内容质量</h5><ul><li>[ ] 首卷前500字、黄金三章、持续追读和重大高潮继续做真实题材样本阅读，不把工程字段当文学质量。</li><li>[ ] 20章验收只在老板重新明确要求时继续；50/100/200章不作为当前开发任务。</li></ul><h5>本轮规则精简（2026-08-21）</h5><ul><li>[x] 精简AGENTS、HANDOFF、当前决定、验收、设计治理和分层方案入口。</li><li>[x] 长篇质量Skill改成三份按需参考，旧九文件原文归档。</li><li>[x] 创建 <code>wenmi-ui-ux</code> Skill，并研究GitHub写作产品交互模式。</li><li>[x] 安装OpenAI官方 <code>frontend-app-builder</code> 供后续大规模视觉重设计按需使用。</li><li>[x] Skill结构校验、文档同步、当前引用扫描和定向回归通过；Git结算见本次提交。</li></ul><h5>当前基线</h5><p>最近已知本地全量基线为184个测试文件、779项通过，最新迁移为0062。后续验证按 <code>docs/ACCEPTANCE.md</code> 风险矩阵执行；只有核心工作流、数据、权限或恢复变化才重跑完整门禁。</p><hr><h2>六、项目 Skills</h2><h3>上下文与混合检索</h3><blockquote>当前源文件：<code>.agents/skills/wenmi-longform-quality/references/context-and-rag.md</code> · 指纹：<code>e29d20ce0982</code></blockquote><h4>上下文与混合检索</h4><p>仅在修改 ContextCompiler、资料包、检索、切片、来源或上下文预算时读取。</p><h5>任务包顺序</h5><ol><li>身份：owner、book、任务对象、活动版本。</li><li>硬事实：确认开书/设定、不可变正文、结算、明确禁止项。</li><li>当前任务：上层责任、输出对象、停止条件。</li><li>连续性：上一实际结果、最近正文、活动线程、相关人物/关系/资源/时间因果。</li><li>作者输入：绑定当前对象的必须、强偏好、灵感和问题。</li><li>软参考与开放区：风格、重点表达、内部方法软工具，以及AI可自由决定的部分。</li><li>来源和预算：每项来源/版本、入选理由、排除理由、字符/token预算。</li></ol><p>硬事实和当前任务优先；放不下时应缩小任务、分阶段或回查正式源，不能静默截断核心材料。</p><h5>明确排除</h5><ul><li>其他书或其他owner；</li><li>未确认方案、过期版本、失败草稿；</li><li>未由作者摘录到正式对象的独立灵感；</li><li>全库无差别全文、全部审查报告、全部结构方法；</li><li>AI推断出的事实、无来源Wiki、仅凭题材常识补出的数值；</li><li>思维链、工程检查表和普通作者不需要的内部ID。</li></ul><h5>检索组合</h5><p>先结构化直达当前对象与活动版本，再按需组合全文、向量、实体关系、时间/因果和原文回查。向量只负责找候选，不能单独判定权威。摘要只导航；事实冲突回查确认对象、不可变正文或实际结算。</p><p>同一事实的多个投影应按稳定来源键去重，而不是删掉来源。无可靠答案时返回未知或发起补设定，不从相似片段猜测。</p><h5>长篇连续性</h5><p>线程至少区分计划、已启动、推进、搁置、兑现和废止；状态只能由正文/结算改变。人物、关系、资源、规则和时间线保留历史，不用最新摘要覆盖旧状态。远期只保留责任和开放问题，近期才读取详细场景。</p><h5>诊断证据</h5><p>排查时保存或查看：任务快照、ContextPack清单、来源版本、检索查询/候选/选中理由、预算、模型调用结果和实际写入。先确认错误信息是没有检索到、检索错、排序错、来源过期、提示未使用还是写入污染。</p><h5>验收</h5><ul><li>当前owner/book和活动版本正确，跨书结果为零。</li><li>硬事实、当前任务、上一实际结果和作者必须项可追溯且无静默截断。</li><li>计划/实际、候选/正式、摘要/原文清楚分离。</li><li>无答案能诚实停止；投影可删除重建而不损失正式数据。</li><li>质量样本同时检查召回、排序、来源正确、无答案和真实生成是否使用了证据。</li></ul><hr><h3>创造性与输出质量</h3><blockquote>当前源文件：<code>.agents/skills/wenmi-longform-quality/references/creativity-and-output-quality.md</code> · 指纹：<code>82039db80692</code></blockquote><h4>创造性与输出质量</h4><p>仅在正文质量、人物、原创性、情绪、重复、套路化或审查机制变化时读取。</p><h5>结果标准</h5><p>好正文不只是“无矛盾”，还要有：人物主动选择、可辨识欲望和说话方式；场景内具体行动与后果；情绪变化和读者期待；题材独特性；铺垫与回报；段落和冲突不机械复用。</p><h5>保护开放区</h5><p>上层提供目标、事实、边界和必须兑现的责任，不替主笔写死每句对白、动作、意象和场面调度。爽感、冲突、悬念、关系拉扯等是可选手段；前500字、黄金三章和重大高潮是针对本书的效果目标，不是统一公式。</p><p>结构方法一次只作为精简软工具。候选路线必须在人物选择、因果路径、对立力量、关系、代价、高潮触发或卷末状态上有实质差异；只换同义词视为同质，重做其中一路。</p><h5>常见质量故障</h5><ul><li>人物只为推进任务服务，没有自己的欲望、判断和代价；</li><li>对手降智、配角成为面板附件；</li><li>每章重复同一打脸、误会、追杀、比赛或反转骨架；</li><li>正文出现“根据设定/结算/系统检查”等工程治理口吻；</li><li>数据面板、世界说明和回顾挤掉场景；</li><li>章末只有悬念没有阶段回报，或连续回报没有蓄力；</li><li>为过检查而解释因果，读者无法从行动自然看懂；</li><li>审校把局部可改问题夸大成整章重写。</li></ul><h5>修复顺序</h5><ol><li>先修任务与资料：是否给错版本、事实、人物目标或场景责任。</li><li>再修结构：选择、阻力、代价、变化和下一问题是否真实。</li><li>最后修表达：对白、动作、感官、段落、节奏和意象。</li><li>只重写需要变化的范围，保留可用正文和人物自然发挥。</li></ol><p>不要用更多形容词、更多反转、固定爽点频率或扩大提示词替代根因修复。</p><h5>审查边界</h5><p>事实审查只有同一对象、同一指标、同一范围的明确互斥证据才判重大。文学/体验问题若移动、删除、压缩一两句或补局部反应即可修复，应是轻微建议并保持通过。独立审查席不互读报告；作者看证据、影响和可执行建议，不看内部评分过程。</p><h5>验收</h5><p>自动检查只发现泄漏、重复、缺失、版本和明显结构风险。E3/E4必须阅读真实内容：开篇500字、黄金三章、相邻章节、事件转折、高潮与后果、人物长期选择和不同题材样本。市场“爆款”只能作为方向，不能由工程指标承诺。</p><hr><h3>生成、审校、结算与恢复</h3><blockquote>当前源文件：<code>.agents/skills/wenmi-longform-quality/references/runtime-quality-loops.md</code> · 指纹：<code>e1af6416be8a</code></blockquote><h4>生成、审校、结算与恢复</h4><p>仅在任务管线、方案/融合、正文生成、独立审校、作者确认、结算、幂等、预算或恢复变化时读取。</p><h5>对象闭环</h5><p>每个正式层遵循：作者补充 → 独立候选 → 差异/质疑 → 作者选择 → 主编只融合所选内容 → 作者编辑/确认 → 活动版本。作者确认前是候选，不能自动进入下一层。</p><p>正文使用一个活动主笔；事实、文学、体验按当前产品配置独立审查，互不读取报告。审查意见绑定精确正文版本，旧稿报告不能放行新稿。作者接受后创建不可变正文版本并结算。</p><h5>任务合同</h5><p>任务至少保存 owner/book、对象与活动版本、输入来源、预算、幂等键、阶段检查点、输出对象和恢复状态。重复请求或断点恢复复用已成功检查点，不重复扣量；结果未知时先调和供应商结果，不盲目重发。</p><p>状态来自真实队列、心跳、调用和工具事件。普通作者只看“准备资料/成员设计/等待选择/融合/审查/失败可恢复”等业务状态；内部模型、阶段键、任务ID、堆栈和原始协议留在管理员审计。</p><h5>结算</h5><p>章节结算记录实际人物状态、关系、资源、地点、时间、承诺/伏笔、线程推进、代价和下一章接口；事件结算汇总小故事实际结果；卷结算汇总本卷兑现、损耗、不可逆变化、未回收问题和下一卷起点。</p><p>结算引用正文证据，不复制计划。计划未发生就保持未发生；正文偏离计划但作者确认后，以正文实际为准并触发后续回校。</p><h5>停止与恢复</h5><p>以下情况就地停止并给恢复动作：缺活动上游、设定硬矛盾待作者决定、必要资料放不下、候选同质、模型/预算不可用、结果合同无效、审查阻断、版本已变或写入只读。停止不能覆盖作者输入、正文、结算或调用证据。</p><p>恢复从最后可靠检查点开始，绑定相同对象和版本；如果上游版本已变，旧候选作废并重新编译。取消只终止当前未完成工作，不把已确认对象改成取消状态。</p><h5>验收</h5><ul><li>从当前对象可以追到输入、候选、作者选择、确认版本和下游绑定。</li><li>并行席位独立，缺席可定向补发，成功席位不陪跑。</li><li>失败、取消、超时、结果未知和重试都有幂等/预算测试。</li><li>旧正文、结算和作者原话在回滚前后不变。</li><li>普通作者错误可读、可恢复且无技术泄漏。</li><li>真实长篇验收按用户指定规模逐阶段进行，失败立即停止扩大，不用确定性夹具冒充文学质量。</li></ul><hr><h3>文秘写作长篇质量</h3><blockquote>当前源文件：<code>.agents/skills/wenmi-longform-quality/SKILL.md</code> · 指纹：<code>44063f2fa6d6</code></blockquote><hr><p>name: wenmi-longform-quality description: 审查或修改文秘写作的分层创作对象、ContextCompiler、检索、生成审校、结算、长期连续性和真实文学质量时使用。仅用于会影响开书—设定—卷—事件—章纲—正文—结算链路或AI创作质量的任务；普通问答、纯文案、单页样式、明确机械修复和通用UI重排不使用。</p><hr><h4>文秘写作长篇质量</h4><p>这是开发与验收 Skill，不是小说创作提示词。不要把本文件、工程检查表或证据等级注入AI成员上下文。</p><h5>先判断是否触发</h5><p>触发：对象分层、版本失效、作者原话、ContextCompiler、RAG、生成/审校、事实连续性、人物漂移、重复模板、结算、长篇质量和真实模型验收。</p><p>不触发：普通事实问答、低风险UI/样式、纯文案、明确局部BUG、部署或账号运维本身。UI交互使用 <code>wenmi-ui-ux</code>。</p><h5>六条硬底线</h5><ol><li>作者确认的开书、设定、规划、原话、不可变正文和结算是正式源；候选、摘要、索引和AI推断不是。</li><li>规划描述未来，结算只记录正文实际。计划不得写成已经发生，正文实际不得被旧计划覆盖。</li><li>每次任务只使用当前 <code>owner_id</code>、<code>book_id</code> 和活动版本；其他书、过期候选、未摘录灵感和无关全文必须排除。</li><li>上层只传下层真正需要的责任：卷约束事件，事件链约束事件大纲，事件大纲约束章链，近期章纲约束正文。</li><li>作者硬要求必须遵守；软偏好可调整；开放区要足够大，允许人物选择、合理惊喜、题材差异和AI发挥。</li><li>一致性提升不能以模板化、人物工具化、情绪变弱、重复冲突或整体可读性下降为代价。</li></ol><h5>工作步骤</h5><h6>1. 定位当前对象</h6><p>说明当前在开书、设定、卷方向、事件链、事件大纲、章链、详细章纲、正文还是结算；找出活动版本、上游确认版本、上一实际结果和作者原话。</p><h6>2. 读取最少证据</h6><p>优先读正式对象和实际运行证据，不先读全部规范。按问题选择一份参考：</p><ul><li>上下文、检索、切片、资料包：<code>references/context-and-rag.md</code>。</li><li>生成质量、原创性、人物和重复：<code>references/creativity-and-output-quality.md</code>。</li><li>任务、审校、确认、结算、恢复：<code>references/runtime-quality-loops.md</code>。</li></ul><p>只有跨三个方向的大改才读取多份。产品字段和页面语义以当前规格为准，Skill不冻结团队人数、模型、UI布局、事件数量或测试规模。</p><h6>3. 查真实根因</h6><p>从版本、来源、ContextPack、检索轨迹、提示合同、模型调用、正文和结算找证据。常见根因只有在证据支持时才采用：</p><ul><li>用摘要/猜测替代正式源；</li><li>未确认候选或旧版本进入下游；</li><li>当前任务不清、资料过多或硬事实被截断；</li><li>审查意见互相污染或严重级别过度；</li><li>计划没有根据正文结算回校；</li><li>为了通过检查而重复同一情节、句式或数据面板。</li></ul><p>不要把“换更强模型”“加更多Agent”“塞更大上下文”当作默认答案。</p><h6>4. 设计最小修复</h6><p>先修数据/版本/上下文/任务合同，再考虑提示词。保留作者已确认内容和失败证据；上游变化让下游候选失效，不覆盖正文。软倾向用自然语言目标表达，不转成固定爽点间隔或强制节拍。</p><h6>5. 按证据声明</h6><ul><li>E0：规格；E1：机制；E2：确定性工程；E3：真实模型/独立阅读；E4：真实长篇。</li><li>字段存在、页面可见和夹具通过只能证明E1/E2。</li><li>真实文学质量需要阅读正文、相邻章节、人物弧线、承诺兑现和长期衔接。</li><li>日常开发不自动启动20/50/100/200章；只有用户明确要求专项长篇验收时才执行。</li></ul><h5>分层检查重点</h5><ul><li>设定只承载换卷后仍成立的非剧情骨架；写到需要时按需补。</li><li>卷方向讲大故事变化，不提前铺满事件和章节。</li><li>双路线对人物选择、因果、代价、关系、高潮或卷末状态有真实差异；普通作者看不到内部方法名。</li><li>首卷前500字、黄金三章和重大高潮是效果责任，不是统一打脸/战斗公式。</li><li>事件从上一实际结果开始，结束时产生新事实、代价和下一问题。</li><li>完整章链保证顺序，最近1—3章才详细冻结；正文上下文不塞整套审计表。</li><li>章节、事件、卷结算把实际人物/关系/资源/线程变化写回正式状态。</li></ul><h5>验证</h5><p>使用 <code>docs/ACCEPTANCE.md</code> 的风险矩阵。Skill或文档修改运行Skill结构校验与项目文档同步；核心工作流、数据或隔离变化才运行完整工程门禁。若检查规则本身迫使作品模板化、要求无关材料或阻止合理产品调整，先修订规则再继续。</p><hr><h3>界面短验收</h3><blockquote>当前源文件：<code>.agents/skills/wenmi-ui-ux/references/interface-review.md</code> · 指纹：<code>bfd12dbcac29</code></blockquote><h4>界面短验收</h4><p>只检查本次受影响页面，不生成大报告。</p><h5>任务与层级</h5><ul><li>只看标题、状态和按钮，能否知道“在哪、正在做什么、下一步是什么”？</li><li>首屏是否只有一个显著主操作？次要操作是否降级或收起？</li><li>是否重复解释同一件事，或用卡片边框代替层级？</li><li>当前对象、作者输入、AI候选、确认稿和历史版本是否容易区分？</li></ul><h5>状态与恢复</h5><ul><li>空、加载/工作中、待决定、完成、失败、只读/过期是否都有设计？</li><li>工作中是否说明阶段、可否离开、结果保存在哪里？</li><li>阻断是否给直接恢复动作，而不是只说“条件不满足”？</li><li>刷新、返回、重复点击和任务完成后，选择/输入是否保留且不重复发任务？</li></ul><h5>表单与AI协作</h5><ul><li>当前层最少要填什么？非必填是否明确且可跳过？</li><li>推荐是否少量、相关、可搜索/自定义，而不是一屏选项？</li><li>AI是否在作者主动请求方案或进入下一层时介入？</li><li>比较是否突出真实差异和代价，而不是让作者阅读两份长同义文？</li><li>确认后是否收起过程并突出结果/下一步？</li></ul><h5>手机</h5><ul><li>360/390/430px无非预期横向滚动；长书名和长错误可换行。</li><li>主要触控目标约44px；输入16px以上；焦点、键盘和安全区处理正确。</li><li>抽屉打开可见、可点、可关闭；遮罩层级不盖住抽屉。</li><li>固定顶部/底部不遮正文，主按钮在键盘弹起时仍可达。</li><li>方案比较、长表单和正文编辑没有把桌面多栏硬压缩。</li></ul><h5>可访问性与视觉</h5><ul><li>语义按钮/标签、键盘操作、可见焦点、对比度和非颜色状态提示成立。</li><li>动效使用 transform/opacity 为主，尊重 <code>prefers-reduced-motion</code>。</li><li>页面密度安静可读：少色、少边框、少阴影、少装饰；正文和决定内容最醒目。</li><li>文案是业务语言，不含设计评论、内部ID、模型名、JSON、路径或堆栈。</li></ul><h5>工程</h5><ul><li>复用现有token/原语或明确升级共享token，不散落一次性CSS。</li><li>成功、失败、禁用、重复点击和旧数据兼容有相关测试或手工证据。</li><li>运行相关组件测试（若有）、Web类型检查和Web构建。</li><li>可用浏览器时截取手机和桌面关键状态；环境不可用时诚实说明，不伪造视觉验收。</li></ul><p>参考原则来源：</p><ul><li>OpenAI官方前端重设计Skill：https://github.com/openai/plugins/blob/main/plugins/build-web-apps/skills/frontend-app-builder/SKILL.md</li><li>Vercel Web Interface Guidelines：https://github.com/vercel-labs/web-interface-guidelines</li><li>WCAG 2.2：https://www.w3.org/TR/WCAG22/</li></ul><p>本项目不安装会在每次运行时从可变远程 <code>main</code> 拉取规则的Skill；外部原则只在审查后写入本地版本，避免规则静默变化。</p><hr><h3>写作工作台参考模式</h3><blockquote>当前源文件：<code>.agents/skills/wenmi-ui-ux/references/writing-workspace-patterns.md</code> · 指纹：<code>5c4520821a8d</code></blockquote><h4>写作工作台参考模式</h4><p>这些是交互研究，不是外观模板。每次只取能解决当前问题的模式，不复制品牌、颜色或整套信息架构。</p><h5>novelWriter</h5><p>来源：https://github.com/vkbo/novelWriter</p><p>它把小说拆成许多小文档，以项目树组织正文和笔记，并强调纯文本、可读存储和专注写作。可借鉴：</p><ul><li>长篇必须始终看得见层级和当前位置；</li><li>正文与参考资料属于同一项目，但编辑面保持安静；</li><li>元数据、梗概和交叉引用辅助导航，不抢正文；</li><li>功能边界要克制，写作页不是全能办公套件。</li></ul><p>对文秘写作：左侧书籍只是一级导航，卷/事件/章的当前位置应在工作区内有更清晰的面包屑或对象树；正文页减少AI治理说明。</p><h5>Manuskript</h5><p>来源：https://github.com/olivierkes/manuskript</p><p>它提供大纲、索引卡、人物/世界、故事线与无干扰写作模式。可借鉴：</p><ul><li>同一故事对象可以有大纲、卡片和正文等不同视图；</li><li>组织阶段适合卡片/结构视图，写作阶段适合专注编辑；</li><li>拖拽/重排服务于结构理解，不应成为所有页面的默认形态。</li></ul><p>风险：功能视图多时很容易形成复杂“写作IDE”。文秘写作应按当前阶段只展示一个主视图，其他视图按需打开。</p><h5>Kindling</h5><p>来源：https://github.com/smith-and-web/kindling</p><p>它的核心主张是写正文时大纲仍可见，场景节拍作为可展开提示，也可切换全页正文。可借鉴：</p><ul><li>上层约束应靠近正文，但默认折叠，避免来回切页面；</li><li>“完整结构 + 当前详细提示”比一次把所有细节展开更适合长篇；</li><li>作者可在支架写作和纯正文之间切换。</li></ul><p>对文秘写作：正文页可提供一个轻量“本章任务/相关事实”抽屉，而不是把ContextPack和多张审查卡长期铺在正文旁边。</p><h5>Zettlr</h5><p>来源：https://github.com/Zettlr/Zettlr</p><p>它把文件管理、标签/目录、编辑器窗格和发布能力放在一个工作台，可折叠工作区并支持多编辑窗格。可借鉴：</p><ul><li>主编辑区稳定，导航和辅助面板可折叠；</li><li>多窗格只在比较、引用或研究时出现，不应永久占据空间；</li><li>键盘、标签、固定页签和可恢复工作区对长时间写作有价值。</li></ul><p>对文秘写作：桌面端方案比较可临时双栏，确认后回到单一工作区；手机端改成逐个查看和固定差异摘要。</p><h5>Manuscript（SwiftUI）</h5><p>来源：https://github.com/manuscriptapp/manuscript</p><p>它同时面向 iOS/macOS，提供项目树、corkboard、分屏和离线写作。可借鉴：</p><ul><li>手机不是桌面缩小版；相同对象在手机用分层导航和全页编辑；</li><li>corkboard适合重排场景，分屏适合桌面比较；</li><li>同一数据在不同屏幕采用不同呈现，不强求组件像素一致。</li></ul><h5>综合到文秘写作</h5><p>建议形成三种主要工作模式：</p><ol><li>设计模式：大纲/方案/事件以可比较、可重排的结构视图呈现；</li><li>写作模式：正文占中心，上层任务与资料按需展开；</li><li>复核模式：差异、审查和实际结算围绕精确版本展示。</li></ol><p>三种模式共享当前书和对象位置，但不把全部工具同时摆出来。AI状态属于当前对象，不应只藏在全局任务中心；全局任务中心保留跨书汇总和异常恢复。</p><h5>明确不照搬</h5><ul><li>不照搬桌面三栏到手机；</li><li>不把所有规划都变成可拖拽卡片；</li><li>不给小白作者暴露专业模板库；</li><li>不用项目树替代逐层向导；</li><li>不用更多功能页解决当前状态不清的问题。</li></ul><hr><h3>文秘写作 UI/UX</h3><blockquote>当前源文件：<code>.agents/skills/wenmi-ui-ux/SKILL.md</code> · 指纹：<code>c835c47383a8</code></blockquote><hr><p>name: wenmi-ui-ux description: 设计、重构、实现或审查文秘写作的页面布局、导航、移动端、表单、任务状态、AI协作交互和视觉层级时使用。适用于逐页UI优化、交互流程重做、响应式问题和整体创作工作台重设计；纯后端、数据迁移、普通文案和不涉及界面的长篇质量问题不使用。</p><hr><h4>文秘写作 UI/UX</h4><p>目标不是美化旧卡片，而是让作者更快理解当前任务、完成决定并继续写作。产品尚未定型，现有布局、卡片、导航和视觉都可调整。</p><h5>先看真实界面</h5><p>开始前只读取：当前页面代码、直接共享组件、相关状态/API合同，以及可用的当前截图或浏览器状态。不要先通读产品全部文档。需要整体视觉重设计时可按需使用 OpenAI 官方 <code>frontend-app-builder</code>；普通逐页调整不触发它。</p><p>先写三句话：</p><ol><li>用户此刻要完成什么；</li><li>当前最妨碍完成的是什么；</li><li>改完后首屏唯一主操作是什么。</li></ol><h5>写作工作台结构</h5><p>优先采用三层，而不是卡片矩阵：</p><ul><li>导航层：当前书、当前创作阶段、可切换对象；</li><li>工作层：作者此刻阅读、选择、编辑或写作的主要内容；</li><li>上下文层：AI状态、设定/资料、差异、帮助和检查结果，按需展开或抽屉显示。</li></ul><p>一个页面可以有多个信息区，但同一状态只保留一个显著主操作。导航不与页面动作竞争；解释不应比正文或决定更醒目。如果一个面板去掉边框仍能理解，就不要套卡片。</p><h5>状态驱动</h5><p>每页先设计状态，再设计组件：</p><ul><li>初始/空：说明本步产出和最小开始条件；</li><li>可编辑：作者输入简短、可留空、可保存；</li><li>AI工作中：显示正在做什么、已完成什么、可否离开；</li><li>待决定：直接比较差异，支持整选、片选、融合、编辑、重做；</li><li>已完成：收起过程，突出确认结果和下一步；</li><li>失败：说明影响、保留内容、提供就地重试/继续/返回修复；</li><li>只读/过期：说明为何不可继续和怎样恢复到活动版本。</li></ul><p>没有死胡同。每个阻断都给动作，不让作者靠猜去其他页面找前置条件。</p><h5>逐层显露</h5><p>作者只处理当前层，不提前填写卷、事件和章节的未来细节。可选项默认少量推荐，更多内容搜索或展开；高级/专业字段隐藏在“需要时补充”。AI在作者需要方案、比较或生成下一层时介入，不在建书后擅自启动长任务。</p><p>长说明改成一句范围说明 + 就近帮助；专业结构术语转换为本书的具体故事路线。作者原话、AI方案、活动定稿和历史版本视觉上必须可区分。</p><h5>手机优先</h5><p>以 360、390、430px 为基本宽度：</p><ul><li>主操作位于自然阅读流末端或稳定底部操作区，不能被浏览器栏/键盘遮挡；</li><li>触控目标约44px，输入字号至少16px，尊重安全区和动态 <code>visualViewport</code>；</li><li>桌面侧栏在手机变成抽屉、分段页或按需面板，不把三栏硬压成一栏小字；</li><li>比较方案时一次聚焦一个方案/一个维度，可横向切换但页面本身不产生横向溢出；</li><li>长内容优先折叠导航和辅助说明，不折叠当前正文、作者输入和主操作；</li><li>键盘弹起、旋转、长书名、长错误和高倍字体都要可达。</li></ul><h5>视觉语言</h5><p>写作产品应安静、耐读、有层级：中心内容优先，少颜色、少装饰、少厚边框，密度适中。使用现有设计 token 作为起点，可随整体重设计统一调整。</p><p>避免：通用AI仪表盘式卡片海、每段都有标题/说明/边框、多个同色主按钮、装饰性渐变、重复状态横幅、空洞营销文案、无意义图标、专业术语和内部ID。</p><p>保留：清楚的字号层级、充足行高、稳定对齐、状态与操作的单一强调色、明显焦点、可读对比、简洁过渡。动效只解释状态变化或空间关系，并尊重减少动画设置。</p><h5>实施节奏</h5><p>整体重设计先做信息架构和交互原型，再定视觉；按页面小批落地，但共享壳、token和状态组件统一。每批必须能独立回滚，不用半套新旧交互强迫作者跨页面猜规则。</p><p>优先顺序：应用壳/手机导航 → 开书 → 设定 → 分卷 → 事件/章纲 → 正文 → 资料库/辅助页。先修阻断、状态和主操作，再修视觉细节。</p><h5>验收</h5><p>读取 <code>references/interface-review.md</code>，按本次页面做短检查。至少验证相关组件测试（若有）、Web类型检查、Web构建，并在可用环境检查手机和桌面关键状态。普通UI改动不触发长篇Skill、全量迁移或200章验收。</p><p>写作产品参考模式按需读取 <code>references/writing-workspace-patterns.md</code>；不要照抄任何项目外观，只提取可验证的交互结构。</p></template><template id="document-1" data-title="上下文与混合检索" data-path=".agents/skills/wenmi-longform-quality/references/context-and-rag.md" data-meta="项目 Skills · 2.6 KB · e29d20ce0982"><h1>上下文与混合检索</h1><p>仅在修改 ContextCompiler、资料包、检索、切片、来源或上下文预算时读取。</p><h2>任务包顺序</h2><ol><li>身份：owner、book、任务对象、活动版本。</li><li>硬事实：确认开书/设定、不可变正文、结算、明确禁止项。</li><li>当前任务：上层责任、输出对象、停止条件。</li><li>连续性：上一实际结果、最近正文、活动线程、相关人物/关系/资源/时间因果。</li><li>作者输入：绑定当前对象的必须、强偏好、灵感和问题。</li><li>软参考与开放区：风格、重点表达、内部方法软工具，以及AI可自由决定的部分。</li><li>来源和预算：每项来源/版本、入选理由、排除理由、字符/token预算。</li></ol><p>硬事实和当前任务优先；放不下时应缩小任务、分阶段或回查正式源，不能静默截断核心材料。</p><h2>明确排除</h2><ul><li>其他书或其他owner；</li><li>未确认方案、过期版本、失败草稿；</li><li>未由作者摘录到正式对象的独立灵感；</li><li>全库无差别全文、全部审查报告、全部结构方法；</li><li>AI推断出的事实、无来源Wiki、仅凭题材常识补出的数值；</li><li>思维链、工程检查表和普通作者不需要的内部ID。</li></ul><h2>检索组合</h2><p>先结构化直达当前对象与活动版本，再按需组合全文、向量、实体关系、时间/因果和原文回查。向量只负责找候选，不能单独判定权威。摘要只导航；事实冲突回查确认对象、不可变正文或实际结算。</p><p>同一事实的多个投影应按稳定来源键去重，而不是删掉来源。无可靠答案时返回未知或发起补设定，不从相似片段猜测。</p><h2>长篇连续性</h2><p>线程至少区分计划、已启动、推进、搁置、兑现和废止；状态只能由正文/结算改变。人物、关系、资源、规则和时间线保留历史，不用最新摘要覆盖旧状态。远期只保留责任和开放问题，近期才读取详细场景。</p><h2>诊断证据</h2><p>排查时保存或查看：任务快照、ContextPack清单、来源版本、检索查询/候选/选中理由、预算、模型调用结果和实际写入。先确认错误信息是没有检索到、检索错、排序错、来源过期、提示未使用还是写入污染。</p><h2>验收</h2><ul><li>当前owner/book和活动版本正确，跨书结果为零。</li><li>硬事实、当前任务、上一实际结果和作者必须项可追溯且无静默截断。</li><li>计划/实际、候选/正式、摘要/原文清楚分离。</li><li>无答案能诚实停止；投影可删除重建而不损失正式数据。</li><li>质量样本同时检查召回、排序、来源正确、无答案和真实生成是否使用了证据。</li></ul></template><template id="document-2" data-title="创造性与输出质量" data-path=".agents/skills/wenmi-longform-quality/references/creativity-and-output-quality.md" data-meta="项目 Skills · 2.5 KB · 82039db80692"><h1>创造性与输出质量</h1><p>仅在正文质量、人物、原创性、情绪、重复、套路化或审查机制变化时读取。</p><h2>结果标准</h2><p>好正文不只是“无矛盾”，还要有：人物主动选择、可辨识欲望和说话方式；场景内具体行动与后果；情绪变化和读者期待；题材独特性；铺垫与回报；段落和冲突不机械复用。</p><h2>保护开放区</h2><p>上层提供目标、事实、边界和必须兑现的责任，不替主笔写死每句对白、动作、意象和场面调度。爽感、冲突、悬念、关系拉扯等是可选手段；前500字、黄金三章和重大高潮是针对本书的效果目标，不是统一公式。</p><p>结构方法一次只作为精简软工具。候选路线必须在人物选择、因果路径、对立力量、关系、代价、高潮触发或卷末状态上有实质差异；只换同义词视为同质，重做其中一路。</p><h2>常见质量故障</h2><ul><li>人物只为推进任务服务，没有自己的欲望、判断和代价；</li><li>对手降智、配角成为面板附件；</li><li>每章重复同一打脸、误会、追杀、比赛或反转骨架；</li><li>正文出现“根据设定/结算/系统检查”等工程治理口吻；</li><li>数据面板、世界说明和回顾挤掉场景；</li><li>章末只有悬念没有阶段回报，或连续回报没有蓄力；</li><li>为过检查而解释因果，读者无法从行动自然看懂；</li><li>审校把局部可改问题夸大成整章重写。</li></ul><h2>修复顺序</h2><ol><li>先修任务与资料：是否给错版本、事实、人物目标或场景责任。</li><li>再修结构：选择、阻力、代价、变化和下一问题是否真实。</li><li>最后修表达：对白、动作、感官、段落、节奏和意象。</li><li>只重写需要变化的范围，保留可用正文和人物自然发挥。</li></ol><p>不要用更多形容词、更多反转、固定爽点频率或扩大提示词替代根因修复。</p><h2>审查边界</h2><p>事实审查只有同一对象、同一指标、同一范围的明确互斥证据才判重大。文学/体验问题若移动、删除、压缩一两句或补局部反应即可修复，应是轻微建议并保持通过。独立审查席不互读报告；作者看证据、影响和可执行建议，不看内部评分过程。</p><h2>验收</h2><p>自动检查只发现泄漏、重复、缺失、版本和明显结构风险。E3/E4必须阅读真实内容：开篇500字、黄金三章、相邻章节、事件转折、高潮与后果、人物长期选择和不同题材样本。市场“爆款”只能作为方向，不能由工程指标承诺。</p></template><template id="document-3" data-title="生成、审校、结算与恢复" data-path=".agents/skills/wenmi-longform-quality/references/runtime-quality-loops.md" data-meta="项目 Skills · 2.6 KB · e1af6416be8a"><h1>生成、审校、结算与恢复</h1><p>仅在任务管线、方案/融合、正文生成、独立审校、作者确认、结算、幂等、预算或恢复变化时读取。</p><h2>对象闭环</h2><p>每个正式层遵循：作者补充 → 独立候选 → 差异/质疑 → 作者选择 → 主编只融合所选内容 → 作者编辑/确认 → 活动版本。作者确认前是候选，不能自动进入下一层。</p><p>正文使用一个活动主笔；事实、文学、体验按当前产品配置独立审查，互不读取报告。审查意见绑定精确正文版本，旧稿报告不能放行新稿。作者接受后创建不可变正文版本并结算。</p><h2>任务合同</h2><p>任务至少保存 owner/book、对象与活动版本、输入来源、预算、幂等键、阶段检查点、输出对象和恢复状态。重复请求或断点恢复复用已成功检查点，不重复扣量；结果未知时先调和供应商结果，不盲目重发。</p><p>状态来自真实队列、心跳、调用和工具事件。普通作者只看“准备资料/成员设计/等待选择/融合/审查/失败可恢复”等业务状态；内部模型、阶段键、任务ID、堆栈和原始协议留在管理员审计。</p><h2>结算</h2><p>章节结算记录实际人物状态、关系、资源、地点、时间、承诺/伏笔、线程推进、代价和下一章接口；事件结算汇总小故事实际结果；卷结算汇总本卷兑现、损耗、不可逆变化、未回收问题和下一卷起点。</p><p>结算引用正文证据，不复制计划。计划未发生就保持未发生；正文偏离计划但作者确认后，以正文实际为准并触发后续回校。</p><h2>停止与恢复</h2><p>以下情况就地停止并给恢复动作：缺活动上游、设定硬矛盾待作者决定、必要资料放不下、候选同质、模型/预算不可用、结果合同无效、审查阻断、版本已变或写入只读。停止不能覆盖作者输入、正文、结算或调用证据。</p><p>恢复从最后可靠检查点开始，绑定相同对象和版本；如果上游版本已变，旧候选作废并重新编译。取消只终止当前未完成工作，不把已确认对象改成取消状态。</p><h2>验收</h2><ul><li>从当前对象可以追到输入、候选、作者选择、确认版本和下游绑定。</li><li>并行席位独立，缺席可定向补发，成功席位不陪跑。</li><li>失败、取消、超时、结果未知和重试都有幂等/预算测试。</li><li>旧正文、结算和作者原话在回滚前后不变。</li><li>普通作者错误可读、可恢复且无技术泄漏。</li><li>真实长篇验收按用户指定规模逐阶段进行，失败立即停止扩大，不用确定性夹具冒充文学质量。</li></ul></template><template id="document-4" data-title="文秘写作长篇质量" data-path=".agents/skills/wenmi-longform-quality/SKILL.md" data-meta="项目 Skills · 4.7 KB · 44063f2fa6d6"><details class="frontmatter"><summary>文档元数据</summary><pre>name: wenmi-longform-quality
description: 审查或修改文秘写作的分层创作对象、ContextCompiler、检索、生成审校、结算、长期连续性和真实文学质量时使用。仅用于会影响开书—设定—卷—事件—章纲—正文—结算链路或AI创作质量的任务；普通问答、纯文案、单页样式、明确机械修复和通用UI重排不使用。</pre></details><h1>文秘写作长篇质量</h1><p>这是开发与验收 Skill，不是小说创作提示词。不要把本文件、工程检查表或证据等级注入AI成员上下文。</p><h2>先判断是否触发</h2><p>触发：对象分层、版本失效、作者原话、ContextCompiler、RAG、生成/审校、事实连续性、人物漂移、重复模板、结算、长篇质量和真实模型验收。</p><p>不触发：普通事实问答、低风险UI/样式、纯文案、明确局部BUG、部署或账号运维本身。UI交互使用 <code>wenmi-ui-ux</code>。</p><h2>六条硬底线</h2><ol><li>作者确认的开书、设定、规划、原话、不可变正文和结算是正式源；候选、摘要、索引和AI推断不是。</li><li>规划描述未来，结算只记录正文实际。计划不得写成已经发生，正文实际不得被旧计划覆盖。</li><li>每次任务只使用当前 <code>owner_id</code>、<code>book_id</code> 和活动版本；其他书、过期候选、未摘录灵感和无关全文必须排除。</li><li>上层只传下层真正需要的责任：卷约束事件，事件链约束事件大纲，事件大纲约束章链，近期章纲约束正文。</li><li>作者硬要求必须遵守；软偏好可调整；开放区要足够大，允许人物选择、合理惊喜、题材差异和AI发挥。</li><li>一致性提升不能以模板化、人物工具化、情绪变弱、重复冲突或整体可读性下降为代价。</li></ol><h2>工作步骤</h2><h3>1. 定位当前对象</h3><p>说明当前在开书、设定、卷方向、事件链、事件大纲、章链、详细章纲、正文还是结算；找出活动版本、上游确认版本、上一实际结果和作者原话。</p><h3>2. 读取最少证据</h3><p>优先读正式对象和实际运行证据，不先读全部规范。按问题选择一份参考：</p><ul><li>上下文、检索、切片、资料包：<code>references/context-and-rag.md</code>。</li><li>生成质量、原创性、人物和重复：<code>references/creativity-and-output-quality.md</code>。</li><li>任务、审校、确认、结算、恢复：<code>references/runtime-quality-loops.md</code>。</li></ul><p>只有跨三个方向的大改才读取多份。产品字段和页面语义以当前规格为准，Skill不冻结团队人数、模型、UI布局、事件数量或测试规模。</p><h3>3. 查真实根因</h3><p>从版本、来源、ContextPack、检索轨迹、提示合同、模型调用、正文和结算找证据。常见根因只有在证据支持时才采用：</p><ul><li>用摘要/猜测替代正式源；</li><li>未确认候选或旧版本进入下游；</li><li>当前任务不清、资料过多或硬事实被截断；</li><li>审查意见互相污染或严重级别过度；</li><li>计划没有根据正文结算回校；</li><li>为了通过检查而重复同一情节、句式或数据面板。</li></ul><p>不要把“换更强模型”“加更多Agent”“塞更大上下文”当作默认答案。</p><h3>4. 设计最小修复</h3><p>先修数据/版本/上下文/任务合同，再考虑提示词。保留作者已确认内容和失败证据；上游变化让下游候选失效，不覆盖正文。软倾向用自然语言目标表达，不转成固定爽点间隔或强制节拍。</p><h3>5. 按证据声明</h3><ul><li>E0：规格；E1：机制；E2：确定性工程；E3：真实模型/独立阅读；E4：真实长篇。</li><li>字段存在、页面可见和夹具通过只能证明E1/E2。</li><li>真实文学质量需要阅读正文、相邻章节、人物弧线、承诺兑现和长期衔接。</li><li>日常开发不自动启动20/50/100/200章；只有用户明确要求专项长篇验收时才执行。</li></ul><h2>分层检查重点</h2><ul><li>设定只承载换卷后仍成立的非剧情骨架；写到需要时按需补。</li><li>卷方向讲大故事变化，不提前铺满事件和章节。</li><li>双路线对人物选择、因果、代价、关系、高潮或卷末状态有真实差异；普通作者看不到内部方法名。</li><li>首卷前500字、黄金三章和重大高潮是效果责任，不是统一打脸/战斗公式。</li><li>事件从上一实际结果开始，结束时产生新事实、代价和下一问题。</li><li>完整章链保证顺序，最近1—3章才详细冻结；正文上下文不塞整套审计表。</li><li>章节、事件、卷结算把实际人物/关系/资源/线程变化写回正式状态。</li></ul><h2>验证</h2><p>使用 <code>docs/ACCEPTANCE.md</code> 的风险矩阵。Skill或文档修改运行Skill结构校验与项目文档同步；核心工作流、数据或隔离变化才运行完整工程门禁。若检查规则本身迫使作品模板化、要求无关材料或阻止合理产品调整，先修订规则再继续。</p></template><template id="document-5" data-title="界面短验收" data-path=".agents/skills/wenmi-ui-ux/references/interface-review.md" data-meta="项目 Skills · 2.8 KB · bfd12dbcac29"><h1>界面短验收</h1><p>只检查本次受影响页面，不生成大报告。</p><h2>任务与层级</h2><ul><li>只看标题、状态和按钮，能否知道“在哪、正在做什么、下一步是什么”？</li><li>首屏是否只有一个显著主操作？次要操作是否降级或收起？</li><li>是否重复解释同一件事，或用卡片边框代替层级？</li><li>当前对象、作者输入、AI候选、确认稿和历史版本是否容易区分？</li></ul><h2>状态与恢复</h2><ul><li>空、加载/工作中、待决定、完成、失败、只读/过期是否都有设计？</li><li>工作中是否说明阶段、可否离开、结果保存在哪里？</li><li>阻断是否给直接恢复动作，而不是只说“条件不满足”？</li><li>刷新、返回、重复点击和任务完成后，选择/输入是否保留且不重复发任务？</li></ul><h2>表单与AI协作</h2><ul><li>当前层最少要填什么？非必填是否明确且可跳过？</li><li>推荐是否少量、相关、可搜索/自定义，而不是一屏选项？</li><li>AI是否在作者主动请求方案或进入下一层时介入？</li><li>比较是否突出真实差异和代价，而不是让作者阅读两份长同义文？</li><li>确认后是否收起过程并突出结果/下一步？</li></ul><h2>手机</h2><ul><li>360/390/430px无非预期横向滚动；长书名和长错误可换行。</li><li>主要触控目标约44px；输入16px以上；焦点、键盘和安全区处理正确。</li><li>抽屉打开可见、可点、可关闭；遮罩层级不盖住抽屉。</li><li>固定顶部/底部不遮正文，主按钮在键盘弹起时仍可达。</li><li>方案比较、长表单和正文编辑没有把桌面多栏硬压缩。</li></ul><h2>可访问性与视觉</h2><ul><li>语义按钮/标签、键盘操作、可见焦点、对比度和非颜色状态提示成立。</li><li>动效使用 transform/opacity 为主，尊重 <code>prefers-reduced-motion</code>。</li><li>页面密度安静可读：少色、少边框、少阴影、少装饰；正文和决定内容最醒目。</li><li>文案是业务语言，不含设计评论、内部ID、模型名、JSON、路径或堆栈。</li></ul><h2>工程</h2><ul><li>复用现有token/原语或明确升级共享token，不散落一次性CSS。</li><li>成功、失败、禁用、重复点击和旧数据兼容有相关测试或手工证据。</li><li>运行相关组件测试（若有）、Web类型检查和Web构建。</li><li>可用浏览器时截取手机和桌面关键状态；环境不可用时诚实说明，不伪造视觉验收。</li></ul><p>参考原则来源：</p><ul><li>OpenAI官方前端重设计Skill：https://github.com/openai/plugins/blob/main/plugins/build-web-apps/skills/frontend-app-builder/SKILL.md</li><li>Vercel Web Interface Guidelines：https://github.com/vercel-labs/web-interface-guidelines</li><li>WCAG 2.2：https://www.w3.org/TR/WCAG22/</li></ul><p>本项目不安装会在每次运行时从可变远程 <code>main</code> 拉取规则的Skill；外部原则只在审查后写入本地版本，避免规则静默变化。</p></template><template id="document-6" data-title="写作工作台参考模式" data-path=".agents/skills/wenmi-ui-ux/references/writing-workspace-patterns.md" data-meta="项目 Skills · 3.6 KB · 5c4520821a8d"><h1>写作工作台参考模式</h1><p>这些是交互研究，不是外观模板。每次只取能解决当前问题的模式，不复制品牌、颜色或整套信息架构。</p><h2>novelWriter</h2><p>来源：https://github.com/vkbo/novelWriter</p><p>它把小说拆成许多小文档，以项目树组织正文和笔记，并强调纯文本、可读存储和专注写作。可借鉴：</p><ul><li>长篇必须始终看得见层级和当前位置；</li><li>正文与参考资料属于同一项目，但编辑面保持安静；</li><li>元数据、梗概和交叉引用辅助导航，不抢正文；</li><li>功能边界要克制，写作页不是全能办公套件。</li></ul><p>对文秘写作：左侧书籍只是一级导航，卷/事件/章的当前位置应在工作区内有更清晰的面包屑或对象树；正文页减少AI治理说明。</p><h2>Manuskript</h2><p>来源：https://github.com/olivierkes/manuskript</p><p>它提供大纲、索引卡、人物/世界、故事线与无干扰写作模式。可借鉴：</p><ul><li>同一故事对象可以有大纲、卡片和正文等不同视图；</li><li>组织阶段适合卡片/结构视图，写作阶段适合专注编辑；</li><li>拖拽/重排服务于结构理解，不应成为所有页面的默认形态。</li></ul><p>风险：功能视图多时很容易形成复杂“写作IDE”。文秘写作应按当前阶段只展示一个主视图，其他视图按需打开。</p><h2>Kindling</h2><p>来源：https://github.com/smith-and-web/kindling</p><p>它的核心主张是写正文时大纲仍可见，场景节拍作为可展开提示，也可切换全页正文。可借鉴：</p><ul><li>上层约束应靠近正文，但默认折叠，避免来回切页面；</li><li>“完整结构 + 当前详细提示”比一次把所有细节展开更适合长篇；</li><li>作者可在支架写作和纯正文之间切换。</li></ul><p>对文秘写作：正文页可提供一个轻量“本章任务/相关事实”抽屉，而不是把ContextPack和多张审查卡长期铺在正文旁边。</p><h2>Zettlr</h2><p>来源：https://github.com/Zettlr/Zettlr</p><p>它把文件管理、标签/目录、编辑器窗格和发布能力放在一个工作台，可折叠工作区并支持多编辑窗格。可借鉴：</p><ul><li>主编辑区稳定，导航和辅助面板可折叠；</li><li>多窗格只在比较、引用或研究时出现，不应永久占据空间；</li><li>键盘、标签、固定页签和可恢复工作区对长时间写作有价值。</li></ul><p>对文秘写作：桌面端方案比较可临时双栏，确认后回到单一工作区；手机端改成逐个查看和固定差异摘要。</p><h2>Manuscript（SwiftUI）</h2><p>来源：https://github.com/manuscriptapp/manuscript</p><p>它同时面向 iOS/macOS，提供项目树、corkboard、分屏和离线写作。可借鉴：</p><ul><li>手机不是桌面缩小版；相同对象在手机用分层导航和全页编辑；</li><li>corkboard适合重排场景，分屏适合桌面比较；</li><li>同一数据在不同屏幕采用不同呈现，不强求组件像素一致。</li></ul><h2>综合到文秘写作</h2><p>建议形成三种主要工作模式：</p><ol><li>设计模式：大纲/方案/事件以可比较、可重排的结构视图呈现；</li><li>写作模式：正文占中心，上层任务与资料按需展开；</li><li>复核模式：差异、审查和实际结算围绕精确版本展示。</li></ol><p>三种模式共享当前书和对象位置，但不把全部工具同时摆出来。AI状态属于当前对象，不应只藏在全局任务中心；全局任务中心保留跨书汇总和异常恢复。</p><h2>明确不照搬</h2><ul><li>不照搬桌面三栏到手机；</li><li>不把所有规划都变成可拖拽卡片；</li><li>不给小白作者暴露专业模板库；</li><li>不用项目树替代逐层向导；</li><li>不用更多功能页解决当前状态不清的问题。</li></ul></template><template id="document-7" data-title="文秘写作 UI/UX" data-path=".agents/skills/wenmi-ui-ux/SKILL.md" data-meta="项目 Skills · 4.8 KB · c835c47383a8"><details class="frontmatter"><summary>文档元数据</summary><pre>name: wenmi-ui-ux
description: 设计、重构、实现或审查文秘写作的页面布局、导航、移动端、表单、任务状态、AI协作交互和视觉层级时使用。适用于逐页UI优化、交互流程重做、响应式问题和整体创作工作台重设计；纯后端、数据迁移、普通文案和不涉及界面的长篇质量问题不使用。</pre></details><h1>文秘写作 UI/UX</h1><p>目标不是美化旧卡片，而是让作者更快理解当前任务、完成决定并继续写作。产品尚未定型，现有布局、卡片、导航和视觉都可调整。</p><h2>先看真实界面</h2><p>开始前只读取：当前页面代码、直接共享组件、相关状态/API合同，以及可用的当前截图或浏览器状态。不要先通读产品全部文档。需要整体视觉重设计时可按需使用 OpenAI 官方 <code>frontend-app-builder</code>；普通逐页调整不触发它。</p><p>先写三句话：</p><ol><li>用户此刻要完成什么；</li><li>当前最妨碍完成的是什么；</li><li>改完后首屏唯一主操作是什么。</li></ol><h2>写作工作台结构</h2><p>优先采用三层，而不是卡片矩阵：</p><ul><li>导航层：当前书、当前创作阶段、可切换对象；</li><li>工作层：作者此刻阅读、选择、编辑或写作的主要内容；</li><li>上下文层：AI状态、设定/资料、差异、帮助和检查结果，按需展开或抽屉显示。</li></ul><p>一个页面可以有多个信息区，但同一状态只保留一个显著主操作。导航不与页面动作竞争；解释不应比正文或决定更醒目。如果一个面板去掉边框仍能理解，就不要套卡片。</p><h2>状态驱动</h2><p>每页先设计状态，再设计组件：</p><ul><li>初始/空：说明本步产出和最小开始条件；</li><li>可编辑：作者输入简短、可留空、可保存；</li><li>AI工作中：显示正在做什么、已完成什么、可否离开；</li><li>待决定：直接比较差异，支持整选、片选、融合、编辑、重做；</li><li>已完成：收起过程，突出确认结果和下一步；</li><li>失败：说明影响、保留内容、提供就地重试/继续/返回修复；</li><li>只读/过期：说明为何不可继续和怎样恢复到活动版本。</li></ul><p>没有死胡同。每个阻断都给动作，不让作者靠猜去其他页面找前置条件。</p><h2>逐层显露</h2><p>作者只处理当前层，不提前填写卷、事件和章节的未来细节。可选项默认少量推荐，更多内容搜索或展开；高级/专业字段隐藏在“需要时补充”。AI在作者需要方案、比较或生成下一层时介入，不在建书后擅自启动长任务。</p><p>长说明改成一句范围说明 + 就近帮助；专业结构术语转换为本书的具体故事路线。作者原话、AI方案、活动定稿和历史版本视觉上必须可区分。</p><h2>手机优先</h2><p>以 360、390、430px 为基本宽度：</p><ul><li>主操作位于自然阅读流末端或稳定底部操作区，不能被浏览器栏/键盘遮挡；</li><li>触控目标约44px，输入字号至少16px，尊重安全区和动态 <code>visualViewport</code>；</li><li>桌面侧栏在手机变成抽屉、分段页或按需面板，不把三栏硬压成一栏小字；</li><li>比较方案时一次聚焦一个方案/一个维度，可横向切换但页面本身不产生横向溢出；</li><li>长内容优先折叠导航和辅助说明，不折叠当前正文、作者输入和主操作；</li><li>键盘弹起、旋转、长书名、长错误和高倍字体都要可达。</li></ul><h2>视觉语言</h2><p>写作产品应安静、耐读、有层级：中心内容优先，少颜色、少装饰、少厚边框，密度适中。使用现有设计 token 作为起点，可随整体重设计统一调整。</p><p>避免：通用AI仪表盘式卡片海、每段都有标题/说明/边框、多个同色主按钮、装饰性渐变、重复状态横幅、空洞营销文案、无意义图标、专业术语和内部ID。</p><p>保留：清楚的字号层级、充足行高、稳定对齐、状态与操作的单一强调色、明显焦点、可读对比、简洁过渡。动效只解释状态变化或空间关系，并尊重减少动画设置。</p><h2>实施节奏</h2><p>整体重设计先做信息架构和交互原型，再定视觉；按页面小批落地，但共享壳、token和状态组件统一。每批必须能独立回滚，不用半套新旧交互强迫作者跨页面猜规则。</p><p>优先顺序：应用壳/手机导航 → 开书 → 设定 → 分卷 → 事件/章纲 → 正文 → 资料库/辅助页。先修阻断、状态和主操作，再修视觉细节。</p><h2>验收</h2><p>读取 <code>references/interface-review.md</code>，按本次页面做短检查。至少验证相关组件测试（若有）、Web类型检查、Web构建，并在可用环境检查手机和桌面关键状态。普通UI改动不触发长篇Skill、全量迁移或200章验收。</p><p>写作产品参考模式按需读取 <code>references/writing-workspace-patterns.md</code>；不要照抄任何项目外观，只提取可验证的交互结构。</p></template><template id="document-8" data-title="文秘写作开发规则" data-path="AGENTS.md" data-meta="Codex 工作规则 · 4.7 KB · 64997a9b413f"><h1>文秘写作开发规则</h1><h2>1. 权威与范围</h2><p>老板最新明确决定最高；随后是本文件、<code>docs/PROJECT_CHARTER.md</code>、当前规格、代码与运行证据。生成的合订版和 Git 历史只用于追溯，不参与默认阅读或产品检索。</p><p>项目只在 <code>D:\wenmixiezuo</code> 内工作。普通、可逆、零现金的开发和 UI 调整可直接进行；实际付费、新密钥/新登录、永久删除作者数据、生产恢复和不可逆架构迁移才停下确认。</p><h2>2. 最小阅读</h2><p>不要为每个任务通读项目文档。</p><ul><li>普通问答、状态说明：按问题查证，不强制读文档。</li><li>一次新的开发任务：先读一次 <code>HANDOFF.md</code>；同一任务后续不重复读。</li><li>单页 UI、文案、小修：相关页面代码 + <code>.agents/skills/wenmi-ui-ux/SKILL.md</code>；需要确认产品语义时只查对应规格小节。</li><li>工作流、上下文、检索、生成审校或长篇质量：相关代码 + <code>.agents/skills/wenmi-longform-quality/SKILL.md</code>；由 Skill 路由到一份必要参考，不全量读取。</li><li>数据/API/部署：只加读 <code>docs/DATA_MODEL.md</code>、<code>docs/API.md</code> 或 <code>docs/DEPLOY.md</code> 中受影响部分。</li><li><code>docs/DECISIONS.md</code> 是短索引，不再累积事故日志；历史决定按需从 Git 查。</li></ul><h2>3. 当前产品底线</h2><p>主流程：开书信息 → 非剧情设定 → 分卷方向 → 当前卷事件链 → 当前事件大纲 → 完整章链与近期详细章纲 → 单章正文 → 章节/事件/卷结算 → 下一卷。</p><p>规划描述未来，结算只记录正文实际发生；上游确认版本变化时，下游候选失效或重编译。专业结构方法只供后台设计，普通作者只看本书的白话路线。UI 和布局处于持续迭代期，没有固定卡片数量、固定页面结构或不可改视觉风格；默认手机优先、少填少选、逐层推进。</p><h2>4. 基础安全</h2><p>以下是始终保留的硬门禁：</p><ul><li>业务身份来自已验证会话；核心查询和写入携带 <code>owner_id</code>、<code>book_id</code>，跨书污染必须为零。</li><li>正文采用不可变完整版本，修改产生新版本；正式作者原文、结算和已合并迁移不得被普通清理覆盖。</li><li>API Key 只来自环境变量，不进入数据库、日志、上下文、备份、导出或 Git。</li><li>普通删除优先归档；永久删除作者数据必须有影响预览、<code>YES</code> 和二次确认。</li><li>不保存或展示模型思维链；同一模型不得伪装成异模型独立复核。</li><li>外部写入、付费、生产恢复和破坏性操作严格限定到用户授权范围。</li></ul><h2>5. 开发方式</h2><p>先看真实页面、状态和代码，再改最小闭环。产品尚未定型，UI、交互和功能规格都允许继续调整；不要让旧文档或 Skill 阻止合理迭代。发现规格与老板新决定冲突时，直接更新当前规格并把旧内容移到历史归档。</p><p>只在以下高风险变化建立 <code>design_review_id</code>：权限/账号隔离、作者数据不可变性、数据库语义、跨服务恢复、模型调用计费、ContextCompiler 权威来源或不可逆架构。普通 UI、文案、组件重排、局部接口兼容和明确 BUG 修复不做两轮设计审计。</p><p>编辑文件使用 <code>apply_patch</code>；若工具本身故障，先留可恢复副本，再使用可审计的固定路径替代方式。保留用户已有改动，不用 <code>git reset --hard</code> 或 <code>git checkout --</code> 覆盖。</p><h2>6. 按风险验证</h2><ul><li>文档/Skill：Skill 结构校验（如适用）+ <code>node scripts/sync-project-docs.mjs</code> + <code>--check</code>。</li><li>单页 UI/样式：相关组件测试（若有）+ Web 类型检查 + Web 构建；有浏览器环境时检查 360/390/430px 与桌面。</li><li>局部业务逻辑/API：受影响测试 + 对应包类型检查/构建。</li><li>数据迁移、权限隔离、跨服务恢复、核心工作流：全量 <code>npm run verify</code>，再做相关迁移/恢复/运行测试。</li></ul><p>测试应与风险相称。不要把200章文学验收、全量迁移、四端构建或生产真机检查强加给普通 UI 微调；也不要用字段存在或夹具通过冒充真实文学质量。</p><h2>7. 部署</h2><ul><li>Web 静态资源单独发布：在暂存目录构建，保留旧哈希资源，原子切换入口并验证首页、资源、登录和核心页面；不重启 API/Worker，因此不要求等待任务清零。</li><li>API/Worker/迁移发布：向后兼容；重启前在途任务连续30秒为零并立即复核，逐服务切换、看日志、保留回滚版本。</li><li>不取消、暂停或改写作者任务来制造部署窗口。生产异常优先回滚，不边猜边改数据。</li></ul><h2>8. 文档与提交</h2><p>只有当前规格、规则、Skill 或状态改变时才运行文档同步；纯代码小修若文档语义未变，无需改文档。逻辑完整的一批改动再提交；推送和生产部署只在已授权且通道可用时进行。</p></template><template id="document-9" data-title="验收标准" data-path="docs/ACCEPTANCE.md" data-meta="当前正式文档 · 4.4 KB · a1aca0a2898d"><h1>验收标准</h1><h2>1. 完成的基本含义</h2><p>完成 = 用户目标已实现、受影响路径可用、没有已知阻断缺陷、验证与风险相称。工程机制通过、真实模型质量通过、长期阅读效果通过必须分别声明，不能互相冒充。</p><h2>2. 所有改动的共同检查</h2><ul><li>改动范围与用户要求一致，没有顺手扩大权限或覆盖无关修改。</li><li>无明文密钥、密码、会话、模型思维链、路径/堆栈或内部协议泄漏。</li><li>涉及书籍数据时，<code>owner_id</code>、<code>book_id</code> 隔离和不可变正文成立。</li><li>新失败状态有用户能理解的原因和恢复动作；旧数据与旧缓存至少可读或有明确兼容路径。</li><li>产品文案和页面不把软参考伪装成必须，不把计划冒充正文实际。</li></ul><h2>3. 按风险选择门禁</h2><div class="table-scroll"><table><thead><tr><th>变更类型</th><th>必须验证</th><th>不默认要求</th></tr></thead><tbody><tr><td>文案、规则、Skill</td><td>相关结构校验；当前文档同步与检查</td><td>全量应用测试、四端构建、生产部署</td></tr><tr><td>单页 UI/样式</td><td>相关组件测试（若有）；Web类型检查；Web构建；关键宽度走查</td><td>全量迁移、API/Worker构建、长期章节验收</td></tr><tr><td>局部前端逻辑</td><td>受影响测试；Web类型检查/构建；成功/空/加载/失败/恢复状态</td><td>无关包全量测试</td></tr><tr><td>局部API/Worker</td><td>受影响测试；对应包类型检查/构建；权限与错误合同</td><td>无关UI真机、长期文学验证</td></tr><tr><td>数据迁移/权限隔离/核心工作流</td><td><code>npm run verify</code>；迁移幂等/升级/恢复；真实服务冒烟；隔离测试</td><td>无关市场效果承诺</td></tr><tr><td>生产发布</td><td>按发布类型执行 <code>docs/DEPLOY.md</code>；保留回滚；公网冒烟</td><td>Web-only发布等待后端任务清零</td></tr></tbody></table></div><p>同一次提交中若包含多类改动，采用最高相关风险，不叠加无关门禁。</p><h2>4. UI/UX 验收</h2><p>页面至少覆盖：初始/空、可编辑、AI工作中、待作者决定、已完成、失败与恢复。每个状态只有一个显著主操作，次要操作不抢层级。</p><p>手机优先检查 360、390、430px：</p><ul><li>无非预期横向滚动；正文和输入区可读；固定区域不遮住主内容。</li><li>主要触控目标约44px；输入字号不小于16px；键盘弹起后焦点和提交按钮仍可达。</li><li>长文本、长书名、任务进度、错误提示不会把页面撑坏。</li><li>页面标题、当前对象、当前状态和下一步操作可以在首屏快速理解。</li></ul><p>桌面端检查层级、密度、键盘焦点、空白和长内容；不以堆卡片、堆说明或重复导航来填满页面。</p><h2>5. 分层创作验收</h2><ul><li>开书、设定、卷、事件、章纲、正文与结算职责不串层。</li><li>作者可以接受、选择片段、融合、编辑、留空或重做；刷新后选择和确认版本不漂移。</li><li>未确认候选、其他书、独立灵感、过期版本不进入正式下游上下文。</li><li>第一卷的前500字、黄金三章和重大高潮职责能逐层找到承载对象，但具体手段保持题材差异。</li><li>事件和章节衔接读取上一实际结果，不只重复上游计划。</li><li>普通作者只看白话故事责任，不看内部结构方法、模型/任务ID或机器合同。</li></ul><h2>6. AI与长篇质量证据</h2><ul><li>E0：规格存在。</li><li>E1：机制/字段存在。</li><li>E2：确定性工程链路与自动测试通过。</li><li>E3：真实模型、多样本或独立阅读证据通过。</li><li>E4：真实长篇分阶段阅读与连续性验证通过。</li></ul><p>只做到E1/E2时可以声明“工程实现完成”，不能声明“文学质量、爆款效果或长期稳定性完成”。真实长篇验收仅在用户明确要求时按20/50/100/200章或指定规模执行，不是日常开发门禁。</p><h2>7. 重大缺陷</h2><p>出现下列任一项不得宣布完成：跨用户/跨书泄漏、作者原文被覆盖、未授权永久删除、明文密钥/会话泄漏、旧数据无法进入且无迁移/恢复、主流程阻断、生产服务不可用、用户被困在无恢复动作的失败状态。</p><p>视觉偏好、次要文案和可继续优化项应如实记录，但不与安全或数据阻断混为同一级别。</p><h2>8. 文档与Skill</h2><p>当前规则只描述生效状态；历史证据在 Git。Skill 主文件保持短，参考按任务路由。当前规格、规则或Skill改变时运行：</p><pre class="code-block"><code data-language="powershell">node scripts/sync-project-docs.mjs
node scripts/sync-project-docs.mjs --check</code></pre><p>旧的A—J 148项表、200章事故证据与阶段发布日志已归档，仅在专项复核时使用，不再阻塞普通功能和UI迭代。</p></template><template id="document-10" data-title="AI团队与介入规则" data-path="docs/AGENT_SYSTEM.md" data-meta="当前正式文档 · 10.0 KB · d97c04e1cb4e"><h1>AI团队与介入规则</h1><h2>1. 团队组成</h2><p>每本书保持14名创作成员；岗位、Agent实例和模型绑定相互独立。同一个模型可以承担多个岗位，但界面必须如实显示，不能冒充异模型意见。</p><ol><li>主编 貂蝉：决定全局优先级，组织卷纲、事件和融合；负责事件与卷的节奏体检。</li><li>副编 西施：资料员、摘要员和主编备份。代表确定性 <code>ContextCompiler</code> 的资料准备职责，负责编译、压缩、去重、标注来源和排除项；不做事实判断，也不垄断数据库或检索。只有真实调用副编模型时，团队页才显示副编正在工作。</li><li>编剧A 婉儿：偏强冲突、爽点节拍和快速推进。</li><li>编剧B 红玉：偏递进、人物关系、铺垫和因果。</li><li>编剧C 幼薇：偏脑洞、反套路和题材化新鲜感。</li><li>设定 文姬：检查世界、规则、能力、资源和命名体系。</li><li>主笔 秋香：当前活动正文写手。</li><li>副笔 湘君：候补写手或局部润色，不默认串行重写整章。</li><li>事实审查 班昭：设定、正史与因果事实核对，固定承担正文审查事实席。</li><li>文学审查 妲己：语言、节奏、场景、重复和人物声音。</li><li>体验审查 昭君：目标读者视角的代入、期待、爽点、困惑和弃读风险。</li><li>体验·挑剔读者 妙玉：老白读者视角的毒点、吐槽点和弃读风险找茬。</li><li>研究 道韫：只为明确事实研究任务提供有来源资料，不决定剧情。</li><li>来源与版权 弄玉：执行来源、授权、原创性和风险检查，不设置独立页面。</li></ol><p>小文秘书是本地确定性工具角色，不属于14名创作成员，不给剧情结论、不冒充模型、不保存聊天记忆。</p><h2>2. 介入时机</h2><div class="table-scroll"><table><thead><tr><th>阶段</th><th>主持/执行</th><th>其他成员</th><th>输出</th></tr></thead><tbody><tr><td>开书</td><td>系统确定性校验</td><td>无</td><td>书籍、定位版本、团队、预算、设定任务</td></tr><tr><td>设定项</td><td>主编＋两位编剧独立提案</td><td>设定按需要检查</td><td>三份候选、作者选择、主编整理稿</td></tr><tr><td>分卷</td><td>主编主持</td><td>两位异模型编剧独立设计，设定/研究按需</td><td>卷候选、差异、融合稿</td></tr><tr><td>事件链</td><td>主编</td><td>两位编剧</td><td>事件序列、因果衔接、卷任务覆盖</td></tr><tr><td>事件大纲</td><td>主编融合</td><td>两位编剧独立方案，设定按需</td><td>当前事件完整大纲</td></tr><tr><td>章纲</td><td>指定编剧生成主方案</td><td>作者可选红玉或幼薇中任一位只挑战关键转折、冲突或钩子；设定/事实按需预检</td><td>完整事件章链、单章章纲；至多3条不自动采纳的挑战建议</td></tr><tr><td>正文</td><td>单一活动写手</td><td>设定/研究只提供证据</td><td>单章正文候选</td></tr><tr><td>审查</td><td>三席并行</td><td>事实席由班昭固定承担，文学、体验两席按异模型规则选座；三席互不读取，写手与三审合计四个不同模型来源；挑剔读者（妙玉）不进固定席，作者在正文页按需点&quot;请挑剔读者找茬&quot;单独跑，结果只供参考不卡定稿</td><td>各席独立报告</td></tr><tr><td>结算</td><td>确定性结算＋必要抽取</td><td>主编查看事件/卷偏差，并在结算完成后出节奏体检报告；副编写大白话摘要</td><td>事实、状态、伏笔、摘要、下一层承接、节奏体检报告</td></tr></tbody></table></div><p>各阶段提示词统一注入&quot;本书题材简报&quot;（频道、分类、融合题材、标签、基调、节奏策略、目标读者），简报只取自作者已确认的开书信息；岗位身份不随题材更换。</p><h2>3. 独立性</h2><p>两位编剧独立阶段互不可见，不交叉投票；主编只有在独立结果全部保存后才读取并融合。审查席使用与活动写手不同的模型，彼此不读取报告；每章固定三席（事实由班昭固定承担，文学、体验按异模型规则选座），写手与三审合计四个不同模型来源；妙玉作为挑剔读者不进固定席，正文页按需找茬、结果只供参考（DEC-CURRENT-067）。幼薇参与灵感讨论并可在章纲阶段由作者指定挑战候选；三编剧提案管线由后续批次接入。模型不可用或实际来源重复时必须明确降级或阻断，不能伪装独立；没有真实创作模型时，设定、分卷、事件、章纲、正文、审查、灵感和续写分析都不能用本地确定性夹具冒充成员工作。</p><h2>4. 创造性边界</h2><p>上层规划提供目标、边界、因果和必须项，不规定每句写法。AI可以提出有代价的偏离方案；局部合理发挥可以直接执行，影响卷目标、事件结果、人物核心选择或正史规则的偏离必须先给作者看影响。</p><p>模板只是软参考。岗位提示词不得把质量规范、评分表或固定叙事结构全文注入模型，也不得要求每章同时满足所有爽点和审查指标。</p><p>章纲挑战者不是第二套正式方案，也不参与自动融合。它只能针对作者指定的章链候选或单章章纲版本，提出少量替代思路及收益、代价和后续影响；作者可以忽略，只有作者主动修改或重新生成后，内容才会进入正式对象。</p><p>副编与文姬的职责必须分开：副编/<code>ContextCompiler</code>只准备可追溯资料；文姬是使用该资料进行设定判断的模型；正文事实核对由班昭承担。正文的占位符、格式、字数、内部治理口吻和最近章节大段复用等硬检查由确定性代码执行，不属于任何AI成员。质量规则只进入检查与审查，不进入主笔小说正文。 主笔调用只接收自然语言的资料角色、是否必须遵守和内容正文；来源ID、版本、哈希、优先级、检索理由与Token统计保存在后台ContextPack和调用审计，不进入主笔创作提示。状态面板只有在真实任务和真实模型调用发生时才显示工作中；模型未连接时统一显示“创作模型尚未连接”，不展示夹具名称或内部模型ID。</p><h2>5. 真实状态</h2><p>状态由任务、上下文编译、模型调用、心跳和保存事件驱动：等待、准备中、工作中、完成、失败、超时、已取消、等待作者。界面不得用计时器或文案伪造工作。</p><h2>6. 失败与恢复</h2><ul><li>确定性失败可在幂等键和检查点保护下重试。</li><li>远程结果未知不自动重试，先调和。</li><li>正文主笔一次调用失败后只允许同一模型再试1次；供应商结果未知时不盲重试。两次明确技术失败、超时或不可用后，副笔才可按同一冻结资料包接管且最多1次。作者不满意风格不属于技术失败。</li><li>已完成成员意见复用，未完成成员单独重做。</li><li>主编租约变化后旧结果必须通过epoch门禁。</li><li>作者退回时保留满意部分，修订只读取明确反馈和当前候选。</li></ul><h2>7. 追溯</h2><p>每个结果能追溯到任务、Agent、岗位、模型快照、上下文包、作者输入、上游版本、预算和输出哈希。不保存模型内部思维链。</p><h2>8. 思考与输出预算（2026-08-18 评估定稿，当晚复核翻倍）</h2><p><strong>设计结论：注意力保护放在输入侧，输出侧保持宽松上限。</strong></p><ul><li>输入侧（资料包）有界：讨论主编 7.2k Token（设定成组 16k）、成员 8k、章管线按上下文包预算编译。资料过多会分散注意力，这一侧不放宽。</li><li>输出侧（max_tokens 与思考预算）是上限而非目标：模型写够即停（end_turn），宽松上限不会拉长输出、不影响注意力；上限过紧才会截断 → 结构校验失败 → 重试 → 双倍计费并中断任务（2026-08-18 生产多次实测）。</li><li>思考预算是&quot;必然要花&quot;的额度（模型基本用满预算），可见输出是&quot;用多少算多少&quot;的封顶。</li></ul><p><strong>当前取值</strong>：</p><div class="table-scroll"><table><thead><tr><th>项目</th><th>值</th><th>依据</th></tr></thead><tbody><tr><td>思考预算（全部套餐模型、全部用途统一）</td><td>16,000 Token</td><td>方舟六个在役模型实测接受 enabled+budget 且预算生效；disabled 反被 glm-5.3/kimi 拒绝；老板复核后从 8,000 翻倍——预算是上限，用多少算多少，只保证复杂任务不被思考额度截断</td></tr><tr><td>讨论可见输出：阶段抽卡/交叉质疑/普通成员地板</td><td>6,000</td><td>上限是天花板不是目标；宽松不拉长输出，过紧才会截断重试</td></tr><tr><td>讨论可见输出：编剧独立方案</td><td>4,000</td><td>完整方案的实测尺寸</td></tr><tr><td>讨论可见输出：主编通用 / 设定成组融合 / 剧情总纲 / 滚动章纲</td><td>3,600 / 8,000 / 6,000 / 6,500</td><td>均为真实截断事故后调出的最小安全值</td></tr><tr><td>章管线：正文 draft/rewrite / 审查 / 主编汇总 / 其他</td><td>8,000 / 6,000 / 6,000 / 4,000</td><td>正文合同 2700-3200 有效字符 ≈ 3-4k Token，重写须返全章</td></tr><tr><td>卷纲 / 事件章纲（章链/细化）</td><td>12,000 / 12,000、9,000</td><td>十事件卷纲与多章章纲的实测尺寸</td></tr><tr><td>结算后续 / 主编设计 / 续写分析</td><td>4,000、6,000 / 4,000 / 8,192</td><td>结构化报告的实测尺寸</td></tr></tbody></table></div><p><strong>调用侧不变量</strong>：max_tokens = 可见输出上限 + 16,000 思考预算；八处预算冻结必须追加同一份思考预算（thinkingTokenAllowance），否则结算端以&quot;实际用量超过冻结上限&quot;拒绝。调整任何一侧时两侧必须同时改。</p><p><strong>额度考量</strong>：两个方舟套餐是包月额度。思考预算提到 16k 后，一轮四人讨论最坏多耗约 6 万 Token，占 3,000 万套餐的 0.2%，可忽略；截断重试一次的浪费远大于思考预算本身。预算是上限不是定量，只有模型真实使用才计费。</p><h2>分层设计中的AI介入</h2><ul><li>设定三席只在作者点击召集后工作，输出可整份选择或按片段组合；主编只整理作者选中的内容。</li><li>分卷两位编剧接收系统冻结的不同内部骨架，各自写成大白话具体路线；主编比较和融合，但专业方法名不得进入作者界面。</li><li>事件编剧只在活动卷路线与事件链边界内设计当前小故事；阅读感受是不选或单选的软参考。</li><li>章纲编剧把卷与事件职责拆成连续章链；第一卷前三章和首章前500字职责必须继续向下传递。</li><li>写手接收当前章完整任务、最近1—3章、线程账本和按需资料，在对白、动作、意象和场景细节上保留自由；三席审查仍互不读取报告。</li></ul></template><template id="document-11" data-title="当前API与事件契约" data-path="docs/API.md" data-meta="当前正式文档 · 12.3 KB · abb50efa0321"><h1>当前API与事件契约</h1><h2>1. 通用规则</h2><ul><li>前缀：<code>/api/v1</code>；健康检查为 <code>/health</code>。</li><li>API仅监听 <code>127.0.0.1</code>；公网由同机HTTPS反向代理转发 <code>/api</code>，不得直接暴露API、SQLite或Worker端口。</li><li>所有书内接口从路径获取 <code>bookId</code>，服务端从已验证登录会话绑定 <code>owner_id</code>；客户端不能提交或替换所有者。</li><li>后台、Worker和旧缓存前端继续使用稳定内部错误码；当前作者前端为普通 <code>/api/v1</code> 请求发送 <code>x-wenmi-author-projection: clean-v1</code>，成功响应只保留作者业务对象，失败响应只返回自然语言 <code>message</code>、业务恢复 <code>action</code>、<code>retryable</code> 与不透明 <code>recoveryKey</code>，不得返回内部错误码、详情、路径、SQL、模型或Worker状态。</li><li>创建/生成命令使用幂等键；版本化修改携带期望版本，冲突返回409。</li><li>长任务返回任务ID，通过任务查询和SSE观察，不在HTTP连接中假装同步完成。</li></ul><h2>2. 运行与能力</h2><ul><li><code>GET /health</code>：公开的API、轻量数据库探针与Worker心跳状态；不创建账号会话，也不在高频探针中执行全库扫描。</li><li><code>GET /api/v1/runtime/worker</code>：Worker心跳和队列状态。</li><li><code>GET /api/v1/runtime/readiness</code>：数据库、迁移、模型与投影准备度。</li><li><code>POST /api/v1/auth/register</code>：邮箱、密码、昵称注册；首个账号原子授予管理员角色，并在存在未认领本机老板数据时接管该所有者；后续账号创建全新独立所有者并签发会话。</li><li><code>POST /api/v1/auth/login</code>：邮箱密码登录，成功后签发 HttpOnly Cookie。</li><li><code>POST /api/v1/auth/logout</code>：撤销当前会话并清除 Cookie。</li><li><code>GET /api/v1/auth/me</code>：读取当前账号公开资料与角色。</li><li><code>GET /api/v1/admin/overview</code>：管理员查看用户与书籍总览。</li><li><code>GET /api/v1/admin/audit/books/:bookId/tasks/:taskId</code>：管理员按书籍和任务读取完整任务、阶段、模型调用、工具调用与内部方法审计；普通作者路由没有该投影。</li><li><code>GET /api/v1/admin/users</code>：管理员按关键字和状态查看账号。</li><li><code>PATCH /api/v1/admin/users/:userId/status</code>：管理员暂停或恢复账号。</li><li><code>GET /api/v1/membership/me</code>：当前账号会员状态（套餐、算力值配额/已用/剩余、到期时间）；管理员返回 <code>isAdmin: true</code> 不限额。</li><li><code>GET /api/v1/admin/memberships</code>：管理员查看全部账号的会员与算力值消耗（周期内消耗与累计消耗）。</li><li><code>POST /api/v1/admin/memberships/:userId</code>：管理员开通或续费会员，Body使用 <code>plan</code>：<code>bronze</code>（青铜20万算力值，长期体验）/<code>silver</code>（白银2000万）/<code>gold</code>（黄金5000万）/<code>diamond</code>（钻石2亿）；付费档当前周期12个月。算力值=真实token×2，普通作者页面不出现token口径。</li><li><code>POST /api/v1/admin/memberships/:userId/revoke</code>：管理员撤销会员。</li><li>生成门禁：账号体系内的非管理员用户必须持有生效会员且周期内算力值未用完，否则任务创建返回 <code>MEMBERSHIP_REQUIRED</code>、<code>MEMBERSHIP_EXPIRED</code> 或 <code>MEMBERSHIP_QUOTA_EXHAUSTED</code>（403，附管理员联系方式）。</li><li><code>GET /api/v1/capabilities</code>：当前检索和运行能力；普通作者投影不返回模型配置，管理员通过独立管理接口查看。</li></ul><h2>3. 书架与开书</h2><ul><li>书籍草稿：创建、更新、确认。</li><li><code>GET /api/v1/books</code>：书架。</li><li>书籍详情、开书资料、定位、表达基线、归档、恢复和彻底删除。</li><li><code>POST /api/v1/books/:bookId/branding-designs</code>：主编依据第一卷已确认方案、设定基线和开书信息设计书名或书籍简介候选（<code>kind</code> 为 <code>title</code> 或 <code>synopsis</code>）；第一卷未确认返回409并提示先设计第一卷。</li><li><code>GET /api/v1/books/:bookId/branding-designs/latest?kind=</code>：当前类型最新一轮主编设计及其候选。</li><li><code>GET /api/v1/opening-taxonomy</code>：频道、分类、题材和标签目录。</li><li><code>GET /api/v1/books/:bookId/workflow</code>：当前卷—事件工作流状态。</li></ul><p>确认开书会原子创建书籍、定位版本、团队、模型绑定、预算、设定工作区和首个设定任务。</p><h2>4. 设定对象协作</h2><ul><li><code>GET /api/v1/books/:bookId/setting-outline-workspace</code>：当前设定工作区。</li><li><code>GET /api/v1/books/:bookId/setting-outline-workspace/:itemKey/collaboration</code>：当前项AI方案与任务。</li><li><code>POST .../collaboration/start</code>：主编和两位编剧独立提案。</li><li><code>POST .../collaboration/synthesize</code>：按作者选中的方案整理候选。</li><li><code>POST .../collaboration/revise</code>：按作者本轮意见修订候选。</li><li>设定项确认、跳过/留白和整份设定基线确认使用独立命令。</li></ul><p>这些接口直接读写当前设定对象、候选、作者选择和确认结果。</p><h2>5. 作者想法与附件</h2><p>作者想法按 <code>surface</code>、<code>subjectType</code>、<code>subjectId</code> 附着开书、设定、卷、事件链、事件、章纲或正文，并保存原话、意图等级、版本和状态。事件链使用 <code>surface=event</code>、<code>subjectType=event_sequence</code>、<code>subjectId=volumePlanId</code>；生成接口接收对应 <code>authorInputRefs</code>，同时继承确认卷方向仍有效的作者原话。附件使用 <code>/author-attachments</code> 上传、读取、绑定和丢弃。</p><h2>6. 分卷</h2><p><code>/api/v1/books/:bookId/volume-plans</code> 提供列表、创建和详情。单个卷计划支持：作者输入、候选、AI生成任务、选择/融合、确认、历史切换、影响预览和结算。所有修改校验工作流版本与上游设定版本。</p><p><code>GET /api/v1/books/:bookId/planning-templates?scope=volume|event</code> 返回后端统一模板注册表的公开投影、版本和哈希。推荐排序输入只来自该 <code>bookId</code> 的开书资料、当前活动卷和最近真实卷结算；推荐标记只改变展示顺序。客户端保存规划时提交所选模板版本、哈希和混合引用快照；自定义和不使用模板不绑定系统模板。</p><h2>7. 事件链与事件大纲</h2><p><code>/api/v1/books/:bookId/volume-plans/:volumePlanId/story-events</code> 管理事件列表、顺序、插入、移动、拆分、合并、候选生成、确认和因果衔接。单个事件通过 <code>/story-events/:eventId</code> 获取详情、生成事件大纲和执行事件结算。</p><h2>8. 当前事件章纲</h2><p><code>/api/v1/books/:bookId/story-events/:eventId/chapter-outlines</code> 管理章数评估、批量章链候选、单章详细章纲、作者修改、确认和历史版本。生成任务冻结活动卷纲、事件链、事件大纲和作者输入。</p><p><code>POST /api/v1/books/:bookId/story-events/:eventId/chapter-sequence/versions/:sequenceVersionId/challenge</code> 请求另一位编剧挑战当前章链候选；<code>POST /api/v1/books/:bookId/story-events/:eventId/event-chapter-outlines/:outlineId/versions/:outlineVersionId/challenge</code> 挑战当前单章章纲。<code>GET .../chapter-sequence/generation?kind=sequence_challenge|detail_challenge</code> 读取当前建议任务。结果只含目标版本、自然语言摘要和最多3条替代建议，不创建正式章纲版本，也不自动采纳。</p><h2>9. 正文与审查</h2><p>章节接口提供目录、写作工单、单章生成、状态、稿件版本、作者编辑、定点修订和定稿。正式生产一次只处理一章。三席报告分别读取和展示；作者定稿后才能执行章节结算。</p><h2>10. 续写与反向拆解</h2><p>已有正文接口支持文件/文本导入、解析预览、章节顺序确认、不可变入库、分析任务、来源查看和反向规划候选。分析完成后通过设定、卷、事件和章纲对象继续。</p><h2>11. 图谱、资料库、检索和取名</h2><p>按书提供人物状态、实体、事实、关系、时间线、伏笔、来源、缺口、图谱投影、混合检索和命名候选。检索响应标注来源、版本、证据等级和降级状态；不暴露其他书结果。</p><p><code>GET /api/v1/books/:bookId/library</code>返回独立的<code>settings</code>设定来源、<code>supportingCharacters</code>配角集合、正式<code>entities/facts</code>、按已结算事件聚合的<code>timeline</code>，以及<code>supportingCharacterProfiles</code>、<code>organizationProfiles</code>、<code>locationProfiles</code>、<code>itemResourceProfiles</code>和<code>worldMap</code>类型化公开视图。<code>supportingCharacters</code>及配角档案排除主角档案已绑定实体或同名实体；内部实体类型仍使用稳定键<code>character</code>。档案字段值携带来源章节，缺失字段返回空数组，不由接口补造。<code>worldMap</code>只从地点正式出场、明确出生地和作者初始地图说明构建大范围路线，方向无证据时为<code>null</code>。时间线保留后台结算摘要和规划归属供审计，同时提供<code>display_time</code>：正文有故事时间时使用故事时间，否则回退章节范围；作者页面只显示<code>display_time + event_title</code>。分类页不得自行按关键词把<code>settings</code>复制到势力、地点、道具或规则页，普通界面不得展示内部事实键或记录编号。</p><h2>12. 团队、任务与模型</h2><ul><li>团队模板、逐书成员、岗位公开说明、真实状态和模型绑定。</li><li>任务中心、任务详情、暂停、取消、失败重试和结果未知调和。</li><li>模型调用、预算和用量只显示可审计元数据，不返回密钥或思维链。</li></ul><h2>13. 备份、恢复和删除</h2><p>备份、导出、导入和恢复操作均有操作ID、状态和校验结果。普通删除为归档。彻底删除只允许已归档书，先查看影响，再输入大小写不敏感的 <code>YES</code> 并二次提交；服务端原子清理并写墓碑。</p><h2>14. SSE事件</h2><p>事件至少覆盖任务排队/开始/阶段/完成/失败/取消，模型调用开始/完成/中断，预算变化，投影水位，书籍版本变化和Worker心跳。事件只是状态通知，客户端重新读取正式对象作为最终状态。</p><h2>作者可见功能名合同</h2><p>接口向作者返回的功能名称统一为：信息、设定、分卷、规划、章纲、正文、资料库、取名、团队、任务、灵感、设置。公开显示名来自 Contracts 共享合同。</p><p>API路由、请求字段和数据库surface继续使用稳定英文键，不随显示名改动：book_profile、setting、volume_plan、event、chapter_outline、manuscript。这样已有书籍、幂等键、任务恢复、上下文包和来源引用不需要迁移。接口返回历史自由文本前必须经过作者展示清洗，把旧称转换为当前名称，但不回写历史记录。</p><h2>13. 认证与错误语义</h2><p><code>/health</code> 与注册/登录是公开入口；Worker内部执行使用独立Worker令牌；其他 <code>/api/v1</code> 接口都要求有效账号会话。写请求继续校验精确 Origin、Host、<code>Sec-Fetch-Site</code> 和 JSON 内容类型。登录失败统一返回“邮箱或密码不正确”，不泄露邮箱是否存在；暂停账号返回明确联系管理员提示；无效或空 JSON 返回自然中文格式错误，不向前端暴露堆栈、SQL或内部路径。</p><p>当前作者端错误合同按业务动作恢复，不按机器错误码分支：会员问题返回开通/续费/补充算力动作，设定质检问题返回查看问题动作，登录失效返回刷新登录动作，其余失败返回安全重试或返回修改动作。旧缓存前端未发送洁净投影头时继续收到向后兼容的旧结构，但其中供应商、模型和原始错误详情也必须使用安全占位，不能泄漏真实内部值。</p><h2>14. 分层设计的作者投影</h2><p>设定协作接口使用稳定proposalId接收整份方案与片段选择，融合请求可同时提交wholeProposalIds、selectedFragments和作者文字。作者响应只返回方案正文、理由、收益、代价、成员显示名和可恢复任务键；供应商、模型内部ID、讨论任务ID和决策ID只在审计接口保留。</p><p>洁净投影由API <code>onSend</code>统一递归完成，覆盖普通JSON与SSE；它删除owner/source内部ID、供应商/模型、任务阶段、模型与工具调用、内部方法版本/指纹、原始错误、路径和堆栈，并把剩余任务/讨论键改名为恢复/协作业务键。Web只在内存中为旧组件恢复兼容别名，网络响应和浏览器缓存都不重新出现被删除字段。管理员审计走独立 <code>/api/v1/admin/audit/...</code> 物理路由并再次校验管理员身份。</p><p>卷规划内容向后兼容增加routeCard、storySpine和firstVolumeLaunch。第一卷生成候选必须包含三章开篇职责和重大高潮字数上限；旧客户端省略这些字段时仍能读取旧版本和保存原有字段，后端字段只增不删。</p><p>公开事件软参考不返回专业来源字段。事件大纲生成最多接收一个阅读感受选择；旧请求中的选择数组继续可解析，但只采用明确的主选择，不能拼接多套完整节拍。</p></template><template id="document-12" data-title="系统架构" data-path="docs/ARCHITECTURE.md" data-meta="当前正式文档 · 8.4 KB · 3d86082fe745"><h1>系统架构</h1><h2>1. 总体形态</h2><p>统一账号的模块化单体加独立 Worker：</p><pre class="code-block"><code data-language="text">React/Vite Web → Fastify REST/SSE → Application Services → Repositories → SQLite/Files
                                      ↓ outbox/tasks
                                  Independent Worker → Model adapters / projections</code></pre><p>Fastify API 与 Worker 协调端口继续只监听 <code>127.0.0.1</code>。本机由浏览器直接访问；公网部署由同机 HTTPS 反向代理接收域名流量并转发到回环端口，数据库和 Worker 不直接暴露。不使用微服务、WebSocket或需要独立运维的向量/图数据库。</p><h2>2. 模块边界</h2><ul><li>Web：统一创作台、书籍切换、对象编辑、团队/任务状态、隔离灵感、报告和辅助工具。</li><li>API：认证、校验、领域命令、查询投影、任务排队、SSE。</li><li>Worker：领取长任务、编译上下文、调用模型、保存候选和重建投影。</li><li>Contracts：跨端共享的请求、响应和事件类型。</li><li>Repositories：业务代码访问SQLite的唯一入口；新增应用服务不得直接写SQL。</li><li>Files：不可变正文、导入原件、附件、备份和可重建投影文件。</li></ul><h2>3. 当前工作流编排</h2><p>开书、设定、卷纲、事件、章纲、正文和结算分别使用明确领域对象与版本链。任务冻结上游版本、作者输入、模型绑定、预算和上下文包。上游改变时下游候选失效或重新确认，不静默沿用。</p><p>对象页面直接启动正式AI任务并展示结果；正式生产不依赖聊天入口、消息回复流水线或会话记忆。灵感是隔离的辅助域，只保存讨论轮次和引用，不能调用正式对象写入；只有作者主动摘录并绑定业务对象后才转成 <code>author_planning_inputs</code>。</p><h2>4. 写入模型</h2><p>SQLite使用单写者事务、外键、WAL和向前迁移。每项核心写入携带 <code>owner_id</code>、<code>book_id</code>。跨书访问在Repository入口校验。并发投影短暂占用写锁时，只允许上下文包落库与同任务附件绑定做有限、可观测的锁冲突重试；非锁错误立即失败，达到次数后保持原任务可恢复，不能无限重试或掩盖数据错误。</p><p>正文使用不可变完整版本。Worker只能保存任务结果、候选、调用记录和投影，不得直接覆盖正式正文或正史。作者确认由API事务提交。</p><h2>5. 任务与恢复</h2><p>任务状态：pending → queued → working → succeeded/failed/cancelled/paused/blocked。领取使用租约、attempt编号和lease token；模型结果提交还校验主编epoch。结果未知时冻结并等待调和，不盲目重试远程调用。</p><p>每次模型调用保存：任务、Agent、模型快照、输入哈希、上下文包、预算预留、耗时、Token、结果哈希和最终状态。不保存思维链。</p><p>长篇规划、审校等慢推理调用的HTTP响应头与响应体等待上限必须与模型业务超时一致，当前最高15分钟；连接建立仍最多30秒。任何一层先中断且无法确认供应商结果时继续记为结果未知，不能因放宽传输等待而自动重放。</p><h2>6. 上下文与检索</h2><p>确定性 ContextCompiler 按任务编译资料：先取活动版本与结构化直达，再按实体、时间、因果、伏笔、声音和来源触发混合检索。SQLite是正式源；FTS、LanceDB、Wiki、图谱和摘要都是可重建投影。</p><p>检索永远携带书籍隔离键；其他书、未摘录灵感、过期版本、无关候选和模型猜测不能进入生产上下文。灵感自己的检索只读取当前书已确认正式源，不能读取其他讨论会话作为事实。</p><h2>7. 模型与Agent</h2><p>岗位、Agent实例和模型绑定分离。卷纲与事件规划可并行调用两位互不可见的异模型编剧，随后由主编融合；正文只有一个活动写手；事实、文学、体验三席使用三异模型独立审查。</p><h2>8. 文件与附件</h2><p>作者附件绑定具体开书、设定、卷、事件、章纲或正文对象。原件不可变，解析文本和预览可重建；公开API和运行时统一使用作者附件语义。</p><h2>9. 前端架构</h2><p>Web保留账号/书籍归属、创作对象路由、主工作区和按需上下文四类职责，具体使用左栏、顶部栏、抽屉、分段导航或面板由UI/UX持续调整。布局不能成为业务状态来源；路由、活动对象和持久任务状态才是来源。</p><p>桌面可使用临时双栏比较或上下文面板，手机转换为抽屉、全页编辑和顺序比较。正文与长列表按需要虚拟化/分页。任务通过持久状态和SSE更新，不伪造进度；普通作者只看自然业务状态，管理员审计保留内部证据。</p><p>移动端高度以<code>visualViewport.height</code>同步CSS变量，不依赖固定视口猜测键盘高度；焦点和可视视口变化时让当前控件与主操作可达，无<code>visualViewport</code>时安全降级。</p><h2>10. 构建与可达性</h2><p>启动入口为API、Worker、Web和共享Contracts。验证按 <code>docs/ACCEPTANCE.md</code> 的风险矩阵执行：单页UI只验证Web相关范围；数据、权限、迁移、跨服务恢复或核心工作流变化才运行四端全量门禁。发布时按Web-only或API/Worker/迁移类型选择 <code>docs/DEPLOY.md</code> 对应流程。</p><h2>11. 作者展示门禁</h2><p>Web 的 <code>AuthorPresentationGate</code> 是作者可见动态内容的统一边界：结构化内容递归过滤技术字段，状态与错误映射为自然语言，未知机器值使用安全兜底；业务对象、API响应和数据库原件不在展示层被改写。门禁区分界面、进度、错误和故事文本，故事文本与作者原话只剥离机器协议，禁止全局术语替换改变叙事语义。</p><p>API在展示层之前再设置网络洁净投影边界：当前Web对普通作者请求和SSE发送<code>clean-v1</code>能力头，Fastify统一删除任务/讨论/模型/方法/错误内部字段并只保留业务恢复动作；旧缓存前端不发能力头时走兼容结构。兼容别名只在新Web内存中恢复给既有组件，不能重新写入网络缓存。完整任务、阶段、模型、工具和方法证据只由独立管理员审计路由返回。</p><h2>12. 账号、会话与管理后台</h2><p>认证属于基础设施边界，但账号状态和管理员权限由应用服务判定。<code>user_accounts</code> 一对一关联 <code>owners</code>；首次注册在事务内优先复用尚未认领且含本机书籍的历史老板所有者，后续注册创建新所有者。升级库只重新绑定唯一空管理员的所有者关系，不批量改写任何创作表。<code>auth_sessions</code> 只保存随机令牌的 SHA-256 摘要；密码使用每账号独立盐值的 scrypt 摘要。浏览器通过 HttpOnly、SameSite=Lax Cookie 维持会话，HTTPS 部署额外启用 Secure。所有业务路由在进入应用服务前从会话解析 <code>user_id + owner_id + role</code>，领域路由不再读取固定配置所有者。</p><p>首个注册使用 <code>BEGIN IMMEDIATE</code> 原子判断并授予管理员角色。管理员路由只提供统计、用户检索、暂停和恢复；暂停用户时撤销其所有活动会话。不能暂停当前管理员自己或最后一个活动管理员。测试注入身份只存在于受控测试配置，不进入生产路由。</p><p>公网保持单域部署：<code>https://wenmixiezuo.com</code> 同时承载 Web 与 <code>/api</code>，反向代理负责 TLS、请求大小、访问日志脱敏与外围限流。API、SQLite、文件、LanceDB 和 Worker 仍位于服务器本机回环/本地文件边界。完整部署步骤见 <button type="button" class="inline-doc-link" data-open-document="document-18">DEPLOY.md</button>。手机号、微信以后作为登录身份绑定到现有 <code>user_id</code>，不能建立第二套书籍所有权。</p><h2>分层规划与上下文编译</h2><p>设定工作区固定四个核心模块，并保留可扩展的可选模块。卷版本可携带具体路线、故事脊柱和第一卷开篇计划；旧卷版本缺少这些可选字段时仍可读取和编辑。内部叙事方法注册表只服务方案编排、版本快照和审计，作者API投影不返回专业来源。</p><p>ContextPack来源清单新增约束强度、真值状态、业务范围和依赖。硬事实与当前任务进入不可裁剪区；相关可选设定以全文进入，其他可选设定只进入延后目录。编译器先做同源去重和低相关软资料淘汰，不能用头尾截断伪装成功。</p><p>卷路线由卷规划服务生成，事件与章纲只读取已确认路线并逐层落实。第一卷开篇职责从卷版本向事件章链、单章章纲和正文任务传递；任何下层都不能重新发明另一条卷路线。</p></template><template id="document-13" data-title="长篇小说资料切片最终设计" data-path="docs/CHUNKING_DESIGN.md" data-meta="当前正式文档 · 23.7 KB · 1ff34cb4217a"><h1>长篇小说资料切片最终设计</h1><h2>1. 明确结论与置信度</h2><p>文秘写作采用“不可变原始资料＋结构节点＋父子检索块＋原子事实”的多粒度切片，不采用整章单块、全资料统一固定字数或无条件重叠。切片只负责定位和取回资料，不能替代原文、事实、规划层级或正史版本。</p><p>设计结论置信度为高：结构优先、父子检索、原子事实、来源回链、版本化快照和最小充分扩展能够直接对应长篇小说的语义边界、故事时间、人物认知和注意力问题。具体字符目标值置信度为中：本文给出可运行的初始默认值，但默认值必须在目标电脑和独立中文小说金标上与固定切片、纯语义切片比较后锁定。参数调优属于版本化实现配置，不重新决定权威架构。</p><p>本设计已在当前长篇release实现为 <code>content_chunks</code>、分类型结构切片、FTS/LanceDB可重建投影和多来源切片快照原子切换，并取得500万字符/1500章E2工程证据。当前机器未发现已验证本地嵌入资产时向量通道如实降级；E2不能冒充E3语义金标或E4文学质量提升。</p><h2>2. 当前事实基线</h2><ul><li>正文已经使用不可变完整文件和内容哈希，SQLite保存业务权威与文件指针。</li><li>当前运行时检索只有结构化事实、SQLite FTS5/BM25和固定同义词扩展；尚无真实向量、父子块或分类型切片。</li><li>DEC-012已确定SQLite权威源、LanceDB可重建向量投影、SQLite关系/Wiki和混合检索；DEC-016已确定临时、候选、正史、派生四层生命周期。</li><li>目标单书规模为500万规范化中文字符、1500章；较早卷和事件默认使用结算摘要导航，关键实体、规则、承诺、因果或冲突触发后下钻原文。</li><li>需要保护的不只是召回率，还包括人物声音、原创性、情绪力度、合理惊喜和整体阅读质量；大段历史正文可能提高事实覆盖却压低创作新鲜度。</li></ul><h2>3. 能力追踪矩阵</h2><div class="table-scroll"><table><thead><tr><th>痛点/可观察失败</th><th>根因</th><th>最终机制</th><th>最强反例</th><th>验证证据</th></tr></thead><tbody><tr><td>对白和回答被拆开</td><td>固定长度不理解语义单元</td><td>段落、对白轮次、动作—反应优先；字符数只作软边界</td><td>超长独白仍可能超过模型适合长度</td><td>边界完整率、人工错误集、召回对照</td></tr><tr><td>命中一小段却缺上下文</td><td>只有扁平块</td><td>场景根→场景节拍父块→检索子块；按问题有界扩父/邻块</td><td>父块过大仍会分散注意力</td><td>证据完整率、注入Token、位置敏感测试</td></tr><tr><td>同一段被重复召回</td><td>盲目文本重叠和多种派生重复</td><td>默认不复制重叠；使用前后邻接、来源范围和派生去重</td><td>边界查询可能因零重叠漏召回</td><td>与80—120字符重叠基线消融</td></tr><tr><td>“人物以为”变成客观事实</td><td>文本块没有观点与叙事模式</td><td>故事时间、视角、说话人、认知范围、回忆/梦境/计划元数据</td><td>自动抽取可能误判含蓄叙述</td><td>谎言、误解、反事实和不可靠叙述对抗集</td></tr><tr><td>正文修订后命中旧块</td><td>块和索引没有来源版本/水位</td><td>不可变切片快照、正史版本硬过滤、原子切换、旧快照失效</td><td>切换中断可能留下半成品</td><td>中断、重复执行、旧版本和重建故障注入</td></tr><tr><td>通用对白“你来了”检索错误</td><td>子块缺实体和场景语境</td><td>证据原文与嵌入文本分离；嵌入文本加入最小上下文头</td><td>头信息过多会形成标签锚定</td><td>无关键词、同句异人/异场景金标</td></tr><tr><td>检索更准但正文更像旧文</td><td>相似场景和风格片段注入过多</td><td>主笔只取最小硬证据和2—4条可选声音证据</td><td>过少证据可能丢失人物声音</td><td>全量包、最小包、硬事实包成对盲评</td></tr><tr><td>重复台词或意象被错误删除</td><td>全局内容哈希去重忽略叙事位置</td><td>原始位置均保留；只在单次结果中按来源/派生关系去重</td><td>真正重复噪声会占候选</td><td>重复、呼应、刻意复沓样本</td></tr></tbody></table></div><h2>4. 最强替代方案与取舍</h2><div class="table-scroll"><table><thead><tr><th>方案</th><th>优点</th><th>主要代价</th><th>结论</th></tr></thead><tbody><tr><td>固定500字符＋100字符重叠</td><td>实现最简单、易复现</td><td>切断对白/因果、重复多、跨结构污染</td><td>作为基线，不作为默认</td></tr><tr><td>整章或整场景单块</td><td>上下文完整</td><td>检索粒度粗、Token高、长场景注意力差</td><td>只保留导航父节点，不直接默认注入</td></tr><tr><td>纯模型语义切片</td><td>可识别复杂边界</td><td>非确定、成本和恢复一致性差，模型升级会改变全部边界</td><td>可作实验候选，不作为权威默认</td></tr><tr><td>纯句子/段落切片</td><td>来源精确</td><td>缺少场景上下文，多跳和隐含因果弱</td><td>作为叶子边界来源，不单独使用</td></tr><tr><td>结构语义＋父子块＋原子事实</td><td>同时支持精确召回、上下文扩展、确定性事实和可重建</td><td>Schema、切片器、快照和评测更复杂</td><td>最终采用</td></tr></tbody></table></div><p>最强替代是固定长度切片。它更便宜，但其错误恰好集中在小说最重要的对白、动作—反应、场景转折和叙事视角，因此只适合做可比较基线。推荐方案增加的复杂度全部位于可重建投影，不增加第二权威源。</p><h2>5. 预先验尸与反例</h2><p>假设方案在第1000章失败，最可能的传播路径是：边界识别把场景切错→向量只命中半个因果链→Wiki从半块抽取错误结论→上下文把错误投影交给编剧/主笔→新章进一步固化错误。修正是让重要结论必须回查原子事实或原文，并使切片、Wiki和向量都保持可失效投影。</p><p>其他高风险反例：</p><ul><li>一个场景跨越两个章节，若强行生成跨文件父块，会增加版本与恢复复杂度；因此章节仍是文件硬边界，用 <code>continues_scene_id</code> 连接连续场景。</li><li>一段超长独白、诗歌、书信或属性面板不能按普通段落处理；因此保留块类型并采用专用降级切分。</li><li>梦境、回忆、预言、人物计划和假想战斗语义相似，但故事时间和真实性不同；因此叙事模式与事实状态先于向量相似度过滤。</li><li>全局去掉相同文字会删除有意复沓、口头禅和伏笔呼应；因此不对不同来源位置做物理去重。</li><li>大量场景标题、标签和人物名拼入嵌入文本会提高表面召回但压倒正文语义；因此上下文头必须短、稳定、版本化，普通标签不拼入。</li><li>更细的块可能提高Recall@K，却使主笔收到碎片化材料并降低整体写作；因此检索指标和创作非劣效必须同时通过。</li></ul><h2>6. 修正后的最终设计</h2><h3>6.1 四种表示各司其职</h3><ol><li><strong>不可变原始资料</strong>：正式正文、设定、规划和历史稿件的完整文件，是最终证据。</li><li><strong>结构节点</strong>：书→卷→故事弧→章→场景→场景节拍，以及设定卡/规划节点。结构节点负责导航和范围，不必全部向模型注入。</li><li><strong>检索块</strong>：适合FTS和向量召回的子块，命中后按任务决定是否扩展父块、相邻块或关系节点。</li><li><strong>原子事实</strong>：主体—关系/属性—值—故事时间—观点主体—证据，处理生死、位置、知情、数量、关系和规则；语义检索只能帮助发现，最终判断使用结构化记录和原文。</li></ol><p>摘要、Wiki、向量和上下文头都属于派生投影，不得成为第五种权威。</p><h3>6.2 原文规范化和稳定来源定位</h3><ul><li>原文件保持UTF-8原样不可变。切片前只为索引生成独立 <code>index_text</code>：统一换行、Unicode NFC、移除BOM和无意义控制字符；不自动简繁转换，不统一标点，不改写作者空格、断句或措辞。</li><li>证据范围使用原始UTF-8 <code>start_byte/end_byte</code>、段落序号和内容哈希定位。<code>index_text</code> 必须保存回到原文范围的映射，不能把规范化文本直接当成引用证据。</li><li>每个来源版本保存 <code>source_hash</code>；每个块保存 <code>content_hash</code> 和 <code>index_text_hash</code>。来源哈希不一致时拒绝构建或使用该快照。</li><li><code>chunk_id</code> 在一个切片快照内唯一；新策略创建新快照和新块，使用 <code>supersedes_chunk_id</code>/来源范围追溯，不原地改变历史块。</li></ul><h3>6.3 正式正文层级与默认参数</h3><pre class="code-block"><code data-language="text">章节文件（权威）
└─ 场景根节点（完整导航范围，可很长）
   ├─ 场景节拍父块（上下文扩展单位）
   │  ├─ 检索子块
   │  └─ 检索子块
   └─ 场景节拍父块</code></pre><ul><li>场景根由明确分隔符、时间/地点/视角变化、叙事目标或主要冲突变化、行动—反应链闭合共同判断。只换说话人不构成新场景。</li><li>已确认章纲和场景契约只可作为边界提示，不能强迫已经写出的正文服从计划边界；实际原文结构与章纲不一致时保存偏离关系并以原文证据为准。</li><li>边界置信不足时不伪造精确场景，降级为同章段落组并标记 <code>boundary_confidence</code>；重要检索可以扩展邻块或回到章内原文。</li><li>场景节拍父块初始目标1200—3000个中文字符，软上限4500；完整短场景可以直接成为一个父块。父块主要用于有界扩展，不默认全部嵌入上下文。</li><li>检索子块软下限350、目标约500—600、软上限700、默认硬上限1000个中文字符。完整对白轮次、动作—反应对、句子和短诗节优先保持完整；语义单元略超软上限时允许保留。</li><li>超过硬上限的单段先按句子切；超长单句再按不破坏引号、括号、列表项和因果连接的分句切。超长独白各子块保持同一说话人和连续组ID。</li><li>实际嵌入模型的输入Token上限高于字符规则优先级：任何块连同上下文头超过模型安全输入预算时，必须继续按语义边界拆分，不能依赖模型静默截断。</li><li>过短段落只允许与同场景、同叙事功能的相邻段合并；不得为了凑长度跨场景、跨视角或跨叙事模式拼接。</li><li>章节是物理硬边界。跨章连续场景通过 <code>continues_scene_id</code>、前后节点和事件关系连接，不创建跨两个不可变文件的物理块。</li></ul><p>字符目标值只控制异常长短，不推翻语义边界。实现时同时记录中文字符、Unicode码点、UTF-8字节和实际模型Token，不能用固定“字符=Token”换算。</p><h3>6.4 默认不复制重叠</h3><ul><li>检索子块默认原文零复制重叠，使用 <code>prev_chunk_id/next_chunk_id</code>、父块和事件/实体边补足边界上下文。</li><li>命中位于子块首尾、查询涉及因果/对白承接或重排置信不足时，允许按预算扩展一个同场景邻块，并记录 <code>expansion_reason</code>。</li><li>80—120字符的同场景重叠保留为基准实验策略。只有独立金标证明它提高边界证据完整率，且重复注入、磁盘、延迟和创作锚定均不过门槛时，才可成为新版本默认。</li><li>父块包含子块属于结构包含，不算重复索引；组包时不能同时无差别注入父块和其全部子块。</li></ul><h3>6.5 设定、规划、事实与派生资料</h3><div class="table-scroll"><table><thead><tr><th>资料类型</th><th>父级/子级</th><th>初始子块目标</th><th>特殊规则</th></tr></thead><tbody><tr><td>人物/势力/地点/物品设定</td><td>实体卡→身份、能力、限制、历史、状态、关系、知情等方面</td><td>100—600字符</td><td>客观事实、人物认知、秘密、谎言和推断分开</td></tr><tr><td>世界规则</td><td>规则卡→条件、效果、限制、例外、代价</td><td>100—600字符</td><td>规则与例外建立显式关系，不合并冲突版本</td></tr><tr><td>总纲阶段/故事弧/章纲</td><td>层级节点→目标、冲突、必须结果、可选节拍、承诺、开放问题</td><td>100—500字符</td><td><code>planned/active/fulfilled/abandoned/superseded</code> 分开；章纲引用相关总纲阶段和确认故事弧；计划不冒充已发生事实</td></tr><tr><td>原子事实</td><td>结构化断言→确定性可读渲染</td><td>一条断言</td><td>不做文本重叠；嵌入只用于发现，裁决回到事实与证据</td></tr><tr><td>Wiki</td><td>实体页→一个主题段</td><td>150—500字符</td><td>每条结论回链事实或原文；整页不作为一个向量块</td></tr><tr><td>人物声音/表达证据</td><td>人物/叙述者→已确认短片段</td><td>150—400字符</td><td>独立受限索引；主笔默认最多2—4条，标注可不用、不可仿写原句</td></tr><tr><td>场景/章节/弧/卷摘要</td><td>层级连续性节点</td><td>按字段和来源范围</td><td>锚定事实与原文增量生成；不能无来源地递归总结摘要</td></tr><tr><td>作者想法/方案候选/草稿</td><td>业务对象与任务→问题组/暂存场景</td><td>按对象与任务边界</td><td>仅对象或任务临时索引，不进正式索引，不跨任务默认召回</td></tr><tr><td>研究/拆书资料</td><td>研究任务/来源→主张/短摘录/结构卡</td><td>按证据边界</td><td>与创作索引物理和权限隔离；版权原文不得进入主笔包</td></tr></tbody></table></div><p>结构化表格、属性面板、诗歌、书信、日志和聊天体正文保留 <code>block_type</code>。表格/属性面板优先解析为结构化字段并保留整块原文证据；诗歌、书信和日志优先保持作品内部结构，不强行与普通叙事段落合并。</p><h3>6.6 块元数据合同</h3><p>每个块至少携带：</p><ul><li>隔离：<code>owner_id</code>、<code>book_id</code>、权限域；</li><li>来源：类型、ID、不可变版本、原文哈希、字节范围、段落范围；</li><li>结构：章、场景、节拍、父块、前后块、顺序、块类型；</li><li>粒度：<code>leaf/parent/summary</code> 检索层级、是否参与FTS/向量、是否允许直接注入；</li><li>叙事：故事时间范围、叙事时间、视角人物、说话人、地点、叙事模式；</li><li>语义：实体/事件绑定及抽取状态；自动抽取保持候选，不能因绑定就成为事实；</li><li>权威：临时/候选/正史/派生、事实状态、正史版本、有效/失效/已替代状态；</li><li>投影：切片策略版本、规范化策略版本、嵌入文本策略版本、嵌入模型快照、索引水位；</li><li>质量：边界置信、是否允许默认注入、异常长块原因和校验状态。</li></ul><p>叙事模式至少区分当前客观叙事、人物认知、对白主张、回忆、梦境、预言、计划、假设/反事实、文中作品和不可靠叙述。无法可靠判断时保存未知，不用模型猜测填满。</p><h3>6.7 嵌入文本与原文证据分离</h3><ul><li>向量输入使用 <code>embedding_text = 最小上下文头＋index_text</code>。上下文头可以包含资料类型、章/场景名称、视角、说话人和少量稳定实体名，解决“他来了”“这里不安全”等脱离场景后无法区分的问题。</li><li>叶子块是精确检索主通道；场景节拍父块可以在独立 <code>parent</code> 粒度作为宽主题向量候选，但不重复建立父块FTS正文。父块命中后重排其子块或提取最小原文范围，不能把父块及全部子块一起注入。</li><li>上下文头不是正文、事实或引用证据，检索展示和最终回答必须回到原始范围。</li><li>普通标签、模型推断、长摘要、全部别名和任务提示不得拼入嵌入文本。上下文头策略变化只重嵌受影响块，并创建新 <code>embedding_text_policy_version</code>。</li><li>FTS保留精确原文通道；简繁、别名、简称和同义关系通过结构化别名/查询扩展处理，不改写原始块。</li><li>所有检索原文、研究材料和临时稿在上下文包中以有边界的“引用数据”传递；其中出现的提示词、命令、工具要求或权限声明均不得改变系统指令、岗位权限和工具调用。</li></ul><h3>6.8 构建、增量更新与原子切换</h3><pre class="code-block"><code data-language="text">读取不可变来源版本
→ 生成结构节点与叶子块
→ 校验范围、父子、顺序、哈希和覆盖
→ 构建FTS/向量/关系/Wiki新快照
→ 运行快照探针
→ 在SQLite事务中原子切换当前清单和水位
→ 旧快照标记stale/superseded并保留回滚宽限</code></pre><ul><li>正文、设定或规划产生新正式版本时，只重切受影响来源和依赖投影，不因新增一章全书重切。</li><li>构建中断、哈希变化、范围缺口、模型混用或探针失败时，新快照保持 <code>failed/building</code>，上一有效快照继续可用；若上一快照已不符合所需正史版本，则明确降级或阻断。</li><li>普通实体标签或别名变化只更新结构化过滤与查询扩展；只有切片范围、规范化、嵌入文本或模型空间变化才重建相应块/向量。</li><li>重切片不修改原始文件、事实或正史。回滚只切回上一已验证清单指针，不恢复旧正史。</li></ul><h3>6.9 查询时的有界扩展</h3><ol><li>先按书籍、正史版本、故事时间、权限和状态硬过滤。</li><li>查询路由先判断精确事实、局部场景、宽主题、历史因果或人物声音，再选择 <code>leaf/parent/summary</code> 粒度；结构化、FTS、向量、关系/Wiki并行召回相应候选。</li><li>按来源范围、派生关系和同一事实去除单次结果重复；不同叙事位置的相同原文仍保留。</li><li>事实查询返回原子事实＋最小证据句/子块；局部场景查询从叶子扩场景节拍父块或一个邻块；宽主题查询可以先命中父块/阶段摘要再下钻叶子证据；多跳问题沿实体/事件/规则边扩展；人物声音查询进入受限声音索引。</li><li>每次扩展记录命中块、父/邻块、扩展原因、候选量、采用量和Token。没有明确作用的父块不得进入上下文。</li><li>主笔只获得约束胶囊和少量灵感调色板；编剧、设定师、审校的扩展维度和预算在岗位检索合同中另行配置，不能靠切片器给所有岗位同一资料。</li></ol><h3>6.10 作者可见与可解释性</h3><p>作者在资料库看到原始资料、实体、事实、来源片段、版本、故事时间和派生状态，不需要看到向量数组。检索预览可以展示“命中了哪个来源片段、为什么扩展父/邻块、最终给了哪个岗位多少资料、哪些资料被排除”。默认界面不要求作者管理技术块；高级诊断页可按来源查看块边界和重建状态。</p><h2>7. 创造性与输出质量保护</h2><p>切片策略会改变模型看到什么，因此不声称对创造性零影响。硬事实和来源准确是门禁；历史相似场景、人物声音、意象、情绪和风格证据属于限量软资料。</p><ul><li>主笔自由创作区必须明确存在，切片器不能把父块、邻块和命中资料自动变成逐项执行清单。</li><li>与固定切片、整章上下文、只有硬事实和当前基线建立对照；使用相同模型族、相近预算、多次采样、匿名随机的成对盲评。</li><li>上述比较执行创造性与输出质量非劣效合同；事实、检索或一致性改善不能抵消任何核心创作维度的有意义下降。</li><li>分别评价原创性、合理惊喜、人物声音、情绪力度、语言画面、节奏、旧文模仿、检索锚定和整体质量；不能用事实正确率提高抵消任一核心创作维度退化。</li><li>如果最小块导致创作碎片化，先调整查询扩父/邻块策略；如果父块导致模仿旧文，减少软原文并保留硬事实。不得用全书资料包作为永久兜底。</li><li>召回到的风格和相似场景允许不用；人物声音证据最多2—4条且不得要求复写句式。</li><li>样本不足或评审分歧大时结论为不确定，保持旧策略或实验态，不升级为默认。</li></ul><h2>8. 测试与证据等级</h2><h3>E0：规格</h3><p>本文、DEC-017、数据字段、默认参数、基线、停止和回滚规则完整且无冲突。</p><h3>E1：机制存在</h3><p>存在版本化切片器、块/快照Schema、Repository、投影任务、原子清单指针、FTS/向量构建、来源回链和诊断接口。</p><h3>E2：构造与故障测试</h3><ul><li>每个叶子块能按字节范围和哈希精确恢复原文；父子包含、顺序和邻接正确。</li><li>除显式分类的空白/分隔符外，叶子范围覆盖完整来源且不存在非预期交叉；重复构建结果确定。</li><li>对话、动作—反应、超长段落、诗歌、书信、属性面板、跨章场景、梦境、回忆、谎言和反事实通过边界夹具。</li><li>两书、正式/临时、当前/旧正史零串线；构建中断、重复执行、旧模型、错水位、目录损坏、原子切换和回滚通过。</li></ul><h3>E3：独立金标与满规模</h3><ul><li>在500万字符、1500章语料上分层抽样，查询和边界金标与切片器规则、固定同义词和实现代码独立。</li><li>至少比较固定500＋100重叠、纯段落/语义切片、本文父子块＋零盲目重叠三组；80—120同场景重叠作为消融变量。</li><li>题材覆盖对话密集、战斗、悬疑、群像、多视角、说明密集、非线性时间和文中作品。</li><li>分别报告Recall@K、Precision@K、MRR、nDCG、边界证据完整率、错误实体/时间率、无答案准确率、重复注入率、上下文Token、P50/P95延迟、构建时间、重建范围、磁盘和内存。</li><li>硬状态正确率100%、跨书污染0、来源回链100%；其余阈值在看结果前由独立评测方案按题材和样本冻结，不能看完结果后降低门槛。</li></ul><h3>E4：真实创作影响</h3><p>用真实岗位模型比较最小父子块上下文、固定切片、整章/全量包和只有硬事实基线。先做跨人物/场景/题材多样本盲评，再进入20/50/100—200章纵向评测；只有实际覆盖1000章以上和目标字数范围，才能声明相应规模的长期效果。</p><p>E3检索提升不能替代E4文学质量证据。任何核心创造性维度低于预设非劣效门槛，默认策略不通过。</p><h2>9. 剩余风险与未知项</h2><ul><li>中文小说不同题材、排版和平均段落长度差异较大，350—700、1200—3000和4500只能作为初始默认值；最终锁定需要独立基准。</li><li>自动场景边界、说话人、视角和叙事模式识别可能误判含蓄转换或不可靠叙述；低置信必须允许未知和原文回查。</li><li>最小上下文头可能提高实体区分，也可能产生名称锚定；需要与无头文本做消融。</li><li>零复制重叠减少重复，但可能降低边界改写召回；邻块扩展与小重叠必须通过同一金标比较。</li><li>本地嵌入模型、量化、维度和分词对中文长文本的最佳组合仍取决于目标电脑实测。</li><li>E0完整设计不能证明切片器可运行、检索更准或正文更好；这些结论分别需要E1—E4。</li></ul><h2>10. 停止、回滚和升级条件</h2><ul><li>来源范围无法精确回链、叶子覆盖存在缺口、块跨书/跨权限、当前与旧正史混用时，停止构建和正式检索。</li><li>新快照未完成探针或原子切换时不得上线；失败后保留上一有效快照，若其版本过旧则降级结构化＋FTS或阻断相关正式任务。</li><li>独立金标中边界完整、无答案、时间/实体正确性未优于最佳简单基线，保持简单基线，不因设计复杂而强行启用。</li><li>创造性、人物声音、情绪力度或整体阅读质量低于预设非劣效门槛时，回滚切片策略、上下文头、父/邻块扩展或软资料数量；不回滚正史、安全、版权和隔离门禁。</li><li>只有目标电脑实测证明版本化父子切片在容量、延迟或恢复上不能达到门槛，才提交引入其他索引服务或重大架构改变；不能因为框架流行而升级。</li></ul><h2>11. 当前施工边界</h2><p>切片Schema由0012新增，迁移只建结构；重切片和嵌入由Worker后台执行。已有书籍先创建非活动快照，完成叶子覆盖、UTF-8范围、父子/邻接、来源哈希、跨书零命中和冻结检索探针后，才按书原子切换。构建失败或中断时继续使用上一活动快照，不能暴露半套块或在迁移事务里同步重切全书。</p><h2>12. 分层设计资料的切片边界</h2><p>四项核心设定和当前任务正式对象通过结构化直达进入ContextPack，不依赖向量切片拼回全文。可选设定仍生成可回查切片，但命中后必须按正式对象和版本取回完整有效字段，不能把一个相似片段当成整项设定。</p><p>卷路线、故事脊柱、第一卷开篇计划、事件链、事件大纲和章纲分别保持对象边界及依赖版本；切片不得跨对象拼接计划与实际，也不得跨卷、跨事件或跨书形成伪因果。</p><p>字符切片只服务检索证据。硬事实、当前任务和不可变原文是否完整由ContextCompiler的直接源门禁保证；任何模型输入上限不足都要在编译阶段明确阻断，不能依赖模型或字符串函数静默截断。</p></template><template id="document-14" data-title="当前功能覆盖矩阵" data-path="docs/COVERAGE_MATRIX.md" data-meta="当前正式文档 · 2.1 KB · 7d818f69248d"><h1>当前功能覆盖矩阵</h1><div class="table-scroll"><table><thead><tr><th>能力</th><th>权威规格</th><th>主要实现</th><th>主要测试</th></tr></thead><tbody><tr><td>开书与定位</td><td>PRODUCT、WORKFLOW V2</td><td>books/onboarding/positioning</td 真实模型长篇文学质量：仍按E3/E4持续积累，不由工程覆盖矩阵代替。</li></ul></template><template id="document-15" data-title="创作工作流 V2 完整设计" data-path="docs/CREATION_WORKFLOW_V2_DESIGN.md" data-meta="当前正式文档 · 15.4 KB · c35add707a82"><h1>创作工作流 V2 完整设计</h1><blockquote>分层创作的当前功能合同和状态见 <code>LAYERED_CREATION_IMPLEMENTATION_AND_ACCEPTANCE.md</code>；本文件描述目标工作流。历史逐项验收只用于专项追溯。</blockquote><h2>1. 核心对象链</h2><pre class="code-block"><code data-language="text">开书资料
