</style></head><body><header><div class="brand"><img id="logo" alt="文秘写作">文秘写作</div><span class="book" id="book-name"></span><span class="pill">时光机</span></header><main class="shell"><div class="demo"><b>界面原型 · 剧情候选与正文状态均为演示，未写入书籍</b><span>电脑 / 手机均可操作</span></div><nav class="nav" aria-label="原型页面"><button data-view="start">故事线推荐</button><button data-view="result">全书方案</button><button data-view="tree">时光树</button><button data-view="history">正文轨迹</button></nav><div id="content"></div><p id="status" role="status"></p></main><dialog id="detail"><div class="row"><h2 id="dialog-title"></h2><button id="close">关闭</button></div><div id="dialog-body"></div></dialog><script>/*PRIVATE_DATA*/</script><script>
const D=window.DEMO;if(!D)throw Error('请打开生成后的私有原型');const $=s=>document.querySelector(s);$('#logo').src=D.logo;$('#book-name').textContent=D.book;
let view='start',route=0,selected='012',zoom=1,dx=0,dy=0,query='',filter='all';let prefs={structure:'auto',ensemble:true,threads:['growth','partner','business','history'],custom:''};try{prefs={...prefs,...JSON.parse(localStorage.getItem('wenmi-r192-prototype')||'{}')}}catch{}
const E=(t,s,c)=>{const x=document.createElement(t);if(s!==undefined)x.textContent=s;if(c)x.className=c;return x};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dialog(title,html){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=html;$('#detail').showModal()}$('#close').onclick=()=>$('#detail').close();
function go(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===v)));$('#status').textContent='';({start:renderStart,result:renderResult,tree:renderTree,history:renderHistory}[view])();window.scrollTo(0,0)}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));
function renderStart(){const types=[['auto','由主编推荐','根据本书人物和想写的故事安排。'],['single','集中讲一个核心故事','围绕一个主要追求，其他故事推动它。'],['multiple','几个重要故事交织','多个目标相互影响，共同走向结局。']];$('#content').innerHTML=`<div class="welcome"><img src="${D.avatar}" alt="主编貂蝉"><div><div class="eyebrow">貂蝉 · 主编</div><p>老板，我们来设计全书骨架。<br>这是我推荐的故事线，您看看，还想加入哪些？</p></div></div><section class="section"><h3>你希望故事怎样展开？</h3><div class="choices" style="margin-top:14px">${types.map(t=>`<label class="choice"><input type="radio" name="structure" value="${t[0]}" ${prefs.structure===t[0]?'checked':''}><span><b>${t[1]}</b><small>${t[2]}</small></span></label>`).join('')}</div><label class="choice" style="margin-top:12px"><input type="checkbox" id="ensemble" ${prefs.ensemble?'checked':''}><span><b>也希望配角拥有自己的完整故事</b><small>让重要人物有自己的追求，他们的选择会影响全书。</small></span></label></section><section class="section"><div class="row"><h2>为本书推荐</h2><button id="add">＋ 添加其他故事线</button></div><div class="threads" style="margin-top:16px">${D.threads.map(t=>`<label class="choice"><input type="checkbox" data-thread="${t.id}" ${prefs.threads.includes(t.id)?'checked':''}><span><b>${esc(t.title)}</b><small>${esc(t.text)}</small></span></label>`).join('')}</div></section><h3>还有想加入的故事吗？</h3><textarea id="custom" placeholder="比如：给机甲安排一个傲娇的性格……">${esc(prefs.custom)}</textarea><div class="footer"><small id="chosen">已选 ${prefs.threads.length} 条故事线</small><button id="begin" class="primary">开始设计</button></div>`;
 document.querySelectorAll('[name=structure]').forEach(n=>n.onchange=()=>prefs.structure=n.value);$('#ensemble').onchange=e=>prefs.ensemble=e.target.checked;document.querySelectorAll('[data-thread]').forEach(n=>n.onchange=()=>{prefs.threads=n.checked?[...new Set([...prefs.threads,n.dataset.thread])]:prefs.threads.filter(x=>x!==n.dataset.thread);$('#chosen').textContent=`已选 ${prefs.threads.length} 条故事线`});$('#custom').oninput=e=>prefs.custom=e.target.value;
 $('#add').onclick=()=>{dialog('添加你想写的故事',`<p>点击加入，再由主编结合本书安排。</p>${[['romance','感情线','与拥有独立追求的伴侣，在合作与分歧中发展感情。'],['family','亲情线','从独自扛事，到重新拥有值得牵挂的家人。'],['rival','宿敌线','一个看不起机关的天才，逐渐成为最懂他的对手。']].map(t=>`<button data-extra="${t[0]}" style="display:block;width:100%;text-align:left;margin:10px 0"><b>${t[1]}</b><small style="display:block">${t[2]}</small></button>`).join('')}`);document.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>{prefs.threads=[...new Set([...prefs.threads,b.dataset.extra])];$('#detail').close();$('#chosen').textContent=`已选 ${prefs.threads.length} 条故事线`;$('#status').textContent='已加入选择。真实流程将生成本书专属介绍；当前为交互演示。'})};
 $('#begin').onclick=()=>{try{localStorage.setItem('wenmi-r192-prototype',JSON.stringify(prefs))}catch{}go('result');$('#status').textContent='已保存本机选择。下面为预先准备的三套候选样例，不是根据刚才选择实时生成。'};
}
function renderResult(){const r=D.routes[route];$('#content').innerHTML=`<div class="row"><div><h1>这本书，你想这样写吗？</h1><p class="sub">${esc(D.book)}</p></div><button id="edit">调整故事线</button></div><div class="scheme-tabs">${D.routes.map((x,i)=>`<button data-route="${i}" aria-pressed="${i===route}"><small>方案 ${'一二三'[i]}</small>${esc(x.short)}</button>`).join('')}</div><section class="panel overview"><div><span class="pill">${esc(r.counts)}</span><h1>${esc(r.title)}</h1><p>${esc(r.pitch)}</p></div><aside><div class="eyebrow">整体味道</div><p>${esc(r.flavor)}</p><div class="eyebrow">最终走向</div><p>${esc(r.ending)}</p></aside></section><section class="section"><h2>开篇，就让读者想看下去</h2><div class="three" style="margin-top:16px">${r.opening.map((x,i)=>`<article class="mini"><span class="eyebrow">${['开头约300字','第一章','前三章'][i]}</span><b>${esc(x[0])}</b><p>${esc(x[1])}</p></article>`).join('')}</div></section><section class="section"><h2>从开篇惦记到结尾</h2><div class="panel" style="margin-top:16px"><div class="expectation head"><span>开篇的期待</span><span>想看到的变化</span><span>结尾的回应</span></div>${r.hooks.map(h=>`<div class="expectation"><p><b>${esc(h[0])}</b></p><p>${esc(h[1])}</p><p>${esc(h[2])}</p></div>`).join('')}</div></section><section class="section"><h2>故事线怎样交织</h2><div class="story-lines" style="margin-top:16px">${r.lines.map(l=>`<article class="mini"><span class="pill">${esc(l[0])}</span><b>${esc(l[1])}</b><p>${esc(l[2])}</p></article>`).join('')}</div></section><section class="section"><div class="row"><h2>分卷规划</h2><span class="sub">${r.volumes.length} 卷候选 · 约200万字目标</span></div><div class="panel" style="margin-top:16px">${r.volumes.map((v,i)=>`<details class="vol"><summary><span>${String(i+1).padStart(2,'0')}</span><div><b>${esc(v.title)}</b><p>${esc(v.story)}</p></div></summary><div class="more"><p>获得与失去：${esc(v.change)}</p><p>${i===r.volumes.length-1?'全书收束':'推动后续'}：${esc(v.next)}</p></div></details>`).join('')}</div></section><div class="footer"><small>先确定方向，具体情节留给卷与链展开。</small><button id="adopt" class="primary">采用这套方案</button></div>`;document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{route=Number(b.dataset.route);renderResult()});$('#edit').onclick=()=>go('start');$('#adopt').onclick=()=>dialog('采用结果预览',`<p>你选择了「${esc(r.short)}」。</p><p>正式功能会保存规划版本，并把本卷目标与相关故事线提供给后续设计。</p><p class="sub">原型未写入书籍，也没有启动任务。</p>`)}
/*TREE_UI*/
function renderHistory(){$('#content').innerHTML=`<div class="row"><div><h1>故事走过的路。</h1><p class="sub">来自正式正文的变化记录 · 以下为界面演示</p></div><span class="pill">按章查看</span></div><section class="panel section"><div class="row"><b>正文已保存至第 18 章</b><span class="sub">记录已核对至第 17 章</span></div><div class="progress"><div></div></div><p class="sub">第18章正在整理，已保存的正文不受影响。</p></section><div class="timeline">${D.events.map(e=>`<article class="event"><small>第 ${e.chapter} 章</small><section class="panel"><div class="row"><h3>${esc(e.title)}</h3><span class="pill">${esc(e.state)}</span></div><p>${esc(e.text)}</p><button data-event="${e.line}">定位支线 ${e.line}</button></section></article>`).join('')}</div>`;document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{selected=b.dataset.event;treeMode='actual';volumeFocus=0;query='';filter='all';mainFocus='all';go('tree');showLine(selected,innerWidth<=700)})}
go(new URLSearchParams(location.search).get('view')||'start');
</script></body></html>
